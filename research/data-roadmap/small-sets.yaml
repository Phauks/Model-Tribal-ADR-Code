# The first small sets on the data roadmap (docs/data-roadmap.md): federal reports, land, and international documents.
# scripts/law/small_sets.py reads this file. To add a document, add an entry and run the script's three steps again;
# entries already filed or written are skipped. Fields:
#   key: the source record's key. existing: true when the record is already in content/sources (the script then only adds the stored copy).
#   set: reports | land | international (the roadmap section).    kind: the source record kind (schemas/source.schema.json).
#   title, author (an office as text; a person as {family, given}), number, publisher, place, issued [year, month, day]: the citation. container: a series the work appears in.
#   link: the page a reader is sent to. download: the file the script stores (blank = link only, nothing stored).
#   topic: the bucket folder. name: the file name in the bucket (default <key> plus the download's extension).
#   rights: government (a U.S. government work, served), public-domain (term expired, served), or link-only (a private copy at most).
#   indigo: the Indigo Book citation.    about: one sentence on what the document is.    copy_note: where the stored copy comes from.

