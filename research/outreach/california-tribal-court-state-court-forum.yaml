relevance:
  text: The Tribal Court–State Court Forum is a Judicial Council of California advisory committee, established
    in 2010 and made a formal advisory committee under California Rules of Court, rule 10.60, in 2013.
    It recommends ways to improve the administration of justice where state and tribal court jurisdiction
    overlaps, including recognition and enforcement of court orders that cross jurisdictional lines. Its
    members include tribal chief judges and state judges, and the Judicial Council also maintains a California
    tribal courts directory.
