relevance:
  text: Established in 1967, the American Indian Law Center describes itself as the oldest existing Indian-managed
    and Indian-operated legal and public policy organization in the country. It assists tribal governments
    and tribal courts on judicial systems and continues ongoing work on tribal code development, including
    children's, elder protection and research codes. It also administers the Southwest Intertribal Court
    of Appeals and the Pre-Law Summer Institute.
