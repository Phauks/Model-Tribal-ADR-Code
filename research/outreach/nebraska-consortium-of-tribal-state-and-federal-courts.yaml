relevance:
  text: The Nebraska Consortium of Tribal, State, and Federal Courts grew out of a 2018 roundtable hosted
    by the Chief Justice with Nebraska-based tribes, the state and the federal government. It is a space
    for tribal and state courts to work through specific problems and ran a public engagement pilot project
    with Native communities. It sits within the Nebraska Judicial Branch's Access to Justice Commission,
    alongside its mediation and restorative justice office.
