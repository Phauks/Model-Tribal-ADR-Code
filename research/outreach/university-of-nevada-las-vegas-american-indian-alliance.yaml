relevance:
  text: The American Indian Alliance is made up of Native faculty, staff and team members across UNLV
    and works to increase recruitment, retention and success of Native people at UNLV, including support
    for Native American studies and Tribal community partnerships. Its community resources page lists
    Nevada Native organizations such as the Nevada Department of Native American Affairs, the Inter-Tribal
    Council of Nevada, the Las Vegas Indian Center and IndigenousAF.
