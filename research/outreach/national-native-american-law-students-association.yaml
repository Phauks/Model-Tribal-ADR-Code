relevance:
  text: The National Native American Law Students Association (NNALSA), founded in 1970, supports Native
    American law students and promotes federal Indian law, tribal law, and traditional forms of governance
    in law schools. It partners with law schools to run an annual National NALSA Moot Court Competition.
