relevance:
  text: The Nevada Department of Native American Affairs (DNAA) is the state agency, created in 1965 as
    the Nevada Indian Commission, that acts as liaison between the State and Nevada's federally recognized
    Tribes and serves as a forum where Indian needs and issues are considered. It publishes a tribal directory
    and runs the Stewart Indian School Cultural Center & Museum.
