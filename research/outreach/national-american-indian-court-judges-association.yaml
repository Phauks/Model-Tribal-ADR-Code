relevance:
  text: Established in 1969, the National American Indian Court Judges Association (NAICJA) describes
    itself as the only membership association of tribal court judges and tribal court personnel in the
    nation. It provides training and technical assistance to tribal justice systems, including Bureau
    of Justice Assistance-funded programs, and lists Regional Peacemaking Training offered with the Native
    American Rights Fund and Columbia Law School. Its homepage lists a 2026 Census of Tribal Court Systems
    and a 2026 conference.
