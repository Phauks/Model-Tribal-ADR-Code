relevance:
  text: The Alternative Dispute Resolution (ADR) Section works to increase members' knowledge of ADR,
    study better methods for resolving disputes, publish ADR materials, run public and professional ADR
    education, and recommend changes in how ADR is administered. It publishes a 'Status of ADR in Nevada'
    summary and private-sector mediation guidelines, and is open to law students.
