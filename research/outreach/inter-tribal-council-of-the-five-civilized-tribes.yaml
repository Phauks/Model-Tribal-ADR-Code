relevance:
  text: The Inter-Tribal Council of the Five Civilized Tribes brings together the Cherokee, Chickasaw,
    Choctaw, Muscogee and Seminole nations. It holds quarterly meetings, adopts resolutions and writes
    to government officials on issues affecting the five tribes, and has announced intertribal agreements
    such as hunting and fishing license reciprocity. It is a route to the leadership of five large Oklahoma
    nations.
