relevance:
  text: The Diné Policy Institute is a research institute of Diné College that works to mesh Western research
    practices with traditional Navajo values and Natural, Traditional, Customary and Common laws (as in
    Navajo Nation Council resolution CN-69-02) to advise Navajo Nation lawmakers. It researches Navajo
    politics and governmental reform, among other topics. Its work on Diné Fundamental Law in policy is
    directly relevant to commentary on Navajo peacemaking (project analysis).
