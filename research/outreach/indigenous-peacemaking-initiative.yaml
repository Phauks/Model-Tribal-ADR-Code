relevance:
  text: Founded in 1992, the Indigenous Peacemaking Initiative helps Native American tribes and communities
    implement and recover traditional Indigenous dispute resolution practices, often called peacemaking.
    It offers technical assistance for developing or revising peacemaking programs, training, advocacy,
    and a 'Tribal Models' collection of laws and written materials that tribes have shared. Its advisory
    committee offers presentations, curricula, training and technical assistance, and it invites tribes
    to share peacemaking laws, policies or practices.
