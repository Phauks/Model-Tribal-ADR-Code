relevance:
  text: The Northern California Intertribal Court System serves member tribes by providing a forum for
    hearing and resolving community disputes, supporting community justice and using culturally appropriate
    services. It describes itself as the embodiment of its members' inherent sovereignty and the power
    of shared resources. Its focus on community dispute resolution through a shared court is relevant
    to the model alternative dispute resolution code (project analysis).
