relevance:
  text: Boyd's Indian law program prepares Native and non-Native students in Indian and tribal law, runs
    an online executive education certificate (Federal Indian Law 101, Tribal Law and Governance 101,
    Indian Gaming Regulatory Act (IGRA) 101) open to non-lawyers, and its faculty teach Federal Indian
    Law and Tribal Law & Governance. In April 2026 it partnered with the National Judicial College's National
    Tribal Judicial Center to create a National Tribal Judicial Academy for new and prospective tribal
    judges, first scheduled for January 11-13, 2027 at Boyd. Program students help tribal governments
    with legal institution-building.
