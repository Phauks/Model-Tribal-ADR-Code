relevance:
  text: The Indigenous Journalists Association (IJA), founded in 1983 as the Native American Press Association
    and later known as the Native American Journalists Association, works to support accurate, context-rich
    reporting on Indigenous people and to counter bias and stereotypes in media. It publishes reporting
    guides, including an Indigenous Identity Reporting Guide, a Tribal Nations Media Guide, and an Indian
    Child Welfare Act (ICWA) reporting guide, and links an Associated Press style insert, which the project
    can use for terminology and style (project analysis).
