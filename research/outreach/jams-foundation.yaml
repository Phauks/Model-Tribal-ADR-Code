relevance:
  text: The JAMS Foundation calls itself the world's largest private funder of conflict prevention and
    dispute resolution initiatives and is funded by JAMS neutrals and staff. Its programs include major
    dispute resolution initiatives, community mediation mini-grants with the National Association for
    Community Mediation, the JAMS Foundation/Association for Conflict Resolution Initiative for Students
    and Youth, and the Weinstein JAMS International Fellowship.
