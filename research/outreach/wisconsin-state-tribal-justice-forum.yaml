relevance:
  text: Wisconsin's State-Tribal Justice Forum began meeting in 2006 with a charge to promote communication,
    education and cooperation among tribal and state court systems. Its recent work centers on concurrent
    jurisdiction and transfer of jurisdiction, including discretionary transfer of civil cases from state
    court to tribal court. It meets quarterly with five circuit judges and five tribal judges and is co-chaired
    by a Ho-Chunk Nation judge.
