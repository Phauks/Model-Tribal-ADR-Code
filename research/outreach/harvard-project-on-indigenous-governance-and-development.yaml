relevance:
  text: The Project, based at Harvard Kennedy School's Ash Center for Democratic Governance and Innovation,
    works to understand and foster conditions for sustained, self-determined social and economic development
    among American Indian nations. Its flagship Honoring Nations program gives national awards for excellence
    in tribal self-governance, and it produces research, policy briefs and working papers.
