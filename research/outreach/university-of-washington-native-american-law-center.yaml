relevance:
  text: The Native American Law Center, established in 1998, supports Indian law development and serves
    tribes in the Pacific Northwest, Alaska and nationally. It runs the Tribal Court Public Defense Clinic,
    which defends tribal members in tribal courts, and a Tribal Code Drafting Workshop, and hosts an annual
    Indian Law Symposium.
