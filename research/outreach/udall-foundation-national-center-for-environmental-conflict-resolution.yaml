relevance:
  text: The National Center uses collaboration and conflict resolution to help Native Nations, federal
    agencies and partners resolve environmental and natural resource issues, and can act as a third-party
    neutral. Its Native American and Alaska Native area of expertise covers government-to-government consultation,
    sacred-site consultation under the National Historic Preservation Act, and bringing Indigenous knowledge
    into decisions.
