location:
  state: CA
scope: regional
relevance:
  text: Federally recognized Native nation whose government office is in California and whose lands extend
    into Nevada. The Tribal Law and Policy Institute lists its court as the Fort Mojave Tribal Court.
    The National Indian Law Library keeps a tribal law page for the nation.
