relevance:
  text: Federally recognized Native nation whose government office the Bureau of Indian Affairs lists
    in Nevada. The Tribal Law and Policy Institute lists its court as the Te-Moak Judicial Court. The
    Bureau of Indian Affairs lists the Western Region Court of Indian Offenses as serving the nation.
    The National Indian Law Library keeps a tribal law page for the nation.
