relevance:
  text: 'Federally recognized Native nation whose government office the Bureau of Indian Affairs lists
    in Oklahoma. Dispute resolution forums named in its law or court materials include: Peacemakers of
    the District Court (Choctaw Nation Peacemaking Act). Training recorded: Advanced peacemaker training
    for community members, tribal officials and staff (September 19-20, 2017, Durant).'
