relevance:
  text: Student attorneys in the Southwest Indian Law Clinic represent Native clients in state, federal
    and tribal courts and work with tribes and pueblos. The clinic has used a Circles of Peace process,
    combining Native traditions with restorative justice, in family conferences and in tribal court matters
    such as domestic violence, child custody and probate, and records outcomes in signed family agreements.
