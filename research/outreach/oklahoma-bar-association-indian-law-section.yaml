relevance:
  text: The Oklahoma Bar Association lists an Indian Law Section with elected officers among its practice
    sections. The section has presented Indian law continuing legal education programs, including a 2025
    Indian Law Section program. Oklahoma has many tribal courts and tribal bars, so the section reaches
    practitioners who appear in them.
