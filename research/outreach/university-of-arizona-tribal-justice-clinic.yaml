relevance:
  text: Students in the Tribal Justice Clinic serve as tribal judicial clerks, work with tribal prosecutors
    and defenders, and draft legislation and tribal codes. One clinic project produced a model code of
    ethics for attorneys and advocates in an Arizona tribal court, a close analogue to a model alternative
    dispute resolution code (project analysis).
