relevance:
  text: The United States Indigenous Data Sovereignty Network (USIDSN) provides research and policy advocacy
    on Indigenous data sovereignty for US-based Native nations and peoples, following peer networks in
    New Zealand, Canada and Australia. It held a US Indigenous Data Sovereignty and Governance Summit
    on April 14-17, 2026.
