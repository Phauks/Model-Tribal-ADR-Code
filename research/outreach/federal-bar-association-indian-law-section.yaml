relevance:
  text: The Indian Law Section is a resource for attorneys who practice or study Indian law and works
    to protect tribal sovereignty through advocacy in tribal, state and federal courts. It holds an annual
    Indian Law Conference each April in the Southwest (informally 'Fed Bar'), which reached its 50th year
    in 2025, and a virtual fall forum.
