relevance:
  text: The Office of Tribal Justice was formed in 1995 at the request of tribal leaders and made permanent
    by the Tribal Law and Order Act in 2010. It advises the Attorney General on the federal-tribal relationship,
    serves as the Department of Justice's point of contact for tribal governments on public safety and
    justice in Indian country, and coordinates tribal consultation across DOJ components. It reports directly
    to the Deputy Attorney General.
