relevance:
  text: 'Federally recognized Native nation whose government office the Bureau of Indian Affairs lists
    in Washington. Dispute resolution forums named in its law or court materials include: Mediation Services
    (Tulalip Tribal Court); Tribal Court Elders Panel; Community Accountability Board (Juvenile Diversion
    Panel).'
