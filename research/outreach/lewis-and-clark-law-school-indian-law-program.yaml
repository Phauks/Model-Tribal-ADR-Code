relevance:
  text: Lewis & Clark Law School has hosted several national peacemaking colloquiums; in 2020 it co-hosted
    an International Peacemaking Colloquium with the National American Indian Court Judges Association
    that drew over 300 participants. The colloquium described peacemaking as an Indigenous circle process
    based on tribal values and customary law.
