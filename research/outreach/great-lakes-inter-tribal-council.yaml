relevance:
  text: The Great Lakes Inter-Tribal Council is a consortium of federally recognized tribes in Wisconsin
    and Michigan's Upper Peninsula, founded in 1963 as the Wisconsin Tribal Chairman's Association. It
    supports member tribes in expanding self-determination by providing services and assistance, and advocates
    for unity of tribal governments. It is a route to the governments of its member tribes in Wisconsin
    and Michigan.
