relevance:
  text: The Southwestern Association for Indian Arts (SWAIA) produces the Santa Fe Indian Market, which
    it calls the world's largest Native American art market; the market marked its 104th year in August
    2026. It runs a juried artist application process (a 2026 call was posted through EntryThingy) and
    publishes artist resources, so it has long experience running fair, juried Native art selection (project
    analysis).
