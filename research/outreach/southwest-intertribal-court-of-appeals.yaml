relevance:
  text: The Southwest Intertribal Court of Appeals is an appellate forum for the review of tribal court
    decisions that has served tribes and pueblos in New Mexico, Colorado, Arizona and Texas since 1989.
    A tribe or pueblo can choose by resolution whether the court (SWITCA) acts as a court of last resort,
    an advisory-opinion court, or an intermediate court, and SWITCA also provides training, technical
    assistance and legal research. It publishes the SWITCA Reporter of its opinions since 1990, a source
    on how tribal appellate review treats tribal law and custom (project analysis).
