relevance:
  text: The Inter Tribal Council of Arizona provides its 21 member tribes with a united voice and the
    means for united action on matters affecting them. Its programs include emergency preparedness, human
    services and community development, and it offers training events. It is a route to Arizona tribal
    leadership rather than a justice-specific body.
