  text: The Indian Gaming Association is a Washington, DC-based association whose website covers Indian
    gaming news and legal matters. Gaming compacts and enterprise disputes are a possible application
    area for a model tribal alternative dispute resolution code (project analysis), but the association's
    own role in dispute resolution was not confirmed in this research.
