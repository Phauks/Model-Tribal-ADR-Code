relevance:
  text: The University of Nevada, Reno's Office of Indigenous Relations runs the Nevada Native Nations
    Center, a Tribal Leadership Development Program for tribal council members and leaders, and workshops
    for tribal governments, and it supports tribal consultation work. The university also offers an Indigenous
    studies minor through its Department of Gender, Race and Identity.
