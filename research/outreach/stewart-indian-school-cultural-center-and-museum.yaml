relevance:
  text: The museum tells the history of the Stewart Indian Boarding School (1890-1980) and the effects
    of forced assimilation, and it hosts the Great Basin Native Artists Gallery featuring Native artists
    from Nevada and the Great Basin. Its curator manages archival documents, photographs and artifacts
    about Stewart's history.
