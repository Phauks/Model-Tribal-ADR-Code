relevance:
  text: Founded in November 1944, the National Congress of American Indians (NCAI) serves as a forum for
    unified policy development among tribal governments. Its stated purposes include protecting and advancing
    tribal governance and treaty rights and educating the public about American Indian and Alaska Native
    tribes.
