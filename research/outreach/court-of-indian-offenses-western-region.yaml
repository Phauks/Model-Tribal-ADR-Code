name: Court of Indian Offenses - Western Region
also_known_as:
- Western Region CFR Court
- Court of Indian Offenses of the Western Region
category: court
location:
  city: Phoenix
  state: AZ
scope: regional
relevance:
  text: This Bureau of Indian Affairs court (a Court of Indian Offenses, or CFR court, under 25 C.F.R.
    part 11) serves the Te-Moak Tribe of Western Shoshone and the Yomba Shoshone Tribe in Nevada, the
    Summit Lake Paiute Tribe, and the Skull Valley Band of Goshute in Utah. These courts hear civil matters
    and misdemeanor offenses under federal regulations and can hear tribal law violations when a tribe
    grants that authority.
