relevance:
  text: The Inter-Tribal Council of Nevada (ITCN) is a 501(c)(3) consortium of Nevada's 28 Tribal Nations
    that provides services to tribal communities, including Family Violence Prevention services with legal
    assistance. A February 2024 Nevada Lawyer article by a tribal judge reports that the Inter-Tribal
    Court of Appeals for Nevada, which hears appeals for many Nevada tribes, is housed in ITCN's Reno
    offices.
