relevance:
  text: The library publishes a Federal Indian Law & Tribal Law Research guide (updated February 2026)
    that separates federal Indian law from tribal law and covers primary sources, secondary sources, and
    individual pages for 20 Nevada tribal nations plus Nevada tribal organizations. Its reference desk
    takes research questions by email and phone.
