relevance:
  text: The Northwest Intertribal Court System is a consortium-owned court system whose website lists
    24 member tribes and departments for appellate, code, judicial and prosecution work, with mediation
    and training among its services. A Honoring Nations profile describes it as helping tribes build tribal
    courts and providing code writing and technical assistance so tribes can build their legal infrastructure.
    Its code-writing and mediation work across many member tribes is directly relevant to a model tribal
    alternative dispute resolution code (project analysis).
