relevance:
  text: The Tribal Law and Policy Institute (TLPI) describes itself as dedicated to providing free publications,
    comprehensive training, and technical assistance to empower Native communities. It publishes the Tribal
    Court Clearinghouse and runs related projects including WellnessCourts.org (tribal healing to wellness
    courts and restorative justice) and the Tribal Legal Studies curriculum. It accepts technical assistance
    requests online.
