relevance:
  text: The Sovereignty Symposium, founded in 1988 and hosted by Oklahoma City University School of Law
    and Oklahoma City University, provides a scholarly setting for legal and policy issues facing tribal
    communities. It also celebrates tribal sovereignty in legal, artistic, cultural and economic forms,
    and its next meeting is June 16-17, 2027 in Oklahoma City. Its website lists Oklahoma tribal bar associations
    and runs competitions and calls for proposals.
