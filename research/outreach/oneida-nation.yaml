relevance:
  text: 'Federally recognized Native nation whose government office the Bureau of Indian Affairs lists
    in Wisconsin. Dispute resolution forums named in its law or court materials include: Peacemaking and
    Mediation Division of the Trial Court (peacemaking); Peacemaking and Mediation Division of the Trial
    Court (mediation). Training recorded: Application to serve as Peacemaker/Mediator (background check
    and interview process).'
