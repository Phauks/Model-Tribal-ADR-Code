relevance:
  text: The American Indian Higher Education Consortium was established in 1973 by the first six tribal
    colleges to serve tribal colleges and universities, and now has 37 member institutions. Membership
    is limited to tribal colleges and universities. It is a channel to tribal college faculty and students
    in law, governance and Native studies who could use or review the code and commentary (project analysis).
