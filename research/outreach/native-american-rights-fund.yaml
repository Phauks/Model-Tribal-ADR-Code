relevance:
  text: The Native American Rights Fund (NARF) is a national Native legal organization headquartered in
    Boulder, Colorado, with offices in Anchorage and Washington, DC. It runs the Indigenous Peacemaking
    Initiative, which helps tribes implement and recover traditional dispute resolution, and the National
    Indian Law Library, which provides public Indian law research help.
