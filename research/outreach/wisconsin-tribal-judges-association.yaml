relevance:
  text: The Wisconsin Tribal Judges Association is an association of tribal judges that met jointly with
    the Wisconsin Supreme Court in 2025 on areas of mutual interest, including wellness court initiatives,
    data sharing and judicial security. It is a registered 501(c)(3) professional association based in
    Wausau, Wisconsin. Its members are the tribal judges who would apply or adapt alternative dispute
    resolution provisions in Wisconsin tribal courts (project analysis).
