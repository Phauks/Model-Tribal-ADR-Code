relevance:
  text: The National Criminal Justice Training Center, part of Fox Valley Technical College, has provided
    training and technical assistance to tribal communities nationwide for nearly 30 years. Its tribal
    offerings include no-fee virtual courses such as Integrated Tribal Domestic Violence Court and tribal
    remedies for violations of protection orders, plus customized support. It is a channel for training
    tribal court staff on new codes.
