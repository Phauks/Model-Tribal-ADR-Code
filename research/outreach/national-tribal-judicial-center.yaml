relevance:
  text: The National Judicial College in Reno runs the National Tribal Judicial Center, which offers tribal
    courses and certificates and a tribal courts webinar series on topics such as tribal-state court cooperation
    and regulating attorney practice. In April 2026 the center partnered with Boyd's Indian Nations Gaming
    & Governance Program to create a National Tribal Judicial Academy for new and prospective tribal judges,
    including non-lawyers.
