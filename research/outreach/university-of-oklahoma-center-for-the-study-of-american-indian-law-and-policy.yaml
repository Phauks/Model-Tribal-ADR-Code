relevance:
  text: Founded in 1990, the Center offers speaker programs and the Native American Law Certificate, and
    the University of Oklahoma College of Law also offers a Master of Legal Studies in Indigenous Peoples
    Law for non-lawyers. The College of Law publishes the American Indian Law Review, which holds an annual
    symposium and writing competition.
