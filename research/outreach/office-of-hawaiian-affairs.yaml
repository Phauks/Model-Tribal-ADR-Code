relevance:
  text: The Office of Hawaiian Affairs (OHA) was created in 1978 through the Hawaiʻi State Constitutional
    Convention as a public trust to better the conditions of Native Hawaiians and the broader Hawaiian
    community, and in 1979 the Legislature made it a semi-autonomous self-governing body. It advocates
    for Native Hawaiian well-being and operates separately from the state executive branch.
