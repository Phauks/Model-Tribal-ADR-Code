relevance:
  text: The All Pueblo Council of Governors is the collective voice of the 20 Pueblo Nations of New Mexico
    and Texas, working on sovereignty, advocacy and cultural stewardship. Its mission is to advocate,
    foster and protect the social and traditional well-being of the Pueblo Nations. Pueblo traditional
    governance and dispute resolution are an important reference point for a model alternative dispute
    resolution code that respects customary law (project analysis).
