relevance:
  text: The Indian Law Project has given free legal help to Nevada tribes and tribal members since 1974
    and is described as the only Nevada legal aid program that specializes in tribal law. It represents
    tribal members in tribal and state courts and can act as in-house counsel for eligible tribes on matters
    including tribal code development. Its staff appear regularly in Nevada tribal courts and know their
    codes and community norms.
