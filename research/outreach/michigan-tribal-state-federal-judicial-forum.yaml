relevance:
  text: The Michigan Supreme Court created the Michigan Tribal State Federal Judicial Forum by Administrative
    Order 2014-12 to build relationships among tribal, state and federal courts in Michigan. Its members
    include the chief tribal judges of Michigan's 12 federally recognized tribes, ten state judges and
    federal representatives. The Supreme Court made new appointments to the forum in June 2026, so it
    remains active.
