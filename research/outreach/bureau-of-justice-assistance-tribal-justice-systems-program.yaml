relevance:
  text: The Bureau of Justice Assistance's Tribal Justice Systems Program funds federally recognized tribes
    and tribal consortia to develop, support and enhance adult tribal justice systems under Coordinated
    Tribal Assistance Solicitation Purpose Area 3. Listed uses include tools for tribal courts and judicial
    functions, joint jurisdiction courts with state courts, alternatives to incarceration and healing
    to wellness courts. Tribes adopting an alternative dispute resolution or peacemaking code may look
    to this program for implementation funding (project analysis).
