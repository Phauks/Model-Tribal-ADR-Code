relevance:
  text: United South and Eastern Tribes is an intertribal organization serving 33 federally recognized
    tribal nations from the Northeastern Woodlands to the Everglades and the Gulf of Mexico. It works
    to strengthen tribal governments through technical and programmatic services, and its committees cover
    areas including tribal justice. It is the main route to eastern tribes, which are otherwise thin on
    this list.
