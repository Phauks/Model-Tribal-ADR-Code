relevance:
  text: The American Indian Law Program offers doctrinal and clinical classes for tribal, federal and
    international practice, and its students work closely with tribal governments. Its American Indian
    Law Clinic, founded in 1992, represents Indigenous individuals, Native Nations and tribal entities
    in federal Indian law and tribal law matters.
