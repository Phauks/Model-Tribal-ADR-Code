relevance:
  text: The Native Hawaiian Legal Corporation (NHLC) provides legal services addressing problems facing
    Native Hawaiians, including threatened loss of ancestral lands and protection of their way of life.
    Its practice areas include Hawaiian Home Lands, water rights, burial protection, access rights, traditional
    and customary practices, and cultural intellectual property, traditional knowledge and data sovereignty.
    It reports completing its 51st year of service in 2025.
