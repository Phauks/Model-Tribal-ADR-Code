relevance:
  text: The National Center on Restorative Justice, led by Vermont Law and Graduate School with the University
    of Vermont and the University of San Diego and funded by the Bureau of Justice Assistance, works to
    improve criminal justice policy through restorative methods. It maintains a Restorative Justice Tribal
    Laws Database of restorative practices codified in tribal law, with about 940 entries including peacemaker
    processes, last updated in January 2026. The database is a direct source of comparative tribal code
    provisions for the model alternative dispute resolution code (project analysis).
