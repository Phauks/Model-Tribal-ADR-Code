scope: regional
relevance:
  text: The Tribal-State Judicial Consortium was recognized by the New Mexico Supreme Court as an advisory
    board in 2006 to build working relationships among tribal and state courts. It has seven tribal court
    judges and seven state court judges, with tribal and state co-chairs and a Supreme Court justice as
    liaison. It has addressed jurisdiction and sovereignty along with domestic violence, child custody
    and support, and juvenile justice.
