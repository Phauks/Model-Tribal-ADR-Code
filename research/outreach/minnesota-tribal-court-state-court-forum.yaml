relevance:
  text: Minnesota's Tribal Court State Court Forum has met quarterly since July 1997, alternating between
    tribal and state court venues. It is made up of tribal court judges from Minnesota's 11 federally
    recognized tribes and state judges from the district courts, Court of Appeals and Supreme Court. It
    works on judicial education and on recommending changes to Minnesota procedural court rules for matters
    that cross jurisdictional lines.
