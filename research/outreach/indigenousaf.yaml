relevance:
  text: IndigenousAF is a majority Native-led arts and education nonprofit in Southern Nevada that runs
    free public art projects, exhibitions and workshops and supports dozens of Native artists. It operates
    the Nuwu Art Gallery and Community Center and in late 2025 announced a second space, Wai, in the Las
    Vegas Arts District to show Native artisans year-round.
