relevance:
  text: The Indigenous Peoples Law and Policy (IPLP) Program offers three year-round faculty-led clinics
    focused on working with tribes and Indigenous communities, and its students work closely with tribal
    leaders, institutions and courts. Its clinics include the Tribal Justice Clinic and the International
    Human Rights Advocacy Workshop.
