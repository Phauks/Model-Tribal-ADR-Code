relevance:
  text: Native Governance Center is a Native-led nonprofit, founded in January 2016, that helps Native
    nations strengthen their governance systems so they can exercise sovereignty. It teaches a Native
    nation rebuilding approach, offers technical assistance and free public educational resources, and
    serves 23 Native nations sharing geography with Minnesota, North Dakota and South Dakota plus 4 sharing
    geography with Nebraska.
