relevance:
  text: The Native Nations Institute (NNI), housed at the University of Arizona's Udall Center for Studies
    in Public Policy, strengthens Indigenous governance through research, capacity building and education.
    It hosts the Constitutions Resource Center, runs the Indigenous Governance Program with the James
    E. Rogers College of Law, and lists Indigenous data sovereignty as a research and policy area.
