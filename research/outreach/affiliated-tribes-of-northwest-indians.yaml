relevance:
  text: The Affiliated Tribes of Northwest Indians is a regional intertribal organization dedicated to
    promoting tribal self-determination and sovereignty. It provides a forum for sharing information on
    matters of interest to its member tribes. Its conferences reach tribal leaders across the Northwest
    who would decide whether to adopt an alternative dispute resolution code (project analysis).
