relevance:
  text: Federally recognized Native nation whose government office is in Utah and whose lands extend into
    Nevada. The Tribal Law and Policy Institute lists its court as the Confederated Tribes of the Goshute
    Reservation Tribal Court. The National Indian Law Library keeps a tribal law page for the nation.
