relevance:
  text: The Indian Legal Program has worked on tribal sovereignty and Indigenous justice since 1988 and
    runs the Tribal Court Trial Skills College for tribal court advocates. Its Indian Legal Clinic gives
    students experience in tribal, state and federal courts and takes on tribal legal development projects,
    including tribal code drafting for tribal governments.
