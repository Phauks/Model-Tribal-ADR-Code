relevance:
  text: The National Indian Law Library (NILL) is a law library devoted to American Indian law that serves
    both the Native American Rights Fund and the public. It offers the Tribal Law Gateway for access to
    tribal law, weekly Indian Law Bulletins, and research assistance on specific Indian law questions.
