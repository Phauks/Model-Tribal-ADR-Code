relevance:
  text: Diné College offers a Bachelor of Arts in Navajo Nation Law, housed in its School of Business
    and Social Science, that supports tribal sovereignty, Indigenous rights and traditional governance.
    Required courses include Navajo Fundamental Law I and II, Navajo Criminal Law, Navajo Civil Law and
    Diné Family Traditional Law. Faculty and students in this program are well placed to review commentary
    on Diné law and Navajo peacemaking (project analysis).
