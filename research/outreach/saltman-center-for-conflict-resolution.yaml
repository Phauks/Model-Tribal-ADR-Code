relevance:
  text: The Saltman Center at the Boyd School of Law produces conflict-resolution scholarship, runs public
    forums, mediation trainings and restorative practice workshops, and supports a Dispute Resolution
    Concentration for law students. Boyd's Mediation Clinic, part of the Thomas & Mack Legal Clinic, has
    law students provide free facilitative mediation under faculty supervision. Its co-directors and affiliated
    faculty teach and write on alternative dispute resolution, mediation, arbitration and negotiation.
