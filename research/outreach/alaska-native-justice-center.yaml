relevance:
  text: The Alaska Native Justice Center's Tribal Justice Support service works statewide with federally
    recognized Alaska Tribes to build and strengthen their justice systems, including training for tribal
    justice staff. It develops Alaska-specific model codes, model forms and agreements, a tribal court
    implementation handbook, and a tribal court resource database. Its page notes Alaska tribal approaches
    such as Kake Circle Peacemaking and that Tribes may use councils, Elders or inter-tribal courts instead
    of formal courts.
