relevance:
  text: The Intertribal Court of Southern California was formed in 2002 through a Department of Justice
    grant to the Southern California Tribal Chairmen's Association and began operating in 2006. It provides
    member tribes with an independent and culturally sensitive forum to resolve disputes, functioning
    as a circuit court whose judges travel to reservations and apply each tribe's laws, customs and traditions.
    Its model of a shared court applying many tribes' own laws bears directly on how a model alternative
    dispute resolution code can be adopted by consortia (project analysis).
