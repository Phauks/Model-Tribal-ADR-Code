relevance:
  text: The Bureau of Indian Affairs Tribal Justice Support Directorate, part of the Office of Justice
    Services, works to develop and strengthen tribal justice systems while respecting traditional justice
    systems. Under the Indian Tribal Justice Act it provides training and technical support to tribal
    courts, conducts tribal court assessments, and passes funding to tribal courts through Bureau of Indian
    Affairs regional offices. It also oversees Courts of Indian Offenses (CFR courts) and has published
    an annotated model Indian juvenile code.
