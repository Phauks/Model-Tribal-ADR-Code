relevance:
  text: The Arizona State, Tribal and Federal Court Forum was established in 1994 under Arizona Code of
    Judicial Administration section 1-801 to promote collaboration among state, tribal and federal courts.
    Its goals include fostering mutual understanding across legal systems and improving the quality of
    justice in overlapping jurisdictions. It also runs a Southwest Cross-Jurisdictional Webinar Series.
