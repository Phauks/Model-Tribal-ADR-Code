id: conference-of-chief-justices-tribal-relations-committee
name: Conference of Chief Justices Tribal Relations Committee
also_known_as:
- CCJ Tribal Relations Committee
category: state-agency
location:
  city: Williamsburg
  state: VA
scope: national
relevance:
  text: The Conference of Chief Justices has a Tribal Relations Committee that proposed resolutions adopted
    in 2002, 2011 and 2019 on tribal-state-federal court relations. The 2002 resolution supports court
    forums, cross-recognition of judgments and orders, and publication of tribal decisions and codes.
    The 2019 resolution, proposed with the National Judicial Opioid Task Force, encourages state and tribal
    courts to share judicial resources and expertise.
  sources:
  - resolution-2002
  - resolution-2011
  - resolution-2019
