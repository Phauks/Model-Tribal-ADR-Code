relevance:
  text: Washington's Tribal State Court Consortium is a joint effort of state and tribal court judicial
    officers that provides a forum to discuss jurisdictional issues, gaps in services and lasting partnerships.
    In 2019 it drafted amendments to Superior Court Civil Rule 82.5 to improve communication between state
    and tribal judges and hired dedicated staff. It publishes a Washington State tribal court directory
    and newsletters, and held regional and annual meetings into 2023.
