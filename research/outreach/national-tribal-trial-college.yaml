relevance:
  text: The National Tribal Trial College offers a tuition-free Certificate in Tribal Court Legal Advocacy
    that trains laypersons to practice in tribal courts nationwide, plus an advanced certificate. It is
    a project of the Southwest Center for Law and Policy with the University of Wisconsin Law School,
    University of Wisconsin–Madison Division of Extension and the Department of Justice Office on Violence
    Against Women. Its lay advocates are a likely audience for plain-language alternative dispute resolution
    rules (project analysis).
