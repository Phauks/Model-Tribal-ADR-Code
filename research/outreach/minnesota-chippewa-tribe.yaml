relevance:
  text: 'Federally recognized Native nation whose government office the Bureau of Indian Affairs lists
    in Minnesota. Dispute resolution forums named in its law or court materials include: Peacemaking Circle
    (White Earth juvenile justice); Peacemaker Tribunal (Leech Lake Band of Ojibwe Tribal Court); Panel
    of elders in cultural causes of action.'
