relevance:
  text: 'Federally recognized Native nation whose government office the Bureau of Indian Affairs lists
    in Michigan. Dispute resolution forums named in its law or court materials include: Peacemaking (Children''s
    Court); Peacemaking program of the Tribal Court (guidelines). Training recorded: Peacemaker certification
    (program operation, introduction to Anishinaabe culture, dispute resolution techniques; observation
    and a training session).'
