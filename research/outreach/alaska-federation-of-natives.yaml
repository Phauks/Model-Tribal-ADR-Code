relevance:
  text: The Alaska Federation of Natives is the largest statewide Native organization in Alaska, with
    membership including 192 federally recognized tribes, village and regional corporations, and regional
    nonprofit and tribal consortiums. Its mission is to enhance and promote the cultural, economic and
    political voice of the Alaska Native community, including advocacy on federal, state and local laws.
    Its annual October convention reaches Alaska tribal governments and Native organizations statewide.
