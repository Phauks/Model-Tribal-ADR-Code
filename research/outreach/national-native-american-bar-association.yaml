relevance:
  text: The National Native American Bar Association (NNABA) began in 1973 as the American Indian Lawyers
    Association and took its current name in 1980; it strives for justice and effective legal representation
    for all American Indigenous peoples. It holds an annual meeting (a 2026 meeting page is posted) and
    has committees including an Intellectual and Cultural Property Committee.
