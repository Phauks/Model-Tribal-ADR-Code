who_can_use: Income-eligible Native Americans in the service area (Legal Services Corporation Native American grant).
lsc:
- service_area: NAZ-6
  grantee_as_lsc_names_it: Southern Arizona Legal Aid, Inc.
  grant_2026: 961025
  next_competition: 2029
serves:
- states:
  - AZ
  scope: named-nations
  text: Serves Native Americans living in Gila and Graham counties who are members of the San Carlos Apache Indian Reservations and tribal members living off reservation who have cases which require litigation in tribal court; Native Americans living off reservation in Maricopa County; Native Americans living on or near the Tohono O'odham Reservation in Pima, Pinal & Maricopa Counties and Tohono O'odham tribal members living off reservation who have cases which require litigation in the Tohono O'odham National Court; and Native Americans living in (1) Fort Apache Indian Reservation which covers portions of Gila, Apache and Navajo Counties, (2) Gila River Indian Community in Pinal & Maricopa Counties, Ak-Chin Indian Community in Pinal County, Cocopah Indian Community and Ft. Yuma Indian Comunity in Yuma County, (3) Salt River Pima-Maricopa Indian Community & Ft. McDowell Mohave-Apache Tribe in Maricopa County, (4) Camp Verde Yavapai-Apache Indian Community in Yavapai County, (5) Pascua Yaqui Indian Comunity in Pima County, and tribal members living off reservations who have cases which require litigation in tribal court.
  source: lsc-service-area-naz-6
  nations:
  - san-carlos-apache-tribe-of-the-san-carlos-reservation
  - tohono-oodham-nation-of-arizona
  - white-mountain-apache-tribe-of-the-fort-apache-reservation
  - gila-river-indian-community-of-the-gila-river-indian-reservation
  - ak-chin-indian-community
  - cocopah-tribe-of-arizona
  - quechan-tribe-of-the-fort-yuma-indian-reservation
  - salt-river-pima-maricopa-indian-community-of-the-salt-river-reservation
  - fort-mcdowell-yavapai-nation
  - yavapai-apache-nation-of-the-camp-verde-indian-reservation
  - pascua-yaqui-tribe-of-arizona
  note: Also Native Americans living off reservation in Maricopa County, and tribal members living off reservation whose cases must be litigated in tribal court.
