  text: The Nation “provides free will and estate planning services to all PBPN enrolled tribal members and their spouse,” with “no age restrictions”; the service is “provided through Kansas Legal Services (KLS).” Members return forms to the Treasurer’s Office and a Kansas Legal Services representative contacts them; “Do not contact KLS directly.”
  source: prairie-band-will-estate-planning-page
note: Found Nov. 24, 2026 in the sweep of nations with no legal help match. The Nation pays for the service and Kansas Legal Services does the work.
