id: dna-peoples-legal-services
name: DNA-People’s Legal Services
kind: legal-aid
operator: nonprofit
link: https://dnalegalservices.org/
link_label: Home page
services:
- legal-advice
- representation
- community-education
who_can_use: Income-eligible Native Americans in the service area (Legal Services Corporation Native American grant).
lsc:
- service_area: NAZ-5
  grantee_as_lsc_names_it: DNA-Peoples Legal Services, Inc.
  grant_2026: 3934252
  next_competition: 2027
- service_area: NNM-2
  grantee_as_lsc_names_it: DNA-Peoples Legal Services, Inc.
  grant_2026: 34254
  next_competition: 2027
serves:
- states:
  - AZ
  - NM
  - UT
  scope: named-nations
  text: Serves Native Americans living on or near the Navajo Reservation in Arizona, New Mexico and Utah, and the Hopi Reservation in Arizona, and members living off reservation who have cases which require litigation in tribal court
  source: lsc-service-area-naz-5
  nations:
  - navajo-nation
  - hopi-tribe-of-arizona
  note: Also members living off reservation whose cases must be litigated in tribal court.
- states:
  - NM
  scope: named-nations
  text: Serves Native Americans living on or near the Jicarilla Indian Reservation
  source: lsc-service-area-nnm-2
  nations:
  - jicarilla-apache-nation
- states:
  - AZ
  scope: named-nations
  nations:
  - havasupai-tribe-of-the-havasupai-reservation
  - hualapai-indian-tribe-of-the-hualapai-indian-reservation
  - kaibab-band-of-paiute-indians-of-the-kaibab-indian-reservation
  text: The Window Rock listing serves “members of the Navajo Nation, Hopi, Hualapai, Havasupai, and Kaibab-Paiute tribes with low incomes”; the Flagstaff office’s Welfare Rights Assistance serves “Havasupai, Hualapai, Kaibab Paiute tribal members with low income” and “Provides a full range of legal services in civil matters including landlord/tenant, foreclosure, domestic relations.”
  source: arizona-211-dna-window-rock
  link: https://search.211arizona.org/search/65aa779c-035d-56b7-b5af-a9b89be9cefd
  note: Found Nov. 24, 2026 in the sweep of nations with no legal help match. Both 211 Arizona listings say “Last Assured 07/01/2026.” The Flagstaff listing is source arizona-211-dna-flagstaff-welfare-rights.
note: The home page asks visitors to pass a bot check, so it was not read; the link was confirmed by New Mexico Courts’ resource list.
