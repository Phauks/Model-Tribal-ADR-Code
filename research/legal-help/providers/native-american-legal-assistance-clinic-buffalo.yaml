  scope: unclassified
  text: A 2019 news article, as quoted on a forum, describes “a legal aid clinic where Native Americans could get answers to local, county or tribal legal questions. Native Americans of any descent may use the clinic.” The New York State Bar Association (June 3, 2020) says Lee Redeye, a Seneca Nation member, founded the clinic “in partnership with the Erie County Bar Association.”
  source: nysba-native-american-legal-assistance-clinic-2020
note: Grabbed Nov. 24, 2026 in the sweep of nations with no legal help match (Seneca, Tonawanda and Tuscarora are near Buffalo). Nothing found shows the clinic running after 2020; find the original article and a current page before relying on it.
