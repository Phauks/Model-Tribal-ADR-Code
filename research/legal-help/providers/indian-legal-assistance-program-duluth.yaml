  note: The Minnesota Chippewa Tribe is made up of six bands (Bois Forte, Fond du Lac, Grand Portage, Leech Lake, Mille Lacs and White Earth); this provider serves members of the Fond du Lac, Bois Forte and Grand Portage bands, so it is matched to the umbrella tribe too. The source does not name the Minnesota Chippewa Tribe.
