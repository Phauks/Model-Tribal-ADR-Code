  text: “The Indian Legal Clinic provides law students with the unique opportunity to represent clients in various civil and criminal matters in Tribal, state and federal courts.” “Additionally, the Clinic frequently represents individual Tribal members in civil actions.” Its estate planning course ends with “a two-day (all day) estate planning clinic for a Tribal Nation that takes place on the Tribal Nation’s reservation.”
