  text: “The Surrogates have jurisdiction over the probate of wills and the settlement of estates for members of the Seneca Nation.” “Services provided include, the assisting in wills and Power of Attorney requests, Notary Public, guardianship for incompetent person(s), requests for Administrators and Executors deeds.” “The goal of the Surrogate’s Court is to increase and provide services to the elderly and the disabled, both on and off territories.”
  source: seneca-nation-judicial-page
note: Found Nov. 24, 2026 in the sweep of nations with no legal help match. The court assists members with wills and powers of attorney and posts a will form; it is a court office, not a lawyer.
