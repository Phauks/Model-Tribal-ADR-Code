  text: “Tribal members who need help navigating a legal issue are invited to attend the Tribal Court Legal Clinic, sponsored by UMASS Law. The clinic is held every Friday from 10:00 AM to 11:00 AM in the Tribal Court Room and will run through April 24.” It “can assist with developing a case, case supervision, negotiations, and advocacy in Tribal Court or Massachusetts courts involving housing, family, and public benefits issues. Support is provided by UMASS Law students and Attorney Ray Yox of South Coast Legal Services.”
