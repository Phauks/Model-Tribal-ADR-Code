# TEMPORARY (removed before this branch merges). Downloads a state code that
# cloud sessions cannot reach (Wisconsin's site resets their connections) and
# commits the compressed download to this branch for the session to parse.
# Wisconsin's statutes are government edicts, free to copy; the download is
# removed from the branch with this file, and the squash merge keeps it out of
# main's history.
name: fetch state code

on:
  push:
    branches: [claude/project-thread-upzqgd]
    paths:
      - ".github/workflows/fetch-state-code.yml"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Download the Wisconsin Statutes
        run: |
          pip install pyyaml
          python3 scripts/law/state_statutes/run.py fetch WI --work out
          ls out/wi/raw | head
          ls out/wi/raw/chapters | wc -l
          du -sh out/wi/raw
      - name: Commit the compressed download to this branch
        run: |
          mkdir -p tmp-state-code
          tar -C out/wi -cJf tmp-state-code/wi-raw.tar.xz raw
          ls -la tmp-state-code
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add tmp-state-code/wi-raw.tar.xz
          git commit -m "Temporary: Wisconsin Statutes download for the session to parse"
          git push origin HEAD:claude/project-thread-upzqgd
