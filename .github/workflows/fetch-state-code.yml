# TEMPORARY (removed before this branch merges). Finishes the download of the
# Revised Statutes of Missouri, which a cloud session began (8,794 of 30,434
# section pages) and could not finish there: long runs in this project go to
# GitHub (Trevor, Nov. 28, 2026). It starts from the session's partial download
# in tmp-state-code/mo-raw.tar.xz, asks for the rest at the adapter's slow pace
# (two workers, 1.5 seconds between requests), and commits the whole download
# back to this branch for the session to parse. The pages are government
# edicts, free to copy; the download leaves the branch with this file, and the
# squash merge keeps it out of main's history. Three jobs run one after another,
# since one job may run at most six hours; a job that finds nothing left to ask
# for ends at once.
name: fetch state code

on:
  push:
    branches: [claude/project-thread-n0uj6p]
    paths:
      - ".github/workflows/fetch-state-code.yml"

permissions:
  contents: write

concurrency:
  group: fetch-state-code-missouri
  cancel-in-progress: false

jobs:
  part-1:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Ask for Missouri's remaining section pages, for up to five and a half hours
        run: |
          pip install pyyaml
          mkdir -p out/mo
          tar -C out/mo -xJf tmp-state-code/mo-raw.tar.xz
          ls out/mo/raw/sections | wc -l
          timeout 330m python3 scripts/law/state_statutes/run.py fetch MO --work out || echo "stopped (exit $?)"
          ls out/mo/raw/sections | wc -l
          tar -C out/mo -cJf mo-raw.tar.xz raw
      - uses: actions/upload-artifact@v4
        with:
          name: mo-raw-1
          path: mo-raw.tar.xz
          retention-days: 3

  part-2:
    needs: part-1
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: mo-raw-1
      - name: Ask for what is still left
        run: |
          pip install pyyaml
          mkdir -p out/mo
          tar -C out/mo -xJf mo-raw.tar.xz
          ls out/mo/raw/sections | wc -l
          timeout 330m python3 scripts/law/state_statutes/run.py fetch MO --work out || echo "stopped (exit $?)"
          ls out/mo/raw/sections | wc -l
          tar -C out/mo -cJf mo-raw.tar.xz raw
      - uses: actions/upload-artifact@v4
        with:
          name: mo-raw-2
          path: mo-raw.tar.xz
          retention-days: 3

  part-3:
    needs: part-2
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: mo-raw-2
      - name: Ask for what is still left, then commit the download to this branch
        run: |
          pip install pyyaml
          mkdir -p out/mo
          tar -C out/mo -xJf mo-raw.tar.xz
          timeout 330m python3 scripts/law/state_statutes/run.py fetch MO --work out || echo "stopped (exit $?)"
          ls out/mo/raw/sections | wc -l
          mkdir -p tmp-state-code
          tar -C out/mo -cJf tmp-state-code/mo-raw.tar.xz raw
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -f tmp-state-code/mo-raw.tar.xz
          git commit -m "Temporary: Revised Statutes of Missouri download for the session to parse"
          git push origin HEAD:claude/project-thread-n0uj6p
