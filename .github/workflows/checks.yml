# Checks every pull request and every push to main. Uses no secrets.
#
# It can also be started by hand or by another workflow (workflow_dispatch).
# The archive workflow's catch-up job uses that: pull requests opened by the
# workflow token start no workflows, so it starts these checks on its branch
# itself. A started run is not attached to the pull request, so the final job
# also posts its result as an "All checks" commit status, which is what the
# ruleset then sees on the branch's head.
#
# The main branch ruleset requires only the final "All checks" job
# (decision record 0008). To add a check, add a job here and list it under
# all-checks.needs; the ruleset never needs editing.
name: checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request replaces a run still in progress, so
# runners are not spent on a head that can no longer merge.
concurrency:
  group: checks-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Decides which of the slow jobs a pull request needs, from the files it
  # changes. Pushes to main and started runs always run everything.
  changes:
    name: What changed
    runs-on: ubuntu-latest
    outputs:
      site: ${{ steps.decide.outputs.site }}
      every_size: ${{ steps.decide.outputs.every_size }}
      scan_engine: ${{ steps.decide.outputs.scan_engine }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: decide
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -z "$BASE" ]; then
            echo "site=true" >> "$GITHUB_OUTPUT"
            echo "every_size=true" >> "$GITHUB_OUTPUT"
            echo "scan_engine=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only "$BASE"...HEAD)
          echo "$files"
          # The website reads content/, site/, LICENSES/, pdf/styles/, the
          # capture index, search logs, scripts/captures/ and a few documents
          # in docs/. A pull request that changes none of those skips the
          # website build and its accessibility check.
          site=false
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            case "$file" in
              research/search-logs/*|research/capture-index*) site=true ;;
              research/*) ;;
              docs/charter.md|docs/requests.md|docs/contributor-forms/*) site=true ;;
              docs/*) ;;
              scripts/captures/*) site=true ;;
              scripts/*) ;;
              .github/workflows/checks.yml) site=true ;;
              .github/*) ;;
              pdf/styles/*) site=true ;;
              pdf/*) ;;
              *) site=true ;;
            esac
          done <<< "$files"
          # Building the book at every trim size takes about six minutes, so
          # pull requests do it only when they change the print pipeline.
          every_size=false
          if grep -q '^pdf/' <<< "$files"; then every_size=true; fi
          # The scan engine (site/scanner/engine, Rust) is tested only when it
          # or this workflow changes.
          scan_engine=false
          if grep -q -e '^site/scanner/engine/' -e '^\.github/workflows/checks\.yml$' <<< "$files"; then scan_engine=true; fi
          echo "site=$site" >> "$GITHUB_OUTPUT"
          echo "every_size=$every_size" >> "$GITHUB_OUTPUT"
          echo "scan_engine=$scan_engine" >> "$GITHUB_OUTPUT"

  text:
    name: Text encoding
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python3 scripts/check_text.py
      # Fails only on paragraphs the pull request wraps; older wrapped files are counted, not refused (docs/style-guide.md, section 7).
      - name: No hard-wrapped Markdown
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: python3 scripts/check_wrapping.py ${BASE:+--base "$BASE"}

  migrations:
    name: Migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # Names are a UTC timestamp and what the migration does, each opens with
      # a comment saying what it changes, and migrations already on main are
      # never changed (site/migrations/README.md).
      - name: Migration names and headers
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: python3 scripts/check_migrations.py ${BASE:+--base "$BASE"}

  records:
    name: Records and links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r scripts/requirements.txt
      - run: python3 scripts/validate_records.py

  lint:
    name: Record lint and coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r scripts/requirements.txt
      # Fails only on problems the pull request adds or changes; older ones
      # are warnings (decision record 0014).
      - name: Lint records
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: python3 scripts/lint_records.py ${BASE:+--base "$BASE"}
      - name: Coverage report
        if: always()
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          python3 scripts/coverage_report.py ${BASE:+--base "$BASE"} --markdown coverage.md --json coverage.json
          cat coverage.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: |
            coverage.md
            coverage.json
          if-no-files-found: ignore

  site:
    name: Website build
    needs: changes
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    # A normal run takes about four minutes; this stops a stuck one long before
    # GitHub's six-hour limit, so the merge queue is not held up.
    timeout-minutes: 30
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - name: Type check
        run: npm run check
      - name: Type check the scanner Worker (scanner/worker.ts)
        run: npx tsc -p scanner/tsconfig.json
      - name: Unit tests
        run: npm test
      - name: Colors come only from design-tokens.json
        run: npm run check:colors
      - name: Motion timing comes only from design-tokens.json
        run: npm run check:motion
      - name: Build
        run: npm run build
      - name: Check the built pages, manifest and service worker
        run: npm run check:built-site
      - name: Install Chromium for the sidebar check
        run: npx playwright install --with-deps --only-shell chromium
      - name: Check the sidebar in a browser (tools/check-sidebar.mjs)
        run: npm run check:sidebar
      - name: Check the timeline's layout buttons in a browser (tools/check-timeline.mjs)
        run: npm run check:timeline
      - name: Check that tables stay within the screen in a browser (tools/check-wide-tables.mjs)
        run: npm run check:wide-tables
      - name: Check the tables' filters, columns and Sum row in a browser (tools/check-table-tools.mjs)
        run: npm run check:table-tools

  accessibility:
    # Every page in both themes, split between four jobs that run at once.
    # Each job builds the site (18 to 20 minutes) and then checks its pages
    # (10 to 12 minutes), so 30 minutes was too tight and cancelled shards on
    # slow runners. Building once for all four shards would shorten this.
    name: Accessibility ${{ matrix.shard }}/4
    needs: changes
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - name: Build
        run: npm run build
      - name: Install Chromium for the accessibility check
        run: npx playwright install --with-deps --only-shell chromium
      - name: Accessibility check (axe-core, this shard's pages, both themes)
        # The script limits each page and stops itself when nothing finishes for
        # five minutes; this is the last guard if the browser itself stalls.
        timeout-minutes: 20
        run: npm run check:accessibility -- --shard ${{ matrix.shard }}/4

  print:
    name: Print build
    needs: changes
    runs-on: ubuntu-latest
    env:
      TYPST_VERSION: "0.15.1"
      TYPST_SHA256: a6d077d0a95eed5a2eba715b2dae06be954f624ccbf85758a03f389ded33118c
    defaults:
      run:
        working-directory: pdf
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: pdf/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Typst
        run: |
          archive=typst-x86_64-unknown-linux-musl.tar.xz
          curl --fail --location --silent --show-error --output "$RUNNER_TEMP/$archive" \
            "https://github.com/typst/typst/releases/download/v$TYPST_VERSION/$archive"
          echo "$TYPST_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check
          tar --extract --file "$RUNNER_TEMP/$archive" --directory "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/typst-x86_64-unknown-linux-musl" >> "$GITHUB_PATH"
      - run: pip install -r requirements.txt
      - run: npm ci
      - run: npm test
      - if: needs.changes.outputs.every_size == 'true'
        run: npm run build:every-size
      # Covers for one size, both bindings, checked against Lulu's cover rules.
      - run: npm run build:editions -- --specimen --trim us-trade
      - run: npm run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: print-interior
          path: |
            pdf/output/**/interior.pdf
            pdf/output/**/report.json
            pdf/output/every-size/summary.md
            pdf/output/editions/**/cover.pdf
          if-no-files-found: ignore

  scan-engine:
    # The malware scan engine (site/SCANNING.md): formatting, lints and tests
    # of the Rust service. ClamAV itself is tested in the image check below.
    name: Scan engine
    needs: changes
    if: needs.changes.outputs.scan_engine == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: site/scanner/engine
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            site/scanner/engine/target
          key: scan-engine-${{ runner.os }}-${{ hashFiles('site/scanner/engine/Cargo.lock') }}
      - run: rustup update stable --no-self-update && rustup default stable && rustup component add rustfmt clippy
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  scan-engine-image:
    # Builds the engine's image and checks that ClamAV finds the EICAR test
    # file and passes a plain one. Not required by "All checks": it
    # downloads ClamAV's signatures, and that download can be refused for a
    # while when many builds ask at once.
    name: Scan engine image (EICAR)
    needs: changes
    if: needs.changes.outputs.scan_engine == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - run: bash site/scanner/engine/tests/eicar_e2e.sh

  prose:
    name: Prose flags
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # Warnings only (style guide section 8): flags habits to reread on the
      # lines a pull request adds. It never fails.
      - name: Flag prose habits
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: python3 scripts/check_prose.py ${BASE:+--base "$BASE"}

  all-checks:
    name: All checks
    if: always()
    needs: [changes, text, migrations, records, lint, prose, site, accessibility, print, scan-engine]
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - name: Fail if any check failed or was cancelled
        id: verdict
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              exit 1
            fi
          done
      # A run started by hand or by another workflow is not attached to the
      # pull request, so its "All checks" job does not count toward the
      # ruleset. Posting the same result as a commit status on the commit does.
      - name: Report the result on the commit for a started run
        if: always() && github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.verdict.outcome }}
        run: |
          state=failure
          if [ "$OUTCOME" = "success" ]; then state=success; fi
          gh api "repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -f state="$state" -f context="All checks" \
            -f description="Checks workflow run started on this branch" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
