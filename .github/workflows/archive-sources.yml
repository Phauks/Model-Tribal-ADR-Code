# Asks the Wayback Machine to capture source records' original links that
# have no archived copy yet (an empty 'archives' list). Not a required check; a
# slow or failed capture does not block a pull request. Uses no secrets.
#
# Two jobs:
#
# - On a pull request it captures only the source records the pull request
#   adds or changes, and reports the capture links (job log and the
#   archive-report artifact). Each pull request has its own concurrency group,
#   so one pull request's run no longer replaces another's; a newer push to the
#   same pull request replaces that pull request's older run.
# - Every night, or when run by hand, a catch-up job on main works through
#   older records without a copy ('limit' records per run, about 20 seconds
#   apart, because anonymous Save Page Now is rate limited), writes the
#   captures into the records with scripts/apply_archive_report.py, checks the
#   records, and pushes a branch with a pull request for review. Pull requests
#   opened by the workflow's own token do not start other workflows, so the job
#   runs the record checks itself before pushing.
#
# Parallel runs used to get their connections refused; a refused capture is
# simply left for the next night.
name: archive sources

on:
  pull_request:
    paths:
      - "content/sources/**"
  schedule:
    # 10:17 UTC, 2:17 AM Pacific standard time.
    - cron: "17 10 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Most records to capture in this run"
        default: "150"
      keys:
        description: "Source record keys to capture, separated by spaces (leave empty for all without a capture)"
        default: ""

jobs:
  pull-request:
    name: Wayback captures for this pull request
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    concurrency:
      group: archive-sources-pull-request-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r scripts/requirements.txt
      - name: Capture the sources this pull request changes
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          keys=$(git diff --name-only --diff-filter=AM "$BASE"...HEAD -- 'content/sources/*/*.yaml' | xargs -r -n1 basename | sed 's/\.yaml$//')
          if [ -z "$keys" ]; then echo "No changed source records."; exit 0; fi
          python3 scripts/find_archived_copies.py --save --limit 150 --report archive-report.json $keys
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: archive-report
          path: archive-report.json
          if-no-files-found: ignore

  catch-up:
    name: Wayback captures for older sources
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: archive-sources-catch-up
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r scripts/requirements.txt
      - name: Capture older sources
        env:
          LIMIT: ${{ inputs.limit || '150' }}
          KEYS: ${{ inputs.keys }}
        run: python3 scripts/find_archived_copies.py --save --limit "$LIMIT" --report archive-report.json $KEYS
      - name: Write the captures into the records
        run: python3 scripts/apply_archive_report.py archive-report.json
      - name: Check the records
        run: |
          python3 scripts/check_text.py
          python3 scripts/validate_records.py
      - name: Push a branch and open a pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- content/sources; then echo "No new captures."; exit 0; fi
          count=$(git diff --name-only -- content/sources | wc -l)
          branch="archive/captures-$(date -u +%Y-%m-%d-%H%M)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add content/sources
          git commit -m "chore(content): add Wayback captures for $count source records" \
            -m "Written by the archive workflow's catch-up job (scripts/apply_archive_report.py) from its archive report."
          git push origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "chore(content): add Wayback captures for $count source records" \
            --body "The archive workflow's nightly catch-up job captured these source records' original links in the Wayback Machine and wrote each capture into the record's \`archives\` list. Only \`archives\` lines change. The job ran \`check_text.py\` and \`validate_records.py\` before pushing; pull requests opened by the workflow's token do not start other workflows." \
            || echo "Could not open the pull request (the repository may not let workflows open pull requests); open one from branch $branch."
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: archive-report
          path: archive-report.json
          if-no-files-found: ignore
