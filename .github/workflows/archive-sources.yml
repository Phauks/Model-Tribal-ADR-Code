# Asks the Wayback Machine to capture source records' original links that
# have no archived copy yet (an empty 'archives' list). Not a required check; a
# slow or failed capture does not block a pull request. Uses no secrets.
#
# Both jobs first reuse a copy the Archive already holds when it was taken
# within 365 days of the record's 'retrieved' date (a lookup takes about a
# second), and ask Save Page Now for a new capture only when there is none
# (about a minute each, 20 seconds apart, because anonymous Save Page Now is
# rate limited). The capture step stops starting new records after a set number
# of minutes so each job ends inside its time limit, and its report is
# rewritten after each record, so a stopped run keeps what it found.
#
# - On a pull request it captures only the source records the pull request
#   adds or changes, and reports the capture links (job log and the
#   archive-report artifact). Each pull request has its own concurrency group,
#   so one pull request's run does not replace another's; a newer push to the
#   same pull request replaces that pull request's older run.
# - Every two hours, or when run by hand, a catch-up job works through older
#   records without a copy, writes the captures into the records with
#   scripts/apply_archive_report.py, checks the records, and commits them to
#   one rolling branch, archive/captures, with one pull request for review.
#   While that pull request is open each run adds to it (records already
#   captured on the branch are skipped); once it is merged and the branch
#   deleted, the next run starts a new one from main. Pull requests opened by
#   the workflow's own token do not start other workflows, so the job runs the
#   record checks itself before pushing, then starts checks.yml on the branch
#   (workflow_dispatch is the one event that token may start) so the required
#   "All checks" result appears on the pull request.
#
# GitHub may delay or skip scheduled runs, so a catch-up run that tried any
# record also starts the next run itself (workflow_dispatch, which the
# workflow token may start). A cache (archive-state.json) remembers which
# records were looked up with no recent copy and which saves failed, so each
# run looks up new records first and does not retry a failed save for a day;
# the chain stops on its own once no record is due, and the schedule remains
# as a backstop.
#
# A refused or failed capture is simply left for a later run.
name: archive sources

on:
  pull_request:
    paths:
      - "content/sources/**"
  schedule:
    # Every two hours at 17 minutes past (2:17 AM Pacific standard time is one of them).
    - cron: "17 */2 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Most records to capture in this run"
        default: "2000"
      keys:
        description: "Source record keys to capture, separated by spaces (leave empty for all without a capture)"
        default: ""

jobs:
  pull-request:
    name: Wayback captures for this pull request
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    concurrency:
      group: archive-sources-pull-request-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r scripts/requirements.txt
      - name: Capture the sources this pull request changes
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          keys=$(git diff --name-only --diff-filter=AM "$BASE"...HEAD -- 'content/sources/*/*.yaml' | xargs -r -n1 basename | sed 's/\.yaml$//')
          if [ -z "$keys" ]; then echo "No changed source records."; exit 0; fi
          python3 scripts/find_archived_copies.py --save --reuse-days 365 --limit 150 --minutes 75 --report archive-report.json $keys
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: archive-report
          path: archive-report.json
          if-no-files-found: ignore

  catch-up:
    name: Wayback captures for older sources
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
      pull-requests: write
      actions: write
    concurrency:
      group: archive-sources-catch-up
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - name: Continue the open captures pull request, or start a new branch from main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The workflow token may not push a commit whose files under .github/workflows
          # differ from what the branch (or, for a new branch, main) already has, so the
          # job never merges main into the branch: it adds to an open pull request's
          # branch as it is, or starts a new branch from main and rebases onto the
          # latest main just before pushing.
          if [ -n "$(gh pr list --head archive/captures --state open --json number --jq '.[].number')" ]; then
            git fetch origin archive/captures
            git switch -c archive/captures FETCH_HEAD
            echo "CAPTURES_BASE=archive/captures" >> "$GITHUB_ENV"
          else
            git push origin --delete archive/captures 2>/dev/null || true
            git switch -c archive/captures
            echo "CAPTURES_BASE=main" >> "$GITHUB_ENV"
          fi
      - name: Restore the record of earlier lookups and saves
        uses: actions/cache/restore@v4
        with:
          path: archive-state.json
          key: archive-state-${{ github.run_id }}
          restore-keys: archive-state-
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r scripts/requirements.txt
      - name: Take the captures the Wayback Worker made
        # The Worker (site/wayback, site/WAYBACK.md) saves links signed in with
        # the project's archive.org keys, which live only in Cloudflare. Its
        # list of captures is public and read-only. While it is running, this
        # job only looks up existing copies and leaves the saving to it.
        run: |
          worker=https://model-tribal-adr-code-wayback.trevordgoldsmith.workers.dev
          if curl -sf --max-time 60 "$worker/captures.json" -o worker-captures.json; then
            echo "SAVE_OPTION=" >> "$GITHUB_ENV"
          else
            echo '{"captures": []}' > worker-captures.json
            echo "SAVE_OPTION=--save" >> "$GITHUB_ENV"
          fi
          python3 scripts/captures/wayback_queue.py --report worker-captures.json worker-report.json
      - name: Capture older sources
        env:
          LIMIT: ${{ inputs.limit || '2000' }}
          KEYS: ${{ inputs.keys }}
        run: python3 scripts/find_archived_copies.py $SAVE_OPTION --reuse-days 365 --state archive-state.json --limit "$LIMIT" --minutes 90 --report archive-report.json $KEYS
      - name: Keep the record of lookups and saves for the next run
        if: always()
        uses: actions/cache/save@v4
        with:
          path: archive-state.json
          key: archive-state-${{ github.run_id }}
      - name: Write the captures into the records
        run: |
          python3 scripts/apply_archive_report.py archive-report.json worker-report.json
          python3 scripts/captures/wayback_queue.py --write
      - name: Check the records
        run: |
          python3 scripts/check_text.py
          python3 scripts/validate_records.py
      - name: Commit to the captures branch and open or update its pull request
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- content/sources research/wayback-queue.tsv; then echo "No new captures."; exit 0; fi
          count=$(git diff --name-only -- content/sources | wc -l)
          git add content/sources research/wayback-queue.tsv
          git commit -m "chore(content): add Wayback captures for $count source records" \
            -m "Written by the archive workflow's catch-up job (scripts/apply_archive_report.py) from its archive report."
          git fetch origin main
          # The captures pull request may have been merged (and its branch
          # deleted) while this run was capturing; then start again from main.
          git fetch origin "$CAPTURES_BASE" || git fetch origin main
          git rebase FETCH_HEAD
          git push origin HEAD:refs/heads/archive/captures
          echo "committed=true" >> "$GITHUB_OUTPUT"
          gh workflow run checks.yml --ref archive/captures \
            || echo "Could not start checks.yml on archive/captures; start it by hand so the pull request gets its required checks."
          total=$(git diff --name-only origin/main...HEAD -- content/sources | wc -l)
          title="chore(content): add Wayback captures for source records"
          body="The archive workflow's catch-up job captured these source records' original links in the Wayback Machine, or reused a copy taken within 365 days of the record's retrieval date, and wrote each capture into the record's \`archives\` list. Only \`archives\` lines change. Runs every two hours add to this pull request until it is merged ($total records so far). The job ran \`check_text.py\` and \`validate_records.py\` before each push and then started the checks workflow on the branch, because pull requests opened by the workflow's token do not start other workflows."
          if [ -n "$(gh pr list --head archive/captures --state open --json number --jq '.[].number')" ]; then
            gh pr edit archive/captures --body "$body" || true
          else
            gh pr create --base main --head archive/captures --title "$title" --body "$body" \
              || echo "Could not open the pull request (the repository may not let workflows open pull requests); open one from branch archive/captures."
          fi
      - name: Start the next run while records are still being tried
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tried=$(python3 -c 'import json; print(len(json.load(open("archive-report.json"))))' 2>/dev/null || echo 0)
          if [ "$tried" -eq 0 ]; then echo "No record was due this run; leaving the next run to the schedule."; exit 0; fi
          gh workflow run archive-sources.yml --ref main || echo "Could not start the next run; the schedule will."
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: archive-report
          path: archive-report.json
          if-no-files-found: ignore
