# Issue and pull request labels. Synced to GitHub by .github/workflows/labels.yml
# when this file changes on main. Labels not listed here are left alone
# (release-please adds its own "autorelease" labels).

# Type: what kind of work
- name: "type: correction"
  color: "d73a4a"
  description: "A factual error in published, non-sensitive content"
- name: "type: source"
  color: "0e8a16"
  description: "A source to add, archive or re-check"
- name: "type: glossary"
  color: "5319e7"
  description: "A term, definition or acronym for the project dictionary"
- name: "type: proposal"
  color: "1d76db"
  description: "New provision, commentary, illustration or essay"
- name: "type: bug"
  color: "b60205"
  description: "Something in the website, print or ebook build is broken"
- name: "type: enhancement"
  color: "a2eeef"
  description: "An improvement or new feature"
- name: "type: docs"
  color: "0075ca"
  description: "Project documentation"
- name: "type: question"
  color: "d876e3"
  description: "A question rather than a change"

# Track: which version track a change belongs to
- name: "track: content"
  color: "c2e0c6"
  description: "content/ (provisions, commentary, essays, glossary, sources, profiles)"
- name: "track: site"
  color: "bfd4f2"
  description: "site/ (website)"
- name: "track: pdf"
  color: "fef2c0"
  description: "pdf/ (print edition and ebook build)"

# Status: where the work stands
- name: "status: needs triage"
  color: "ededed"
  description: "New; not yet reviewed by the maintainer"
- name: "status: needs nation review"
  color: "fbca04"
  description: "Waiting on review or approval from the nation concerned"
- name: "status: blocked"
  color: "000000"
  description: "Cannot proceed until something else is done"
- name: "good first issue"
  color: "7057ff"
  description: "Small and well defined; good for a new contributor"
