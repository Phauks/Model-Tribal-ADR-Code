id: conflict-assessment
name: conflict assessment
also_known_as: [situation assessment]
classification: alternative-dispute-resolution
tradition: [western-legal, governmental]
definition: >-
  "Conducted by a neutral party, an assessment serves to identify stakeholders and
  key issues, analyze the feasibility of moving forward in a collaborative process
  including the feasibility of reaching agreement, and design an approach for proceeding"
  [@doi-cadr, Situation or Conflict Assessment]. The Udall Foundation's national
  center lists assessment among its statutory services [@usc-20-5604].
characteristics:
  who_decides: [the-parties]
  outcome: [advisory]
  neutral_role: [advisory]
  participation: [voluntary]
  settings: [agency, community]
  note: >-
    It designs the process that follows rather than resolving the dispute itself
    (project analysis).
sources: [doi-cadr, usc-20-5604]
basis: source
status: adopted
