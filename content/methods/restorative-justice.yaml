id: restorative-justice
name: restorative justice
classification: unsettled
classification_note: >-
  Tribal codes use the term alongside peacemaking. Pit River's Peacemaker Program, for
  example, joins "traditional peace-making methods and restorative justice"
  [@pit-river-title-8-chapter-15-peacemaker-program], and the National Center on
  Restorative Justice files many Tribal peacemaking laws under restorative justice
  [@national-center-on-restorative-justice-restorative-justice-tribal-laws-database].
  (project analysis) Many of these programs are also diversion steps inside a criminal
  or juvenile case. The project has not decided whether to treat restorative justice
  as ADR, as a court process, or as a frame some nations use for their own practices.
  Until it does, a nation's process keeps its own name on its profile.
tradition: [community, indigenous, hybrid]
definition: >-
  (project analysis) Responding to harm by bringing together the person who caused it,
  the people harmed, and their families or community to agree on how to repair the harm.
  The term covers the programs below. Tlingit & Haida planned an opt-in youth court
  with "a strong emphasis on tribal mentorship and tradition" [@ktoo-tlingit-haida-youth-court-2016].
  Grand Traverse Band lets the prosecutor divert a juvenile to an informal conference
  with the Peacemaker coordinator [@grand-traverse-band-title-10-juvenile-code-415].
  White Earth uses circles to reach a consensus sentencing plan, which the judge then
  approves [@white-earth-juvenile-justice-code]. Kake youth circles produce "Consensus
  Agreements" [@kake-keex-kwaan-judicial-peacemaking-code]. Tulalip runs a Community
  Accountability Board for youth diversion [@tulalip-tribal-court-juvenile-diversion].
characteristics:
  who_decides: [the-parties, a-community-body, a-court-or-agency, varies]
  outcome: [varies]
  neutral_role: [facilitative, guiding-or-teaching, varies]
  participation: [voluntary, required-by-court-or-law, varies]
  settings: [court-connected, community]
  note: >-
    In the Tribal programs recorded so far, the agreement usually goes back to the court,
    and the court approves or monitors it (see the sources above).
related: [peacemaking, circle-process, family-group-conference, elders-council]
sources: [national-center-on-restorative-justice-restorative-justice-tribal-laws-database,
  pit-river-title-8-chapter-15-peacemaker-program, ktoo-tlingit-haida-youth-court-2016,
  grand-traverse-band-title-10-juvenile-code-415, white-earth-juvenile-justice-code,
  kake-keex-kwaan-judicial-peacemaking-code, tulalip-tribal-court-juvenile-diversion]
basis: source-and-project-analysis
