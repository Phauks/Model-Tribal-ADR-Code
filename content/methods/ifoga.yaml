definition: >-
  A Samoan ceremonial apology. As digested by the American Samoa Bar Association,
  the High Court has said it "is not meant to compensate family of deceased but merely
  as expression of sorrow and apology" [@asbar-samoan-customs-digest, digesting Hsu
  v. Pratt, 4 A.S.R. 752].
