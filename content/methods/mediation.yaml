id: mediation
name: mediation
classification: alternative-dispute-resolution
tradition: [western-legal]
definition: >-
  "'Mediation' means a process in which a mediator facilitates communication and
  negotiation between parties to assist them in reaching a voluntary agreement regarding
  their dispute" [@uniform-law-commission-mediation-act, § 2(1)]. The Federal Judicial
  Center describes it as "a flexible, nonbinding dispute resolution procedure in
  which a neutral third party—the mediator—facilitates negotiations between the parties
  to help them settle" [@plapinger-stienstra-1996-adr-and-settlement-sourcebook,
  Definitions and Key Features, Mediation].
characteristics:
  who_decides: [the-parties]
  outcome: [binding-if-parties-agree]
  neutral_role: [facilitative, evaluative]
  participation: [voluntary, required-by-court-or-law, required-by-contract]
  settings: [private, court-connected, agency, community, workplace, online]
  note: >-
    Courts and statutes may require parties to attend, but the outcome stays voluntary
    [@uniform-law-commission-mediation-act]. Styles differ in how much the mediator
    evaluates; transformative mediation focuses on the parties' relationship [@bush-folger-2004-promise-of-mediation].
    Guam bars court-ordered conciliation or mediation when family violence is alleged
    [@gca-19-ch-7-guam-conciliation-law].
related: [conciliation, facilitation, settlement-conference]
sources: [uniform-law-commission-mediation-act, plapinger-stienstra-1996-adr-and-settlement-sourcebook,
  bush-folger-2004-promise-of-mediation, gca-19-ch-7-guam-conciliation-law]
basis: source
status: proposed
