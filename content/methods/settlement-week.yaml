id: settlement-week
name: settlement week
classification: court-process
tradition: [western-legal]
definition: >-
  "In a typical settlement week, a court suspends normal trial activity and, aided
  by bar groups and volunteer lawyers, sends numerous trial-ready cases to mediation
  conferences held at the courthouse and conducted by attorney-mediators" [@plapinger-stienstra-1996-adr-and-settlement-sourcebook,
  Definitions and Key Features, Settlement Week].
characteristics:
  who_decides: [the-parties]
  outcome: [binding-if-parties-agree]
  neutral_role: [facilitative]
  participation: [required-by-court-or-law]
  settings: [court-connected]
  note: >-
    Arguably a way of scheduling mediation rather than a separate process (project
    analysis); kept separate because the source lists it separately.
related: [mediation, settlement-conference]
sources: [plapinger-stienstra-1996-adr-and-settlement-sourcebook]
basis: source-and-project-analysis
status: proposed
