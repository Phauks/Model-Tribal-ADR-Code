id: facilitation
name: facilitation
also_known_as: [facilitated conversation]
classification: alternative-dispute-resolution
tradition: [western-legal, governmental]
definition: >-
  "A process where an impartial practitioner (facilitator) assists to improve the
  flow of information between parties or helps a group move through a problem-solving
  process to reach group decisions, achieve stated goals, or to resolve or improve
  a situation. A facilitator generally becomes less involved in the substantive issues
  than a mediator" [@doi-cadr, Facilitation]. Federal law lists it among the alternative
  means of dispute resolution [@usc-5-571, § 571(3)].
characteristics:
  who_decides: [the-parties]
  outcome: [not-binding, binding-if-parties-agree]
  neutral_role: [facilitative]
  participation: [voluntary]
  settings: [agency, community, workplace, legislative-or-rulemaking]
  note: >-
    The Department of the Interior also lists a less formal "facilitated conversation"
    to "assist in a difficult conversation" and "improve communication and working
    relationships" [@doi-cadr]; it is recorded here rather than as its own method.
related: [mediation, negotiated-rulemaking]
sources: [doi-cadr, usc-5-571, udall-ncecr-native-nations]
basis: source
status: adopted
