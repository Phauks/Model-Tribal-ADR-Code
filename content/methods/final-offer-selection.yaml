id: final-offer-selection
name: final-offer selection
also_known_as: [last-best-offer selection, baseball arbitration]
classification: alternative-dispute-resolution
tradition: [western-legal, governmental, hybrid]
definition: >-
  Each side submits its last best offer and a neutral must choose one without changing
  it. Under the Indian Gaming Regulatory Act, if court-ordered compact negotiations
  fail, "the Indian tribe and the State shall each submit to a mediator appointed
  by the court a proposed compact that represents their last best offer," and "[t]he
  mediator shall select from the two proposed compacts the one which best comports
  with" the Act [@usc-25-2710, § 2710(d)(7)(B)(iv)].
characteristics:
  who_decides: [a-neutral]
  outcome: [varies]
  neutral_role: [adjudicative]
  participation: [required-by-court-or-law]
  settings: [court-connected]
  note: >-
    The statute calls the neutral a "mediator," but the neutral decides; the selected
    compact then needs the state's consent or goes to the Secretary of the Interior
    [@usc-25-2710, § 2710(d)(7)(B)(vi)–(vii)]. Also known in labor and sports arbitration
    as "baseball" arbitration (project analysis).
related: [arbitration]
sources: [usc-25-2710]
basis: source-and-project-analysis
status: adopted
