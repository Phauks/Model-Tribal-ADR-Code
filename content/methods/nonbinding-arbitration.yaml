id: nonbinding-arbitration
name: nonbinding (court-annexed) arbitration
also_known_as: [court-annexed arbitration]
classification: alternative-dispute-resolution
tradition: [western-legal]
definition: >-
  "Court-annexed arbitration is an adjudicatory process in which one or more attorney
  arbitrators issue a nonbinding judgment on the merits after an expedited, adversarial
  hearing ... Either party may reject the nonbinding ruling and proceed to a trial
  de novo" [@plapinger-stienstra-1996-adr-and-settlement-sourcebook, Definitions
  and Key Features, Arbitration]. Federal courts are authorized to run such programs
  [@usc-28-654], and Nevada requires it for many smaller civil damages claims [@nevada-revised-statutes-38-250].
characteristics:
  who_decides: [a-neutral, the-parties]
  outcome: [advisory, binding-if-parties-agree]
  neutral_role: [adjudicative]
  participation: [required-by-court-or-law, voluntary]
  settings: [court-connected]
  note: >-
    The award becomes a judgment if no party demands a trial de novo [@plapinger-stienstra-1996-adr-and-settlement-sourcebook].
broader: [arbitration]
sources: [plapinger-stienstra-1996-adr-and-settlement-sourcebook, usc-28-654, nevada-revised-statutes-38-250,
  gca-7-ch-42b-court-referred-arbitration-adr]
basis: source
status: proposed
