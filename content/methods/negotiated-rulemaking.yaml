id: negotiated-rulemaking
name: negotiated rulemaking
classification: governmental-process
tradition: [governmental]
definition: >-
  A federal agency convenes representatives of affected interests to try to agree
  on a proposed rule. The Negotiated Rulemaking Act exists "to establish a framework
  for the conduct of negotiated rulemaking ... to encourage agencies to use the process
  when it enhances the informal rulemaking process" [@usc-5-561].
characteristics:
  who_decides: [a-court-or-agency, the-parties]
  outcome: [advisory]
  neutral_role: [facilitative]
  participation: [voluntary]
  settings: [legislative-or-rulemaking, agency]
related: [facilitation]
sources: [usc-5-561, clinton-1998-memorandum-adr-negotiated-rulemaking]
basis: source
status: adopted
