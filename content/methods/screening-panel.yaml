id: screening-panel
name: screening panel
also_known_as: [malpractice screening panel, screening-adjudication model, medical review panel]
classification: court-process
tradition: [western-legal]
definition: >-
  A body that reviews a claim before it may go forward in court. Sander called this
  the "screening-adjudication model": a quick preliminary "costing out" or "screening
  out" by a separate body. His example was a Massachusetts statute for medical malpractice
  cases, under which "the plaintiff must first go before a three-person Board made
  up of a doctor, lawyer and trial judge." If the Board found no prima facie merit,
  the plaintiff had to post a bond for the defendant's costs before going on [@sander-1976-varieties-of-dispute-processing,
  at 128-29].
characteristics:
  who_decides: [a-neutral, a-court-or-agency]
  outcome: [advisory, varies]
  neutral_role: [evaluative]
  participation: [required-by-court-or-law]
  settings: [court-connected]
  note: >-
    (project analysis) The panel's finding does not decide the case, but it can attach
    a cost, such as a bond, to going on. The current form of any state's panel needs
    its own source.
related: [case-evaluation, early-neutral-evaluation, nonbinding-arbitration]
sources: [sander-1976-varieties-of-dispute-processing]
basis: source-and-project-analysis
status: adopted
