id: ombuds
name: ombuds
also_known_as: [ombudsman, ombudsperson]
classification: alternative-dispute-resolution
tradition: [western-legal, governmental]
definition: >-
  A neutral, usually inside an organization, who hears concerns confidentially and
  helps people find options, without deciding. Federal law lists the "use of ombuds"
  among the alternative means of dispute resolution [@usc-5-571, § 571(3)], and the
  Department of the Interior runs an organizational ombuds office [@doi-cadr] (definition
  is project analysis).
characteristics:
  who_decides: [the-parties]
  outcome: [not-binding]
  neutral_role: [facilitative, advisory]
  participation: [voluntary]
  settings: [agency, workplace]
sources: [usc-5-571, doi-cadr]
basis: source-and-project-analysis
status: adopted
