id: early-neutral-evaluation
name: early neutral evaluation
classification: alternative-dispute-resolution
tradition: [western-legal]
definition: >-
  "Early neutral evaluation (ENE) is a nonbinding ADR process designed to improve
  case planning and settlement prospects by providing litigants with an early advisory
  evaluation of the likely court outcome" [@plapinger-stienstra-1996-adr-and-settlement-sourcebook,
  Definitions and Key Features, Early Neutral Evaluation]. The District of Nevada
  has judges conduct it, including in employment discrimination cases [@d-nev-lr-16-5-16-6].
characteristics:
  who_decides: [the-parties]
  outcome: [advisory]
  neutral_role: [evaluative]
  participation: [required-by-court-or-law, voluntary]
  settings: [court-connected]
related: [case-evaluation, mediation]
sources: [plapinger-stienstra-1996-adr-and-settlement-sourcebook, usc-28-651, d-nev-lr-16-5-16-6]
basis: source
status: proposed
