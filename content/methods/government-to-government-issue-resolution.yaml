id: government-to-government-issue-resolution
name: government-to-government issue resolution
classification: governmental-process
tradition: [governmental]
definition: >-
  A standing process between governments for resolving issues one raises with the
  other. In Nevada, when a tribal representative contacts a state agency "to resolve
  an issue with a policy, agreement or program of the state agency that affects that
  Indian tribe," the agency's tribal liaison and head "must follow the policy" set
  by the Department of Native American Affairs "to attempt to resolve the issue in
  collaboration with the Indian tribe" [@nevada-revised-statutes-233a-260, NRS 233A.260(4)–(5)].
characteristics:
  who_decides: [the-parties]
  outcome: [binding-if-parties-agree]
  neutral_role: [no-neutral]
  participation: [required-by-court-or-law]
  settings: [agency]
related: [negotiation]
jurisdictions:
- level: multiple
  state: NV
  note: Nevada and Native nations in Nevada
