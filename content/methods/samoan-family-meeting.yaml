id: samoan-family-meeting
name: Samoan family meeting on matai succession
classification: own-tradition
tradition: [customary]
definition: >-
  A meeting of the extended family, held by its own traditions, to choose a successor
  to a vacant matai title; the Land and Titles Division will not hear a disputed
  claim until one has been held, and will not "totally supplant and displace a Samoan
  family from the matai selection process" [@as-in-re-matai-title-taliaaueafe-1999,
  at 226, 228].
characteristics:
  who_decides: [a-community-body]
  outcome: [binding-if-parties-agree]
  neutral_role: [no-neutral]
  participation: [expected-by-custom, required-by-court-or-law]
  settings: [community]
broader: [customary-dispute-resolution]
jurisdictions:
- level: territory
  state: AS
sources: [as-in-re-matai-title-taliaaueafe-1999, asbar-matai-title-disputes-digest]
basis: source
status: adopted
