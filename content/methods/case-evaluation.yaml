id: case-evaluation
name: case evaluation
also_known_as: [case valuation, Michigan mediation]
classification: alternative-dispute-resolution
tradition: [western-legal]
definition: >-
  "This hybrid ADR process provides litigants in trial-ready cases with a written,
  nonbinding assessment of the case's judgment value, delivered by a panel of three
  attorneys after a short hearing. If the panel's valuation is accepted by all parties,
  the case is settled for that amount" [@plapinger-stienstra-1996-adr-and-settlement-sourcebook,
  Definitions and Key Features, Case Valuation]. Michigan's court rules provide for
  it as a process separate from mediation [@michigan-court-rules-2-410-2-403, MCR
  2.403].
characteristics:
  who_decides: [the-parties]
  outcome: [advisory, binding-if-parties-agree]
  neutral_role: [evaluative]
  participation: [required-by-court-or-law]
  settings: [court-connected]
  note: >-
    Despite its old name, "Michigan mediation," it is not mediation [@plapinger-stienstra-1996-adr-and-settlement-sourcebook].
related: [early-neutral-evaluation, nonbinding-arbitration]
sources: [plapinger-stienstra-1996-adr-and-settlement-sourcebook, michigan-court-rules-2-410-2-403]
basis: source
status: adopted
