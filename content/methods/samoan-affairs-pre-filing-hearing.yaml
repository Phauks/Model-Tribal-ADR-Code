id: samoan-affairs-pre-filing-hearing
name: Office of Samoan Affairs pre-filing hearing
also_known_as: [certificate of irreconcilable dispute process]
classification: own-tradition
classification_note: >-
  Classified as its own tradition because the court describes it as traditional,
  though it is set by statute and run by a government office (project analysis).
tradition: [customary, governmental, hybrid]
definition: >-
  Before a communal land or matai title case may be filed in American Samoa, the
  parties must appear personally, without counsel, at least twice before the Secretary
  of Samoan Affairs and two designees, who try to resolve the dispute and, if they
  cannot, issue a certificate of irreconcilable dispute [@as-hunkin-v-galeai-2004,
  quoting A.S.C.A. § 43.0302]. The High Court calls it "a traditional dispute resolution
  process" [@as-hunkin-v-galeai-2004].
characteristics:
  who_decides: [the-parties]
  outcome: [binding-if-parties-agree]
  neutral_role: [facilitative, guiding-or-teaching]
  participation: [required-by-court-or-law]
  settings: [agency]
  note: >-
    The Secretary is appointed from among leading registered matai [@revised-constitution-american-samoa-1967].
broader: [customary-dispute-resolution]
jurisdictions:
- level: territory
  state: AS
sources: [as-hunkin-v-galeai-2004, asca-43-0302-certificate-irreconcilable-dispute,
  revised-constitution-american-samoa-1967]
basis: source
status: adopted
