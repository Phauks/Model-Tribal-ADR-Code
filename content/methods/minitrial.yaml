id: minitrial
name: minitrial
also_known_as: [mini-trial]
classification: alternative-dispute-resolution
tradition: [western-legal]
definition: >-
  "In a typical court minitrial, each side presents a shortened form of its best
  case to settlement-authorized representatives of the parties to the dispute ...
  Following the hearing, the client representatives meet, with or without the neutral,
  to negotiate a settlement" [@plapinger-stienstra-1996-adr-and-settlement-sourcebook,
  Definitions and Key Features, Court Minitrial]. Both federal ADR statutes list
  it [@usc-5-571; @usc-28-651].
characteristics:
  who_decides: [the-parties]
  outcome: [not-binding, binding-if-parties-agree]
  neutral_role: [advisory, facilitative]
  participation: [voluntary]
  settings: [private, court-connected, agency]
sources: [plapinger-stienstra-1996-adr-and-settlement-sourcebook, usc-5-571, usc-28-651]
basis: source
status: proposed
