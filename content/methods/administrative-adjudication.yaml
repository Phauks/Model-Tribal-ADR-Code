id: administrative-adjudication
name: administrative adjudication
also_known_as: [employment tribunal, administrative tribunal]
classification: governmental-process
tradition: [governmental]
definition: >-
  (project analysis) A government body, other than a general trial court, that hears and
  decides a class of disputes. One example is Prairie Band Potawatomi's Employment Disputes
  Tribunal. It has five magistrates: two appointed by the Tribal Council, two by the Nation's
  employees, and one by the other four. It decides government employment disputes, which
  the District Court's powers exclude [@prairie-band-potawatomi-constitution-2007].
characteristics:
  who_decides: [a-court-or-agency, a-neutral]
  outcome: [binding]
  neutral_role: [adjudicative]
  participation: [required-by-court-or-law]
  settings: [agency, workplace]
related: [arbitration, council-hearing]
sources: [prairie-band-potawatomi-constitution-2007]
basis: source-and-project-analysis
status: proposed
