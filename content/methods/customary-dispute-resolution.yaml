id: customary-dispute-resolution
name: customary dispute resolution
classification: own-tradition
tradition: [customary, indigenous]
definition: >-
  Resolving disputes by the customs of a people, often through family or chiefly
  authority and by consensus. In American Samoa, for example, matai and families
  "make decisions not by pure majoritarian democracy but by consensus," though "Samoan
  custom must give way to the laws of the United States and American Samoa" [@asbar-samoan-customs-digest].
  The Northern Mariana Islands codifies Carolinian custom on family land [@cmc-8-2904-carolinian-custom-family-land].
characteristics:
  who_decides: [a-traditional-leader, a-community-body, varies]
  outcome: [varies]
  neutral_role: [varies]
  participation: [expected-by-custom, required-by-court-or-law]
  settings: [community]
  note: >-
    A general category only: specific customary processes get their own records with
    their own names (see related). It is also the category for a Native nation's
    traditional forum when the nation's law does not call it peacemaking, such as
    Spirit Lake's Wodakota: Traditional Court [@spirit-lake-title-21-wodakota] or
    Hopi village authority over family disputes [@hopi-constitution-nill].
related: [samoan-family-meeting, samoan-affairs-pre-filing-hearing, ifoga, peacemaking, elders-council]
sources: [asbar-samoan-customs-digest, cmc-8-2904-carolinian-custom-family-land,
  ristroph-2008-survival-customary-law-nmi, teichert-1999-resisting-temptations-samoan-custom,
  spirit-lake-title-21-wodakota, hopi-constitution-nill]
basis: source-and-project-analysis
status: proposed
