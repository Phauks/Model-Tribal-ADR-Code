id: family-group-conference
name: family group conference
also_known_as: [family group conferencing, extended family hearing, peacemaker conference]
classification: unsettled
classification_note: >-
  (project analysis) The Tribal codes recorded so far place family group conferences
  inside child welfare and youth proceedings, and some describe them as part of a
  peacemaking program. The project has not decided whether the general category is ADR,
  a court process, or a frame for a nation's own practice. Its origins are not yet
  recorded with a source.
tradition: [indigenous, community, hybrid]
definition: >-
  (project analysis) A meeting of a child or youth, the extended family, and others
  involved, held to agree on a plan the court can adopt. Examples:
  Jamestown S'Klallam and Nisqually youth codes provide for a Peacemaker Conference that
  aims at a written agreed disposition, such as a Family Preservation Plan
  [@jamestown-sklallam-title-33-youth-code; @nisqually-title-50-youth-code]. At Salt
  River, the juvenile court may appoint a Community member qualified to act as an elder
  to conduct an extended family hearing under Pima and Maricopa customs
  [@national-center-on-restorative-justice-restorative-justice-tribal-laws-database].
characteristics:
  who_decides: [the-parties, a-court-or-agency, varies]
  outcome: [binding-if-parties-agree, advisory, varies]
  neutral_role: [facilitative, advisory, guiding-or-teaching, varies]
  participation: [voluntary, required-by-court-or-law, varies]
  settings: [court-connected, community]
related: [circle-process, peacemaking, restorative-justice, mediation]
sources: [jamestown-sklallam-title-33-youth-code, nisqually-title-50-youth-code,
  national-center-on-restorative-justice-restorative-justice-tribal-laws-database]
basis: source-and-project-analysis
status: adopted
