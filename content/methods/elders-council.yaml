id: elders-council
name: elders council
also_known_as: [court of elders, panel of elders, elders panel, traditional court]
classification: own-tradition
tradition: [indigenous]
definition: >-
  (project analysis) A body of a nation's elders that resolves disputes, or advises a
  court, by the nation's own law and custom. The forms differ a great deal from nation to
  nation:
  Tlingit & Haida's Court of Elders gives advisory opinions to the Tribal Court and, when
  the parties ask, hears and mediates disputes by traditional law
  [@ccthita-title-06-tribal-courts-2022]. The Ho-Chunk Traditional Court provides
  knowledge of custom and core values within the Judiciary [@ho-chunk-1-hcc-1-judiciary-act].
  At Mille Lacs, the court enters a panel of elders' decision in a cultural cause of action
  as its own judgment [@mille-lacs-title-5-judicial-branch]. White Earth's Panel of
  Elders advises the Tribal Court [@white-earth-judicial-code]. Tulalip's Tribal Court
  Elders Panel meets with young first-time offenders [@tulalip-tribal-court-elders-panel].
  Santee Sioux law directs that a traditional forum with elders be set up
  [@national-center-on-restorative-justice-restorative-justice-tribal-laws-database].
characteristics:
  who_decides: [a-community-body, a-traditional-leader, a-court-or-agency, varies]
  outcome: [binding, advisory, varies]
  neutral_role: [adjudicative, advisory, facilitative, guiding-or-teaching, varies]
  participation: [voluntary, required-by-court-or-law, varies]
  settings: [court-connected, community]
  note: >-
    Record each nation's body under its own name on the nation's profile. Some are
    adjudicative, some advisory, and some are diversion programs; this record is only
    the general category.
related: [peacemaking, customary-dispute-resolution, restorative-justice]
sources: [ccthita-title-06-tribal-courts-2022, ho-chunk-1-hcc-1-judiciary-act,
  mille-lacs-title-5-judicial-branch, white-earth-judicial-code, tulalip-tribal-court-elders-panel,
  national-center-on-restorative-justice-restorative-justice-tribal-laws-database]
basis: source-and-project-analysis
status: proposed
