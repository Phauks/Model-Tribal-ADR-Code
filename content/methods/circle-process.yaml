id: circle-process
name: circle process
also_known_as: [talking circle, peacemaking circle, healing circle, traditional circle]
classification: unsettled
classification_note: >-
  (project analysis) Some nations hold circles as their own practice, and some codes
  describe them as restorative justice. The project has not decided how to classify the
  general category. A nation's own circle is recorded on its profile under the nation's
  name and is never filed under ADR.
tradition: [indigenous, community, hybrid]
definition: >-
  (project analysis) A meeting where the participants sit in a circle and speak in turn,
  so that the people involved, their families and the community can reach a shared
  agreement. Examples:
  Little Traverse Bay Bands' Mnodaawin Peacemaking Circles bring together the juvenile,
  family, elders and community, and work until everyone signs a written consensus
  agreement [@ltbb-judicial-branch-peacemaking-page]. The White Earth juvenile code
  describes circles that use "traditional circle ritual and structure"
  [@white-earth-juvenile-justice-code]. The Chippewa Cree domestic relations code refers
  to Traditional Circle sessions in child support matters
  [@national-center-on-restorative-justice-restorative-justice-tribal-laws-database].
  Pit River uses a Healing Circle [@pit-river-title-8-chapter-15-peacemaker-program].
characteristics:
  who_decides: [the-parties, a-community-body, varies]
  outcome: [binding-if-parties-agree, varies]
  neutral_role: [facilitative, guiding-or-teaching, varies]
  participation: [voluntary, required-by-court-or-law, varies]
  settings: [community, court-connected]
related: [peacemaking, restorative-justice, family-group-conference, elders-council]
sources: [ltbb-judicial-branch-peacemaking-page, white-earth-juvenile-justice-code,
  national-center-on-restorative-justice-restorative-justice-tribal-laws-database,
  pit-river-title-8-chapter-15-peacemaker-program]
basis: source-and-project-analysis
status: adopted
