id: fact-finding
name: fact-finding
also_known_as: [factfinding, neutral fact-finding]
classification: alternative-dispute-resolution
tradition: [western-legal, governmental]
definition: >-
  A process in which a neutral investigates and reports on disputed facts. Federal
  law lists "factfinding" among the alternative means of dispute resolution [@usc-5-571,
  § 571(3)], and the Uniform Mediation Act's comment calls it an "adjudicative" process
  like arbitration [@uniform-law-commission-mediation-act, § 2 cmt. 1].
characteristics:
  who_decides: [a-neutral, the-parties]
  outcome: [advisory, varies]
  neutral_role: [adjudicative, advisory]
  participation: [varies]
  settings: [agency, workplace, private]
sources: [usc-5-571, uniform-law-commission-mediation-act]
basis: source-and-project-analysis
status: proposed
