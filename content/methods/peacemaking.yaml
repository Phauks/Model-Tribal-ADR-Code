id: peacemaking
name: peacemaking
classification: own-tradition
tradition: [indigenous]
definition: >-
  Traditional ways of resolving conflict in Indigenous communities. The Native American
  Rights Fund's Indigenous Peacemaking Initiative states that "peacemaking is not
  alternative dispute resolution" and that the term "refers to traditional ways of
  resolving conflict in Indigenous communities" [@narf-ipi-home]. It is "considerably
  different from litigation" [@porter-1997-strengthening-tribal-sovereignty-through-peacemaking,
  at 260].
characteristics:
  who_decides: [varies]
  outcome: [varies]
  neutral_role: [guiding-or-teaching, varies]
  participation: [varies]
  settings: [community, court-connected]
  note: >-
    Each nation's process has its own name, form and rules; record those on the nation's
    profile, in the nation's own words. This record is only the general category.
glossary: peacemaking
sources: [narf-ipi-home, porter-1997-strengthening-tribal-sovereignty-through-peacemaking,
  yazzie-1994-life-comes-from-it]
basis: source
status: proposed
