id: collaborative-law
name: collaborative law
classification: alternative-dispute-resolution
tradition: [western-legal]
definition: >-
  "Collaborative law is a voluntary process in which clients and their lawyers agree
  that the lawyers will represent the clients solely for purposes of settlement,
  and that the clients will hire new counsel if the case does not settle" [@uniform-law-commission-collaborative-law-rules-act].
  Nevada enacted the uniform act [@nevada-revised-statutes-38-400].
characteristics:
  who_decides: [the-parties]
  outcome: [binding-if-parties-agree]
  neutral_role: [no-neutral]
  participation: [required-by-contract]
  settings: [private]
broader: [negotiation]
sources: [uniform-law-commission-collaborative-law-rules-act, nevada-revised-statutes-38-400]
basis: source
status: proposed
