id: collaborative-law
name: collaborative law
classification: alternative-dispute-resolution
tradition: [western-legal]
definition: >-
  "Collaborative law is a voluntary, contractually based alternative dispute
  resolution process for parties who seek to negotiate a resolution of their matter
  rather than having a ruling imposed upon them by a court or arbitrator." Each party
  is represented by a lawyer, and "[t]he parties agree in advance that their lawyers
  are disqualified from further representing parties by appearing before a tribunal
  if the collaborative law process ends without complete agreement"
  [@uniform-law-commission-collaborative-law-rules-act, prefatory note at 1].
  Nevada enacted the uniform act [@nevada-revised-statutes-38-400].
characteristics:
  who_decides: [the-parties]
  outcome: [binding-if-parties-agree]
  neutral_role: [no-neutral]
  participation: [required-by-contract]
  settings: [private]
broader: [negotiation]
sources: [uniform-law-commission-collaborative-law-rules-act, nevada-revised-statutes-38-400]
basis: source
status: adopted
