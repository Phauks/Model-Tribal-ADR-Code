id: conciliation
name: conciliation
classification: alternative-dispute-resolution
tradition: [western-legal, governmental]
definition: >-
  A process in which a third party helps the parties settle, listed by federal law
  alongside mediation without a separate definition [@usc-5-571, § 571(3)]; the Federal
  Mediation and Conciliation Service is charged to help parties to labor disputes
  "settle such disputes through conciliation and mediation" [@usc-29-173, § 173(a)].
  Guam uses the word for its court family conciliation service [@gca-19-ch-7-guam-conciliation-law].
  Sources use the term loosely and often interchangeably with mediation (project
  analysis).
characteristics:
  who_decides: [the-parties]
  outcome: [binding-if-parties-agree]
  neutral_role: [facilitative, advisory]
  participation: [varies]
  settings: [agency, court-connected, workplace]
related: [mediation]
sources: [usc-5-571, usc-29-173, gca-19-ch-7-guam-conciliation-law]
basis: source-and-project-analysis
status: proposed
