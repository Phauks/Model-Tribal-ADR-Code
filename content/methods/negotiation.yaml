id: negotiation
name: negotiation
classification: alternative-dispute-resolution
tradition: [western-legal]
definition: >-
  The parties, or their representatives, communicate directly to reach an agreement,
  without a third party. It is the base process the others build on: the federal
  definitions of ADR list processes in which a neutral "participates to assist" [@usc-28-651],
  and the leading casebook places negotiation first among dispute resolution processes
  [@goldberg-sander-rogers-cole-2020-dispute-resolution] (project analysis).
characteristics:
  who_decides: [the-parties]
  outcome: [binding-if-parties-agree]
  neutral_role: [no-neutral]
  participation: [voluntary]
  settings: [varies]
sources: [usc-28-651, goldberg-sander-rogers-cole-2020-dispute-resolution, fisher-ury-patton-2011-getting-to-yes]
basis: source-and-project-analysis
status: adopted
