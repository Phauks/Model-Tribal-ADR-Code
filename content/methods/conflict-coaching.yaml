id: conflict-coaching
name: conflict coaching
classification: alternative-dispute-resolution
tradition: [western-legal, governmental]
definition: >-
  "A one on one voluntary and confidential process that combines ADR and coaching
  principles. An individualized method for helping one person develop skills and
  strategies to constructively manage interpersonal conflicts" [@doi-cadr, Conflict
  Coaching].
characteristics:
  who_decides: [the-parties]
  outcome: [not-binding]
  neutral_role: [guiding-or-teaching]
  participation: [voluntary]
  settings: [agency, workplace]
  note: >-
    Only one party takes part, which no other recorded method allows (project analysis).
sources: [doi-cadr]
basis: source
status: proposed
