id: council-hearing
name: council hearing
classification: governmental-process
tradition: [governmental, indigenous]
definition: >-
  (project analysis) A nation's governing council hears and decides a dispute itself,
  or must act on a claim before anyone may sue. Under the Hopi Constitution, when villages
  dispute a matter, a village's Kikmongwi may ask for a special Council meeting. The
  Council hears representatives and witnesses, then decides by majority vote
  [@hopi-constitution-nill]. Hopland's Tribal Claims Ordinance requires claims for money
  against the Tribe to be presented to the Tribal Council before suit
  [@hopland-title-12-tribal-court].
characteristics:
  who_decides: [a-community-body]
  outcome: [binding, varies]
  neutral_role: [adjudicative, varies]
  participation: [voluntary, required-by-court-or-law, varies]
  settings: [legislative-or-rulemaking, community]
related: [administrative-adjudication, government-to-government-issue-resolution]
sources: [hopi-constitution-nill, hopland-title-12-tribal-court]
basis: source-and-project-analysis
status: proposed
