id: summary-jury-trial
name: summary jury trial
classification: alternative-dispute-resolution
tradition: [western-legal]
definition: >-
  "The summary jury trial (SJT) is a nonbinding ADR process presided over by a district
  or magistrate judge and designed to promote settlement in trial-ready cases. The
  process provides litigants and their counsel with an advisory verdict after an
  abbreviated hearing in which evidence is presented to a jury by counsel in summary
  form" [@plapinger-stienstra-1996-adr-and-settlement-sourcebook, Definitions and
  Key Features, Summary Jury Trial].
characteristics:
  who_decides: [the-parties]
  outcome: [advisory]
  neutral_role: [advisory]
  participation: [required-by-court-or-law, voluntary]
  settings: [court-connected]
related: [short-trial]
sources: [plapinger-stienstra-1996-adr-and-settlement-sourcebook]
basis: source
status: adopted
