id: settlement-conference
name: settlement conference
also_known_as: [judicial settlement conference]
classification: court-process
tradition: [western-legal]
definition: >-
  "The most common form of settlement assistance used in federal courts is the settlement
  conference presided over by a district or magistrate judge ... The classic role
  of the settlement judge is to give an assessment of the merits of the case and
  to facilitate the trading of settlement offers" [@plapinger-stienstra-1996-adr-and-settlement-sourcebook,
  Definitions and Key Features, Judge-Hosted Settlement Conferences]. Federal Rule
  of Civil Procedure 16 lets a court consider "settling the case and using special
  procedures to assist in resolving the dispute" at a pretrial conference [@frcp-16-c-2-i].
characteristics:
  who_decides: [the-parties]
  outcome: [binding-if-parties-agree]
  neutral_role: [evaluative, facilitative]
  participation: [required-by-court-or-law]
  settings: [court-connected]
related: [mediation, settlement-week]
sources: [plapinger-stienstra-1996-adr-and-settlement-sourcebook, frcp-16-c-2-i]
basis: source
status: adopted
