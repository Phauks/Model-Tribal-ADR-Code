land_establishment:
- land_area: Uintah Valley Reserve, Utah Territory
  method: executive-order
  instrument: Exec. Order of Oct. 3, 1861, 1 Kappler 900
  date: '1861-10-03'
  detail: First set aside
  source: executive-order-1861-10-03-uintah-valley-reservation
  confidence: high
  verification: read-in-full
  locator: 1 Kappler 900
  note: 'The instrument reads: “that the Uintah Valley, in the Territory of Utah, be set apart and reserved for the use and occupancy of Indian tribes”. President Lincoln''s order reads "Let the reservation be established, as recommended by the Secretary of the Interior." Kappler cites the Acts of May 5, 1864 (13 Stat. 63) and May 24, 1888 (25 Stat. 157). The Uncompahgre Reserve (Exec. Order of Jan. 5, 1882) was added for the Uncompahgre Utes.'
