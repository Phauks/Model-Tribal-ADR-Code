    dispute_resolution_summary: The parties exchange written notice and a written response within 15 days
      and must meet and confer within 30 days; if unresolved 30 calendar days after the first meeting
      either party may seek arbitration under the American Arbitration Association Commercial Arbitration
      Rules before one neutral arbitrator (or three if either party objects), though neither is required
      to agree to arbitrate, and disagreements not resolved by arbitration or other agreed means may go
      to the United States District Court or a state court in the County for injunctive, declaratory or
      specific-performance relief only, under a limited waiver of sovereign immunity.
