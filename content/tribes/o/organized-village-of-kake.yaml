dispute_resolution:
  forums:
  - kind: peacemaking
    name: Keex’ Kwaan Peacemaking Court (Standing Peacemaking Panels and Peacemaking Circles)
    own_term:
      name: Keex’ Kwaan
      language_tag: tli
      translation: Kake (the code uses it as the Tribe's own name for Kake, Alaska)
    description: 'The Tribe''s court, in which its judicial powers are vested, organized as peacemaking:
      a standing pool of at least twelve peacemakers (Council members and resident citizens) sitting in
      panels of three, Peacemaking Circles led by a Keeper of the Circle recognized by the Council, a
      Court of Appeals, and other courts the Council may create. The code applies written tribal laws
      and Keex’ Kwaan cultural values and traditions, and states that the ancestors formed the clan of
      Guwakaan, the Deer People, as the process of peacemaking, which no moiety claims.'
    legal_basis: Keex’ Kwaan Judicial Peacemaking Code, Chapter 1, Sections 1-12 (under Article V of the
      OVK Constitution)
    case_types:
    - family
    - civil
    - criminal-sentencing
    - juvenile
    - other
    participation: voluntary-or-court-referred
    relationship_to_court: The peacemaking court is the Tribe's judiciary; a review team of peacemakers
      decides whether to take a petition and whether to use a circle or a panel.
    enforcement: Panels decide by consensus when possible and otherwise by majority vote; circles decide
      by consensus written as Consensus Agreements of the court, with set follow-up; if a circle cannot
      reach consensus the case goes to a panel.
    link: https://peacemaking.narf.org/wp-content/uploads/2025/07/Kake-judical_peacemaking_code.pdf
    source: kake-keex-kwaan-judicial-peacemaking-code
    confidence: medium
    as_of: '2025'
    locator: Chapter 1, Sections 1, 2, 3, 7, 8, 9
    note: Read from OCR of a scanned copy. Peacemakers may consult Elders and Council members (Section
      9). NARF notes the code includes a Peacemaker Appellate Court and a Circle Peacemaking flow chart.
      as_of is NARF posting year.
  - kind: restorative-justice
    name: Kake Youth Circle Peacemaking (Kake Youth Community Restorative Peacemaking)
    description: Part of the OVK Tribal Court system, encouraging responsible choices among youth, involving
      them in decisions about peers' problems, and producing Consensus Agreements designed to help and
      heal victims, wrongdoers and the Village; options include community service, restitution, apologies,
      essays, events, counseling by professionals, Elders or peers, talking circles and traditional activities.
    legal_basis: Keex’ Kwaan Judicial Peacemaking Code, Chapter 4, Sections 1-13
    case_types:
    - juvenile
    participation: court-referred
    relationship_to_court: Established by the OVK Council as part of the Tribal Court system, with a youth
      coordinator, youth panel and mentors.
    enforcement: Consensus agreements with proof-of-compliance provisions and consequences for failure
      to comply (Section 12); appeals under Section 13.
    link: https://peacemaking.narf.org/wp-content/uploads/2025/07/Kake-judical_peacemaking_code.pdf
    source: kake-keex-kwaan-judicial-peacemaking-code
    confidence: medium
    as_of: '2025'
    locator: Chapter 4, Sections 1, 2, 11, 12
    note: Participation recorded as court-referred because the chapter is part of the court system; voluntariness
      was not confirmed in the pages read.
