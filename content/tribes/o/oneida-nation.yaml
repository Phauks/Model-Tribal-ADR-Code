dispute_resolution:
  forums:
  - kind: peacemaking
    name: Peacemaking and Mediation Division of the Trial Court (peacemaking)
    description: A division of the Trial Court providing peacemaking at all stages of litigation, including
      appeals, by peacemakers recognized either by the Nation's Cultural Heritage Department or by the
      Trial Court, as the parties choose; the law states culturally sensitive information may be omitted
      from the procedural rules.
    legal_basis: 8 O.C. 801.6 (Peacemaking and Mediation Division); 7 O.C. 702.6; 7 O.C. 705.7
    case_types:
    - family
    - civil
    - other
    participation: voluntary-or-court-referred
    relationship_to_court: Judges must inform parties in every case of peacemaking and mediation and may
      refer parties who agree to attend, except where attendance would cause undue hardship or endanger
      a party; the court bears the cost of referred sessions.
    enforcement: A written agreement certified by the peacemaker is submitted to the judge and included
      in the order as a stipulation; violation of the resulting order is punishable as contempt.
    link: https://peacemaking.narf.org/wp-content/uploads/2025/07/Oneida-Chapter-801-Judiciary.pdf
    source: oneida-wi-8-oc-801-judiciary
    confidence: medium
    verification: read-in-full
    as_of: '2025'
    locator: 8 O.C. 801.4-2, 801.6-1 to 801.6-5
    note: Peacemakers may not act in contempt matters or issue process. Proceedings are closed to the
      public (801.4-4). as_of is NARF posting year.
  - kind: mediation
    name: Peacemaking and Mediation Division of the Trial Court (mediation)
    description: Mediation provided by persons or entities recognized and contracted by the Trial Court;
      each mediator must have at least 25 hours of mediation training or 3 years of dispute resolution
      experience, and in divorce matters training on domestic violence.
    legal_basis: 8 O.C. 801.6-4; 7 O.C. 702.6-3; 7 O.C. 705.7
    case_types:
    - family
    - civil
    - other
    participation: voluntary-or-court-referred
    relationship_to_court: Available at all stages of litigation on court referral with the parties' agreement;
      parties may instead use a private mediator at their own expense after filing notice with the clerk.
    enforcement: Agreement is written, reviewed by counsel if any, certified by the mediator, and included
      in the court's order as a stipulation; violation is punishable as contempt.
    link: https://peacemaking.narf.org/wp-content/uploads/2025/07/Oneida-Chapter-801-Judiciary.pdf
    source: oneida-wi-8-oc-801-judiciary
    confidence: medium
    verification: read-in-full
    as_of: '2025'
    locator: 8 O.C. 801.6-4, 801.6-5
  provisions:
  - kind: peacemaking
    title: Peacemaking and Mediation Division
    citation: Oneida Code of Laws 8 O.C. 801.6
    summary: Establishes the Peacemaking and Mediation Division of the Trial Court, referral rules, peacemaker
      and mediator standards, and entry of agreements as stipulated orders.
    link: https://peacemaking.narf.org/wp-content/uploads/2025/07/Oneida-Chapter-801-Judiciary.pdf
    source: oneida-wi-8-oc-801-judiciary
    confidence: medium
    as_of: '2025'
  - kind: mediation
    title: Divorce, Annulment, Legal Separation – Peacemaking and Mediation
    citation: Oneida Code of Laws 7 O.C. 702.6
    summary: Allows referral of divorce, annulment and legal separation parties to peacemaking or mediation
      with their agreement, with a domestic abuse screen and mediator training requirements.
    link: https://peacemaking.narf.org/wp-content/uploads/2025/07/Oneida-Chapter-702-Divorce-Annulment-Legal-Separation-BC-05-15-14-B.pdf
