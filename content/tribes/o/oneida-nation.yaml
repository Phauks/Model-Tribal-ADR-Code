  - kind: peacemaking
    title: Title 8. Judicial System, Chapter 801 – Judiciary, Rule 1.10 – Peacemaking and Mediation
    citation: Title 8. Judicial System, Chapter 801 – Judiciary, Rule 1.10 – Peacemaking and Mediation
    link: https://peacemaking.narf.org/wp-content/uploads/2025/07/Oneida-Chapter-801-Judiciary.pdf
    source: narf-ipi-tribal-peacemaking-laws
    confidence: medium
    verification: read-in-full
    as_of: '2025-09-29'
    locator: Oneida Nation of Wisconsin
    note: 'Native American Rights Fund description (provision itself not read): Provides procedures, qualifications,
      referral procedures, standards of conduct, and authority of Tribal Court or Cultural Heritage Department
      to appoint peacemakers.'
  - kind: peacemaking
    title: 702.6. Peacemaking and Mediation
    citation: Oneida Code Chapter 702 Divorce, Annulment and Legal Separation, 702.6
    link: https://peacemaking.narf.org/wp-content/uploads/2025/07/Oneida-Chapter-702-Divorce-Annulment-Legal-Separation-BC-05-15-14-B.pdf
    source: oneida-wi-7-oc-702-divorce
    confidence: medium
    verification: read-in-full
