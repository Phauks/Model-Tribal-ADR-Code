    locator: '702.6'
    note: Read in full on 2026-11-22 (review queue item 2).
    summary: Lets the court refer divorce, annulment and legal separation parties who agree to peacemaking
      or mediation, unless attendance would cause undue hardship or endanger a party, with the court paying
      the cost, and makes any agreement reached on those issues a stipulation in the court's order once
