dispute_resolution:
  forums:
  - kind: peacemaking
    name: Peacemaking and Mediation Division of the Trial Court (peacemaking)
    description: A division of the Trial Court providing peacemaking at all stages of litigation, including
      appeals, by peacemakers recognized either by the Nation's Cultural Heritage Department or by the
      Trial Court, as the parties choose; the law states culturally sensitive information may be omitted
      from the procedural rules.
    legal_basis: 8 O.C. 801.6 (Peacemaking and Mediation Division); 7 O.C. 702.6; 7 O.C. 705.7
    case_types:
    - family
    - civil
    - other
    participation: voluntary-or-court-referred
    relationship_to_court: Judges must inform parties in every case of peacemaking and mediation and may
      refer parties who agree to attend, except where attendance would cause undue hardship or endanger
      a party; the court bears the cost of referred sessions.
    enforcement: A written agreement certified by the peacemaker is submitted to the judge and included
      in the order as a stipulation; violation of the resulting order is punishable as contempt.
    link: https://peacemaking.narf.org/wp-content/uploads/2025/07/Oneida-Chapter-801-Judiciary.pdf
    source: oneida-wi-8-oc-801-judiciary
    confidence: medium
    verification: read-in-full
    as_of: '2025'
    locator: 8 O.C. 801.4-2, 801.6-1 to 801.6-5
    note: Peacemakers may not act in contempt matters or issue process. Proceedings are closed to the
      public (801.4-4). as_of is NARF posting year.
  - kind: mediation
    name: Peacemaking and Mediation Division of the Trial Court (mediation)
    description: Mediation provided by persons or entities recognized and contracted by the Trial Court;
      each mediator must have at least 25 hours of mediation training or 3 years of dispute resolution
      experience, and in divorce matters training on domestic violence.
    legal_basis: 8 O.C. 801.6-4; 7 O.C. 702.6-3; 7 O.C. 705.7
    case_types:
    - family
    - civil
    - other
    participation: voluntary-or-court-referred
    relationship_to_court: Available at all stages of litigation on court referral with the parties' agreement;
      parties may instead use a private mediator at their own expense after filing notice with the clerk.
    enforcement: Agreement is written, reviewed by counsel if any, certified by the mediator, and included
      in the court's order as a stipulation; violation is punishable as contempt.
    link: https://peacemaking.narf.org/wp-content/uploads/2025/07/Oneida-Chapter-801-Judiciary.pdf
    source: oneida-wi-8-oc-801-judiciary
    confidence: medium
    verification: read-in-full
    as_of: '2025'
    locator: 8 O.C. 801.6-4, 801.6-5
  provisions:
  - kind: peacemaking
    title: Peacemaking and Mediation Division
    citation: Oneida Code of Laws 8 O.C. 801.6
    summary: Establishes the Peacemaking and Mediation Division of the Trial Court, referral rules, peacemaker
      and mediator standards, and entry of agreements as stipulated orders.
    link: https://peacemaking.narf.org/wp-content/uploads/2025/07/Oneida-Chapter-801-Judiciary.pdf
    source: oneida-wi-8-oc-801-judiciary
    confidence: medium
    verification: read-in-full
    as_of: '2025'
  - kind: peacemaking
    title: Divorce, Annulment, Legal Separation – Peacemaking and Mediation
    citation: Oneida Code of Laws 7 O.C. 702.6
    summary: Allows referral of divorce, annulment and legal separation parties to peacemaking or mediation
      with their agreement, with a domestic abuse screen and mediator training requirements.
    link: https://peacemaking.narf.org/wp-content/uploads/2025/07/Oneida-Chapter-702-Divorce-Annulment-Legal-Separation-BC-05-15-14-B.pdf
    source: oneida-wi-7-oc-702-divorce
    confidence: medium
    verification: read-in-full
    as_of: '2014-05-15'
  - kind: peacemaking
    title: Child Custody, Placement and Visitation – Peacemaking and Mediation
    citation: Oneida Code of Laws 7 O.C. 705.7
    link: https://peacemaking.narf.org/wp-content/uploads/2025/07/Oneida-Chapter-705-Child-Custody-Placement-and-Visitation-BC-05-15-14-E.pdf
    source: oneida-wi-7-oc-705-custody
    confidence: medium
    verification: read-in-full
    as_of: '2014-05-15'
    note: Read in full on 2026-11-23 (Title 7. Children, Elders and Family - Chapter 705 Child Custody, Placement, and Visitation; adopted BC-06-24-09-D, amended through BC-05-15-14-E). Section 705.7 read in full (Oneida Code 7 O.C. 705, last amended BC-05-15-14-E). Referral requires party agreement; Court-paid costs on referral (705.7-1); recognized peacemakers (705.7-2); mediator qualifications and powers (705.7-3); written agreement submitted as a stipulation, which the Court may reject (705.7-4); post-order referral (705.7-5). No appeals provision in 705.7; NARF's reference to 702.6 was not checked. Gate 1 item 3 review, research/reviews/2026-11-23-text-read-tier.json, record 366.
    summary: In a custody, placement or visitation case the Court may refer the parents to peacemaking or mediation only if they agree, and not where attending would cause undue hardship or endanger a party (evidence of domestic abuse is considered); the Court pays when it refers. Peacemakers are those recognized by the Tribe's Cultural Heritage Department or the Court, and the parties choose the type; mediators need 25 hours of training or 3 years of experience plus domestic violence training. An agreement is written, certified by the peacemaker or mediator and submitted to the Court as a stipulation in the order; the Court may reject it if not in the child's best interest, giving written reasons. If there is no agreement the Court is told and the parties may return to peacemaking before trial. After an order, the Court may also refer a parent to peacemaking or mediation to resolve problems (705.7-5).
    locator: 7 O.C. 705.7-1 to 705.7-5
  - kind: peacemaking
    title: Title 8. Judicial System, Chapter 801 – Judiciary, Rule 1.10 – Peacemaking and Mediation
    citation: Title 8. Judicial System, Chapter 801 – Judiciary, Rule 1.10 – Peacemaking and Mediation
    link: https://peacemaking.narf.org/wp-content/uploads/2025/07/Oneida-Oneida-Trial-Court-Rules.pdf
    source: oneida-wi-trial-court-rules
    confidence: medium
    verification: read-in-full
    as_of: '2025-09-29'
    locator: Oneida Trial Court Rules, Rule 1.10 (1.10-1 to 1.10-5)
    note: 'Read in full on 2026-11-23 (Title 8. Judicial System, Chapter 801 Judiciary, Rule #1 Oneida Trial Court Rules; original effective date 09-25-2019). Rule 1.10 read in full (original effective date 09-25-2019). The Cultural Heritage Department''s recognition is one way to show qualification (1.10-2(a)(1)); it does not appoint peacemakers. The earlier note repeating NARF''s wording that the Department has authority to appoint peacemakers was wrong. Referral procedure is in 8 O.C. 801.6-2, not read here. Gate 1 item 3 review, research/reviews/2026-11-23-text-read-tier.json, record 367.'
    summary: Sets who may serve as a Trial Court peacemaker or mediator and how they are used. Outsiders apply to the Court Administrator, pass a background check and are approved by the judges after an interview. Before being used a person must show understanding of the role (training, prior Trial Court work, recognition by the Cultural Heritage Department or another jurisdiction, or other means the Court accepts). The Trial Court may refer parties under 8 O.C. 801.6-2, keeps the list and selects from it, and no one with an interest in the case may be appointed without the parties' consent. Peacemakers must keep cases confidential, avoid conflicts and give the Court a written update within three business days of a session; the Trial Court hears complaints and may discipline, including removal from the list; pay is at a reasonable rate set by the Court, and nothing is paid for work by a full-time Judge.
  - kind: peacemaking
    title: 702.6. Peacemaking and Mediation
    citation: Oneida Code Chapter 702 Divorce, Annulment and Legal Separation, 702.6
    link: https://peacemaking.narf.org/wp-content/uploads/2025/07/Oneida-Chapter-702-Divorce-Annulment-Legal-Separation-BC-05-15-14-B.pdf
    source: oneida-wi-7-oc-702-divorce
    confidence: medium
    verification: read-in-full
    as_of: '2014-05-15'
    locator: '702.6'
    note: Read in full on 2026-11-22 (review queue item 2).
    summary: Lets the court refer divorce, annulment and legal separation parties who agree to peacemaking
      or mediation, unless attendance would cause undue hardship or endanger a party, with the court paying
      the cost, and makes any agreement reached on those issues a stipulation in the court's order once
      counsel review it and the peacemaker or mediator certifies it.
  training_programs:
