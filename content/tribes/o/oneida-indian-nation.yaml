dispute_resolution:
  forums:
  - kind: peacemaking
    name: Peacemaker Court of the Oneida Indian Nation (Peacemakers division of the Trial Court)
    description: The Trial Court includes a Peacemakers division; peacemaking is to be encouraged in all cases and is governed by the Peacemaking Rules in effect from time to time. Peacemakers are persons with experience in peacemaking, arbitration or mediation. The Peacemaking Rules establish the Peacemaker Court as part of the Nation Court System to give formal support, structure and enforcement to traditional Oneida Indian Nation methods of resolving disputes; peacemaking uses Nation religious or other traditional ways of mediation and problem-solving.
    legal_basis: Oneida Indian Nation Ordinance O-97-02, preamble, Article 8 (Peacemaking) and Article 12(1)(g); Oneida Indian Nation Peacemaking Rules 1-18
    case_types:
    - civil
    - other
    participation: voluntary-or-court-referred
    relationship_to_court: The Chief Judge of the Trial Court appoints a peacemaker in any matter deemed appropriate or where a party requests peacemaking.
    enforcement: Peacemakers may decide a matter only if all parties agree in writing, and such a decision has the effect of a court judgment when entered by the Nation Court; peacemakers may request contempt for persons who ignore subpoenas.
    link: https://peacemaking.narf.org/wp-content/uploads/2025/07/Oneida-NY-OneidaNationCourt.pdf
    source: oneida-indian-nation-ordinance-o-97-02
    confidence: medium
    verification: read-in-full
    as_of: '1997-05-01'
    locator: Articles 8 and 12
    note: Read in full on 2026-11-23 from page images (Oneida Indian Nation, Establishment of the Oneida Nation Court, Ordinance No. O-97-02, dated 5/1/97; Oneida Indian Nation Peacemaking Rules, 5/1/97). Peacemaking Rules read from OCR of a scanned copy dated 5/1/97 (source oneida-indian-nation-peacemaking-rules-1997); attorneys are barred unless witnesses or parties (Rule 3). The ordinance also refers to a Claims Commission established by Ordinance O-94-02A. Gate 1 item 3 review, research/reviews/2026-11-23-text-read-tier.json, record 356.
  provisions:
  - kind: peacemaking
    title: Ordinance O-97-02, Article 8 – Peacemaking
    citation: Oneida Indian Nation Ordinance O-97-02, Art. 8
    summary: Directs that peacemaking be encouraged in all cases before the Oneida Nation Court under
      the Peacemaking Rules.
    link: https://peacemaking.narf.org/wp-content/uploads/2025/07/Oneida-NY-OneidaNationCourt.pdf
    source: oneida-indian-nation-ordinance-o-97-02
    confidence: medium
    verification: read-in-full
    as_of: '1997-05-01'
  - kind: peacemaking
    title: Oneida Indian Nation Peacemaking Rules
    citation: Oneida Indian Nation Peacemaking Rules
    link: http://www.narf.org/nill/codes/oneida_new_york/peacemaking.html
    source: oneida-indian-nation-peacemaking-rules-1997
    confidence: medium
    verification: read-in-full
    as_of: '2025-09-29'
    locator: Rules 1-18 (Peacemaking Rules dated 5/1/1997)
    note: 'Read in full on 2026-11-23 (Oneida Indian Nation Peacemaking Rules, dated 5/1/1997 (NILL copy: ''Last amended: 2004'')). Rules 1-18 read in full from the NILL copy (''Last amended: 2004'') and checked against the NARF PDF (dated 5/1/97; pages 1-2 viewed as images). Covers purpose and establishment (1-2), jurisdiction and attorney bar (3), appointment and powers (4-5), limits and duties (6-7), clerk and reports (8-9), requests, transfer by consent and disqualification (10-11), notice and subpoenas (12-13), agreements as court orders (14), conduct and complaints (15-17). Gate 1 item 3 review, research/reviews/2026-11-23-text-read-tier.json, record 358.'
    summary: Establishes the Peacemaker Court as part of the Oneida Nation Court system under the Chief Trial Judge. The Chief Trial Judge appoints a peacemaker when a party requests one or in any matter deemed appropriate, but a case is transferred only with the written consent of all parties, any of whom may block the transfer or withdraw consent and return the case to the Trial Court. Attorneys are barred unless they are witnesses or parties. Peacemakers use Nation traditional ways, may compel witnesses by subpoena, and may decide a dispute only if all parties agree in writing. The parties' agreement, or such a decision, becomes a judgment of the Nation Court enforced like any other order.
  - kind: other
    title: Ordinance O-97-02, Establishment of the Oneida Nation Court (Art. 8 Peacemaking)
    citation: Oneida Indian Nation Ordinance No. O-97-02, Art. 8 and Art. 12(I)(g)
    link: https://peacemaking.narf.org/wp-content/uploads/2025/07/Oneida-NY-OneidaNationCourt.pdf
    source: oneida-indian-nation-ordinance-o-97-02
    confidence: medium
    verification: read-in-full
    as_of: '2025-09-29'
    locator: Art. 8; Art. 12, Part I(g); Art. 20
    note: Read in full on 2026-11-23 (Oneida Indian Nation, Establishment of the Oneida Nation Court, Ordinance No. O-97-02, enacted May 1997). Read in full from the NARF-hosted ordinance (enacted May 1997). Referral procedure, subpoena power, conduct standards and traditional-ways authority are in the Peacemaking Rules (record 358), not in this ordinance. Art. 3 excludes domestic relations (including juvenile and child neglect cases) from the Court's subject-matter jurisdiction. Gate 1 item 3 review, research/reviews/2026-11-23-text-read-tier.json, record 359.
    summary: Establishes the Oneida Nation Court with a Trial Court that includes a Peacemakers division, and an appellate court. Article 8 says peacemaking is encouraged in all cases before the Court and is governed by the Peacemaking Rules; Article 12(I)(g) requires peacemakers to have peacemaking, arbitration or mediation experience and has the Chief Judge of the Trial Court appoint one in any matter deemed appropriate or where a party requests it.
