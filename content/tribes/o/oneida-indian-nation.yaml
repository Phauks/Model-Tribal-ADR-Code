dispute_resolution:
  forums:
  - kind: peacemaking
    name: Peacemaker Court of the Oneida Indian Nation (Peacemakers division of the Trial Court)
    description: The Trial Court includes a Peacemakers division; peacemaking is to be encouraged in all
      cases and is governed by the Peacemaking Rules in effect from time to time. Peacemakers are persons
      with experience in peacemaking, arbitration or mediation. The Peacemaking Rules establish the Peacemaker
      Court as part of the Nation Court System to give formal support, structure and enforcement to traditional
      Oneida Indian Nation methods of resolving disputes; peacemaking uses Nation religious or other traditional
      ways of mediation and problem-solving.
    legal_basis: Oneida Indian Nation Ordinance O-97-02, preamble, Article 8 (Peacemaking) and Article
      12(1)(g); Oneida Indian Nation Peacemaking Rules 1-18
    case_types:
    - civil
    - other
    participation: voluntary-or-court-referred
    relationship_to_court: The Chief Judge of the Trial Court appoints a peacemaker in any matter deemed
      appropriate or where a party requests peacemaking.
    enforcement: Peacemakers may decide a matter only if all parties agree in writing, and such a decision
      has the effect of a court judgment when entered by the Nation Court; peacemakers may request contempt
      for persons who ignore subpoenas.
    link: https://peacemaking.narf.org/wp-content/uploads/2025/07/Oneida-NY-OneidaNationCourt.pdf
    source: oneida-indian-nation-ordinance-o-97-02
    confidence: medium
    verification: read-in-full
    as_of: '1997-05-01'
    locator: Articles 8 and 12
    note: Peacemaking Rules read from OCR of a scanned copy dated 5/1/97 (source oneida-indian-nation-peacemaking-rules-1997);
      attorneys are barred unless witnesses or parties (Rule 3). The ordinance also refers to a Claims
      Commission established by Ordinance O-94-02A.
