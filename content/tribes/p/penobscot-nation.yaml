- topic: public-law-280
  value: not-a-public-law-280-state
  detail: Maine is not one of the states that Public Law 280 required to take jurisdiction or that chose to take it, so the state has no Public Law 280 jurisdiction over the nation's Indian country in Maine. Other federal laws can still give a state some jurisdiction.
  source: bia-faq-public-law-280
  confidence: high
  verification: inferred
  as_of: '2017-07-18'
  locator: Answer, second and third paragraphs (the lists of mandatory and optional states)
  note: Inferred from the state's absence from both lists. Nation placed in Maine by the Census Bureau's land areas.
- topic: state-jurisdiction-statute
  value: state-criminal-and-civil-jurisdiction
  detail: The Maine Indian Claims Settlement Act subjects the Passamaquoddy Tribe and Penobscot Nation, their members and lands to Maine's jurisdiction as provided in the Maine Implementing Act, which applies state law and state court jurisdiction to them "except as otherwise provided." (Pub. L. No. 96-420, § 6(b)(1), 94 Stat. at 1794; Me. Rev. Stat. Ann. tit. 30, § 6204.)
  source: public-law-96-420
  confidence: high
  verification: read-in-full
  locator: Pub. L. 96-420 § 6(b)(1), 94 Stat. at 1793-94
  note: 'The Implementing Act also gives these two nations separate tribal jurisdiction in listed areas (30 M.R.S. §§ 6206, 6209-A, 6209-B; § 6(f) of the federal Act); the research read the federal grant and § 6204 only. § 6(c) removes federal criminal jurisdiction under 18 U.S.C. §§ 1152-1153 etc. Maine''s 2022-2023 tribal-state legislation was not analyzed. 25 U.S.C. § 1725 is "omitted" from the Code and is cited here as the Statutes at Large section. Also cites: maine-revised-statutes-title-30-section-6204.'
