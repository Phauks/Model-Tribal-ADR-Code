dispute_resolution:
  forums:
  - kind: peacemaking
    name: Peacemakers Circle
    description: A separate mediating branch established in the constitution's Dispute Resolution System;
      peacemakers are selected by the Nation's members at a General Council meeting and are responsible
      for mediating disputes voluntarily submitted by the parties.
    legal_basis: Constitution of the Prairie Band Potawatomi Nation, Article VI (Dispute Resolution System),
      Sections 1-3
    case_types:
    - civil
    - other
    participation: voluntary
    relationship_to_court: Established alongside, and separate from, the Judicial Council (District Court,
      Court of Appeals and Employment Disputes Tribunal); procedures are to be defined by Nation law.
    link: https://peacemaking.narf.org/wp-content/uploads/2025/07/Prarie-Band-Constitution.pdf
    source: prairie-band-potawatomi-constitution-2007
    confidence: medium
    verification: inferred
    as_of: '2007-12-06'
    locator: Article VI, Sections 1-3
    note: NARF's summary adds that the provision covers foreclosure of further District Court proceedings
      and an attorney ban; those details were not located in the Article VI text reviewed and may be in
      implementing law.
  - kind: administrative-adjudication
    name: Employment Disputes Tribunal
    description: A five-magistrate tribunal within the Judicial Council responsible for deciding all government
      employment related disputes; two magistrates are appointed by the Tribal Council, two by the Nation's
      employees, and one by the other four.
    legal_basis: Constitution of the Prairie Band Potawatomi Nation, Article VI, Sections 1-3
    case_types:
    - employment
    participation: required
    relationship_to_court: Part of the Judicial Council; the District Court's powers exclude government
      employment related disputes, which go to the Tribunal.
    link: https://peacemaking.narf.org/wp-content/uploads/2025/07/Prarie-Band-Constitution.pdf
    source: prairie-band-potawatomi-constitution-2007
    confidence: medium
    verification: inferred
    as_of: '2007-12-06'
    locator: Article VI
    note: 'Coined kind ''employment-tribunal'': an adjudicative forum with jointly appointed members,
      not a consensual process.'
  provisions:
  - kind: peacemaking
    title: Article VI – Dispute Resolution System
    citation: Constitution of the Prairie Band Potawatomi Nation, Art. VI
    summary: Establishes the Judicial Council (District Court, Court of Appeals, Employment Disputes Tribunal)
      and a separate Peacemakers Circle to mediate disputes voluntarily submitted.
    link: https://peacemaking.narf.org/wp-content/uploads/2025/07/Prarie-Band-Constitution.pdf
    source: prairie-band-potawatomi-constitution-2007
    confidence: medium
    verification: read-in-full
