dispute_resolution:
  forums:
  - kind: peacemaking
    name: Peacemakers Circle
    description: A separate mediating branch established in the constitution's Dispute Resolution System; peacemakers are selected by the Nation's members at a General Council meeting and are responsible for mediating disputes voluntarily submitted by the parties.
    legal_basis: Constitution of the Prairie Band Potawatomi Nation, Article VI (Dispute Resolution System), Sections 1-3
    case_types:
    - civil
    - other
    participation: voluntary
    relationship_to_court: Established alongside, and separate from, the Judicial Council (District Court, Court of Appeals and Employment Disputes Tribunal); procedures are to be defined by Nation law.
    link: https://peacemaking.narf.org/wp-content/uploads/2025/07/Prarie-Band-Constitution.pdf
    source: prairie-band-potawatomi-constitution-2007
    confidence: medium
    verification: read-in-full
    as_of: '2007-12-06'
    locator: Article VI, Sections 1-3
    note: 'Read in full on 2026-11-23 (Prairie Band Potawatomi Constitution, approved 12.6.2007 (Nation''s website)). Article VI read in full (Nation''s constitution, approved 2007-12-06). No case-type limit is stated: peacemakers mediate any dispute voluntarily submitted by the parties, so civil and other are the nearest recorded types. Peacemakers are selected by members at a General Council meeting and removed by their appointing authority (Sec. 2). NARF''s summary adds foreclosure of further District Court proceedings and an attorney ban; those details are not in Article VI and may be in implementing law, which was not found. Gate 1 item 3 review, research/reviews/2026-11-23-text-read-tier.json, record 411.'
    enforcement: The constitution does not say whether a peacemaking result is binding or enforced; it gives peacemakers power to mediate and leaves procedures to Nation law.
  - kind: administrative-adjudication
    name: Employment Disputes Tribunal
    description: A five-magistrate tribunal within the Judicial Council responsible for deciding all government employment related disputes; two magistrates are appointed by the Tribal Council, two by the Nation's employees, and one by the other four.
    legal_basis: Constitution of the Prairie Band Potawatomi Nation, Article VI, Sections 1-3
    case_types:
    - employment
    participation: required
    relationship_to_court: Part of the Judicial Council; the District Court's powers exclude government employment related disputes, which go to the Tribunal.
    link: https://peacemaking.narf.org/wp-content/uploads/2025/07/Prarie-Band-Constitution.pdf
    source: prairie-band-potawatomi-constitution-2007
    confidence: medium
    verification: read-in-full
    as_of: '2007-12-06'
    locator: Article VI
    note: 'Read in full on 2026-11-23 (Prairie Band Potawatomi Constitution, approved 12.6.2007 (Nation''s website)). Kind recorded as administrative-adjudication: an adjudicative forum with jointly appointed magistrates, not a consensual process. The constitution says the Tribunal decides all government employment related disputes and has power necessary to do so, but does not say how a case is brought, whether decisions can be appealed (the Court of Appeals reviews District Court decisions only) or how they are enforced; procedures are left to Nation law. Gate 1 item 3 review, research/reviews/2026-11-23-text-read-tier.json, record 412.'
  provisions:
  - kind: peacemaking
    title: Article VI – Dispute Resolution System
    citation: Constitution of the Prairie Band Potawatomi Nation, Art. VI
