- topic: state-jurisdiction-statute
  value: state-criminal-jurisdiction
  detail: Congress conferred on Kansas jurisdiction over offenses committed by or against Indians on Indian reservations in Kansas, including trust or restricted allotments, to the same extent as elsewhere in the State; federal courts keep jurisdiction over federal offenses. (18 U.S.C. § 3243.)
  source: us-code-title-18-section-3243
  confidence: high
  verification: read-in-full
  locator: 18 U.S.C. § 3243; Act of June 8, 1940, ch. 276, 54 Stat. 249
  note: 'Criminal only; no civil grant. The four roster entries list KS because of reservation or trust-land presence in Kansas (Iowa Tribe and Sac and Fox of Missouri straddle KS/NE). Also cites: statutes-at-large-54-249.'
