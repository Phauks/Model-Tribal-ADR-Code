jurisdiction:
- topic: public-law-280
  value: mandatory-state
  detail: 'California is a mandatory state: 18 U.S.C. § 1162(a) (criminal) and 28 U.S.C. § 1360(a) (civil)
    extend state jurisdiction to all Indian country within California. Applies to the nation''s Indian
    country within California; the statute itself does not identify which lands are Indian country.'
  source: us-code-title-18-section-1162
  confidence: medium
  verification: inferred
  as_of: '2010-07-29'
  locator: 18 U.S.C. § 1162(a) and 28 U.S.C. § 1360(a), entry "California"
  note: Statute is primary; nation matched to California by office state in the BIA Tribal Leaders Directory,
    so confidence is medium. Cited jointly with us-code-title-28-section-1360.
