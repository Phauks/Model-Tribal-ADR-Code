dispute_resolution:
  forums:
  - kind: peacemaking
    name: Pechanga peacemaking court
    description: Peacemaking court with general jurisdiction whose cases typically involve child welfare
      and family issues; two peacemaker judges, without robes, sit in a circle with the parties, family,
      community members and support services, passing a basket to speak and seeking a consensus that often
      includes restitution.
    case_types:
    - child-welfare
    - family
    link: http://www.judges.org/justice-in-a-circle/
    source: njc-justice-in-a-circle-2016
    confidence: medium
    verification: inferred
    as_of: '2016-11-20'
    note: Secondary source; the article says the court was created about two years earlier and had heard
      about a dozen cases. Participation, relationship to other Pechanga courts and enforcement are not
      described, so they are left out.
