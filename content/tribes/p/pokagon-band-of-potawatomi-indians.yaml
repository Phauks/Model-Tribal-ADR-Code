  detail: Indiana is not one of the states that Public Law 280 required to take jurisdiction or that chose to take it, so the state has no Public Law 280 jurisdiction over the nation's Indian country in Indiana. Other federal laws can still give a state some jurisdiction.
  source: bia-faq-public-law-280
  confidence: high
  verification: inferred
  as_of: '2017-07-18'
  locator: Answer, second and third paragraphs (the lists of mandatory and optional states)
  note: Inferred from the state's absence from both lists. Nation placed in Indiana by the Census Bureau's land areas.
