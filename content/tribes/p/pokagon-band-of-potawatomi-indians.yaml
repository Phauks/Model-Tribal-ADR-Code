dispute_resolution:
  forums:
  - kind: peacemaking
    name: Native Justice Community Conflict and Dispute Resolution Forum
    description: 'Native Justice, which the Band says is commonly referred to as peacemaking, uses talking
      circles and circle keepers to bring people in a dispute to common ground; circle keepers facilitate
      but do not decide, and participants set their own solution and consequences. The program has three
      strands: Native Justice for Court, the Community Conflict and Dispute Resolution Forum, and Community
      Education and Awareness.'
    case_types:
    - civil
    participation: voluntary
    relationship_to_court: Citizens may use the forum for civil disputes before coming to court; the court
      continues to handle criminal cases and encourages use of the forum for civil disputes.
    enforcement: Participants design the consequences if standards they set are not met.
    link: https://www.pokagonband-nsn.gov/government/tribal-courts/native-justice/
    source: pokagon-native-justice-page
    confidence: high
    verification: inferred
    as_of: '2026-11-21'
    note: The page says the process uses ceremonial traditions; no further detail is recorded.
  published_materials:
