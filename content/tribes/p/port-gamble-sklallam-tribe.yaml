    dispute_resolution_summary: After written notice the parties meet and confer within ten days; if the
      dispute is not resolved within twenty days of the first meeting either party may seek mediation,
      and if no mediator can be agreed either party may seek arbitration under the Judicial Arbitration
      Management Service (JAMS) of Seattle, whose decision is final and unappealable only if the parties
      so agree in writing beforehand or the compact specifically says so, and is otherwise reviewable
      de novo by a federal district judge.
