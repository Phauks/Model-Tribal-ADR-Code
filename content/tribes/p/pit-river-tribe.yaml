dispute_resolution:
  forums:
  - kind: restorative-justice
    name: Youth Reclamation Program – The Peacemaker Program
    description: A program to incorporate tribal culture and tradition in the Tribe's response to youth
      delinquency, using traditional peacemaking methods and restorative justice focused on restitution
      and healing; a Healing Circle develops a Healing Strategy that is supervised to completion.
    legal_basis: Pit River Tribe, Title 8, Chapter 15, Sections 101-404 (under Article VI, sec. (1) of
      the Pit River Constitution)
    case_types:
    - juvenile
    - criminal-diversion
    participation: voluntary-or-court-referred
    relationship_to_court: An alternative to formal adjudication in tribal or state court; entry by petition
      of the prosecutor, child welfare coordinator or law enforcement, by application of family or community
      members, or by transfer from another jurisdiction with consent. Pending adjudication is stayed during
      participation.
    enforcement: Failure to complete the program may lead to full prosecution or return of the child to
      the transferring jurisdiction; sanctions for non-compliance may be given.
    link: https://peacemaking.narf.org/wp-content/uploads/2025/07/Pit-River-Title-8-%E2%80%93-Chapter-15-Youth-Reclamation-Program-%E2%80%93-The-Peacemaker-Program.pdf
    source: pit-river-title-8-chapter-15-peacemaker-program
    confidence: medium
    verification: read-in-full
    as_of: '2011-08-17'
    locator: Sections 101-102, 201-202, 301-304, 404
    note: Peacemakers may be chosen by the tribal council, a court or judge, or elected by members; the
      clerk keeps a list.
  provisions:
  - kind: peacemaking
    title: Chapter 15 – Youth Reclamation Program – The Peacemaker Program
