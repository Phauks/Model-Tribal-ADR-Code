  - state: NM
    status: approved
    dispute_resolution_summary: After written notice, State and Pueblo representatives meet within thirty
      days, and if the allegation is not resolved within ninety days the complaining party may serve a
      notice to cease the challenged activity, after which the responding party must within thirty days
      stop it or invoke arbitration under American Arbitration Association Commercial Arbitration Rules
      before three attorney arbitrators (the third chosen by the American Arbitration Association if needed),
      and arbitration results are enforceable by injunctive relief in any court of competent jurisdiction.
