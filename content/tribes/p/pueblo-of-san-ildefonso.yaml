      a two-year limit and a 20-day notice period, where this clause has no time limit, a 30-day meeting
      and 90 days before a notice to cease. Status copied from this nation's most recent approved or deemed-approved
      entry for this state in the Office of Indian Gaming list (1995-06-12).
