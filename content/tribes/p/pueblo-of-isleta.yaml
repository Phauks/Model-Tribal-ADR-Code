dispute_resolution:
  forums:
  - kind: peacemaking
    name: Pueblo of Isleta Peacemaking Program
    description: A permanent program within the Tribal Court, following a pilot project, giving parties
      a chance to resolve legal disputes informally with neutral peacemakers using traditional Pueblo
      methods of conflict resolution, and offering prevention and intervention sessions for at-risk youth.
    legal_basis: Tribal Council Resolution No. 2020-028; Pueblo of Isleta Tribal Court Peacemaking Program
      Rules 1-6
    case_types:
    - civil
    - juvenile
    - criminal-diversion
    - other
    participation: voluntary-or-court-referred
    relationship_to_court: Any dispute within the judicial branch's jurisdiction may be referred by agreement
      of the parties (signed request and court order) or by the court on its own initiative; pre-prosecution
      criminal referrals are allowed, but Major Crimes Act offenses are excluded. Two or more peacemakers
      are designated per case and no attorney or advocate may attend.
    enforcement: A signed peacemaking agreement binds the parties; the court reviews it and either incorporates
      the settlement into a court order or returns the case to the docket. No appeal is allowed, but a
      party may move to enforce the agreement. Failure to attend may draw a fine of up to $100.
    link: https://peacemaking.narf.org/wp-content/uploads/2025/07/Isleta-Pueblo-Resolution-for-Peacemaking-Program-and-Rules.pdf
    source: isleta-resolution-2020-028-peacemaking
    confidence: high
    verification: read-in-full
    as_of: '2020-06-11'
    locator: Resolution 2020-028; Rules 1, 2, 3, 4, 5(b)-(f), 6
    note: Peacemakers must be enrolled members who understand Pueblo customs and traditions, are contracted
      by the Chief Judge with concurrence of sitting peacemakers, must complete peacemaker training, and
      are paid $25 per session hour. Statements are confidential and inadmissible.
  provisions:
  - kind: peacemaking
    title: Resolution Establishing Pueblo of Isleta Peacemaking Program and Peacemaking Program Rules
    citation: Pueblo of Isleta Resolution No. 2020-028; Tribal Court Peacemaking Program Rules 1-6
    summary: Makes the Tribal Court's peacemaking pilot permanent and sets rules on eligible cases, peacemaker
      qualifications and pay, referral, confidential sessions, binding agreements and enforcement.
    link: https://peacemaking.narf.org/wp-content/uploads/2025/07/Isleta-Pueblo-Resolution-for-Peacemaking-Program-and-Rules.pdf
    source: isleta-resolution-2020-028-peacemaking
    confidence: high
    verification: read-in-full
    as_of: '2020-06-11'
