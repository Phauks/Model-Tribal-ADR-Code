    title: Resolution Establishing Pueblo of Isleta Peacemaking Program and Peacemaking Program Rules
    citation: Pueblo of Isleta Resolution No. 2020-028; Tribal Court Peacemaking Program Rules 1-6
    summary: Makes the Tribal Court's peacemaking pilot permanent and sets rules on eligible cases, peacemaker
      qualifications and pay, referral, confidential sessions, binding agreements and enforcement.
    link: https://peacemaking.narf.org/wp-content/uploads/2025/07/Isleta-Pueblo-Resolution-for-Peacemaking-Program-and-Rules.pdf
