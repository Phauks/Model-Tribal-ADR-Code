land_establishment:
- land_area: Pyramid Lake (Truckee) Reserve, Nevada
  method: other
  instrument: Letter of Comm'r of Indian Affairs, Nov. 29, 1859, 1 Kappler 868
  date: '1859-11-29'
  detail: First set aside
  source: letter-1859-11-29-pyramid-lake-walker-lake-reservations
  confidence: medium
  verification: read-in-full
  locator: 1 Kappler 868
  note: 'The instrument reads: “reserving from sale and settlement, for Indian use, a tract of land in the northern portion of the valley of the Truckee River, including Pyramid Lake”. Administrative reservation requested of the General Land Office ("to respect said reservations upon the plats of survey"); not an executive order, but Kappler prints it as the first act in the reserve''s history, and the Exec. Order of Mar. 23, 1874 later confirmed the surveyed reservation. It is recorded as the original set-aside, though its legal form is a Commissioner''s reservation.'
- land_area: Pyramid Lake Indian Reservation, Nevada
  method: executive-order
  instrument: Exec. Order of Mar. 23, 1874, 1 Kappler 869
  date: '1874-03-23'
  detail: Later change
  source: executive-order-1874-03-23-pyramid-lake-reservation
  confidence: high
  verification: read-in-full
  locator: 1 Kappler 869
  note: 'The instrument reads: “the tract of country known and occupied as the Pyramid Lake Indian Reservation in Nevada, as surveyed by Eugene Monroe, in January, 1865”. Confirms and sets apart by order the surveyed reservation (withdrawn from sale and set apart for the Pah-Ute and other Indians residing thereon).'
