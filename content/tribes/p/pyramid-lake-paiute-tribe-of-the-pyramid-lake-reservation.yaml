- topic: public-law-280
  value: not-assumed
  detail: 'The Pyramid Lake Reservation was never under Nevada jurisdiction under the 1955 act: Washoe County petitioned and the Governor excluded it by proclamation of June 27, 1955, and the exclusion was never withdrawn. (Davis v. Warden, 88 Nev. 443, 446, 498 P.2d 1346 (1972).)'
  source: davis-v-warden-1972
  confidence: high
  verification: read-in-full
  locator: 88 Nev. at 446
  note: The court held state courts lacked jurisdiction over Pyramid Lake members' crimes on the reservation and vacated the convictions. Nevada Supreme Court, 1972.
