land_establishment:
- land_area: Pueblo of Cochiti land grant, New Mexico
  method: statute
  instrument: Act of Dec. 22, 1858, ch. 5, 11 Stat. 374
  date: '1858-12-22'
  detail: First set aside
  source: act-1858-12-22-pueblo-land-claims-confirmed
  confidence: medium
  verification: read-in-full
  locator: 11 Stat. 374
  note: 'The instrument reads: “the Pueblo land claims in the Territory of New Mexico designated in the corrected lists as ... G, Pueblo of Cochiti in the county of Santa Ana ... be, and they are hereby, confirmed”. Congress confirmed the Pueblo''s land claim (Spanish-era grant) as reported by the New Mexico surveyor general and directed the Commissioner of the General Land Office to survey and issue a patent. The act confirms an existing Spanish/Mexican grant rather than setting land aside de novo; the underlying Spanish grant dates are not given in the act. Later patents (1864 onward) and additions by executive order/statute are not covered here.'
