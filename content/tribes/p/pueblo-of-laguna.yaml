  - kind: other
    title: Section 14-1-9. – Dispute resolution.
    citation: Pueblo of Laguna Gaming Control Ordinance, Section 14-1-9 (Dispute Resolution), as amended by Resolution No. 27-13 and approved by the NIGC July 9, 2013
    link: https://www.nigc.gov/wp-content/uploads/2025/03/20130709OrdAmendApprvl.pdf
    source: pueblo-of-laguna-gaming-control-ordinance-2013
    confidence: medium
    verification: read-in-full
    as_of: '2013-07-09'
    locator: Section 14-1-9 A-D (text read in the 2013 amendment, Gaming Control Ordinance); related Section 14-1-14
    note: Read in full on 2026-11-23 (Pueblo of Laguna Gaming Control Ordinance as amended by Resolution No. 27-13, NIGC approval letter dated July 9, 2013). Read in full in the Gaming Control Ordinance as amended by Resolution No. 27-13, posted by NIGC with its July 9, 2013 approval letter. The later 2018 codified wording listed in the NILL table of contents was not seen and may differ. Gate 1 item 3 review, research/reviews/2026-11-23-text-read-tier.json, record 425.
    summary: Handles a patron's complaint that a gaming operation or management contractor refused to pay alleged winnings. If under $500, the operation tells the patron in writing of the right to ask the Gaming Control Board to investigate within seven days; if $500 or more, it notifies the Board within 48 hours and gives the patron a copy with the same right. A patron who does not ask in time loses any claim. The Board investigates and holds a hearing (unless both sides waive it), then issues a written decision, which is a final action. Either side may appeal to the Pueblo Court within 14 days of receiving it; review is limited to the Board's record, and the Board is reversed only if arbitrary, capricious or contrary to law (Section 14-1-14). An operation that fails to notify the Board on time faces a regulatory penalty.
