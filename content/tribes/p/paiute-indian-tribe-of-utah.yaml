- topic: state-jurisdiction-statute
  value: state-criminal-and-civil-jurisdiction
  detail: The 1980 restoration act directs Utah to exercise civil and criminal jurisdiction over the Paiute reservation and persons on it as if Utah had assumed jurisdiction under Public Law 280, and under Utah Code §§ 63-36-9 to -21 (now Utah Code § 9-9-201 et seq.). (Pub. L. No. 96-227, § 7(b), 94 Stat. at 320.)
  source: public-law-96-227
  confidence: medium
  verification: read-in-full
  locator: Pub. L. 96-227 § 7(b), 94 Stat. at 320
  note: The text refers to the Utah consent statute already recorded (special election). The research did not determine whether the tribe has voted; Pub. L. 109-126, § 4 (2005) amended the reservation provisions and was not read. Goldberg (2010) lists this under Utah as conferring state jurisdiction. 25 U.S.C. § 766 is "omitted" from the Code. Renumbering 63-36-9 to 9-9-201 is from your earlier reading, not mine.
