jurisdiction:
- topic: public-law-280
  value: retroceded
  detail: Interior accepted retrocession of all civil and criminal jurisdiction over the Pascua Yaqui
    Indian Reservation that had been vested in Arizona by the Act of September 18, 1978 (25 U.S.C. 1300f(c))
    and the Act of December 23, 1982; this was state jurisdiction under the nation's recognition statute
    rather than an assumption under Public Law 280 section 7. (50 FR 34555)
  source: federal-register-1985-pascua-yaqui-retrocession
  confidence: high
  as_of: '1985-08-27'
