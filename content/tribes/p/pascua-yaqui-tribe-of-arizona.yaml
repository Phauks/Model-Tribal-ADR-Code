  - kind: other
    title: SUBCHAPTER C CONCILIATION
    citation: Pascua Yaqui Tribal Code, Title 5 Civil Code, Chapter 2 Domestic Relations, 260 and 290
      (Subchapter C Conciliation, read 260-370)
    link: https://www.pascuayaqui-nsn.gov/wp-content/legacy-tribalcodes/docs/5_PYTC/2_Domestic_Relations_FINAL.pdf
