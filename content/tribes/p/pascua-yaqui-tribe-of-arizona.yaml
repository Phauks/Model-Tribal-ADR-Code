    note: Read in full on 2026-11-22 (review queue item 2).
    summary: Written agreements to arbitrate contract disputes with the tribe are enforceable, the Tribal
      Court must stay its own proceedings and order arbitration when a party asks, and the court confirms
      awards and enforces them as civil judgments, with no appeal from an order enforcing an agreement
      or award.
