dispute_resolution:
  forums:
  - kind: mediation
    name: Mandatory Civil Mediation Program
    description: An informal, flexible process in which a neutral mediator helps parties resolve their
      own disputes outside the adversarial process; the first step for all family-related civil cases
      filed in the Pascua Yaqui Tribal Court.
    legal_basis: 5 PYTC Chapter 9 (Mediation), §§ 9-10, 9-30
    case_types:
    - family
    - probate
    - civil
    participation: required
    relationship_to_court: The court clerk refers all civil cases involving families to mediation, for
      initial and modification proceedings; the court may decline referral on request for parental unfitness,
      substance abuse, mental incapacity, domestic violence, other good cause or undue delay, and a judge
      may refer a case at any time.
    link: https://www.pascuayaqui-nsn.gov/tribal-code-v1/
    source: national-center-on-restorative-justice-restorative-justice-tribal-laws-database
