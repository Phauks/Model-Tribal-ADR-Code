    note: 'Describes Mnodaawin peacemaking circles as a Tribal Court alternative first offered for juvenile
      cases such as truancy, curfew, incorrigibility and minor offenses, available where the juvenile
      admits wrongdoing and the juvenile and a parent or guardian agree. Trained facilitators lead circles
      of the juvenile, parents, family, elders and community members (the victim may take part or be represented)
      until a written consensus agreement is signed by all, followed by monitoring circles over several
      months; agreements may include school, community service, cultural activities, counseling and restitution.
      The page says the Tribal Court will develop similar processes for civil disputes and other types
      of cases. Undated official page; as_of is the access date. Folded on 2026-11-22 from a separate
      forum record (review queue item 5): ''Mnodaawin Peacemaking Circles (juvenile)''.'
