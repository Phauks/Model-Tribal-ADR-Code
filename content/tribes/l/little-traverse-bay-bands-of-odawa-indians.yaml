dispute_resolution:
  forums:
  - kind: peacemaking
    name: Mnodaawin
    own_term:
      name: Mnodaawin
      language_tag: otw
      translation: Odawa peacemaking (as glossed in the rule)
    description: The Odawa peacemaking program to which Tribal Court cases may be transferred.
    legal_basis: Little Traverse Bay Bands Rules of Civil Procedure, Rule XXIX (Mnodaawin)
    case_types:
    - civil
    - other
    participation: voluntary
    relationship_to_court: A party may request transfer of a Tribal Court case at any time on evidence
      that all parties voluntarily consent and the Mnodaawin program has affirmed it can accept the case.
    enforcement: Parties must consent to be bound by any agreement reached in Mnodaawin.
    link: https://peacemaking.narf.org/wp-content/uploads/2025/07/Little-Traverse-Civil-Rules-of-Procedure-Amended-August-2015.pdf
    source: little-traverse-civil-rules-2015
    confidence: medium
    verification: inferred
    as_of: 2015-08
    locator: Rule XXIX
    note: Language tag otw (Ottawa/Odawa) assigned because the rule glosses the term as Odawa peacemaking.
      The Judicial Branch's peacemaking page, listed under published materials, describes Mnodaawin circles
      for juvenile cases (folded 2026-11-22, review queue item 5).
  - kind: mediation
    name: Court-ordered mediation in child protection
    description: After finding probable cause at a preliminary hearing the court may order custodians
      to participate in mediation; statements are not part of the record or used against them, except
      new abuse or neglect allegations, which are reported.
    legal_basis: Waganakising Odawak Tribal Code of Law (WOTCL) 5.118(J)
    case_types:
    - child-welfare
    participation: required
    relationship_to_court: Ordered by the court within child protection proceedings.
    link: https://ltbbodawa-nsn.gov/tribal-code/
    source: national-center-on-restorative-justice-restorative-justice-tribal-laws-database
    confidence: medium
    verification: bulk-import
    as_of: '2026'
    locator: https://ncorj.org/tribal-law/court-ordered-mediation-in-child-protection/
  - kind: peacemaking
    name: Peacemaking in child protection cases
    description: In lieu of mediation, parties may request peacemaking, a voluntary and confidential process
      using cultural approaches to dispute resolution; statements cannot be used in court except new abuse
      or neglect allegations, which are reported.
    legal_basis: Waganakising Odawak Tribal Code of Law (WOTCL) 5.118(K)
    case_types:
    - child-welfare
    participation: voluntary
    relationship_to_court: Available as an alternative to court-ordered mediation within child protection
      proceedings.
    link: https://ltbbodawa-nsn.gov/tribal-code/
    source: national-center-on-restorative-justice-restorative-justice-tribal-laws-database
    confidence: medium
    verification: bulk-import
