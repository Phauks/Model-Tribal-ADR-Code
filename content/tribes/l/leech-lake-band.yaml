dispute_resolution:
  forums:
  - kind: arbitration
    name: Peacemaker Tribunal (Leech Lake Band of Ojibwe Tribal Court)
    description: A tribunal the Chief Judge may establish, as a permanent division or case by case, whose
      decisions bind the consenting parties; NARF associates the rule with the BaMeNim Anishinaabeg Program.
    own_term:
      name: BaMeNim Anishinaabeg
      language_tag: oj
      translation: Program name as given by NARF; no gloss published in the sources reviewed.
    legal_basis: Leech Lake Band of Ojibwe Judicial Code, Title 2, Rules of Procedure, Rule 58
    case_types:
    - civil
    - other
    participation: voluntary
    relationship_to_court: Use is voluntary and forecloses further use of the Trial Court except to enforce
      the tribunal's award or decision; parties must consent in writing and acknowledge they cannot appeal.
    enforcement: Decisions are summarized in writing in the court file, are not appealable, and may be
      enforced through the Trial Court.
    link: https://peacemaking.narf.org/wp-content/uploads/2025/07/Leech-Lake-tc_coTITLE02-RulesofProcedure.pdf
    source: leech-lake-judicial-code-title-2-rules
    confidence: medium
    verification: inferred
    as_of: '2000-11-21'
    locator: Title 2, Rule 58
    note: 'Leech Lake is a component band of the Minnesota Chippewa Tribe on the federal list. Kind recorded
      as arbitration because the rule describes a binding, non-appealable award or decision; the code
      calls it a Peacemaker Tribunal. Program name ''BaMeNim Anishinaabeg'' comes from NARF''s Tribal
      Peacemaking Laws page, not the rule itself. Component band: Leech Lake Band of Ojibwe.'
  provisions:
