  - kind: peacemaking
    title: Odenaang Enjinoojimoying (A Place of Healing Many Hearts) Peacemaking Guidelines
    citation: Little River Band of Ottawa Indians Peacemaking Guidelines (Odenaang Enjinoojimoying), Certification of Adoption, effective May 29, 2008
    link: https://peacemaking.narf.org/wp-content/uploads/2025/07/Little-River-Peacemaking-Guidelines-2008.pdf
