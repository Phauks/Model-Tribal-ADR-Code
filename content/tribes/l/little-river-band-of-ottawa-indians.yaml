    verification: read-in-full
    as_of: '2008-05-29'
    locator: Guidelines Sections 1-12 (printed pp. 2-9); Sections 13-15 and appended forms not read
    note: 'Read in full on 2026-11-23 from page images (Odenaang Enjinoojimoying, Little River Band of Ottawa Indians Peacemaking Guidelines; Certification of Adoption signed by Chief Judge Daniel Bailey and Associate Judge Angela Sherigan, effective May 29, 2008 (handwritten)). Read in the nation''s own Peacemaking Guidelines (scanned): Certification of Adoption, table of contents and Sections 1-12. Sections 13-15 and the forms were not read. ''Appendix 1'' in the earlier citation comes from NARF''s list and is not printed on the pages read. Gate 1 item 3 review, research/reviews/2026-11-23-text-read-tier.json, record 235.'
    summary: The Tribal Court's Peacemaking program (Odenaang Enjinoojimoying) works alongside the court system for minors and adults. Cases may come from the Tribal Court, other tribal or state courts, agencies or a person's own request, in juvenile status and non-status matters and adult civil disputes; a request may be made by offering tobacco or another medicine, or by court order or personal request, and Peacemakers may deny a case in writing. Sessions are voluntary, led by two Peacemakers (one man, one woman) who direct the process but not the content, and are confidential except for child-abuse reporting. The signed agreement is a legally binding contract, and the Tribal Court enforces it by court order if participants do not follow it. Peacemakers must be at least 21, volunteers, and tribal members or tribal employees, and are certified after training.
  - kind: peacemaking
    title: 'Juvenile Code (Ordinance #99-900-02), Peacemaking provisions'
    citation: 'Little River Band Juvenile Code, Ordinance #99-900-02 (adopted July 27, 2011), Sections 4.01(b), 4.02, 6.01, 8.01-8.03'
    link: https://peacemaking.narf.org/wp-content/uploads/2025/07/Little-River-Title-900-02-Juvenile-Code-2011.pdf
    source: little-river-900-02-juvenile-code-2011
