dispute_resolution:
  forums:
  - kind: peacemaking
    name: Peacemaking (Children's Court)
    own_term:
      name: Odenaang Enjinoojimoying
      language_tag: otw
      translation: A Place of Healing Many Hearts (title of the Peacemaking Guidelines)
    description: Peacemaking created in the Juvenile Code to provide a traditional conflict resolution
      process to children, youth and families, with a vision of resolution and healing.
    legal_basis: 'Little River Band Juvenile Code (Ordinance #99-900-02), Sections 4.01(b), 4.02, 6, 7.01,
      8'
    case_types:
    - juvenile
    - family
    participation: court-referred
    relationship_to_court: A juvenile's first status offense before the Children's Court is referred to
      the Peacemakers immediately; other cases come through the Case Intake Team (which includes a Peacemaker)
      or by Tribal Court referral, and cases go to court for adjudication if rejected or after nine months.
    link: https://peacemaking.narf.org/wp-content/uploads/2025/07/Little-River-Title-900-02-Juvenile-Code-2011.pdf
    source: little-river-900-02-juvenile-code-2011
    confidence: medium
    verification: inferred
    as_of: '2011-07-27'
    locator: Sections 4.01(b), 4.02(a)-(f), 6.01, 7.01, 8.01-8.02
    note: Language tag otw assigned because the Band is Odawa (Ottawa); the code does not name the language.
      Participation recorded as court-referred because first status offenses are referred automatically
      by the code.
  - kind: peacemaking
    name: Peacemaking program of the Tribal Court (guidelines)
    own_term:
      name: Odenaang Enjinoojimoying
      language_tag: otw
      translation: A Place of Healing Many Hearts
    description: Tribal Court peacemaking program for children, youth, adult tribal members and tribal
      employees; peacemakers guide the process, and participants develop and sign an agreement. A request
      may be made in the traditional way, by offering tobacco or another of the medicines named in the
      guidelines, or formally by court order or personal request.
    legal_basis: Peacemaking Guidelines (rules and procedures of Odenaang Enjinoojimoying), adopted by
      the signatures of the Chief Judge and Associate Judge (Certification of Adoption, effective May
      29, 2008)
    case_types:
    - juvenile
    - family
    - civil
    - employment
    participation: voluntary-or-court-referred
    relationship_to_court: Cases may be referred by tribal courts, state courts, other federally recognized
      or historic tribes, or agencies, or come by personal request; cases the program declines go back
      to the Case Intake Team.
    enforcement: The agreement is described as a binding contract; if participants do not follow it, the
      Tribal Court enforces it by court order.
    link: https://peacemaking.narf.org/wp-content/uploads/2025/07/Little-River-Peacemaking-Guidelines-2008.pdf
    source: little-river-peacemaking-guidelines-2008
    confidence: medium
    verification: read-in-full
    as_of: '2008-05-29'
    locator: Certification of Adoption; Sections 1.01, 4, 6.01-6.10, 8.01(c)(2g), 8.05
    note: Read from OCR of a scanned document. 'employment' reflects the guidelines' eligibility of tribal
      employees; 'civil' reflects adult civil cases pending before the court. Language tag otw assigned
      because the Band is Odawa; the guidelines do not name the language.
  provisions:
  - kind: peacemaking
    title: Juvenile Code – Peacemaking
    citation: 'Little River Band Juvenile Code, Ordinance #99-900-02, Section 8'
    summary: Creates peacemaking for children, youth and families, directs the judiciary to issue Peacemaking
      Guidelines, and lists the cases peacemakers may hear.
