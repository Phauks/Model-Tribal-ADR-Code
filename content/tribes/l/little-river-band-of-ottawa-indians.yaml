    locator: Little River Band of Ottawa Indians, Michigan
    note: 'Read in full on 2026-11-23 (Juvenile Code, Ordinance # 99-900-02, Adopted - July 27, 2011 (Little River Band of Ottawa Indians)). Peacemaking provisions read in the Juvenile Code text: Sec. 4.01(b) (creation and vision), 4.02 (referral), 6.01 (Case Intake Team), 8.01-8.03 (guidelines, authority, case denial). Procedures are in the Odenaang Enjinoojimoying Peacemaking Guidelines. Gate 1 item 3 review, research/reviews/2026-11-23-text-read-tier.json, record 236.'
    summary: The Juvenile Code creates Peacemaking as a traditional conflict resolution process for children, youth and families. A juvenile's first status offense in the Children's Court is referred to the Peacemakers at once; other cases go through the Case Intake Team, which includes a Peacemaker and may refer to Peacemaking, and the Tribal Court may refer a case at the preliminary hearing. Peacemakers also hear cases brought by people who ask to use Peacemaking voluntarily, and may refuse a case after written denial by two Peacemaking groups. A case goes to court for adjudication if the Case Intake Team rejects it or after nine months. The code leaves procedure to the Tribal Judiciary's Peacemaking Guidelines and does not say how agreements are enforced.
