    name: Peacemaking in child-in-need-of-care matters
    description: The Child Welfare Director and affected parties (including a child 12 or older) may,
      by mutual consent, petition the Children's Court to institute peacemaking, conducted under rules
      set by peacemakers appointed by the Tribal Court.
    legal_basis: LCO Code DMR.1.3.120 (Informal Disposition)
    case_types:
