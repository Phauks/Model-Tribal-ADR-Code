dispute_resolution:
  provisions:
  - kind: other
    title: Ch’qi’n’txw an Offender’s Record of Conviction (Expungement)
    citation: Lummi Nation Code of Laws, Title 5, Chapter 5.12 (5.12.010 and following)
    summary: Lets a person who has completed all terms of a Lummi Tribal Court sentence petition to have
      the conviction ch’qi’n’txw, a term the code gives the same legal effect as expungement, grounded
      in the community value of forgiveness, with listed offenses excluded.
    link: https://peacemaking.narf.org/wp-content/uploads/2025/07/Lummi-Title5CodeofOffenses.pdf
    source: lummi-title-5-code-of-offenses
    confidence: high
    as_of: '2022'
    locator: 5.12.010, 5.12.020
    note: 'A restorative, post-sentencing provision rather than a dispute forum; the code refers to living
      consistently with Lummi Sche’lang’en. Language tag str (Straits Salish) assigned on the basis that
      Lummi is a Northern Straits Salish language; the source does not name the language. Own term: ch’qi’n’txw.'
