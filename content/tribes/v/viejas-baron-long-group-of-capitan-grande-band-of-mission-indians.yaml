    dispute_resolution_summary: The parties exchange written notice and a written response within 15 days
      and must meet and confer within 30 days; if unresolved either party may seek arbitration before
      a single arbitrator mutually selected by the parties under JAMS Comprehensive Arbitration Rules
      (or similar agreed rules), though neither is required to agree to arbitrate, and disputes not resolved
      by arbitration or other agreed means may go to the United States District Court (or a state court
      if the federal court lacks jurisdiction) for injunctive, declaratory or specific-performance relief
      only, under a limited waiver of sovereign immunity.
