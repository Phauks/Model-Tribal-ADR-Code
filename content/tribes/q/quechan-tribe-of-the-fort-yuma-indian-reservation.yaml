  note: 'The instrument reads: “In lieu of an Executive order dated July 6, 1883, setting apart certain lands in the Territory of Arizona as a reservation for the Yuma Indians, which order is hereby cancelled”. Replacement order; tract in California except the Fort Yuma military reservation.'
