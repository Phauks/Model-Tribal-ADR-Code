land_establishment:
- land_area: Yuma Reserve (Arizona side of the Colorado River opposite the Gila mouth)
  method: executive-order
  instrument: Exec. Order of July 6, 1883, 1 Kappler 832
  date: '1883-07-06'
  detail: First set aside
  source: executive-order-1883-07-06-yuma-reservation
  confidence: medium
  verification: read-in-full
  locator: 1 Kappler 832
  note: 'The instrument reads: “withdrawn from settlement and sale and set apart as a reservation for the Yuma and such other Indians as the Secretary of the Interior may see fit to settle thereon”. This Arizona tract was cancelled and replaced by the Exec. Order of Jan. 9, 1884 (1 Kappler 832) setting apart lands in California; the Fort Yuma Reservation as it exists is the Jan. 9, 1884 tract. Kappler also notes the act of Aug. 15, 1894 (28 Stat. 332).'
- land_area: Yuma (Fort Yuma) Reserve, California
