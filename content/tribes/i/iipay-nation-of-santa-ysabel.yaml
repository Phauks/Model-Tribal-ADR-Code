  - state: CA
    status: approved
    dispute_resolution_summary: The parties give written notice and meet and confer not later than ten
      days after receipt of the notice; if the dispute is not resolved within thirty calendar days after
      the first meeting, either party may seek arbitration before one neutral arbitrator under the Commercial
      Arbitration Rules of the American Arbitration Association (though neither must agree to arbitrate),
      and disagreements not otherwise resolved may be taken to the United States District Court where
      the Tribe's Gaming Facility is located (or, if federal courts lack jurisdiction, a state court),
      under a limited waiver of sovereign immunity for claims seeking only injunctive, specific-performance
      or declaratory relief.
