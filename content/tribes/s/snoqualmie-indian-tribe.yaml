dispute_resolution:
  forums:
  - kind: peacemaking
    name: Peacemaker Court
    description: Part of the judicial branch alongside the Tribal Court and Court of Appeals, with original
      jurisdiction over disputes involving minor civil matters between Snoqualmie tribal members and the
      application of tribal customs and traditions to tribal life.
    legal_basis: Snoqualmie Judiciary Act 3.1, Sections 4.0, 5.0(c), 7.4
    case_types:
    - civil
    - other
    relationship_to_court: One of three components of the judicial branch; the section on the Peacemaker
      Court's operation (7.4) is marked Reserved in the copy reviewed.
    link: https://peacemaking.narf.org/wp-content/uploads/2025/07/Snoqualmie-act3-1.pdf
    source: snoqualmie-judiciary-act-3-1
    confidence: medium
    as_of: '2025'
    locator: Sections 4.0, 5.0(c), 7.4
    note: Read from OCR. The Act notes the Tribe contracts with the Northwest Intertribal Court System
      for judges. as_of is NARF posting year; whether the Peacemaker Court is operating was not verified.
