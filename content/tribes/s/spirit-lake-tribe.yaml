dispute_resolution:
  forums:
  - kind: customary-dispute-resolution
    name: 'Wodakota: Traditional Court'
    own_term:
      name: Wodakota
      language_tag: dak
      translation: The code describes the Wodakota way as the Dakota way of balance in dealings with oneself,
        the Creator and relatives; no single-word gloss is given.
    description: Part of the Tribal Court system providing a non-adversarial, culturally appropriate mediation
      alternative to court-imposed sanctions; uses Peacemaking Circles drawing on elders, spiritual leaders
      and community members, and produces written peacemaking compacts.
    legal_basis: Spirit Lake Law and Order Code, Title 21, §§ 21-1-101 to 21-1-110 and following
    case_types:
    - juvenile
    - civil
    - criminal-sentencing
    - other
    participation: voluntary
    relationship_to_court: Cases may come informally, formally, by memorandum of agreement, or voluntarily;
      informal and formal matters remain under Tribal Court jurisdiction. All persons involved must consent
      through a memorandum of agreement. The court also offers peacemaking to community programs, schools
      and agencies under memoranda of agreement.
    enforcement: A peacemaking compact signed by the parties and peacemaker becomes an order and judgment
      of the Tribal Court when the parties so intend and the Chief Judge signs it; peacemakers monitor
      compliance.
    link: https://peacemaking.narf.org/wp-content/uploads/2025/07/Spirit-Lake-Title-21-WODAKOTA.pdf
    source: spirit-lake-title-21-wodakota
    confidence: medium
    verification: read-in-full
    as_of: '2014-03-24'
    locator: §§ 21-1-101, 21-1-104, 21-1-107(9)-(10), 21-1-108, 21-1-109, 21-1-110
    note: The Title incorporates a tribal prayer adopted by elders, in English and Dakota, as a guideline
      (§ 21-1-105), and lists Dakota values with Dakota terms (§ 21-1-106); these are not reproduced here.
      Peacemaking Circles also serve as an alternative sentencing route for youth offenders. Language
      tag dak (Dakota).
