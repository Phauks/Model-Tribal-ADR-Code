dispute_resolution:
  forums:
  - kind: peacemaking
    name: Tribal traditional peacemaking forum (Traditional Peacekeeping)
    description: On the Tribal Court's recommendation, a case involving a class D offense may be referred
      to a tribal traditional peacemaking forum for adjudication.
    legal_basis: Skokomish Tribal Code 9.11.030 (Traditional Peacekeeping)
    case_types:
    - criminal-diversion
    - criminal-sentencing
    participation: court-referred
    relationship_to_court: The forum submits a case report to the Tribal Court and all parties detailing
      action taken, restrictions and conditions.
    enforcement: Failure to comply with requirements in the case report may be treated as a violation
      of a court order.
    link: https://peacemaking.narf.org/wp-content/uploads/2025/07/Skokomish-STC-9.11.pdf
    source: skokomish-stc-9-11-sentencing
    confidence: medium
    verification: read-in-full
    as_of: '2017-07-05'
    locator: S.T.C. 9.11.030
    note: Sentencing policy (9.11.010) favors restitution to the victim and community.
  provisions:
  - kind: traditional-dispute-resolution
    title: Traditional Peacekeeping
    citation: Skokomish Tribal Code 9.11.030
    summary: Allows referral of class D offense cases to a tribal traditional peacemaking forum, whose
      case report conditions are enforceable as court orders.
    link: https://peacemaking.narf.org/wp-content/uploads/2025/07/Skokomish-STC-9.11.pdf
    source: skokomish-stc-9-11-sentencing
    confidence: medium
    verification: read-in-full
    as_of: '2017-07-05'
  - kind: mediation
    title: Family Group Conference
