jurisdiction:
- topic: public-law-280
  value: optional-state
  detail: 'Washington assumed partial jurisdiction (RCW 37.12.010, 1957 and 1963): it does not apply to
    Indians on trust or restricted tribal or allotted lands within a reservation except for eight subjects
    (compulsory school attendance, public assistance, domestic relations, mental illness, juvenile delinquency,
    adoption, dependent children, motor vehicles on public roads), unless the tribe requested full state
    jurisdiction under RCW 37.12.021.'
  source: revised-code-of-washington-37-12-010
  confidence: medium
  as_of: '1963'
  locator: RCW 37.12.010
  note: Nation matched to Washington by office state. Check for later retrocession facts.
- topic: public-law-280
  value: optional-state
  detail: Listed as a tribe that consented to (requested) full Washington state jurisdiction; some of
    this jurisdiction was later retroceded for several of these nations (see retrocession facts).
  source: department-of-justice-federally-recognized-indian-nations-under-state-jurisdiction-2016
  confidence: medium
  as_of: '2016-06-29'
  locator: Washington section, footnote 4
  note: From a 2016 Office of Tribal Justice compilation hosted by the National Indian Justice Center.
- topic: public-law-280
  value: retroceded
  detail: Interior accepted retrocession of partial criminal jurisdiction acquired by Washington under
    Public Law 280 and RCW 37.12; accepted November 20, 2024, fully effective May 27, 2025. (89 FR 93336)
  source: federal-register-2024-skokomish-retrocession
  confidence: high
  as_of: '2025-05-27'
