  forums:
  - kind: traditional-forum
    name: Tribal traditional peacemaking forum (Traditional Peacekeeping)
    description: On the Tribal Court's recommendation, a case involving a class D offense may be referred
      to a tribal traditional peacemaking forum for adjudication.
    legal_basis: Skokomish Tribal Code 9.11.030 (Traditional Peacekeeping)
    case_types:
    - criminal-diversion
    - criminal-sentencing
    participation: court-referred
    relationship_to_court: The forum submits a case report to the Tribal Court and all parties detailing
      action taken, restrictions and conditions.
    enforcement: Failure to comply with requirements in the case report may be treated as a violation
      of a court order.
    link: https://peacemaking.narf.org/wp-content/uploads/2025/07/Skokomish-STC-9.11.pdf
