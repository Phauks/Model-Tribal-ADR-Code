- land_area: Reservation of six sections at the head of Hood's Canal, Washington
  method: treaty
  instrument: Treaty of Point No Point, Jan. 26, 1855, art. II, 12 Stat. 934 (art. II begins at 933)
  date: '1855-01-26'
  detail: First set aside
  source: treaty-with-the-sklallam-1855
  confidence: medium
  verification: read-in-full
  locator: 12 Stat. 934
  note: 'The instrument reads: “amount of six sections, or three thousand eight hundred and forty acres, situated at the head of Hood’s Canal, to be hereafter set apart”. The preamble names the S''Klallam villages and the Sko-ko-mish, Too-an-hooch and Chem-a-kum tribes. The tract was ''to be hereafter set apart'' and was fixed later by Exec. Order of Feb. 25, 1874.'
