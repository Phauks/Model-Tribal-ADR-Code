land_establishment:
- land_area: Fort Hall Reserve (southern Idaho reservation for the Boise and Bruneau Shoshones and Bannocks)
  method: executive-order
  instrument: Exec. Order of June 14, 1867, 1 Kappler 837
  date: '1867-06-14'
  detail: First set aside
  source: executive-order-1867-06-14-southern-and-northern-idaho-reservations
  confidence: medium
  verification: read-in-full
  locator: 1 Kappler 837
  note: 'The instrument reads: “Let the lands be set apart as reservations for the Indians within named, as recommended by the Acting Secretary of the Interior.”. The recommendation printed with the order describes the southern reservation as "The Boise and Bruneau bands of Shoshones and Bannock Reservation . . . comprehending Fort Hall" (1 Kappler 836). The July 30, 1869 order (1 Kappler 839) designated this tract as the Bannock reservation under the Treaty of July 3, 1868; Kappler: "This reservation is included in the executive order of June 14, 1867" (1 Kappler 838). Fort Hall boundaries later changed by treaty and acts.'
