      is not resolved within 30 days after notice either party may require binding arbitration before
      three arbitrators (one picked by each side and a third picked by those two, with the American Arbitration
      Association as the default source), with arbitration decisions effective unless a federal court
      determines otherwise and both sides consenting to the United States District Court for the District
      of Idaho for any dispute under the compact.
