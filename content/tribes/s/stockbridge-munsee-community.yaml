dispute_resolution:
  forums:
  - kind: peacemaking
    name: Peacemaker System
    description: Part of the Tribal Court System but independent from Tribal Court judges, giving formal
      support, structure and enforcement to traditional Mohican methods of resolving disputes through
      mediation and traditional ways, under stated guiding principles including voluntary participation
      and community health.
    legal_basis: Stockbridge-Munsee Tribal Code, Chapter TCT.04 (Peacemaker Ordinance), Sections TCT.04.01
      to TCT.04.31
    case_types:
    - civil
    - criminal-diversion
    - criminal-sentencing
    - other
    participation: voluntary-or-court-referred
    relationship_to_court: Civil actions may be referred by written stipulation of all parties and criminal
      matters on consent under listed conditions; a trial judge may also order parties in a civil case
      to spend at least one hour in a peacemaking session.
    enforcement: Agreements may be confirmed as Tribal Court judgments and enforced as any other judgment;
      peacemakers may decide a matter only on all parties' written agreement (agreed arbitration).
    link: https://peacemaking.narf.org/wp-content/uploads/2025/07/Stockbridge-Munsee-TCT.04-Peacemaker-Ordinance.pdf
    source: stockbridge-munsee-tct-04-peacemaker-ordinance
    confidence: medium
    verification: read-in-full
    as_of: '2025'
    locator: Sections TCT.04.01-04.06, 04.14, 04.19-04.22, 04.28-04.31
    note: Peacemakers on the roll are tribal members over 35; parties may choose a non-member by agreement.
      Parties pay $20 each for peacemaker compensation. Attorneys barred except as witnesses or parties.
      as_of is NARF posting year.
  provisions:
  - kind: peacemaking
    title: Chapter TCT.04 – Peacemaker Ordinance
    citation: Stockbridge-Munsee Tribal Code, Title TCT, Chapter TCT.04
    summary: Establishes the Peacemaker System with guiding principles, peacemaker qualifications and
      powers, procedures, judgments, transfers and a one-hour mandatory civil peacemaking session option.
    link: https://peacemaking.narf.org/wp-content/uploads/2025/07/Stockbridge-Munsee-TCT.04-Peacemaker-Ordinance.pdf
    source: stockbridge-munsee-tct-04-peacemaker-ordinance
    confidence: medium
    as_of: '2025'
  - kind: peacemaking
    title: Employee Rights Ordinance – peacemaking for employee disputes
    citation: Stockbridge-Munsee Tribal Law, Chapter 53, Section 53.5(H)
    summary: Permits peacemaking for employee disputes, to be conducted under the Tribal Peacemaker Ordinance.
    link: https://narf.org/nill/codes/stockbridge/53employee10.pdf
    source: stockbridge-munsee-chapter-53-employee-rights
    confidence: medium
    as_of: '2010-08-17'
    locator: Section 53.5(H)
  - kind: peacemaking
    title: Title TCT, Chapter TCT.04 – Peacemaker Ordinance
