    note: 'Native American Rights Fund description (provision itself not read): Provides authorization
      and guiding principles, qualifications, procedures, authority of Tribal Court to limit, referral
      standards, and standards of conduct, authority to use traditional ways and instruct on tribal teachings.'
  clauses:
  - context: employment-code
    kind: mediation-clause
    citation: Stockbridge-Munsee Tribal Law, Chapter 53, Section 53.4(1)-(2)
    summary: Employment issues other than the enumerated employee rights must go through the internal
      dispute resolution process, which may be a grievance process or an employee mediation panel under
      the Employment Manual, and that process must be exhausted before a Tribal Court appeal.
    link: https://narf.org/nill/codes/stockbridge/53employee10.pdf
    source: stockbridge-munsee-chapter-53-employee-rights
    confidence: medium
    verification: read-in-full
    as_of: '2010-08-17'
    locator: Section 53.4
  - context: employment-code
    kind: waiver-of-sovereign-immunity
    citation: Stockbridge-Munsee Tribal Law, Chapter 53, Section 53.5(G)
