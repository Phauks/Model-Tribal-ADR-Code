    dispute_resolution_summary: After written notice the parties meet within 30 days; if unresolved after
      90 days they must first try mediation (by an agreed mediator or under American Arbitration Association
      commercial mediation procedures in Bismarck), and once mediation fails or 180 days pass either party
      may sue in the United States District Court for the District of North Dakota under limited waivers
      of immunity.
    dispute_resolution_locator: Section XXVIII (Dispute Resolution)
    source: compact-nd-spirit-lake-tribe-2022
    confidence: medium
