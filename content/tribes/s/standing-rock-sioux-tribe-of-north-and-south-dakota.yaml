land_establishment:
- land_area: Great Sioux Reservation (the land of the Standing Rock Reservation lies within it)
  method: treaty
  instrument: Treaty with the Sioux, Apr. 29, 1868, art. II, 15 Stat. 635, 636
  date: '1868-04-29'
  detail: First set aside
  source: treaty-with-the-sioux-and-arapaho-1868
  confidence: medium
  verification: read-in-full
  locator: 15 Stat. 636
  note: 'The instrument reads: “shall be, and the same is, set apart for the absolute and undisturbed use and occupation of the Indians herein named”. The treaty set apart the Great Sioux Reservation (the district between the east bank of the Missouri, the Nebraska line, the 104th meridian and the 46th parallel); the separate Standing Rock Reservation was carved from it by the Act of Mar. 2, 1889. Treaty is the first instrument for this land.'
- land_area: Standing Rock Reservation, Dakota Territory
  method: statute
  instrument: Act of Mar. 2, 1889, ch. 405, § 3, 25 Stat. 888, 889
  date: '1889-03-02'
  detail: Later change
  source: act-1889-03-02-sioux-separate-reservations
  confidence: high
  verification: read-in-full
  locator: 25 Stat. 889
  note: 'The instrument reads: “is hereby set apart for a permanent reservation for the Indians receiving rations and annuities at the Standing Rock Agency”. Separate Standing Rock Reservation created from the Great Sioux Reservation; Exec. Orders of Mar. 16, 1876 and Mar. 20, 1884 (1 Kappler 884) had earlier added/restored east-of-Missouri lands for the Standing Rock Agency.'
