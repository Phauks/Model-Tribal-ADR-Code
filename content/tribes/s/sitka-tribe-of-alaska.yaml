dispute_resolution:
  forums:
  - kind: customary-dispute-resolution
    name: Traditional Tlingit law in children's cases
    description: Tribal Court judges may apply traditional Tlingit law by referring to written or oral
      accounts of traditional Tlingit life, interviewing Elders or Culture Bearers, or calling on the
      Haa Dachxanx’i Yan Jeeis (For Our Grandchildren) Committee or the Tribe's Cultural Resources Committee.
    own_term:
      name: Haa Dachxanx’i Yan Jeeis
      language_tag: tli
      translation: For Our Grandchildren (committee name as glossed in the code)
    legal_basis: Sitka Tribe Children's Code, Chapter VII, § 7.01
    case_types:
    - child-welfare
    - family
    participation: court-referred
    relationship_to_court: Traditional sources may give persuasive recommendations, but only the Presiding
      Judge enters a final order or judgment.
    link: https://sitkatribe.org/our-government/governance-documents/
    source: national-center-on-restorative-justice-restorative-justice-tribal-laws-database
    confidence: medium
    verification: bulk-import
    as_of: '2026'
    locator: https://ncorj.org/tribal-law/traditional-tlingit-law-in-childrens-cases/
  provisions:
  - kind: other
    title: Problem Solving (alternative and traditional tools for dispute resolution)
    citation: Sitka Tribe Children's Code § 2.08
    summary: Allows the Presiding Judge to order alternative and traditional dispute resolution tools
      for all or part of a children's case, mindful of safety where there is evidence of domestic violence.
    link: https://sitkatribe.org/our-government/governance-documents/
    source: national-center-on-restorative-justice-restorative-justice-tribal-laws-database
    confidence: medium
    verification: read-in-full
    as_of: '2026'
    locator: https://ncorj.org/tribal-law/alternative-and-traditional-dispute-resolution/
jurisdiction:
- topic: public-law-280
  value: mandatory-state
  detail: 'Alaska is a mandatory state: 18 U.S.C. § 1162(a) (criminal) and 28 U.S.C. § 1360(a) (civil)
    extend state jurisdiction to all Indian country within Alaska. Applies to the nation''s Indian country
    within Alaska; the statute itself does not identify which lands are Indian country.'
  source: us-code-title-18-section-1162
  confidence: medium
  verification: inferred
  as_of: '2010-07-29'
  locator: 18 U.S.C. § 1162(a) and 28 U.S.C. § 1360(a), entry "Alaska"
  note: Statute is primary; nation matched to Alaska by office state in the BIA Tribal Leaders Directory,
    so confidence is medium. Cited jointly with us-code-title-28-section-1360.
- topic: indian-child-welfare-act
  value: designated-agent-listed
  detail: Listed with a designated Tribal agent for service of notice under 25 CFR 23.12.
  source: federal-register-2026-indian-child-welfare-act-designated-tribal-agents
  confidence: medium
  verification: inferred
  as_of: '2026-05-26'
  locator: 91 FR 30682 (Tribe column of the designated agent table)
  note: 'Listed as: Sitka Tribe of Alaska Confidence lowered from high by the lead session: the notice
    prints its table as page images, so nation names were read from images and matched to the roster.
    Row re-read on 2026-11-22 from the page image (the govinfo PDF has no text layer for the table); verification
