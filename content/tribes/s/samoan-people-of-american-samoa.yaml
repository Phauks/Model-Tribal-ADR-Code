id: samoan-people-of-american-samoa
entity_type: territorial-indigenous-people
names:
  official: Samoan people of American Samoa
  official_source: revised-constitution-american-samoa-1967
recognition:
- type: territorial-law
  state: AS
  legal_basis: Revised Constitution of American Samoa, art. I § 3 (policy protective legislation)
  since: '1967-07-01'
  source: revised-constitution-american-samoa-1967
  confidence: high
  verification: read-in-full
  as_of: '1967-07-01'
  locator: art. I § 3
  note: '''It shall be the policy of the Government of American Samoa to protect persons of Samoan ancestry
    against alienation of their lands and the destruction of the Samoan way of life and language, contrary
    to their best interests.'' Legislation may protect ''the lands, customs, culture, and traditional
    Samoan family organization of persons of Samoan ancestry''; land-alienation law changes need two successive
    legislatures by two-thirds and the Governor. A 2022 Constitutional Review Committee proposed rewording
    this section; adoption not checked. Text read through the WebFetch tool.'
- type: territorial-law
  state: AS
  legal_basis: Revised Constitution of American Samoa, art. II §§ 3(d) and 4 (Senators must be registered
    matai; elected in accordance with Samoan custom by county councils)
  since: '1967-07-01'
  source: revised-constitution-american-samoa-1967
  confidence: high
  verification: read-in-full
  as_of: '1967-07-01'
  locator: art. II §§ 3(d), 4
  note: A Senator must 'be the registered matai of a Samoan family who fulfills his obligations as required
    by Samoan custom'; Senators 'shall be elected in accordance with Samoan custom by the county councils'.
    This is the constitutional footing of the matai system in the territorial legislature.
- type: territorial-law
  state: AS
  legal_basis: A.S.C.A. § 37.0204 (restrictions on alienation of land)
  source: american-samoa-code-37-0204
  confidence: medium
  verification: read-in-full
  locator: § 37.0204(a)-(b)
  note: Prohibits a matai from alienating communal family lands without the Governor's written approval,
    and prohibits alienating any lands except freehold lands to a person with 'less than one-half native
    blood'. FAOLEX reproduction; date of the reproduced text not stated.
