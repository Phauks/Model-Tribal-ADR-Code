dispute_resolution:
  forums:
  - kind: family-group-conference
    name: Family group conferencing / extended family hearing (juvenile)
    description: Uses the extended families of the Community to help the juvenile court resolve juvenile
      offender, incorrigibility and dependency problems by applying the customs and traditions of the
      Pima and Maricopa peoples; the court may appoint a Community member qualified to act as a tribal
      elder to conduct the hearing.
    legal_basis: Salt River Pima-Maricopa Indian Community Code, § 11-31
    case_types:
    - juvenile
    - child-welfare
    participation: court-referred
    relationship_to_court: The appointed elder makes written disposition recommendations to the court,
      which seeks to incorporate the extended family in its order.
    link: https://srpmic-nsn.gov/government/ordinances/
    source: national-center-on-restorative-justice-restorative-justice-tribal-laws-database
    confidence: medium
    verification: bulk-import
    as_of: '2026'
    locator: https://ncorj.org/tribal-law/family-group-conferencing-peacemaking-juvenile-justice/
  provisions:
  - kind: other
    title: DIVISION 2. DISPUTE RESOLUTION; APPEAL AND SETTLEMENT
    citation: Salt River Pima-Maricopa Indian Community Code of Ordinances, Chapter 23 Labor and Employment,
      Division 2 Dispute Resolution; Appeal and Settlement, 23-83 to 23-99
    link: https://srpmic-nsn.gov/wp-content/uploads/2026/05/COO_Chapter-23-Labor-and-Employment_April-2026.pdf
    source: salt-river-salt-river-pima-maricopa-indian-community-code-of
    confidence: medium
    verification: read-in-full
    as_of: '2012-05-30'
    note: Read in full on 2026-11-22 (review queue item 2). Whether this is a dispute resolution provision
      is left for the lead author's review.
    summary: Sets a two-step process for workers' compensation determinations, a managerial review by
      the administrator and then a hearing before the Community's appeals board, a hearing officer appointed
      by the Community Council, whose decisions are final with no judicial review, and preserves the parties'
      ability to settle claims.
    locator: 23-83 to 23-99
