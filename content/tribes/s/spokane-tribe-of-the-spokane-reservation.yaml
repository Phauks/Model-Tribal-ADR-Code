dispute_resolution:
  provisions:
  - kind: arbitration
    title: Section 4-26 Arbitration
    citation: CHAPTER 4 - CIVIL ACTIONS, 4-26.01 to 4-26.09 (Section 4-26 Arbitration)
    link: https://www.spokanetribe.com/wp-content/uploads/2021/12/2021-12-20-RSLOC-Chapter-4-Civil-Actions.pdf
    source: spokane-spokane-chapter-4-civil-actions
    confidence: medium
    verification: read-in-full
    as_of: '2006-08-01'
    locator: 4-26.01 to 4-26.09 (Section 4-26 Arbitration)
    note: Read in full on 2026-11-22 (review queue item 2).
    summary: Governs written arbitration agreements involving the Tribe or transactions within its jurisdiction
      by making them valid and enforceable, letting the parties choose the governing law, requiring the
      Tribal Court to stay actions and order unwilling parties to arbitrate, and having the Court confirm
      awards as civil judgments without reviewing them on the merits, with jurisdiction over actions involving
      the Tribe depending on its express waiver of immunity.
  - kind: arbitration
    title: 4-26.04 Stay of Proceedings and Order to Proceed with Arbitration.
    citation: CHAPTER 4 - CIVIL ACTIONS, 4-26.04; 4-26.08
    link: https://www.spokanetribe.com/wp-content/uploads/2021/12/2021-12-20-RSLOC-Chapter-4-Civil-Actions.pdf
    source: spokane-spokane-chapter-4-civil-actions
    confidence: medium
    verification: read-in-full
    as_of: '2006-08-01'
    locator: 4-26.04; 4-26.08
    note: Read in full on 2026-11-22 (review queue item 2).
    summary: Requires the Tribal Court to stay an action brought on an arbitrable contract until arbitration
      is completed, lets a party ask the Court to order arbitration when another party refuses to proceed,
      and provides that no appeal lies from a Tribal Court order enforcing an arbitration agreement or
      award.
  - kind: other
    title: 7-3.04 Informal Dispute Resolution.
    citation: CHAPTER 7 - DOMESTIC RELATIONS, 7-3.04
    link: https://spokanetribe.com/wp-content/uploads/2021/12/2021-12-16-RSLOC-Chapter-7-Domestic-Relations.pdf
    source: spokane-spokane-chapter-7-domestic-relations
    confidence: medium
    verification: read-in-full
    as_of: '2006-08-01'
    locator: 7-3.04
    note: Read in full on 2026-11-22 (review queue item 2).
    summary: Lets the Court permit an informal resolution of contested issues in a dissolution, separation
      or invalidity-of-marriage proceeding, which may use counseling, mediation or another process consistent
      with Tribal custom, is private and confidential, and any agreement is written, signed by the parties
      and presented to the Court.
