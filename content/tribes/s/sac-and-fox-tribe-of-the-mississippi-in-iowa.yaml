- topic: state-jurisdiction-statute
  value: repealed
  detail: The 1948 act that gave Iowa criminal jurisdiction over offenses by or against Indians on the Sac and Fox (Meskwaki) Reservation was repealed on Dec. 11, 2018. (Pub. L. No. 115-301, 132 Stat. 4395.)
  source: public-law-115-301
  confidence: high
  verification: read-in-full
  locator: Pub. L. 115-301, § 1, 132 Stat. 4395
  note: 'Original grant: Act of June 30, 1948, ch. 759, 62 Stat. 1161, "jurisdiction is hereby conferred on the State of Iowa over offenses committed by or against Indians on the Sac and Fox Indian Reservation in that State" (marginal headnotes interleave in the scan text layer). Iowa civil jurisdiction (Iowa Code § 1.12) was already recorded and is separate. Also cites: statutes-at-large-62-1161.'
