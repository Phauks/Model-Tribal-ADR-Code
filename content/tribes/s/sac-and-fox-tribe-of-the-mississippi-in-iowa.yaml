jurisdiction:
- topic: public-law-280
  value: optional-state
  detail: Iowa assumed civil jurisdiction over causes of action arising within the Sac and Fox Indian
    settlement in Tama County (Iowa Code § 1.12). Civil only; this statute does not address criminal jurisdiction.
  source: iowa-code-1-12
  confidence: medium
  verification: inferred
  as_of: '1967'
