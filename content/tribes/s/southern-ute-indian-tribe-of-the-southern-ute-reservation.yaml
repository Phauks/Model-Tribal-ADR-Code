dispute_resolution:
  provisions:
  - kind: other
    title: 12. Pre-Hearing, Scheduling or Settlement Conference; Stipulations.
    citation: Southern Ute Indian Tribe, Administrative Appeals and Hearings Office (AAHO) Amended Rules
      to Govern Appeals and Hearings, 12 (NILL lists it as 11)
    link: https://www.southernute-nsn.gov/wp-content/uploads/sites/15/2023/05/1c-AAHO-Amended-Hearing-Rules-4-29-19.pdf
    source: southern-ute-southern-ute-indian-tribe-administrative-appeals
    confidence: medium
    verification: read-in-full
    as_of: '2019-04-29'
    note: Read in full on 2026-11-22 (review queue item 2). The National Indian Law Library table of contents
      lists it as "11. Pre-Hearing, Scheduling or Settlement Conference; Stipulations."; the printed heading,
      number or version differs (see research/reviews/2026-11-22-title-only-provisions.json).
    summary: The hearing officer decides whether a pre-hearing, scheduling or settlement conference is
      appropriate, with notice set within ten days after the response to a petition, and a settlement
      or stipulation signed by both parties is given to the hearing officer, who issues an order consistent
      with it if it complies with tribal law.
    locator: 12 (NILL lists it as 11)
  - kind: other
    title: Article 3. DISPUTE RESOLUTION
    citation: Southern Ute Indian Tribal Code, Title 24 Workers' Compensation Code, Article 3 (24-3-101
      to 24-3-104 read); record cites 24-3-103
    link: https://www.southernute-nsn.gov/wp-content/uploads/sites/15/2023/05/Title-24-Workers-Compensation-official-final-version-12May2023.pdf
    source: southern-ute-southern-ute-indian-tribal-code-title-24-workers
    confidence: high
    verification: read-in-full
    as_of: '2023-05-25'
    note: Read in full on 2026-11-22 (review queue item 2). The National Indian Law Library table of contents
      lists it as "Article III. DISPUTE RESOLUTION"; the printed heading, number or version differs (see
      research/reviews/2026-11-22-title-only-provisions.json). Whether this is a dispute resolution provision
      is left for the lead author's review.
    summary: An employee may ask the administrator to reconsider a benefit decision in writing within
      30 days, and if not satisfied may request a hearing before the Administrative Appeals and Hearings
      Office, whose hearing officer issues a decision binding on the parties unless appealed; benefits
      already approved continue during the process and payments made are not recouped except for fraud,
      overpayment or error.
    locator: Article 3 (24-3-101 to 24-3-104 read); record cites 24-3-103
