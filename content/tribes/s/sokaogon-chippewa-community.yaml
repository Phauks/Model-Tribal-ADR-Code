    locator: Chapter 1, Sections 1.1.8 to 1.1.11
    note: Read in full on 2026-11-23 (Sokaogon Chippewa Community Codes, Chapter 1 Tribal Governance (table of contents August 2011; chapter dated 8-30-2011)). Read from the Sokaogon Chippewa Community Codes, Chapter 1, Sections 1.1.8 to 1.1.11 (August 2011). The earlier NARF-based description is supported by the text. Gate 1 item 3 review, research/reviews/2026-11-23-text-read-tier.json, record 514.
    summary: Creates the Traditional Peacemaking Court as a branch of the Tribal Court, staffed by Tribal Judges who serve as peacemakers. A case gets there when a Tribal Court judge refers it with all parties' written consent (not hunting, fishing, traffic or child-protection cases), when all parties jointly ask the Tribal Court Clerk, when a statute provides (including juvenile delinquency and educational neglect), or, in a civil case, when the trial judge orders at least one hour of peacemaking even without consent. The court cannot compel anyone to take part unless another law says so, and peacemakers mediate and cannot decide unless all parties agree in writing. Each party pays $25; sessions are confidential, and results go to the Tribal Court in writing when it referred the case. An agreement has the effect of a court judgment when the Tribal Court enters it, which it does only if the conditions in Section 1.1.11 are met; if there is no agreement or it is breached, Tribal Court proceedings continue.
