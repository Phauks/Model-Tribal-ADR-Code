    title: 'CHAPTER 95: ARBITRATION ORDINANCE'
    citation: Sault Ste. Marie Tribal Code, Chapter 95 Arbitration Ordinance, 95.101-95.110
    link: https://www.saulttribe.com/government/tribal-code/download-files/download-file?path=chaptr95.pdf
