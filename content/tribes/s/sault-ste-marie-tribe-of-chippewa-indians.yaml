dispute_resolution:
  forums:
  - kind: peacemaking
    name: Bekaadziiwiin (Peaceful Life) peacemaking
    own_term:
      name: Bekaadziiwiin
      language_tag: oj
      translation: Peaceful Life (as given in the section heading)
    description: A peacemaking diversion under guidelines promulgated by the Tribal Court; the Tribal
      Peacemaking Committee reviews cases presented by the Tribal Prosecutor and may decline action, refer
      to Bekaadziiwiin for peacemaking, develop a case plan, or refer to the Juvenile Division.
    legal_basis: Sault Ste. Marie Tribal Code Chapter 36, § 36.405
    case_types:
    - juvenile
    - criminal-diversion
    - other
    participation: voluntary-or-court-referred
    relationship_to_court: Peacemakers may hear juvenile offenses, juvenile status offenses, other cases
      referred by the Tribal Court, and cases from tribal members who voluntarily request peacemaking;
      the Committee may ask the prosecutor to file a formal petition if a case plan is not substantially
      followed.
    link: https://www.saulttribe.com/government/tribal-code
    source: national-center-on-restorative-justice-restorative-justice-tribal-laws-database
    confidence: medium
    verification: inferred
    as_of: '2026'
    locator: https://ncorj.org/tribal-law/bekaadziiwiin-peaceful-life-peacemaking-diversion/
    note: The code spells the term both Bekaadziiwiin and Bekaadziiwin. Language tag oj (Ojibwe) assigned
      from the Tribe's identity; the source does not name the language.
  provisions:
  - kind: arbitration
    title: 'CHAPTER 95: ARBITRATION ORDINANCE'
    citation: Sault Ste. Marie Tribal Code, Chapter 95 Arbitration Ordinance, 95.101-95.110
    link: https://www.saulttribe.com/government/tribal-code/download-files/download-file?path=chaptr95.pdf
    source: sault-ste-sault-ste-marie-tribal-code-chapter-95
    confidence: medium
    verification: read-in-full
    as_of: '1999-06-22'
    locator: 95.101-95.110
    note: Read in full on 2026-11-22 (review queue item 2).
    summary: Written agreements to arbitrate controversies under contracts entered by the Tribe, its instrumentalities
      or others subject to Tribal jurisdiction are valid, irrevocable and specifically enforceable; the
      Tribal Court must stay its own proceedings and order arbitration when a party asks, confirms awards
      and enforces them as civil judgments, with no appeal from an order enforcing an agreement or award,
      and the Tribe's or an instrumentality's court exposure depends on an explicit waiver of immunity,
      which the ordinance itself does not supply (95.110).
  database_listings:
