    description: A peacemaking diversion under guidelines promulgated by the Tribal Court; the Tribal
      Peacemaking Committee reviews cases presented by the Tribal Prosecutor and may decline action, refer
      to Bekaadziiwiin for peacemaking, develop a case plan, or refer to the Juvenile Division.
    legal_basis: Sault Ste. Marie Tribal Code Chapter 36, § 36.405
    case_types:
    - juvenile
    - criminal-diversion
    - other
    participation: voluntary-or-court-referred
    relationship_to_court: Peacemakers may hear juvenile offenses, juvenile status offenses, other cases
      referred by the Tribal Court, and cases from tribal members who voluntarily request peacemaking;
      the Committee may ask the prosecutor to file a formal petition if a case plan is not substantially
      followed.
