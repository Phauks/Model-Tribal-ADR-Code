    note: Read in full on 2026-11-22 (review queue item 2).
    summary: Written agreements to arbitrate controversies under contracts entered by the Tribe, its instrumentalities
      or others subject to Tribal jurisdiction are valid, irrevocable and specifically enforceable; the
      Tribal Court must stay its own proceedings and order arbitration when a party asks, confirms awards
      and enforces them as civil judgments, with no appeal from an order enforcing an agreement or award,
      and the Tribe's or an instrumentality's court exposure depends on an explicit waiver of immunity,
      which the ordinance itself does not supply (95.110).
