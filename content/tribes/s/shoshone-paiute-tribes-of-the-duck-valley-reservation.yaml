      with 60 days to cure, the parties then meet within 30 days, and if the dispute is not resolved within
      30 days after meeting either party may pursue any lawful remedy, with disputes under the compact
      resolved in a federal court of competent jurisdiction under a limited waiver of sovereign immunity
      (no monetary damages, only the Tribe and State as parties) and mediation or arbitration available
      by mutual written agreement.
