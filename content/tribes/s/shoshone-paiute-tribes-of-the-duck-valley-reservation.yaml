  - state: NV
    status: deemed-approved
    dispute_resolution_summary: A party alleging a substantial and continuing default gives written notice
      with 60 days to cure, the parties then meet within 30 days, and if the dispute is not resolved within
      30 days after meeting either party may pursue any lawful remedy, with disputes under the compact
      resolved in a federal court of competent jurisdiction under a limited waiver of sovereign immunity
      (no monetary damages, only the Tribe and State as parties) and mediation or arbitration available
      by mutual written agreement.
    dispute_resolution_locator: ARTICLE XIV. DEFAULT AND TERMINATION, 1. Default.
    source: compact-nv-shoshone-paiute-tribes-of-the-duck-valley-reservation-2010-07-06
    confidence: high
    verification: read-in-full
    as_of: '2010-07-06'
    locator: ARTICLE XIV. DEFAULT AND TERMINATION, 1. Default.
    note: Rewritten on 2026-11-22 from this nation's own compact (data gap review item 199, research/reviews/2026-11-22-compact-clauses-recheck.json);
      the summary had been copied from compact-nv-washoe-tribe-of-nevada-and-california-2018 without reading,
      and it gave 90 days to cure and a Washoe County federal venue with limited relief, where this compact
      gives 60 days to cure and allows any lawful remedy. Status copied from this nation's most recent
      approved or deemed-approved entry for this state in the Office of Indian Gaming list (2010-07-06).
