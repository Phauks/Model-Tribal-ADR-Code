dispute_resolution:
  forums:
  - kind: restorative-justice
    name: Juvenile diversion conference with the Peacemaker coordinator
    description: The Tribal prosecutor, with the concurrence of the juvenile probation officer and the
      Peacemaker coordinator, may divert a juvenile instead of filing a juvenile offender petition, holding
      an informal conference with the juvenile and parents or guardians on alternatives.
    legal_basis: Grand Traverse Band Tribal Code, Title 10, Chapter 4, Sec. 415 (Diversion)
    case_types:
    - juvenile
    - criminal-diversion
    participation: voluntary
    relationship_to_court: Occurs before a petition is filed; if positive results are not achieved after
      30 days, the probation officer may recommend filing a petition.
    enforcement: Conference findings and the agreed disposition are set out in writing and monitored by
      the juvenile probation officer; dispositions must conclude within six months unless extended by
      agreement; statements are inadmissible at a later trial.
    link: https://peacemaking.narf.org/wp-content/uploads/2025/07/GTB-Juvenile-Code-Diversion.pdf
    source: grand-traverse-band-title-10-juvenile-code-415
    confidence: medium
    verification: read-in-full
    as_of: '1999-10-01'
    locator: Title 10, Sec. 415(a)-(g)
    note: Parents or guardians must voluntarily consent after an explanation of rights; the prosecutor
      cannot compel involuntary action.
  - kind: peacemaking
    name: Peacemaking (Tribal Court)
    description: The Tribal Court uses peacemaking to mediate cases where dispute resolution is preferred
      over an adversarial approach; the Honoring Nations report says it has helped resolve contentious
      issues while keeping community ties. The court's current staff list includes a peacemaker and program
      director position.
    relationship_to_court: Used by the Tribal Court as part of its handling of disputes.
    link: https://nnigovernance.arizona.edu/grand-traverse-band-tribal-court
    source: nni-honoring-nations-gtb-tribal-court
    confidence: medium
    verification: inferred
    as_of: '2000'
    note: Secondary source (Honoring Nations 1999 report). The staff position is from the Band's Tribal
      Court web page (https://gtbindians.org/tribal_court.asp, read 2026-11-21); no staff names recorded.
      Case types for peacemaking are not stated, so none are recorded.
  provisions:
  - kind: peacemaking
    title: Juvenile Code – Diversion
    citation: Grand Traverse Band Tribal Code, Title 10, Chapter 4, Sec. 415
    summary: Authorizes pre-petition juvenile diversion conferences involving the prosecutor, juvenile
      probation officer and Peacemaker coordinator, with written agreed dispositions.
    link: https://peacemaking.narf.org/wp-content/uploads/2025/07/GTB-Juvenile-Code-Diversion.pdf
    source: grand-traverse-band-title-10-juvenile-code-415
    confidence: medium
    verification: read-in-full
    as_of: '1999-10-01'
  - kind: arbitration
    title: Chapter 4 - Grand Traverse Band Arbitration Code
    citation: Title 3 Justice, Chapter 4 - Grand Traverse Band Arbitration Code, 401-413 (Chapter 4)
    link: https://narf.org/nill/codes/grand_traverse/Title_3.pdf
    source: grand-traverse-title-3-justice-chapter-4-grand-traverse-band
    confidence: medium
    verification: read-in-full
    as_of: '2003-03-19'
    note: Read in full on 2026-11-22 (review queue item 2).
    summary: Authorizes arbitration of disputes under written contracts that the Tribal Council designates
      by resolution, makes agreements to arbitrate enforceable, has the Tribal Court stay its own proceedings,
      order arbitration and confirm awards (not reviewable except on listed grounds, with no appeal from
      enforcement orders), and makes Band police available to support awards without waiving sovereign
      immunity.
    locator: 401-413 (Chapter 4)
  database_listings:
