dispute_resolution:
  forums:
  - kind: elders-council
    name: Panel of elders in cultural causes of action
    description: The Court of Central Jurisdiction enters as its judgment and order a decision made by
      a panel of elders in a cultural cause of action between Band members; the Court has jurisdiction
      over causes of action arising from unwritten cultural law.
    legal_basis: 5 MLBSA §§ 103, 111(c), 114(h); 24 MLBSA §§ 601-603
    case_types:
    - other
    relationship_to_court: Panel decisions are entered by the Court of Central Jurisdiction (the Chief
      Justice) as a judgment and order.
    enforcement: Entered as a court judgment and order; for cultural offenses the court may order sanctions
      consistent with Band traditions, including injunctions, removal, exclusion, community service or
      fines (24 MLBSA § 603).
    link: https://mlbo.dev/content/3-government/17-statutes-policies/mltitle05judbranch.pdf
    source: mille-lacs-title-5-judicial-branch
    confidence: medium
    verification: read-in-full
    as_of: '2011-06-27'
    locator: 5 MLBSA §§ 103, 111(c), 114(h)
    note: 'The statute text read does not say how a case reaches a panel of elders, how elders are chosen,
      or whether participation is voluntary, so participation is left out. ''Cultural harm'' in 24 MLBSA
      § 602 concerns conduct that harms the community''s good health or raises fear in the community;
      ''other'' used for case type. Enforcement detail from Title 24 (source mille-lacs-title-24-judicial-proceedings).
      Component band: Mille Lacs Band of Ojibwe.'
  provisions:
  - kind: traditional-dispute-resolution
    title: Cultural causes of action; panel of elders decisions
    citation: 5 MLBSA § 103
    summary: Authorizes the Court of Central Jurisdiction to enter a panel of elders' decision in a cultural
      cause of action between Band members as a judgment and order.
    link: https://mlbo.dev/content/3-government/17-statutes-policies/mltitle05judbranch.pdf
    source: mille-lacs-title-5-judicial-branch
    confidence: medium
    verification: read-in-full
    as_of: '2011-06-27'
    locator: § 103
    note: 'Component band: Mille Lacs Band of Ojibwe.'
  - kind: traditional-dispute-resolution
    title: Cultural actions
    citation: 24 MLBSA §§ 601-603
    summary: Gives any person a cause of action for cultural harm and lets the court impose sanctions
      consistent with Band traditions, such as injunctions, exclusion, community service or fines.
    link: https://www.mlbo.dev/content/3-government/17-statutes-policies/title-24_judicial-proceedings_amendents-through-1.23.14.pdf
    source: mille-lacs-title-24-judicial-proceedings
    confidence: medium
    verification: read-in-full
    as_of: '2014-01-23'
    locator: §§ 601-603
    note: 'Component band: Mille Lacs Band of Ojibwe.'
