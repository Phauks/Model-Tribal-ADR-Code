dispute_resolution:
  provisions:
  - kind: arbitration
    title: Chapter 15 ARBITRATION
    citation: Code of the Menominee Indian Tribe, Chapter 15 Arbitration, 15-1 to 15-12
    link: https://law.menominee-nsn.gov/us/nsn/menominee/legislature/code/I/15/index.full.html
    source: menominee-wisconsin-code-of-the-menominee-indian-tribe-chapter-15
    confidence: high
    verification: read-in-full
    as_of: '2024-12-05'
    note: Read in full on 2026-11-22 (review queue item 2).
    summary: Lets the Tribe or the Menominee Indian Gaming Authority arbitrate disputes with third parties
      under listed contracts in a way that preserves sovereign immunity, making written arbitration clauses
      valid and enforceable, requiring tribal courts to stay related suits and, on petition, to compel
      arbitration or appoint an arbitrator, allowing arbitrators to summon witnesses through the court,
      and letting the Tribal Court confirm, vacate, modify or enter judgment on an award where the parties
      agreed to judgment on it.
    locator: 15-1 to 15-12
  - kind: arbitration
    title: Chapter 50 DISPUTE RESOLUTION
    citation: Code of the Menominee Indian Tribe, Chapter 50 Dispute Resolution, 50-1 to 50-11 (Articles
      I and II)
    link: https://law.menominee-nsn.gov/us/nsn/menominee/legislature/code/I/50/index.full.html
    source: menominee-wisconsin-code-of-the-menominee-indian-tribe-chapter-50
    confidence: medium
    verification: read-in-full
    as_of: '2011-09-15'
    locator: 50-1 to 50-11 (Articles I and II)
    note: Read in full on 2026-11-22 (review queue item 2).
    summary: Makes the Tribe suable in Menominee Tribal Court solely to enforce dispute resolution terms,
      including binding arbitration clauses, in specified agreements connected with tribal housing limited
      partnerships (Nos. 5 and 6, then 7 and 8) that use low-income housing tax credits, with the court
      enforcing those clauses as written and the authority resting on the constitutional provision allowing
      suit in tribal courts to enforce ordinance rights.
