    title: 'Chapter 3: Operation of Peacemaker Court (Mashpee Wampanoag Tribal Judiciary Ordinance)'
    link: https://www.mashpeewampanoagtribe-nsn.gov/s/OPERATION-OF-PEACEMAKER-COURT.pdf
    source: mashpee-peacemakers-court-pages
    confidence: low
