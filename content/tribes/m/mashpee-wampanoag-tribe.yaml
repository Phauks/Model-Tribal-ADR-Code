dispute_resolution:
  forums:
  - kind: peacemaking
    name: Peacemaker Court
    description: A vehicle for parties to reach consensual solutions by talking things out, described
      by the Tribe as the Mashpee Wampanoag Tribal way of resolving conflicts, predating the court system;
      it need not determine fault.
    legal_basis: 'Chapter 3: Operation of Peacemaker Court, Sections 1-3 and following'
    case_types:
    - family
    - civil
    - commercial
    - other
    participation: voluntary
    relationship_to_court: The Chief Judge appoints peacemakers (two, one male and one female) for civil
      matters within District Court jurisdiction; peacemaking is not allowed in criminal matters, and
      peacemakers report results to the District Court or Chief Judge.
    enforcement: An agreement reached by the parties is reduced to writing, signed, and is a final decision
      without appeal.
    link: https://peacemaking.narf.org/wp-content/uploads/2025/07/Mashpee-Chapter-3-OPERATION-OF-PEACEMAKER-COURT.pdf
    source: mashpee-chapter-3-peacemaker-court
    confidence: medium
    verification: read-in-full
    as_of: '2025'
    locator: Chapter 3, Sections 1, 2(a)-(f), 3
    note: Eligible matters include family and other relationships, community relations among neighbors,
      and civil matters involving personal, community or economic relationships. Parties are asked to
      participate without attorneys. Peacemakers may involve service providers including traditional healers
      and leaders, with consent. The Tribe's own pages link a brochure, a participant's guide and an intake
      form; see the material facts. as_of is NARF posting year.
  - kind: peacemaking
    name: Peacemakers Court (brochure description)
    own_term:
      name: Wunahtyâhe8âôk
      language_tag: wam
      translation: Peacemaking (as glossed in the brochure)
    description: The brochure lists ideal cases as family disputes (spouses, parents and children, extended families), community disputes (nuisance, trespass, disorderly conduct, disturbing the peace), financial disputes (personal debts, breach of contract) and individual land-use and access disputes. Sessions include one male and one female peacemaker, no lawyers, voluntary participation, and a binding resolution agreed by all parties. Guiding principles are given in English and Wampanoag.
    case_types:
    - family
    - civil
    - commercial
    - property-or-land
    - other
    participation: voluntary
    relationship_to_court: Part of the Tribal Judiciary. A person may ask the Court Clerk for peacemaking before filing a lawsuit, or a party to a pending District Court civil case may ask the judge to send it to peacemaking; the other party may decline, in which case the case stays in court, and criminal matters are excluded. The Chief Judge appoints one male and one female peacemaker from a roll certified by the Judiciary Committee and appointed by the Tribal Council; peacemakers serve under the Chief Judge's direction and supervision and report results to the District Court or Chief Judge (Chapter 3, Secs. 2-4).
    enforcement: The brochure calls the final decision binding and agreed by all parties; Chapter 3 Sec. 2(f) says an agreement reached is a final decision without appeal, and Sec. 2(b) says the Peacemaker Court cannot compel anyone to take part. The texts read do not describe a separate enforcement mechanism.
    link: https://www.mashpeewampanoagtribe-nsn.gov/s/PM-Brochure-updated1.pdf
    source: mashpee-peacemakers-court-brochure
    confidence: medium
    verification: read-in-full
    as_of: '2015'
    note: 'Read in full on 2026-11-23 (Mashpee Wampanoag Tribe, Chapter 3: Operation of Peacemaker Court (no enactment date printed); Peacemakers Court brochure (no date printed)). The numeral 8 is part of the Wampanoag spelling as printed and is kept exactly. Language tag wam (Wampanoag) assigned because the brochure gives Wampanoag terms beside English; the brochure does not name the language. Supervision and appointment detail from Chapter 3 Operation of Peacemaker Court (read in full). Peacemaker names printed in the brochure are not recorded. Date: undated (no date printed on the brochure). Gate 1 item 3 review, research/reviews/2026-11-23-text-read-tier.json, record 273.'
  published_materials:
  - kind: brochure
    title: Peacemakers Court Brochure
    link: https://www.mashpeewampanoagtribe-nsn.gov/s/PM-Brochure-updated1.pdf
    source: mashpee-peacemakers-court-brochure
    confidence: medium
    verification: read-in-full
    as_of: '2015'
    note: 'Read in full on 2026-11-23 (Mashpee Wampanoag Peacemakers Court brochure (Wunahtyahe8ahok / Peacemaking); no date printed). Brochure read in full (2 pages); no date printed. Printed title ''Mashpee Wampanoag Peacemakers Court''. Says peacemaking is voluntary, with no lawyers, a resolution agreed by both parties, one male and one female peacemaker per session; a session is requested through the Court Clerk or a Peacemaking Intake Form. Date: undated (no date printed on the brochure). Gate 1 item 3 review, research/reviews/2026-11-23-text-read-tier.json, record 275.'
  - kind: guide
    title: A Participant's Guide to Peacemaking
    link: https://www.mashpeewampanoagtribe-nsn.gov/s/Participants-Guide-to-Peacemaking-final.pdf
    source: mashpee-peacemakers-court-pages
    confidence: low
    verification: read-in-full
    as_of: '2026-11-21'
    note: Guide opened (20 pages). It was developed by the Elders Judiciary Committee with the Suffolk
      University Law School Indigenous Peoples Rights Clinic. Undated. On Nov. 21, 2026 the link was not
      found on the Tribe's current Peacemakers Court pages, but the file still resolves.
  - kind: rules
    title: 'Chapter 3: Operation of Peacemaker Court (Mashpee Wampanoag Tribal Judiciary Ordinance)'
    link: https://www.mashpeewampanoagtribe-nsn.gov/s/OPERATION-OF-PEACEMAKER-COURT.pdf
    source: mashpee-peacemakers-court-pages
    confidence: low
    verification: read-in-full
    as_of: '2026-11-21'
    note: Standalone copy of Chapter 3 of the Tribal Judiciary Ordinance (2008-ORD-002, enacted Oct. 7,
      2009), so it is ordinance text rather than separate court rules; kind stays "rules" because the
      schema has no kind for ordinance text. The current text is Chapter 3 of 2018-ORD-007 (adopted June
      28, 2018). The standalone PDF is undated, and which version it reproduces was not confirmed. The
      NARF copy of Chapter 3 was also read (source mashpee-chapter-3-peacemaker-court).
  provisions:
  - kind: peacemaking
    title: 'Chapter 3: Operation of Peacemaker Court'
    citation: 'Chapter 3: Operation of Peacemaker Court'
    link: https://peacemaking.narf.org/wp-content/uploads/2025/07/Mashpee-Chapter-3-OPERATION-OF-PEACEMAKER-COURT.pdf
    source: mashpee-chapter-3-peacemaker-court
    confidence: medium
    verification: read-in-full
    as_of: '2025-09-29'
    locator: Chapter 3, Secs. 1-4 (Guiding Principles; Scope and Jurisdiction; Peacemakers; Peacemaking Procedure)
    note: 'Read in full on 2026-11-23 (Mashpee Wampanoag Tribe, Chapter 3: Operation of Peacemaker Court (no enactment date printed in the capture)). Read in full from the Chapter 3 text (Mashpee Wampanoag Peacemaker Court ordinance). Provides authorization, guiding principles, qualifications, and procedures. No enactment date is printed in the text read. See also the Peacemakers Court brochure. Gate 1 item 3 review, research/reviews/2026-11-23-text-read-tier.json, record 274.'
    summary: 'Sets up the Mashpee Wampanoag Peacemaker Court: voluntary, non-adversarial peacemaking in civil matters (not criminal), where two peacemakers, one male and one female, appointed by the Chief Judge, help the parties reach a consensus agreement. A case enters on a written request to the Court Clerk before filing, or on a party''s request to the District Court judge after filing; the other party may decline. The Court cannot compel anyone, and an agreement reached is a final decision without appeal.'
