dispute_resolution:
  forums:
  - kind: peacemaking
    name: Peacemakers (Peacemakers Council)
    description: A forum of Elders and other Tribal Members who volunteer as mediators for disputes arising
      on Tribal Lands; Peacemakers act by consensus decision, do not decide fault or liability and cannot
      coerce an agreement.
    legal_basis: 1 M.P.T.L. ch. 4, §§ 1-11 (originally established by TCR102693-01)
    case_types:
    - civil
    - employment
    - other
    participation: voluntary
    relationship_to_court: 'Parties must consent in writing; matters may come by direct mediation request,
      by resolution of the Tribal Council or Elders Council, or by referral from the Tribal Court or the
      Mashantucket Employment Rights Office with both parties'' consent. Excluded: appeals from Council,
      Elders Council or court decisions (unless specifically referred), grievances, vendor contract disputes
      with the Tribe, and appeals from certain committees and programs.'
    enforcement: Parties sign a written Agreement acknowledging it may be enforced in Tribal Court; an
      action to enforce a referred agreement must be filed within thirty days of the breach becoming known.
    link: https://peacemaking.narf.org/wp-content/uploads/2025/07/Mashantucket-Title-1-Judiciary.pdf
    source: mashantucket-title-1-judiciary
    confidence: medium
    verification: read-in-full
    as_of: '2017-06-22'
    locator: 1 M.P.T.L. ch. 4 §§ 1, 2, 3, 6, 10, 11
    note: Proceedings are confidential and participants sign non-disclosure agreements (§ 6). Filing a
      mediation request stays limitation periods for administrative or court actions (§ 10).
  provisions:
