land_establishment:
- land_area: Muckleshoot Indian Reservation, Washington Territory
  method: executive-order
  instrument: Exec. Order of Apr. 9, 1874, 1 Kappler 918
  date: '1874-04-09'
  detail: First set aside
  source: executive-order-1874-04-09-muckleshoot-reservation
  confidence: medium
  verification: read-in-full
  locator: 1 Kappler 919
  note: 'The instrument reads: “withdrawn from sale or other disposition, and set apart as the Muckleshoot Indian Reservation, for the exclusive use of the Indians in that locality”. The order says it is "supplemental to the action of the Department approved by the President January 20, 1857" (Medicine Creek treaty lands); that 1857 action was not located, so it is possible the 1857 action was the true first set-aside.'
