gaming:
  compacts:
  - state: MN
    status: approved
    dispute_resolution_summary: The video games of chance compact has no general arbitration or mediation
      clause; when the State designates a machine as non-compliant, the nation may accept the finding,
      submit the device to an independent gaming test laboratory, or contest the finding in federal district
      court (or before the National Indian Gaming Commission or another court if jurisdiction is declined).
    dispute_resolution_locator: Section 4.6 (Demand for Remedies for Non-Complying Video Games of Chance)
    source: compact-mn-prairie-island-indian-community-in-the-s-1990
    confidence: medium
    verification: inferred
    as_of: '1990-04-02'
    locator: Section 4.6 (Demand for Remedies for Non-Complying Video Games of Chance)
    note: state model compact; nation-specific text not checked. Read from the 1990 Prairie Island Indian
      Community video games of chance compact; Minnesota nations also hold separate blackjack compacts,
      which were not summarized. Status copied from this nation's most recent approved or deemed-approved
      entry for this state in the Office of Indian Gaming list (2024-10-17).
jurisdiction:
- topic: public-law-280
  value: mandatory-state
  detail: 'Minnesota is a mandatory state: 18 U.S.C. § 1162(a) (criminal) and 28 U.S.C. § 1360(a) (civil)
    extend state jurisdiction to all Indian country within Minnesota. Applies to the nation''s Indian
    country within Minnesota; the statute itself does not identify which lands are Indian country.'
  source: us-code-title-18-section-1162
  confidence: medium
  verification: inferred
  as_of: '2010-07-29'
  locator: 18 U.S.C. § 1162(a) and 28 U.S.C. § 1360(a), entry "Minnesota"
  note: Statute is primary; nation matched to Minnesota by office state in the BIA Tribal Leaders Directory,
    so confidence is medium. Cited jointly with us-code-title-28-section-1360.
