jurisdiction:
- topic: public-law-280
  value: mandatory-state
  detail: 'Minnesota is a mandatory state: 18 U.S.C. § 1162(a) (criminal) and 28 U.S.C. § 1360(a) (civil)
    extend state jurisdiction to all Indian country within Minnesota. Applies to the nation''s Indian
    country within Minnesota; the statute itself does not identify which lands are Indian country.'
  source: us-code-title-18-section-1162
  confidence: medium
  verification: inferred
  as_of: '2010-07-29'
