    dispute_resolution_summary: After written notice and a written response within 15 days, the parties
      meet and confer within 30 days, and if unresolved 30 calendar days after the first meeting either
      party may seek arbitration before a single JAMS arbitrator (neither party is required to agree to
      arbitrate), with disputes not resolved by meeting, arbitration or other agreed means going to the
      United States District Court (or a state court if federal court lacks jurisdiction) for injunctive,
      declaratory or specific-performance relief only, under a limited waiver of sovereign immunity.
