- topic: hearth-act-leasing-regulations
  value: approved
  detail: The Secretary of the Interior approved the leasing regulations (Agricultural, Business, Residential) of the Match-e-be-nash-she-wish Band, as the Bureau of Indian Affairs' list names it, under the HEARTH Act, 25 U.S.C. § 415(h), on Aug. 25, 2021, so the nation can lease its trust land for those purposes under its own regulations without the Bureau of Indian Affairs approving each lease.
