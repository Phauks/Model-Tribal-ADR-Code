jurisdiction:
- topic: public-law-280
  value: excepted
  detail: 'Criminal only: 18 U.S.C. § 1162(a) provides that on Annette Islands the Metlakatla Indian community
    may exercise jurisdiction over offenses committed by Indians as tribes do where state jurisdiction
    has not been extended. 28 U.S.C. § 1360(a) (civil) lists all Indian country in Alaska with no exception.'
  source: us-code-title-18-section-1162
  confidence: high
  as_of: '2010-07-29'
  locator: 18 U.S.C. § 1162(a) table; 28 U.S.C. § 1360(a) table
  note: Statute text current as amended through Pub. L. 111-211 (2010).
