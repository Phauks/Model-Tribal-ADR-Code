    dispute_resolution_summary: 'The compact has no general arbitration or mediation clause: if the state
      gaming agency finds non-compliance and the tribal operation does not correct it after notice, the
      State may sue in United States District Court to enjoin the activity under a tribal waiver of immunity,
      while certain operational disagreements, such as table-game supervisory staffing, go to binding
      American Arbitration Association arbitration.'
