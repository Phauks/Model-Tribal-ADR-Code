  - kind: peacemaking
    title: Title XXIV – Choctaw Peacemaker Code (Choctaw Itti-kāna-ikbi Code)
    citation: Choctaw Tribal Code, Title XXIV, Chapter 1
    summary: Creates the Itti-kāna-ikbi Court, sets its jurisdiction, peacemaker roster, use of tribal
      traditions, procedures, form and enforcement of agreements.
    link: https://peacemaking.narf.org/wp-content/uploads/2025/07/Miss-Choctaw-Title-24-Choctaw-Peacemaker-Code.pdf
