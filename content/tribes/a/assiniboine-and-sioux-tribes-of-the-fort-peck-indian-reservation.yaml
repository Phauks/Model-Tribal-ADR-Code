land_establishment:
- land_area: Fort Peck Reservation, Montana
  method: agreement
  instrument: Agreement of Dec. 28, 1886, ratified by Act of May 1, 1888, ch. 213, 25 Stat. 113
  date: '1888-05-01'
  detail: First set aside
  source: act-1888-05-01-fort-peck-fort-belknap-blackfeet-agreement
  confidence: medium
  verification: read-in-full
  locator: 25 Stat. 113, art. (Fort Peck Reservation boundary)
  note: 'The instrument reads: “the separate reservation for the Indians now attached to and receiving rations at the, Fort Peck Agency, Montana, shall be bounded as follows”. Agreement (Dec. 28, 1886) ratified by Congress; it carves the separate Fort Peck reservation out of the larger Gros Ventre, Piegan, Blood, Blackfeet and River Crow reservation created by Exec. Order of July 5, 1873 (1 Kappler 855-856), which does not name the Assiniboine or Sioux. The act names "Indians now attached to ... Fort Peck Agency," not the Assiniboine and Sioux Tribes by name.'
