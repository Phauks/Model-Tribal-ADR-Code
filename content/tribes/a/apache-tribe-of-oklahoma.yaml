- topic: hearth-act-leasing-regulations
  value: approved
  detail: The Secretary of the Interior approved the leasing regulations (Business) of the Apache Tribe of Oklahoma, as the Bureau of Indian Affairs' list names it, under the HEARTH Act, 25 U.S.C. § 415(h), on Dec. 28, 2017, so the nation can lease its trust land for those purposes under its own regulations without the Bureau of Indian Affairs approving each lease.
