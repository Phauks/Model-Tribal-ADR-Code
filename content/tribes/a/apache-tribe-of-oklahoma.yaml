- topic: public-law-280
  value: not-a-public-law-280-state
  detail: Oklahoma is not one of the states that Public Law 280 required to take jurisdiction or that chose to take it, so the state has no Public Law 280 jurisdiction over the nation's Indian country in Oklahoma. Other federal laws can still give a state some jurisdiction.
  source: bia-faq-public-law-280
  confidence: medium
  verification: inferred
  as_of: '2017-07-18'
  locator: Answer, second and third paragraphs (the lists of mandatory and optional states)
