dispute_resolution:
  forums:
  - kind: peacemaking
    name: Peacemaker Court
    description: A division of the tribal courts providing a forum for traditional Alabama-Coushatta methods,
      customs and techniques to resolve disputes informally; peacemakers act as intermediaries and may
      not decide a matter the parties cannot resolve by agreement.
    legal_basis: Comprehensive Codes of Justice, Title II – Peacemaker Code, Chapter I, Sec. 101-112
    case_types:
    - civil
    - criminal-sentencing
    - other
    participation: voluntary-or-court-referred
    relationship_to_court: Established as a division of the courts under supervisory control of the Chief
      Judge of the Trial Division; a trial judge may refer a matter when all parties agree in writing,
      or parties may file a joint written request with the Clerk without filing a civil action. Tribal
      Probation may require a defendant to attend for traditional counseling as a probation condition.
    enforcement: Agreements are presented as proposed consent decrees signed by the parties and approved
      by the trial court; the resulting judgment may be enforced like any other trial court judgment.
    link: https://peacemaking.narf.org/wp-content/uploads/2025/07/Alabama-Coushatta-Peacemaker-Code.pdf
    source: alabama-coushatta-title-2-peacemaker-code
    confidence: medium
    verification: read-in-full
    as_of: '2014-11-24'
    locator: Title II, Sec. 101-111
    note: 'Statements in peacemaking are confidential and inadmissible (Sec. 107); attorneys may not participate
      (Sec. 108); consent may be withdrawn at any time (Sec. 106(B)). Case types: any matter a judge believes
      suitable, criminal defendants with speedy-trial waiver, probation referrals.'
  provisions:
  - kind: peacemaking
    title: Title II – Peacemaker Code
    citation: Alabama-Coushatta Comprehensive Codes of Justice, Title II, Chapter I, Sec. 101-112
