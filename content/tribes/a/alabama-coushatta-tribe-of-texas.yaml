  detail: Texas exercises civil and criminal jurisdiction within the Alabama-Coushatta reservation as if it had assumed that jurisdiction with the tribe's consent under 25 U.S.C. §§ 1321 and 1322. (Pub. L. No. 100-89, § 206(f), 101 Stat. at 671-72.)
