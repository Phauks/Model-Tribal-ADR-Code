  source: louisiana-governor-federally-and-state-recognized-tribes
  confidence: high
  verification: bulk-import
  as_of: '2026'
  note: Louisiana recognized tribes by legislative concurrent resolutions; the individual resolutions
    were not retrieved.
- type: state
  state: LA
  legal_basis: Louisiana Revised Statutes 46:2305(B) (Acts 2018, No. 102), Native American Commission
    membership, listed as 'Bayou Lafourche Band of Biloxi-Chitimacha-Choctaw'
  source: louisiana-revised-statutes-46-2305
  confidence: high
  verification: inferred
  as_of: '2018'
  locator: R.S. 46:2305(B)
  note: The statute gives the tribe a seat on the Native American Commission; it does not itself confer
    recognition.
- type: state
  state: LA
  legal_basis: Louisiana Senate Concurrent Resolution No. 105 (2004 Regular Session); earlier Senate Concurrent
    Resolution No. 124 (1990) as members of the United Houma Nation
  source: louisiana-senate-concurrent-resolution-105-2004
  confidence: medium
  verification: inferred
  as_of: '2004'
  note: Enrolled text only 'reacknowledges the Indian ancestry' of members for education and health benefit
    purposes, narrower than the introduced 'formally recognizes' wording. A 2022 resolution to reaffirm
    recognition (Senate Concurrent Resolution No. 54) stayed pending in committee.
