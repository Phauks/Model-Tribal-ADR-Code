- topic: public-law-280
  value: not-assumed
  detail: Montana's 2024 legislative staff summary states that the Flathead Reservation is the only reservation in Montana under Public Law 280; no other Montana reservation is under state jurisdiction by the 1963 act. (Mont. Legis. Servs. Div., Montana & Public Law 280, at 1 (Apr. 2024).)
  source: montana-legislative-services-division-public-law-280-2024
  confidence: medium
  verification: read-in-full
  locator: Mont. Legis. Servs. Div. memo p. 1; Mont. Code Ann. § 2-1-301
  note: 'Secondary source (legislative staff). Statutory text names only Flathead in § 2-1-301. Little Shell has no reservation in the roster data. Turtle Mountain (ND-based) has MT presence only. Fort Peck: a state court allowed divorce under a 1938 tribal enactment (State ex rel. Iron Bear v. Dist. Ct., 162 Mont. 335, 512 P.2d 1292 (1973)); that is tribal consent in a domestic-relations setting, not Public Law 280; the research read only the opening. Also cites: montana-code-annotated-2-1-301.'
- topic: public-law-280
  value: not-assumed
  detail: The Supreme Court held that Montana never took the "affirmative legislative action" needed to assume jurisdiction over the Blackfeet Reservation, so a tribal-council act could not give the State civil jurisdiction. (Kennerly v. Dist. Ct. of Mont., 400 U.S. 423, 425, 427 (1971).)
  source: kennerly-v-district-court-of-montana-1971
  confidence: high
  verification: read-in-full
  locator: 400 U.S. at 425
  note: 'Quote as printed in the official report (dash punctuation as in the PDF text). Holding at 427: the Tribal Council''s unilateral action was insufficient under the 1953 Act.'
- topic: public-law-280
  value: optional-state
  detail: Montana law lets any other tribe request state jurisdiction by resolution to the governor, who must proclaim it within 60 days, but only after the tribe's own approval and the consent of each affected county commission. (Mont. Code Ann. § 2-1-302.)
  source: montana-code-annotated-2-1-301
  confidence: high
  verification: read-in-full
  locator: Mont. Code Ann. § 2-1-302(1)-(2); § 2-1-303
  note: Procedure only; the research found no proclamation under it for any other tribe. Under § 2-1-303 the State assumes jurisdiction 60 days after the proclamation. Enacted as 1963 Mont. Laws ch. 81 (section history lines).
- topic: environmental-treatment-as-a-state
  value: clean-water-act-water-quality-standards
  detail: EPA found the nation eligible on May 2, 2012 to set water quality standards (treatment in a similar manner as a state under Clean Water Act § 518), and first approved its standards on Aug. 14, 2024.
  source: epa-actions-on-tribal-water-quality-standards
  confidence: high
  verification: inferred
  as_of: '2012-05-02'
  locator: 'Table of approvals by Tribe, column "Regulatory Programs": "WQS Program"'
- topic: water-rights-settlement
  value: enacted
  detail: Congress enacted the Blackfeet Water Rights Settlement Act in 2016 (Pub. L. No. 114-322), settling the water rights of Blackfeet Tribe. It quantifies 50,000 acre-feet a year in all and authorizes about $420.0 million in federal funds, as the Congressional Research Service counts it (R44148, Table 1).
  source: public-law-114-322
  confidence: high
  verification: inferred
  as_of: '2016'
  locator: Congressional Research Service, R44148, Table 1, 2016
