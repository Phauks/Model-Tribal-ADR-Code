dispute_resolution:
  provisions:
  - kind: other
    title: Section XIV. Dispute Resolution
    citation: Bishop Paiute Tribe Gaming Revenue Allocation Plan (approved Dec. 12, 2004; amended Apr.
      26, 2006), XIV
    link: https://bishoppaiute.net/wp-content/uploads/2022/01/GamingRevenueAllocationPlan.pdf
    source: bishop-paiute-bishop-paiute-tribe-gaming-revenue-allocation
    confidence: medium
    verification: read-in-full
    as_of: '2006-04-26'
    note: Read in full on 2026-11-22 (review queue item 2). Read from a scanned copy by OCR.
    summary: Sends disputes raised by a member or group of members about the allocation of net gaming
      revenue and per capita payments to the Tribal Council, sitting with at least four members present,
      and makes its decisions binding on the parties.
    locator: XIV
  - kind: other
    title: Section 9. DISPUTE RESOLUTION
    citation: Bishop Paiute Tribal Workers' Compensation Ordinance for the Paiute Palace Casino, 9 (subsections
      A to M)
    link: https://bishoppaiute.net/wp-content/uploads/2022/01/WorkmansCompOrdPPC-compressed.pdf
    source: bishop-paiute-bishop-paiute-tribal-workers-compensation
    confidence: medium
    verification: read-in-full
    as_of: '2016-02-18'
    note: Read in full on 2026-11-22 (review queue item 2). Whether this is a dispute resolution provision
      is left for the lead author's review. Read from a scanned copy by OCR.
    summary: Lets an employee or dependent who disagrees with the administrator's final written determination
      on a work-injury claim ask for an administrative review within thirty days and then a hearing before
      a three-member Appeals Board, whose decisions are final, with already approved benefits continuing
      during the appeal.
    locator: 9 (subsections A to M)
  - kind: arbitration
    title: 'Section 13: Binding dispute resolution mechanism'
    citation: Tribal Labor Relations Ordinance (adopted by Bishop Tribal Council Ordinance T99-01), 13(a)-(d)
    link: https://bishoppaiute.net/wp-content/uploads/2022/01/Tribal-Labor-Relations.pdf
    source: bishop-paiute-tribal-labor-relations-ordinance-adopted-by
    confidence: medium
    verification: read-in-full
    as_of: '1999-10-11'
    locator: 13(a)-(d)
    note: Read in full on 2026-11-22 (review queue item 2).
    summary: 'Sets a three-level binding process for disputes under the labor ordinance: an appeal to
      a designated tribal forum within time limits, a binding decision by a Tribal Labor Panel arbitrator
      or three-member panel, and a Tribal Court motion to compel arbitration or confirm the award that
      may be appealed to federal court, with a limited waiver of immunity in state superior court if federal
      court declines jurisdiction.'
  - kind: mediation
    title: Rule 38 - Mediation and Arbitration
    citation: Bishop Paiute Tribal Court Rules, Rule 38 (printed as 38.1-38.6)
    link: https://bishoppaiute.net/wp-content/uploads/2025/02/Tribal-Rules-of-Court-1.pdf
    source: bishop-paiute-bishop-paiute-tribal-court-rules
    confidence: medium
    verification: read-in-full
    as_of: '2010-02-16'
    locator: Rule 38 (printed as 38.1-38.6)
    note: Read in full on 2026-11-22 (review queue item 2). Read from a scanned copy by OCR.
    summary: Sets up an optional program in which the Tribal Court clerk helps parties apply for and select
      a mediator or arbitrator, lets the Court order litigants into mediation with costs split equally,
      keeps mediation confidential, has the arbitrator file a notice of completion, and lets the Tribal
      Court enforce an arbitration award by suit or review it on a petition.
