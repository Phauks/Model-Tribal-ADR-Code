  value: mandatory-state
  detail: 'California is a mandatory state: 18 U.S.C. § 1162(a) (criminal) and 28 U.S.C. § 1360(a) (civil)
    extend state jurisdiction to all Indian country within California. Applies to the nation''s Indian
    country within California; the statute itself does not identify which lands are Indian country.'
