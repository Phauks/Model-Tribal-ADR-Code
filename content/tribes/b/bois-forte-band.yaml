  locator: 14 Stat. 766
  note: 'The instrument reads: “for the perpetual use and occupancy of said Bois Forte band of Chippewas, a tract of land of not less than one hundred thousand acres”. The treaty directed selection of a tract including Nett Lake; The treaty only authorized selection of the tract; the later instruments that fixed the Nett Lake and Deer Creek lands were not located here. Recorded as the first authorization.'
