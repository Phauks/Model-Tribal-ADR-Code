    exercised by Minnesota over the Bois Forte Indian Reservation at Nett Lake. Other component reservations
    of the Minnesota Chippewa Tribe are not covered. (40 FR 4026)'
  source: federal-register-1975-bois-forte-retrocession
  confidence: medium
  verification: inferred
  as_of: '1975-01-27'
- topic: public-law-280
  value: mandatory-state
  detail: 'Minnesota is a mandatory state: 18 U.S.C. § 1162(a) (criminal) and 28 U.S.C. § 1360(a) (civil) extend state jurisdiction to all Indian country within Minnesota. Applies to the nation''s Indian country within Minnesota; the statute itself does not identify which lands are Indian country.'
