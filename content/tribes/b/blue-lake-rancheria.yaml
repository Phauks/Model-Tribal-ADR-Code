dispute_resolution:
  provisions:
  - kind: other
    title: 'BLUE LAKE HOUSING AUTHORITY DISPUTE RESOLUTION ORDINANCE (NILL heading: ''BLHA Dispute Resolution
      Ordinance'')'
    citation: Blue Lake Housing Authority Dispute Resolution Ordinance (Ordinance No. 04-02), Sections
      1-9 (Section 6 Dispute Resolution, with subsection B Arbitration)
    link: https://www.bluelakerancheria-nsn.gov/wp-content/uploads/2024/09/04-02.pdf
    source: blue-lake-blue-lake-housing-authority-dispute-resolution
    confidence: medium
    verification: read-in-full
    as_of: '2004-04-02'
    locator: Sections 1-9 (Section 6 Dispute Resolution, with subsection B Arbitration)
    note: Read in full on 2026-11-22 (review queue item 2). Read from a scanned copy by OCR.
    summary: Lets the Blue Lake Housing Authority consent to suit or arbitration only by resolution of
      its governing body, limits any immunity waiver to enforcing money awards, arbitral determinations
      (including specific performance or injunctions) and actions to compel arbitration after written
      notice of the claim within 360 days, makes agreements to arbitrate enforceable with tribal court
      confirmation of awards and no further appeal, and keeps the Tribe's own immunity intact.
