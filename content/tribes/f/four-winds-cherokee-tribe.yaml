- type: unrecognized
  source: gao-12-348-federal-funding-non-federally-recognized-tribes
  confidence: medium
  verification: bulk-import
  as_of: 2012-04
  locator: Highlights; section on likely ineligible awards
  note: GAO names "Four Winds Cherokee" as part of a consortium with the Choctaw-Apache Tribe of Ebarb
    that received Department of Education American Indian Vocational Rehabilitation Services funding,
    and found the consortium appeared ineligible because it lacks a statutory reservation. Not on the
    2026 federal list. Id shared with the state-recognized helper entity "Four-Winds Cherokee Tribe" (Louisiana)
    by name comparison.
- type: unrecognized
  source: census-aian-geography-definitions
  confidence: medium
  verification: bulk-import
  as_of: '2020'
  locator: Definition of State Designated Tribal Statistical Area; area 9720
  note: The 2020 Census delineated "Four Winds Cherokee SDTSA" (State Designated Tribal Statistical Area).
    The Census Bureau defines SDTSAs as statistical areas for state-recognized tribes that are not federally
    recognized and have no reservation or off-reservation trust land, delineated with a governor-appointed
    state liaison. Not on the 2026 federal list. Linking of area to group is by name comparison (see census-area
    fact).
