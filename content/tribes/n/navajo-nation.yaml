dispute_resolution:
  forums:
  - kind: peacemaking
    name: Navajo Nation Peacemaking Program
    own_term:
      name: Hózhóójí Naat’áanii
      language_tag: nv
      translation: Peacemaking Program (the statutory program name; the Judicial Branch uses hózhóójí naat’áanii for the Peacemaker)
    description: A program within the Judicial Branch serving as the central point of peacemaking information and coordination; it promotes a non-adversarial forum where parties voluntarily agree or are referred to peacemaking, peacemaking counseling for court clients, sentencing recommendations on request, and education on Navajo culture and traditions.
    legal_basis: 7 N.N.C. §§ 409-413 (Chapter 3, Subchapter 10, Navajo Nation Peacemaking Program)
    case_types:
    - family
    - child-welfare
    - juvenile
    - criminal-sentencing
    - probate
    - civil
    - other
    participation: voluntary-or-court-referred
    relationship_to_court: Located in the Judicial Branch under the legislative oversight of the Judiciary Committee and a Plan of Operation; per the Plan of Operations, where a court order is sought the matter must first be filed in court and then referred to peacemaking by the court.
    enforcement: Not specified in the subchapter reviewed.
    link: https://peacemaking.narf.org/wp-content/uploads/2025/07/Navajo-Title-7-Courts-and-Procedure.pdf
    source: navajo-title-7-courts-and-procedures
    confidence: medium
    verification: read-in-full
    as_of: '2003-10-24'
    locator: 7 N.N.C. §§ 409-413; Title 7 annotation citing In the Matter of the Estate of Kindle (Nav. Sup. Ct. 2001)
    note: Read in full on 2026-11-23 from page images (Navajo Nation Code Title 7 Chapter 3 Subchapter 10, Navajo Nation Peacemaking Program; history CO-72-03, October 24, 2003; CO-76-01, October 17, 2001). own_term spelling taken from NARF's Tribal Peacemaking Laws page ('Hózhóójí Naat’áanii'); the Navajo Nation Code PDF text layer shows 'Hózh==jí Naat'áanii' and the Judicial Branch plan page shows 'hózh̨ǫ́ójí naat’áanii' (font conversion artifacts in both). A Code annotation states local peacemaking programs exist in the seven judicial districts and are also used for probate. Child-welfare and juvenile case types are from the Plan of Operations (family preservation and reunification; Álchíní Bi Beehaz’áannii Act matters). The Plan of Operations page's description of Diné traditional peacemaking is kept with that page under published materials (folded 2026-11-22, review queue item 5). Gate 1 item 3 review, research/reviews/2026-11-23-text-read-tier.json, record 309.
