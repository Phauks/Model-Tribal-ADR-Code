dispute_resolution:
  forums:
  - kind: peacemaking
    name: Navajo Nation Peacemaking Program
    own_term:
      name: Hózhóójí Naat’áanii
      language_tag: nv
      translation: Peacemaking Program (the statutory program name; the Judicial Branch uses hózhóójí
        naat’áanii for the Peacemaker)
    description: A program within the Judicial Branch serving as the central point of peacemaking information
      and coordination; it promotes a non-adversarial forum where parties voluntarily agree or are referred
      to peacemaking, peacemaking counseling for court clients, sentencing recommendations on request,
      and education on Navajo culture and traditions.
    legal_basis: 7 N.N.C. §§ 409-413 (Chapter 3, Subchapter 10, Navajo Nation Peacemaking Program)
    case_types:
    - family
    - child-welfare
    - juvenile
    - criminal-sentencing
    - probate
    - civil
    - other
    participation: voluntary-or-court-referred
    relationship_to_court: Located in the Judicial Branch under the legislative oversight of the Judiciary
      Committee and a Plan of Operation; per the Plan of Operations, where a court order is sought the
      matter must first be filed in court and then referred to peacemaking by the court.
    enforcement: Not specified in the subchapter reviewed.
    link: https://peacemaking.narf.org/wp-content/uploads/2025/07/Navajo-Title-7-Courts-and-Procedure.pdf
    source: navajo-title-7-courts-and-procedures
    confidence: medium
    verification: read-in-full
    as_of: '2003-10-24'
    locator: 7 N.N.C. §§ 409-413; Title 7 annotation citing In the Matter of the Estate of Kindle (Nav.
      Sup. Ct. 2001)
    note: own_term spelling taken from NARF's Tribal Peacemaking Laws page ('Hózhóójí Naat’áanii'); the
      Navajo Nation Code PDF text layer shows 'Hózh==jí Naat'áanii' and the Judicial Branch plan page
      shows 'hózh̨ǫ́ójí naat’áanii' (font conversion artifacts in both). A Code annotation states local
      peacemaking programs exist in the seven judicial districts and are also used for probate. Child-welfare
      and juvenile case types are from the Plan of Operations (family preservation and reunification;
      Álchíní Bi Beehaz’áannii Act matters). The Plan of Operations page's description of Diné traditional
      peacemaking is kept with that page under published materials (folded 2026-11-22, review queue item
      5).
  provisions:
  - kind: peacemaking
    title: Subchapter 10. Navajo Nation Peacemaking Program
    citation: 7 N.N.C. §§ 409-413
    summary: Recognizes the Peacemaking Program within the Judicial Branch, sets its purposes and authority
      to conform procedures to traditional concepts including K'é and clanship, and places it under Judiciary
      Committee oversight and a Plan of Operation.
    link: https://peacemaking.narf.org/wp-content/uploads/2025/07/Navajo-Title-7-Courts-and-Procedure.pdf
    source: navajo-title-7-courts-and-procedures
    confidence: medium
    verification: read-in-full
    as_of: '2003-10-24'
  published_materials:
  - kind: rules
    title: Peacemaking Program Plan of Operations
    link: https://courts.navajo-nsn.gov/Peacemaking/Plan/peace.html
    source: navajo-peacemaking-plan-of-operations
    confidence: high
    verification: read-in-full
    as_of: '2026-11-21'
    locator: Plan of Operations, Part I
    note: 'Describes Diné traditional peacemaking (hózh̨óji naat’aah, as displayed) as one of the Program''s
      traditional services; names four kinds of participants (the peacemaker, the decision-making parties
      called naałchidí, contributing family members and others called atah naaldeehí, and silent observers);
      a dispute in which a court order is sought is filed in court first and referred by the court; finality
      rests on the participants'' agreement. A set peacemaker fee (yeel) is paid to community-based peacemakers,
      and the Program may pay it for indigent participants in family preservation, reunification and children''s
      code matters. The page also describes ceremonial elements the Nation has chosen to publish; they
      are not summarized here. Terms copied as displayed in a legacy Navajo font conversion. Undated page;
      as_of is the access date. Folded on 2026-11-22 from a separate forum record (review queue item 5):
      ''Diné Traditional Peacemaking''.'
