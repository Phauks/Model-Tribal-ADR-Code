  locator: Table 1; Table 3
  note: 'GAO Table 1 lists "Nanticoke Lenni-Lenape Indians of New Jersey" among 26 non-federally recognized
    tribes that received direct federal funding in FY2007-2010 (total $208,000, Table 3). GAO-reported
    nonprofit status: Yes; state recognition per state officials: Disputed (GAO: New Jersey''s official
    position is that it has no state-recognized tribes). GAO reports two HHS Community Services Block
    Grant awards totaling $44,405 (FY2007 and FY2010) and recommended HHS review eligibility. Not on the
    2026 federal list (bia-recognized-entities-2026). Possible match with the state-recognized helper
    entity nanticoke-lenni-lenape-tribal-nation; not verified, so a separate id is used.'
