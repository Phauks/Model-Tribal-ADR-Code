    1936), as of 1947
  source: haas-1947-table-b-alaska
  confidence: medium
  as_of: '1947'
  locator: Table B, Alaska Native Communities and Cooperatives, column Official Name of Organization
  note: 'Historical status in 1947; the nation may since have adopted a different constitution. The act
    is assigned from the table (main table: Indian Reorganization Act; Oklahoma table: Oklahoma Indian
    Welfare Act; Alaska table: Alaska amendment).'
- kind: alaska-indian-reorganization-act
  detail: Constitution (Native Village of Venetie, Alaska) (approved 1940) states it was adopted under
    Act of June 18, 1934 (48 Stat. 984)
  source: university-of-oklahoma-indian-reorganization-act-vencons
  confidence: medium
  as_of: '1940'
  locator: preamble / approval and certification of adoption
  note: The text cites the Act of June 18, 1934; the Indian Reorganization Act reached Alaska through
    the Act of May 1, 1936, so this is recorded as the Alaska amendment. Historical constitution; a later
    constitution may have replaced it.
