    locator: Chapter 50.20, sections 50.20.01-50.20.06
    note: Read in full on 2026-11-23 (Nisqually Tribal Code Title 50 Youth, Chapter 50.20 Peacemaker Conference; 50.20.04(f) added by Tribal Council Resolution 71-2023, June 8, 2023). Read in full from Title 50 Youth, Chapter 50.20 (NARF-hosted copy). 50.20.04(f) added by Resolution 71-2023 (June 8, 2023). Applies only within youth proceedings. Gate 1 item 3 review, research/reviews/2026-11-23-text-read-tier.json, record 330.
    summary: In youth and child-welfare cases, after a preliminary hearing, any party may ask the Court Clerk for a Peacemaker Conference, or the Court may provisionally transfer a case on its own motion. The informal conference is held within 20 days; a written agreement signed by the child, parents or guardian, child advocate and the Tribe runs for a fixed term not past the child's 18th birthday, is monitored by Nisqually Children and Family Services, and if there is no agreement or it is breached a Fact Finding Hearing follows. The Court may enter the agreement as an order, which is enforced like any other order of the Court.
  - kind: peacemaking
