dispute_resolution:
  forums:
  - kind: family-group-conference
    name: Peacemaker Conference (Youth Code)
    description: An informal conference in youth proceedings, conducted according to a process established
      by the Court, aimed at a written agreed disposition such as a Family Preservation Plan.
    legal_basis: Nisqually Tribal Code, Title 50 – Youth, Sections 50.20.01 to 50.20.06
    case_types:
    - child-welfare
    - juvenile
    - family
    participation: voluntary-or-court-referred
    relationship_to_court: After a preliminary hearing any party may request a conference or the Court
      may provisionally transfer a case on its own motion; if no agreement is reached, a fact-finding
      hearing follows. Parties may also reach agreement outside a conference and present it to the Court.
    enforcement: Written agreement for a fixed period signed by the child, parents or guardian, child
      advocate and the Tribe; Nisqually Children and Family Services monitors compliance; parties may
      present a draft order to formalize the agreement as a court order.
