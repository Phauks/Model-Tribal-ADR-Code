      lists it as "50.16 PEACEMAKER CONFERENCE"; the printed heading, number or version differs (see research/reviews/2026-11-22-title-only-provisions.json).
    summary: Lets any party to a youth (child welfare) proceeding, or the court on its own motion, ask
      for a peacemaker conference after a preliminary hearing, to be held within twenty days on notice
      to the family, with an informal process, a written agreement signed by the child, parents or guardian,
      child advocate and the Tribe's representative that lasts no longer than the child's eighteenth birthday,
      and a draft order the court may enter and enforce like any other order.
