recognition:
- type: congressional-special-relationship
  legal_basis: 20 U.S.C. § 7512 (Native Hawaiian Education Act findings), Pub. L. 89-10, title VI, § 6202,
    as amended
  source: us-code-20-7512-native-hawaiian-education-findings
  confidence: high
  as_of: '2015-12-10'
  locator: paragraphs (1), (8), (10)-(13)
  note: Congress finds Native Hawaiians are 'a distinct and unique indigenous people'; that through the
    Hawaiian Homes Commission Act Congress 'affirmed the special relationship'; that it does not extend
    services 'because of their race, but because of their unique status as the indigenous people of a
    once sovereign nation as to whom the United States has established a trust relationship' (para. 12(B));
    and lists statutes evidencing 'the political relationship' (para. 13). The findings call Native Hawaiians
    a people; they do not designate a tribe.
- type: congressional-special-relationship
  legal_basis: Pub. L. 103-150, 107 Stat. 1510 (Apology Resolution), §§ 1-3
  since: '1993-11-23'
  source: apology-resolution-1993
  confidence: high
  as_of: '1993-11-23'
  locator: 107 Stat. 1513-1514
  note: 'Section 1 acknowledges ''the suppression of the inherent sovereignty of the Native Hawaiian people'',
    apologizes for the 1893 overthrow and the deprivation of ''the rights of Native Hawaiians to self-determination'',
    and commits to ''reconciliation between the United States and the Native Hawaiian people''. Section
    2 defines ''Native Hawaiian'' as any descendant of the aboriginal people who, prior to 1778, occupied
    and exercised sovereignty in the area that now constitutes the State of Hawaii. Section 3: ''Nothing
    in this Joint Resolution is intended to serve as a settlement of any claims against the United States.'''
- type: congressional-special-relationship
  legal_basis: Hawaiian Homes Commission Act, 1920, Act of July 9, 1921, ch. 42, 42 Stat. 108
  since: '1921-07-09'
  source: hawaiian-homes-commission-act-1920
  confidence: high
  as_of: '1921-07-09'
  locator: § 201(a)(7) (definition); § 202 (commission)
  note: Defines 'native Hawaiian' as 'any descendant of not less than one-half part of the blood of the
    races inhabiting the Hawaiian Islands previous to 1778' and sets aside lands for homesteading. 20
    U.S.C. § 7512(7)-(8) describes this Act as Congress affirming the special relationship. The source
    is the 1921 enactment; later amendments not reviewed.
- type: congressional-special-relationship
  legal_basis: Hawaii Admission Act, Pub. L. 86-3, 73 Stat. 4, §§ 4 and 5(f)
  since: '1959-03-18'
  source: hawaii-admission-act-1959
  confidence: high
  as_of: '1959-03-18'
  locator: § 4 (73 Stat. 5); § 5(f) (73 Stat. 6)
  note: Section 4 adopts the Hawaiian Homes Commission Act as a compact with the United States, amendable
    in key respects only with federal consent. Section 5(f) requires ceded lands and their proceeds to
    be held by the State 'as a public trust' for purposes including 'the betterment of the conditions
    of native Hawaiians, as defined in the Hawaiian Homes Commission Act', with misuse a breach of trust
    'for which suit may be brought by the United States'. 20 U.S.C. § 7512(10)-(11) describes these provisions
    as reaffirming the trust relationship.
- type: state
  state: HI
  legal_basis: Haw. Rev. Stat. § 10H-1 (Act 195, Session Laws of Hawaii 2011)
  since: '2011-07-06'
  source: hawaii-revised-statutes-10h-1
  confidence: high
  as_of: '2011'
  locator: § 10H-1
  note: 'Text: ''The Native Hawaiian people are hereby recognized as the only indigenous, aboriginal,
    maoli people of Hawaii.'' [L 2011, c 195, pt of §2]. The since date is the Act''s date as bracketed
    in § 10H-3(b). § 10H-8(b) adds that members of the qualified Native Hawaiian roll and their descendants
    ''shall be acknowledged by the State of Hawaii as the indigenous, aboriginal, maoli population of
    Hawaii'' (hawaii-revised-statutes-10h-8).'
- type: state
  state: HI
  legal_basis: Haw. Rev. Stat. § 10H-8 (Act 195, Session Laws of Hawaii 2011)
  since: '2011-07-06'
  source: hawaii-revised-statutes-10h-8
  confidence: high
  as_of: '2011'
  locator: § 10H-8(a)-(b)
  note: Reaffirms the 1959 Admission Act delegation to the State 'to address the conditions of the indigenous,
    native people of Hawaii' and acknowledges members of the qualified Native Hawaiian roll and descendants
    as 'the indigenous, aboriginal, maoli population of Hawaii'.
- type: state
  state: HI
  legal_basis: Haw. Const. art. XII, §§ 4-7 (Hawaiian Affairs), as added by Const. Con. 1978
  since: '1978-11-07'
  source: hawaii-constitution
  confidence: high
  as_of: '1978-11-07'
  locator: art. XII §§ 4, 5, 6, 7
  note: '§ 4 holds ceded lands ''as a public trust for native Hawaiians and the general public''; § 5
    establishes the Office of Hawaiian Affairs to hold property ''in trust for native Hawaiians and Hawaiians'';
    § 6 sets the trustees'' powers; § 7: ''The State reaffirms and shall protect all rights, customarily
    and traditionally exercised for subsistence, cultural and religious purposes and possessed by ahupua''a
    tenants who are descendants of native Hawaiians who inhabited the Hawaiian Islands prior to 1778,
    subject to the right of the State to regulate such rights.'' Art. XII §§ 1-3 adopt the Hawaiian Homes
    Commission Act. The § 5 provision limiting trustee elections to Hawaiian voters was the subject of
    Rice v. Cayetano (2000); not reviewed here.'
