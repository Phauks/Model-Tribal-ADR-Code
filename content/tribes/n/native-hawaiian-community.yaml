government_structure:
- kind: other
  detail: No Native Hawaiian government has a formal government-to-government relationship with the United
    States. The Department of the Interior's Solicitor wrote that the Department 'has not yet received
    a request' under 43 C.F.R. Part 50 and that a Native Hawaiian government 'has been lacking since the
    overthrow of the monarchy'.
  source: interior-solicitor-opinion-m-37083
  confidence: high
  as_of: '2025-01-16'
  locator: pages 21-22
  note: Opinion M-37083 is listed as 'Under Suspension Review' in the Interior M-Opinions index dated
    May 2026 (interior-m-opinions-index-2026-05), so its legal conclusions may change. The factual statement
    about requests is as of 2025-01-16.
- kind: other
  detail: The Justice Department's Office of Legal Counsel stated that in the decade since the 2016 rule
    'no Native Hawaiian community has availed itself of this opportunity', and that Native Hawaiian statutes
    do not confer 'formal federal recognition on any Native Hawaiian political entity, which is why no
    such entity appears' on the Interior recognition list.
  source: justice-olc-race-based-education-programs-2025
  confidence: high
  as_of: '2025-12-02'
  locator: slip op. 11-12 and n.7
  note: The same opinion concludes that a Native Hawaiian-serving education grant program is a racial
    classification subject to strict scrutiny, and leaves unresolved 'whether Congress may treat the native
    Hawaiians as it does the Indian tribes' (citing Rice v. Cayetano, 528 U.S. 495 (2000)). This differs
    from the 2016 rule, in which the Department of the Interior took the position that Congress, through
    more than 150 statutes, recognized that the Native Hawaiian community 'exists as an Indian tribe within
    the meaning of the Constitution' while also stating Native Hawaiians 'would not be added to the list'
    of federally recognized tribes (81 FR 71284 and n.4). Contested; record without a tribal status category.
governing_documents:
- kind: other
  title: Procedures for Reestablishing a Formal Government-to-Government Relationship With the Native
    Hawaiian Community (Department of the Interior final rule; 43 C.F.R. Part 50)
  year: '2016'
  link: https://www.govinfo.gov/content/pkg/FR-2016-10-14/pdf/2016-23720.pdf
  source: interior-native-hawaiian-final-rule-2016
  confidence: high
  as_of: '2016-10-14'
  locator: 81 FR 71278 (summary); 43 C.F.R. §§ 50.1-50.44 at 81 FR 71318-71323
  note: A federal regulation, not a document of the community. The rule 'does not attempt to reorganize
    a Native Hawaiian government or draft its constitution'; it sets the procedure the Secretary would
    use 'if the Native Hawaiian community forms a unified government' that seeks a relationship (summary).
    The Secretary will reestablish the relationship 'with only one sovereign Native Hawaiian government'
    (§ 50.3). A reestablished governing entity would not be eligible for Federal Indian programs unless
    Congress says so (§ 50.44(d)). Effective 2016-11-14. Recorded under governing-document because the
    contract has no field for a federal procedural rule.
- kind: other
  title: 43 CFR Part 50 - Procedures for Reestablishing a Formal Government-to-Government Relationship
    With the Native Hawaiian Community (current codified text)
  link: https://www.law.cornell.edu/cfr/text/43/part-50
  source: cfr-43-part-50
  confidence: high
  as_of: '2016-10-14'
  locator: Part 50, subparts A-C
  note: Codified text of the 2016 rule; source line 81 FR 71318, Oct. 14, 2016, with no later amendments
    shown.
