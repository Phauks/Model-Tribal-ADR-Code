dispute_resolution:
  forums:
  - kind: peacemaking
    name: Peacemaker Court
    description: A voluntary forum, sitting as a panel of three Peacemakers, for traditional, non-adversarial
      Nez Perce methods of dispute and conflict resolution as an alternative to the Tribal Court, specialty
      courts and court-imposed sanctions; it does not ascribe fault and uses dialogue to reach consensus-based
      solutions.
    legal_basis: Nez Perce Tribal Code §§ 1-8-1 to 1-8-11
    case_types:
    - criminal-diversion
    - juvenile
    - civil
    - other
    participation: voluntary-or-court-referred
    relationship_to_court: 'Hears matters on order of a Tribal Court judge or specialty court official:
      adult criminal matters excluding listed serious and violent offenses, any juvenile delinquency matter,
      and civil matters other than contract disputes where all parties agree; in criminal and juvenile
      matters the prosecutor, defendant and victim must agree. Peacemakers report regularly to the referring
      court.'
    enforcement: Agreements may be confirmed as a Tribal Court or specialty court judgment or order and
      enforced like other orders; agreements from minor disputes heard at the parties' own request outside
      court are not enforceable in court.
    link: https://peacemaking.narf.org/wp-content/uploads/2025/07/Nez-Perce-2024-09-24-Title-1-VAWA-update.pdf
    source: nez-perce-title-1-chapter-1-8-peacemaker-court
    confidence: high
    verification: read-in-full
    as_of: '2024-09-24'
    locator: §§ 1-8-1, 1-8-2, 1-8-6, 1-8-8, 1-8-10, 1-8-11
    note: The code provides that peacemakers may suggest participation in Nez Perce activities and practices,
      naming as examples sweat lodge ceremonies, traditional drumming or dancing, and instruction in the
      Nimiipuu language. Peacemakers are unpaid volunteers unless a program funds a stipend. The court's
      guidelines are set out in a Peacemaker Court Handbook (§ 1-8-7).
  provisions:
  - kind: mediation
    title: Mediation and Hearings (amendment to section adopted by NPTEC 5/28-29/02)
    citation: TITLE 1 GENERAL PROVISIONS, 1-2-3
    link: https://peacemaking.narf.org/wp-content/uploads/2025/07/Nez-Perce-2024-09-24-Title-1-VAWA-update.pdf
    source: nez-perce-title-1-chapter-1-8-peacemaker-court
    confidence: medium
    verification: read-in-full
    as_of: 2002-05
    locator: 1-2-3
    note: Read in full on 2026-11-22 (review queue item 2).
    summary: Requires that small claims cases be referred on petition to court-ordered mediation before
      any hearing, and sets a small claims hearing within twenty business days if mediation does not produce
      an agreement.
  - kind: mediation
    title: CHAPTER 1-3 ALTERNATIVE DISPUTE RESOLUTION (amendments to chapter adopted by NPTEC 5/28-29/02)
    citation: TITLE 1 GENERAL PROVISIONS, 1-3-1 to 1-3-9 (record cites 1-3-2, 1-3-4, 1-3-5, 1-3-8)
    link: https://peacemaking.narf.org/wp-content/uploads/2025/07/Nez-Perce-2024-09-24-Title-1-VAWA-update.pdf
    source: nez-perce-title-1-chapter-1-8-peacemaker-court
    confidence: medium
    verification: read-in-full
    as_of: 2002-05
    note: Read in full on 2026-11-22 (review queue item 2).
    summary: Provides court-referred mediation by a certified mediator for small claims (mandatory), custody
      and visitation matters (by agreement) and other civil cases the court or parties choose, excluding
      housing, gaming, employment termination and domestic violence matters; a party may petition to end
      mediation, no appeal lies from the parties' agreement, and the court enters a judgment on the agreement
      with the force of any civil judgment.
    locator: 1-3-1 to 1-3-9 (record cites 1-3-2, 1-3-4, 1-3-5, 1-3-8)
  - kind: other
    title: Section 6.20.017 Non-Licensing Dispute Resolution Process
    citation: Nez Perce Tribal Code Title 6 (Gaming Ordinance chapter), amended through Resolution NP
      23-482 (Sept. 26, 2023), 6.20.017 (formerly 6-2-23)
    link: https://nezperce.org/wp-content/uploads/2024/07/TITLE-6-includes-Hemp-and-Gaming-Ordinance.pdf
    source: nez-perce-nez-perce-tribal-code-title-6-gaming-ordinance
    confidence: medium
    verification: read-in-full
    as_of: '2023-09-26'
    locator: 6.20.017 (formerly 6-2-23)
    note: Read in full on 2026-11-22 (review queue item 2). The National Indian Law Library table of contents
      lists it as "'6-2-23 Dispute Resolution Process"; the printed heading, number or version differs
      (see research/reviews/2026-11-22-title-only-provisions.json).
    summary: 'The Gaming Commission may adjudicate disputes from the gaming public: a person with a dispute
      against a gaming operation first asks the operation''s gaming manager to resolve it and, if dissatisfied,
      may request a hearing before the Commission, held within thirty days of the written request, with
      a decision at the hearing or within fourteen days after it.'
  - kind: other
    title: §9-5-13 Conciliation; Contesting Violations; Hearing
    citation: TITLE 9 INDIAN PREFERENCE IN EMPLOYMENT AND CONTRACTING (Chapter 9-5, Tribal Occupational
      Safety and Health Administration), 9-5-13
    link: https://nezperce.org/wp-content/uploads/2024/07/TITLE-9.pdf
    source: nez-perce-title-9-indian-preference-in-employment-and
    confidence: medium
    verification: read-in-full
    as_of: '2006-01-24'
    note: Read in full on 2026-11-22 (review queue item 2). Whether this is a dispute resolution provision
      is left for the lead author's review.
    summary: Allows the employer and the tribal safety officer to try to resolve a citation or penalty
      through a confidential settlement conference or conciliation, with any signed agreement put in writing,
      and sets out the formal noncompliance order and the employer's right to contest it if no agreement
      is reached.
    locator: 9-5-13
  - kind: arbitration
    title: §11-9-4 ATTORNEY FEES AND OTHER ARBITRATION COSTS.
    citation: TITLE 11 WORKERS COMPENSATION CODE, 11-9-4
    link: https://nezperce.org/wp-content/uploads/2024/07/TITLE-11.pdf
    source: nez-perce-title-11-workers-compensation-code
    confidence: high
    verification: read-in-full
    locator: 11-9-4
    note: Read in full on 2026-11-22 (review queue item 2).
    summary: Caps the claimant's attorney fees, paid over and above benefits, at the lesser of 10% of
      the total benefit award or $5,000 when the arbitrator awards more than the Claim Administrator's
      original determination, lets the arbitrator reimburse the claimant's expert costs in the same circumstance,
      and requires fee disputes to be filed with the arbitrator under tribal civil rules.
  - kind: peacemaking
    title: Chapter 1-8 – Peacemaker Court
    citation: Chapter 1-8 – Peacemaker Court
    link: https://peacemaking.narf.org/wp-content/uploads/2025/07/Nez-Perce-2024-09-24-Title-1-VAWA-update.pdf
    source: nez-perce-title-1-chapter-1-8-peacemaker-court
    confidence: medium
    verification: read-in-full
    as_of: '2019-06-25'
    locator: Chapter 1-8, sections 1-8-1 to 1-8-11
    note: 'Read in full on 2026-11-23 (Nez Perce Tribal Code, Title 1 General Provisions, Chapter 1-8 Peacemaker Court (Chapter adopted by NPTEC 06/25/19)). Read in full from Nez Perce Tribal Code Title 1, Chapter 1-8 (adopted by NPTEC 06/25/19), via the NARF-hosted copy of the Title 1 update dated 2024-09-24. Peacemakers must first adopt a Peacemaker Handbook (1-8-7). Date: 2019-06-25 (chapter adoption date as printed). Gate 1 item 3 review, research/reviews/2026-11-23-text-read-tier.json, record 323.'
    summary: Establishes the Nez Perce Peacemaker Court as a division of the Tribal Court, a voluntary, non-adversarial forum using traditional Nez Perce methods that does not assign fault. A Tribal Court or specialty court judge may send it adult non-serious criminal matters, juvenile delinquency matters, and civil matters other than contract disputes, with the parties' agreement, and the case can be sent back if unresolved. It cannot compel anyone to attend. An agreement can be submitted as a Peacemaking Resolution and entered by the Tribal Court as a judgment enforced like any other; minor disputes outside the courts can also be heard on written request of all parties, but those agreements are not enforceable in Tribal Court.
