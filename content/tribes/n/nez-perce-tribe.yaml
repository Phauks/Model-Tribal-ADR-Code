dispute_resolution:
  forums:
  - kind: peacemaking
    name: Peacemaker Court
    description: A voluntary forum, sitting as a panel of three Peacemakers, for traditional, non-adversarial
      Nez Perce methods of dispute and conflict resolution as an alternative to the Tribal Court, specialty
      courts and court-imposed sanctions; it does not ascribe fault and uses dialogue to reach consensus-based
      solutions.
    legal_basis: Nez Perce Tribal Code §§ 1-8-1 to 1-8-11
    case_types:
    - criminal-diversion
    - juvenile
    - civil
    - other
    participation: voluntary-or-court-referred
    relationship_to_court: 'Hears matters on order of a Tribal Court judge or specialty court official:
      adult criminal matters excluding listed serious and violent offenses, any juvenile delinquency matter,
      and civil matters other than contract disputes where all parties agree; in criminal and juvenile
      matters the prosecutor, defendant and victim must agree. Peacemakers report regularly to the referring
      court.'
    enforcement: Agreements may be confirmed as a Tribal Court or specialty court judgment or order and
      enforced like other orders; agreements from minor disputes heard at the parties' own request outside
      court are not enforceable in court.
    link: https://peacemaking.narf.org/wp-content/uploads/2025/07/Nez-Perce-2024-09-24-Title-1-VAWA-update.pdf
    source: nez-perce-title-1-chapter-1-8-peacemaker-court
    confidence: high
    verification: read-in-full
    as_of: '2024-09-24'
    locator: §§ 1-8-1, 1-8-2, 1-8-6, 1-8-8, 1-8-10, 1-8-11
    note: The code provides that peacemakers may suggest participation in Nez Perce activities and practices,
      naming as examples sweat lodge ceremonies, traditional drumming or dancing, and instruction in the
      Nimiipuu language. Peacemakers are unpaid volunteers unless a program funds a stipend. The court's
      guidelines are set out in a Peacemaker Court Handbook (§ 1-8-7).
