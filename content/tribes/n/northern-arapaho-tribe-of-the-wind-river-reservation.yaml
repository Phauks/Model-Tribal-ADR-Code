dispute_resolution:
  forums:
  - kind: peacemaking
    name: Peacemaker Court of the Northern Arapaho Nation
    description: A department of the Tribal Court intended to give formal support, structure and enforcement
      to traditional Northern Arapaho methods of resolving disputes through mediation and traditional
      ways without judges or lawyers. If parties agree in writing or orally, a peacemaker may hear all
      sides of a dispute and issue a decision.
    legal_basis: Northern Arapaho Code, Title 7. Peacemaker Code, Sections 101-702
    case_types:
    - family
    - juvenile
    - civil
    - commercial
    - criminal-diversion
    - criminal-sentencing
    - other
    participation: voluntary-or-court-referred
    relationship_to_court: Established as a department of the Tribal Court; a judge may appoint a peacemaker
      with the parties' concurrence, and civil or criminal cases may be transferred on stipulation or
      for good cause, with a stay of court proceedings that the court may lift on breach of a condition.
    enforcement: Resolved disputes may be approved as judgments or orders of the Tribal Court and are
      enforceable; if all parties agree, a peacemaker may hear all sides and issue a decision that takes
      effect as a court judgment when entered, appealable under civil appeal rules.
    link: https://peacemaking.narf.org/wp-content/uploads/2025/07/N.-Arapaho-Title-7-Peacemaker-Type.pdf
    source: northern-arapaho-title-7-peacemaker-code
    confidence: medium
    verification: inferred
    as_of: '2016-08-31'
    locator: Title 7, Sections 101-107, 202, 601-605; Section 202(f), 203(a)
    note: Listed matters (Sec. 104) include marital and family strife, parent-child disputes, minor neighbor
      disputes, alcohol use by family or neighbors, and minor community business transactions of $1,500
      or less. Attorneys barred from proceedings (Sec. 106). Criminal transfers limited to cases without
      injury, with victim consent, or victimless offenses, or as a probation condition (Sec. 603-604).
      $10 fee for a judgment or protective order (Sec. 309). Folded on 2026-11-22 from a separate forum
      record for the same text (review queue item 5). Agreed decisions rest on Northern Arapaho Code,
      Title 7, Section 202(f). The decision is submitted to the Tribal Court for entry as a written judgment,
      and it takes the effect of a court judgment once entered; appealable under the Tribal Court's civil
      appeal rules.
  provisions:
  - kind: peacemaking
    title: Title 7. Peacemaker Code
    citation: Northern Arapaho Code, Title 7
    summary: Establishes the Peacemaker Court, peacemaker powers and limits, request and transfer procedures,
      protective orders, and entry and enforcement of peacemaking judgments.
    link: https://peacemaking.narf.org/wp-content/uploads/2025/07/N.-Arapaho-Title-7-Peacemaker-Type.pdf
    source: northern-arapaho-title-7-peacemaker-code
    confidence: medium
    verification: read-in-full
    as_of: '2016-08-31'
  - kind: arbitration
    title: THE WIND RIVER ARBITRATION ACT
    citation: The Wind River Arbitration Act (Wind River Tribal Court), 1-22 (record cites 103, 104, 105,
      106, 109, 110, 112)
    link: https://www.wrtribalcourt.com/wp-content/uploads/2024/01/Arbitration-Act.pdf
    source: northern-arapaho-the-wind-river-arbitration-act-wind-river-tribal
    confidence: medium
    verification: read-in-full
    note: Read in full on 2026-11-22 (review queue item 2). The National Indian Law Library table of contents
