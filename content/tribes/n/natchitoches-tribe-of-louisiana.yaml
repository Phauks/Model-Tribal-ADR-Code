recognition:
- type: unrecognized
  source: census-aian-geography-definitions
  confidence: medium
  verification: bulk-import
  as_of: '2020'
  locator: Definition of State Designated Tribal Statistical Area; area 9836
  note: The 2020 Census delineated "Natchitoches SDTSA" (State Designated Tribal Statistical Area). The
    Census Bureau defines SDTSAs as statistical areas for state-recognized tribes that are not federally
    recognized and have no reservation or off-reservation trust land, delineated with a governor-appointed
    state liaison. Not on the 2026 federal list. Linking of area to group is by name comparison (see census-area
    fact).
- type: state
  state: LA
  legal_basis: Listed as a state recognized tribe by the Louisiana Governor's Office of Indian Affairs
  source: louisiana-governor-federally-and-state-recognized-tribes
  confidence: high
  verification: bulk-import
  as_of: '2026'
  note: Louisiana recognized tribes by legislative concurrent resolutions; the individual resolutions
    were not retrieved.
- type: state
  state: LA
  legal_basis: Louisiana Revised Statutes 46:2305(B) (Acts 2018, No. 102), Native American Commission
    membership, listed as 'Natchitoches Tribe of Louisiana'
  source: louisiana-revised-statutes-46-2305
  confidence: high
  verification: inferred
  as_of: '2018'
  locator: R.S. 46:2305(B)
  note: The statute gives the tribe a seat on the Native American Commission; it does not itself confer
    recognition.
- type: state
  state: LA
  legal_basis: Louisiana House Resolution No. 227 (2017 Regular Session)
  since: '2017-06-09'
  source: louisiana-house-resolution-227-2017
  confidence: medium
  verification: read-in-full
  as_of: '2017-06-09'
  note: '''the House of Representatives of the Legislature of Louisiana does hereby recognize the Natchitoches
    Tribe of Louisiana as an Indian tribe of the state''. Single-chamber resolution; the concurrent resolution
    did not pass the Senate.'
