  - state: CA
    status: deemed-approved
    dispute_resolution_summary: The parties exchange written notice and a written response within 15 days
      and meet and confer within 30 days; if unresolved, either party may propose arbitration before a
      JAMS arbitrator under the JAMS Comprehensive Arbitration Rules (though neither must agree to arbitrate),
      and disputes not otherwise resolved may be taken to the United States District Court where the Tribe's
      Gaming Facility is located or, if the federal court lacks jurisdiction, a state court, under a limited
      waiver of sovereign immunity that bars monetary damages except payment of money the Compact requires.
