land_establishment:
- land_area: Jicarilla Apache Reserve (Colorado line to the Navajo reservation), New Mexico
  method: executive-order
  instrument: Exec. Order of Mar. 25, 1874, 1 Kappler 874
  date: '1874-03-25'
  detail: First set aside
  source: executive-order-1874-03-25-jicarilla-apache-reservation
  confidence: high
  verification: read-in-full
  locator: 1 Kappler 874
  note: 'The instrument reads: “set apart as a reservation for the Jicarilla Apache Indians by the first article of an agreement concluded with the said Indians December 10, 1873, subject to the action of Congress”. Revoked July 18, 1876; the reservation was re-established by Exec. Orders of Sept. 21, 1880 (revoked May 15, 1884) and Feb. 11, 1887 (1 Kappler 875), the order of Feb. 11, 1887 being the one that created the present core of the reservation.'
