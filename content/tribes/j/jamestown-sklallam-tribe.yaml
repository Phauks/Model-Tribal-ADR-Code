dispute_resolution:
  forums:
  - kind: family-group-conference
    name: Peacemaker Conference (Youth Code)
    description: An informal conference in youth proceedings, which the code describes as an element of
      the Peacemaking Initiative, aimed at a written agreed disposition such as a Family Preservation
      Plan.
    legal_basis: Jamestown S’Klallam Tribal Code, Title 33 – Youth Code, Section 33.01.16 and definition
      O
    case_types:
    - child-welfare
    - juvenile
    - family
    participation: voluntary-or-court-referred
    relationship_to_court: After a preliminary hearing any party may request a conference, or the Court
      may provisionally transfer a case on its own motion; if no agreement is reached, a fact-finding
      hearing is scheduled.
    enforcement: A written agreement for a fixed period is signed by the child, parents or guardian, child
      advocate and the Tribe; the Indian Child Welfare Department monitors it and may recommend a fact-finding
      hearing for noncompliance.
    link: https://peacemaking.narf.org/wp-content/uploads/2025/07/Jamestown-SKlallam-Title-33-Youth-Code-1-6-20-2.pdf
    source: jamestown-sklallam-title-33-youth-code
    confidence: medium
    verification: inferred
    as_of: '2020'
    locator: Sections 33.01.02(O), 33.01.16(A)-(E)
    note: Kind recorded as family-or-talking-circle because it is a family-group conference within child
      welfare proceedings. Substantive information from the conference is inadmissible unless independently
      substantiated, except agreed Family Preservation Plan terms. The code's definition cites NARF's
      peacemaking site.
