  forums:
  - kind: elders-council
    name: Traditional Court
    description: A court of Ho-Chunk elders for traditional dispute resolution within the Judiciary; per
      the Judiciary's page it provides knowledge of custom, traditions and Ho-Chunk core values to members
      referred by court processes, through social services programming, or by self-referral.
    legal_basis: 1 HCC § 1 (Judiciary Establishment and Organization Act), Sections 3(c) and 13
    case_types:
    - other
    participation: voluntary-or-court-referred
    relationship_to_court: Part of the Ho-Chunk Judiciary, established to assist the Judiciary whenever
      possible with cases or controversies involving Tribal members; a Traditional Court representative
      also sits on the Healing to Wellness Court and Family Wellness Court treatment teams.
    link: https://ho-chunknation.com/government/judicial-branch/courts/traditional-court-2/
    source: ho-chunk-1-hcc-1-judiciary-act
