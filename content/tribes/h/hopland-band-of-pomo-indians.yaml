dispute_resolution:
  forums:
  - kind: peacemaking
    name: Peacemaker conference (Peace Making Roster)
    description: An optional, consent-based way of resolving disputes in which a peacemaker from a roster
      of tribal members mediates before or instead of trial; peacemakers conduct informal conferences
      and encourage an agreement acceptable to all parties.
    legal_basis: Hopland Tribal Code, Title 12, Chapter 12-1, Sections 12-1.20.020 and 12-1.100.010 to
      12-1.100.070
    case_types:
    - civil
    - other
    participation: voluntary
    relationship_to_court: Parties file a request with the Court Clerk and the judge refers the case to
      a rostered peacemaker if no party objects; no lawsuit need be pending, and parties may continue
      in Tribal Court if peacemaking fails.
    enforcement: A written settlement signed by the parties and the peacemaker is an enforceable agreement;
      if a lawsuit is pending it is filed and treated as the final judgment.
    link: https://peacemaking.narf.org/wp-content/uploads/2025/07/Hopland-Title-12-Tribal-Court.pdf
    source: hopland-title-12-tribal-court
    confidence: medium
    verification: read-in-full
    as_of: '2025'
    locator: Sections 12-1.20.020, 12-1.100.020-070
    note: Roster kept by Tribal Council with advice of the Chief Judge and Culture Committee; peacemakers
      must be tribal members at least 50 years old. Counsel not allowed; a party may have a Big Talker
      (a non-lawyer tribal member or relative) only as needed to understand the proceedings. Discussions
      are confidential. as_of is NARF posting year.
  - kind: council-hearing
    name: Presentation of claims to Tribal Council (Tribal Claims Ordinance)
    description: Claims for money or damages against the Tribe or its business enterprises, including
      employee wage claims, must be presented to and acted on by the Tribal Council before suit.
    legal_basis: Hopland Tribal Code, Title 12, Chapter 12-4, Sections 12-4.10 to 12-4.150
    case_types:
    - employment
    - commercial
    - civil
    participation: required
    relationship_to_court: A prerequisite to filing suit.
    link: https://peacemaking.narf.org/wp-content/uploads/2025/07/Hopland-Title-12-Tribal-Court.pdf
    source: hopland-title-12-tribal-court
    confidence: medium
    verification: read-in-full
    as_of: '2025'
    locator: Sections 12-4.10, 12-4.20
  provisions:
  - kind: peacemaking
    title: Tribal Court Ordinance – Peacemakers
    citation: Hopland Tribal Code, Title 12, Chapter 12-1, Section 12-1.100
    summary: Creates a Peacemaker roster and sets qualifications, duties, request procedure, representation
      rules and enforceability of settlements.
    link: https://peacemaking.narf.org/wp-content/uploads/2025/07/Hopland-Title-12-Tribal-Court.pdf
    source: hopland-title-12-tribal-court
    confidence: medium
    verification: read-in-full
    as_of: '2025'
  - kind: arbitration
    title: Validity and Enforceability of Arbitration Agreements
    citation: Hopland Tribal Code, Title 12, Chapter 12-3 (Ordinance No. 02-17-07)
    summary: Gives the Tribal Court authority to determine validity of arbitration agreements, compel
      or enjoin arbitration, appoint arbitrators, and confirm, correct or vacate awards.
    link: https://peacemaking.narf.org/wp-content/uploads/2025/07/Hopland-Title-12-Tribal-Court.pdf
    source: hopland-title-12-tribal-court
    confidence: medium
    verification: read-in-full
    as_of: '2025'
    locator: Sections 12-3.10 to 12-3.160
  - kind: peacemaking
    title: Title 12, Chapter 12-1, Sections 12-1.20.020 and 12-1.100 - Peace Making Roster (Tribal Court Ordinance)
    citation: Hopland Band of Pomo Indians Tribal Code, Title 12, Chapter 12-1 Tribal Court Ordinance, Sections 12-1.20.020 and 12-1.100
    link: https://peacemaking.narf.org/wp-content/uploads/2025/07/Hopland-Title-12-Tribal-Court.pdf
    source: hopland-title-12-tribal-court
    confidence: medium
    verification: read-in-full
    as_of: '2025-09-29'
    locator: Chapter 12-1, Sections 12-1.10(c), 12-1.20.020 and 12-1.100.010-12-1.100.070 (Peace Making Roster)
    note: Read in full on 2026-11-23 (Hopland Band of Pomo Indians Tribal Code Title 12 Tribal Court, Chapter 12-1 Tribal Court Ordinance (no enactment date printed; history Ord. No. 10-12-14 per first reader)). Provisions read in the Title 12 Tribal Court Ordinance text. NARF's phrase 'authority to lead community-related peace activities' is looser than the code, which limits peacemakers to mediating disputes by consent. No enactment date is printed on the chapter. Gate 1 item 3 review, research/reviews/2026-11-23-text-read-tier.json, record 165.
    summary: The Tribal Council, advised by the Chief Judge and Culture Committee, keeps a roster of Peacemakers (tribal members at least 50 years old, known and respected, with no conviction in the past five years) to mediate disputes in an optional, non-adversarial process that needs every party's consent and can be used before any lawsuit is filed. A party files a request with the Court Clerk; if no one objects the Judge refers it to a Peacemaker within ten days, and any party may object to the Peacemaker or decline once the rules are explained. Lawyers may not represent parties. A settlement is written and signed by the parties and the Peacemaker and is an enforceable agreement, treated as the final judgment if a lawsuit is pending; discussions are confidential, and parties may still go to Tribal Court if peacemaking fails.
