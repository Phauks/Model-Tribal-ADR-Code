    title: Mediation
    citation: Zuni Children's Code, Title IX of the Zuni Tribal Code (enacted April 5, 2006), 9-6-8 and
      9-7-6
    link: http://www.ashiwi.org/Documents/ZuniChildrensCode.pdf
    source: zuni-zuni-zuni-children-s-code-title-ix-of-the-zuni-tribal
    confidence: medium
    verification: read-in-full
    as_of: '2006-04-05'
    locator: 9-6-8 and 9-7-6
    note: Read in full on 2026-11-22 (review queue item 2).
    summary: In juvenile-offender cases (9-6-8) and minor-in-need-of-care cases (9-7-6), mediation is
      allowed when it serves the minor's best interest and the minor and family consent (and, for offenders,
      the victim), run by the probation officer or caseworker or a court-authorized neutral within ten
      days of the preliminary inquiry, producing a signed agreement of up to six months that the prosecutor
      may accept, reject or amend and that is reported to the court, with dismissal of the petition on
      compliance and a return to adjudication if no agreement is reached or it is not met.
