    dispute_resolution_summary: After written notice, representatives designated by the Governor of Wisconsin
      and the Tribe meet within ten days; if one negotiation session does not resolve it either party
      may demand non-binding mediation (at least two sessions), and if mediation fails either party may
      demand binding arbitration before a single arbitrator at a neutral location, with actions to compel
      or confirm an award brought in the United States District Court.
