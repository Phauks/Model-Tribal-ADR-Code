    locator: 17.12 (Section 12)
    note: Read in full on 2026-11-22 (review queue item 2).
    summary: Has the gaming manager or designee resolve a player's grievance arising from play at a Class
      III facility, lets a dissatisfied player appeal in writing to the Red Cliff Gaming Commission within
      five days (of the occurrence, or of a delayed decision), and requires the Commission to decide within
      ten calendar days with its decision final and non-appealable.
