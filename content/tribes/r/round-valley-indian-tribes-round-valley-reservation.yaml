land_establishment:
- land_area: Round Valley (Nome Cult) Reserve, California
  method: other
  instrument: Order of the Secretary of the Interior (Nov. 18, 1858), as recited in Commissioner's letter of Jan. 6, 1860, 1 Kappler 824-825
  date: '1858-11-18'
  detail: First set aside
  source: letter-1860-01-06-round-valley-reserve
  confidence: low
  verification: inferred
  locator: 1 Kappler 825
  note: 'The instrument reads: “the entire valley of Nome Cult, designated by you as the Round Valley, was set apart and reserved for Indian purposes”. The Nov. 18, 1858 Commissioner''s letter to Superintendent Henley (1 Kappler 824-825) conveys the Secretary''s direction that "the entire Nome Cult Valley shall be retained as a reservation." The 1860 letter cited is the source read for the quotation. Later made one of the Act of Apr. 8, 1864 (13 Stat. 39) reservations; boundaries fixed by Exec. Orders (1870 onward). Not an executive order or statute in the first instance; confidence low.'
