    provider: Indigenous Peacemaking Initiative (Native American Rights Fund)
    link: https://peacemaking.narf.org/2022/10/peacemaking-training-for-the-choctaw-nation/
    source: narf-ipi-news-choctaw-training-2022
    confidence: medium
    verification: read-in-full
    as_of: 2022-10
    note: Read in full on 2026-11-23 (NARF IPI news post, Peacemaking Training for the Choctaw Nation (URL path 2022/10)). Gate 1 item 3 review, research/reviews/2026-11-23-text-read-tier.json, record 560.
  provisions:
  - kind: other
    title: Section 1-4-504. Alternative Dispute Resolution
    citation: Choctaw Nation Children and Juvenile Code (Title 45), 1-4-504
    link: https://www.choctawnation.com/wp-content/uploads/2023/10/cno-childrens-code-updated-10-4-2023.pdf
    source: choctaw-oklahoma-choctaw-nation-children-and-juvenile-code-title-45
    confidence: medium
    verification: read-in-full
    as_of: '2018-08-15'
    locator: 1-4-504
    note: Read in full on 2026-11-22 (review queue item 2).
    summary: Allows the court, at any stage of a child proceeding, or the parties voluntarily, to use
      family group conferencing, mediation or a settlement conference, lets a party object to a court-ordered
      process, and provides that an agreement reached through it does not bind the court.
  - kind: mediation
    title: Section 107.2. Appointment of guardian ad litem--Referral to mediation or counseling--Definitions--False
      accusations of child abuse or neglect
    citation: Choctaw Nation Marriage Act and related family law provisions (Title containing Sections
      107.1 and following), 107.2
    link: https://www.choctawnation.com/wp-content/uploads/2022/04/marriage-divorce-code.pdf
    source: choctaw-oklahoma-choctaw-nation-marriage-act-and-related-family
    confidence: high
    verification: read-in-full
    locator: '107.2'
    note: Read in full on 2026-11-22 (review queue item 2). Whether this is a dispute resolution provision
      is left for the lead author's review.
    summary: Lets the court appoint a guardian ad litem in a contested custody or visitation case, lets
      it refer property, separate maintenance or custody issues to mediation (halted where domestic violence
      or child abuse is alleged unless stated findings are made) or order counseling, and sets consequences
      for a knowingly false accusation of child abuse or neglect.
  - kind: peacemaking
    title: Choctaw Nation Peacemaking Act
    citation: Choctaw Nation Peacemaking Act
    link: https://peacemaking.narf.org/wp-content/uploads/2025/07/Choctaw-Nation-Peacemaking-Act.pdf
    source: choctaw-nation-peacemaking-act
    confidence: medium
    verification: read-in-full
    as_of: '2025-09-29'
    locator: Sections 1-18 (purpose s.2; qualifications s.3; jurisdiction and limits ss.4-5; customs s.7; request and referral ss.8-10; procedure s.11; enforcement s.13; inadmissibility s.14)
    note: Read in full on 2026-11-23 (Choctaw Nation Peacemaking Act (7-page copy); no enactment date printed). Read from the Choctaw Nation Peacemaking Act (7-page copy, no enactment date printed), the nation's own text. Section 8 is headed 'Use of tribal traditions and customary law' but its text is the written-request procedure; customs and traditions are addressed in section 7. Statements made in peacemaking are treated as settlement negotiations and inadmissible in court (s.14). Gate 1 item 3 review, research/reviews/2026-11-23-text-read-tier.json, record 558.
    summary: Authorizes the Choctaw Nation District Court to use peacemakers, a court division operating under Choctaw customs and traditions, for cases referred when all parties consent, on a party's request or the court's own motion. The peacemaker cannot force a settlement or adjudicate; a signed agreement is endorsed by the District Court as a final order enforceable like its other orders, and an unresolved case goes back to the court.
