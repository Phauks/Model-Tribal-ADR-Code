    confidence: medium
    verification: read-in-full
    as_of: 2017-09
    note: Read in full on 2026-11-23 (NARF IPI news post, Training - Choctaw Nation of Oklahoma September 2017 (URL path 2017/08)). Confirmed from the full NARF news post, which is an advance announcement of the training; it covers the Nation's own Peacemaking Act and uses materials made for the Nation. Gate 1 item 3 review, research/reviews/2026-11-23-text-read-tier.json, record 559.
