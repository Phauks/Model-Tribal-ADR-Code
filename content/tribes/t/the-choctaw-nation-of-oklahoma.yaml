dispute_resolution:
  forums:
  - kind: peacemaking
    name: Peacemakers of the District Court (Choctaw Nation Peacemaking Act)
    description: Peacemakers form a division of the District Court operating under the customs and traditions
      of the Choctaw people, providing a forum for traditional Choctaw methods of peacemaking to resolve
      disputes fairly, informally and inexpensively.
    legal_basis: Choctaw Nation Peacemaking Act, Sections 1-11 and following
    case_types:
    - civil
    - other
    participation: voluntary-or-court-referred
    relationship_to_court: The District Court assigns and supervises peacemakers; matters come by written
      request, a party's motion for referral, a joint motion, or the court's own motion with all parties'
      consent, and unresolved matters return to the District Court.
    enforcement: A signed agreement and proposed dismissal order are endorsed by the District Court and
      filed as a final, non-appealable order.
    link: https://peacemaking.narf.org/wp-content/uploads/2025/07/Choctaw-Nation-Peacemaking-Act.pdf
    source: choctaw-nation-peacemaking-act
    confidence: high
    verification: read-in-full
    as_of: 2022-04
    locator: Sections 2, 4, 6-11
    note: Peacemakers must be familiar with Choctaw history, customs and traditions and may consult tribal
      elders (Sec. 3, 7). Attorneys may participate only at the peacemaker's discretion (Sec. 11(C)).
      as_of is the NARF posting year; enactment date not shown. Confidence high because the same file
      is published on the nation's own website (upload date used as as_of).
  training_programs:
  - name: Advanced peacemaker training for community members, tribal officials and staff (September 19-20, 2017, Durant)
    provider: Indigenous Peacemaking Initiative (Native American Rights Fund), with the Choctaw Nation of Oklahoma
    link: https://peacemaking.narf.org/2017/08/training-choctaw-nation-of-oklahoma-september-2017/
