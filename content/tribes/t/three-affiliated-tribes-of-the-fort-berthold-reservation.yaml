land_establishment:
- land_area: Fort Berthold Reserve (Arickaree, Gros Ventre and Mandan Reservation), Dakota Territory
  method: executive-order
  instrument: Exec. Order of Apr. 12, 1870, 1 Kappler 883
  date: '1870-04-12'
  detail: First set aside
  source: executive-order-1870-04-12-fort-berthold-reservation
  confidence: high
  verification: read-in-full
  locator: 1 Kappler 883
  note: 'The instrument reads: “Let the lands indicated in the accompanying diagram be set apart as a reservation for the Arickaree, Gros Ventre, and Mandan Indians”. Kappler''s 1880 order (1 Kappler 883) calls it "the Arickaree, Gros Ventre, and Mandan Reservations set aside by Executive order dated April 12, 1870, and known as the Fort Berthold Reservation." The order is undated in Kappler''s OCR ("April 1870") but refers to the Interior letter of the 12th. The Fort Laramie treaty of Sept. 17, 1851 had described a larger territory for these tribes but Kappler lists it as unratified/amended.'
