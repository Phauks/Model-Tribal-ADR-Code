- topic: public-law-280
  value: optional-state-consent-not-given
  detail: North Dakota's ch. 27-19 extends state civil jurisdiction over a reservation only on acceptance by its Indian citizens, and the Legislative Council staff reported in 2004 that no tribe had voted to consent after 1968. (N.D. Legis. Council Memo. 59215, at 3 (2004).)
  source: north-dakota-legislative-council-indian-jurisdictional-issues-2004
  confidence: medium
  verification: read-in-full
  locator: N.D. Legis. Council Memo. 59215, Conclusion (p. 3)
  note: 'Secondary source (legislative staff memo, 2004); the research has no later source. "This amendment" is the 1968 consent amendment. The 1946 Devils Lake act (separate fact) is a separate criminal grant. Also cites: three-affiliated-tribes-v-wold-engineering-1984.'
- topic: public-law-280
  value: optional-state-consent-not-given
  detail: The Supreme Court recorded that the Three Affiliated Tribes had not consented to state-court jurisdiction over Fort Berthold under ch. 27-19, so North Dakota had not assumed civil jurisdiction there. (Three Affiliated Tribes v. Wold Eng'g, 467 U.S. 138, 145 (1984).)
  source: three-affiliated-tribes-v-wold-engineering-1984
  confidence: high
  verification: read-in-full
  locator: 467 U.S. at 145 (see also 476 U.S. at 881)
  note: 'Wold II (476 U.S. 877, 881) repeats the point; Wold II held ch. 27-19 pre-empted insofar as it disclaims pre-existing state jurisdiction over a tribe''s suit against a non-Indian with no other forum, absent waiver of immunity. Wold the research dissent (Rehnquist, J., 467 U.S. at 162) says "North Dakota has not assumed any additional jurisdiction over Indian country under Pub. L. 280." Also cites: three-affiliated-tribes-v-wold-engineering-1986.'
