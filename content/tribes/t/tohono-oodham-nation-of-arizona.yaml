- land_area: Papago Indian Reserve (San Xavier del Bac), Arizona
  method: executive-order
  instrument: Exec. Order of July 1, 1874, 1 Kappler 806
  date: '1874-07-01'
  detail: First set aside
  source: executive-order-1874-07-01-papago-san-xavier-reservation
  confidence: high
  verification: read-in-full
  locator: 1 Kappler 806
  note: 'The instrument reads: “to be known as the Papago Indian Reserve.”. First reservation set apart for the Papago (Tohono O''odham); the same order says "set apart for the use of the Papago and such other Indians as it may be desirable to place thereon, the following tract of country around San Xavier del Bac" (1 Kappler 805). The much larger main Tohono O''odham reservation was set aside later (see separate entry).'
