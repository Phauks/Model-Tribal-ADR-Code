dispute_resolution:
  provisions:
  - kind: arbitration
    title: Subchapter 8 Dispute Resolution; § 4-801. Arbitration
    citation: Osage Nation Code, Second Edition, Volume II, Title 19 Labor and Employment, Chapter 4 Workers'
      Compensation, 19 ONC 4-801 (Subchapter 8)
    link: https://www.dropbox.com/s/175za50tstrzlm4/ONC%20Second%20Edition%20V2.pdf?dl=1
    source: osage-osage-nation-code-second-edition-volume-ii-title
    confidence: medium
    verification: read-in-full
    as_of: '2012-10-01'
    note: Read in full on 2026-11-22 (review queue item 2).
    summary: A worker who disputes the Administrator's final workers' compensation decision may, within
      twenty days and by written request to the employer's human resources office, have it reviewed in
      arbitration before a single arbitrator chosen by agreement from the Trial Court's list (or drawn
      by the Clerk if the parties cannot agree), with a filing fee refunded to a prevailing worker, costs
      borne by the employer, and a final and binding award enforceable in the Osage Nation Trial Court.
    locator: 19 ONC 4-801 (Subchapter 8)
