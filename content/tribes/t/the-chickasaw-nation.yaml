dispute_resolution:
  forums:
  - kind: peacemaking
    name: Chickasaw Nation Peacemaking Court
    description: A division of the District Court operating under the customary and traditional law of
      the Nation, providing a forum for traditional Chickasaw methods of peacemaking to resolve disputes
      in a fair, informal and inexpensive manner.
    legal_basis: Chickasaw Nation Code, Title 5, Chapter 14 (Peacemaking Court Act of 2003), Sections
      5-1401.1 to 5-1401.17; Constitution Amendment V
    case_types:
    - civil
    - other
    participation: voluntary-or-court-referred
    relationship_to_court: Hears matters referred by the District Court with the agreement of the parties,
      on a written request, a joint motion, or the court's own motion with all parties' consent; unresolved
      matters return to the District Court, and matters under special domestic violence criminal jurisdiction
      are excluded.
    enforcement: A signed written agreement and proposed dismissal order are reviewed and endorsed by
      the District Court as a final, non-appealable order, enforceable like other District Court orders.
    own_term:
      name: Nanna alphi’sa ishtaa-asha ikbi
      language_tag: cic
      translation: Printed in parentheses under the chapter heading Chickasaw Nation Peacemaking Court;
        no separate gloss is given.
    link: https://peacemaking.narf.org/wp-content/uploads/2025/07/The-Chickasaw-Nation-Title-5-5.16.2025.pdf
    source: chickasaw-title-5-courts-and-procedures
    confidence: high
    verification: read-in-full
    as_of: '2025-05-16'
    locator: Title 5, Chapter 14, Sections 5-1401.2, 5-1401.4, 5-1401.9, 5-1401.10, 5-1401.12
    note: Peacemakers are selected by the Supreme Court and kept on a roster; rules of civil and criminal
      procedure and evidence do not apply; counsel may not participate; statements are inadmissible; a
      60-day limit before referral back. Peacemakers may use tribal cultural teachings and consult elders
      (Sec. 5-1401.5).
  - kind: settlement-conference
    name: Settlement conference (civil procedure)
    description: In civil actions the court may order a settlement conference on its own motion or a party's
      request, presided over by a judge, court advocate or peacemaker; a judge may also assign a case
      on the pretrial docket to the Peacemaking Court.
    legal_basis: Chickasaw Nation Code, Title 5, Section 5-202.22 (Pretrial Proceedings), subsections
      A and L
    case_types:
    - civil
    participation: court-referred
    relationship_to_court: Part of the District Court's pretrial procedure.
    link: https://peacemaking.narf.org/wp-content/uploads/2025/07/The-Chickasaw-Nation-Title-5-5.16.2025.pdf
    source: chickasaw-title-5-courts-and-procedures
    confidence: high
    verification: read-in-full
    as_of: '2025-05-16'
    locator: Section 5-202.22(A), (L)
  provisions:
  - kind: peacemaking
    title: Peacemaking Court Act of 2003
    citation: Chickasaw Nation Code, Title 5, Chapter 14, Sections 5-1401.1 to 5-1401.17
    summary: Creates the Peacemaking Court within the District Court and sets peacemaker qualifications,
      referral procedures, form of agreements, enforcement and confidentiality.
    link: https://peacemaking.narf.org/wp-content/uploads/2025/07/The-Chickasaw-Nation-Title-5-5.16.2025.pdf
    source: chickasaw-title-5-courts-and-procedures
    confidence: high
    verification: read-in-full
    as_of: '2025-05-16'
  - kind: other
    title: Arbitration or Mediation Authorized
    citation: Title 3, Chapter 3 Gaming Licenses and Regulations (Article F, Disputes with Management),
      3-3605
    link: https://code.chickasaw.net/Title-03
    source: chickasaw-title-3-chapter-3-gaming-licenses-and-regulations
    confidence: medium
    verification: read-in-full
    as_of: '1994-01-24'
    locator: 3-3605
    note: Read in full on 2026-11-22 (review queue item 2).
    summary: Lets the Gaming Commissioner, at any time before deciding a grievance filed by a gaming participant
      or supplier against gaming management, suspend the proceedings and direct that the grievance go
      to arbitration or mediation on terms the Commissioner sets.
  - kind: mediation
    title: Best Interest of Child Considered in Awarding Custody or Appointing Guardian - Joint Custody
      - Plan - Mediation
    citation: Title 6, Chapter 1 Marriage, Article A Dissolution of Marriage, 6-101.37
    link: https://code.chickasaw.net/Title-06
    source: chickasaw-title-6-chapter-1-marriage-article-a-dissolution
    confidence: high
    verification: read-in-full
    as_of: '2023-07-21'
    locator: 6-101.37
    note: Read in full on 2026-11-22 (review queue item 2). Whether this is a dispute resolution provision
      is left for the lead author's review.
    summary: Requires custody and guardianship decisions to turn on the child's best interests with due
      regard for tribal custom, allows joint custody under a plan the parties file, and lets the court
      appoint a mediator to resolve a dispute over how a plan provision is read, with the court allowed
      to end the joint custody decree if a party refuses mediation.
