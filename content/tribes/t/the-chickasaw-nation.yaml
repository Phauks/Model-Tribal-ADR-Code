  detail: Listed by NCAI as implementing special Tribal criminal jurisdiction (list updated May 2022).
  source: national-congress-of-american-indians-implementing-tribes-special-tribal-criminal-jurisdiction
  confidence: medium
  verification: bulk-import
  as_of: 2022-05
  locator: Implementing Tribes list
  note: Listed as "Chickasaw Nation".
- topic: public-law-280
  value: not-a-public-law-280-state
  detail: Oklahoma is not one of the states that Public Law 280 required to take jurisdiction or that chose to take it, so the state has no Public Law 280 jurisdiction over the nation's Indian country in Oklahoma. Other federal laws can still give a state some jurisdiction.
  source: bia-faq-public-law-280
  confidence: medium
  verification: inferred
  as_of: '2017-07-18'
  locator: Answer, second and third paragraphs (the lists of mandatory and optional states)
  note: Inferred from the state's absence from both lists. Nation placed in Oklahoma by its office state in the BIA Tribal Leaders Directory, so confidence is medium.
- topic: violence-against-women-act-special-tribal-criminal-jurisdiction
  value: exercising
  detail: One of the 14 Tribes that received the Justice Department's first Special Tribal Criminal Jurisdiction reimbursement awards (May 2024), which repay the costs of exercising the jurisdiction.
  source: office-on-violence-against-women-2024-update-tribal-consultation-recommendations
  confidence: high
  verification: read-in-full
  as_of: 2024-11
  locator: p. 14 and Appendix D, (PDF p.51)
  note: Listed as "CHICKASAW NATION" with an "OVW TJ TRP FY 2024" award. Awards were based on 2023 expenses.
- topic: water-rights-settlement
  value: enacted
  detail: Congress enacted the Choctaw Nation of Oklahoma and the Chickasaw Nation Water Settlement in 2016 (Pub. L. No. 114-322), settling the water rights of Choctaw Nation of Oklahoma and Chickasaw Nation. (Congressional Research Service, R44148, Table 1).
  source: public-law-114-322
  confidence: high
  verification: inferred
  as_of: '2016'
  locator: Congressional Research Service, R44148, Table 1, 2016
