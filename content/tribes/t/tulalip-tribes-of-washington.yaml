land_establishment:
- land_area: Tulalip (Snohomish) tract on Port Gardner/Tulalip Bay, Washington
  method: treaty
  instrument: Treaty of Point Elliott, Jan. 22, 1855, art. II, 12 Stat. 927, 928
  date: '1855-01-22'
  detail: First set aside
  source: treaty-with-the-dwamish-suquamish-etc-1855
  confidence: medium
  verification: read-in-full
  locator: 12 Stat. 928
  note: 'The instrument reads: “on the north side Hwhomish Bay and the creek emptying into the same called Kwilt-seh-da”. The Dec. 23, 1873 Exec. Order (1 Kappler 925) refers to "the Snohomish or Tulalip Indian Reservation ... provided for in the third article of the treaty ... Point Elliott" [sic]. Place-name identification (Kwilt-seh-da = Tulalip Bay) is from the treaty text as reproduced; confidence medium.'
