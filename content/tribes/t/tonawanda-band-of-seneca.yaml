- topic: public-law-280
  value: not-a-public-law-280-state
  detail: New York is not one of the states that Public Law 280 required to take jurisdiction or that chose to take it, so the state has no Public Law 280 jurisdiction over the nation's Indian country in New York. Other federal laws can still give a state some jurisdiction.
  source: bia-faq-public-law-280
  confidence: high
  verification: inferred
  as_of: '2017-07-18'
  locator: Answer, second and third paragraphs (the lists of mandatory and optional states)
  note: Inferred from the state's absence from both lists. Nation placed in New York by the Census Bureau's land areas.
- topic: state-jurisdiction-statute
  value: state-criminal-jurisdiction
  detail: New York has jurisdiction over offenses committed by or against Indians on Indian reservations in the State, to the same extent as elsewhere in the State; treaty hunting and fishing rights are preserved. (25 U.S.C. § 232.)
  source: us-code-title-25-section-232
  confidence: high
  verification: read-in-full
  locator: 25 U.S.C. § 232; Act of July 2, 1948, ch. 809, 62 Stat. 1224
  note: 'Applies to "Indian reservations within the State of New York." Whether particular parcels (for example Oneida, Cayuga or Shinnecock lands) are "reservations" is a separate question the research did not research. Also cites: statutes-at-large-62-1224.'
- topic: state-jurisdiction-statute
  value: state-civil-jurisdiction
  detail: 'New York courts have jurisdiction over civil actions between Indians or between Indians and others, as in other civil actions, with limits: no state taxation of reservation lands, no state licence for treaty hunting and fishing, and no alienation of tribal land. (25 U.S.C. § 233.)'
  source: us-code-title-25-section-233
  confidence: high
  verification: read-in-full
  locator: 25 U.S.C. § 233; Act of Sept. 13, 1950, ch. 947, 64 Stat. 845
  note: Section 233 also excludes civil actions involving Indian lands or claims about events before Sept. 13, 1952; tribes could preserve their own laws and customs by enactment before Sept. 13, 1952.
