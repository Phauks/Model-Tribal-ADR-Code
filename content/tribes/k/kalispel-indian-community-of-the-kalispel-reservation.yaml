dispute_resolution:
  forums:
  - kind: other
    name: Traditional Peacemakers Panel
    description: A panel named in the civil actions chapter that may allow alternative service, decides tolling questions, and in execution of judgments orders the judgment debtor to appear, determines available property and orders seizure.
    legal_basis: Kalispel Law and Order Code, Chapter 3 – Civil Actions, Sections 3-1, 3-5.01, 3-21 (Execution of Judgments)
    case_types:
    - civil
    participation: required
    relationship_to_court: Functions within the Tribal Court's civil process as described in Chapter 3.
    enforcement: Orders seizure and public sale of a judgment debtor's property; failure to appear may be deemed contempt.
    link: https://peacemaking.narf.org/wp-content/uploads/2025/07/Kalispel-Chapter-3-Civil-Actions-4.9.2025.pdf
    source: kalispel-law-and-order-code-chapter-3-civil-actions
    confidence: medium
    verification: read-in-full
    as_of: '2025-04-09'
    locator: Sections 3-1.04, 3-5.01, 3-21.01-3-21.03
    note: Read in full on 2026-11-23 (Law and Order Code of the Kalispel Indian Community, Chapter 3 - Civil Actions (page footers 11.21.2017; cites Resolutions 2007-51, 2008-39)). Kind 'other' because the chapter shows the panel acting in an adjudicative and enforcement role rather than as a consensual forum; the chapter reviewed does not define the panel's composition. Gate 1 item 3 review, research/reviews/2026-11-23-text-read-tier.json, record 184.
  provisions:
  - kind: arbitration
    title: CHAPTER 22 - ARBITRATION CODE
    citation: Kalispel Law and Order Code, Chapter 22 (Sections 22-1 to 22-11)
    link: https://sakteaprodwus2web.blob.core.windows.net/files/assets/assets/Kalispel-Law-and-Order-Code-4.9.2025.pdf
    source: kalispel-kalispel-kalispel-law-and-order-code
    confidence: medium
    verification: read-in-full
    as_of: '2017-11-21'
    note: Read in full on 2026-11-22 (review queue item 2).
    summary: Chapter 22 makes written agreements to arbitrate enforceable, requires the Tribal Court to
      stay covered suits and order arbitration when a party refuses (the arbitrator decides whether a
      duty to arbitrate exists), has the court confirm awards as civil judgments but decline enforcement
      for corruption, partiality, excess of powers or refusal to hear material evidence, and bars further
      appeal from enforcement orders, with court jurisdiction over actions against the Tribe depending
      on an explicit waiver of immunity in the contract.
    locator: Chapter 22 (Sections 22-1 to 22-11)
  - kind: other
    title: 23-9.03 Claimant Attorney's Fees and Other Related Arbitration Costs
    citation: Kalispel Law and Order Code, Chapter 23 (Workers Protection Code), 23-9.03
    link: https://sakteaprodwus2web.blob.core.windows.net/files/assets/assets/Kalispel-Law-and-Order-Code-4.9.2025.pdf
    source: kalispel-kalispel-kalispel-law-and-order-code
    confidence: medium
    verification: read-in-full
    as_of: '2017-11-21'
    locator: 23-9.03
    note: Read in full on 2026-11-22 (review queue item 2). Whether this is a dispute resolution provision
      is left for the lead author's review.
    summary: Caps the attorney fees a claimant may recover at the lesser of ten percent of the award or
      a fixed dollar amount when the Tribal Workers Protection Advisory Council awards more than the Administrator
      first determined, and leaves each side to bear the cost of its own physicians or experts in a contested
      case.
  - kind: arbitration
    title: 'SECTION 22-1: SCOPE OF CODE'
    citation: Kalispel Law and Order Code, 22-1.01
    link: https://sakteaprodwus2web.blob.core.windows.net/files/assets/assets/Kalispel-Law-and-Order-Code-4.9.2025.pdf
    source: kalispel-kalispel-kalispel-law-and-order-code
    confidence: medium
    verification: read-in-full
    as_of: '2017-11-21'
    locator: 22-1.01
    note: Read in full on 2026-11-22 (review queue item 2).
    summary: Applies the Arbitration Code to written contracts in which the parties agree to arbitrate
      disputes, where the Tribe or another person subject to tribal jurisdiction is part of the transaction,
      and repeals inconsistent tribal law.
  - kind: arbitration
    title: 'SECTION 22-2: AGREEMENTS TO ARBITRATE ARE ENFORCEABLE'
    citation: Kalispel Law and Order Code, Chapter 22 (Arbitration Code), 22-2.01
    link: https://sakteaprodwus2web.blob.core.windows.net/files/assets/assets/Kalispel-Law-and-Order-Code-4.9.2025.pdf
    source: kalispel-kalispel-kalispel-law-and-order-code
    confidence: medium
    verification: read-in-full
    as_of: '2017-11-21'
    locator: 22-2.01
    note: Read in full on 2026-11-22 (review queue item 2).
    summary: Provides that an agreement in a written contract, or in a separate writing, to arbitrate
      claims arising from that contract is valid, irrevocable and enforceable.
  - kind: arbitration
    title: 'SECTION 22-4: STAY OF PROCEEDINGS AND ORDER TO PROCEED WITH ARBITRATION'
    citation: Kalispel Law and Order Code, Chapter 22 (Arbitration Code), 22-4.01
    link: https://sakteaprodwus2web.blob.core.windows.net/files/assets/assets/Kalispel-Law-and-Order-Code-4.9.2025.pdf
    source: kalispel-kalispel-kalispel-law-and-order-code
    confidence: medium
    verification: read-in-full
    as_of: '2017-11-21'
    locator: 22-4.01
    note: Read in full on 2026-11-22 (review queue item 2).
    summary: Requires the Tribal Court to stay a court action covered by an arbitration agreement until
      arbitration is held, and lets a party ask the court to order the parties to proceed to arbitration
      when another party refuses, with the arbitrator deciding whether the dispute is arbitrable.
  - kind: arbitration
    title: 'SECTION 22-8: ARBITRATION AWARD NOT APPEALABLE'
    citation: Kalispel Law and Order Code, Chapter 22 (Arbitration Code), 22-8.01
    link: https://sakteaprodwus2web.blob.core.windows.net/files/assets/assets/Kalispel-Law-and-Order-Code-4.9.2025.pdf
    source: kalispel-kalispel-kalispel-law-and-order-code
    confidence: medium
    verification: read-in-full
    as_of: '2017-11-21'
    locator: 22-8.01
    note: Read in full on 2026-11-22 (review queue item 2).
    summary: Bars any further appeal from a Tribal Court order that enforces an arbitration agreement
      or an arbitration award.
