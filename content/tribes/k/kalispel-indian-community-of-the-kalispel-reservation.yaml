      is unresolved within 20 days after the first meeting either party may have it decided by arbitration
      under the Commercial Rules of Arbitration of the American Arbitration Association (unless they agree
      to another service), with the arbitration held within 14 days after an arbitrator is named and a
      final, unappealable decision; mediation or other methods are used only by mutual agreement.
    dispute_resolution_locator: XII - REMEDIES FOR BREACH OF COMPACT PROVISIONS, C. Dispute Resolution,
      paragraph 3
