dispute_resolution:
  forums:
  - kind: other
    name: Traditional Peacemakers Panel
    description: A panel named in the civil actions chapter that may allow alternative service, decides
      tolling questions, and in execution of judgments orders the judgment debtor to appear, determines
      available property and orders seizure.
    legal_basis: Kalispel Law and Order Code, Chapter 3 – Civil Actions, Sections 3-1, 3-5.01, 3-21 (Execution
      of Judgments)
    case_types:
    - civil
    participation: required
    relationship_to_court: Functions within the Tribal Court's civil process as described in Chapter 3.
    enforcement: Orders seizure and public sale of a judgment debtor's property; failure to appear may
      be deemed contempt.
    link: https://peacemaking.narf.org/wp-content/uploads/2025/07/Kalispel-Chapter-3-Civil-Actions-4.9.2025.pdf
