dispute_resolution:
  forums:
  - kind: peacemaking
    name: Peacemakers of the District Court (Kiowa Tribe Peacemaking Act)
    description: The Act authorizes the District Court of the Kiowa Tribe to use peacemakers, as a court division operating under Kiowa customs and traditions, to resolve disputes in a fair, informal and inexpensive way. Parties may request peacemaking in writing or move to refer a pending case, and the court may refer on its own motion only if all parties consent. A peacemaker cannot force a resolution; a peacemaker may decide a referred matter only if all parties agree to be bound.
    legal_basis: Kiowa Tribe Peacemaking Act, Sections 1-18
    case_types:
    - civil
    - other
    participation: voluntary-or-court-referred
    link: https://www.kiowatribe.org/sites/default/files/2023-03/Kiowa%20Tribe%20-%20KCC%20Code%20of%20Law.pdf
    source: kiowa-tribe-court-codes
    confidence: medium
    verification: read-in-full
    as_of: '2026'
    locator: Kiowa Tribe Peacemaking Act, Sections 2-16 (Kiowa Tribe Court Codes pp. 1-7)
    note: 'Read in full on 2026-11-23 from page images (Kiowa Tribe Peacemaking Act, in Kiowa Tribe Court Codes (approval date per first reader: Resolution KL-CY-2020-0007, Aug. 8, 2020; not re-checked)). Read from the Kiowa Tribe Court Codes (scanned PDF): Sections 2-16 read from page images; Sections 1 (title only), 17 and 18 not read. Section 4 lets a peacemaker decide a referred matter only if all parties agree to be bound. Gate 1 item 3 review, research/reviews/2026-11-23-text-read-tier.json, record 210.'
    relationship_to_court: Peacemaking is a division of the District Court, which assigns, supervises and certifies peacemakers. The court refers cases by order on a party's request or motion (it must grant a joint motion) or on its own motion with all parties' consent; unresolved matters go back to the court.
    enforcement: The parties' signed written agreement and proposed order are reviewed by the District Court and, if sufficient, entered as a final, non-appealable order, enforceable like any other order of the District Court (Section 13). Statements made in peacemaking are not admissible in court proceedings.
  provisions:
  - kind: peacemaking
    title: Kiowa Tribe Peacemaking Act
    citation: Kiowa Tribe Peacemaking Act, Sections 1-18
    link: https://www.kiowatribe.org/sites/default/files/2023-03/Kiowa%20Tribe%20-%20KCC%20Code%20of%20Law.pdf
    source: national-center-on-restorative-justice-restorative-justice-tribal-laws-database
    confidence: medium
    verification: read-in-full
    as_of: '2026'
    locator: https://ncorj.org/tribal-law/kiowa-tribe-peacemaking-act/
