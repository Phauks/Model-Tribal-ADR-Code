dispute_resolution:
  forums:
  - kind: peacemaking
    name: Klamath Tribes Peacemaker Court
    description: Part of the Tribal Court system providing a non-adversarial alternative using culturally
      appropriate mediation to reach conciliatory results rather than court-imposed sanctions, and giving
      formal support, structure and enforcement to traditional Tribal methods of resolving disputes.
    legal_basis: Klamath Tribal Code, Title 2, Chapter 18 (Klamath Peacemaker Ordinance), 18.01-18.15;
      Tribal Court Ordinance, Title 2, Chapter 11
    case_types:
    - civil
    - juvenile
    - other
    participation: voluntary
    relationship_to_court: Persons with a dispute, parties to any Tribal Court case, and juveniles in
      Tribal or state court Juvenile Matters are eligible; all parties must consent before transfer, and
      participation is entirely voluntary.
    enforcement: A written Resolution signed by the parties and peacemaker becomes an order and judgment
      of the Tribal Court when the parties so intend and the Chief Judge signs it.
    link: https://peacemaking.narf.org/wp-content/uploads/2025/07/Klamath-Title_2_Chapter_18_-_The_Klamath_Peacemaker_Ordinance.pdf
    source: klamath-title-2-chapter-18-peacemaker-ordinance
    confidence: medium
    verification: read-in-full
    as_of: '2008-11-15'
    locator: 18.01-18.06, 18.12
    note: Read from OCR. The court keeps a roster of at least three contracted peacemakers. Additional
      procedures for juvenile matters are in 18.12.
  provisions:
