dispute_resolution:
  forums:
  - kind: mediation
    name: Peacemaker Mediation Forum
    description: A nonadversarial forum within the Tribal Court structure for resolving disputes between
      Tribal members and others within the Tribe's jurisdiction; guidelines are to reflect the Tribe's
      historical traditions and modern methods of dispute resolution.
    legal_basis: Karuk Tribal Code, Section 3.05.100 (Res. 10-R-111 § 10.9)
    case_types:
    - civil
    - other
    participation: required
    relationship_to_court: When a petition is filed with the Clerk, the forum is used before proceeding
      to a formal court hearing; parties may continue in court if mediation fails.
    link: https://peacemaking.narf.org/wp-content/uploads/2025/07/Karuk-Chapter-3.05-KTC.pdf
    source: karuk-tribal-code-chapter-3-05
    confidence: high
    verification: inferred
    as_of: '2024-09-26'
    locator: Sections 3.05.010(E), 3.05.100
    note: Participation recorded as 'required' because the code says the forum shall be used before a
      formal hearing once a petition is filed.
