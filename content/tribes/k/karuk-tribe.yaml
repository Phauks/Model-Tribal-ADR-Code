    summary: In a children-and-youth-in-need-of-care case the Tribal Court judge may, at any stage, order the parties into the Tribe's confidential Peacemaker Mediation Forum, run under the Forum's written guidelines, or order the family into family unity with Karuk Child Welfare Services; the plan the family reaches goes back to the judge, who may approve, modify or disapprove it, send the family back for more work or set a hearing, and an approved plan becomes a Tribal Court order.
