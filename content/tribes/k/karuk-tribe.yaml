    summary: In family relations proceedings the dispute resolution process of KTC 10.10.270 (the Peacemaker Mediation Forum) must be arranged at or before the time the matter is set for hearing; its stated purpose is cooperation, less bitterness and an agreement that meets the needs and best interests of all parties, and if the parties stipulate the court applies Karuk customs and traditions under Chapter 3.05.
