dispute_resolution:
  forums:
  - kind: customary-dispute-resolution
    name: Traditional Conflict Resolution Program (TCRP)
    description: A program to which the Tribal Court may refer cases; NCORJ classifies it as peacemaking
      and circle practice, and the Tribe's codes also refer elder and vulnerable adult protection matters
      and sentencing options to it.
    legal_basis: Kenaitze Tribal Court Code, Sections 14(B), 17, 18; Domestic Relations Code, Chapter
      10
    case_types:
    - civil
    - family
    - criminal-sentencing
    - other
    participation: voluntary-or-court-referred
    relationship_to_court: At any time during a case the Court may refer it to the program if the judges
      find it appropriate; parties may request referral, and the presiding judges decide.
    link: https://www.kenaitze.org/wp-content/uploads/KenaitzeCourtCode.pdf
    source: national-center-on-restorative-justice-restorative-justice-tribal-laws-database
    confidence: medium
    as_of: '2026'
    locator: https://ncorj.org/tribal-law/referral-to-the-traditional-conflict-resolution-program-tcrp-during-a-case/
    note: Case types reflect the separate NCORJ records for Sections 14(B), 17 and 18 and Domestic Relations
      Code Chapter 10 (elder protection), which were listed but only Section 14(B) was read.
