dispute_resolution:
  forums:
  - kind: peacemaking
    name: Peacemaker System
    description: Part of the Tribal Court System but independent from Tribal Court judges, providing formal
      support, structure and enforcement to traditional Kickapoo methods of resolving disputes through
      mediation and traditional ways; Kickapoo customs and traditions are its guiding principles.
    legal_basis: Kickapoo Traditional Tribe of Texas Code, Chapter 4 – The Peacemaker System, Sections
      4.1-4.64; Chapter 1, Sec. 1.7
    case_types:
    - civil
    - criminal-diversion
    - criminal-sentencing
    - other
    participation: voluntary-or-court-referred
    relationship_to_court: Any individual may request peacemaking through the court or by contacting a
      certified peacemaker directly; civil or criminal actions may be referred where all parties agree,
      and the Tribal Court may require peacemaking as a probation condition. The system cannot compel
      attendance.
    enforcement: A Tribal Court judgment on Peacemaker System proceedings may be enforced as any other
      Tribal Court judgment; peacemakers may decide a matter only with all parties' written consent, and
      such a decision takes effect as a court judgment when entered.
    link: https://peacemaking.narf.org/wp-content/uploads/2025/07/KTTT-Ch-4-Peacemaking.pdf
    source: kickapoo-traditional-tribe-texas-chapter-4-peacemaker-system
    confidence: medium
    verification: read-in-full
    as_of: '2025'
    locator: Sections 4.1-4.3, 4.22, 4.30, 4.35, 4.60-4.64
    note: Peacemakers must be Kickapoo members over 25, certified by the Traditional Council; attorneys
      may not serve or participate. Each party pays $20 toward peacemaker compensation. Peacemakers may
      also serve entities other than the Tribal Court (Sec. 4.3(D)). as_of is NARF posting year.
  provisions:
  - kind: peacemaking
    title: Chapter 4 – The Peacemaker System
    citation: Kickapoo Traditional Tribe of Texas Code, Chapter 4; Chapter 1, Sec. 1.7
    summary: Establishes the Peacemaker System, peacemaker qualifications and certification by the Traditional
      Council, procedures, protective orders, complaints and transfers from Tribal Court.
    link: https://peacemaking.narf.org/wp-content/uploads/2025/07/KTTT-Ch-4-Peacemaking.pdf
    source: kickapoo-traditional-tribe-texas-chapter-4-peacemaker-system
    confidence: medium
    verification: read-in-full
    as_of: '2025'
  - kind: mediation
    title: Section 8.11 Child Protective Board Mediation Panel Hearings
    citation: KTTT Tribal Codes, Chapter 8 (Youth in Need of Care Action), in the Ch. 1-17 Tribal Codes
      compilation, 8.11
    link: https://kickapootexas.org/wp-content/uploads/2017/05/KTTT-Ch-1-17-Tribal-Codes.pdf
    source: kickapoo-texas-tribal-code-chapter-1
    confidence: medium
    verification: read-in-full
    as_of: '2005-11-10'
    locator: '8.11'
    note: Read in full on 2026-11-22 (review queue item 2).
    summary: A mediation panel hearing in a youth in need of care matter may be requested in writing by
      the presenting officer, the Indian Child Welfare worker or by court order, and the Peacemaker Program
      schedules an informal hearing; a signed written agreed disposition covers a fixed period and is
      filed with the Youth Court, the worker monitors compliance, and if mediation fails or a party does
      not appear the presenting officer may file a petition or proceed to fact finding.
  - kind: arbitration
    title: Chapter 26 Arbitration Ordinance
    citation: KTTT Tribal Codes, Chapter 26 Arbitration Ordinance, Sections 1-12 (record cites 3, 5 and
      9)
    link: https://kickapootexas.org/wp-content/uploads/2017/05/KTTT-Ch-26-Arbitration-Ordinance.pdf
    source: kickapoo-traditional-kttt-tribal-codes-chapter-26-arbitration-ordinance
    confidence: medium
    verification: read-in-full
    as_of: '2012-03-07'
    note: Read in full on 2026-11-22 (review queue item 2). Read from a scanned copy by OCR.
    summary: The ordinance makes written agreements to arbitrate contract disputes valid, irrevocable
      and enforceable (Sec. 3), requires the Tribal Court to stay its own proceedings and order arbitration
      when a party asks, leaving arbitrability to the arbitrator (Sec. 5), and has the court confirm awards
      as civil judgments with review limited to the federal arbitration statute's grounds, with no further
      appeal from an order enforcing an agreement or award (Secs. 8-9).
    locator: Sections 1-12 (record cites 3, 5 and 9)
  - kind: other
    title: Section 11. Patron Dispute Resolution
    citation: Kickapoo Traditional Tribe of Texas Gaming Ordinance (as adopted March 2017; with NIGC approval
      letter of March 17, 2017), Section 11
    link: https://kickapootexas.org/wp-content/uploads/2017/09/NIGC-Approval-Ltr.pdf
    source: kickapoo-traditional-kickapoo-traditional-tribe-of-texas-gaming
    confidence: medium
    verification: read-in-full
    as_of: 2017-03
    locator: Section 11
    note: Read in full on 2026-11-22 (review queue item 2). Read from a scanned copy by OCR.
    summary: Makes a written petition to the Tribal Gaming Commission, filed within thirty days of the
      incident, a patron's sole remedy against a gaming establishment; the Commission holds a hearing
      within thirty days, the patron may bring counsel and may be allowed to present evidence, and its
      decision is final, with recovery limited to proven actual damages (or the prize amount in prize
      disputes).
  - kind: peacemaking
    title: Section 1.7 Peacemaker Program
    citation: KTTT Tribal Codes, Chapter 1 (Establishing the Court), in the Ch. 1-17 Tribal Codes compilation,
      1.7
    link: https://kickapootexas.org/wp-content/uploads/2017/05/KTTT-Ch-1-17-Tribal-Codes.pdf
    source: kickapoo-texas-tribal-code-chapter-1
    confidence: medium
    verification: read-in-full
    as_of: '2005-11-10'
    locator: '1.7'
    note: Read in full on 2026-11-22 (review queue item 2).
    summary: The Tribal Court may administer a Peacemaker Program, paid from the Court's budget, and the
      Court is responsible for hiring, training and supervising the peacemakers.
