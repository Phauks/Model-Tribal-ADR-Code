  value: optional-state
  detail: 'Washington assumed partial jurisdiction (RCW 37.12.010, 1957 and 1963): it does not apply to
    Indians on trust or restricted tribal or allotted lands within a reservation except for eight subjects
    (compulsory school attendance, public assistance, domestic relations, mental illness, juvenile delinquency,
    adoption, dependent children, motor vehicles on public roads), unless the tribe requested full state
    jurisdiction under RCW 37.12.021.'
