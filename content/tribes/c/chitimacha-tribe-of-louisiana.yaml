dispute_resolution:
  forums:
  - kind: peacemaking
    name: Chitimacha Peacemaker Court
    description: Part of the Chitimacha Tribal Court System, intended to give formal support, structure
      and enforcement to traditional methods of resolving disputes through mediation, restorative justice
      and traditional ways. Peacemakers may decide a disputed matter only if all parties agree in writing
      or before the Tribal Court.
    legal_basis: Chitimacha Comprehensive Codes of Justice, Title I-A, Secs. 101-603
    case_types:
    - family
    - civil
    - commercial
    - criminal-diversion
    - other
    participation: voluntary-or-court-referred
    relationship_to_court: Supervised by the Chief Judge of the Tribal Court; a judge appoints a peacemaker
      on request, and civil or criminal cases may be transferred only with the written consent of all
      parties.
    enforcement: Agreements may be presented as a draft judgment for the Tribal Court's approval; the
      resulting judgment is enforced like any other Tribal Court judgment.
    link: https://peacemaking.narf.org/wp-content/uploads/2025/07/CCCJ-Title-IA-Chitimacha-Peacemaker-Court.pdf
    source: chitimacha-title-1a-peacemaker-court
    confidence: medium
    verification: read-in-full
    as_of: '1990-08-14'
    locator: Title I-A, Secs. 101-103, 302, 403-406, 601-603; Sec. 203
    note: Listed matters include marital and family strife, extended family disputes, minor neighbor disputes,
      alcohol use, and minor community business transactions of $3,000 or less (Sec. 103). Attorneys barred
      except as witnesses or parties. Parties pay a reasonable sum set by the court for peacemaker compensation
      (Sec. 306). The court may have amended the title since 1990; the NARF copy shows the 1989-1990 dates.
      Folded on 2026-11-22 from a separate forum record for the same text (review queue item 5). Agreed
      decisions rest on Chitimacha Comprehensive Codes of Justice, Title I-A, Sec. 203 (Limitations; Peacemakers
      Not Judges; Agreed Arbitration). The decision is entered by the Tribal Court, and it has the effect
      of a court judgment when entered.
  provisions:
  - kind: peacemaking
    title: Title I-A – Peacemaker Court
    citation: Chitimacha Comprehensive Codes of Justice, Title I-A
    summary: Establishes the Peacemaker Court, its subject matter, peacemaker qualifications and powers,
      consent-based transfer, protective orders and enforcement of peacemaking judgments.
    link: https://peacemaking.narf.org/wp-content/uploads/2025/07/CCCJ-Title-IA-Chitimacha-Peacemaker-Court.pdf
    source: chitimacha-title-1a-peacemaker-court
    confidence: medium
    verification: read-in-full
    as_of: '1990-08-14'
  - kind: other
    title: Sec. 621. Mediation and Alternative Justice Prohibited.
    citation: Chitimacha Comprehensive Codes of Justice, Title III - Criminal Offense Code, 621
    link: http://www.chitimacha.gov/sites/default/files/Title%20III%20-%20Criminal%20Offense%20Code_0.pdf
    source: chitimacha-louisiana-chitimacha-comprehensive-codes-of-justice-title
    confidence: medium
    verification: read-in-full
    as_of: '2017-01-12'
    locator: '621'
    note: Read in full on 2026-11-22 (review queue item 2). The National Indian Law Library table of contents
      lists it as "Sec. 625. Mediation and Alternative Justice Prohibited"; the printed heading, number
      or version differs (see research/reviews/2026-11-22-title-only-provisions.json).
    summary: Bars the Tribal Court from ordering parties in a case involving domestic violence into mediation
      or any other alternative justice process that would require the victim to negotiate directly with
      the offender, even if the victim may decline.
