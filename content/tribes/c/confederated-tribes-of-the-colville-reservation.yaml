dispute_resolution:
  forums:
  - kind: peacemaking
    name: Peacemaking Circle (juvenile)
    link: https://static1.squarespace.com/static/572d09c54c2f85ddda868946/t/5824abab46c3c490442cb43d/1478798271978/5-2.pdf
    description: Under the Colville juvenile code the probation officer must refer all cases involving a minor under Chapter 5-2 to the Colville Tribal Peacemaking Circle, with notice of the date, time and place to the minor, parent or guardian and counsel; the Juvenile Court must also refer a case on receiving a petition if it has not already gone to the Circle. At the Circle the peacemakers may refer the family to a community agency, order supervision terms, accept voluntary restitution, ask the Court to enforce any agreement, recommend a petition, or order any other remedy including a traditional one. Statements made in the Circle cannot be used as evidence against the minor, and the probation officer reviews progress every 30 days and may have the Circle reconvene.
    legal_basis: Colville Tribal Code, Title 5 Domestic Relations, Chapter 5-2 Juveniles, Sections 5-2-191 to 5-2-197 (Peacemaking Circle)
    case_types:
    - juvenile
    - child-welfare
    participation: required
    relationship_to_court: Referral from juvenile proceedings is mandatory (probation officer under 5-2-191/192, Juvenile Court under 5-2-197); the peacemakers may ask the Court to enforce agreements, and the Court may continue the adjudicatory hearing on the Circle's written recommendation.
