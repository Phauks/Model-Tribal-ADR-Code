land_establishment:
- land_area: Colville Reserve (first tract), Washington Territory
  method: executive-order
  instrument: Exec. Order of Apr. 9, 1872, 1 Kappler 916
  date: '1872-04-09'
  detail: First set aside
  source: executive-order-1872-04-09-colville-bands-reservation
  confidence: medium
  verification: read-in-full
  locator: 1 Kappler 916
  note: 'The instrument reads: “named in communication of the Commissioner of Indian Affairs dated the 8th instant, and for such other Indians as the Department of the Interior may see fit to locate thereon”. Printed under the heading "Colville Reserve." The Commissioner''s letter (1 Kappler 915) names the Methow, Okanagan, San Poel, Lake, Colville, Calispel, Spokane and Coeur d''Alene bands, "not parties to any treaty." This tract (Columbia River to the Pend d''Oreille/Clark River) was replaced three months later by the July 2, 1872 order.'
- land_area: Colville Reserve (as it stands, bounded by the Columbia and Okanogan Rivers), Washington Territory
  method: executive-order
  instrument: Exec. Order of July 2, 1872, 1 Kappler 916
  date: '1872-07-02'
  detail: Later change
  source: executive-order-1872-07-02-colville-reservation
  confidence: high
  verification: read-in-full
  locator: 1 Kappler 916
  note: 'The instrument reads: “be, and the same is hereby, set apart as a reservation for said Indians, and for such other Indians as the Department of the Interior may see fit to locate thereon”. The order restores the Apr. 9 tract to the public domain and, "in lieu thereof," sets apart the country bounded east and south by the Columbia River, west by the Okanogan River and north by the British possessions. Reduced later (Moses/Columbia Reserve, Act of July 1, 1892, 27 Stat. 62).'
