dispute_resolution:
  provisions:
  - kind: mediation
    title: SECTION 5.01. MEDIATION
    citation: Cemeteries Code, 5.01
    link: https://ctuir.org/media/r0teyn5m/cemeteries-code.pdf
    source: umatilla-cemeteries-code
    confidence: medium
    verification: read-in-full
    as_of: '2010-09-13'
    locator: '5.01'
    note: Read in full on 2026-11-22 (review queue item 2).
    summary: Provides for mediation of disputes with the Cemetery Coordinator about matters the Coordinator
      controls, when the Coordinator's supervisor or the Executive Director approves, conducted by the
      Cultural Resources Committee or persons it appoints; the text does not say whether a mediated agreement
      is binding or court-enforced.
  - kind: mediation
    title: Section 4.03. Mediation
    citation: Family Law Code, Section 4.03 (Mediation), as amended through Res. 24-017 (Mar. 4, 2024)
    link: https://ctuir.org/media/wr1pk2jm/family-law-code-thru-res-24-017-3-4-2024.pdf
    source: ctuir-family-law-code-2024
    confidence: medium
    verification: read-in-full
    as_of: '2024-03-04'
    note: Read in full on 2026-11-23 (Statutes of the Confederated Tribes of the Umatilla Indian Reservation, Family Law Code, as amended through Resolution No. 24-017 (March 4, 2024)). Kind assigned from words in the title. Gate 1 item 3 review, research/reviews/2026-11-23-text-read-tier.json, record 86.
    summary: In any Family Law Code proceeding the court may set contested issues for mediation before or concurrent with hearing, or order it on its own motion. Mediation aims to reduce acrimony and resolve property, parenting-contact and child-support issues; the court keeps the list of qualified mediators, may assign the costs, and the mediator reports any agreement to the court. If no agreement results within 90 days the court may decide the remaining issues. A party who objects must petition the court, which decides whether to compel mediation, and the court must waive it if participation is likely to cause severe emotional distress (a recent act of domestic violence can support that finding).
  - kind: other
    title: Section 7.06. Dispute Resolution Included in Plan
    citation: Family Law Code, Section 7.06 (Dispute Resolution Included in Plan), Chapter 7 (Child Custody and Parenting Plans), as amended through Res. 24-017 (Mar. 4, 2024)
    link: https://ctuir.org/media/wr1pk2jm/family-law-code-thru-res-24-017-3-4-2024.pdf
    source: ctuir-family-law-code-2024
    confidence: medium
    verification: read-in-full
    as_of: '2024-03-04'
    locator: Table of Contents, under 'Chapter 7. Child Custody and Parenting Plans'
    note: Read in full on 2026-11-23 (Statutes of the Confederated Tribes of the Umatilla Indian Reservation, Family Law Code, as amended through Resolution No. 24-017 (March 4, 2024)). Gate 1 item 3 review, research/reviews/2026-11-23-text-read-tier.json, record 87.
    summary: In a parenting plan the court must include a process for resolving future parental disputes that serves the child's best interests, unless the parents have otherwise resolved it by agreement or a process is inappropriate because of domestic violence or child abuse. The court weighs the parents' present wishes, their circumstances (including financial), and any limiting factor under Section 7.07; the section does not name a particular process.
  - kind: other
    title: Chapter 6. Dispute Resolution
    citation: Gaming Code, Chapter 6 (6.01 to 6.04); dispute resolution is 6.01
    link: https://ctuir.org/media/3lnfe2oe/gaming-code-thru-res-11-061-6-27-11-lh-ref-cur-nigc-app.pdf
    source: umatilla-gaming-code
    confidence: medium
    verification: read-in-full
    as_of: '2011-06-27'
    locator: Chapter 6 (6.01 to 6.04); dispute resolution is 6.01
    note: Read in full on 2026-11-22 (review queue item 2).
    summary: Lets a gaming facility customer who disputes an employee's decision about their participation
      in gaming file a written statement with the facility manager, receive a written response, and ask
      for a hearing before the Tribal Gaming Commission, whose decision is final.
  - kind: arbitration
    title: Section 9.03. Claimant Attorney's Fees and Other Related Arbitration Costs
    citation: Umatilla Workers Benefit Code, ch. 9 (Adjudication of Disputes), sec. 9.03, as amended through Res. No. 20-065 (June 15, 2020)
    link: https://ctuir.org/media/jexpngt5/workers-benefit-code-thru-res-no-20-065-6-15-2020-lh-ref-cur.pdf
    source: ctuir-workers-benefit-code-2020
    confidence: medium
    verification: read-in-full
    as_of: '2020-06-15'
    locator: Workers Benefit Code, ch. 9, sec. 9.03 (p. 19)
    note: Read in full on 2026-11-23 (Confederated Tribes of the Umatilla Indian Reservation, Workers Benefit Code, as amended through Resolution No. 20-065 (June 15, 2020)). Read in the tribe's own Workers Benefit Code (as amended through Res. No. 20-065, June 15, 2020). This is a section of the Workers Benefit Code, not a general arbitration code. Gate 1 item 3 review, research/reviews/2026-11-23-text-read-tier.json, record 89.
    summary: In the Umatilla workers' benefit system, where an arbitrator appointed under sec. 9.01 hears a claimant's appeal from the Administrator's decision and awards more than the Administrator originally determined, the claimant's attorney fees are approved up to the lesser of 10% of the total award or $5,000, on top of the benefits; fee disputes go to the arbitrator under TEBC rules. Each side pays for its own physicians or experts for the hearing, whatever the outcome. The arbitrator's decision is final and binding except for appeal to the Umatilla Tribal Court (sec. 9.01).
