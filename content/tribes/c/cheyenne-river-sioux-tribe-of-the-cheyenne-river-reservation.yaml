land_establishment:
- land_area: Great Sioux Reservation (the land of the Cheyenne River Reservation lies within it)
  method: treaty
  instrument: Treaty with the Sioux, Apr. 29, 1868, art. II, 15 Stat. 635, 636
  date: '1868-04-29'
  detail: First set aside
  source: treaty-with-the-sioux-and-arapaho-1868
  confidence: medium
  verification: read-in-full
  locator: 15 Stat. 636
  note: 'The instrument reads: “shall be, and the same is, set apart for the absolute and undisturbed use and occupation of the Indians herein named”. The treaty set apart the Great Sioux Reservation (the district between the east bank of the Missouri, the Nebraska line, the 104th meridian and the 46th parallel); the separate Cheyenne River Reservation was carved from it by the Act of Mar. 2, 1889. Treaty is the first instrument for this land.'
- land_area: Cheyenne River Reservation, Dakota Territory
