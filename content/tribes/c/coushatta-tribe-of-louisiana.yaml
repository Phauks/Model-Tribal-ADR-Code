    locator: Resolution 2000-46; Arbitration Code Sections 1-11
    note: Read in full on 2026-11-22 (review queue item 2).
    summary: Makes written agreements to arbitrate enforceable, requires the Tribal Court to stay a covered
      court action and order arbitration on a party's application, and has the court confirm awards as
      written, declining only on stated grounds such as fraud or excess of powers, with the confirmed
      award enforceable as a civil judgment and no appeal from enforcement orders.
