dispute_resolution:
  forums:
  - kind: peacemaking
    name: Peacegiving Court
    own_term:
      name: Peacegiving
      language_tag: en
      translation: English term used by the Tribes for their peacemaking forum; facilitators are called
        Peacegivers
    description: A division of the Tribal Court providing a voluntary dispute resolution alternative grounded
      in tribal traditions of peace and healing, using restorative justice principles, traditional dispute
      resolution and mentoring; also supervises Child in Need of Supervision matters.
    legal_basis: Tribal Code Chapter 2-14 (Ordinance No. 072), Sections 2-14-1 to 2-14-19
    case_types:
    - juvenile
    - civil
    - other
    participation: court-referred
    relationship_to_court: Subject to supervision of the Chief Judge; the Tribal Court may transfer any
      case with the consent of all parties (or of the child in Child in Need of Supervision or juvenile
      offender matters).
    enforcement: Agreements must be written and fully executed and have no legal force until approved
      by the Tribal Court; breaches of confidentiality may be punished as contempt.
    link: https://peacemaking.narf.org/wp-content/uploads/2025/07/Confederated-Coos-Ch-2-14-Peacegiving-Court-2-9.pdf
    source: coos-lower-umpqua-siuslaw-ch-2-14-peacegiving-court
    confidence: medium
    verification: read-in-full
    as_of: '2005-11-13'
    locator: Sections 2-14-1, 2-14-3, 2-14-7, 2-14-9, 2-14-17
    note: Peacegivers may accept gifts of nominal value after the case ends, described in the code as
      in the tradition of potlatch (2-14-12). Ordinance states it does not waive sovereign immunity (2-14-18).
  provisions:
  - kind: peacemaking
    title: Chapter 2-14 – Peacegiving Court
    citation: CTCLUSI Tribal Code, Title 2 – Rules of Procedure, Chapter 2-14
    summary: Establishes the Peacegiving Court, peacegiver qualifications, consent-based transfer, confidentiality,
      and court approval of agreements.
    link: https://peacemaking.narf.org/wp-content/uploads/2025/07/Confederated-Coos-Ch-2-14-Peacegiving-Court-2-9.pdf
    source: coos-lower-umpqua-siuslaw-ch-2-14-peacegiving-court
    confidence: medium
    verification: read-in-full
    as_of: '2005-11-13'
  - kind: arbitration
    title: CHAPTER 2-3 ARBITRATION
    citation: Confederated Tribes of Coos, Lower Umpqua and Siuslaw Indians Tribal Code, Title 2 Rules
      of Procedure, 2-3-1 to 2-3-19
    link: https://ctclusi.org/wp-content/uploads/2020/12/Ch-2-3-Arbitration-10-12.pdf
    source: coos-lower-confederated-tribes-of-coos-lower-umpqua-and
    confidence: medium
    verification: read-in-full
    as_of: '2012-10-24'
    note: Read in full on 2026-11-22 (review queue item 2).
    summary: Authorizes arbitration of disputes under written contracts to which the Tribal Council has
      applied the chapter, lets the Tribal Court stay its own cases, order arbitration and appoint arbitrators,
      and confirms awards as civil judgments without review except on narrow grounds such as fraud or
      exceeded powers, with no appeal from an order enforcing an agreement or award.
    locator: 2-3-1 to 2-3-19
  - kind: peacemaking
    title: CHAPTER 2-14 PEACEGIVING COURT
    citation: Confederated Tribes of Coos, Lower Umpqua and Siuslaw Indians Tribal Code, Title 2 Rules
      of Procedure, Chapter 2-14 Peacegiving Court, 2-14-1 to 2-14-19
    link: https://narf.org/nill/codes/cooscode/2_2-14.pdf
    source: coos-lower-confederated-tribes-of-coos-lower-umpqua-and-2
    confidence: medium
    verification: read-in-full
    as_of: '2005-11-13'
    locator: 2-14-1 to 2-14-19
    note: Read in full on 2026-11-22 (review queue item 2). The National Indian Law Library table of contents
      lists it as "Arbitration (10/24/12"; the printed heading, number or version differs (see research/reviews/2026-11-22-title-only-provisions.json).
    summary: Establishes a Peacegiving Court within the Tribal Court in which peacegivers appointed by
      the court help parties, with the consent of all parties or of the child, resolve disputes and juvenile
      matters through tribal traditions, with confidential sessions, written agreements that have legal
      force only once the Tribal Court approves them, and the Tribal Court retaining authority to end
      the process.
