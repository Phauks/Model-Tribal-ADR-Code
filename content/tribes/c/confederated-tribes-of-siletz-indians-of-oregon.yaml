dispute_resolution:
  forums:
  - kind: peacemaking
    name: Siletz Community Law Court
    own_term:
      name: Gwe-shvt-naga
      language_tag: und
      romanized: GWAY-SHUT-NAH-GAH (pronunciation as printed)
      translation: in between he, she, or it walks (title for the peacemaker)
    description: Part of the Tribal Court system giving formal support, structure and enforcement to traditional
      Siletz methods of resolving disputes through mediation and traditional ways; peacemakers are titled
      Gwe-shvt-naga. Peacemakers may decide a disputed matter only if all parties agree in writing or
      before the Tribal Court.
    legal_basis: Siletz Tribal Code § 3.300 and following (Siletz Community Law Court)
    case_types:
    - family
    - civil
    - commercial
    - criminal-diversion
    - other
    participation: voluntary-or-court-referred
    relationship_to_court: The Community Law Court Judge supervises the peacemakers; civil and criminal
      actions may be transferred from Tribal Court where all parties consent in writing.
    enforcement: Judgments may be enforced as any Tribal Court judgment; they may not be appealed, but
      a party may move to modify for a $30 fee.
    link: https://ctsi.nsn.us/wp-content/uploads/2025/06/Siletz-Community-Law-Court-06-20-2025.pdf
    source: siletz-code-3-300-community-law-court-2025
    confidence: high
    verification: read-in-full
    as_of: '2025-06-20'
    locator: § 3.300, 3.301, 3.302, 3.319, 3.320, 3.325-3.326; § 3.305
    note: Language of the term is not named in the source, so language_tag is 'und'. Listed matters include
      marital disputes and family strife, extended family disputes, minor neighbor disputes, alcohol use,
      and minor community business transactions of $2,500 or less. Peacemakers must be enrolled Siletz
      members certified by Tribal Council. Attorneys barred. Updated from the 2005 version on NARF (peacemaking.narf.org/wp-content/uploads/2025/07/Siletz-Comm-Law-Court-09-16-2005.pdf);
      the 2005 text said the court was not yet authorized for divorce, separation or annulment, and that
      sentence does not appear in the 2025 text read. Folded on 2026-11-22 from a separate forum record
      for the same text (review queue item 5). Agreed decisions rest on Siletz Tribal Code § 3.305 (Limitations;
      Gwe-shvt-naga/Peacemakers Not Judges; Agreed Arbitration). Decision is entered by the Siletz Community
      Law Court Judge, and it has the effect of a court judgment when entered.
  provisions:
  - kind: peacemaking
    title: Siletz Community Law Court
    citation: Siletz Tribal Code § 3.300 and following
    summary: Establishes the Community Law Court and Gwe-shvt-naga/Peacemakers, subject matter, consent-based
      transfer, judgments and their enforcement.
    link: https://ctsi.nsn.us/wp-content/uploads/2025/06/Siletz-Community-Law-Court-06-20-2025.pdf
    source: siletz-code-3-300-community-law-court-2025
    confidence: high
    verification: read-in-full
    as_of: '2025-06-20'
  - kind: arbitration
    title: 5.561 DISPUTE RESOLUTION (with 5.562 Mediation, 5.563 Request for Arbitration or Mediation,
      5.564 Discovery, 5.567 Burden of Proof, 5.568 Law to Apply, 5.570 Severability, 5.572 Sovereign
      Immunity)
    citation: Siletz Workers' Compensation Claims Ordinance (Siletz Tribal Code 5.500), 5.561-5.572
    link: https://ctsi.nsn.us/wp-content/uploads/2023/03/Siletz-Workers-Compensation-Claims-Ordinance-03-16-2023.pdf
    source: siletz-oregon-siletz-workers-compensation-claims-ordinance
    confidence: high
    verification: read-in-full
    as_of: '2023-03-16'
    note: Read in full on 2026-11-22 (review queue item 2).
    summary: Lets a claimant dispute a final benefits decision of the Administrator by requesting binding
      arbitration in writing within 20 days, before an arbitrator mutually agreed from a list, with set
      steps for the hearing, discovery and proof and the American Arbitration Association rules filling
      gaps, while the Administrator may require mediation that binds only on a written agreement.
    locator: 5.561-5.572
  - kind: mediation
    title: '2 COURT PERSONNEL: Judicial Officers; Chief Judge; Associate Judges; Pro-Tem Judges; Mediators;
      Removal of Judges; Court Clerk; Legal Interns; Court Interpreters; Tribal Bar.'
    citation: '2 COURT PERSONNEL: Judicial Officers; Chief Judge; Associate Judges; Pro-Tem Judges; Mediators;
      Removal of Judges; Court Clerk; Legal Interns; Court Interpreters; Tribal Bar.'
    link: https://www.narf.org/nill/codes/confederated_siletz/index.html
    source: national-indian-law-library-code-codes-confederated-siletz
    confidence: medium
    verification: title-only
    as_of: 2015-03
    note: 'Section or chapter title(s) from the National Indian Law Library table of contents; the provision
      text was not read, so there is no summary. Kind assigned from words in the title. Searched for the
      text on 2026-11-22 and not read. Places searched: research/search-logs/dispute-resolution/c/confederated-tribes-of-siletz-indians-of-oregon.yaml.'
  - kind: peacemaking
    title: Siletz Tribal Code Sec. 3.300
    citation: Siletz Tribal Code Sec. 3.300
    link: https://peacemaking.narf.org/wp-content/uploads/2025/07/Siletz-Comm-Law-Court-09-16-2005.pdf
    source: narf-ipi-tribal-peacemaking-laws
    confidence: medium
    verification: read-in-full
    as_of: '2025-09-29'
    locator: Confederated Tribes of Siletz Indians of Oregon
    note: 'Native American Rights Fund description (provision itself not read): Provides authorization
      and civil process authority, referral standards and standards of conduct, and authority to use traditional
      ways and lecture on tribal teachings.'
  - kind: peacemaking
    title: CHAPTER 2 GWE-SHVT-NAGA/PEACEMAKERS
    citation: Siletz Community Law Court (Siletz Tribal Code 3.300), 3.303-3.307
    link: https://ctsi.nsn.us/wp-content/uploads/2025/06/Siletz-Community-Law-Court-06-20-2025.pdf
    source: siletz-code-3-300-community-law-court-2025
    confidence: high
    verification: read-in-full
    as_of: '2025-06-20'
    locator: 3.303-3.307
    note: Read in full on 2026-11-22 (review queue item 2).
    summary: Sets out how Gwe-shvt-naga/Peacemakers are certified and appointed, their powers to mediate,
      and their duties and reporting to the Tribal Court, and provides that they may decide a dispute
      only where all parties agree in writing or before the Tribal Court, with such a decision entered
      as a court judgment by the Community Law Court Judge.
  - kind: peacemaking
    title: CHAPTER 3 PEACEMAKING
    citation: Siletz Community Law Court (Siletz Tribal Code 3.300), 3.308-3.316
    link: https://ctsi.nsn.us/wp-content/uploads/2025/06/Siletz-Community-Law-Court-06-20-2025.pdf
    source: siletz-code-3-300-community-law-court-2025
    confidence: high
    verification: read-in-full
    as_of: '2025-06-20'
    locator: 3.308-3.316
    note: Read in full on 2026-11-22 (review queue item 2).
    summary: Explains how an individual files a request for peacemaking with the Tribal Court, how the
      Chief Judge and Community Law Court Judge grant or deny the request, how parties consent to peacemakers
      and how notice, subpoenas and fees work, and provides that a case may be transferred only with the
      written consent of all parties.
  - kind: peacemaking
    title: CHAPTER 5 CONDUCT OF GWE-SHVT-NAGA/PEACEMAKERS
    citation: Siletz Community Law Court (Siletz Tribal Code 3.300), 3.322-3.324
    link: https://ctsi.nsn.us/wp-content/uploads/2025/06/Siletz-Community-Law-Court-06-20-2025.pdf
    source: siletz-code-3-300-community-law-court-2025
    confidence: high
    verification: read-in-full
    as_of: '2025-06-20'
    locator: 3.322-3.324
    note: Read in full on 2026-11-22 (review queue item 2). Whether this is a dispute resolution provision
      is left for the lead author's review.
    summary: Requires peacemakers to follow judicial ethics canons and avoid matters involving a personal
      or financial interest or close relation to a party, and provides that a written complaint about
      a peacemaker is investigated by the Community Law Court Judge, who may suspend the peacemaker from
      the roll, subject to appeal to the Tribal Appellate Court.
