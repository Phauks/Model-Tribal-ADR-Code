land_establishment:
- land_area: Coast (Siletz) Reservation, Oregon (original large tract)
  method: executive-order
  instrument: Exec. Order of Nov. 9, 1855, 1 Kappler 891
  date: '1855-11-09'
  detail: First set aside
  source: executive-order-1855-11-09-coast-reservation
  confidence: medium
  verification: read-in-full
  locator: 1 Kappler 891
  note: 'The instrument reads: “The reservation of the land within denoted by blue-shaded lines is hereby made”. Kappler gives the order under "Siletz (originally known as Coast) Reserve." Conditional reservation for the Coast tribes; curtailed by Exec. Order of Dec. 1866 and Act of Mar. 3, 1875 (18 Stat. 446). The Siletz Reservation was terminated in 1956 and restored in 1977; the current Census area is trust land.'
