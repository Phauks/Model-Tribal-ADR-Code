dispute_resolution:
  forums:
  - kind: peacemaking
    name: Peacegiving Program
    own_term:
      name: Peacegiving
      language_tag: en
      translation: English term used by the Tribe; facilitators are called Peacegivers
    description: A program under supervision of the Chief Judge in which Peacegivers resolve disputes
      using restorative justice principles and traditional Tribal dispute resolution and community integration
      values and practices.
    legal_basis: Coquille Tribal Ordinance Chapter 655 (Peacegiving Procedures), 655.010-655.900
    case_types:
    - juvenile
    - civil
    - other
    participation: voluntary-or-court-referred
    relationship_to_court: With the parties' consent the Tribal Court may transfer any case or dispute;
      the code also provides that cases involving a juvenile party may be transferred with or without
      consent.
    enforcement: Agreements must be in writing and have no legal force until approved by the Tribal Court;
      confidentiality breaches may be treated as contempt.
    link: https://peacemaking.narf.org/wp-content/uploads/2025/07/Coquille-655-Peacegiving.pdf
    source: coquille-ordinance-655-peacegiving
    confidence: medium
    verification: read-in-full
