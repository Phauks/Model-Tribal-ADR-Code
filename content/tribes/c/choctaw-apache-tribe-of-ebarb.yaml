  as_of: 2012-04
  locator: Table 1; Table 3
  note: 'GAO Table 1 lists "Choctaw-Apache Tribe of Ebarb" among 26 non-federally recognized tribes that
    received direct federal funding in FY2007-2010 (total $1,621,000, Table 3). GAO-reported nonprofit
    status: Yes; state recognition per state officials: Yes. GAO reports the tribe received Department
    of Education American Indian Vocational Rehabilitation Services funding through a consortium with
    Four Winds Cherokee, and found it appeared ineligible because it lacks a statutory reservation. Not
    on the 2026 federal list (bia-recognized-entities-2026).'
