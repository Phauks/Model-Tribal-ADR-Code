  note: The 2020 Census delineated "Apache Choctaw SDTSA" (State Designated Tribal Statistical Area).
    The Census Bureau defines SDTSAs as statistical areas for state-recognized tribes that are not federally
    recognized and have no reservation or off-reservation trust land, delineated with a governor-appointed
    state liaison. Not on the 2026 federal list. Linking of area to group is by name comparison (see census-area
    fact).
