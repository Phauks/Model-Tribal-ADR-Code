recognition:
- type: territorial-law
  state: MP
  legal_basis: Constitution of the Northern Mariana Islands, art. XII §§ 1 and 4 ('persons of Northern
    Marianas descent', including Northern Marianas Carolinian), as amended by House Legislative Initiative
    18-1 (2014)
  source: cnmi-constitution
  confidence: high
  verification: read-in-full
  as_of: '2014'
  locator: art. XII §§ 1, 4
  note: Same provision as for the CHamoru people; descent is defined by Northern Marianas Chamorro or
    Northern Marianas Carolinian blood or a combination. See the Covenant § 805 basis (cnmi-covenant).
- type: territorial-law
  state: MP
  legal_basis: Constitution of the Northern Mariana Islands, art. III § 18 (Executive Assistant for Carolinian
    Affairs), as amended by Second Const. Conv. Amend. 18 (1985)
  source: cnmi-constitution
  confidence: high
  verification: read-in-full
  as_of: '1985'
  locator: art. III § 18
  note: Governor appoints an executive assistant 'acceptable to the Carolinian community' who advises
    on 'matters affecting persons of Carolinian descent', may investigate complaints and hold hearings,
    and sits on the governor's council. Original provision 1977 (effective 1978), amended 1985.
- type: territorial-law
  state: MP
  legal_basis: Constitution of the Northern Mariana Islands, art. III § 23 (Resident Executive for Indigenous
    Affairs), Second Const. Conv. Amend. 22 (1985)
  since: '1985'
  source: cnmi-constitution
  confidence: high
  verification: read-in-full
  as_of: '1985'
  locator: art. III § 23
- type: territorial-law
  state: MP
  legal_basis: Covenant to Establish a Commonwealth of the Northern Mariana Islands, § 805, approved by
    Pub. L. 94-241, 90 Stat. 263 (1976)
  since: '1976-03-24'
  source: cnmi-covenant
  confidence: high
  verification: read-in-full
  as_of: '1976-03-24'
  locator: § 805(a)
  note: Basis for the land-alienation restriction to persons of Northern Mariana Islands descent.
states:
- state: MP
  presence: land
