- topic: state-jurisdiction-statute
  value: state-criminal-and-civil-jurisdiction
  detail: South Carolina has civil, criminal and regulatory jurisdiction over the Catawba Tribe, its members and lands as over any other person or land, except where the State Act or federal implementing law says otherwise; federal law adopts the Settlement Agreement and State Act for these questions. (S.C. Code Ann. § 27-16-40; Pub. L. No. 103-116, § 10(1), 107 Stat. at 1126.)
  source: south-carolina-code-27-16-40
  confidence: high
  verification: read-in-full
  locator: S.C. Code Ann. § 27-16-40
  note: 'Federal side: § 10(1), "All matters involving tribal powers, immunities, and jurisdiction, whether criminal, civil, or regulatory, shall be governed by the terms and provisions of the Settlement Agreement and the State Act." Section 5(e)(?) of the federal Act (107 Stat. at 1122): the Act does not "deprive the State of jurisdiction other than as expressly provided." The State Act also lets the Tribe create tribal courts (S.C. Code Ann. §§ 27-16-110 to -120 not fully read). Also cites: public-law-103-116.'
