  value: not-a-public-law-280-state
  detail: South Carolina is not one of the states that Public Law 280 required to take jurisdiction or that chose to take it, so the state has no Public Law 280 jurisdiction over the nation's Indian country in South Carolina. Other federal laws can still give a state some jurisdiction.
  source: bia-faq-public-law-280
