  confidence: medium
  verification: inferred
  as_of: '2026-05-26'
  locator: 91 FR 30669 (Tribe column of the designated agent table)
  note: 'Listed as: Curyung Tribal Council Confidence lowered from high by the lead session: the notice
    prints its table as page images, so nation names were read from images and matched to the roster.
