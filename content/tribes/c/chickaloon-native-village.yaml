- topic: violence-against-women-act-special-tribal-criminal-jurisdiction
  value: implementation-grant
  detail: Received a Justice Department Tribal Jurisdiction Program grant (fiscal year 2023) for special Tribal criminal jurisdiction. These grants also fund planning, so the grant alone does not show that the nation exercises the jurisdiction.
