    name: Peacemaking Panel and Peacemaker Program
    description: A Peacemaking Panel that may mediate disputes at the parties' request before filing or
      as assigned by the Chief Judge after suit; the Peacemaker Program provides a nonadversarial way
      to resolve disputes, reflecting the Tribe's tradition of using respected community members to heal
      conflicts.
    legal_basis: Grand Ronde Tribal Code Chapter 302 (Tribal Court Ordinance), Sections (c)(2)(A) and
      (l)
    case_types:
    - civil
    - other
    participation: voluntary-or-court-referred
    relationship_to_court: Parties are not precluded from filing or continuing a court claim if peacemaking
      is unsuccessful. Peacemakers are tribal members at least 25 years old approved by Tribal Council
      from the Chief Judge's list; they are volunteers.
