  locator: Pub. L. 100-95 § 9, 101 Stat. at 709-10
  note: Section 7(a) (101 Stat. at 707) also bars the tribal council from exercising jurisdiction "in contravention of" the Act and Massachusetts criminal and civil regulatory law. 25 U.S.C. § 1771g is "omitted" from the Code. The research did not research Aquinnah litigation after 1987. No comparable statute found for the Mashpee Wampanoag Tribe.
