  value: state-criminal-and-civil-jurisdiction
  detail: Settlement lands and other Indian-held land in the town of Gay Head (Aquinnah) are subject to the civil and criminal laws, ordinances and jurisdiction of Massachusetts and the town, except as the Act or the State Implementing Act expressly provides. (Pub. L. No. 100-95, § 9, 101 Stat. at 709.)
  source: public-law-100-95
  confidence: high
