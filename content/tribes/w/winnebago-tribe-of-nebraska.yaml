jurisdiction:
- topic: public-law-280
  value: mandatory-state
  detail: 'Nebraska is a mandatory state: 18 U.S.C. § 1162(a) (criminal) and 28 U.S.C. § 1360(a) (civil)
    extend state jurisdiction to all Indian country within Nebraska. Applies to the nation''s Indian country
    within Nebraska; the statute itself does not identify which lands are Indian country.'
  source: us-code-title-18-section-1162
  confidence: medium
  as_of: '2010-07-29'
  locator: 18 U.S.C. § 1162(a) and 28 U.S.C. § 1360(a), entry "Nebraska"
  note: Statute is primary; nation matched to Nebraska by office state in the BIA Tribal Leaders Directory,
    so confidence is medium. Cited jointly with us-code-title-28-section-1360.
- topic: public-law-280
  value: retroceded
  detail: Interior accepted retrocession of all criminal jurisdiction exercised by Nebraska over the Winnebago
    Reservation (acquired under Public Law 280). Civil jurisdiction not covered. (51 FR 24234)
  source: federal-register-1986-winnebago-retrocession
  confidence: high
  as_of: '1986-07-03'
