jurisdiction:
- topic: public-law-280
  value: mandatory-state
  detail: 'California is a mandatory state: 18 U.S.C. § 1162(a) (criminal) and 28 U.S.C. § 1360(a) (civil)
    extend state jurisdiction to all Indian country within California. Applies to the nation''s Indian
    country within California; the statute itself does not identify which lands are Indian country.'
  source: us-code-title-18-section-1162
  confidence: medium
  verification: bulk-import
  as_of: '2010-07-29'
  locator: 18 U.S.C. § 1162(a) and 28 U.S.C. § 1360(a), entry "California"
  note: Statute is primary; nation matched to California by state named in the nation's official name
    in the 2026 list (multi-state nation), so confidence is medium. Cited jointly with us-code-title-28-section-1360.
- topic: public-law-280
  value: retroceded
  detail: Interior accepted Nevada's offer to retrocede all civil and criminal jurisdiction acquired under
    Public Law 280 (Nevada was an optional state, 1955) over the Carson Colony, Dresslerville Colony,
    Washoe Tribal Farms and Washoe Pinenut Allotment, effective July 1, 1975. (40 FR 27501)
  source: federal-register-1975-nevada-retrocession
  confidence: medium
  verification: read-in-full
  as_of: '1975-07-01'
