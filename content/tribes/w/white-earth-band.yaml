dispute_resolution:
  forums:
  - kind: restorative-justice
    name: Peacemaking Circle (White Earth juvenile justice)
    description: A community-directed process in partnership with the tribal court for reaching consensus
      on a sentencing plan; the code describes circles as using traditional circle ritual and structure
      in which community members, elders, victims, the judge, attorneys, police and court workers speak
      in a shared search for understanding and healing.
    legal_basis: White Earth Nation Juvenile Justice Code, Chapter 12A, Secs. 3-12-A-1 to 3-12-A-3; definition
      30
    case_types:
    - juvenile
    - criminal-sentencing
    participation: voluntary-or-court-referred
    relationship_to_court: After a guilty plea accepted by the Tribal Court judge, the court refers the
      offender to the juvenile counselor; the offender may choose not to participate, in which case the
      matter proceeds through adjudication or sentencing by the judge.
    enforcement: The circle's consensus sentence agreement is presented to the judge for approval with
      information on meetings held and community involvement.
    link: https://peacemaking.narf.org/wp-content/uploads/2025/07/White-Earth-juvenile.justice.code_.pdf
    source: white-earth-juvenile-justice-code
    confidence: medium
    verification: read-in-full
    as_of: '2025'
    locator: Chapter 12A; definitions 30 and 36
    note: 'White Earth is a component band of the Minnesota Chippewa Tribe on the federal list; recorded
      under minnesota-chippewa-tribe with component_band. The offender and circle members create a social
      compact. as_of is NARF posting year. Component band: White Earth Band of Ojibwe.'
  - kind: elders-council
    name: Panel of Elders
    description: Twelve elders appointed by the Tribal Council (four from each district) advise the Tribal
      Court on disputes under White Earth law when a party asks; the Chief Judge presides and assigns
      one elder to advise in each case. Elders may also serve as jurors, one may sit on the Appellate
      Panel, and a Band member, including a juvenile, may choose to have a case heard in consultation
      with an elder in accordance with the Band's traditional values and practices.
    legal_basis: White Earth Judicial Code, Title 1, Chapter VIII (Sections 1-7); Chapter I Section 1;
      Chapter VII Section 6(b)
    case_types:
    - juvenile
    - other
    participation: voluntary
    relationship_to_court: Part of the White Earth Tribal Court; advises the court on request, and the
      court may also seek the panel's advice when custom or tradition is in doubt.
    link: https://www.whiteearth.com/media/pages/divisions/judicial-services/codes-ordinances/5dcba5f024-1727297538/judicial.code.pdf
    source: white-earth-judicial-code
    confidence: medium
    verification: read-in-full
    as_of: '1997-11-03'
    locator: Chapter I § 1; Chapter III § 6; Chapter VII § 6(b); Chapter VIII §§ 1-7
    note: 'Read by OCR. The chapter applies to all actions within the court''s jurisdiction; only juveniles
      are named expressly, so other case types are recorded as ''other''. The panel may adopt its own
      rules of procedure. Adopted by the White Earth Tribal Council on Nov. 3, 1997 (certification). The
      scanned copy (May 4, 2021) appends a 2021 WERBC resolution adding Chapter 2, § 1(j). Component band:
      White Earth Band of Ojibwe.'
  provisions:
  - kind: peacemaking
    title: Juvenile Justice Code, Chapter 12A – Peacemaking Circle (White Earth Nation)
    citation: White Earth Nation Juvenile Justice Code, Chapter 12A
    summary: Sets the application, scheduling and sentence agreement process for juvenile peacemaking
      circles after a guilty plea.
    link: https://peacemaking.narf.org/wp-content/uploads/2025/07/White-Earth-juvenile.justice.code_.pdf
    source: white-earth-juvenile-justice-code
    confidence: medium
    verification: read-in-full
    as_of: '2025'
    note: 'Component band: White Earth Band of Ojibwe.'
