  - kind: other
    title: SECTION XLI – Patron Dispute Resolution
    citation: White Earth Reservation Gaming Ordinance, XLI
    link: https://www.whiteearth.com/media/pages/divisions/judicial-services/codes-ordinances/37d1c28555-1748011214/gaming-ordinance-and-resolution-2019.pdf
    source: white-earth-white-earth-reservation-gaming-ordinance
    confidence: medium
    verification: read-in-full
    as_of: '2019-05-15'
    locator: XLI
    note: Read in full on 2026-11-22 (review queue item 2).
    summary: Lets a person with a dispute against a licensed gaming operator or management company ask
      the General Manager to resolve it within seven days of the occurrence, then ask the Gaming Commission
      to review it (decision within fourteen business days), with an appeal to the White Earth Tribal
      Court within 14 days of notice of the Commission's decision.
