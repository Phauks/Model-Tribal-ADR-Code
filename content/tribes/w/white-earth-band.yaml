land_establishment:
- land_area: White Earth Reservation, Minnesota
  method: treaty
  instrument: Treaty with the Chippewa of the Mississippi, Mar. 19, 1867, art. II, 16 Stat. 719, 720
  date: '1867-03-19'
  detail: First set aside
  source: treaty-with-the-chippewa-of-the-mississippi-1867
  confidence: high
  verification: read-in-full
  locator: 16 Stat. 720
  note: 'The instrument reads: “there is hereby set apart for their use a tract of land, to be located in a square form as nearly as possible ... which reservation shall include White Earth Lake and Rice Lake, and contain thirty-six townships of land”. Treaty also reserves a tract for the Mississippi bands (Gull Lake / Mille Lacs, Leech Lake) in art. I.'
