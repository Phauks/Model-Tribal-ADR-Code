land_establishment:
- land_area: White Mountain (Camp Apache) Reservation, Arizona
  method: executive-order
  instrument: Exec. Order of Nov. 9, 1871, 1 Kappler 811-12
  date: '1871-11-09'
  detail: First set aside
  source: executive-order-1871-11-09-white-mountain-camp-apache-reservation
  confidence: medium
  verification: read-in-full
  locator: 1 Kappler 811-812
  note: 'The instrument reads: “that the President issue an order authorizing said tracts of country described in Mr. Colyer’s letter to be regarded as reservations”. Kappler prints the Nov. 7, 1871 Interior Secretary recommendation (p. 811, naming the Camp Apache tract in the White Mountains selected for the Coyotero and Chilicco Apaches) with the President''s Nov. 9 referral directing the Secretary of War to carry out the recommendations (p. 812). Kappler''s heading is "White Mountain or San Carlos Reserve"; the Camp Apache tract had earlier been set apart administratively by the War Department (the Sept. 5, 1871 letter on p. 810 says the White Mountain region "has been set apart by the War Department"). No separate order text names the reservation until Dec. 14, 1872.'
