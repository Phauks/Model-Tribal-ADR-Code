- topic: public-law-280
  value: optional-state
  detail: Nevada's 1955 act assumed civil and criminal jurisdiction over Indian country in all counties, unless a county board petitioned the Governor before the effective date (90 days after July 1, 1955) and the Governor excluded that county's Indian country by proclamation. (1955 Nev. Stat. ch. 198, §§ 1-3, at 297.)
  source: nevada-statutes-1955-chapter-198
  confidence: high
  verification: read-in-full
  locator: 1955 Nev. Stat. ch. 198, §§ 1-2, at 297
  note: 'Mapped to the nations whose lands appear in the 1975 and 1988 retrocession notices (see those facts). Odger''s Ranch and Ruby Valley Allotment, named in the 1975 notice, are not mapped because the research could not tie them to a roster entry. The 1955 act was later folded into NRS 41.430 (history line "1:198:1955"). Also cites: davis-v-warden-1972.'
- topic: public-law-280
  value: optional-state
  detail: Since July 1, 1974 NRS 41.430 applies only where the tribe consented, by referendum under sections 6-14 of the 1973 act or under 25 U.S.C. § 1326; where a tribe refused, Nevada "recedes from and relinquishes" jurisdiction. The Indian affairs commission was to hold the referenda by June 4, 1974. (1973 Nev. Stat. ch. 601, §§ 1, 6, at 1051-53; Nev. Rev. Stat. § 41.430(3)-(4).)
  source: nevada-statutes-1973-chapter-601
  confidence: high
  verification: read-in-full
  locator: 1973 Nev. Stat. ch. 601, § 1, subsec. 4, at 1052; NRS 41.430(4)
  note: 'Sections 1-5 took effect July 1, 1974 (§ 16). The current NRS text still carries this language. Goldberg (2010) says no tribe asked to continue; the 1976 AIPRC report says Ely Colony alone chose to keep state jurisdiction. Goldberg''s date for the assumption (1967) conflicts with the Statutes (1955). Also cites: nevada-revised-statutes-41-430.'
