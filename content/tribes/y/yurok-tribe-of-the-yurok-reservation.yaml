  - kind: other
    title: 9.20 Dispute Resolution
    citation: Yurok Tribal Code 9.20.010, Procedure for resolving disputes between the gaming public and the Tribe or management (Title 9, Ch. 9.20)
    link: https://yurok.tribal.codes/YTC/9.20.010
    source: yurok-tribal-code-9-20-010
    confidence: medium
    verification: read-in-full
    as_of: '2000'
    locator: Title 9, Ch. 9.20, section 9.20.010(a)-(d)
    note: 'Read in full on 2026-11-23 (Yurok Tribal Code 9.20.010 Procedure for resolving disputes between the gaming public and the Tribe or management (code current through Ordinance 86, Nov. 7, 2024); [Ord. 3 § XI, adopted, 4/5/2000]). Read from the Yurok Tribal Code web copy of 9.20.010 (current through Ordinance 86, passed November 7, 2024); the history line shows adoption 4/5/2000. Date: 2000 (Ord. 3 § XI, adopted 4/5/2000); code current through Ordinance 86 (Nov. 7, 2024). Gate 1 item 3 review, research/reviews/2026-11-23-text-read-tier.json, record 622.'
    summary: A member of the public with a complaint about the gaming facility goes first to its CEO or general manager, who tries to mediate or resolve it; if unsatisfied, the complainant may within 14 days file with the Gaming Commission, which decides within 30 days and orders appropriate remedies. Appeals may be taken to Yurok Tribal Court within 30 days, whether or not the complainant is a member, and the Tribal Court's decision is final.
