    dispute_resolution_summary: The parties exchange written notice and a written response within 15 days
      and must meet and confer within 30 days; if unresolved either party may seek arbitration before
      a single arbitrator under the American Arbitration Association Commercial Arbitration Rules, though
      neither is required to agree to arbitrate, and disagreements not resolved by arbitration or other
      agreed means may go to the United States District Court or a state court in Del Norte County, with
      money damages barred under a limited waiver of sovereign immunity.
