- topic: public-law-280
  value: not-a-public-law-280-state
  detail: Texas is not one of the states that Public Law 280 required to take jurisdiction or that chose to take it, so the state has no Public Law 280 jurisdiction over the nation's Indian country in Texas. Other federal laws can still give a state some jurisdiction.
  source: bia-faq-public-law-280
  confidence: high
  verification: inferred
  as_of: '2017-07-18'
  locator: Answer, second and third paragraphs (the lists of mandatory and optional states)
  note: Inferred from the state's absence from both lists. Nation placed in Texas by the Census Bureau's land areas.
- topic: state-jurisdiction-statute
  value: state-criminal-and-civil-jurisdiction
  detail: Texas exercises civil and criminal jurisdiction within the Ysleta del Sur Pueblo reservation as if it had assumed that jurisdiction with the tribe's consent under 25 U.S.C. §§ 1321 and 1322. (Pub. L. No. 100-89, § 105(f), 101 Stat. 666, 668.)
  source: public-law-100-89
  confidence: high
  verification: read-in-full
  locator: Pub. L. 100-89 § 105(f), 101 Stat. at 668
  note: 25 U.S.C. § 1300g-4 is "omitted" from the Code. Gaming provisions (§ 107) and Ysleta del Sur Pueblo v. Texas, 596 U.S. 685 (2022), were not analyzed.
