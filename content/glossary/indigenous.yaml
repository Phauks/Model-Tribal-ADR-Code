id: indigenous
term: Indigenous
kind: term
usage: acceptable
definition: >-
  The original peoples of a place, used especially in international and
  comparative contexts. "Indigenous Peoples (uppercase I and P) refers to
  Indigenous People as groups with distinct legal rights," while "Indigenous
  peoples (uppercase I, lowercase p) refers to Indigenous peoples with
  individual rights" [@ngc-how-to-talk-about-native-nations, p. 5].
usage_note: >-
  Always capitalize, including in non-Indigenous [@ngc-terminology-style-guide].
  Use it for groups across several nations or countries
  [@ngc-how-to-talk-about-native-nations, p. 4], and when quoting
  international instruments.
aliases: [Indigenous Peoples, Indigenous peoples, non-Indigenous]
see_also: [native, native-american, first-nations]
sources: [ngc-how-to-talk-about-native-nations, ngc-terminology-style-guide]
basis: source
status: draft
