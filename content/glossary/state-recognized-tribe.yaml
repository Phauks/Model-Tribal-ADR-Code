id: state-recognized-tribe
term: state-recognized tribe
kind: term
usage: acceptable
definition: >-
  A Native nation "recognized by their respective state governments"
  [@ncai-tribal-nations-and-the-united-states, p. 9].
usage_note: >-
  The project includes state-recognized nations in [[native-nations]]. Do not
  assume state recognition carries the federal relationship described under
  [[federally-recognized-tribe]] (project analysis).
aliases: [state-recognized tribes]
see_also: [federally-recognized-tribe, native-nations]
sources: [ncai-tribal-nations-and-the-united-states]
