id: tribe
term: Tribe
kind: term
part_of_speech: noun
usage: context-only
definition: >-
  A word for a Native nation that many federal laws and many nations' own names
  use. One guide does not recommend it "to talk about Native nations"
  [@ngc-how-to-talk-about-native-nations, p. 3]; the same organization's style
  guide allows "Tribal nations" or "Tribes" "in special circumstances, if
  necessary" [@ngc-terminology-style-guide].
law_dictionary:
  - source: blacks-law-dictionary-2024-tribe
    quote: 'A definable group or organized band or pueblo of American Indians, esp. those residing on one reservation'
usage_note: >-
  Use it when it is part of a nation's own name, when a nation calls itself a
  Tribe, when quoting, and when a statute's defined term matters (see
  [[indian-tribe]]). Otherwise write [[native-nations|Native nation]].
  Capitalize Tribe and Tribal in our own voice
  [@ngc-terminology-style-guide]; keep quotations as written.
aliases: [Tribes, tribe, tribes]
use_instead: [native-nations]
see_also: [tribal, tribal-nations, indian-tribe]
sources: [ngc-how-to-talk-about-native-nations, ngc-terminology-style-guide]
basis: source-and-project-analysis
status: draft
