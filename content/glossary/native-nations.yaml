id: native-nations
term: Native nations
kind: term
part_of_speech: noun
usage: preferred
definition: >-
  The project's default collective term for the Indigenous nations and
  communities of the United States, including Alaska, Hawaiʻi and the
  territories, whatever their federal or state status (project definition). It
  follows the advice to
  "use nation instead of Tribe" [@ngc-how-to-talk-about-native-nations, p. 3]
  and reflects that "the words tribe and nation are used interchangeably but
  hold very different meanings for many Native people"
  [@nmai-impact-of-words].
usage_note: >-
  Capitalize Native; do not capitalize nations unless it is part of a nation's
  own name [@ngc-terminology-style-guide]. Once the context is clear, "the
  nation" alone is fine [@ngc-terminology-style-guide]. When one nation is
  meant, use its own name as it writes it. Where federal status matters, use
  the legal term instead, such as [[federally-recognized-tribe]].
aliases: [Native nation, Native nation's, Native nations']
see_also: [nation, tribe, tribal-nations, federally-recognized-tribe]
sources: [ngc-how-to-talk-about-native-nations, ngc-terminology-style-guide, nmai-impact-of-words]
basis: source-and-project-analysis
status: draft
