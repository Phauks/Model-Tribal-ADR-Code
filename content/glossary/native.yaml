id: native
term: Native
kind: term
part_of_speech: adjective
usage: acceptable
definition: >-
  Adjective or noun for Indigenous people of the United States. The term "is
  often used officially or unofficially to describe indigenous peoples from the
  United States (Native Americans, Native Hawaiians, Alaska Natives)"
  [@nmai-impact-of-words].
law_dictionary:
  - source: blacks-law-dictionary-2024-native
    quote: 'a person or thing belonging to a group indigenous to a particular place'
usage_note: >-
  Always capitalized, including in non-Native [@ngc-terminology-style-guide];
  "the uppercase n helps make the distinction between human beings and
  objects" [@ngc-how-to-talk-about-native-nations, p. 4].
aliases: [non-Native]
see_also: [native-american, indigenous]
sources: [nmai-impact-of-words, ngc-terminology-style-guide, ngc-how-to-talk-about-native-nations]
basis: source
status: draft
