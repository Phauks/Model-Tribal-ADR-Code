id: possessive-framing
term: possessive framing
kind: phrase
usage: avoid
definition: >-
  Phrases that make Native people or nations belong to a state or country,
  such as "the United States' Native peoples" [@ngc-terminology-style-guide]
  or "Minnesota's 11 Native nations"
  [@ngc-how-to-talk-about-native-nations, p. 3].
usage_note: >-
  Write "Native nations in Minnesota" or "Native nations located within the
  United States" instead (our wording).
use_instead: [native-nations]
sources: [ngc-terminology-style-guide, ngc-how-to-talk-about-native-nations]
basis: source
status: draft
