id: alaska-native-village
term: Alaska Native village
kind: term
part_of_speech: noun
usage: preferred
definition: >-
  The usual term for a Native nation in Alaska: "the term 'village' is used
  instead of 'tribe'" [@ncai-tribal-nations-and-the-united-states, p. 22].
  Some federal definitions of [[indian-tribe]] also include Alaska Native
  regional and village corporations [@usc-25-5304, (e)].
usage_note: >-
  Use the village's own name. Keep villages distinct from the regional and
  village corporations established under the Alaska Native Claims Settlement
  Act [@usc-25-5304, (e)] unless a statute groups them (our analysis).
aliases: [Alaska Native villages]
see_also: [native-nations, indian-tribe]
sources: [ncai-tribal-nations-and-the-united-states, usc-25-5304]
basis: source-and-project-analysis
status: draft
