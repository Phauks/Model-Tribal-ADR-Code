id: american-indian
term: American Indian
kind: term
part_of_speech: noun
usage: context-only
definition: >-
  A collective term used in many federal laws, agencies and organizations'
  names. The Smithsonian's guide calls American Indian, Indian, Native
  American and Native "acceptable and often used interchangeably in the United
  States" [@nmai-impact-of-words], while the Native Governance Center "does not
  recommend that non-Native folks use the terms American Indian or Indian"
  [@ngc-how-to-talk-about-native-nations, p. 4].
law_dictionary:
  - source: blacks-law-dictionary-2024-indian
    quote: 'Someone descended from the indigenous peoples of the Americas'
usage_note: >-
  Our authors are not all Native, so use it only in names, legal
  terms and quotations, or when a person or nation asks for it
  [@ngc-terminology-style-guide]. Otherwise write [[native-american]] or name
  the nation.
aliases: [American Indians]
use_instead: [native-american, native-nations]
see_also: [indian]
sources: [nmai-impact-of-words, ngc-how-to-talk-about-native-nations, ngc-terminology-style-guide]
basis: source-and-project-analysis
status: draft
