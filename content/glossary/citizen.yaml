id: citizen
term: citizen
kind: term
part_of_speech: noun
usage: preferred
definition: >-
  A person who belongs to a Native nation under its own law. Reporting guides
  ask "How is tribal citizenship determined?" and speak of "tribally enrolled
  citizens" [@naja-tribal-nations-media-guide].
usage_note: >-
  Default to citizen; use member, enrolled member or another word when the
  nation's own law uses it or when quoting a statute such as 25 U.S.C.
  § 5304(d) (our choice). Membership rules belong to each nation; describe
  them, do not judge them (charter, commitment 2).
aliases: [citizens, Tribal citizen, Tribal citizens, citizenship]
see_also: [indian]
sources: [naja-tribal-nations-media-guide, usc-25-5304]
basis: source-and-project-analysis
status: draft
