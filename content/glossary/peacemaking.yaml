id: peacemaking
term: peacemaking
kind: term
part_of_speech: noun
usage: preferred
definition: >-
  Traditional ways of resolving conflict in Indigenous communities. The
  Native American Rights Fund's Indigenous Peacemaking Initiative states that
  "peacemaking is not alternative dispute resolution" and that the term
  "refers to traditional ways of resolving conflict in Indigenous communities"
  [@narf-ipi-home].
usage_note: >-
  Treat peacemaking as its own track, never as a kind of [[adr]] (charter,
  commitment 3). Use each nation's own name for its process where it has one.
see_also: [adr, tribal-court]
sources: [narf-ipi-home]
basis: source
status: draft
