id: adr
term: ADR
kind: acronym
expansion: alternative dispute resolution
usage: preferred
definition: >-
  Processes for resolving disputes outside a full court trial, such as
  negotiation, mediation and arbitration. In this book the term does not
  include [[peacemaking]], which this work treats as its own track
  [@narf-ipi-home].
law_dictionary:
  - source: blacks-law-dictionary-2024-alternative-dispute-resolution
    quote: 'Any procedure for settling a dispute by means other than litigation, as by arbitration or mediation'
usage_note: >-
  Write the expansion on first use in each chapter; the build does this
  automatically for the first [[adr]] link. Do not call traditional
  peacemaking a form of ADR.
aliases: [ADR]
see_also: [peacemaking]
sources: [narf-ipi-home]
basis: source-and-project-analysis
status: draft
