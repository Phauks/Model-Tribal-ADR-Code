id: reservation
term: reservation
kind: term
part_of_speech: noun
usage: acceptable
definition: >-
  "A Native nation's current land base as defined by the federal government"
  [@ngc-terminology-style-guide].
law_dictionary:
  - source: blacks-law-dictionary-2024-indian-reservation
    quote: 'An area that the federal government has designated for use by an American Indian tribe'
usage_note: >-
  "A reservation is not the same thing as a Native nation"
  [@ngc-terminology-style-guide]; do not conflate the two
  [@ngc-how-to-talk-about-native-nations, p. 3]. Lowercase unless part of a
  reservation's name [@ngc-terminology-style-guide].
aliases: [reservations]
see_also: [native-nations, indian-country]
sources: [ngc-terminology-style-guide, ngc-how-to-talk-about-native-nations]
basis: source
status: draft
