id: nation
term: nation
kind: term
usage: acceptable
definition: >-
  Short form of [[native-nations|Native nation]], used once the reader knows a
  Native nation is meant [@ngc-terminology-style-guide].
usage_note: >-
  Lowercase unless part of a nation's own name, as in Navajo Nation
  [@ngc-terminology-style-guide]. Do not combine with "Tribe" in one name
  (for example, not "Red Lake Nation Tribe")
  [@ngc-how-to-talk-about-native-nations, p. 3].
see_also: [native-nations]
sources: [ngc-terminology-style-guide, ngc-how-to-talk-about-native-nations]
basis: source
status: draft
