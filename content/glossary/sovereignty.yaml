id: sovereignty
term: sovereignty
kind: term
part_of_speech: noun
usage: preferred
definition: >-
  A nation's authority to govern itself. "Sovereignty is a legal word for an
  ordinary concept," and Tribal nations "retain their inherent powers of
  self-government" [@ncai-tribal-nations-and-the-united-states, p. 16].
law_dictionary:
  - source: blacks-law-dictionary-2024-sovereignty
    quote: 'Supreme dominion, authority, or rule'
  - source: blacks-law-dictionary-2024-indian-sovereignty-doctrine
    quote: 'Indian tribes are domestic dependent nations exercising inherent sovereignty over their members and territories'
usage_note: >-
  Lowercase, as are self-determination and self-governance
  [@ngc-terminology-style-guide]. Write that nations retain inherent
  sovereignty; do not write that the United States grants it (our analysis
  based on the NCAI wording above).
see_also: [native-nations, federally-recognized-tribe]
sources: [ncai-tribal-nations-and-the-united-states, ngc-terminology-style-guide]
basis: source-and-project-analysis
status: draft
