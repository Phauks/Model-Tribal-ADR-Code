id: tribal-court
term: Tribal court
kind: term
part_of_speech: noun
usage: preferred
definition: >-
  A court established under a Native nation's own law. Use the court's own
  name where there is one (our definition).
law_dictionary:
  - source: blacks-law-dictionary-2024-tribal-court
    quote: 'not part of any state''s judicial system, instead operating more or less as a judicial system of a foreign nation'
usage_note: >-
  Capitalize Tribal (see [[tribal]]). Some nations' justice systems include
  forums that are not called courts, such as peacemaking; describe them in
  their own terms (see [[peacemaking]]).
aliases: [Tribal courts, tribal court, tribal courts]
see_also: [tribal, peacemaking]
basis: project-analysis
status: draft
