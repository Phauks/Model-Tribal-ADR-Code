id: tribal-nations
term: Tribal nations
kind: term
part_of_speech: noun
usage: acceptable
definition: >-
  A common synonym for [[native-nations]]. The National Congress of American
  Indians describes Tribal nations as "part of the unique American family of
  governments, nations within a nation"
  [@ncai-tribal-nations-and-the-united-states, p. 6].
usage_note: >-
  Acceptable, especially when quoting or naming organizations that use it;
  our default remains [[native-nations]].
aliases: [tribal nations, Tribal nation, tribal nation]
see_also: [native-nations, tribe]
sources: [ncai-tribal-nations-and-the-united-states, ngc-terminology-style-guide]
basis: source-and-project-analysis
status: draft
