id: native-hawaiian
term: Native Hawaiian
kind: term
part_of_speech: noun
usage: preferred
definition: >-
  The Indigenous people of Hawaiʻi, named among the Native peoples of the
  United States [@ncai-tribal-nations-and-the-united-states, p. 9]
  [@nmai-impact-of-words].
usage_note: >-
  Spell Hawaiʻi with the ʻokina (our choice). The charter's scope includes
  Hawaiʻi; describe Native Hawaiian institutions in their own terms rather
  than as a Tribe (our analysis).
aliases: [Native Hawaiians]
see_also: [native, native-nations]
sources: [ncai-tribal-nations-and-the-united-states, nmai-impact-of-words]
basis: source-and-project-analysis
status: draft
