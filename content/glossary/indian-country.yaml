id: indian-country
term: Indian country
kind: legal-term
part_of_speech: noun
usage: context-only
definition: >-
  In federal criminal law, Indian country includes "all land within the
  limits of any Indian reservation under the jurisdiction of the United States
  Government," "all dependent Indian communities within the borders of the
  United States," and "all Indian allotments, the Indian titles to which have
  not been extinguished" [@usc-18-1151, (a)-(c)]. It "is a defined legal term
  for that area over which the federal government and tribes exercise primary
  jurisdiction" [@ncai-tribal-nations-and-the-united-states, p. 24].
other_senses:
  - label: often capitalized
    definition: >-
      Native communities as a whole, the broader sense in which the Native Governance Center writes "Indian Country" [@ngc-terminology-style-guide].
usage_note: >-
  For the legal term (sense 1), write lowercase "Indian country" as the statute does and cite the section. Write "Indian Country" only in sense 2 (our choice).
aliases: [Indian Country]
use_instead: [native-nations]
see_also: [reservation]
sources: [usc-18-1151, ncai-tribal-nations-and-the-united-states, ngc-terminology-style-guide]
basis: source-and-project-analysis
status: draft
