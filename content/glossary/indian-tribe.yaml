id: indian-tribe
term: Indian tribe
kind: legal-term
part_of_speech: noun
usage: context-only
definition: >-
  A statutory term whose meaning depends on the statute. Under the Federally
  Recognized Indian Tribe List Act it means "any Indian or Alaska Native tribe,
  band, nation, pueblo, village or community that the Secretary of the
  Interior acknowledges to exist as an Indian tribe" [@usc-25-5130, (2)]. In
  the Indian Self-Determination and Education Assistance Act chapter it also
  includes "any Alaska Native village or regional or village corporation"
  [@usc-25-5304, (e)].
usage_note: >-
  Always say which statute's definition applies; they differ (our
  analysis). In our own voice, write [[native-nations|Native nation]]
  or [[federally-recognized-tribe]].
use_instead: [native-nations, federally-recognized-tribe]
see_also: [tribe, alaska-native-village]
sources: [usc-25-5130, usc-25-5304]
basis: source-and-project-analysis
status: draft
