id: native-american
term: Native American
kind: term
usage: acceptable
definition: >-
  Collective term for Indigenous people of the United States. For "groups of
  people from multiple nations, use Native American, Native, or Indigenous"
  [@ngc-how-to-talk-about-native-nations, p. 4].
usage_note: >-
  Use for people from several nations. For one person or nation, use the
  specific nation instead [@ngc-how-to-talk-about-native-nations, p. 4]:
  "the best term is always what an individual person or community uses to
  describe themselves" [@nmai-impact-of-words]. Do not hyphenate.
aliases: [Native Americans]
see_also: [native, indigenous, american-indian]
sources: [ngc-how-to-talk-about-native-nations, nmai-impact-of-words]
basis: source
status: draft
