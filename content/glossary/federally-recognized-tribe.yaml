id: federally-recognized-tribe
term: federally recognized tribe
kind: legal-term
part_of_speech: noun
usage: acceptable
definition: >-
  "An American Indian or Alaska Native tribal entity that is recognized as
  having a government-to-government relationship" with the United States
  [@bia-what-is-a-federally-recognized-tribe]. Such tribes "are recognized as
  possessing certain inherent rights of self-government"
  [@bia-what-is-a-federally-recognized-tribe]. Recognition means "United
  States' acknowledgement of a tribe's political status as a government"
  [@ncai-tribal-nations-and-the-united-states, p. 23].
usage_note: >-
  Use when federal status matters to the point being made. The number of
  federally recognized tribes changes; cite the current list published under
  25 U.S.C. § 5131 rather than a figure from a secondary source
  [@usc-25-5130, (3)]. Recognition does not create a nation's sovereignty
  (see [[sovereignty]]).
aliases: [federally recognized tribes, federally recognized Tribe, federally recognized Tribes]
see_also: [state-recognized-tribe, indian-tribe, native-nations]
sources: [bia-what-is-a-federally-recognized-tribe, ncai-tribal-nations-and-the-united-states, usc-25-5130]
basis: source
status: draft
