id: tribal
term: Tribal
kind: term
part_of_speech: adjective
usage: acceptable
definition: >-
  Adjective for the institutions and law of a Native nation, as in Tribal
  court, Tribal law and Tribal council.
usage_note: >-
  Capitalize in the project's own voice, "regardless of whether" it is part of
  a proper noun [@ngc-terminology-style-guide]. Keep lowercase "tribal" inside
  quotations and statutory names.
aliases: [tribal]
see_also: [tribe, tribal-court]
sources: [ngc-terminology-style-guide]
basis: source-and-project-analysis
status: draft
