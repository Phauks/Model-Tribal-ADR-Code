id: indian
term: Indian
kind: legal-term
part_of_speech: noun
usage: context-only
definition: >-
  A term in federal statutes, each of which defines it for its own purposes.
  For example, in the Indian Self-Determination and Education Assistance Act
  chapter, "Indian" means "a person who is a member of an Indian tribe"
  [@usc-25-5304, (d)].
usage_note: >-
  Use only in legal terms (Indian country, Indian tribe), names and
  quotations, and name the statute whose definition applies. Not for the
  project's own descriptions of people [@ngc-how-to-talk-about-native-nations, p. 4].
use_instead: [native-american, native-nations]
see_also: [american-indian, indian-tribe, indian-country]
sources: [usc-25-5304, ngc-how-to-talk-about-native-nations]
basis: source-and-project-analysis
status: draft
