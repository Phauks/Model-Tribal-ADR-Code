id: first-nations
term: First Nations
kind: term
part_of_speech: noun
usage: context-only
definition: >-
  A term used in Canada: "In Canada, people refer to themselves as First
  Nations, First Peoples, or Aboriginal" [@nmai-impact-of-words].
usage_note: >-
  Use only for nations in Canada, which this edition does not cover (charter,
  commitment 11). For the United States, write [[native-nations]].
use_instead: [native-nations]
see_also: [indigenous]
sources: [nmai-impact-of-words]
basis: source-and-project-analysis
status: draft
