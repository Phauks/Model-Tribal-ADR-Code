  transcribed_from: The text of the Tribe’s PDF of the code, adopted July 2024, as posted on kake-nsn.gov.
  paragraphs:
  - The Organized Village of Kake (OVK) Tribal Council of Keex' Kwaan (Kake, Alaska) is the governing body of a federally recognized tribe, and hereby establishes the Keex' Kwaan Peacemaking Court in which the Tribe's judicial powers shall be vested. The council does so under its inherent sovereignty, under Article V of the Constitution and By-Laws of the Organized Village of Kake IRA, and under any powers so implied or delegated by Congress.
  - The Keex' Kwaan Peacemaking Court System shall consist of a Standing Peacemaking Court, a Circle Court, a Community Court, a Court of Appeals, and such other Courts as the Keex' Kwaan OVK Council may establish. The Keex' Kwaan Peacemaking Court's purpose is to protect the health, safety, and welfare of the Keex' Kwaan people.
  - The courts shall address problems through a fair and consistent application of written laws and Keex' Kwaan's cultural values and traditions. Keex' Kwaan's core tribal values, passed on today orally (unwritten) are the "laws of the land" that have held our association of clans together for thousands of years to form Keex' Kwaan. Yesterday our ancestors formed the sacred clan of Guwakaan, the Deer People. They used this clan as the process of Peacemaking and processing disputes. No moiety of the Eagle or Raven claims this animal as their clan symbol, because no one can own the process of Peacemaking. Today we begin to write down a living document that will grow with us and be amended by Keex' Kwaan to meet the needs of the Tribe.
