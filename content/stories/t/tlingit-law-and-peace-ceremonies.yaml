id: tlingit-law-and-peace-ceremonies
title: Tlingit law and the peace ceremonies that ended conflicts
nations:
- central-council-of-the-tlingit-and-haida-indian-tribes
kind: historical-account
length: book
summary: 'Sealaska Heritage Institute''s accounts of Tlingit law: the clan, not the individual, answers for a wrong;
  compensation is owed for injury or death; and peace ceremonies ended conflicts and restored balance. The Institute
  also describes clashes when Tlingit followed their own law in the nineteenth century.'
methods:
- customary-dispute-resolution
topics:
- tlingit-law
- peace-ceremonies
- compensation
- clans
