  transcribed_from: The text of Sealaska Heritage Institute’s web page as published, read on November 23, 2026. Headings, links, buttons and photo captions are left out.
  paragraphs:
  - 'Tlingit Law, American Injustice, and the Destruction of Tlingit Villages: The Tlingit had a highly developed system of law. Tlingit law is based on a group orientation, rather than the individualistic system in American law. The entire clan is responsible for any wrong-doing committed by any individual clan member. When laws were broken, and if conflicts were not resolved to restore peace, the consequence would be violence as clans protected their claims to property and demanded compensation for insults, injuries or worse. The death of a clan member, purposeful or accidental, required the offending clan to offer the life of an individual of equal status, or payment in goods in an amount acceptable to the injured clan. If the death was caused by a non-Native, the clan would seek a payment of restitution and in some cases would take the life of a non-Native as compensation. Such actions were considered legal under Tlingit law. Bombardments of the Tlingit villages of Kake, Angoon, and Wrangell resulted from such differences in legal systems. Written by SHI President Dr. Rosita Worl, an anthropologist, who is Tlingit of the Shangukeidí clan. Published by Sealaska Heritage in 2020.'
  notes:
