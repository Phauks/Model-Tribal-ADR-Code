summary: 'The Onondaga Nation''s account of the agreement the Haudenosaunee and the Dutch reached after long discussion:
  a path of peace in which each people travels in its own vessel side by side down the river, neither steering the
  other''s, recorded in the Two Row Wampum belt. It is a nation''s own account of settling how two peoples would
  live together.'
