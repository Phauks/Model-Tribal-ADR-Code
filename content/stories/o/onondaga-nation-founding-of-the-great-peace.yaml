excerpts:
- telling: onondaga-history-page
  locator: opening of the account
  text: The people of the five nations had forgotten their original ways and their actions saddened the Creator.
    The Creator decided to send a messenger to the people so that the five nations could live in peace.
  words: 36
  sha256: 475ab4691c3dd3379d2dea1366fb5421f57163bca51c63c9ffa494e6149c57e8
- telling: haudenosaunee-confederacy-page
  locator: paragraph beginning "Asking the Clan Mothers"
  text: He directed the Chiefs of the council to sit beneath the shade of the tree and watch the council fire of
    the confederacy of the five nations. He told them that all issues concerning the confederacy would be discussed
    and deliberated under this tree.
  words: 44
  sha256: 0cb6f6c868d67a7375b204ca95095a37d492b564ec79a86c8681d50458d5639e
- telling: haudenosaunee-confederacy-page
  locator: paragraph beginning "Above the tree an eagle"
  text: Beneath the tree the Peacemaker asked that all men throw in their weapons to bury any greed, hatred and
    jealousy.
  words: 20
  sha256: 3882f4c3b286a883aa8f2da1fc8d30f63e7090606f21ff61c1882bf3a7b4d327
