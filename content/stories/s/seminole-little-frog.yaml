  transcribed_from: The text of the Nation’s web page as published, read on November 23, 2026. Headings, links, buttons and photo captions are left out.
  paragraphs:
  - '"This story was told to me by my grandmother when I was just a baby. Where we lived, the sounds in the woods were very important to us. We were always asking, "What is that sound from?" A lot of times we were answered with a story such as this one." The little green frog was sitting on the edge of the water lilies sleeping away. A big ol'' rabbit came hopping along, came upon the frog and said, "Hi there! Why are you sleeping? It''s too pretty a day to sleep. Wake up! Wake up!"'
  - '"I don''t have to do anything," said the irritated little frog. But that pretty ol'' pesky rabbit kept on until the little frog got really mad and told him, "I''ll fix you up."'
  - So little frog started singing his funny little song or noise he makes to call the rain. Within a few minutes, the black cloud came and the wind started blowing. Then the rains came and soaked the ol' rabbit so much he got cold and ran home.
  - Whenever you hear the frogs singing away today, better be near shelter, because they are warning you that rain is coming soon.
