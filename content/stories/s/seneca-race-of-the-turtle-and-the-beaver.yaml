notes: Turtle and Beaver both claim the same water and agree to settle it by a race. The Oneida Indian Nation's
  My Home (record oneida-indian-nation-my-home-turtle-and-beaver) is a Turtle and Beaver story too, ending instead
  in persuasion; the two have not been compared beyond that.
