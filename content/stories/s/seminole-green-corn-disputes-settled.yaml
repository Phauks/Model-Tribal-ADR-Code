  paragraphs:
  - Few non-Indians have witnessed a Green Corn Dance, a special spiritual event held at undisclosed South Florida locations each spring. Most Native Americans have a similar event within their cultures, stemming from traditional expressions of gratitude to the Creator for providing food. At the Green Corn Dance, Seminoles participate in purification and manhood ceremonies. Tribal disputes are also settled during this time. Men and women separate into different "camps" according to their clans. In earlier times, the Green Corn Dance marked an important occassion when Seminoles from different camps and areas would get together.
