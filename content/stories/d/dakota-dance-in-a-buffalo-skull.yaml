notes: The printing reads “kinš, kinš”; the etext’s “king, king” is not followed. Zitkala-Ša heard her legends from storytellers across both Dakotas, so the story may belong to more Dakota nations than the Yankton Sioux Tribe; ask before treating it as one nation’s alone.
