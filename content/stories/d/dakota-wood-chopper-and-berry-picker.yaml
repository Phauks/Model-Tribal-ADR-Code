  transcribed_from: Built from Project Gutenberg ebook 28099 (the 1909 edition) and checked word for word against two scans of this edition, printed in 1910 and 1912 (Internet Archive). A word was kept only where at least one scan reads the same; every other difference was read on the page images, and where the 1909 etext differs from this edition, this edition is followed. Headings, illustrations and their captions are left out; the story’s title, printed as a heading between Smoky Day’s opening words and the story, is the record’s title. The moral at the end, printed in italics, is given in ordinary type. Spaces the typesetter put before punctuation are dropped.
  paragraphs:
  - “A long time ago,” says the old story-teller, “man was nearer the animal people than he is today; they even spoke the same language and seemed to understand one another perfectly. Sometimes he loved and married among them, but his children were not so good and noble as the first man. There was something of the animal in them.
  - “There are many stories of this sort, but some of them are long and hard to understand. Perhaps you have heard of Tidoona and Tankadoona, the Indoor One and the Outdoor One, in which the little boy is half-brother to a Bear cub and they meet and play together in secret. To-night, however, I will tell you another story.”
  - In the old days, when men and animals spoke one language, a young man who had grown tired of living alone set out to look for a wife. He had not travelled far when he came to a stream of clear water which had been dammed to make a small, round pond. On the shore of the pond was a neat, dome-shaped lodge, and just outside the lodge a pretty woman was busily chopping wood.
  - The young man stood for some time watching her from behind a tree. Being pleased with her looks and especially with her industry, he presently showed himself, and the girl, whose name was Beaver-woman, received him so kindly that in a short time they had decided to marry and go to house-keeping.
  - When their little boy came, the proud father wished to take him back and show him to his own people, but to this his wife would not consent.
  - “If you must return,” said she, “very well; but we cannot go with you!”
  - So the young man, who had a great longing to see again the faces of his kinsfolk, left them behind and journeyed to his father’s village. He made them a short visit, and then hastened back to his own home.
  - Alas, there was no home there! The lodge was destroyed, the dam broken, the pond itself gone, the singing brook was only a thin trickle of water, and his wife and son were nowhere to be found!
  - The unhappy young man lay upon the ground, mourning for his lost wife and little boy, until a handsome young woman dressed all in black came out of the woods. She supposed that he must be faint for want of food, so she brought him sweet roots and berries. When he had eaten, she kindly combed his hair and washed his face, and after he was refreshed, she comforted him with loving words and caresses, so that he soon forgot the Beaver-woman and took her to be his wife.
  - 'Together they went to look for a home. The young man chose a beautiful open spot overlooking much country, but his wife, whose name was Berry-Picker, laughed at him, saying:'
  - “Our people never live in such an open place as that!”
  - She chose a sheltered spot at the foot of the hill, and there they began to hollow out a comfortable dwelling under the upturned roots of an old fallen tree.
  - 'When Berry-Picker, the Bear wife, sent her husband out to look for bedding, he brought in much dry grass; but the Bear wife reproved him, saying:'
  - “Why, husband! you expose our home to the eyes of all!”
  - All about their lodge were bare spots where he had pulled the grass, so they had to find a new place in which to live.
  - At last the pair were snug and warm for the winter, and as it was now time to go to sleep, they did so, and slept until they were aroused by the barking of a Dog and the footsteps of a hunter on the crisp snow.
  - The Bear wife struck the roof of her house, and a Partridge flew up out of the snow with a great whirring of wings. The Dog followed the Partridge and the hunter followed the Dog.
  - When the hunter came for the second time, she started a Rabbit, which drew the Dog away, and he drew away the hunter.
  - But when he persisted, and came back for the third time, she left her home and ran for her life, leaving her husband to follow as best he could.
  - He ran on and on, following his wife’s tracks in the deep snow, until he came to a little hut where lived an old Bear.
  - “Where are you going, my son?” inquired the old man.
  - “Oh,” he replied, “I am only travelling for pleasure!”
  - “Do not try to deceive me,” said the old Bear. “I know well whom you seek! Berry-Picker passed this way only yesterday, on her way to rejoin her people.”
  - “And where do her people live?” asked the young husband.
  - “They live not far away, my son; but be on your guard; they are a deceitful people and will give you much trouble!”
  - 'Thanking the old man, he hurried on, and soon came to the village of the Bears. It was a large village, and the people seemed to have plenty to eat and to be very merry, for they were singing and dancing. As the stranger drew near, every young woman in the great camp came running to meet him. They all looked alike, for every one was dressed in glossy black and all were plump and handsome, and they all crowded about him as if to embrace him, crying:'
  - “Welcome home, my husband!”
  - Now the young man became very angry, for he knew that the Bears were trying to deceive him, and that if he did not know his own wife, they would take his life. He took no notice of any of the young women, but turned his back on the village and went home to his own country.
  - This story is told for a warning to those who wish to marry among strangers.
