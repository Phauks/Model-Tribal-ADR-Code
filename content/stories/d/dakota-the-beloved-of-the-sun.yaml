  transcribed_from: Built from Project Gutenberg ebook 28099 (the 1909 edition) and checked word for word against two scans of this edition, printed in 1910 and 1912 (Internet Archive). A word was kept only where at least one scan reads the same; every other difference was read on the page images, and where the 1909 etext differs from this edition, this edition is followed. Headings, illustrations and their captions are left out; the story’s title, printed as a heading between Smoky Day’s opening words and the story, is the record’s title. The moral at the end, printed in italics, is given in ordinary type. Spaces the typesetter put before punctuation are dropped.
  paragraphs:
  - “Grandfather, is not the night beautiful after the long storm?” whispers Tanagela shyly. “The moon always seems to me like a beautiful woman, for she often hides her round, shining face with a blanket of cloud, and sometimes she even runs away from us altogether, as if she were tired or displeased. But to-night she smiles and uncovers her face, so that all the young men are out, each playing upon his flute near the home of the loved one!”
  - 'The little maid does not often make so long a speech, and she too hides her face as she comes to the end. But Grandfather smiles indulgently upon his favorite, as he answers:'
  - “And did you not know, then, that she is a woman, my granddaughter? Truly it is time that I told you of these things!”
  - There was once a man and his wife and two children who had gone away from the rest of the tribe and were living by themselves. One day the man went out hunting as usual, but evening came and he did not return. The next day his wife went to look for him, and neither did she come back to the lodge.
  - Thus it came about that the young brother and sister were left alone, but they were not unhappy. The boy was a strong and well-grown lad, and he brought home abundance of meat, while the girl cooked his food, tanned the skins and made all of their moccasins and clothing.
  - They had been living thus for many moons, when very early one morning, soon after her brother had left her for the hunt, the girl’s eyes were dazzled by a sudden flash of light, and at the same instant a tall and beautiful young man entered the lodge. She thought at first that her brother had come back, so great was the likeness; but he did not act like him, for his manner was that of a suitor. He remained for some time, but left before the brother returned.
  - Now the young man saw at once that his sister seemed to be troubled and embarrassed about something. He questioned her, and she hung her head in silence. Three times this happened, and on the third day she told him all.
  - “To-morrow,” said he, “I will set out as usual early in the morning, but I shall not go far. If your visitor comes, keep him until I return.”
  - Accordingly the next day the brother went a little way from home and hid himself in a hollow tree from which he could watch their dwelling. Soon after the girl’s lover appeared, he returned to the lodge and at once fell upon the stranger, for he was very angry.
  - 'For some time they wrestled together in silence, and neither was able to gain the mastery over the other. Finally, however, the brother felt that he was being overcome, and he cried out:'
  - “Sister, help, help!”
  - 'The girl did not know what to do, but she seized her axe and was about to strike one of the young men when he cried out:'
  - “Take care, sister!”
  - 'Then she raised her axe against the other, but he too exclaimed: “Take care, sister!”'
  - She became more and more bewildered, for the two looked so much alike that it was impossible to tell which one was really her brother.
  - 'At last, however, she made up her mind to strike at the stranger, but like a flash of light he eluded her and spoke:'
  - “My friend, do not try to resist me any longer! I came not to harm you or this maiden, but to make her my wife! Know that I am the Sun, and she shall be the Moon and rule over the night if she will come with me!”
  - “Upon this the maiden yielded and went with him,” said Grandfather; “but you see that she will not shine every night, for she was only a mortal maiden and is soon wearied. You know we call the Sun our Grandfather and the Moon Grandmother, and we also believe that the Stars are their children. Some time I shall tell you how a Star, too, loved an earthly maid.”
