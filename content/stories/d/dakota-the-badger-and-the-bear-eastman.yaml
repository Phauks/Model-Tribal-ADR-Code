notes: The same story as Zitkala-Ša’s “The Badger and the Bear” (record dakota-the-badger-and-the-bear), in a different telling. Charles A. Eastman (Ohiyesa) was Santee Dakota (Wahpeton and Mdewakanton); his father settled at Flandreau, but the stories are told across the Dakota, Lakota and Nakota nations, so ask before treating one as a single nation’s alone. Elaine Goodale Eastman, his co-author, was not Native, and her preface says the stories were adapted for children.
