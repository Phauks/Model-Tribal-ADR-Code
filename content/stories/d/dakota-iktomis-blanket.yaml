notes: The story tells of a gift offered in prayer to Inyan, the great stone, and taken back. Zitkala-Ša heard her legends from storytellers across both Dakotas, so the story may belong to more Dakota nations than the Yankton Sioux Tribe; ask before treating it as one nation’s alone.
