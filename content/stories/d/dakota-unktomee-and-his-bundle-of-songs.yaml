  transcribed_from: Built from Project Gutenberg ebook 28099 (the 1909 edition) and checked word for word against two scans of this edition, printed in 1910 and 1912 (Internet Archive). A word was kept only where at least one scan reads the same; every other difference was read on the page images, and where the 1909 etext differs from this edition, this edition is followed. Headings, illustrations and their captions are left out; the story’s title, printed as a heading between Smoky Day’s opening words and the story, is the record’s title. The moral at the end, printed in italics, is given in ordinary type. Spaces the typesetter put before punctuation are dropped.
  paragraphs:
  - “Now, my grandchildren,” says Smoky Day, “I shall tell you of one who is well known in the wonder-world of our people. He is a great traveller, seems to know everybody, and is always good-natured, but he is also a shameless boaster and plays many tricks upon those he meets on the road. No one is so wise and cunning as Unktomee, the Spider; and yet he likes to appear as simple and innocent as a child!
  - “His adventures are many. Sometimes he gets the better of the animal people, and again they may succeed in outwitting him, so that he is well laughed at for his trouble! We may all learn from these stories of Unktomee and his sly tricks how to be on our guard against those deceitful ones who come to us in the guise of friends.”
  - It was a bright, sunshiny day, and the flocks of Ducks flying northward had all stopped to rest beside a little lake, and were splashing and paddling about in the cool water. They were happy and very noisy, but suddenly they ceased their cries and calls and became quite silent, for a queer figure was seen coming toward them along the curve of the beach. It was the figure of a strange little old man, bent nearly double under a huge load of something that looked like dry grass.
  - “Quack, quack!” said one of the boldest of the Ducks, as the old man drew near with his burden. “What have you there?”
  - “Oh, that is only a bundle of old songs,” replied Unktomee with a smile; for it was that sly one, that maker of mischief!
  - 'Thereupon the Ducks took courage, and quacked and fluttered all about him, crying:'
  - “Sing us an old song, Unktomee!”
  - Willingly Unktomee threw down his load upon the lake shore, and with the utmost good nature began to build a little teepee of sticks, thatching it with the dry grass. In a few minutes it was done, and he kindly invited the ducks to enter.
  - With rustling wings and shining feathers they crowded into the little teepee until it could hold no more.
  - 'Unktomee was there, too. He stayed by the door, and began to sing:'
  - “Ishtogmus wachee po! Tuwa etowan kin Ishtah ne sha kta!
  - (Dance with your eyes shut! Whoever looks shall have red eyes!)”
  - Every one of the foolish Ducks shut his eyes tight, and Unktomee, as he sang, quietly seized one after another by the neck as they danced in a ring around the teepee, wrung their necks quickly and cast them behind them. Not one had a chance to squawk, so cleverly was the work done, and there would soon have been none to listen to the old songs!
  - But after a little a small Duck slyly opened his eyes, and saw Unktomee wringing the necks of his friends.
  - “Fly! Fly!” he exclaimed in terror. “He is killing us all!”
  - So all the Ducks that were left alive rose up with a mighty rush of wings and a loud clamor of voices. The grass teepee fell to pieces, and the lucky ones flew away; but lying on the ground beside Unktomee were enough fat Ducks for a fine feast!
  - And the little Duck that peeped forever after had red eyes!
  - '* * * * *'
  - The children liked this story very much, but it was shorter than usual.
  - '“Tell us about the feast!” they cried. “Tell us about the feast of Unktomee!” So old Smoky Day began again:'
  - 'Now Unktomee wished to make a feast. The first thing he did was to stand and cry aloud:'
  - “Chagah aoo po-o-o! (Somebody bring me a kettle!)”
  - He called and called for a long time. At last somebody appeared with the kettle. It was the Fox, who was carrying it in his mouth. Unktomee thanked him carelessly, and after waiting awhile, the Fox went sadly away again.
  - Then Unktomee dressed the Ducks whose necks he had wrung, built a fire, fetched water and put them on to boil. But he was tired as well as hungry, and while his dinner was cooking, he thought he might as well take a nap. So he lay down in the warm sand near by, first telling his Face to be on the watch and to twitch if any one came, so as to awaken him.
  - While Unktomee slept, the Fox returned with a friend. Unktomee’s Face did not twitch as it had been told to do, for the Foxes stroked it very gently, and told it to be quiet. Having done this, they quietly ate every bit of the rich meat, and put the bones back into the pot.
  - When at last Unktomee yawned and awoke, he was very hungry indeed. He looked to see whether his dinner was ready, and found nothing in the kettle except bones!
  - “Ah! the Ducks have boiled too long,” he said to himself. “The meat will all be in the bottom of the pot.”
  - When he discovered that the bones had been picked clean, he was very angry, and scolded his Face severely for not awakening him in time.
  - He who deceives others may himself be caught some day.
