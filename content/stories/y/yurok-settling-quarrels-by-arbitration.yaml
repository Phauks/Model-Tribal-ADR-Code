  - omitted: The paragraph begins earlier with other matters.
    locator: pages 42-43
  - These men doctors help to start and to make the settlements for the white Deer-skin dance, and this is the time when all troubles between individuals, clans and villages are settled, so the whole tribe is in peace. If any of them are not willing to settle their dffficulties they are strictly forbidden to attend the worship, and if they should attend they would loose the respect of the whole tribe, besides they would be dealt with harshly. So in case there be some that cannot make a settlement it is best for them to remain away for this is a time and place where all is free and the best of good cheer and behavior must prevail. The White Deer-skin Dance they hold every two years unless something of a serious nature happens and which sometimes did happen and so crippled the people that they could not hold them for a number of years, such as contagious deseases or other calamities. In years that everything was all right these men doctors would get together about the last of July or the first of August and have a talk and settle the question and give out the announcement that they were going to have the Deer-skin Dance (Oh-pure-ah-wah). The word would be sent out to all the Indians up and down the river, to the Hoopa and Smith river Indians and down the coast as far as Trinidad, and any and all of them of the other tribes could come and see the dance and none of them would ever be molested. Now they would begin to settle all of their quarrels among themselves by paying, this was done by arbitration in most of the cases, as they would select the ones that were friends to both sides of the ones in dispute. They would argue the case and bring them to a settlement if possible, and if they could not make a settlement they could not come to see the dance. This way things would move along and all kinds of sayings would be learned and disputed as those that had no authority would be guessing and often times give out something as coming from some of the head men. All would believe it to be true until it got far enough when the head ones would pronounce it as not authoritive and the false sayings would stop.
  - omitted: The paragraph goes on to the opening of the dance.
