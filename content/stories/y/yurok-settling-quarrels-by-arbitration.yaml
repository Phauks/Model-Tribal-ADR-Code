notes: 'Not a story in the narrower sense: an account of Yurok law by a Yurok author, kept here because it tells
  how the ancestors settled disputes. The passage ties the settlements to the White Deerskin Dance; the project
  quotes nothing about the dance itself or the men doctors'' lodge.'
