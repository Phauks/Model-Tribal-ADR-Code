  transcribed_from: The text of the Tribes’ PDF of the November 2025 newsletter, posted on ctclusi.org. Paragraph breaks follow the printed columns; photo captions are left out, and a word divided across lines (“government-to-government”) is joined.
  paragraphs:
  - On Saturday, October 11, 2025 The Confederated Tribes of Coos, Lower Umpqua and Siuslaw Indians celebrated their 41st Year of Federal Recognition. Thanks to the dedication and hard work of Tribal Citizens and Leadership, the Tribe was once again recognized as a Tribal Sovereign Government with the signing of Public Law 98-481 on October 17, 1984. In addition to celebrating 41 years of restoration, the Tribe took this opportunity to also celebrate 20 years of Peacegiving Court.
  - It is important to note that the federal government terminated its government-to-government relationship with the Tribes in 1954. As Chair Brad Kneaper said, “the fact that we were terminated did not cause us to fade away. On the contrary, our People did not allow this to keep us down. The Tribe maintained a Tribal Government that continues to this day.” We were once again federally recognized pursuant to an Act of Congress – the CTCLUSI Restoration Act of October 17, 1984. The Restoration Act provided for the establishment of our Tribal Constitution. We adopted our Constitution on June 23, 1987, which provided for a tribal court. And on November 13, 2005, a second restoration took place; the restoration of a culturally responsive way to resolve conflict in the community and beyond which embraces and advances the tribal values – the establishment of the Peacegiving Court.
  - Chairman Brad Kneaper welcomed attendees and invited Judge Karen Costello to the stage. Judge Costello gave opening remarks as to the history of Peacegiving Court. “The Peacegiving Court is a voluntary dispute resolution alternative, grounded in the Tribal values of generosity, peace and healing.” A key takeaway she shared was that it was created by the community for the community according to community vision and values.
  - “Peacegivers are Tribal members or spouses of Tribal members who have the respect of the Tribal community and a reputation for honesty, integrity, humanity and a demonstrated practice of resolving local problems by means that honor the tribal values of peace and healing... Peacegivers are officers of the Court and, as such, they have a high duty of care to abide by all applicable laws and rules.”
  - Judge Karen Costello then proceeded to introduce the first judge of our Peacegiving Court, “We cannot celebrate our Peacegivers and our Peacegiving Court without talking about the first Chief Judge of your Tribal Court, my husband, Don Costello. As many of you may know, Don served as your Chief Judge from January 1, 2002 to December 31 of 2009... immediately after becoming your judge, he got to work with the community on developing the Peacegiving Court. Perfect timing. He had spent the prior several years working to develop restorative justice projects in both state and tribal courts. His resume is long and impressive, but, most importantly, he has a heart for fairness and justice and a deep belief in the ability of people to work together in small and grand ways for peace and healing.”
  - Judge Don Costello gave remarks on his time as the Chief Judge and the establishment of the Peacegiving Court. At its creation, Peacegiving Court was a joint effort of our Tribe and members of the Coquille Indian Tribe. Together we determined that the Peacegiving philosophy is the restorative way. Following with the heart of that philosophy, all the Founding Members of the Peacegiving Court were sent special invitation to be honored in a Blanket Ceremony during our 41st Restoration Celebration.
  - In a ceremony, the Founding Peacegivers, or their representatives, were blanketed by CTCLUSI Chief Doug Barrett, Chairman Brad Kneaper and Vice Chair Teresa Spangler. They were each wrapped in the Oregon Potlatch blanket designed by Shirod Yonker (Ko’Kwel) and Tony Johnson (Chinook), it’s symbolism fitting for the occasion as Peacegiving is grounded in generosity and giving.
  - The Founding Peacegivers and current Peacegivers were also gifted with a Four Directions Peacegivers Necklace, designed with the guidance of the Culture and Natural Resources staff and Tribal citizens Amanda Craig and Alycia Cossey. Special thanks to all who helped bead these necklaces created only for Peacegivers; Jeannie Miller, Lorin Krossman, Courtney Krossman, Susan Rodley, Amanda Johnson, Tiffany Rose and Diane Whitson. The Four Directions Peacegiver Necklace symbolism includes; North – represented by the dark blue beads to symbolize – beginning and acknowledgement; East – light blue – vision, clarity, and hope; South – light green – renewal, growth and compassion; and West – dark green, reflection, closure and wisdom. The center piece of abalone and dentalium represent justice and balance while the dentalium throughout the necklace represents movement through the restorative justice process returning to community balance.
  - In addition to recognizing the Founding Peacegivers and Current Peacegivers, New Peacegivers were officially sworn in and given a necklace and lapel pin designating them an Officer of the Court and to honor them for their commitment to restorative justice.
  - Special recognition was then given to Ms. Diane Whitson. Whitson is the longest serving officer of the Tribal Court. To honor her for her 16 years of dedication and service, she was presented with cedar rose hair clips and earrings and was also blanketed by Tribal Council.
  - Tribal Council honored both Judge Karen and Don Costello with a blanket in special recognition of their work. Our hands go up in thanks to them and to all of our Peacegivers.
  - In closing, Tribal Council member Ashley Russell led a song to honor our Peacegivers, the Chief Daloose Jackson dream song that translates to “we will not fall down”. hiisa (thank you).
