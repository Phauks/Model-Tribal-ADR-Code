  - Horned Toad v. Lightning
  - Before humans assumed their present form, the Holy People had their own problems to address. During that time, Lightning and Horned Toad had a dispute. Horned Toad was walking on some land when suddenly Lightning confronted Horned Toad and asserted that he, Lightning, owned the land, and Horned Toad must leave immediately. Horned Toad replied, “My brother, I don’t understand why you should have possession of this land, and I certainly don’t lay claim to it.” He continued along.
  - Again, Lightning asserted his claim, and he threw a bolt of lightning as a warning. Horned Toad said, “I am very humble, and I can’t hurt you as you can hurt others with your bolt of lightning. Could we talk about this tomorrow?”
  - The following day, Horned Toad arrived, wearing his armor. Lightning announced his arrival and asserted his power by throwing more lightning bolts at Horned Toad. Horned Toad said, “You are very powerful; you can certainly strike me down with a bolt of lightning.” “I certainly can,” said Lightning.
  - '“That’s not what we are here about,” said Horned Toad. “We are here to discuss the land ownership issue, and we must talk.” “There is nothing to discuss: the land is mine!” Lightning got angry and threw another bolt of lightning, which hit Horned Toad. “Brother, you did not hurt me,” he said. The bolt bounced off Horned Toad’s armor. “Brother,” he said, “this armor was given to me by the same source as your bolts of lightning. Why is it we are arguing over the land, which was also loaned to us?”'
