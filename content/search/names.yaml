# Names readers search by that the records themselves don't give: acronyms
# and popular names for one law or case, and names for a set of them, such as
# the Marshall Trilogy. The site search (site/src/lib/server/search-index.ts)
# adds each name to what it searches. Every name has a basis: a published
# source that uses the name for exactly these items, with the words that show
# it. Schema: schemas/search-names.schema.json.
#
# An item is a source record key (its page on this site, /laws/<key> or
# /cases/<key>) or a path on this site. Never name a Tribal court opinion
# here: an opinion held back or published with initials must not be found by
# any other name (tests/search-coverage.test.ts checks this).
