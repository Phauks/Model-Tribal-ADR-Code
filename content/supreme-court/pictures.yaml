# The pictures on the Supreme Court pages: one for each Justice and appointing
# President (people.yaml) and one for each Court that has a group photograph
# of its own (courts.yaml); a Court without one shows its Chief Justice.
# Each entry is written by hand from the record of the library, archive or
# museum that holds the original: what it shows, who made it and when, the
# source's number for it, and why it is in the public domain or under an open
# license. Nothing is copied from a copy's description page. The site builds
# each credit line from creator, date, source, source_id and license.
# scripts/law/supreme_court_pictures.py fills media_type, width, height,
# sha256 and key from the downloaded copy. An entry with rotate or crop is
# served as a picture the script turns or cuts from the copy (a print
# photographed on its side, one Justice in a group photograph).
