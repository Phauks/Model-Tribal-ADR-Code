notes: 'Oklahoma Secretary of State file 51630, filed Mar. 1, 2022. The register''s title reads “Agreement Tribal Cross Deputization Law Enforcement Addendum file #41100” and its description “Tribal Resolution No. 020122-A, a Resolution Authorizing the Tribal Marshals Service to Enter into Cross Deputization Agreements”. The register line reads as a filing of another kind. The filed copy is a scan with no text layer; this record''s facts come from the register''s own title and description, read by script and by an AI reader, not from the scan. The date is the filing date, not the signing date. The reader noted: No nation is named; the resolution does not say which tribe adopted it.'
