notes: Oklahoma Secretary of State file 47649, filed July 7, 2015. The register's title reads “Inter-Agency Cooperative Agreement Tribal Cross Deputization - including Governor approval” and its description “Cooperative Agreement between the Police Department of the City of Commerce, OK, a municipality and subdivision of the State of Oklahoma, located in Ottawa County, and the Police Department of The Eastern Shawnee Tribe of Oklahoma, a federally recognized Indian Tribe, located in Ottawa County, Oklahoma”. The register line reads as an agreement or compact. The filed copy is a scan with no text layer; this record's facts come from the register's own title and description, read by script and by an AI reader, not from the scan. The date is the filing date, not the signing date.
