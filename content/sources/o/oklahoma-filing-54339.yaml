notes: 'Oklahoma Secretary of State file 54339, filed Oct. 21, 2026. The register''s title reads “Chickasaw Nation Law Enforcement Commission Agreement” and its description “Keingston Public Schools employs a law enforcement agency, Kingston ISD Police Department to exercise municipal and state criminal law enforcement authority on the campus of KPS, which is within Chickasaw Nation Indian Country”. The register line reads as an agreement or compact. The filed copy is a scan with no text layer; this record''s facts come from the register''s own title and description, read by script and by an AI reader, not from the scan. The date is the filing date, not the signing date. The reader noted: Register text spells the district ''Keingston''; corrected.'
