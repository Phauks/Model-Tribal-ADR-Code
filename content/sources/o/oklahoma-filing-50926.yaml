notes: 'Oklahoma Secretary of State file 50926, filed Mar. 11, 2021. The register''s title reads “Agreement Tribal Cross Deputization Law Enforcement Addendum file #41100” and its description “Addendum, Board of County Commissioners of Adair County agrees to be bound to the foregoing agreement and compact and joins as member of this Compact”. The register line reads as an addendum adding a party to an existing agreement (it names file #41100). The filed copy is a scan with no text layer; this record''s facts come from the register''s own title and description, read by script and by an AI reader, not from the scan. The date is the filing date, not the signing date. The reader noted: No nation is named in the text.'
