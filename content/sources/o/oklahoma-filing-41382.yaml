notes: 'Oklahoma Secretary of State file 41382, filed May 18, 2006. The register''s title reads “Agreement Tribal Cross Deputization Indian Law Enforcement Reform Act Addendum to file # 41100” and its description “Bureau of Indian Affairs & Pawnee Nation of Oklahoma, Pawnee Nation of Oklahoma & the County of Pawnee, Pawnee Nation of Oklahoma & the City of Pawnee addendum to Deputization Agreement filed 1/23/2006, document #63682”. The register line reads as an addendum adding a party to an existing agreement (it names file #41100). The filed copy is a scan with no text layer; this record''s facts come from the register''s own title and description, read by script and by an AI reader, not from the scan. The date is the filing date, not the signing date.'
