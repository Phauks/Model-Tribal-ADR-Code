notes: 'Oklahoma Secretary of State file 50906, filed Mar. 2, 2021. The register''s title reads “Choctaw Nation - council bill rescind CB-92-06 (re: Agreement Tribal Cross Deputization Law Enforcement Addendum file #41100)” and its description “Council Bill to Rescind CB-92-06 and to authorize and approve agreements between the Choctaw Nation of Oklahoma and law enforcement agencies operating with the Choctaw Nation of Oklahoma”. The register line reads as a filing of another kind. The filed copy is a scan with no text layer; this record''s facts come from the register''s own title and description, read by script and by an AI reader, not from the scan. The date is the filing date, not the signing date. The reader noted: A tribal council bill, not a state filing; it concerns the file #41100 deputation agreements.'
