notes: 'Oklahoma Secretary of State file 45400, filed Mar. 29, 2012. The register''s title reads “Agreement Tribal Cross Deputization Law Enforcement Addendum file #41100” and its description “Resolution No. 012480; the Board of County Commissioners of Osage County replaces original agreement effective 2/10/2000 between Osage County, Bureau of Indian Affairs and the Osage Tribal Council/Nation; enters into a new umbrella agreement with all its terms and conditions filed 1/23/2006”. The register line reads as an addendum adding a party to an existing agreement (it names file #41100). The filed copy is a scan with no text layer; this record''s facts come from the register''s own title and description, read by script and by an AI reader, not from the scan. The date is the filing date, not the signing date. The reader noted: text says it replaces a 2000 agreement with the same parties.'
