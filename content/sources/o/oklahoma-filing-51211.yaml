notes: 'Oklahoma Secretary of State file 51211, filed May 28, 2021. The register''s title reads “Agreement Tribal Cross Deputization Law Enforcement Addendum file #41100” and its description “State Addendum, Addition of State Agency to Oklahoma Bureau of Narcotics joins into the Deputation Agreement for Law Enforcement with the Cherokee Nation”. The register line reads as an addendum adding a party to an existing agreement (it names Deputation Agreement for Law Enforcement in the Cherokee Nation). The filed copy is a scan with no text layer; this record''s facts come from the register''s own title and description, read by script and by an AI reader, not from the scan. The date is the filing date, not the signing date.'
