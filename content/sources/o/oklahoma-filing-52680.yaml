notes: Oklahoma Secretary of State file 52680, filed Aug. 14, 2023. The register's title reads “Motor Vehicle Licensing/Registration Compact” and its description “Affirmation and extention of motor vehicle licensing/registration compact between the Cherokee Nation and the State of Oklahoma. Cherokee Nation hereby accepts the State's offer per House Bill 1005 - HB1005, 59th Legislature, 1st Extraordinary Session, 2023”. The register line reads as an extension of an existing compact or agreement (it names Motor Vehicle Licensing/Registration Compact between the Cherokee Nation and the State of Oklahoma). The filed copy is a scan with no text layer; this record's facts come from the register's own title and description, read by script and by an AI reader, not from the scan. The date is the filing date, not the signing date.
