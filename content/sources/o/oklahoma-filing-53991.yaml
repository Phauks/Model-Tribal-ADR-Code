notes: 'Oklahoma Secretary of State file 53991, filed Jan. 20, 2026. The register''s title reads “Agreement Tribal Cross Deputization Addendum to File #41100” and its description “Tribal Addendum, Agreement between the Comanche Nation and the Chairman Forrest Tahdooahnippah, effective Jan.16, 2026”. The register line reads as an addendum adding a party to an existing agreement (it names file #41100). The filed copy is a scan with no text layer; this record''s facts come from the register''s own title and description, read by script and by an AI reader, not from the scan. The date is the filing date, not the signing date. The reader noted: The party named with the Comanche Nation is its chairman, a tribal official, so no non-tribal party is listed.'
