notes: Oklahoma Secretary of State file 53294, filed Aug. 29, 2024. The register's title reads “Chickasaw Nation Law Enforcement Commission Agreement” and its description “Velma-Alma Public Schools (VAPS) authority granted by the State of Oklahoma through the Oklahoma Campus Security Act to exercise municipal and state criminal law enforcement authority on the campus of VAPS, within Chickasaw Nation Indian Country”. The register line reads as an agreement or compact. The filed copy is a scan with no text layer; this record's facts come from the register's own title and description, read by script and by an AI reader, not from the scan. The date is the filing date, not the signing date.
