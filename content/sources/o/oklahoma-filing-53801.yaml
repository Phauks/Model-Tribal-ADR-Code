notes: 'Oklahoma Secretary of State file 53801, filed Aug. 25, 2025. The register''s title reads “Agreement Tribal Cross Deputization Addendum to File #41100” and its description “City Addendum, Addition of City of Hochatown joins into the Deputation Agreement for Law Enforcement in the Choctaw Nation Tribe”. The register line reads as an addendum adding a party to an existing agreement (it names Deputation Agreement for Law Enforcement in the Choctaw Nation). The filed copy is a scan with no text layer; this record''s facts come from the register''s own title and description, read by script and by an AI reader, not from the scan. The date is the filing date, not the signing date.'
