notes: 'Oklahoma Secretary of State file 31425, filed Oct. 10, 1994. The register''s title reads “Agreement Tribal Cross Deputization ICA 93-0019 (original agreement filed-07/08/1992-OKSOS document# 27286)” and its description “Oklahoma Attorney General''s ''Letter of Approval'' of the original Tribal Cross Deputization Agreement between Cherokee Nation/State of Oklahoma/US Government”. The register line reads as an approval of another agreement (it names ICA 93-0019 (original agreement, file #27286)). The filed copy is a scan with no text layer; this record''s facts come from the register''s own title and description, read by script and by an AI reader, not from the scan. The date is the filing date, not the signing date.'
