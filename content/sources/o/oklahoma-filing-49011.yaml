notes: 'Oklahoma Secretary of State file 49011, filed Dec. 19, 2017. The register''s title reads “Cross Deputation Agreement Addendum” and its description “Tribal Addendum Addition of Tribe to Deputation Agreement for Law Enforcement in th Otoe-Missouria Tribe of Indians of Oklahoma”. The register line reads as an addendum adding a party to an existing agreement (it names Deputation Agreement for Law Enforcement in the Otoe-Missouria Tribe). The filed copy is a scan with no text layer; this record''s facts come from the register''s own title and description, read by script and by an AI reader, not from the scan. The date is the filing date, not the signing date. The reader noted: The text does not name the joining tribe separately; the agreement''s tribe is given.'
