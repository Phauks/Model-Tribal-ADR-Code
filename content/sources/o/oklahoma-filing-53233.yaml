notes: Oklahoma Secretary of State file 53233, filed July 16, 2024. The register's title reads “Chickasaw Nation Law Enforcement Commission Agreement” and its description “The Office of the District Attorney for District No. 6 is authorized to employ investigators certified by the Council on Law Enforcement Education and Training ("CLEET") to exercise criminal law enforcement authority, within Chickasaw Nation Indian Country”. The register line reads as an agreement or compact. The filed copy is a scan with no text layer; this record's facts come from the register's own title and description, read by script and by an AI reader, not from the scan. The date is the filing date, not the signing date.
