case_box:
  background: |-
    After *McGirt*, much of eastern Oklahoma, including most of Tulsa, was recognized as Indian country. Castro-Huerta, a non-Indian, lived in Tulsa with his family, including his 5-year-old Cherokee stepdaughter, who has cerebral palsy and is legally blind. Oklahoma convicted him of child neglect after she was found severely malnourished, and he argued that only the federal government could prosecute a non-Indian for a crime against an Indian in Indian country [@oklahoma-v-castro-huerta, pp. 633-634].
  question: |-
    Does the federal government have exclusive jurisdiction to prosecute crimes committed by non-Indians against Indians in Indian country?
  holding: |-
    No. The Court held that the federal government and the State have concurrent jurisdiction over such crimes. It reasoned that Indian country is part of the State and that neither the General Crimes Act, Public Law 280, nor *Bracker* balancing preempts state jurisdiction.
  quotes:
  - text: "Indian country is part of the State, not separate from the State."
    pinpoint: "p. 636"
  - text: "... the Federal Government and the State have concurrent jurisdiction to prosecute crimes committed by non-Indians against Indians in Indian country."
    pinpoint: "p. 633"
  topics:
  - "Criminal jurisdiction"
  reading:
    title: "*Oklahoma v. Castro-Huerta* (2022)"
    text: |-
      Increases state criminal authority in Indian country, making Tribal-state cooperative agreements more important.
