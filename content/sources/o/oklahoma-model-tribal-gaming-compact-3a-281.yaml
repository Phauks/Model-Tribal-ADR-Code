annotation: >-
  Oklahoma's statutory model compact, which a nation accepts to conduct covered class III gaming. Part
  12, as quoted by the Tenth Circuit, provides for arbitration of disputes arising under the compact,
  limits arbitral remedies "to enforcement of the provisions of this Compact," records each party's consent
  and waiver of immunity for those limited purposes, and provides that "either party to the Compact may
  bring an action against the other in a federal district court for the de novo review of any arbitration
  award" (Part 12(2)-(3)). The project's compact records summarize the same template for 36 nations: notice,
  a meeting within 30 days, arbitration under American Arbitration Association rules before one arbitrator,
  and de novo federal review. (project analysis) Because the template is enacted state law, the dispute
  clause is not negotiated nation by nation; Citizen Potawatomi Nation v. Oklahoma held its de novo review
  clause invalid and the arbitration obligation unenforceable.
