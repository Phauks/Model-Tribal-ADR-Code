notes: 'Oklahoma Secretary of State file 53700, filed May 9, 2025. The register''s title reads “Agreement Tribal Cross Deputization Addendum to File #41100” and its description “ADDENDUM, agreement between Muscogee (Creek) Nation and the County of Sapulpa”. The register line reads as an addendum adding a party to an existing agreement (it names file #41100). The filed copy is a scan with no text layer; this record''s facts come from the register''s own title and description, read by script and by an AI reader, not from the scan. The date is the filing date, not the signing date. The reader noted: Register says County of Sapulpa; Sapulpa is a city, so the party may be the city.'
