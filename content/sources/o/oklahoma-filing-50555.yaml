notes: 'Oklahoma Secretary of State file 50555, filed Aug. 25, 2020. The register''s title reads “Agreement Tribal Cross Deputization Law Enforcement Addendum file #41100” and its description “City Addendum - Addition of City to Deputation Agreement for Law Enforcement in the Muscogee Creek Nation and the undersigned City of Tulsa, signed by the Fire Chief”. The register line reads as an addendum adding a party to an existing agreement (it names file #41100). The filed copy is a scan with no text layer; this record''s facts come from the register''s own title and description, read by script and by an AI reader, not from the scan. The date is the filing date, not the signing date.'
