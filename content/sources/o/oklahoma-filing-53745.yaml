notes: 'Oklahoma Secretary of State file 53745, filed June 26, 2025. The register''s title reads “Agreement Tribal Cross Deputization Addendum to File #41100” and its description “Suspension of Addendum, Agreement between the United Keetoowah Band and Owasso Police Department hereby suspended. Effective on April 17, 2025”. The register line reads as a filing of another kind. The filed copy is a scan with no text layer; this record''s facts come from the register''s own title and description, read by script and by an AI reader, not from the scan. The date is the filing date, not the signing date. The reader noted: A suspension, not a termination; no closer category fits.'
