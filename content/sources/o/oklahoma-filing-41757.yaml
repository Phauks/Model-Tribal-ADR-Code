notes: 'Oklahoma Secretary of State file 41757, filed Dec. 13, 2006. The register''s title reads “Agreement Tribal Cross Deputization Law Enforcement Addendum file #41100” and its description “Choctaw Nation, Bureau of Indian Affairs, Atoka County, Bryan County, Choctaw County, Coal County, Haskell County, Hughes County, Latimer County, LeFlore County, McCurtain County, Pittsburg County, Pushmataha County, Sequoyah County, Achille PD, Atoka PD, Antlers PD, Arkoma PD, Bennington PD, Bokchito PD, Bokoshe PD, Boswell PD, Broken Bow PD, Caddo PD, Calera PD, Calvin PD, Caney PD, Coalgate PD, Clayton PD, Durant PD, Ft. Towson PD, Haileyville PD, Hartshorne PD, Haworth PD, Heavner PD, Howe PD, Hugo PD, Idabel PD, Keota PD, Kinta PD, Kiowa PD, Krebs PD, McAlester PD, McCurtain PD, Panama PD, Pocola PD, Poteau PD, Rattan PD, Red Oak PD, Sallisaw PD, Sawyer PD, Spiro PD, Stigler PD, Stringtown PD, Stuart PD, Talihina PD, Tupelo PD, Tushka PD, Valliant PD, Wilburton PD, Wister PD, Wright City PD, District #16 District Attorney''s, District #17 District Attorney''s, District #18 District Attorney''s, District #19 District Attorney''s, Carl Albert Junior College, Eastern Oklahoma State College, Southeastern Oklahoma State University, Oklahoma Department of Wildlife Conservation, Oklahoma State Fire Marshal, Oklahoma Highway Patrol, Cherokee Nation, Chickasaw Nation, Muscogee (Creek) Nation, Seminole Nation, Bureau of Indian Affairs”. The register line reads as an addendum adding a party to an existing agreement (it names file #41100). The filed copy is a scan with no text layer; this record''s facts come from the register''s own title and description, read by script and by an AI reader, not from the scan. The date is the filing date, not the signing date. The reader noted: very long party list in the text; all parties kept.'
