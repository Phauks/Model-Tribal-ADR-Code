notes: 'Oklahoma Secretary of State file 50649, filed Oct. 19, 2020. The register''s title reads “Agreement Tribal Cross Deputization Intergovernmental Exhibit C Addendum” and its description “Between the United States, the Muscogee (Creek) Nation, and Political Subdivisions of the State of Oklahoma”. The register line reads as an addendum adding a party to an existing agreement (it names Intergovernmental Exhibit C). The filed copy is a scan with no text layer; this record''s facts come from the register''s own title and description, read by script and by an AI reader, not from the scan. The date is the filing date, not the signing date. The reader noted: The agreement the exhibit belongs to is not named in the text.'
