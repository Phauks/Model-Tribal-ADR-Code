notes: Oklahoma Secretary of State file 53136, filed May 20, 2024. The register's title reads “Joint Committee on State-Tribal Relations” and its description “Approves the Motor Vehicle Registration and License Tag Compact between the State of Oklahoma and the The Choctaw Nation”. The register line reads as an approval of another agreement (it names Motor Vehicle Registration and License Tag Compact between the State of Oklahoma and the Choctaw Nation). The filed copy is a scan with no text layer; this record's facts come from the register's own title and description, read by script and by an AI reader, not from the scan. The date is the filing date, not the signing date.
