case_box:
  background: |-
    By the 1855 Treaty of Point Elliott, the Suquamish ceded land and kept the Port Madison Reservation in Washington. The Suquamish Tribe charged two non-Indian residents of the reservation in its court. Mark Oliphant was arrested during the annual Chief Seattle Days and charged with assaulting a Tribal officer and resisting arrest. Daniel Belgarde was arrested after a high-speed chase on reservation highways that ended when he hit a Tribal police vehicle. Both sought federal habeas corpus [@oliphant-v-suquamish-indian-tribe, pp. 192-194].
  question: |-
    Do Tribal courts have inherent criminal jurisdiction over non-Indians?
  holding: |-
    No. The Court held that, absent authorization by Congress, Native nations lack inherent criminal jurisdiction to try and punish non-Indians, reasoning that such power is inconsistent with their dependent status.
  quotes:
  - text: "Indian tribes do not have inherent jurisdiction to try and to punish non-Indians ..."
    pinpoint: "p. 212"
  - text: "Indian tribes are prohibited from exercising both those powers of autonomous states that are expressly terminated by Congress and those powers \"inconsistent with their status\" ..."
    pinpoint: "p. 208"
  treatment: |-
    Congress partly restored jurisdiction over non-Indians: the Violence Against Women Reauthorization Act of 2013 amended the Indian Civil Rights Act to authorize "special domestic violence criminal jurisdiction" (25 U.S.C. § 1304), as described in *United States v. Bryant* (2016) [@united-states-v-bryant] and recorded in [@violence-against-women-reauthorization-act-2013-title-ix]. The 2022 reauthorization expanded the covered crimes [@violence-against-women-act-reauthorization-act-2022-title-viii].
  topics:
  - "Tribal courts"
  - "Criminal jurisdiction"
  reading:
    title: "*Oliphant v. Suquamish Indian Tribe* (1978)"
    text: |-
      Defines the main limit on Tribal criminal jurisdiction.
