notes: 'Oklahoma Secretary of State file 52556, filed Apr. 25, 2023. The register''s title reads “Agreement Tribal Cross Deputization (original agreement is OKSOS file number 27286 -- OK Attorney General ''Letter of Approval'' added and filed 10/10/1994--SOS document # 31425)” and its description “State Addendum, Addition of Connors State College Deputization Agreement for Law Enforcement in the Cherokee Nation”. The register line reads as an addendum adding a party to an existing agreement (it names Deputation Agreement for Law Enforcement in the Cherokee Nation (OKSOS file number 27286)). The filed copy is a scan with no text layer; this record''s facts come from the register''s own title and description, read by script and by an AI reader, not from the scan. The date is the filing date, not the signing date.'
