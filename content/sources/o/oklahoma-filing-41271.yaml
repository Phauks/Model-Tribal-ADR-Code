notes: 'Oklahoma Secretary of State file 41271, filed Apr. 24, 2006. The register''s title reads “Agreement Tribal Cross Deputization Law Enforcement Addendum file #41100” and its description “Bureau of Indian Affairs & The Chickasaw Nation; The Chickasaw Nation & Jefferson County; The Chickasaw Nation & Johnston County; The Chickasaw Nation & Pontotoc County; The Chickasaw Nation & the City of Stratford; The Chickasaw Nation & the City of Roff; The Chickasaw Nation & the City of Stonewall; The Chickasaw Nation & the City of Wapanucka; The Chickasaw Nation & the City of Allen; The Chickasaw Nation & Pontotoc County DA; addendum to Deputization Agreement filed 1/23/2006, document #63682”. The register line reads as an addendum adding a party to an existing agreement (it names file #41100). The filed copy is a scan with no text layer; this record''s facts come from the register''s own title and description, read by script and by an AI reader, not from the scan. The date is the filing date, not the signing date.'
