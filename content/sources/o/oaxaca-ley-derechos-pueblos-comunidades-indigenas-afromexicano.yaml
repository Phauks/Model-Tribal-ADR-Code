annotation: Recognizes internal normative systems (art. 28) and their validity for preventing and resolving conflicts
  "siempre que no vulneren los derechos humanos"; excluding women is "contraria al respeto a los derechos humanos"
  (art. 29). Community decisions "serán compatibilizadas y convalidadas por las autoridades estatales" (art. 34).
  Community authorities have jurisdiction where both parties are Indigenous; in mixed cases a party may choose the
  forum; detention limits, no torture, written decisions (art. 38). The Sala de Justicia Indígena of the state high
  court assists with enforcement (art. 40) and hears unresolved tequio disputes after conciliation (art. 44).
