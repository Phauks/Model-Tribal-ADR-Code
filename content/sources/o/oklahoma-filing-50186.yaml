notes: 'Oklahoma Secretary of State file 50186, filed Dec. 31, 2019. The register''s title reads “Agreement Tribal Cross Deputization (sos file number 27286) - Addendum” and its description “County Addendum - Addition of Cherokee County to Deputation Agreement for Law Enforcement in the Cherokee Nation - Cherokee Nation and (original agreement 1992 - sos file number 27286)”. The register line reads as an addendum adding a party to an existing agreement (it names file #27286). The filed copy is a scan with no text layer; this record''s facts come from the register''s own title and description, read by script and by an AI reader, not from the scan. The date is the filing date, not the signing date.'
