notes: Oklahoma Secretary of State file 48893, filed Oct. 12, 2017. The register's title reads “Agreement between Quapaw Tribe of Oklahoma and the State of Oklahoma” and its description “First Amendment to Agreement between the Quapaw Tribe of Oklahoma and the State of Oklahoma for Remediation of Contaminated Properties at the Tar Creek Superfund Site”. The register line reads as an amendment or supplement to an existing compact or agreement (it names Tar Creek remediation agreement). The filed copy is a scan with no text layer; this record's facts come from the register's own title and description, read by script and by an AI reader, not from the scan. The date is the filing date, not the signing date.
