notes: 'Oklahoma Secretary of State file 50531, filed Aug. 7, 2020. The register''s title reads “Intergovernmental Agreement between the State of Oklahoma and Each of the Five Tribes Regarding Jurisdiction Over Indian Children Within Each Tribe''s Reservation” and its description “Agreement between Department of Human Services, Oklahoma Office of Juvenile Affairs, and the Chickasaw Nation”. The register line reads as an agreement or compact. The filed copy is a scan with no text layer; this record''s facts come from the register''s own title and description, read by script and by an AI reader, not from the scan. The date is the filing date, not the signing date. The reader noted: The register title covers all five tribes; the text names only the Chickasaw Nation.'
