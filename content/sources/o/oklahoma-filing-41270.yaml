notes: 'Oklahoma Secretary of State file 41270, filed Apr. 13, 2006. The register''s title reads “Agreement Tribal Cross Deputization Indian Law Enforcement Reform Act Addendum to file # 41100” and its description “Bureau of Indian Affairs & Citizen Potawatomi Nation; Bureau of Indian Affairs & Miami Tribe of Oklahoma, rescinding resolution 04-05 (effective immediately); Miami Tribe of Oklahoma & Ottawa County; Bureau of Indian Affairs & Eastern Shawnee Tribe of Oklahoma; Eastern Shawnee Tribe of Oklahoma & Ottawa County; Eastern Shawnee Tribe of Oklahoma & the City of Wyandotte; addendum to the Deputization Agreement filed 1/23/2006, document #63682”. The register line reads as an addendum adding a party to an existing agreement (it names Deputization Agreement filed 1/23/2006, document #63682). The filed copy is a scan with no text layer; this record''s facts come from the register''s own title and description, read by script and by an AI reader, not from the scan. The date is the filing date, not the signing date. The reader noted: several parties in one entry; also rescinds Miami resolution 04-05.'
