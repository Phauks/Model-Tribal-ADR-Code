notes: 'Oklahoma Secretary of State file 41467, filed Aug. 4, 2006. The register''s title reads “Agreement Chickasaw Tribal Resolution Number 23-064” and its description “Updating GR 22-007, Deputation Agreement between U.S. Bureau of Indian Affairs, Office of Law Enforcement Services and Security and the State of Oklahoma filed on 1/23/2006”. The register line reads as an amendment or supplement to an existing compact or agreement (it names Deputation Agreement between BIA and State of Oklahoma filed 1/23/2006 (GR 22-007)). The filed copy is a scan with no text layer; this record''s facts come from the register''s own title and description, read by script and by an AI reader, not from the scan. The date is the filing date, not the signing date. The reader noted: a tribal resolution updating GR 22-007; filed as amendment.'
