notes: Read through the web-fetch tool from the live bia.gov copy (bia.gov blocks plain curl); also posted
  at https://www.bia.gov/sites/bia.gov/files/assets/as-ia/ofa/admindocs/ListPetByState_2013-11-12.pdf.
  The text extraction stopped partway through the Vermont section (about 73,800 characters), so Vermont,
  Virginia, Washington, West Virginia and Wisconsin rows come from the 2008 edition. Rows were extracted
  state by state by a summarizing fetch tool; names and dates are as printed but should be spot-checked
  against the PDF. The bia.gov Additional Resources page notes that groups on this list may no longer
  be active petitioners under the current regulations.
