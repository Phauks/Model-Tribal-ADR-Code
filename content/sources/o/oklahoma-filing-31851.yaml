notes: 'Oklahoma Secretary of State file 31851, filed Jan. 9, 1995. The register''s title reads “Agreement Tribal Cross Deputization” and its description “Citizen Band Potawatomi & Pottawatomie County; City of Atoka, Bureau of Indian Affairs & Choctaw Nation ICA 94-0017; City of Caddo, Bureau of Indian Affairs & Choctaw Nation ICA 94-0051; LeFlore County, Bureau of Indian Affairs & Choctaw Nation ICA 94-0026; City of Poteau, Bureau of Indian Affairs & Choctaw Nation ICA 94-0016; City of Pocola, Bureau of Indian Affairs & Choctaw Nation ICA 94-0018; City of Talihina, Bureau of Indian Affaris and Choctaw Nation ICA 94-0014; Haskell County, Bureau of Indian Affairs and Choctaw Nation ICA 94-0025; Latimer County, Bureau of Indian Affairs and Choctaw Nation ICA 94-0013; City of Calera, Bureau of Indian Affairs and Choctaw Nation ICA 94-0031; Pittsburg County, Bureau of Indian Affairs and Choctaw Nation ICA 94-0020; City of Kiowa, Bureau of Indian Affairs and Choctaw Nation ICA 94-0023; City of McAlester, Bureau of Indian Affairs and Choctaw Nation ICA 94-0022; City of Stringtown, Bureau of Indian Affairs and Choctaw Nation ICA 94-0032; Coal County, Bureau of Indian Affairs and Choctaw Nation ICA 94-0046; City of Shady Point, Bureau of Indian Affairs and Choctaw Nation ICA 94-0024; City of Coalgate, Bureau of Indian Affairs and Choctaw Nation ICA 94-0021; City of Tupelo, Bureau of Indian Affairs and Choctaw Nation ICA 94-0028; City of Tushka, Bureau of Indian Affairs and Choctaw Nation ICA 94-0027”. The register line reads as an agreement or compact. The filed copy is a scan with no text layer; this record''s facts come from the register''s own title and description, read by script and by an AI reader, not from the scan. The date is the filing date, not the signing date. The reader noted: Bundle of about 20 ICAs; Citizen Band is named only in the lead entry.'
