notes: 'Oklahoma Secretary of State file 54324, filed Sept. 21, 2026. The register''s title reads “Chickasaw Nation Law Enforcement Commission Agreement” and its description “Chickasaw Nation Lightorse Police Department, established by Nation Legislature General Res. No.21-058”. The register line reads as a filing of another kind. The filed copy is a scan with no text layer; this record''s facts come from the register''s own title and description, read by script and by an AI reader, not from the scan. The date is the filing date, not the signing date. The reader noted: Tribal police established by the nation; no non-tribal party.'
