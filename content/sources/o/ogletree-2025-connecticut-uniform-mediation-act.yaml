annotation: >-
  A law-firm client alert reporting that Connecticut enacted the UMA, which Governor
  Lamont signed on June 10, 2025. The alert says 'All mediations in Connecticut initiated
  on or after October 1, 2025, will be governed by the Uniform Mediation Act.' Before
  Connecticut, it says, the UMA had been adopted only in the District of Columbia
  and twelve states: Georgia, Hawaii, Idaho, Illinois, Iowa, Nebraska, New Jersey,
  Ohio, South Dakota, Utah, Vermont, and Washington. The article links the signed
  law as a file named '2025PA-00035-R00HB-06971-PA', which points to Conn. Public
  Act 25-35 (H.B. 6971); this number is inferred from the file name. Nevada does
  not appear on the list. (project analysis) This is a secondary source used only
  because the ULC enactment map could not be read. It should be replaced by the ULC
  map count and the Connecticut public act.
