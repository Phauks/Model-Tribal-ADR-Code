notes: 'Oklahoma Secretary of State file 44920, filed June 14, 2011. The register''s title reads “Agreement Tribal Cross Deputization ICA 93-0019 Addendum (same as 27286 -added AG approval)” and its description “Cherokee Nation and the City of Big Cabin, Catoosa, Ft. Gibson, Grove, Inola, Jay, Langley, Locust Grove, Marble City, the City of Owasso, Pryor, Salina, Sallisaw, Stilwell, Sprerry, Tahlequah, Vian, Vinita, Westville, Town of Colcord, Town of Ramona, The Kansas Police Department, The Collinsville Police Department, and The Roland Police Department”. The register line reads as an addendum adding a party to an existing agreement (it names ICA 93-0019). The filed copy is a scan with no text layer; this record''s facts come from the register''s own title and description, read by script and by an AI reader, not from the scan. The date is the filing date, not the signing date. The reader noted: ''Sprerry'' in text read as Sperry.'
