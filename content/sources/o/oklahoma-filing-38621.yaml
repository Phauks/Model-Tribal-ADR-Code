notes: 'Oklahoma Secretary of State file 38621, filed Mar. 13, 2003. The register''s title reads “Agreement Tribal Cross Deputization Addendum” and its description “Muscogee (Creek) Nation, U.S., Political Subdivision of Oklahoma Exhibit B Addendum City of Eufaula”. The register line reads as an addendum adding a party to an existing agreement (it names Exhibit B). The filed copy is a scan with no text layer; this record''s facts come from the register''s own title and description, read by script and by an AI reader, not from the scan. The date is the filing date, not the signing date. The reader noted: Parent agreement not named beyond Exhibit B.'
