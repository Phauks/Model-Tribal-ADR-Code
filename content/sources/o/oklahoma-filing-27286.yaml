notes: 'Oklahoma Secretary of State file 27286, filed July 8, 1992. The register''s title reads “Agreement Tribal Cross Deputization (original agreement is OKSOS file number 27286 -- OK Attorney General ''Letter of Approval'' added and filed 10/10/1994--SOS document # 31425)” and its description “Cherokee Nation /U.S. Deptment of Interior/Co Comm. Various Law Enf. including by not limited to County Sheriff''s Department, Oklahoma State Bureau of Investigation, Oklahoma Highway Patrol, State Fire Marshal, Oklahoma Department of Dangerous Drugs and Narcotics, Departmetn of Corrections, Council on Law Enforcement Education and Training, Oklahoma Game Rangers, Oklahoma Lake Patrol, Oklahoma State Fire Marshal, etc”. The register line reads as an agreement or compact. The filed copy is a scan with no text layer; this record''s facts come from the register''s own title and description, read by script and by an AI reader, not from the scan. The date is the filing date, not the signing date. The reader noted: Text lists agencies followed by "etc."; list may be incomplete.'
