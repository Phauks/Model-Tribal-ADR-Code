notes: 'Oklahoma Secretary of State file 53331, filed Sept. 26, 2024. The register''s title reads “Agreement Tribal Cross Deputization Law Enforcement Addendum file #41100” and its description “County Addendum, Addition of Pittsburg County McAlester School District #80 Campus Police joins into the Deputation Agreement for Law Enforcement in the Chactaw Nation”. The register line reads as an addendum adding a party to an existing agreement (it names Deputation Agreement for Law Enforcement in the Choctaw Nation). The filed copy is a scan with no text layer; this record''s facts come from the register''s own title and description, read by script and by an AI reader, not from the scan. The date is the filing date, not the signing date. The reader noted: Register text names both Pittsburg County and the campus police as the addition.'
