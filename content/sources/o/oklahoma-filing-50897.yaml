notes: 'Oklahoma Secretary of State file 50897, filed Mar. 2, 2021. The register''s title reads “Agreement Tribal Cross Deputization Law Enforcement Addendum file #41100” and its description “State Addendum, Addition of State Agency Oklahoma Department of Wildlife Conservation into the Deputation Agreement for Law Enforcement in the Muscogee (Creek) Nation”. The register line reads as an addendum adding a party to an existing agreement (it names file #41100). The filed copy is a scan with no text layer; this record''s facts come from the register''s own title and description, read by script and by an AI reader, not from the scan. The date is the filing date, not the signing date.'
