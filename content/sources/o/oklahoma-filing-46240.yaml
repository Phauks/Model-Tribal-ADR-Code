notes: 'Oklahoma Secretary of State file 46240, filed June 14, 2013. The register''s title reads “Governor''s Office Tribal-State Tobacco Compact Bob Rabon (Chickasaw Nation & Choctaw Nation attorney)” and its description “Letter extending the termination date of current compact and proposed amendment”. The register line reads as an extension of an existing compact or agreement (it names current tobacco compact). The filed copy is a scan with no text layer; this record''s facts come from the register''s own title and description, read by script and by an AI reader, not from the scan. The date is the filing date, not the signing date. The reader noted: letter addressed to the nations'' attorney; State party taken from the compact type.'
