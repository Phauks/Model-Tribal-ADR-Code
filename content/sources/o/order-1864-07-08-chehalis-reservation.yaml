notes: 'Indigo Book citation: Letter, Sec''y of the Interior J.P. Usher to Comm''r of Indian Affairs (July 8, 1864), in 1 Indian Affairs: Laws and Treaties 903 (Charles J. Kappler ed., 1904). Read the letter as reproduced in Kappler vol. 1 (Internet Archive scan bp_996062, full-text OCR). The letter date prints as "July 8, 1861" in the OCR; the 1886 Exec. Order (1 Kappler 903) calls it "order of the Secretary of the Interior, dated July 8, 1864," and Usher was Secretary from 1863 to 1865. Private copy of the scan''s text: research/captures/jurisdiction/kappler-scan-bp_996062.txt.'
