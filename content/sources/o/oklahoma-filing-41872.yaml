notes: 'Oklahoma Secretary of State file 41872, filed Feb. 21, 2007. The register''s title reads “Agreement Indian National Council of Governments ICA 98-0025” and its description “Second Amended Agreement Creating the Indian National Council of Governments for Addition of the Cherokee, Creek and Osage Nations as INCOG members”. The register line reads as an amendment or supplement to an existing compact or agreement (it names ICA 98-0025). The filed copy is a scan with no text layer; this record''s facts come from the register''s own title and description, read by script and by an AI reader, not from the scan. The date is the filing date, not the signing date. The reader noted: text says ''Creek Nation'' as written.'
