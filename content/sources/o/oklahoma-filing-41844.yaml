notes: 'Oklahoma Secretary of State file 41844, filed Feb. 9, 2007. The register''s title reads “Agreement Tribal Cross Deputization Law Enforcement Addendum file #41100” and its description “Choctaw Nation, Bureau of Indian Affairs, the District #19 District Attorney, Eastern Oklahoma State College, Carl Albert Junior College, Cities of Caney, Durant, Clayton, Antlers, Calera, Ft. Towson, Sallisaw, Valliant, Sawyer, Bokchito, Bokoshe, Ratten, Hartshorne, Calvin, Pocola, Idabel, Wright City, Stringtown, Wilburton, Tushka, Caddo, Panama, Kinta, Haworth, Atoka, Haileyville, Howe, Counties of Pittsburg, LeFlore, Atoka and Bryan, and the Tribe of Muscogee (Creek) Nation”. The register line reads as an addendum adding a party to an existing agreement (it names file #41100). The filed copy is a scan with no text layer; this record''s facts come from the register''s own title and description, read by script and by an AI reader, not from the scan. The date is the filing date, not the signing date.'
