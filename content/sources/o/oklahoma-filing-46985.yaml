notes: 'Oklahoma Secretary of State file 46985, filed June 5, 2014. The register''s title reads “Medicine Park Police Department” and its description “Withdraw from the Deputation Agreement for Law Enforcement in the Commanche Tribe (Nation)”. The register line reads as a notice of termination or withdrawal (it names Deputation Agreement for Law Enforcement in the Comanche Nation). The filed copy is a scan with no text layer; this record''s facts come from the register''s own title and description, read by script and by an AI reader, not from the scan. The date is the filing date, not the signing date. The reader noted: Withdrawal from the deputation agreement is coded as termination; the register names the Commanche Tribe (Nation).'
