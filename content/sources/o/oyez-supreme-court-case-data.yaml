notes: >-
  A multimedia archive of the Supreme Court of the United States. Each case record gives the natural court that heard it (named for the Chief Justice and the years its membership was unchanged, such as "Warren Court (1958-1962)"), the decision type, the vote and each justice's vote and opinion. Read through the public API at https://api.oyez.org/ on Nov. 22, 2026 by scripts/law/supreme_court_benches.py, which writes each case record's supreme_court block with a link to the Oyez case. Oyez does not yet give decisions for cases argued from about 2022 onward, and some nineteenth-century cases lack vote data; those blocks were filled from the official reports and are marked in the record's notes.
