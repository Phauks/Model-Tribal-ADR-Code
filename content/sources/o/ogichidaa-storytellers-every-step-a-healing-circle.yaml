notes: >-
  Ten pages of grade 6-12 classroom materials for one of six Ogichidaa Storytellers videos about the reclamation of Ojibwe treaty rights in Wisconsin and the Great Lakes. It opens with a quotation from Lee Obizaan Staples (St. Croix Ojibwe) and lists the eleven Ojibwe nations. The PDF does not name its publisher (it is hosted on Wisconsin First Nations), so the open-web search in the pull list (Part 4) stays open. Downloaded by the lead author on 2026-11-22 for the stories thread; not yet read for a story of settling disputes.
