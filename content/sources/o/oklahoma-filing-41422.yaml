notes: 'Oklahoma Secretary of State file 41422, filed July 11, 2006. The register''s title reads “Agreement Tribal Cross Deputization - Indian Law Enforcement Reform Act Addendum to file # 41100” and its description “Bureau of Indian Affairs & the Wyandotte Nations, Wyandotte Nation & Ottawa County, Wyandotte Nation & the City of Wyandotte,”. The register line reads as an addendum adding a party to an existing agreement (it names file #41100). The filed copy is a scan with no text layer; this record''s facts come from the register''s own title and description, read by script and by an AI reader, not from the scan. The date is the filing date, not the signing date. The reader noted: register text ends mid-list.'
