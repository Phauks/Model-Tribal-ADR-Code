notes: Oklahoma Secretary of State file 52958, filed Feb. 16, 2024. The register's title reads “Chickasaw Nation Law Enforcement Commission Agreement” and its description “City of Stonewall is a municipality organized under the law of the State of Oklahoma. Stonewall Police Department exercise criminal law enforcement authority as well as the laws of the State of Oklahoma, within Chickasaw Nation Indian Country”. The register line reads as an agreement or compact. The filed copy is a scan with no text layer; this record's facts come from the register's own title and description, read by script and by an AI reader, not from the scan. The date is the filing date, not the signing date.
