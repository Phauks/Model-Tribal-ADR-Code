notes: 'Oklahoma Secretary of State file 41466, filed Aug. 4, 2006. The register''s title reads “Agreement Tribal Cross Deputization - Indian Law Enforcement Reform Act, Addendum to file # 41100” and its description “Tribal Addendum Addition Seminole Nation of Oklahoma and County Addendum Addition of County and Seminole Nation Resolution TR 2006-95”. The register line reads as an addendum adding a party to an existing agreement (it names file #41100). The filed copy is a scan with no text layer; this record''s facts come from the register''s own title and description, read by script and by an AI reader, not from the scan. The date is the filing date, not the signing date. The reader noted: county addition named only as ''County''; no county named.'
