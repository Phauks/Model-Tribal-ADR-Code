notes: 'Oklahoma Secretary of State file 44921, filed June 14, 2011. The register''s title reads “Agreement Tribal Cross Deputization ICA 93-0019 Addendum (same as 27286 -added AG approval)” and its description “Cherokee Nation and the Board of County Commissioners of Cherokee County, Delaware County, Muskogee County, Sequoyah County, Mayes County, McIntosh County, Ottawa County, Wagoner County, the Rogers County Sheriff''s Office, the Sequoyah County Sheriff, and the Sheriff of Wagoner County”. The register line reads as an addendum adding a party to an existing agreement (it names ICA 93-0019). The filed copy is a scan with no text layer; this record''s facts come from the register''s own title and description, read by script and by an AI reader, not from the scan. The date is the filing date, not the signing date. The reader noted: name says AG approval was added to the file 27286 version.'
