notes: 'Oklahoma Secretary of State file 52738, filed Oct. 9, 2023. The register''s title reads “Agreement Tribal Cross Deputization Law Enforcement Addendum file #41100” and its description “Tribal Addendum, Addition of tribe Ottawa Tribe of Oklahoma joins into the Deputation Agreement for Law Enforcement within the exterior boundaries”. The register line reads as an addendum adding a party to an existing agreement (it names Deputation Agreement for Law Enforcement). The filed copy is a scan with no text layer; this record''s facts come from the register''s own title and description, read by script and by an AI reader, not from the scan. The date is the filing date, not the signing date. The reader noted: Parent agreement is named only generically in the text.'
