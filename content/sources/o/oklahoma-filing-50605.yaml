notes: 'Oklahoma Secretary of State file 50605, filed Sept. 18, 2020. The register''s title reads “Agreement Tribal Cross Deputization Law Enforcement Addendum file #41100” and its description “State Addendum - Addition of State to Deputation Agreement for Law Enforcement in the Cherokee Nation - the undersigned State Agency of Oklahoma, the Oklahoma Department of Wildlife Conservation hereby joins into the Deputation Agreement for Law Enforcement in the Cherokee Nation effective on August 6, 2020”. The register line reads as an addendum adding a party to an existing agreement (it names file #41100). The filed copy is a scan with no text layer; this record''s facts come from the register''s own title and description, read by script and by an AI reader, not from the scan. The date is the filing date, not the signing date.'
