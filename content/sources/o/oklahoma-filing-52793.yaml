notes: Oklahoma Secretary of State file 52793, filed Oct. 27, 2023. The register's title reads “Chickasaw Nation accepts the supplemental term that extends the legal effect of the tobacco tax compact.” and its description “Chickasaw Nation accepts the State's offer, made to the Nation by the Oklahoma Legislature's enactment of SB26x”. The register line reads as an amendment or supplement to an existing compact or agreement (it names tobacco products excise tax compact (SB 26x)). The filed copy is a scan with no text layer; this record's facts come from the register's own title and description, read by script and by an AI reader, not from the scan. The date is the filing date, not the signing date.
