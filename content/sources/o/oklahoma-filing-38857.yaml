notes: 'Oklahoma Secretary of State file 38857, filed May 19, 2003. The register''s title reads “Agreement Tribal Tobacco Tax Compact” and its description “Absentee Shawnee Tribal of Indians and State of Oklahoma amendment adding original signature of Joint Committee on State Tribal Relations to file # 38499”. The register line reads as an approval of another agreement (it names file #38499). The filed copy is a scan with no text layer; this record''s facts come from the register''s own title and description, read by script and by an AI reader, not from the scan. The date is the filing date, not the signing date. The reader noted: Nation name written "Tribal of Indians" in text; title corrected.'
