notes: 'Oklahoma Secretary of State file 50534, filed Aug. 7, 2020. The register''s title reads “Agreement Tribal Cross Deputization Law Enforcement Addendum file #41100” and its description “Addendum to the Law Enforcement Agreement between and among The Cherokee Nation, the United States of America, the State of Oklahoma and its political subdivisions, the various Boards of County Commissioners, and Various Law Enforcement Agencies”. The register line reads as an addendum adding a party to an existing agreement (it names file #41100). The filed copy is a scan with no text layer; this record''s facts come from the register''s own title and description, read by script and by an AI reader, not from the scan. The date is the filing date, not the signing date.'
