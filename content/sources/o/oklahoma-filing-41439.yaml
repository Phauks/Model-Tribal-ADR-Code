notes: 'Oklahoma Secretary of State file 41439, filed July 21, 2006. The register''s title reads “Agreement Tribal Cross Deputization Intergovernmental Exhibit B Addendum” and its description “Between the City of Broken Bow, the United States, the Muscogee (Creek) Nation, and Political Subdivisions of the State of Oklahoma and the City of Broken Arrow”. The register line reads as an addendum adding a party to an existing agreement. The filed copy is a scan with no text layer; this record''s facts come from the register''s own title and description, read by script and by an AI reader, not from the scan. The date is the filing date, not the signing date. The reader noted: parent agreement not named; text also mentions City of Broken Arrow, role unclear.'
