notes: 'Oklahoma Secretary of State file 53342, filed Oct. 9, 2024. The register''s title reads “Agreement Tribal Cross Deputization Law Enforcement Addendum file #41100” and its description “Tribal Addendum, Addition of Comanche Tribe Nation. Authorized to sign this Agreement Pursuant to Tribal Resolution No. 128-2021”. The register line reads as an addendum adding a party to an existing agreement (it names Deputation Agreement for Law Enforcement in the Comanche Nation). The filed copy is a scan with no text layer; this record''s facts come from the register''s own title and description, read by script and by an AI reader, not from the scan. The date is the filing date, not the signing date. The reader noted: Authorized under Tribal Resolution No. 128-2021; no non-tribal party named.'
