notes: 'Oklahoma Secretary of State file 51691, filed Apr. 1, 2022. The register''s title reads “Agreement Tribal Cross Deputization Law Enforcement Addendum file #41100” and its description “State Addendum, Addition of State Agency to Deputation Agreement for Law Enforement in the Quapaw Nation Tribe”. The register line reads as an addendum adding a party to an existing agreement (it names Deputation Agreement for Law Enforcement in the Quapaw Nation). The filed copy is a scan with no text layer; this record''s facts come from the register''s own title and description, read by script and by an AI reader, not from the scan. The date is the filing date, not the signing date. The reader noted: The state agency is not named.'
