notes: 'The 1909 edition of the Office of Indian Affairs'' national map of reservations, in the National Archives'' scan (15,949 by 10,467 pixels). A solid brown fill is an "Indian reservation" and a brown band around plain paper is "Opened" land; three inset panels show the Mission reservations of southern California, the Pueblo grants of New Mexico and northeastern Oklahoma at larger scales. The project traced it into the Map page''s layer "Reservations on the 1909 map" (scripts/maps/oia_1909_reservations.py), every shape marked Unverified, and keeps the scan in the project''s bucket under historic-maps/oia-1909/.'
