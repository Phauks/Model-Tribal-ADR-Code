notes: 'Oklahoma Secretary of State file 44395, filed Oct. 6, 2010. The register''s title reads “Agreement Tribal Cross Deputization Law Enforcement Addendum file #41100” and its description “Bureau of Indian Affairs, Comanche Nation, City of Medicine Park, City of Elgin, City of Sterling, City of Cyril, City of Apache, City of Fletcher, Oklahoma Bureau of narcotics and Dangerous Drugs, Oklahoma State Bureau of Investigation”. The register line reads as an addendum adding a party to an existing agreement (it names file #41100). The filed copy is a scan with no text layer; this record''s facts come from the register''s own title and description, read by script and by an AI reader, not from the scan. The date is the filing date, not the signing date.'
