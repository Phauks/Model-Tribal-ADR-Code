notes: Oklahoma Secretary of State file 52879, filed Dec. 20, 2023. The register's title reads “Acceptance of the Supplemental Term to Tobacco Products Excise Tax Compact” and its description “Between the Choctaw Nation and the State of Oklahoma shall be deemed in effect until December 31, 2024. SB 26X”. The register line reads as an amendment or supplement to an existing compact or agreement (it names tobacco products excise tax compact (SB 26X)). The filed copy is a scan with no text layer; this record's facts come from the register's own title and description, read by script and by an AI reader, not from the scan. The date is the filing date, not the signing date.
