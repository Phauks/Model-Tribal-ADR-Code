notes: 'Oklahoma Secretary of State file 28966, filed June 21, 1993. The register''s title reads “Agreement Tribal Cross Deputization ICA 93-0015, ICA 93-14, ICA 93-0016” and its description “Bureau of Indian Affairs & City of Elmore, City of Kingston, City of Marietta”. The register line reads as an agreement or compact. The filed copy is a scan with no text layer; this record''s facts come from the register''s own title and description, read by script and by an AI reader, not from the scan. The date is the filing date, not the signing date. The reader noted: No nation named; bundle of three ICAs (93-0015, 93-14, 93-0016).'
