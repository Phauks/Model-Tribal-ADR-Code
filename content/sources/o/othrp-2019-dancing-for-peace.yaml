notes: Posted in four parts on the Omaha Tribe's website (part 1 at this address; part 3 at .../DANCING-FOR-PEACE-3.pdf).
  The opening section, 'Dancing the Way to Peace 1493-1872', records the 1791-1792 peace between the Umonhon and
  the Oglala from a winter count. OTHRP notes that the treaty material draws on work by Dr. Hastings and Dr. Coffey.
  A later section concerns keepers of the sacred; this project records nothing from it. OTHRP is a nonprofit; its
  relation to the Tribe's government was not confirmed.
