notes: 'Oklahoma Secretary of State file 41058, filed Dec. 21, 2005. The register''s title reads “Agreement Tribal Cross Deputization Intergovernmental Exhibit B Addendum” and its description “Between the City of Okemah, the Muscogee (Creek) Nation, the United States, and Political subdivisions of the State of Oklahoma”. The register line reads as an addendum adding a party to an existing agreement. The filed copy is a scan with no text layer; this record''s facts come from the register''s own title and description, read by script and by an AI reader, not from the scan. The date is the filing date, not the signing date. The reader noted: parent agreement not named.'
