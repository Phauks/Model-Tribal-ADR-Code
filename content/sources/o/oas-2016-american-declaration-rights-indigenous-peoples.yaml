annotation: >-
  The Organization of American States' declaration, adopted by resolution AG/RES. 2888 (XLVI-O/16) at
  the plenary session of June 15, 2016 (the cover gives approval in Santo Domingo on June 14, 2016). Article
  XXII(2) provides: "Indigenous law and legal systems shall be recognized and respected by national, regional
  and international legal systems." Article XXXIV requires States to provide, "with the full and effective
  participation of those peoples, just, equitable and effective mechanisms" for conflicts with Indigenous
  peoples "and procedures for their prompt resolution," with due consideration of their customs, norms
  and legal systems. Article XXXIII concerns "effective and suitable remedies, including prompt judicial
  remedies." Footnote 1 records the United States' position: it says the Declaration "is not itself legally
  binding" and that the United States "has, however, persistently objected" to the text. (project analysis)
  Article XXII(2) goes further than UNDRIP by asking other legal systems to recognize Indigenous law,
  which is the recognition question a model code's enforcement chapter faces.
