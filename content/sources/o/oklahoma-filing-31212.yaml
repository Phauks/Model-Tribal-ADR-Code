notes: 'Oklahoma Secretary of State file 31212, filed Aug. 22, 1994. The register''s title reads “Agreement Tribal Cross Deputization ICA 94-0038, ICA 94-0039, ICA 94-0040, ICA 94-0041, ICA 94-0042” and its description “BIA/Choctaw Nation & City of Bokoshe, City of Stigler, City of Calvin, Hughes County, City of Panama”. The register line reads as an agreement or compact. The filed copy is a scan with no text layer; this record''s facts come from the register''s own title and description, read by script and by an AI reader, not from the scan. The date is the filing date, not the signing date. The reader noted: Bundle of five ICAs (94-0038 to 94-0042) in one entry.'
