notes: Oklahoma Secretary of State file 48811, filed Aug. 28, 2017. The register's title reads “Agreement between State of Oklahoma and the Osage Nation” and its description “Agreement entered because of a state emergency existing due to seeping natural gas which has migrated into, under or around the Pawhuska High School, located in Osage County, Pawhuska, Oklahoma”. The register line reads as an agreement or compact. The filed copy is a scan with no text layer; this record's facts come from the register's own title and description, read by script and by an AI reader, not from the scan. The date is the filing date, not the signing date.
