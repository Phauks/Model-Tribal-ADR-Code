annotation: >-
  Section 574 bars a neutral from voluntarily disclosing, or being compelled to disclose,
  "any dispute resolution communication or any communication provided in confidence
  to the neutral" except on written consent of all parties and the neutral, prior
  publication, statutory requirement, or a court finding of necessity to prevent
  manifest injustice, establish a violation of law, or prevent harm to public health
  or safety (§ 574(a)); § 574(b) imposes a parallel rule on parties, and § 574(j),
  added by the 1996 Act, makes neutral-party dispute resolution communications exempt
  from FOIA via 5 U.S.C. § 552(b)(3). Section 574(e) requires a neutral who receives
  a disclosure demand to notify the parties. (project analysis) A ready-made structure
  for a Tribal code's confidentiality section, including the balancing test in §
  574(a)(4) and the interaction with a Tribal public-records law.
