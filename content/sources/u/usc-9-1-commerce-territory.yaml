annotation: >-
  The FAA's definition of "commerce" expressly reaches commerce "in any Territory
  of the United States," along with commerce between territories, states and foreign
  nations. Read with 9 U.S.C. § 2, this is the textual basis for applying the FAA
  to arbitration agreements in the territories. (project analysis) Courts in the
  territories have read the FAA's reach in different ways. The V.I. Supreme Court
  applied it on an interstate-nexus theory without reaching the Territorial Clause
  question (Whyte v. Bockino, 2018), and Guam's Chapter 42A defers to the FAA where
  it applies. Keep this point brief in the book. The federal agent's 9 U.S.C. records
  should cover § 2.
