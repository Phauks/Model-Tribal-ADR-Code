annotation: >-
  The Full Faith and Credit for Child Support Orders Act. Subsection (a) requires
  each State's appropriate authorities to enforce, according to its terms, a child
  support order that a court of another State made consistently with the section.
  Subsection (b)(9) defines 'State' to include 'Indian country (as defined in section
  1151 of title 18)', so Tribal child support orders are covered. (project analysis)
  A child support agreement reached in Tribal mediation or peacemaking should be
  entered as an order of a Tribal court, or of another Tribal tribunal with authority
  to make support orders, so that it qualifies under § 1738B.
