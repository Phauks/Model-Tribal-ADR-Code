annotation: >-
  The Uniform Law Commission's enactment table for the Uniform Mediation Act (2001),
  with data "as of" November 21, 2026, lists 14 enacting jurisdictions: Connecticut,
  the District of Columbia, Georgia, Hawaii, Idaho, Illinois, Iowa, Nebraska, New
  Jersey, Ohio, South Dakota, Utah, Vermont and Washington. Nevada, Puerto Rico and
  the U.S. Virgin Islands are listed without an enactment; Guam, the Northern Mariana
  Islands and American Samoa do not appear in the table. (project analysis) This
  confirms that Nevada has not adopted the act, and that the act remains a minority
  approach, so a Tribal code that borrows its privilege structure is borrowing a
  model rather than a national norm.
