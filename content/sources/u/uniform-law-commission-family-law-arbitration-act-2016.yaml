annotation: >-
  The Uniform Family Law Arbitration Act (UFLAA), approved at the ULC annual conference
  in Stowe, Vermont, July 8-14, 2016. It governs arbitration of family-law disputes,
  including custody, with extra safeguards: arbitrator training in identifying domestic
  violence and child abuse (bracketed), and court review of child-related awards.
  Its § 2 definition of 'State' includes the bracketed option '[The term includes
  a federally recognized Indian tribe.]' (project analysis) This is a direct drafting
  model for how uniform acts can treat Tribes as states for recognition purposes.
  A Tribal code can also use the UFLAA's domestic-violence screening provisions in
  any family ADR chapter.
