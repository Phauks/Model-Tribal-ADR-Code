notes: 'Full citation: United States v. Chetimachas Indians, 131 U.S. app. lxx (1852). Official report: the appendix of cases omitted from the reports in volume 131 (1889), p. lxx, scan page 550 of the Internet Archive''s copy of the volume (https://archive.org/details/sim_united-states-supreme-court-cases-adjudged_1889_131); the Library of Congress has no scan of the appendix. Chief Justice Taney dismissed the United States'' appeal because the Attorney General declined to argue it, stating that the Chetimachas Indians were entitled to the land claimed. Not yet read by a person.'
