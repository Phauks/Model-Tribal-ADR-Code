annotation: >-
  Chapter 2 of title 9 implements the 1958 New York Convention ("shall be enforced
  in United States courts in accordance with this chapter"), added by Pub. L. 91-368
  (1970), 84 Stat. 692; LII notes the Convention entered into force for the United
  States on Dec. 29, 1970. Chapter 3 implements the 1975 Inter-American (Panama)
  Convention, added by Pub. L. 101-369 (1990), 104 Stat. 448, in force for the United
  States Oct. 27, 1990 (LII note at § 301, https://www.law.cornell.edu/uscode/text/9/301).
  (project analysis) Brief background only: relevant if a Tribal enterprise contracts
  with foreign parties, and as a reminder that recognition of awards across sovereign
  lines already has a treaty-based model that Tribal codes may borrow from.
