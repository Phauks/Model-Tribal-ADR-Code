annotation: >-
  Companion page to the university's land acknowledgment. It says "The Nuwuvi, or Southern Paiute
  peoples (the people), are also known as Nuwu," names the Las Vegas Paiute Tribe as the local
  tribe, whose ancestors were the Tudinu (Desert People), and lists other Southern Paiute tribes,
  among them the Moapa Band of Paiute Indians. It adds that "Acknowledgment by itself is a small
  gesture."
