annotation: >-
  The Uniform Law Commission's description of its drafting committees. Interested groups may send representatives "known as observers"; drafting meetings "are open to the public"; all drafts "are available on the ULC website"; and committees "typically meet three times a year (two substantive drafting committee meetings and a presentation of the draft for line-by-line reading and debate at the ULC Annual Meeting) for at least two years." Each committee is also assigned an American Bar Association advisor. The page does not say whether observers vote.
