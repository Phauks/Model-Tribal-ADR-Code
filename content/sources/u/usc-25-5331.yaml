annotation: >-
  ISDEAA § 110 (added by Pub. L. 100-472, § 206(a), Oct. 5, 1988) gives federal district
  courts original jurisdiction over claims against the Secretary under the Act and
  money-damages claims under self-determination contracts (concurrent with the Court
  of Federal Claims), bars the Secretary from revising a contract without the Tribal
  organization's consent, and applies the Contract Disputes Act ("Chapter 71 of title
  41") to self-determination contracts (§ 5331(a)–(d)). (project analysis) Provides
  the litigation backdrop against which the model-agreement ADR options (25 U.S.C.
  § 5329(c)) and the 25 C.F.R. § 900.217 alternatives operate.
