annotation: >-
  The statutory model self-determination contract in 25 U.S.C. § 5329(c), § 1(b)(12),
  defines "third-party mediation" and lets the Secretary and the Tribal contractor
  jointly submit disputes to third-party mediation, "to the adjudicatory body of
  the Contractor, including the tribal court of the Contractor," to the contractor's
  own mediation processes, or to ADRA processes; the Secretary is bound by those
  decisions except one that "significantly conflicts with the interests of Indians
  or the United States." (project analysis) This is the clearest federal statutory
  recognition that federal-Tribal contract disputes may be resolved in a Tribe's
  own court or mediation process; a model Tribal ADR code should provide a ready
  forum and procedure that a Tribe can name under clause (B)(ii)–(iii).
