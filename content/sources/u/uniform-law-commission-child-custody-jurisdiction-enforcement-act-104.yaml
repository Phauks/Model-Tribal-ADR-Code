annotation: >-
  The UCCJEA (1997) is not an ADR act. It is included because § 104 is the leading
  uniform-law model for treating Tribes as states. Subsection (a) carves out proceedings
  governed by ICWA. Bracketed subsections (b) and (c) let a state treat a Tribe as
  a state for jurisdiction purposes and require recognition of Tribal custody determinations
  made in substantial conformity with the act. The comment notes 'a Tribe could adopt
  this Act as enabling legislation by simply replacing references to “this State”
  with “this Tribe.”' Nevada enacted both bracketed options (see nevada-revised-statutes-125a-215).
  (project analysis) This is the clearest reciprocity model for making Tribal mediated
  or arbitrated custody agreements, once reduced to Tribal-court orders, enforceable
  in state courts.
