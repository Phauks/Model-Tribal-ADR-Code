annotation: >-
  The university's land acknowledgment. It says UNLV is situated on the traditional homelands of
  the Nuwu, Southern Paiute People, names "the Las Vegas Paiute Tribe and the Moapa (moh·aa·puh)
  Band of Paiutes," and explains that land acknowledgments "do not exist in a historical context or
  past tense." The page names no author or approving body; its metadata gives 2020-11-13 as the
  publication date and 2024-03-19 as the last change.
