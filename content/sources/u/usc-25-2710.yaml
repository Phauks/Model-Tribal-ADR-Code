annotation: >-
  Section 2710(d)(3)(C) lists the subjects a Tribal-State class III gaming compact
  'may include', among them '(v) remedies for breach of contract'. Many compacts
  use this to set out dispute-resolution clauses. Section 2710(d)(7) gives federal
  district courts jurisdiction over a Tribe's suit claiming that a State failed to
  negotiate in good faith. If the court orders a compact and the parties still do
  not agree, each side must 'submit to a mediator appointed by the court a proposed
  compact that represents their last best offer', and the mediator 'shall select
  from the two proposed compacts'. That last step is a final-offer selection process,
  not mediation in the facilitative sense. (project analysis) Seminole Tribe v. Florida,
  517 U.S. 44 (1996), held that Congress could not authorize Tribes to sue States
  under the Indian Commerce Clause, so the (d)(7) remedy cannot be enforced against
  a State that refuses to consent. That is one reason compact dispute clauses carry
  so much weight.
