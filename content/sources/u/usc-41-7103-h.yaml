annotation: >-
  Section 7103(h) of the Contract Disputes Act (as recodified by Pub. L. 111-350,
  Jan. 4, 2011) lets a contractor and contracting officer "use any alternative means
  of dispute resolution under subchapter IV of chapter 5 of title 5, or other mutually
  agreeable procedures, for resolving claims," and requires a party rejecting the
  other's ADR request to explain why in writing (the contracting officer citing 5
  U.S.C. § 572(b) or other specific reasons). (project analysis) Because the CDA
  applies to ISDEAA self-determination contracts (25 U.S.C. § 5331(d)), this written-reasons
  requirement is a lever Tribes can use when a federal awarding official declines
  ADR; a Tribal code could adopt the same written-reasons rule for its own procurement
  disputes.
