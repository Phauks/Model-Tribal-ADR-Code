annotation: >-
  Chapter 4 of title 9, added by Pub. L. 117-90, § 2(a) (Mar. 3, 2022), 136 Stat.
  26, lets a person alleging a sexual assault or sexual harassment dispute elect
  to void a predispute arbitration agreement or joint-action waiver; it applies to
  disputes or claims arising or accruing on or after Mar. 3, 2022 (Pub. L. 117-90,
  § 3, note under § 401). Notably for this project, the definitions and operative
  text expressly reference "Tribal" law: a sexual assault dispute includes conduct
  defined in 18 U.S.C. § 2246 "or similar applicable Tribal or State law," and §
  402(a) covers a case "filed under Federal, Tribal, or State law." Section 402(b)
  reserves applicability and enforceability questions to a court, not an arbitrator,
  even if the agreement delegates them (opened § 401 at https://www.law.cornell.edu/uscode/text/9/401).
  (project analysis) A Tribal ADR code should include a parallel carve-out (or a
  cross-reference) so Tribal employers and Tribal courts do not enforce predispute
  arbitration of these claims contrary to the federal rule, and should consider whether
  Tribal law will define sexual harassment for purposes of § 401(4).
