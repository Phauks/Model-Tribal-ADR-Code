annotation: >-
  Section 101 of the Indian Child Welfare Act of 1978 (Pub. L. 95-608, 92 Stat. 3071).
  Subsection (d) requires the United States, every State, every territory or possession,
  and every Indian tribe to give full faith and credit to Tribal 'public acts, records,
  and judicial proceedings' in Indian child custody proceedings. Wilson v. Marchington
  treats § 1911(d) as one of the few express congressional extensions of full faith
  and credit to Tribes, and reads Congress's choice to name Tribes here as evidence
  that 28 U.S.C. § 1738 does not reach them. (project analysis) For a model Tribal
  ADR code, this means a mediated or peacemaking outcome that a Tribal court adopts
  in an ICWA-covered custody matter is entitled to full faith and credit. An ADR
  outcome in most other kinds of matters is not; it depends on comity or on a specific
  statute.
