annotation: >-
  The official ULC text of the Uniform Mediation Act (UMA), approved at the ULC annual
  conference of August 10-17, 2001, amended in August 2003, and approved by the ABA
  on February 4, 2002 (title page). Its core is a privilege for 'mediation communications'
  (§ 4) with waiver, preclusion and exceptions (§§ 5-6), plus mediator disclosure
  duties (§ 9). The § 2(1) definition is the most widely copied statutory definition
  of mediation in the U.S., and the § 9 comment explains that the drafters chose
  not to set mediator qualifications. Scope (§ 3) reaches mediations required by
  statute, court or agency rule, or referred by a court, agency or arbitrator, and
  excludes collective-bargaining mediations, mediations 'conducted by a judge who
  might make a ruling on the case,' and some school and youth-correctional peer mediations.
  (project analysis) A Tribal code can adopt the UMA's privilege structure nearly
  word for word while leaving qualifications to Tribal law, which is the choice the
  drafters themselves made. The UMA's 'Person' definition covers 'government; governmental
  subdivision, agency, or instrumentality' but has no Tribe-specific definition,
  so a Tribal enactment would need its own 'tribal court' and 'proceeding' language.
