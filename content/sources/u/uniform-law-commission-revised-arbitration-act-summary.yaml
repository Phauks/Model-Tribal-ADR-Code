annotation: >-
  A two-page ULC summary in the RUAA Enactment Kit. It states the reach of the original
  1955 UAA and summarizes RUAA changes: default-rule structure, provisional remedies,
  mandatory disclosure by neutral arbitrators, judge-level immunity, discovery and
  summary disposition powers, punitive damages and fees 'if such an award is authorized
  by law in a civil action involving the same claim,' and consolidation. The summary
  gives no RUAA adoption count, and the RUAA community page shows enactments only
  in a non-text embedded map. (project analysis) The 49-jurisdiction figure is the
  only ULC-published count readable in text and refers to the original UAA, not the
  RUAA.
