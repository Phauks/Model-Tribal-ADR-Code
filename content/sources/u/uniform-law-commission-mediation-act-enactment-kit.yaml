annotation: >-
  The ULC's community page for the Mediation Act links an Enactment Kit with two
  short advocacy documents: a two-page 'Summary' and 'Why Your State Should Adopt.'
  The Summary says the act was 'jointly drafted by the Uniform Law Commission and
  the American Bar Association Dispute Resolution Section' and that 'over 2,500 separate
  state statutes affect mediation proceedings in some manner.' The 'Why Adopt' sheet
  lists applicability exceptions that include 'collective bargaining disputes, some
  judicial settlement conferences, or mediation involving parties who are all minors.'
  ENACTMENT COUNT: the community page shows adoption only in an embedded 'Enactment
  Map' (Power BI) and a 'Legislative Bill Tracking' spreadsheet, and neither could
  be read as text. The page therefore gives no readable count. A secondary source
  (key ogletree-2025-connecticut-uniform-mediation-act) lists D.C. plus 12 states,
  with Connecticut effective Oct. 1, 2025. Resolution Systems Institute's library
  entry says 'As of 2011, the act had been adopted by 10 states and the District
  of Columbia.' (project analysis) Use the ULC map for the official current count
  before publication.
