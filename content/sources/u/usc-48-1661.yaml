notes: Read on Cornell LII on Nov. 22, 2026. Act of Feb. 20, 1929, ch. 281, 45 Stat. 1253, as amended May 22, 1929, ch. 6, 46 Stat. 4. The statute ratifies the cessions "as of April 10, 1900, and July 16, 1904," while the instruments printed in Foreign Relations of the United States are dated April 17, 1900 and July 14, 1904; both dates are reported, not reconciled. The stored copy is 48 U.S.C. § 1661 from the 2024 edition of the Code on GovInfo (the text with its notes), saved by scripts/law/us_code_sections.py.
