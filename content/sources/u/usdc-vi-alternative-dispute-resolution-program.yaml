annotation: >-
  The program page of the federal district court for the Virgin Islands, which is
  distinct from the local Superior Court. It says the Court "encourages and promotes
  the use of alternative dispute resolution." It lists mediation, arbitration with
  court review, early neutral evaluation, limited settlement-focused discovery, and
  "mini" trials. Magistrate Judges and Senior District Judges conduct mediation "at
  no cost," and the court "may order settlement conferences in appropriate cases."
  The page points to Local Rule of Civil Procedure 3.2 for mediation. (project analysis)
  The V.I. therefore has two parallel court-annexed ADR systems, federal (LRCi 3.2)
  and local (V.I. R. Civ. P. 90). Federal court ADR in the territories is the federal
  agent's domain and is included here only briefly.
