annotation: >-
  The United States' December 2010 statement reversing its 2007 vote against the Declaration. It says
  the United States "supports the Declaration, which—while not legally binding or a statement of current
  international law—has both moral and political force," and that the Declaration expresses aspirations
  the United States "seeks to achieve within the structure of the U.S. Constitution, laws, and international
  obligations." (project analysis) This sets the weight a model code commentary can give UNDRIP in the
  United States: persuasive and aspirational, not binding law.
