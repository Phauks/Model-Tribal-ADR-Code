annotation: >-
  Section 652(a) requires each district court, by local rule, to "require that litigants
  in all civil cases consider the use of an alternative dispute resolution process"
  and to offer at least one ADR process; courts may require ADR only for mediation,
  early neutral evaluation, and, with consent, arbitration. Section 652(b) allows
  exemptions in consultation with the bar and the U.S. Attorney, and § 652(d) directs
  courts to provide by local rule for confidentiality of ADR processes. (project
  analysis) The consider-ADR mandate with a consent requirement for binding processes
  is a useful middle path for a Tribal code deciding how far Tribal courts may compel
  participation.
