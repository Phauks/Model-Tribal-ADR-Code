annotation: >-
  How a uniform or model act is made: the Committee on Scope and Program takes proposals, a Study Committee may recommend drafting, and a Drafting Committee works with a hired "Reporter" (drafter). "All committee drafts are posted on the ULC website for review and comment," and "Each draft act receives a minimum of two years of consideration." An act may be called a "model" act if its purposes "can be substantially achieved even if the act is not adopted in its entirety by every state."
