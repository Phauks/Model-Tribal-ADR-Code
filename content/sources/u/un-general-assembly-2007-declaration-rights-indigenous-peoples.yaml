annotation: >-
  The Declaration adopted by General Assembly resolution 61/295 on Sept. 13, 2007. Article 40 gives Indigenous
  peoples "the right to access to and prompt decision through just and fair procedures for the resolution
  of conflicts and disputes with States or other parties" and says such a decision "shall give due consideration
  to the customs, traditions, rules and legal systems of the indigenous peoples concerned and international
  human rights." Article 34 recognizes the right to maintain "juridical systems or customs, in accordance
  with international human rights standards"; Article 27 calls for a "fair, independent, impartial, open
  and transparent process" for land rights; Article 32(3) calls for "effective mechanisms for just and
  fair redress"; Article 37 concerns the "recognition, observance and enforcement of treaties." Article
  46(2) subjects the exercise of the rights to human rights limits. (project analysis) Article 40 is the
  closest international text to a standard for dispute resolution between a nation and outsiders, and
  its two parts (prompt, fair procedure; due consideration of the people's own law) map onto a model code's
  process rules and its choice-of-law rules.
