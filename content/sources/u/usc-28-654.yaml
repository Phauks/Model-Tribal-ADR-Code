annotation: >-
  Section 654(a) lets a district court refer a civil action to arbitration "when
  the parties consent," but not where the action alleges a constitutional-rights
  violation, rests on 28 U.S.C. § 1343 civil-rights jurisdiction, or seeks more than
  $150,000; § 654(b) requires local-rule safeguards ensuring consent is "freely and
  knowingly obtained" and that no one is prejudiced for refusing. Sections 655–658
  (not separately opened here) cover arbitrator powers, subpoenas, awards and trial
  de novo, and compensation. (project analysis) The civil-rights carve-out is worth
  discussing in commentary on whether Tribal courts should exclude Indian Civil Rights
  Act claims from court-annexed arbitration.
