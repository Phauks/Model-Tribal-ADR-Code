annotation: >-
  The official text of the Revised Uniform Arbitration Act (RUAA), approved at the
  ULC annual conference in St. Augustine, Florida, July 28-August 4, 2000. The Prefatory
  Note gives the history of the 1955 UAA and lists 14 issues the old act left open,
  including arbitrability, provisional remedies, consolidation, arbitrator disclosure,
  immunity, and electronic records. Nevada enacted the RUAA as NRS 38.206-38.248
  (see nevada-revised-statutes-38-206). The ULC catalog now lists only one 'Arbitration
  Act' entry, with 'Arbitration Act 1956' shown under Related Versions. The 1955/1956
  text was not opened. (project analysis) For a Tribal code, the RUAA is the most
  complete off-the-shelf model for court support of private arbitration. Its non-waivable
  sections (RUAA § 4) are a useful list of minimum fairness guarantees.
