annotation: >-
  The Violence Against Women Act full-faith-and-credit provision. Under subsection
  (a), a protection order issued consistently with subsection (b) by a State, Indian
  tribe, or territory must be given full faith and credit and enforced by the courts
  of every other State, Tribe, and territory. Subsection (e) affirms that a Tribal
  court has 'full civil jurisdiction to issue and enforce protection orders involving
  any person' in matters arising in the Tribe's Indian country. (project analysis)
  A Tribal ADR code should not send protection-order matters to mediation in a way
  that delays or replaces an enforceable order. Any agreement reached in ADR that
  is meant to travel to other jurisdictions should be entered as a court order that
  meets § 2265(b).
