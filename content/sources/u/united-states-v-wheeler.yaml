case_box:
  background: |-
    In 1974 a Navajo police officer arrested Wheeler, a Navajo citizen, at the Bureau of Indian Affairs high school in Many Farms, Arizona. He pleaded guilty in the Navajo Tribal Court to disorderly conduct and contributing to the delinquency of a minor. A year later a federal grand jury indicted him for statutory rape arising from the same incident, and he moved to dismiss on double jeopardy grounds [@united-states-v-wheeler, pp. 314-315].
  question: |-
    Does the Double Jeopardy Clause bar a federal prosecution of a Navajo citizen after his conviction in Navajo Tribal court for an offense arising from the same incident?
  holding: |-
    No. The Court held that the Navajo Nation's power to punish its own members is an aspect of retained, inherent sovereignty, not delegated federal power, so Tribal and federal prosecutions are by separate sovereigns.
  quotes:
  - text: "The sovereignty that the Indian tribes retain is of a unique and limited character. It exists only at the sufferance of Congress and is subject to complete defeasance."
    pinpoint: "p. 323"
  - text: "... the power to punish offenses against tribal law committed by Tribe members, which was part of the Navajos' primeval sovereignty, has never been taken away from them ..."
    pinpoint: "p. 328"
  treatment: |-
    *United States v. Lara* (2004) extends the separate-sovereign analysis to Tribal prosecutions of nonmember Indians after the 1990 "Duro fix"; *Denezpi v. United States* (2022) addresses Courts of Indian Offenses. [@united-states-v-lara]
  topics:
  - "Tribal courts"
  - "Criminal jurisdiction"
  reading:
    title: "*United States v. Wheeler* (1978)"
    text: |-
      Confirms that Tribal justice systems exercise inherent, not delegated, authority; this is the legal basis for a nation's own courts.
