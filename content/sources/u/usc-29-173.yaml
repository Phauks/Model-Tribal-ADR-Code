annotation: >-
  Section 173(a) makes it FMCS's duty "to assist parties to labor disputes in industries
  affecting commerce to settle such disputes through conciliation and mediation";
  § 173(f) lets FMCS make its services available to federal agencies under the ADRA,
  including assisting with administrative-program disputes, training, and furnishing
  neutrals and arbitrators. (project analysis) The statutory floor that the 2025
  executive order could not eliminate (see eo-14238-2025-fmcs); also a model for
  a Tribal labor-relations ordinance that designates a mediation service.
