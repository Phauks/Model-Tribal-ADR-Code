annotation: >-
  As amended by the Alternative Dispute Resolution Act of 1998, Pub. L. 105-315,
  § 3 (Oct. 30, 1998), 112 Stat. 2993, § 651 defines an ADR process for federal district
  courts, requires each district court to authorize ADR by local rule and "devise
  and implement its own alternative dispute resolution program," requires a designated
  ADR administrator (§ 651(d)), preserves title 9 (§ 651(e)), and authorizes FJC
  and AO support (§ 651(f)). (project analysis) The § 651(a) definition ("other than
  an adjudication by a presiding judge") and the court-program mandate are a clean
  template for a Tribal court ADR chapter that sits alongside, rather than replacing,
  peacemaking (which the project treats as its own track).
