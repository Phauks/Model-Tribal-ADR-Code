annotation: >-
  The general statute that implements the Full Faith and Credit Clause. Its text
  names States, Territories, and Possessions; it does not mention Indian tribes.
  Wilson v. Marchington, 127 F.3d 805 (9th Cir. 1997), held that § 1738 does not
  reach Tribal judgments, so recognition in federal court rests on comity. (project
  analysis) Most Tribal ADR outcomes, and the Tribal court judgments that confirm
  them, will therefore be recognized outside the Tribe under comity, state statutes,
  or court rules, not under § 1738. The exceptions are the subject-specific statutes
  (25 U.S.C. § 1911(d), 18 U.S.C. § 2265, 28 U.S.C. § 1738B).
