annotation: >-
  Sections 9–11 set the post-award framework: § 9 provides that on application within
  one year the court "must grant" an order confirming the award "unless the award
  is vacated, modified, or corrected as prescribed in sections 10 and 11"; § 10(a)
  lists four grounds for vacatur (corruption/fraud/undue means, evident partiality,
  arbitrator misconduct, and exceeding powers); § 11 allows modification for evident
  miscalculation, awards on matters not submitted, and defects of form (pages for
  §§ 9 and 11 also opened on LII). Section 10(c) separately allows a nonparty adversely
  affected by an award issued under 5 U.S.C. § 580 (Administrative Dispute Resolution
  Act) to seek vacatur. Hall Street Associates v. Mattel (2008) treats the §§ 10–11
  grounds as exclusive for expedited FAA review. (project analysis) A Tribal code's
  recognition-and-enforcement chapter will likely track these grounds; whether to
  add grounds (e.g., violation of Tribal public policy or custom) is a drafting choice
  the commentary should flag against the federal baseline.
