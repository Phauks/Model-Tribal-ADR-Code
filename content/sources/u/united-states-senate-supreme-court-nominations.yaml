notes: 'A table of every nomination to the Supreme Court by President, with the nominee, the seat, the date the Senate received it, the vote and the action (C confirmed, R rejected, W withdrawn, N no action). Under President Andrew Johnson it lists one nomination: Henry Stanbery, to the seat of John Catron, received Apr. 16, 1866, action N. Read Nov. 27, 2026.'
