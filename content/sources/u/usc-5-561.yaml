annotation: >-
  The Negotiated Rulemaking Act, 5 U.S.C. §§ 561–570a, was added by Pub. L. 101-648
  (1990), 104 Stat. 4970; its original six-year sunset was repealed by Pub. L. 104-320,
  § 11(a) (1996) (LII notes). Section 561 states the Act's purpose: a framework for
  negotiated rulemaking "consistent with section 553" to encourage agencies to use
  the process. (project analysis) Federal agencies have used negotiated rulemaking
  committees with Tribal representatives (for example under the Indian Self-Determination
  Act); a Tribal ADR code could authorize the Tribe's own agencies to use negotiated
  rulemaking with its citizens and enterprises.
