annotation: >-
  The Uniform Law Commission's enactment table for the Uniform Child Custody Jurisdiction
  and Enforcement Act (1997), with data "as of" November 21, 2026, lists 51 enacting
  jurisdictions: every state except Massachusetts (where it is marked "Introduced"),
  plus the District of Columbia and the U.S. Virgin Islands. Puerto Rico shows no
  enactment. The table does not say which enacting jurisdictions adopted the optional
  section 104 text treating Tribes as states; Nevada did [@nevada-revised-statutes-125a-215].
  (project analysis) Because nearly every state has the act, section 104 is the most
  widely available route by which state courts treat Tribal custody orders as they
  would another state's.
