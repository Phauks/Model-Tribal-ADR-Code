annotation: >-
  The Uniform Law Commission's enactment table for the Family Law Arbitration Act
  (2016), with data "as of" November 21, 2026, lists 9 enacting jurisdictions: Arizona,
  the District of Columbia, Hawaii, Iowa, Montana, North Dakota, Pennsylvania, Utah
  and Washington, with bills introduced in Kansas and Massachusetts. Nevada shows
  no enactment. (project analysis) Few states have adopted it, so its optional treatment
  of a federally recognized Tribe as a state [@uniform-law-commission-family-law-arbitration-act-2016]
  has little enacted practice behind it yet.
