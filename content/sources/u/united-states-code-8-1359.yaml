  detail: >-
    Yellow flag for proposed legislation only: S. 2577 and H.R. 4596 (119th Cong., introduced July 2025)
    would amend the section. No court has held it invalid. Section unchanged since 1952 (66 Stat. 234,
    one version). Seven Notes of Decisions, from four cases (Akins v. Saxbe, 380 F. Supp. 1210 (D. Me. 1974); United States
    ex rel. Goodwin v. Karnuth, 74 F. Supp. 660 (W.D.N.Y. 1947); United States v. Curnew, 788 F.2d 1335 (8th
    Cir. 1986); Craghtten v. United States, 790 F. Supp. 3d 984 (D. Idaho 2025), aff'd, 2026 WL 1746965);
    none concerns Indigenous people born in Mexico. Recording a yellow proposed-legislation flag as no
    negative treatment is project analysis. Westlaw printout in the private captures
    (westlaw/usc-8-1359-keycite-2026-11-22.pdf).
