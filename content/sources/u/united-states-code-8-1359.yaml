annotation: Preserves "the right of American Indians born in Canada to pass the borders of the United States," limited
  to persons with at least 50 percent Indian blood. (project analysis) There is no parallel provision for Indigenous
  people born in Mexico; the Texas Band of Kickapoo Act is a nation-specific exception.
