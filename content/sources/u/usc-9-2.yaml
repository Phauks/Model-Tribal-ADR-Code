annotation: >-
  Section 2 is the core validity provision of the Federal Arbitration Act (FAA),
  derived from the Act of Feb. 12, 1925, ch. 213, § 2, 43 Stat. 883, and codified
  by the Act of July 30, 1947, ch. 392, 61 Stat. 670. It makes a written arbitration
  provision in a maritime transaction or a contract "evidencing a transaction involving
  commerce" "valid, irrevocable, and enforceable, save upon such grounds as exist
  at law or in equity for the revocation of any contract or as otherwise provided
  in chapter 4"; the chapter 4 clause was added by Pub. L. 117-90, § 2(b)(1)(A) (2022)
  (LII credits and amendment note). (project analysis) Any Tribal ADR code provision
  on enforceability of arbitration agreements will be read against § 2, because federal
  and state courts asked to compel arbitration or enforce awards involving Tribal
  parties apply it to contracts involving commerce; the drafting should state clearly
  whether the Tribal code is meant to mirror § 2's equal-footing rule.
