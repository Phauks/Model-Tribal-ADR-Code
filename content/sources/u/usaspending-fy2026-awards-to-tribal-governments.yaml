notes: 'The amount each awarding agency obligated to each recipient from Oct. 1, 2025 to Sept. 30, 2026, on all of the recipient''s transactions, from the USAspending API (spending_by_category/awarding_agency, filtered by recipient and period), for the recipients USAspending lists as an Indian/Native American Tribal Government that are a nation''s own government (research/federal-awards/crosswalk.csv, from scripts/tribes/federal_awards.py). Obligations as agencies reported them; an amount can be negative where an agency took back more than it awarded. Separate bodies such as health boards, housing authorities, schools, businesses and consortia are not included. Private copy research/captures/federal-awards/.'
