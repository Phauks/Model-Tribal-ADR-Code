annotation: >-
  Section 5604 states the Udall Foundation's purposes, including a program "for environmental
  conflict resolution and training at the National Center" (para. (4)), training
  Native American and Alaska Native professionals through the Native Nations Institute
  (para. (7)), and establishing "the John S. McCain III National Center for Environmental
  Conflict Resolution to assist the Federal Government in implementing section 4331
  of title 42 by providing assessment, mediation, and other related services" (para.
  (8)). (project analysis) Statutory basis for the federal environmental-conflict
  neutral that works with Tribes; cite with udall-ncecr-native-nations.
