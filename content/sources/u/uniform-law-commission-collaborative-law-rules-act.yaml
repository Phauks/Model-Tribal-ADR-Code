annotation: >-
  The ULC's combined Uniform Collaborative Law Rules/Act (UCLR/A), approved at the
  July 9-16, 2009 annual conference in Santa Fe and amended in 2010 (title page).
  The act can be enacted by court rule, by statute, or both. It requires a signed
  participation agreement, disqualifies the collaborative lawyers from later litigation,
  creates a privilege for collaborative law communications, and requires lawyers
  to screen for coercive or violent relationships. The ULC Summary in the Enactment
  Kit describes collaborative law as 'a form of limited scope representation (where
  an attorney is retained solely for the purpose of reaching a settlement, and expressly
  not for the purpose of litigation).' Nevada enacted it as NRS 38.400-38.575 (2011).
  (project analysis) Because the UCLR/A can be adopted as court rules, it is a ready
  model for a Tribal court that has rulemaking power but no legislature willing to
  act.
