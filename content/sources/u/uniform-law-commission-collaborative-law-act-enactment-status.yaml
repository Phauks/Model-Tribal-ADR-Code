annotation: >-
  The Uniform Law Commission's enactment table for the Collaborative Law Act (2010),
  with data "as of" November 21, 2026, lists 28 enacting jurisdictions: Alabama,
  Arizona, Colorado, Connecticut, the District of Columbia, Florida, Hawaii, Illinois,
  Kentucky, Louisiana, Maryland, Michigan, Mississippi, Montana, Nevada, New Hampshire,
  New Jersey, New Mexico, North Carolina, North Dakota, Ohio, Oklahoma, Pennsylvania,
  Tennessee, Texas, Utah, Virginia and Washington. Its bill list shows Connecticut
  and Oklahoma enactments effective in 2025.
