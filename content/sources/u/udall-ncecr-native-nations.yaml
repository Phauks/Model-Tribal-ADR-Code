annotation: >-
  The John S. McCain III National Center for Environmental Conflict Resolution, part
  of the federal Udall Foundation, describes its Native Nations work: it "may serve
  as a trusted third-party neutral" in environmental and natural-resources disputes
  "between Native Nations, Federal agencies, and other parties," assists federal
  agencies in assessing Tribal engagement, and offers training; listed service areas
  include NEPA, NHPA, and ESA matters, government-to-government consultation, and
  "Traditional cultural property and sacred sites." The page grounds the work in
  the federal government-to-government relationship and trust responsibility. (project
  analysis) The main federal neutral for Tribal-federal environmental disputes; relevant
  to a model code's provisions on intergovernmental dispute resolution and on choosing
  neutrals acceptable to Tribal governments.
