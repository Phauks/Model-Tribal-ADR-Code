annotation: >-
  The Uniform Law Commission's enactment table for the Revised Uniform Arbitration
  Act (2000), with data "as of" November 21, 2026, lists 23 jurisdictions enacting
  the 2000 revision: Alaska, Arizona, Arkansas, Colorado, Connecticut, the District
  of Columbia, Florida, Hawaii, Kansas, Michigan, Minnesota, Nevada, New Jersey,
  New Mexico, North Carolina, North Dakota, Oklahoma, Oregon, Pennsylvania, Tennessee,
  Utah, Washington and West Virginia. A further column marks 29 jurisdictions as
  having enacted the prior 1956 version, several of which later adopted the revision.
  Puerto Rico and the U.S. Virgin Islands show no enactment. (project analysis) Puerto
  Rico's Ley 147-2024 follows the revised act in substance [@pr-ley-147-2024-ley-de-arbitraje]
  but is not counted here.
