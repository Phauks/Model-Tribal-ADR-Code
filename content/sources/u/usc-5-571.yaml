annotation: >-
  Section 571 supplies the definitions for the Administrative Dispute Resolution
  Act (ADRA), 5 U.S.C. §§ 571–584, enacted by Pub. L. 101-552 (1990) and made permanent
  and amended by the Administrative Dispute Resolution Act of 1996, Pub. L. 104-320,
  110 Stat. 3870 (LII notes). The § 571(3) definition of "alternative means of dispute
  resolution" is open-ended ("including, but not limited to") and the 1996 Act added
  "use of ombuds" and deleted "settlement negotiations" from the list (LII amendment
  notes). The statutory note to § 571 (Pub. L. 101-552, § 3, as amended by Pub. L.
  104-320, § 4(a)) requires each agency to "adopt a policy that addresses the use
  of alternative means of dispute resolution and case management," designate a dispute
  resolution specialist, and provide training. (project analysis) The open-list,
  definition-first structure and the agency policy/specialist/training model are
  directly reusable for a Tribal government's own administrative ADR chapter.
