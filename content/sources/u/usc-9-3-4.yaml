annotation: >-
  Section 3 requires a federal court, once "satisfied that the issue involved in
  such suit or proceeding is referable to arbitration," to stay the trial on application
  of a party; § 4 lets a party aggrieved by another's refusal to arbitrate petition
  a district court for an order compelling arbitration, and requires a summary trial
  if the making of the agreement is in issue (both opened on LII; second page https://www.law.cornell.edu/uscode/text/9/4).
  Smith v. Spizzirri (2024) (see smith-v-spizzirri-2024) holds that the § 3 stay
  is mandatory when requested. (project analysis) These two sections are the procedural
  model most Tribal and state arbitration codes copy (stay of litigation plus an
  order compelling arbitration); a Tribal code can adopt the same pairing for its
  own courts while deciding separately who decides disputes over the existence of
  the agreement.
