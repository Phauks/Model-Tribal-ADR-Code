notes: 'Definitions for the Federally Recognized Indian Tribe List Act. Read on the Legal Information Institute''s site; citator check not yet run. Legal history session (2026-11-21): Citations: Pub. L. No. 103-454, tit. I; 108 Stat. 4791; 25 U.S.C. §§ 5130–5131 (formerly §§ 479a, 479a-1). Also read: https://www.law.cornell.edu/uscode/text/25/5131. Later history: List published annually in the Federal Register; the Lumbee Fairness Act (2025) uses the list as its definition of ''federally recognized Indian tribe''. Current list year/count not verified. Westlaw: KeyCite 25 U.S.C. § 5131; pull the current Federal Register list. The stored copy is 25 U.S.C. § 5130 from the 2024 edition of the Code on GovInfo (the text with its notes), saved by scripts/law/us_code_sections.py.'
law_box:
  summary: |-
    Requires an annual list of recognized nations and states that recognition may come from an Act of Congress, the Part 83 process or a court decision [@usc-25-5130, sec. 103(3)].
  reading:
    title: "Federal recognition under the Federally Recognized Indian Tribe List Act (1994)"
    text: |-
      Most state rules for enforcing Tribal judgments apply only to courts of federally recognized nations, so list status can decide whether a judgment is enforceable off the reservation.
