annotation: >-
  Section 471, added by Pub. L. 101-650, title I, § 103(a) (Dec. 1, 1990), 104 Stat.
  5090, required each district court to implement a "civil justice expense and delay
  reduction plan"; § 473(a)(6) listed among plan principles "authorization to refer
  appropriate cases to alternative dispute resolution programs," naming "mediation,
  minitrial, and summary jury trial" (https://www.law.cornell.edu/uscode/text/28/473).
  A statutory note (§ 103(b)(2)(A)) provides that §§ 471–475, 477, and 478 "shall
  remain in effect for seven years" after enactment, while § 476 is permanent. FJC
  describes its 1992 Manual for Litigation Management and Cost and Delay Reduction
  as "Prepared in response to a mandate of the Civil Justice Reform Act of 1990"
  (https://www.fjc.gov/content/316666/cjra-judiciary-publications). (project analysis)
  Historical background for why federal district courts built ADR programs in the
  1990s; the advisory-group process is a possible model for Tribal court rulemaking
  with community input.
