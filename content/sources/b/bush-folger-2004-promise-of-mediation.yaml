annotation: >-
  The revised edition of the book that introduced 'transformative' mediation. The
  Wiley/Jossey-Bass page lists the Revised Edition, October 2004, ISBN 978-0-7879-7483-1
  (books often cite it as 2005). (project analysis) Transformative mediation aims
  at party empowerment and mutual recognition rather than settlement. The project
  can record it as a style of mediation (an attribute) rather than a separate method.
  Its relational goals are sometimes compared with peacemaking, but the project keeps
  them distinct.
