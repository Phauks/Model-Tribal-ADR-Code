notes: 'A treaty of the Hawaiian Kingdom, not of the United States with a Native nation; the database lists it among its Hawaiian Kingdom documents. A general convention between Great Britain and the Hawaiian Kingdom ("the King of the Sandwich Islands"), Mar. 26, 1846. Header: "March 26, 1846". Listed in the Oklahoma State University Tribal Treaties Database, which reproduces the text; metadata generated by scripts/law/treaty_records.py. Text check, Nov. 24, 2026 (research/reviews/2026-11-24-treaty-verification-other.csv): the database holds the document with a scan of it, and its date matches the record. Stored text, Nov. 28, 2026 (scripts/law/treaty_texts.py): the pages that hold it in Treaties and Conventions Concluded Between the Hawaiian Kingdom and Other Powers, Since 1825 (pp. 9–11), from the Internet Archive scan''s text layer; the database''s transcription is not copied. It stays Unverified.'
