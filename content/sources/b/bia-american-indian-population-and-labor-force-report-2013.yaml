notes: 'Downloaded directly with curl (bia.gov did not block). The report has no tribal enrollment column;
  Appendix Table 2 (PDF pages 75-91) gives 2010 population indicators: (1) service area population from
  the 2010 Indian Affairs survey, (2) American Indian and Alaska Native alone-or-in-combination population
  in the tribal statistical area, (3) the same in nearby counties, (4) information from other sources.'
