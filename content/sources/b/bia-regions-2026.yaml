notes: >-
  The Bureau of Indian Affairs' own boundaries of its twelve regions (Alaska,
  Eastern, Eastern Oklahoma, Great Plains, Midwest, Navajo, Northwest,
  Pacific, Rocky Mountain, Southern Plains, Southwest, Western), listed in the
  data.gov catalog as "BIA Regions" (catalog.data.gov/dataset/bia-regions).
  The layer's description says each regional office "is responsible for all
  Bureau activities within a defined geographical area except education, law
  enforcement and functions of an administrative nature." The regions are
  administrative areas of a federal agency, not the lands of any nation; the
  Navajo Region's outline follows the Navajo Nation's land as the Bureau draws
  it. Queried in full on 2026-11-21 (12 polygons, NAD83, returned as
  longitude and latitude).
