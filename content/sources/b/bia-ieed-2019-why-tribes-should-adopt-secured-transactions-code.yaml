annotation: >-
  An Interior Department primer on the Model Tribal Secured Transactions Act. It says the National Conference
  of Commissioners on Uniform State Laws "and a working group of tribal officials" drafted the Act "as
  a template for legislation by tribes," that it was "created in 2004 and revised in 2017," and that it
  differs from Uniform Commercial Code Article 9 while keeping principles similar enough for practitioners
  to work across tribal and state jurisdictions. It cites the Commission's 2017 Implementation Guide and
  Commentary and lists nations funded to explore adopting codes modeled on it in 2005 and 2006. (project
  analysis) The only Uniform Law Commission model written for Native nations to enact that this research
  found; its process (a Commission drafting committee working with tribal officials, plus an implementation
  guide) is a precedent for how a model tribal ADR code could be built and explained.
