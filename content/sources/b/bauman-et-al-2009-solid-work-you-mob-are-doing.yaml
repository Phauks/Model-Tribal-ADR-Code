annotation: >-
  A report commissioned by the National Alternative Dispute Resolution Advisory Council and carried out
  by the Federal Court of Australia with the Australian Institute of Aboriginal and Torres Strait Islander
  Studies. Per the catalog abstract, it presents findings on "effective practices for managing conflict
  involving Indigenous people" through snapshot studies and three main case studies (a mediation at Halls
  Creek, Western Australia; a New South Wales Community Justice Centre mediation; and the Tiwi Youth Diversion
  and Development Unit) and "identifies a number of critical factors for effective practice." An earlier
  AIATSIS seminar from the same research program (Bauman, Indigenous Facilitation and Mediation Project
  final seminar, July 11, 2006) lists as a principle that "Decisions and processes must be fully informed
  and owned for outcomes to be sustainable - prior and informed consent." (project analysis) The report
  itself was not read; it is listed so the commentary can draw on Australian practice research rather
  than on statutes alone.
