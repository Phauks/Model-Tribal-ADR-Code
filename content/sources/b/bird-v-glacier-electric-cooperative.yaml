case_box:
  background: |-
    Ron Bird and Herb Gilham, Blackfeet members, and Scott Sherburne owned Glacier Construction, which worked mostly for Glacier Electric Cooperative, a cooperative based off the reservation and controlled by nonmembers. In 1992 the Co-op canceled all of its agreements with the company [@bird-v-glacier-electric-cooperative, p. 1139]. A Blackfeet Tribal Court jury awarded the owners $1,382,181.60 in compensatory and $775,000 in punitive damages, and they sought to enforce the judgment in federal court [@bird-v-glacier-electric-cooperative, p. 1140].
  question: |-
    May a federal court recognize a Blackfeet Tribal Court jury verdict against a non-member-owned cooperative when the plaintiff's closing argument appealed to racial and ethnic prejudice?
  holding: |-
    No. Applying *Wilson v. Marchington*, the court held that the closing argument's appeals to racial prejudice offended fundamental fairness and denied due process, so the Tribal judgment was not entitled to comity; it reversed with instructions to enter judgment denying recognition.
  quotes:
  - text: "We hold that Glacier Construction's appeal to racial prejudice in closing argument in its civil case in tribal court offended fundamental fairness and violated due process owed the Co-op."
  topics:
  - "Recognition of Tribal judgments (comity)"
  - "Enforcement of awards, orders and judgments"
  - "Tribal courts"
  reading:
    title: "*Bird v. Glacier Electric Cooperative, Inc.* (2001)"
    text: |-
      Shows the due-process ground for refusing recognition in practice.
