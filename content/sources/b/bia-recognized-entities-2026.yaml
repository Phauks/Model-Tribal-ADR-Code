notes: >-
  91 Fed. Reg. 4102 (Jan. 30, 2026). The current list of federally recognized
  Tribal entities, which the notice counts as 575. It updates the list of
  Dec. 11, 2024 (89 Fed. Reg. 99899) and adds the Lumbee Tribe of North
  Carolina after the National Defense Authorization Act for Fiscal Year 2026,
  Pub. L. No. 119-60, § 8803. A Federal Register search on 2026-11-21 found no
  later list. The entries were read from the govinfo.gov text edition
  (https://www.govinfo.gov/content/pkg/FR-2026-01-30/html/2026-01899.htm);
  page locators in profiles come from its page markers.
