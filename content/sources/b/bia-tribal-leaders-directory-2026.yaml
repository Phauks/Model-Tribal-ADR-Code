  basis_note: >-
    Only office contact points, Bureau of Indian Affairs region and agency,
    Alaska regional corporation and the title of the leader's office (in the
    office's own form, recorded from Nov. 23, 2026; decision record 0042) are
    recorded. Where the email field holds a nation's general office account
    (such as info@ or admin@), that address is recorded too (lead author's
    decision, Nov. 23, 2026). Names, the officials' own email addresses and
    election dates are not copied (charter, commitment 1).
