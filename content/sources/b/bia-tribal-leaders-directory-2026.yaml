notes: >-
  The Bureau of Indian Affairs' directory of contact information for each
  federally recognized Tribal entity, also published as a web map at
  https://www.bia.gov/service/tribal-leaders-directory. Queried in full
  (602 rows, including component bands and villages) on 2026-11-21; the
  service reported its data last edited on 2026-11-20. The archived copy is of
  the directory's web page, because the query service itself is not archived.
