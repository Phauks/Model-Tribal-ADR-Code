  basis_note: >-
    Only office contact points, Bureau of Indian Affairs region and agency,
    Alaska regional corporation and the title of the leader's office (in the
    office's own form, recorded from Nov. 23, 2026; decision record 0035) are
    recorded. Names, email addresses and election dates of officials in the
    dataset are not copied (charter, commitment 1).
