annotation: >-
  Magistrate Judge Wayne Brazil (N.D. Cal.) looks back at court-connected ADR 25
  years after the Pound Conference. He calls Sander 'the spiritual father of court
  ADR' and argues that ADR is 'about being in addition to', not 'better than', litigation.
  He reports that courts 'have also fallen far short of making real Professor Sander's
  vision of the multi-door courthouse', because many programs 'offer essentially
  only one process-a malleable, hybrid form of mediation', while nonbinding court-connected
  arbitration is 'threatened with extinction'. (project analysis) This is a useful
  caution for a Tribal code: a menu of processes on paper tends to shrink to a single
  default unless intake, funding, and neutral rosters support each option.
