notes: Big Lagoon Rancheria v. California, 789 F.3d 947 (9th Cir. 2015) (en banc). The en banc court affirmed summary
  judgment for the tribe on its claim that California failed to negotiate in good faith, holding that the State's
  challenge to the trust acquisition and tribal status was an improper collateral attack on BIA decisions. The opinion
  was amended by order of July 8, 2015. Read on the original link. Citator check (KeyCite) pending; see the project's
  Westlaw list.
