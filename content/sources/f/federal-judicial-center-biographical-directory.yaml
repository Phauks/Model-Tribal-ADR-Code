notes: 'One row per judicial appointment. For the 121 Supreme Court appointments it gives the appointing President, the seat (Seat ID, such as SCT0603 for the third holder of seat 6), the statute that created a new seat, and how service ended (Termination, Senior Status Date). Where Termination is death but a senior status date matches the Court''s end of service, the Justice retired first.'
