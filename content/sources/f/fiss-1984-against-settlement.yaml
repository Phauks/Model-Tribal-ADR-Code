annotation: >-
  The canonical critique of the ADR movement. Fiss notes that the movement 'has even
  received its own acronym-ADR (Alternative Dispute Resolution)' and argues that
  settlement 'is a truce more than a true reconciliation'. In his view it is 'the
  civil analogue of plea bargaining' and 'should be neither encouraged nor praised'.
  His concerns are coerced consent, imbalances of power, lack of authority to bind,
  and the loss of public adjudication. In a 1985 reply ('Out of Eden', 94 Yale L.J.
  1669, also opened), Fiss answered McThenia & Shaffer's 'For Reconciliation', 94
  Yale L.J. 1660, which offered a religious-community model of reconciliation. (project
  analysis) A model Tribal code should answer Fiss directly: protect against coercion
  and power imbalance, keep certain matters in court, and explain why peacemaking,
  which seeks reconciliation rather than a 'truce', is a separate track and not 'settlement'.
