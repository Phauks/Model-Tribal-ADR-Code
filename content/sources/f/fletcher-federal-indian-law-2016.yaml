notes: Existence, title, edition, publisher, year and ISBN confirmed in the Berkeley Law library catalog (lawcat record 194612, MARC export) on Nov. 22, 2026. The text was not read for this record; nothing in the project cites it for a specific point yet. West Academic Hornbook Series. Lawcat also lists Principles of Federal Indian Law (2017), a shorter companion (records 97418, 92699). No later edition of the hornbook was found in lawcat on Nov. 22, 2026.
