annotation: A hornbook; the catalog summary calls it "a deep survey of the history and substantive law governing the relations between" Native nations and the United States. (project analysis) A current single-volume treatise by a Native scholar (Fletcher, Grand Traverse Band), and a second treatise beside Cohen's Handbook for checking doctrinal statements in the timeline.
