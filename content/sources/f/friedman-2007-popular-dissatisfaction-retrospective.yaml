annotation: >-
  A centennial retrospective on Roscoe Pound's 1906 address to the American Bar Association,
  'The Causes of Popular Dissatisfaction with the Administration of Justice'. The
  1976 Pound Conference took its name and theme from that address. Friedman's footnote
  1 dates the address to the ABA Annual Convention of Aug. 29, 1906, and his text
  places the gathering in the Capitol building in St. Paul, Minnesota. Friedman's
  note 1 cites a reprint 'in 14 AM. LAW. 445'; the year printed there appeared as
  1996 in our reading tool and is probably a misprint for 1906. (project analysis)
  This is a citable secondary source for the history paragraph of the commentary.
  Trevor should cite Pound's address from its original printing, conventionally 29
  A.B.A. Rep. 395 (1906), which was NOT verified here.
