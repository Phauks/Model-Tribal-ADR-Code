annotation: >-
  A government-to-government agreement under which signatory First Nations replace the land provisions
  of the Indian Act with their own land codes. Each land code must "identify or establish a forum for
  the resolution of disputes in relation to interests or land rights in First Nation lands," including
  review of land management decisions (cl. 5.2(h)), and a First Nation may make laws on services "for
  the resolution, outside the courts, of disputes in relation to First Nation land" (cl. 18.2(e)). Part
  IX governs disputes between the parties: a commitment to resolve disputes "amicably and in good faith"
  (cl. 43.1); mediation in which the other party must attend an initial meeting but either may end the
  process afterward (cl. 43.2); neutral evaluation on one party's referral or arbitration on both parties'
  referral (cl. 43.3), with arbitration mandatory for expropriation compensation (cl. 43.4); jointly built
  rosters of neutrals who must be unbiased and qualified (cl. 44); arbitration under the Commercial Arbitration
  Code (cl. 46.2); awards "final and binding" (cl. 47.3); and judicial review only within 30 days for
  excess of jurisdiction or breach of natural justice (cl. 47.5). (project analysis) The clearest model
  found of a framework that both requires each nation to build its own internal dispute forum and supplies
  a tiered external process.
