annotation: >-
  Rule 16(c)(2)(I) lists among matters for consideration at a pretrial conference
  "settling the case and using special procedures to assist in resolving the dispute
  when authorized by statute or local rule"; Rule 16(c)(1) lets the court require
  a party or representative "be present or reasonably available by other means to
  consider possible settlement." (project analysis) The "special procedures ... when
  authorized by statute or local rule" phrasing shows the federal pattern of a short
  procedural hook in the general rules with the detail in local ADR rules, a structure
  a Tribal court could copy.
