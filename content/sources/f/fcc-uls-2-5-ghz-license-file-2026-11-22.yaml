notes: 'The FCC''s weekly complete file for the 2.5 GHz band, created Nov. 22, 2026. scripts/tribes/fcc_tribal_spectrum.py keeps every license whose market is a tribal land area (market codes beginning TL, the Rural Tribal Priority Window''s licenses): 426 licenses, 397 active, with call sign, status, grant and expiration dates and licensee, in research/fcc-tribal-spectrum/licenses.csv. Licensees are matched to nations by name and by research/fcc-tribal-spectrum/licensee-nations.csv. Each license''s own page is https://wireless2.fcc.gov/UlsApp/UlsSearch/license.jsp?licKey= followed by its unique system identifier.'
