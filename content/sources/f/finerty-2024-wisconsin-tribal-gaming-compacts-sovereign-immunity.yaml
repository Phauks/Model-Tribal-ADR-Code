annotation: Explains that the gaming compacts between Wisconsin and its eleven federally recognized tribes contain no clear waiver of sovereign immunity for third-party claims, and that the compacts require tribal carriers' insurers to limit their assertion of immunity. It gives practice points for defense counsel handling casino injury and contract claims against tribes. (project analysis)
