annotation: >-
  Law-firm blog post (Jan. 7, 2026) reporting that in March 2025 FMCS limited mediation
  to bargaining units of at least 250 healthcare or 1,000 other employees and cut
  staff to "only six mediators"; that E.O. 14238 was "permanently enjoined in November
  2025" in State of Rhode Island v. Trump; and that on Dec. 30, 2025, Judge Arun
  Subramanian (S.D.N.Y.) in American Federation of Teachers, AFL-CIO v. Davis vacated
  the FMCS policy as arbitrary and capricious and contrary to NLRA § 8(d), and ordered
  the reduction in force reversed. It also reports a Dec. 23, 2025 government notice
  of compliance in the Rhode Island case stating FMCS staff would be reinstated.
  (project analysis) Secondary source only; Trevor should pull the two court decisions
  and dockets for citation and check for any appeal or later FMCS developments in
  2026.
