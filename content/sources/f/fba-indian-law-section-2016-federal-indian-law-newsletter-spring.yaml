annotation: Spring 2016 newsletter of the Federal Bar Association Indian Law Section, with a budget update and regional and Supreme Court case summaries. Several summaries address tribal court jurisdiction, tribal exhaustion, tribal gaming commission licensing, and the use of tribal-court convictions, which bear on how federal and state courts review tribal forum decisions. (project analysis)
