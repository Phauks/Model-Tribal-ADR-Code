notes: Whole newsletter issue; editor-in-chief Trent S.W. Crable. Regional updates by Adam P. Bailey (California and Hawaii, at 4), Joey Lenzmeier and Ann Tweedy (Supreme Court, at 6), Nicole E. Ducheneaux (Plains, at 8) and Lauren J. King (Northwest, at 10). The California update summarizes a Pechanga gaming employee license revocation after notice and hearing (at 5).
