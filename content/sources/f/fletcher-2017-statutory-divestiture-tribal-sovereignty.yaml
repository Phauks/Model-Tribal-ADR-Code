annotation: Matthew Fletcher reviews the Supreme Court's decisions on tribal civil jurisdiction over nonmembers, using a case table from Montana through Dollar General v. Mississippi Band of Choctaw Indians (2016, affirmed by an equally divided Court). He argues the divestiture cases rest on federal statutes rather than implicit judicial doctrine. Relevant to tribal court forums because it bears on whether tribal courts can hear claims involving nonmembers and how consent to tribal jurisdiction in leases and contracts is treated. (project analysis)
