annotation: 'Part III.A, "Dispute Resolution Through Dialogue," records that Elders consulted since 2009
  "have shown their preference for dispute resolution through dialogue: talking things out to resolve
  disputes by agreement." The Court "will typically encourage parties to reach a settlement or narrow
  their issues in dispute through agreement. However, it is ultimately for the parties to decide." It
  quotes Federal Courts Rule 388: discussions in a dispute resolution conference "are confidential and
  shall not be disclosed." Part II.A provides for appointing a neutral advisor to the Court on Indigenous
  law (not read in detail).'
