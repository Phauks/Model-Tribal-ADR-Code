annotation: >-
  The Harvard Negotiation Project's book on principled, interest-based negotiation.
  Penguin Random House lists the Penguin Books paperback (ISBN 9780143118756) and
  e-book (9781101539545) as published May 3, 2011, 240 pages, by Roger Fisher, William
  L. Ury, and Bruce Patton. Menkel-Meadow (2000) names its publication as one of
  the markers people use to date the ADR movement. (project analysis) Its interest-based
  framework underlies most U.S. mediation training, and that is worth flagging when
  Tribal communities adapt imported training.
