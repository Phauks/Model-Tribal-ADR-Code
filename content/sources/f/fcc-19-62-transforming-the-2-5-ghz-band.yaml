notes: 'Indigo Book citation: Transforming the 2.5 GHz Band, Report and Order, 34 FCC Rcd 5446 (2019). Adopted July 10, 2019, released July 11, 2019; published at 84 Fed. Reg. 57,343 (Oct. 25, 2019). Paragraphs 47 to 65 (34 FCC Rcd at 5463-69, as FCC 20-183 cites them) set up the Rural Tribal Priority Window: before any auction, a federally recognized tribe or an entity it controls could apply for unassigned 2.5 GHz spectrum over its rural tribal lands. The legal basis shown with the 2.5 GHz licenses on nation pages.'
