annotation: >-
  Guidance published by the Federal ADR Council (DOJ) at 65 Fed. Reg. 83085 (Dec.
  29, 2000), prepared by a subcommittee of the Federal ADR Steering Committee and
  approved by the Federal ADR Council "chaired by the Attorney General"; the draft
  was published for comment at 65 Fed. Reg. 59200 (Oct. 4, 2000). It gives "detailed
  guidance on the nature and limits of confidentiality in Federal ADR programs" under
  the ADRA and "guidelines for a statement on" confidentiality for use with parties.
  The introduction explains that confidentiality "allows parties to speak openly
  without fear that statements made during an ADR process will be used against them
  later." (project analysis) The most practical federal explanation of how § 574
  works day to day, useful as a model for a Tribal code's commentary and for a standard
  confidentiality statement read at the start of sessions.
