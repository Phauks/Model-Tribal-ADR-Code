notes: Read in the slip opinion on govinfo on Nov. 22, 2026; Westlaw's text of 1 F.4th 862 (Trevor's print, Nov. 22, 2026) gives the land-ownership passage the timeline quotes at 866; the words "racially-based land alienation rules" are Tuaua's (788 F.3d at 310), not this opinion's. The reporter citation is confirmed by Westlaw and by the certiorari petition (No. 21-1394). Nos. 20-4017, 20-4019; Lucero, J.; Tymkovich, C.J., concurring; Bacharach, J., dissenting. Rehearing en banc denied, 20 F.4th 1325 (10th Cir. 2021) (per the petition). The majority calls the 1900 cession signers "tribal leaders"; the project says "chiefs," as the instruments of cession do. KeyCite checked Nov. 22, 2026 (see citator).
