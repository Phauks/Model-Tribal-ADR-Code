notes: Read in the slip opinion on govinfo on Nov. 22, 2026; the timeline's quotation ("racially-based land alienation rules") is at slip op. 7, and the timeline cites the case without a pinpoint until the F.4th page is found (on the pull list). The reporter citation is confirmed only through the certiorari petition (No. 21-1394). Nos. 20-4017, 20-4019; Lucero, J.; Tymkovich, C.J., concurring; Bacharach, J., dissenting. Rehearing en banc denied, 20 F.4th 1325 (10th Cir. 2021) (per the petition). The majority calls the 1900 cession signers "tribal leaders"; the project says "chiefs," as the instruments of cession do. Citator check not yet run.
