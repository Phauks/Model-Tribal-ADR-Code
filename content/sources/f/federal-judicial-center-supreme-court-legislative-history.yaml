notes: 'The Acts of Congress that set the number of Justices: 6 (1789, 1 Stat. 73), 5 at the next vacancy (1801, 2 Stat. 89, repealed before any vacancy), 6 (1802, 2 Stat. 132), 7 (Feb. 24, 1807, 2 Stat. 420), 9 (Mar. 3, 1837, 5 Stat. 176), 10 (Mar. 3, 1863, 12 Stat. 794), 7 as seats fell vacant (July 23, 1866, 14 Stat. 209; the Court fell to eight), 9 (Apr. 10, 1869, 16 Stat. 44).'
