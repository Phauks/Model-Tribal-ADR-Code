annotation: >-
  The Crow Nation became "the first American Indian tribe to enact the Model Tribal Secured Transactions Act." Its legislature "reviewed and debated the MTA for several months, from late 2005 through early 2006," and "approved it in a 17-1 vote on April 18" (the year, 2006, follows from the article's July 2006 date).
