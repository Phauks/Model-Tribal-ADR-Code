case_box:
  background: |-
    Mohegan law requires the Mohegan Tribal Gaming Authority to indemnify its employees for claims of negligence on the job [@lewis-v-clarke, p. 159]. William Clarke, a limousine driver for the Gaming Authority, was driving on Interstate 95 in Norwalk, Connecticut, when his limousine collided with a car carrying Brian and Michelle Lewis. The Lewises sued Clarke personally in state court, and Clarke argued that the Tribe's immunity covered him [@lewis-v-clarke, pp. 159-160].
  question: |-
    Does Tribal sovereign immunity bar a negligence suit against a Tribal gaming authority employee sued in his individual capacity for driving on the job?
  holding: |-
    No. The Court held that in an individual-capacity suit the employee, not the Tribe, is the real party in interest, so Tribal immunity does not apply, and that the Tribe's indemnification of the employee does not extend immunity to him.
  quotes:
  - text: "... in a suit brought against a tribal employee in his individual capacity, the employee, not the tribe, is the real party in interest and the tribe's sovereign immunity is not implicated ..."
    pinpoint: "p. 158"
  - text: "We hold that an indemnification provision cannot, as a matter of law, extend sovereign immunity to individual employees who would otherwise not fall under its protective cloak ..."
    pinpoint: "p. 164-165"
  topics:
  - "Dispute resolution and arbitration"
  - "Sovereign immunity"
  reading:
    title: "*Lewis v. Clarke* (2017)"
    text: |-
      Tribal immunity does not shield employees sued personally.
