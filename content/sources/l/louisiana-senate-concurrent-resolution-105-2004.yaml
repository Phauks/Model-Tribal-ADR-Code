notes: Enrolled resolved clause 'formally reacknowledges the Indian ancestry of members of' the Isle de
  Jean Charles, Bayou Lafourche and Grand Caillou/Dulac Bands of the BCCM and the Pointe-au-Chien Indian
  Tribe 'for the sole purpose of qualifying for Indian education and health care benefits'; the original
  version (https://www.legis.la.gov/legis/ViewDocument.aspx?d=280609) had said 'formally recognizes . . .
  as Indian tribes of the state'. Recitals say these groups were previously recognized as members of the
  United Houma Nation under Senate Concurrent Resolution No. 124 of 1990.
