notes: 'Indigo Book citation: Letter, Comm''r of Indian Affairs A.B. Greenwood to Comm''r of the Gen. Land Office S.A. Smith (Nov. 29, 1859), in 1 Indian Affairs: Laws and Treaties 868 (Charles J. Kappler ed., 1904). Read the letter as reproduced in Kappler vol. 1 (Internet Archive scan bp_996062-1, full-text OCR). The date is clear ("November 29, 1859") in that scan; another scan''s OCR misreads it as 1869, but the commissioner (A.B. Greenwood) held office 1859-61. Private copy of the scan''s text: research/captures/jurisdiction/kappler-scan-bp_996062-1.txt.'
