annotation: Process evaluation of the Red Hook Community Justice Center's peacemaking program, a state-court
  program modeled on Native peacemaking with training from Navajo peacemakers. Seventy-nine percent of
  participants completed (at v). It is 'not an impact evaluation' and 'a comparison group is not included'
  (at 4). Some defendants 'did not understand the voluntary nature of the program' when they enrolled
  (at iv), and the prosecution recommended peacemaking only in low-level cases (at 18).
