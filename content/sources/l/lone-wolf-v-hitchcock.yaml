case_box:
  background: |-
    The Medicine Lodge Treaty of 1867 set aside a reservation for the Kiowa, Comanche and Apache and provided that no cession of its common land would be valid unless signed by three-fourths of the adult men [@lone-wolf-v-hitchcock, pp. 563-564]. In 1892 federal commissioners obtained an agreement, signed by 456 men, to allot the reservation and cede the rest. Congress ratified it with amendments in an act of June 6, 1900 [@lone-wolf-v-hitchcock, pp. 553-554, 558-559]. Lone Wolf, a Kiowa leader, and other members sued the Secretary of the Interior to stop the opening of the land, relying on the treaty's consent clause [@lone-wolf-v-hitchcock, p. 564].
  question: |-
    May Congress allot and open reservation land in breach of the 1867 Medicine Lodge Treaty's requirement that three-fourths of adult men consent to any cession?
  holding: |-
    Yes. The Court held that Congress has plenary authority over Tribal relations, including power to abrogate treaty provisions. The exercise of that power is political and not reviewable by the courts. The 1900 allotment act was presumed to be a good-faith exercise of guardianship.
  quotes:
  - text: "Plenary authority over the tribal relations of the Indians has been exercised by Congress from the beginning, and the power has always been deemed a political one, not subject to be controlled by the judicial department of the government."
    pinpoint: "p. 565"
  - text: "When, therefore, treaties were entered into between the United States and a tribe of Indians it was never doubted that the power to abrogate existed in Congress ... ."
    pinpoint: "p. 566"
  treatment: |-
    *Haaland v. Brackeen* (2023) still cites *Lone Wolf* for the breadth of congressional power, and separate opinions in that case criticize it. [@haaland-v-brackeen]
  reading:
    title: "*Lone Wolf v. Hitchcock* (1903)"
    text: |-
      The high-water mark of "plenary power," including Congress's asserted power to abrogate treaties.
