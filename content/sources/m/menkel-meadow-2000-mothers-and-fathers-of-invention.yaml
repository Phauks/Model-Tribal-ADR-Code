annotation: >-
  Menkel-Meadow's essay on the intellectual founders of ADR. The abstract names the
  usual starting points (Sander's multi-door courthouse paper at the 1976 Pound Conference,
  Fisher and Ury's Getting to Yes, and 1960s-70s community efforts) and argues that
  dating the movement to the 1970s-80s overlooks 'earlier "intellectual" founders
  of ADR'. (project analysis) The commentary can use it to place modern U.S. ADR
  in a longer history, and to make the contrast with Indigenous peacemaking, which
  has its own, much older lineage.
