annotation: The standard treatise on Native Hawaiian law, edited by Melody Kapilialoha MacKenzie (editor in chief) with Susan K. Serrano and D. Kapuaʻala Sproat (executive editors), published for the Native Hawaiian Legal Corporation and the Ka Huli Ao Center for Excellence in Native Hawaiian Law. Twenty-one chapters in five parts. Chapter 1 (MacKenzie, Historical Background) covers the Kingdom's land tenure, constitutions and courts through statehood; chapter 5 (MacKenzie, Native Hawaiians and U.S. Law) covers the federal relationship, Rice v. Cayetano and recognition; chapter 18 (N. Kanale Sadowski and K. Kaʻanoʻi Walk, Pili ʻOhana) describes hoʻoponopono and compares it with mediation. (project analysis) The main secondary source for the timeline's Hawaiʻi section. Current to about 2014; later federal steps (the 2016 Interior rule) come from primary records.
