notes: Mashantucket Pequot Tribe v. Connecticut, 913 F.2d 1024 (2d Cir. 1990). The Second Circuit affirmed the district
  court, concluding Connecticut law on class III gaming was regulatory rather than prohibitive and that the State
  therefore had to negotiate with the Tribe over casino-type games (per a fetch-tool excerpt). The failed negotiations
  led to the first Secretarial gaming procedures in 1991 (56 Fed. Reg. 24996). Read on the original link. Citator
  check (KeyCite) pending; see the project's Westlaw list.
