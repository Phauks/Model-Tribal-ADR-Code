annotation: Presidential decree creating a temporary commission to prepare a "Plan de Justicia para el Pueblo Yaqui"
  on lands, territory, water and development. Describes the Yaqui people as eight communities, each with "gobierno
  tradicional de conformidad con sus propios usos y costumbres," participating through "los gobernadores tradicionales
  y sus secretarios electos conforme a sus usos y costumbres."
