annotation: 'National code of criminal procedure. Article 420 (Pueblos y comunidades indígenas): when a crime affects
  legal interests of an Indigenous people or community or the personal interests of a member, and both the accused
  and the victim (or family) accept the way the community proposes to resolve the conflict under its own normative
  systems, the criminal action is extinguished, unless the solution ignores gender perspective, affects human dignity,
  the best interests of children or the right to a life free of violence against women; crimes carrying mandatory
  pretrial detention are excluded. Any community member may ask the judge to so declare. (project analysis) A consent-based
  diversion from state prosecution to the community''s own process.'
