case_box:
  background: |-
    The Indian Gaming Regulatory Act allows class III gaming only on Indian lands and under a compact with the State [@michigan-v-bay-mills-indian-community, p. 785]. In 2010 the Bay Mills Indian Community opened a casino in Vanderbilt, Michigan, about 125 miles from its reservation, on land bought with interest from a federal payment for the Tribe's 19th-century land losses. The Community said the land was Indian land; Michigan disagreed and sued to close the casino [@michigan-v-bay-mills-indian-community, pp. 786-787].
  question: |-
    Does Tribal sovereign immunity bar a State's suit to enjoin a Tribe's operation of a casino outside Indian lands?
  holding: |-
    Yes. The Court held that the Indian Gaming Regulatory Act abrogates immunity only for suits to enjoin class III gaming on Indian lands, and that the suit concerned gaming off Indian lands. Reaffirming *Kiowa*, it held that Tribal immunity extends to off-reservation commercial activity unless Congress decides otherwise. The State has other remedies, including bargaining for a waiver.
  quotes:
  - text: "Among the core aspects of sovereignty that tribes possess—subject, again, to congressional action—is the “common-law immunity from suit traditionally enjoyed by sovereign powers” ..."
    pinpoint: "p. 788"
  - text: "... the State need only bargain for a waiver of immunity ..."
    pinpoint: "p. 796"
  - text: "... it is fundamentally Congress’s job, not ours, to determine whether or how to limit tribal immunity ..."
    pinpoint: "p. 800"
  topics:
  - "Dispute resolution and arbitration"
  - "Enforcement of awards, orders and judgments"
  - "Sovereign immunity"
  - "Gaming"
