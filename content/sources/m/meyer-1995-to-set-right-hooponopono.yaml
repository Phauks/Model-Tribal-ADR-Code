annotation: An article by Manu Meyer describing ho'oponopono, a Native Hawaiian family conflict process facilitated by a respected elder (haku) under five agreed conditions. It contrasts the process with Western mediation in setting, participants, rules and resolution, and describes the stages from opening prayer and statement of the problem through apology, forgiveness and release. It is a documented example of an indigenous relational peacemaking model whose aims and procedures differ from mediation. (project analysis)
