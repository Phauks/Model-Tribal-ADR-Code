annotation: >-
  A short article by Judge Aidan Warren of the Māori Land Court on the Part 3A mediation regime. He describes
  it as "a dispute resolution process based on tikanga Māori," notes that "Mediation will always be voluntary"
  and that, unlike an earlier proposal, "there is no longer a decision-making role for the mediators."
  He explains that up to two mediators may be appointed so one can bring legal skills and another tikanga
  or te reo Māori, that the Judge or Registrar can appoint if parties cannot agree, and that the Court
  can still reject an agreement that does not meet the Act's legal tests. He also notes that the Court
  can direct a judicial settlement conference. (project analysis) The co-mediator idea and the open question
  whether mediators should be evaluative or facilitative are both live design choices for a model code.
