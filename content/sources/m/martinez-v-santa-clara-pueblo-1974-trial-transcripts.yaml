notes: 'Catalog record only. The trial in the District of New Mexico that led to Santa Clara Pueblo v. Martinez, 436 U.S. 49 (1978) (record santa-clara-pueblo-v-martinez). Witnesses listed in the collection: Julia Martinez, Audrey Martinez, Myles Martinez, Herbert Martinez, Floripa Northcutt, Patrick Gutierrez, Florence Hawley Ellis, Juan Chavarria, Bill Baca, Amarante Silva, Jose Gene Naranjo, Paul Tafoya and Alcario Tafoya. (project analysis) The testimony may describe how the Pueblo''s council decided membership questions, which bears on Native nations'' own forums for membership disputes; nothing has been read yet.'
