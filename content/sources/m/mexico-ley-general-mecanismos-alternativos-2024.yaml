annotation: 'Mexico''s 2024 general law on alternative dispute resolution, issued under constitutional arts. 17
  and 73. Art. 4 lists negotiation, collaborative negotiation, mediation, conciliation and arbitration "de manera
  enunciativa y no limitativa." Art. 41: facilitators belonging to Indigenous and Afro-Mexican peoples are governed
  by constitutional art. 2 and state law. Art. 60: when a party identifies as Indigenous or Afro-Mexican, "se estará
  a sus usos y costumbres de conformidad con la libre autodeterminación y autonomía." (project analysis) A national
  ADR statute that defers to Indigenous norms for Indigenous parties.'
