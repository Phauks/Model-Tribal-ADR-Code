notes: 'A copy of a Native-made map. The Library''s note says it was copied "from a draught drawn & painted on a deer skin by an Indian Cacique and presented to Francis Nicholson Esqr. Governor of South Carolina"; the Library holds a photocopy of the copy in the British Library (Add. MS 4723), which the British Library says is "sometimes known as the ''Catawba Deerskin Map''". Offer it to the Catawba Indian Nation, whose account of it comes first. A historic map of Indian lands from the Library of Congress (call number G3860 1724 .M2 1929). The scans are kept in the project''s bucket under historic-maps/library-of-congress/ and shown in the site''s image viewer; they are not georeferenced. Listed in site/geography/historic-map-scans.json (tools/collect-historic-maps.mjs).'
