annotation: 'Federal Constitution of Mexico, consolidated by the Chamber of Deputies (last amendment DOF 07-10-2026).
  Article 2 recognizes the Nation''s pluricultural composition, Indigenous peoples'' self-determination "en un marco
  constitucional de autonomía que asegure la unidad nacional," and (since 2024) peoples and communities as subjects
  of public law. Apartado A, fr. II: the right to apply their own normative systems to resolve internal conflicts,
  subject to the Constitution''s general principles, human rights and "la dignidad e integridad de las mujeres,"
  with validation by courts as the law provides; a 2024 sentence adds that "La jurisdicción indígena se ejercerá
  por las autoridades comunitarias." Fr. XI: full access to state courts, with interpreters and specialized defenders.
  Fr. XIII: consultation aimed at consent. Art. 17 requires laws to provide alternative dispute resolution mechanisms.
  Art. 27 frs. VII and XIX: legal personality of ejidos and comunidades, protection of Indigenous lands, and federal
  agrarian tribunals. (project analysis) The constitutional footing for Indigenous dispute resolution in Mexico:
  a right inside the national order, checked by validation, rather than a separate sovereign''s jurisdiction.'
