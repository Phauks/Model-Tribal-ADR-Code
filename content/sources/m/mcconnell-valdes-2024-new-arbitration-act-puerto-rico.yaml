annotation: >-
  An English-language client alert from a Puerto Rico law firm on Act 147-2024. It
  says the Act was signed August 9, 2024, was drafted "in accordance with the Revised
  Uniform Arbitration Act," repeals Act 376 of 1951 and Act 10-2012, and "will take
  effect on February 5, 2025." It also says the Act does not apply to arbitrations
  commenced, or rights accrued, before the effective date. (project analysis) This
  is a secondary source, useful mainly as an English summary and for the effective
  date, which the OGP excerpt read here did not state. No individual author is named.
