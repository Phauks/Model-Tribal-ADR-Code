annotation: McBride and Huntsman describe the NLRB's 2007 ruling that the National Labor Relations Act reaches a tribal casino (San Manuel) and set out union-avoidance and tribal labor-ordinance options for tribal employers. The text also includes the continuation of a separate article by Casey Douma on the Indian Civil Rights Act and tribal dispute resolution. Relevant because it shows how employment disputes can move to federal forums and what tribal labor codes and exclusion laws can address. (project analysis)
