annotation: >-
  Macneil's history of American arbitration law (Oxford Univ. Press 1992, xvi + 266
  pp. per catalog). It covers the 1920s reform movement that produced the 1925 FAA
  and the Court's later 'nationalization' of the Act. The catalog summary says arbitration
  can 'frequently be manipulated to maintain inequitable relationships'. (project
  analysis) This is the key secondary source for the 1925 legislative history. It
  also supports the commentary point that the FAA was designed for commercial parties
  of roughly equal bargaining power, which matters when a Tribal code decides how
  to treat consumer and employment arbitration clauses.
