annotation: 'Federal agrarian law. Art. 136(III): the Procuraduría Agraria is to "Promover y procurar la conciliación
  de intereses." Art. 164: agrarian tribunals consider the usos y costumbres of Indigenous and Afro-Mexican parties
  unless contrary to the Constitution and the law, accept filings in Indigenous languages, and give summaries in
  the party''s language. Art. 185(VI): before judgment the tribunal "exhortará a las partes a una composición amigable";
  an approved settlement "tendrá el carácter de sentencia ejecutoriada."'
