annotation: >-
  Michigan's rule (text current as of the official compilation 'Updated November
  18, 2026'; adoption date not shown in the compilation). Tribal-court judgments
  and other judicial acts are recognized with the same effect as those of Michigan
  courts of record. Recognition applies only if the Tribe enacts a binding measure
  obligating its court to enforce Michigan judgments and sends it to the State Court
  Administrative Office. Qualifying Tribal acts are 'presumed to be valid,' and the
  objecting party must show lack of jurisdiction, fraud, lack of fair notice or hearing,
  public-policy repugnance, or non-finality. (project analysis) This reciprocity-by-filing
  design is directly usable in a Tribal code. The Tribe enacts a mirror provision
  and files it, so Tribal judgments, including judgments confirming arbitral awards
  or entering mediated agreements, become presumptively enforceable in state court.
