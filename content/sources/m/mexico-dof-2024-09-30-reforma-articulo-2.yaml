annotation: 'Constitutional amendment of Sept. 30, 2024 (evening edition) rewriting article 2: peoples and communities
  become "sujetos de derecho público con personalidad jurídica y patrimonio propio"; adds the sentence on Indigenous
  jurisdiction exercised by community authorities; adds consultation (fr. XIII), Afro-Mexican rights (apartado C)
  and Indigenous women''s rights (apartado D), and calls for a general law.'
