annotation: >-
  Michigan's general court-ADR rule (MCR 2.410) makes all civil cases subject to
  ADR unless otherwise provided. It defines ADR to include settlement conferences,
  case evaluation (MCR 2.403), mediation (MCR 2.411), and domestic-relations and
  child-protection mediation. Each trial court using ADR must adopt a written ADR
  plan, and a party unable to pay must not be ordered into ADR when free or low-cost
  services are unavailable. Case evaluation (MCR 2.403) submits money-damage cases
  to a panel 'composed of 3 persons' who place a value on the case. It is a distinctive
  Michigan process, proposed here as a new method. (project analysis) The ADR-plan
  requirement and the indigent-access rule are both strong provisions to carry into
  a Tribal code. The plan may also refer cases to Community Dispute Resolution Program
  centers.
