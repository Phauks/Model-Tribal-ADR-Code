annotation: Reports that on Sept. 1, 2026 the U.S. District Court for the Northern District of New York
  struck down a Department of Education policy requiring American Indians born in Canada to show more
  immigration documents for federal student aid. The Saint Regis Mohawk Tribe brought the challenge for
  student plaintiffs ("Rourke-Rodriguez et al."); the Mohawk Council of Akwesasne filed an amicus brief.
  The Council writes that "Akwesasne and our people existed long before the international border divided
  our territory." (project analysis) An example of governments on each side of the border working on one
  case.
