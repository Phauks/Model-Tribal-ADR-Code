case_box:
  background: |-
    The Fort Laramie treaties of 1851 and 1868 set aside the Crow Reservation in Montana, through which the Big Horn River flows. Allotment acts later let allottees sell their land, and much of it passed to non-Indians. The Crow Tribal Council passed Resolution No. 74-05, barring hunting and fishing on the reservation by anyone who was not a member, while Montana went on regulating hunting and fishing by non-Indians. In 1975 the United States sued, in its own right and as fiduciary for the Crow, to settle title to the riverbed and the Tribe's power to regulate [@montana-v-united-states, pp. 547-549].
  question: |-
    May the Crow Tribe regulate hunting and fishing by nonmembers on land within the reservation owned in fee by non-Indians?
  holding: |-
    No. The Court held that the bed of the Big Horn River passed to Montana at statehood. It also held that, as a general rule, the inherent sovereign powers of a nation do not extend to nonmember activities on non-Indian fee land. There are two exceptions: consensual relationships with the Tribe or its members, and conduct threatening or directly affecting the Tribe's political integrity, economic security, or health or welfare.
  quotes:
  - text: "... exercise of tribal power beyond what is necessary to protect tribal self-government or to control internal relations is inconsistent with the dependent status of the tribes, and so cannot survive without express congressional delegation ..."
    pinpoint: "p. 564"
  - text: "A tribe may regulate, through taxation, licensing, or other means, the activities of nonmembers who enter consensual relationships with the tribe or its members, through commercial dealing, contracts, leases, or other arrangements ..."
    pinpoint: "p. 565"
  - text: "A tribe may also retain inherent power to exercise civil authority over the conduct of non-Indians on fee lands within its reservation when that conduct threatens or has some direct effect on the political integrity, the economic security, or the health or welfare of the tribe ..."
    pinpoint: "p. 566"
  treatment: |-
    Narrowed and applied in *Strate* (1997), *Atkinson* (2001), *Hicks* (2001) and *Plains Commerce Bank* (2008); *United States v. Cooley* (2021) applied the second exception to uphold Tribal police authority. [@united-states-v-cooley]
  topics:
  - "Tribal courts"
  - "Civil jurisdiction"
