annotation: >-
  The Court allowed the Crown's appeal: Grand Chief Michael Mitchell of Akwesasne had not established an
  Aboriginal right to bring goods across the St. Lawrence River (the Canada-United States border) for
  trade, so duty was payable. For five judges, McLachlin C.J. found that any such trade was not, on the
  evidence, a "defining feature of the Mohawk culture" (para. 54) or "vital to the Mohawk's collective
  identity" (para. 60) before contact, and declined to decide the Crown's "sovereign incompatibility"
  argument (para. 64). Binnie J. (with Major J.) concurred in the result on additional grounds (from para.
  66). The majority held that oral histories are admissible where useful and reasonably reliable, and that the
  rules of evidence apply flexibly to Aboriginal claims (headnote; paras. 26-39). The treaty claim was not pressed in the Court: the trial judge found an Aboriginal right but
  not a treaty right (para. 5). The only mention of the Jay Treaty is in Binnie J.'s concurrence, quoting
  United States v. Garrow on Article III (para. 167); the opinions do not say whether the Jay Treaty was
  implemented in Canadian law (project analysis from a text search of the full decision).
