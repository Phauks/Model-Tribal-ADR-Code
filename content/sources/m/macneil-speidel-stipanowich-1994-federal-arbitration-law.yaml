  Boston: Little, Brown, ©1994-, with contributions by G. Richard Shell). (project
  analysis) The most detailed treatment of FAA text and history before the modern
  mandatory-arbitration cases. It is useful when a Tribal code must decide whether
  to mirror FAA §§ 2-4 and 9-11 or depart from them.
