annotation: Established by Akwesasne Court Law No. 2016-01, in effect August 2016; describes itself as
  "the first court in Canada to operate under an independent Indigenous legal system, separate from the
  federal framework." It has "limited criminal jurisdiction," is recognized under the Family Homes on
  Reserves and Matrimonial Interests or Rights Act for enforcing Akwesasne laws, and "[n]egotiations are
  ongoing with Ontario and Quebec to recognize Akwesasne Court orders." Services include adjudication
  and dispute resolution under Akwesasne laws, appeals from court and administrative bodies, small claims,
  and "Court-managed mediation services (voluntary or court-ordered)."
