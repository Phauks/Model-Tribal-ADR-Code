notes: Maverick Gaming LLC v. United States, No. 23-35136 (9th Cir. Dec. 13, 2024), cert. denied, No. 24-1161 (U.S.
  Oct. 6, 2025). The panel held the Shoalwater Bay Indian Tribe is a required party under Rule 19(a) to a challenge
  to Washington tribal sports-betting compact amendments, cannot be joined because of tribal sovereign immunity,
  and the suit cannot proceed in equity without it. Judge Miller concurred. The Supreme Court denied certiorari
  Oct. 6, 2025 (docket page). Read on the original link. Citator check (KeyCite) pending; see the project's Westlaw
  list.
