annotation: LeBel J. restates R. v. Gladue (para. 59) and holds that "courts must take judicial notice
  of such matters as the history of colonialism, displacement, and residential schools," noting that case-specific
  information "is often brought before the court by way of a Gladue report" (para. 60).
