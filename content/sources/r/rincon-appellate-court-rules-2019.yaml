notes: 'Sections 3.801(j), 3.802 and 3.803(c): the Intertribal Court of Southern California, or another lower court the Tribal Council designates, is the Rincon Trial Court, and appeals from it go to the Rincon Band of Luiseño Indians Court of Appeals. The Band''s laws page links a later copy of the same ordinance.'
