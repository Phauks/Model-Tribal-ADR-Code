annotation: >-
  RSI's 'Court ADR Across the U.S.' is a 50-state (plus D.C.) directory of statewide
  court-ADR statutes, rules, reports and contacts. It is the best free national survey
  of court-connected ADR. The Nevada entry lists NRS chapters 3, 38 and 107, the
  Rules Governing ADR, the Foreclosure Mediation Rules, and NRAP 16 (the Supreme
  Court Settlement Program, which 'utilizes mediation for civil appeals cases').
  The page contains an editing error: its summary note says 'This is a summary of
  state court ADR in Nebraska.' (project analysis) Use it as a finding aid, not as
  authority. Its rule-revision dates (e.g. Rules Governing ADR 'Jan. 1, 2020') lag
  behind the LCB text.
