notes: >-
  Citations: Hiram Price, Comm'r of Indian Affairs, Rules Governing the Court of Indian Offenses (Mar.
  30, 1883), reprinted in U.S. Office of Indian Affairs, Regulations of the Indian Department ¶¶ 496–97,
  at 86–89 (1884). Also read: https://nill.narf.org/resources/civilization_policy.html, https://commons.und.edu/indigenous-gov-docs/131/.
  Later history: Reissued in the 1884, 1894 and 1904 Regulations of the Indian Office (NILL guide). The
  successor today is 25 C.F.R. Part 11 (Courts of Indian Offenses / 'CFR courts'). NILL states the religious-practice
  bans were not formally removed until AIRFA (1978); that is NILL's characterization. The 1884 Regulations
  scan has poor OCR, so only short clean fragments are quoted. The UND transcription PDF was blocked (Cloudflare).
  The 1883 date comes from NILL and UND metadata. The 1883 Annual Report of the Commissioner printing
  was not opened.
law_box:
  summary: |-
    The Commissioner of Indian Affairs issued rules creating a "Court of Indian Offenses" at most agencies. Judges were drawn from agency police. Orders were subject to the agent's approval and "an appeal to and final revision by the Indian office" [@rules-governing-court-of-indian-offenses-1883, p. 89]. The rules made ceremonial and family practices punishable, and the Interior Secretary's letter that prompted them called "the influence of the medicine men" a "great hindrance" [@rules-governing-court-of-indian-offenses-1883, p. 87]. The National Indian Law Library notes that "there was no actual Congressional authorization for the Code of Indian Offenses" [@nill-civilization-regulations-and-policy].
