annotation: A citizen of the Lakes Tribe of the Colville Confederated Tribes, living in Washington State,
  was charged with hunting in British Columbia. The majority (Rowe J.) held that "aboriginal peoples of
  Canada" in s. 35(1) "must mean the modern-day successors of Aboriginal societies that occupied Canadian
  territory at the time of European contact," so groups "whose members are neither citizens nor residents
  of Canada" can qualify (para. 23). It distinguished Mitchell v. M.N.R. as a claim to cross the border
  (para. 11), said "[i]t is for Aboriginal peoples, however, to define themselves" (para. 86), and noted
  the advantages of negotiation (para. 87). Moldaver and Côté JJ. dissented.
