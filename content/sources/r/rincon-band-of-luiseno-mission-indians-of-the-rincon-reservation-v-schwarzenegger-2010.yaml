notes: Rincon Band of Luiseno Mission Indians v. Schwarzenegger, 602 F.3d 1019 (9th Cir. 2010). The court affirmed
  the finding that California negotiated in bad faith by conditioning expanded class III gaming rights on a percentage-of-revenue
  payment to the state general fund; it held that general-fund revenue sharing is not a permissible subject under
  2710(d)(3)(C)(vii) and that the offered exclusivity was not a meaningful concession. The district court order
  to conclude a compact or submit last best offers to a mediator was made effective. Read on the original link.
