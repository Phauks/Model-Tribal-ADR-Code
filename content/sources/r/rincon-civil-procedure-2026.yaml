notes: 'The preamble lists the Band''s courts: the Rincon Trial Court administered through the Intertribal Court of Southern California, the Court of Appeals within that court, the Rincon Civil Trial Court (established Feb. 11, 2021) and the Rincon Court of Appeals. Section 3.315(j)(1) sends appeals from the Rincon Civil Trial Court to the Rincon Court of Appeals.'
