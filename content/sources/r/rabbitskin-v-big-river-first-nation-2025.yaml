annotation: Judicial review of a custom election (Big River First Nation, a Cree Treaty 6 nation). "Respect
  for self-government necessitates ensuring that governance disputes are first dealt with by Indigenous
  decision-making processes" (para. 17, citing Linklater v. Thunderchild First Nation, 2020 FC 899). "[A]pplicants
  who seek to challenge an election code or to contest election results are required to exhaust all internal
  recourses available to them and that court proceedings are appropriate only as a last resort" (para.
  19). Docket T-2182-24.
