notes: Read in full (Europe PMC full text, 2026-11-22). Instruction-tuned models used present participial
  clauses at 2 to 5 times the human rate (GPT-4o 5.3 times) and nominalizations at 1.5 to 2 times; GPT-4o
  used the agentless passive at roughly half the human rate; GPT-4o and 4o Mini used camaraderie, palpable,
  tapestry and intricate at more than 100 times the human rate. Author list checked against Europe PMC.
