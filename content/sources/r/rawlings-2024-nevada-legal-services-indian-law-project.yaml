annotation: >-
  The directing attorney of Nevada Legal Services' Indian Law Project describes the program (since
  1974, "the only legal aid program in Nevada that specializes in tribal law") and practice in
  Nevada's 19 Tribal courts. Each nation has its own laws and justice system: "One tribal court is
  not like another, just as a Nevada state court is not the same as a California state court."
  Many Tribal court litigants represent themselves; most Tribal courts admit both attorneys and
  lay advocates, each with its own requirements.
