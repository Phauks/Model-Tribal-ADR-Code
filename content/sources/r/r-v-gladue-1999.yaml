annotation: >-
  Appeal dismissed (decided Apr. 23, 1999). The headnote says the considerations for sentencing an
  Aboriginal offender under Criminal Code s. 718.2(e) are summarized at para. 93 of the reasons.
access:
  open: true
  pull_from:
  - free-web
  note: >-
    The lead author's first browser print (2026-11-22, 41 pages) stopped before paras. 66 and 93 (private copy canada/r-v-gladue-1999-scc-partial-print.pdf). The official S.C.R. PDF (54 pages, bilingual) arrived the same day and is filed as canada/r-v-gladue-1999-1-scr-688.pdf. In it para. 66 runs across pp. 723-24 and sets out the two kinds of circumstances a judge considers for an Aboriginal offender: (A) the unique systemic or background factors that may have brought the offender before the court, and (B) the sentencing procedures and sanctions that may suit the offender because of their Aboriginal heritage or connection. Para. 93, the summary of the reasons, begins at p. 736.
