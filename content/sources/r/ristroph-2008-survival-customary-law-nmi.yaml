annotation: >-
  A former CNMI Superior Court law clerk examines how CNMI courts find and apply
  mostly uncodified Chamorro and Carolinian customary law in land, probate and adoption
  disputes. She observes that "The CNMI judiciary often stumbles through cases of
  first impression" (p. 32). The article describes Carolinian family land held by
  a customary trustee (p. 37) and the Chamorro "partida," a family distribution of
  property announced by the father (p. 50). It discusses reliance on reputation hearsay
  as "the cornerstone of disputes" over customary matters (p. 51) and recommends
  legislative codification (p. 65). (project analysis) This is the most directly
  relevant scholarship found on courts' handling of custom in the Marianas. It shows
  the evidentiary and legitimacy problems that arise when state courts adjudicate
  custom. The article spells the name 'Chamorro'; the project should use CHamoru
  in its own text and keep the source's spelling in quotations.
