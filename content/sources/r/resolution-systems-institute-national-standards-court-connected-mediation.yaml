annotation: >-
  RSI's library entry for the National Standards for Court-Connected Mediation Programs
  (RSI lists the date as Jan. 1, 1999; the UMA § 9 comment cites it as 'Center for
  Dispute Settlement, National Standards for Court-Connected Mediation Programs (1992)',
  see uniform-law-commission-mediation-act). The standards cover access, case selection
  and timing, mandatory attendance, mediator qualifications and ethics, confidentiality,
  the role of lawyers, 'inappropriate pressure to settle,' communications with the
  court, funding, liability, and enforceability of mediated agreements. (project
  analysis) For court-annexed Tribal programs, this is the closest program-level
  counterpart to the practitioner-level Model Standards of Conduct. Confirm the edition
  and any co-issuer (e.g. Institute of Judicial Administration) from the PDF title
  page.
