notes: >-
  Patsy Ross & Burke Adams v. Tom Sulu, No. AP-010-88 (Hopi App. Ct.), on appeal from No. CIV-023-88, before
  Chief Judge Sekaquaptewa and Judges Abbey and Bender. Copy hosted by the Tribal Law and Policy Institute's Tribal
  Court Clearinghouse, not by the Hopi courts. Decision date: the order ends "Vacated and Remanded July 5,
  1991," signed by Emory Sekaquaptewa as Chief Justice (the caption says Chief Judge); read in full from the lead
  author's browser print of the same page, 2026-11-22. The court vacated and remanded with directions to dismiss
  for lack of jurisdiction. No reporter citation appears on the copy; a Westlaw search for one is still open.
