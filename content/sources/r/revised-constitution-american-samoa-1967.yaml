annotation: >-
  Article I, § 3 makes it government policy to protect "persons of Samoan ancestry"
  against "alienation of their lands and the destruction of the Samoan way of life
  and language." Article III vests judicial power in the High Court and District
  Courts. Under Article IV, § 4, the Secretary of Samoan Affairs "shall be appointed
  by the Governor from among the leading registered matais" and heads local government.
  The Constitution was ratified June 2, 1967, effective July 1, 1967, per the PacLII
  page. (project analysis) This is the constitutional basis for the customary-authority
  steps in A.S.C.A. § 43.0302. Amendments in 2022 and 2025 were noted in search results
  (refworld) but not reviewed.
