notes: Fourteen Dakota legends retold in English by Zitkala-Ša (Gertrude Simmons Bonnin), a Yankton Dakota writer,
  with illustrations by Angel De Cora (Ho-Chunk). Her preface says old Dakota storytellers in both North and South
  Dakota told her these legends. Read in the University of California scan on the Internet Archive. The Badger and
  the Bear includes a prayer in a sweat lodge; the project quotes nothing from that part.
