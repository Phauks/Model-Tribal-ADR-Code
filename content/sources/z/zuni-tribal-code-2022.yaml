notes: 'Rules of Criminal Procedure, Rule 18 (Customary Pretrial Conference): a judge-led conference meant
  to settle criminal cases in a customary way after a complaint is filed. Not a peacemaker program (project
  analysis). Its wording closely tracks the Santee Sioux Nation''s pre-trial conference section.'
