notes: Stories and essays by Zitkala-Ša (Gertrude Simmons Bonnin), a Yankton Dakota writer. "The Widespread Enigma Concerning Blue-Star Woman" is a short story about proving membership for a land allotment. Read in the Internet Archive scan of the 1921 printing and checked against the Project Gutenberg transcription (ebook 10376).
