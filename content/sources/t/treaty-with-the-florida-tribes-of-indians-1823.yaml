notes: 'Indigo Book citation: Treaty with the Florida Tribes of Indians, Sept. 18, 1823, 7 Stat. 224. Ratified treaty (Kappler vol. 2, p. 203; header "Sept. 18, 1823. | 7 Stat., 224. | Proclamation, Jan. 2, 1824."). The text is the Statutes at Large granule on GovInfo; the Oklahoma State University Tribal Treaties Database reproduces it at https://treaties.okstate.edu/treaties/treaty-with-the-florida-tribes-of-indians-1823-0203. Title, date and citation come from the database and the Kappler header, generated by scripts/law/treaty_records.py. The nations that descend from its signatories are on their nation pages (treaties). Text check, Nov. 24, 2026 (research/reviews/2026-11-24-treaty-verification-ratified.csv): the stored Statutes at Large text and the Oklahoma State University scan of Kappler agree with the parties, the date signed, the citation (7 Stat. 224, its first page), the Kappler page and the proclamation date in Kappler''s header. It stays Unverified until the nation reviews it.'
