notes: 'Indigo Book citation: Treaty with the Potawatomi, Dec. 4, 1834, 7 Stat. 467. Ratified treaty (Kappler vol. 2, p. 428; header "Dec. 4, 1834. | 7 Stat., 467. | Proclamation, Mar. 16, 1835."). The text is the Statutes at Large granule on GovInfo; the Oklahoma State University Tribal Treaties Database reproduces it at https://treaties.okstate.edu/treaties/treaty-with-the-potawatomi-1834-0428. Title, date and citation come from the database and the Kappler header, generated by scripts/law/treaty_records.py; not yet read against the text (Unverified). The nations that descend from its signatories are on their nation pages (treaties). Checked by hand, Nov. 24, 2026: Pg467 is the treaty with Com-o-za''s band; the Dec. 10 treaty begins on the same page (Pg467-2).'
