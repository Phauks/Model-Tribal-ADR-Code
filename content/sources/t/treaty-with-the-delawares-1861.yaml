notes: 'Indigo Book citation: Treaty with the Delawares, July 2, 1861, 12 Stat. 1177. Ratified treaty (Kappler vol. 2, p. 814; header "July 2, 1861. | 12 Stats. 1177. | Ratified, Aug. 6, 1861. | Proclaimed, Oct. 4, 1861."). The text is the Statutes at Large granule on GovInfo; the Oklahoma State University Tribal Treaties Database reproduces it at https://treaties.okstate.edu/treaties/treaty-with-the-delawares-1861-0814. Title, date and citation come from the database and the Kappler header, generated by scripts/law/treaty_records.py; not yet read against the text (Unverified). The nations that descend from its signatories are on their nation pages (treaties).'
