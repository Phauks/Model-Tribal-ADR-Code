notes: 'Citation: Treaty with the Sioux—Brulé, Oglala, Miniconjou, Yanktonai, Hunkpapa, Blackfeet, Cuthead, Two Kettle, Sans Arcs, and Santee—and Arapaho, 1868 (Fort Laramie Treaty), 15 Stat. 635, reprinted in 2 Charles J. Kappler, Indian Affairs: Laws and Treaties 998 (1904). Text read on the Oklahoma State University Tribal Treaties Database page named in the link (Kappler''s text) on Nov. 22, 2026; Article 1 (the "bad men" clause) quoted in the Foundations timeline. The Kappler page is the treaty''s first page as given by the database page''s address and was not checked against a page image of the 1904 printing. Proclaimed Feb. 24, 1869. The clause litigated in Richard v. United States (Fed. Cir. 2012) and Elk v. United States (Fed. Cl. 2009). The treaty had other signatory nations not listed in tribes. Title punctuation follows Kappler as shown on the database page.'
