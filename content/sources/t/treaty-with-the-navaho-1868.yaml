notes: 'Citation: Treaty with the Navaho, 1868, 15 Stat. 667, reprinted in 2 Charles J. Kappler, Indian Affairs: Laws and Treaties 1015 (1904). Text read on the Oklahoma State University Tribal Treaties Database page named in the link (Kappler''s text) on Nov. 22, 2026; Article 1 (the "bad men" clause) quoted in the Foundations timeline. The Kappler page is the treaty''s first page as given by the database page''s address. Proclaimed Aug. 12, 1868. Kappler spells the title "Navaho"; the treaty text and the nation use "Navajo". The database text shows a stray space in the first word of the second paragraph ("I f"), normalized in the quotation. The clause litigated in Tsosie v. United States (Fed. Cir. 1987). Text check, Nov. 24, 2026 (research/reviews/2026-11-24-treaty-verification-ratified.csv): the stored Statutes at Large text and the Oklahoma State University scan of Kappler agree with the parties, the date signed, the citation (15 Stat. 667, its first page), the Kappler page, the ratification date in Kappler''s header and the proclamation date in Kappler''s header. It stays Unverified until the nation reviews it.'
