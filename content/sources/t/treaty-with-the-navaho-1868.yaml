notes: 'Citation: Treaty with the Navaho, 1868, 15 Stat. 667, reprinted in 2 Charles J. Kappler, Indian Affairs: Laws and Treaties 1015 (1904). Text read on the Oklahoma State University Tribal Treaties Database page named in the link (Kappler''s text) on Nov. 22, 2026; Article 1 (the "bad men" clause) quoted in the Foundations timeline. The Kappler page is the treaty''s first page as given by the database page''s address and was not checked against a page image of the 1904 printing. Proclaimed Aug. 12, 1868. Kappler spells the title "Navaho"; the treaty text and the nation use "Navajo". The database text shows a stray space in the first word of the second paragraph ("I f"), normalized in the quotation. The clause litigated in Tsosie v. United States (Fed. Cir. 1987).'
