notes: 'Not in Kappler''s list of ratified treaties, but the database marks it ratified; whether the Senate consented has not been checked against the Senate Executive Journal, so its status is open. President Adams sent it to the Senate on Jan. 31, 1799 (American State Papers, Indian Affairs, vol. 1, No. 87). Header: "5th Congress. No. 87. 3d Session.". Listed in the Oklahoma State University Tribal Treaties Database, which reproduces the text; metadata generated by scripts/law/treaty_records.py. Text check, Nov. 24, 2026 (research/reviews/2026-11-24-treaty-verification-other.csv): the database holds the document with a scan of it, and its date matches the record. It stays Unverified.'
