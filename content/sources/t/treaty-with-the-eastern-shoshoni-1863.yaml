notes: 'Indigo Book citation: Treaty with the Eastern Shoshoni, July 2, 1863, 18 Stat. 685. Ratified treaty (Kappler vol. 2, p. 848; header "July 2, 1863. | 18 Stats., 685. | Ratified Mar. 7, 1864. | Proclaimed June 7, 1869."). The text is the Statutes at Large granule on GovInfo; the Oklahoma State University Tribal Treaties Database reproduces it at https://treaties.okstate.edu/treaties/treaty-with-the-eastern-shoshoni-1863-0848. Title, date and citation come from the database and the Kappler header, generated by scripts/law/treaty_records.py; not yet read against the text (Unverified). The nations that descend from its signatories are on their nation pages (treaties). GovInfo has no copy of 18 Stat., pt. 3, where Kappler places this treaty: its link for 18 Stat. 685 opens the Revised Statutes (pt. 1). The text is Kappler''s.'
