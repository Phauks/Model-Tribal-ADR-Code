annotation: >-
  A two-page government explainer. It says public court hearings about whenua Māori "can lead to long-lasting
  resentment between whānau members" and that the new mediation service, using "a mediator and relevant
  tikanga," keeps details of disputes private. The service is free, though parties pay their own travel
  and legal advice; the parties "will need to agree on the mediator"; for the first two years only Māori
  Land Court Judges could mediate, and a Judge who mediates cannot sit on the matter. Agreements are recorded
  and sent to the Māori Land Court "to formalise." The companion Ministry of Justice booklet (December
  2020) dates the changes to Feb. 6, 2021. (project analysis) A plain-language model for how a nation
  might explain a new process to its citizens.
