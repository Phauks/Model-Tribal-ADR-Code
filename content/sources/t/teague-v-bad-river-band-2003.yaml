case_box:
  background: |-
    After *Teague* (2000), both cases ran to judgment. Teague had stopped taking part in the Tribal case, and in July 1997 the Bad River Tribal Court entered a default judgment declaring his 1993 and 1995 employment contracts void. The state circuit court awarded Teague damages for breach of the same contracts. When it refused to reopen that judgment, the court of appeals certified the full faith and credit question to the Wisconsin Supreme Court [@teague-v-bad-river-band-2003, ¶¶ 1, 3-4].
  question: |-
    After the parallel state and Tribal cases both reached judgment, must Wisconsin give full faith and credit to the earlier Tribal-court judgment voiding the employment contracts?
  holding: |-
    The court reversed the order refusing to reopen the circuit court's judgment and remanded for dismissal of the state action. The lead opinion would give full faith and credit to the first-in-time Tribal judgment under Wis. Stat. § 806.245; the four-justice concurrence reached the same result through comity, stressing that courts exercising concurrent jurisdiction should stop, consult, and decide which court proceeds.
  quotes:
  - text: "I would hold that the circuit court was required by Wis. Stat. § 806.245 to give full faith and credit to the tribal court judgment declaring the employment contracts at issue void and, thus, unenforceable."
    pinpoint: "¶ 2"
  - text: "Rather, each court should stop its proceedings, consult with the other, and as a matter of comity decide which court should proceed."
    pinpoint: "¶ 58"
    parenthetical: "Abrahamson, C.J., concurring"
  topics:
  - "Recognition of Tribal judgments (comity)"
  - "Enforcement of awards, orders and judgments"
  - "Tribal courts"
  reading:
    title: "*Teague v. Bad River Band of the Lake Superior Tribe of Chippewa Indians* (2003)"
    text: |-
      Illustrates the costs of uncoordinated parallel proceedings and the fractured approaches (full faith and credit vs. comity) state courts take.
