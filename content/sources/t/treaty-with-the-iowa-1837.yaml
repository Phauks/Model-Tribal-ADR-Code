notes: 'Indigo Book citation: Treaty with the Iowa, Nov. 23, 1837, 7 Stat. 547. Ratified treaty (Kappler vol. 2, p. 500; header "Nov. 23, 1837. | 7 Stat., 547. | Proclamation, Feb. 21, 1838."). The text is the Statutes at Large granule on GovInfo; the Oklahoma State University Tribal Treaties Database reproduces it at https://treaties.okstate.edu/treaties/treaty-with-the-iowa-1837-0500. Title, date and citation come from the database and the Kappler header, generated by scripts/law/treaty_records.py. The nations that descend from its signatories are on their nation pages (treaties). Checked by hand, Nov. 24, 2026: Pg547 is the Ioway treaty made at St. Louis; the Saginaw Chippewa treaty begins on the same page (Pg547-2). Text check, Nov. 24, 2026 (research/reviews/2026-11-24-treaty-verification-ratified.csv): the stored Statutes at Large text and the Oklahoma State University scan of Kappler agree with the parties, the date signed, the citation (7 Stat. 547, its first page), the Kappler page and the proclamation date in Kappler''s header. It stays Unverified until the nation reviews it.'
