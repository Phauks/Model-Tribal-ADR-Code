notes: 'Indigo Book citation: Treaty with the Potawatomi, July 18, 1815, 7 Stat. 123. Ratified treaty (Kappler vol. 2, p. 110; header "July 18, 1815. | 7 Stat., 123. | Ratified, Dec. 26, 1815."). The text is the Statutes at Large granule on GovInfo; the Oklahoma State University Tribal Treaties Database reproduces it at https://treaties.okstate.edu/treaties/treaty-with-the-potawatomi-1815-0110. Title, date and citation come from the database and the Kappler header, generated by scripts/law/treaty_records.py; not yet read against the text (Unverified). The nations that descend from its signatories are on their nation pages (treaties). Checked by hand, Nov. 24, 2026: Pg123 names the "Poutawatamie Tribe or Nation", July 18, 1815.'
