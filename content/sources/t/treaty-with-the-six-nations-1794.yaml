notes: 'Citation: Treaty with the Six Nations, 1794 (Treaty of Canandaigua), 7 Stat. 44, reprinted in 2 Charles J. Kappler, Indian Affairs: Laws and Treaties 34 (1904). Text read on the Oklahoma State University Tribal Treaties Database page named in the link (Kappler''s text) on Nov. 22, 2026; Article VII quoted in the Foundations timeline. The Kappler page is the treaty''s first page as given by the database page''s address and was not checked against a page image of the 1904 printing. Proclaimed Jan. 21, 1795. Not cross-checked on the Avalon Project (no copy found there).'
