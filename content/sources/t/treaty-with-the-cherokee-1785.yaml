notes: 'Citation: Treaty with the Cherokee, 1785 (Treaty of Hopewell), 7 Stat. 18, reprinted in 2 Charles J. Kappler, Indian Affairs: Laws and Treaties 8 (1904). Text read on the Oklahoma State University Tribal Treaties Database page named in the link (Kappler''s text) on Nov. 22, 2026; Articles VI, VII and VIII quoted in the Foundations timeline. The Kappler page is the treaty''s first page as given by the database page''s address. Text check, Nov. 24, 2026 (research/reviews/2026-11-24-treaty-verification-ratified.csv): the stored Statutes at Large text and the Oklahoma State University scan of Kappler agree with the parties, the date signed, the citation (7 Stat. 18, its first page) and the Kappler page. It stays Unverified until the nation reviews it.'
