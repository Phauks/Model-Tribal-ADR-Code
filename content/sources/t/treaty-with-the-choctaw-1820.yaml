notes: 'Indigo Book citation: Treaty with the Choctaw, Oct. 18, 1820, 7 Stat. 210. Ratified treaty (Kappler vol. 2, p. 191; header "Oct. 18, 1820. | 7 Stat., 210. | Proclamation, Jan. 8, 1821."). The text is the Statutes at Large granule on GovInfo; the Oklahoma State University Tribal Treaties Database reproduces it at https://treaties.okstate.edu/treaties/treaty-with-the-choctaw-1820-0191. Title, date and citation come from the database and the Kappler header, generated by scripts/law/treaty_records.py; not yet read against the text (Unverified). The nations that descend from its signatories are on their nation pages (treaties). The Statutes at Large granule GovInfo returns for this citation did not clearly show this treaty, so no copy is stored; check the citation (research/reviews/2026-11-24-treaty-text-check.csv).'
