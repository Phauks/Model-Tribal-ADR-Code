notes: 'Indigo Book citation: Treaty with the Quapaw, Aug. 24, 1818, 7 Stat. 176. Ratified treaty (Kappler vol. 2, p. 160; header "Aug. 24, 1818. | 7 Stat., 176. | Proclamation Jan. 5, 1819 [1818]."). The text is the Statutes at Large granule on GovInfo; the Oklahoma State University Tribal Treaties Database reproduces it at https://treaties.okstate.edu/treaties/treaty-with-the-quapaw-1818-0160. Title, date and citation come from the database and the Kappler header, generated by scripts/law/treaty_records.py. The nations that descend from its signatories are on their nation pages (treaties). Text check, Nov. 24, 2026 (research/reviews/2026-11-24-treaty-verification-ratified.csv): the stored Statutes at Large text and the Oklahoma State University scan of Kappler agree with the parties, the date signed, the citation (7 Stat. 176, its first page) and the Kappler page. The Statutes at Large margin prints the proclamation as Jan. 5, 1818, before the treaty was signed; Kappler''s header gives Jan. 5, 1819 and marks the printed 1818. It stays Unverified until the nation reviews it.'
