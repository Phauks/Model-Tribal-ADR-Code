notes: 'Indigo Book citation: Treaty with the Kansa Indians, Mar. 13, 1862, 12 Stat. 1221. Ratified treaty (Kappler vol. 2, p. 829; header "Mar. 13, 1862. | 12 Stats., 1221. | Ratified Feb. 6, 1863. | Proclaimed Mar. 16, 1863."). The text is the Statutes at Large granule on GovInfo; the Oklahoma State University Tribal Treaties Database reproduces it at https://treaties.okstate.edu/treaties/treaty-with-the-kansa-indians-1862-0829. Title, date and citation come from the database and the Kappler header, generated by scripts/law/treaty_records.py; not yet read against the text (Unverified). The nations that descend from its signatories are on their nation pages (treaties).'
