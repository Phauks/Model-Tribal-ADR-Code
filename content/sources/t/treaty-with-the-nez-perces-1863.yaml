notes: 'Indigo Book citation: Treaty with the Nez Perces, June 9, 1863, 14 Stat. 647. Ratified treaty (Kappler vol. 2, p. 843; header "June 9, 1863. | 14 Stats., 647. | Ratified Apr. 17, 1867. | Proclaimed Apr. 20, 1867."). The text is the Statutes at Large granule on GovInfo; the Oklahoma State University Tribal Treaties Database reproduces it at https://treaties.okstate.edu/treaties/treaty-with-the-nez-perces-1863-0843. Title, date and citation come from the database and the Kappler header, generated by scripts/law/treaty_records.py; not yet read against the text (Unverified). The nations that descend from its signatories are on their nation pages (treaties).'
