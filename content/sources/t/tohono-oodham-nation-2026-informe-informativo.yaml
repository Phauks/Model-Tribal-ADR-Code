annotation: The Nation's own Spanish-language issue brief. The Nation's ancestral lands extend from central Arizona
  into Sonora; the 1854 Gadsden Purchase line "fragmentó las tierras ancestrales de la Nación y separó a muchas
  de sus familias"; about 3,000 enrolled citizens still live in Sonora; the government in Sells has executive, legislative
  and judicial branches and eleven district governments; about 62 miles of the Nation border Mexico.
