notes: 'Indigo Book citation: Treaty with the Comanche, Kiowa, and Apache, July 27, 1853, 10 Stat. 1013. Ratified treaty (Kappler vol. 2, p. 600; header "July 27, 1853. | 10 Stats., 1013. | Ratified Apr. 12, 1854. | Proclaimed Feb. 12, 1855 [4]."). The text is the Statutes at Large granule on GovInfo; the Oklahoma State University Tribal Treaties Database reproduces it at https://treaties.okstate.edu/treaties/treaty-with-the-comanche-kiowa-and-apache-1853-0600. Title, date and citation come from the database and the Kappler header, generated by scripts/law/treaty_records.py. The nations that descend from its signatories are on their nation pages (treaties). Text check, Nov. 24, 2026 (research/reviews/2026-11-24-treaty-verification-ratified.csv): the stored Statutes at Large text and the Oklahoma State University scan of Kappler agree with the parties, the date signed, the citation (10 Stat. 1013, its first page), the Kappler page and the ratification date in Kappler''s header. The proclamation printed in the Statutes at Large is dated "the twelfth day of February, in the year of our Lord eighteen hundred and fifty-four"; Kappler''s header gives Feb. 12, 1855, with 1854 in brackets. It stays Unverified until the nation reviews it.'
