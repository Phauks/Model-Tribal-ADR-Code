annotation: A Tribal Law and Policy Institute report on a peer-to-peer mentor court program that pairs established tribal Healing to Wellness Courts with courts in planning or early stages. It reviews the ten key components of these therapeutic courts, the eligibility and selection criteria for mentor courts, and profiles of three founding programs including their team structure, referral and phase design. It is useful for tribal courts designing or assessing post-adjudication and therapeutic court processes. (project analysis)
