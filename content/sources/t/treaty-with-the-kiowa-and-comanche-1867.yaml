notes: 'Citation: Treaty with the Kiowa and Comanche, 1867 (Medicine Lodge Treaty), 15 Stat. 581, reprinted in 2 Charles J. Kappler, Indian Affairs: Laws and Treaties 977 (1904). Text read on the Oklahoma State University Tribal Treaties Database page named in the link (Kappler''s text) on Nov. 22, 2026; Article 1 (the "bad men" clause) quoted in the Foundations timeline. The Kappler page is the treaty''s first page as given by the database page''s address and was not checked against a page image of the 1904 printing. Proclaimed Aug. 25, 1868.'
