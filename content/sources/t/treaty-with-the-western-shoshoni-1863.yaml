notes: 'Indigo Book citation: Treaty with the Western Shoshoni, Oct. 1, 1863, 18 Stat. 689. Ratified treaty (Kappler vol. 2, p. 851; header "Oct. 1, 1863. | 18 Stats., 689. | Ratified June 26, 1866. | Proclaimed Oct. 21, 1869."). The text is the Statutes at Large granule on GovInfo; the Oklahoma State University Tribal Treaties Database reproduces it at https://treaties.okstate.edu/treaties/treaty-with-the-western-shoshoni-1863-0851. Title, date and citation come from the database and the Kappler header, generated by scripts/law/treaty_records.py. The nations that descend from its signatories are on their nation pages (treaties). GovInfo has no copy of 18 Stat., pt. 3, where Kappler places this treaty: its link for 18 Stat. 689 opens the Revised Statutes (pt. 1). The text is Kappler''s. Text check, Nov. 24, 2026 (research/reviews/2026-11-24-treaty-verification-ratified.csv): Kappler p. 851 confirmed on the Oklahoma State University scan; the Statutes at Large do not print this treaty. Stored text, Nov. 28, 2026 (scripts/law/treaty_texts.py): the pages that hold it in Kappler, Indian Affairs: Laws and Treaties, vol. 2 (pp. 851–853), from the GovInfo scan''s text layer; the database''s transcription is not copied. It stays Unverified until the nation reviews it.'
