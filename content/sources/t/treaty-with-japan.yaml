notes: 'A treaty of the Hawaiian Kingdom, not of the United States with a Native nation; the database lists it among its Hawaiian Kingdom documents. A treaty of amity and commerce between the King of Hawaii and the Tenno of Japan, concluded at Yeddo, Aug. 19, 1871. Header: "August 19, 1871". Listed in the Oklahoma State University Tribal Treaties Database, which reproduces the text; metadata generated by scripts/law/treaty_records.py. Text check, Nov. 24, 2026 (research/reviews/2026-11-24-treaty-verification-other.csv): the database holds the document with a scan of it, and its date matches the record. Stored text, Nov. 28, 2026 (scripts/law/treaty_texts.py): the pages that hold it in Treaties and Conventions Concluded Between the Hawaiian Kingdom and Other Powers, Since 1825 (pp. 115–117), from the Internet Archive scan''s text layer; the database''s transcription is not copied. It stays Unverified.'
