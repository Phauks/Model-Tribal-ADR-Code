notes: 'Indigo Book citation: Treaty with the Pawnee Tribe, Sept. 30, 1825, 7 Stat. 279. Ratified treaty (Kappler vol. 2, p. 258; header "Sept. 30, 1825. | 7 Stat., 279. | Proclamation, Feb. 6, 1826."). The text is the Statutes at Large granule on GovInfo; the Oklahoma State University Tribal Treaties Database reproduces it at https://treaties.okstate.edu/treaties/treaty-with-the-pawnee-tribe-1825-0258. Title, date and citation come from the database and the Kappler header, generated by scripts/law/treaty_records.py. The nations that descend from its signatories are on their nation pages (treaties). Text check, Nov. 24, 2026 (research/reviews/2026-11-24-treaty-verification-ratified.csv): the stored Statutes at Large text and the Oklahoma State University scan of Kappler agree with the parties, the date signed, the citation (7 Stat. 279, its first page), the Kappler page and the proclamation date in Kappler''s header. It stays Unverified until the nation reviews it.'
