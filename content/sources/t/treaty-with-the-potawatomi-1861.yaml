notes: 'Indigo Book citation: Treaty with the Potawatomi, Nov. 15, 1861, 12 Stat. 1191. Ratified treaty (Kappler vol. 2, p. 824; header "Nov. 15, 1861. | 12 Stats., 1191. | Ratified Apr. 15, 1862. | Proclaimed Apr. 19, 1862."). The text is the Statutes at Large granule on GovInfo; the Oklahoma State University Tribal Treaties Database reproduces it at https://treaties.okstate.edu/treaties/treaty-with-the-potawatomi-1861-0824. Title, date and citation come from the database and the Kappler header, generated by scripts/law/treaty_records.py; not yet read against the text (Unverified). The nations that descend from its signatories are on their nation pages (treaties).'
