notes: 'Indigo Book citation: Treaty with the Sauk and Foxes, Oct. 21, 1837, 7 Stat. 543. Ratified treaty (Kappler vol. 2, p. 497; header "Oct. 21, 1837. | 7 Stat., 543. | Proclamation, Feb. 21, 1838."). The text is the Statutes at Large granule on GovInfo; the Oklahoma State University Tribal Treaties Database reproduces it at https://treaties.okstate.edu/treaties/treaty-with-the-sauk-and-foxes-1837-0497. Title, date and citation come from the database and the Kappler header, generated by scripts/law/treaty_records.py. The nations that descend from its signatories are on their nation pages (treaties). Text check, Nov. 24, 2026 (research/reviews/2026-11-24-treaty-verification-ratified.csv): the stored Statutes at Large text and the Oklahoma State University scan of Kappler agree with the parties, the date signed, the citation (7 Stat. 543, its first page), the Kappler page and the proclamation date in Kappler''s header. It stays Unverified until the nation reviews it.'
