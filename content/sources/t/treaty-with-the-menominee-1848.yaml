notes: 'Indigo Book citation: Treaty with the Menominee, Oct. 18, 1848, 9 Stat. 952. Ratified treaty (Kappler vol. 2, p. 572; header "Oct. 18, 1848. | 9 Stat., 952. | Ratified Jan. 23, 1849."). The text is the Statutes at Large granule on GovInfo; the Oklahoma State University Tribal Treaties Database reproduces it at https://treaties.okstate.edu/treaties/treaty-with-the-menominee-1848-0572. Title, date and citation come from the database and the Kappler header, generated by scripts/law/treaty_records.py. The nations that descend from its signatories are on their nation pages (treaties). Text check, Nov. 24, 2026 (research/reviews/2026-11-24-treaty-verification-ratified.csv): the stored Statutes at Large text and the Oklahoma State University scan of Kappler agree with the parties, the date signed, the citation (9 Stat. 952, its first page), the Kappler page and the ratification date in Kappler''s header. It stays Unverified until the nation reviews it.'
