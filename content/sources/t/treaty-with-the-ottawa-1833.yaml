notes: 'Indigo Book citation: Treaty with the Ottawa, Feb. 18, 1833, 7 Stat. 420. Ratified treaty (Kappler vol. 2, p. 392; header "Feb. 18, 1833. | 7 Stat., 420. | Proclamation, Mar. 22, 1833."). The text is the Statutes at Large granule on GovInfo; the Oklahoma State University Tribal Treaties Database reproduces it at https://treaties.okstate.edu/treaties/treaty-with-the-ottawa-1833-0392. Title, date and citation come from the database and the Kappler header, generated by scripts/law/treaty_records.py. The nations that descend from its signatories are on their nation pages (treaties). Text check, Nov. 24, 2026 (research/reviews/2026-11-24-treaty-verification-ratified.csv): the stored Statutes at Large text and the Oklahoma State University scan of Kappler agree with the parties, the date signed, the citation (7 Stat. 420, its first page), the Kappler page and the proclamation date in Kappler''s header. It stays Unverified until the nation reviews it.'
