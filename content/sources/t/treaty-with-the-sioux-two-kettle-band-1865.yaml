notes: 'Indigo Book citation: Treaty with the Sioux-Two-Kettle Band, Oct. 19, 1865, 14 Stat. 723. Ratified treaty (Kappler vol. 2, p. 896; header "Oct. 19, 1865. | 14 Stats, 723. | Ratified Mar. 5, 1866. | Proclaimed Mar. 17, 1866."). The text is the Statutes at Large granule on GovInfo; the Oklahoma State University Tribal Treaties Database reproduces it at https://treaties.okstate.edu/treaties/treaty-with-the-sioux-two-kettle-band-1865-0896. Title, date and citation come from the database and the Kappler header, generated by scripts/law/treaty_records.py. The nations that descend from its signatories are on their nation pages (treaties). Text check, Nov. 24, 2026 (research/reviews/2026-11-24-treaty-verification-ratified.csv): the stored Statutes at Large text and the Oklahoma State University scan of Kappler agree with the parties, the date signed, the citation (14 Stat. 723, its first page), the Kappler page, the ratification date in Kappler''s header and the proclamation date in Kappler''s header. It stays Unverified until the nation reviews it.'
