notes: 'Indigo Book citation: Treaty with the Sauk and Foxes, etc., Mar. 6, 1861, 12 Stat. 1171. Ratified treaty (Kappler vol. 2, p. 811; header "Mar. 6, 1861 | 12 Stat., 1171. | Ratified Feb. 6, 1863. | Proclaimed Mar. 26, 1863."). The text is the Statutes at Large granule on GovInfo; the Oklahoma State University Tribal Treaties Database reproduces it at https://treaties.okstate.edu/treaties/treaty-with-the-sauk-and-foxes-etc-1861-0811. Title, date and citation come from the database and the Kappler header, generated by scripts/law/treaty_records.py. The nations that descend from its signatories are on their nation pages (treaties). Text check, Nov. 24, 2026 (research/reviews/2026-11-24-treaty-verification-ratified.csv): the stored Statutes at Large text and the Oklahoma State University scan of Kappler agree with the parties, the date signed, the citation (12 Stat. 1171, its first page), the Kappler page, the ratification date in Kappler''s header and the proclamation date in Kappler''s header. It stays Unverified until the nation reviews it.'
