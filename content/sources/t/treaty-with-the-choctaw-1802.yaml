notes: 'Indigo Book citation: Treaty with the Choctaw, Oct. 17, 1802, 7 Stat. 73. Ratified treaty (Kappler vol. 2, p. 63; header "Oct. 17, 1802. | 7 Stat., 73. | Ratified June 20, 1803. | Proclaimed Jan. 20, 1803."). The text is the Statutes at Large granule on GovInfo; the Oklahoma State University Tribal Treaties Database reproduces it at https://treaties.okstate.edu/treaties/treaty-with-the-choctaw-1802-0063. Title, date and citation come from the database and the Kappler header, generated by scripts/law/treaty_records.py. The nations that descend from its signatories are on their nation pages (treaties). Text check, Nov. 24, 2026 (research/reviews/2026-11-24-treaty-verification-ratified.csv): the stored Statutes at Large text and the Oklahoma State University scan of Kappler agree with the parties, the date signed, the citation (7 Stat. 73, its first page), the Kappler page and the proclamation date in Kappler''s header. The Statutes at Large margin reads "Ratified Jan. 20, 1803" beside "Proclamation, Jan. 20, 1803"; Kappler''s header gives June 20, 1803 for the ratification. It stays Unverified until the nation reviews it.'
