notes: 'Citation: Treaty with the Wyandot, etc., 1795 (Treaty of Greenville), 7 Stat. 49, reprinted in 2 Charles J. Kappler, Indian Affairs: Laws and Treaties 39 (1904). Text read on the Oklahoma State University Tribal Treaties Database page named in the link (Kappler''s text) on Nov. 22, 2026; Article IX quoted in the Foundations timeline. The Kappler page is the treaty''s first page as given by the database page''s address and was not checked against a page image of the 1904 printing. Proclaimed Dec. 2, 1795. The Avalon Project copy (https://avalon.law.yale.edu/18th_century/greenvil.asp) prints the article with different capitalization. The treaty had many other Native signatory nations; only some are listed in tribes.'
