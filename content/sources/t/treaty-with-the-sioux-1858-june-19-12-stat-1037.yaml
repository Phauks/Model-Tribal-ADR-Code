notes: 'Indigo Book citation: Treaty with the Sioux, June 19, 1858, 12 Stat. 1037. Ratified treaty (Kappler vol. 2, p. 785; header "June 19, 1858. | 12 Stats., p. 1037, | Ratified Mar. 9, 1859. | Proclaimed Mar. 31, 1859."). The text is the Statutes at Large granule on GovInfo; the Oklahoma State University Tribal Treaties Database reproduces it at https://treaties.okstate.edu/treaties/treaty-with-the-sioux-1858-0785. Title, date and citation come from the database and the Kappler header, generated by scripts/law/treaty_records.py; not yet read against the text (Unverified). The nations that descend from its signatories are on their nation pages (treaties).'
