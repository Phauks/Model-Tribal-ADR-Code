case_box:
  background: |-
    Jerry Teague, a nonmember, was general manager of the Bad River Band's casino. After his employment ended he sued in state circuit court to compel arbitration under his employment contract. More than a year later the Band sued in its Tribal court, which declared the contract invalid under Tribal law and ruled first, and the Band asked the circuit court to give that judgment full faith and credit under Wis. Stat. § 806.245 [@teague-v-bad-river-band-2000, ¶¶ 1-2].
  question: |-
    May a Wisconsin court deny full faith and credit to a Tribal court judgment under the state "prior action pending" rule because the same dispute was filed first in state court?
  holding: |-
    No. The court held that the prior-action-pending rule does not apply to a Tribal court, a court of an independent sovereign. But comity required the state and Tribal courts, aware of each other's parallel proceedings, to confer to allocate jurisdiction. It reversed and remanded for such a judicial conference.
  quotes:
  - text: "We now hold that the prior action pending rule of Syver does not apply to these circumstances because an Indian tribal court is a court of an independent sovereign."
    pinpoint: "¶ 2"
  - text: "However, under the circumstances of this case, principles of comity required that the state and tribal courts confer for purposes of allocating jurisdiction between them, in order to avoid both the race to judgment and inconsistent results that occurred here."
    pinpoint: "¶ 2"
  treatment: |-
    Followed by *Teague v. Bad River Band*, 2003 WI 118 (the same dispute after remand). [@teague-v-bad-river-band-2003]
  topics:
  - "Recognition of Tribal judgments (comity)"
  - "Enforcement of awards, orders and judgments"
