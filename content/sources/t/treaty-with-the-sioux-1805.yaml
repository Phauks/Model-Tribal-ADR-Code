notes: 'Not in Kappler''s list of ratified treaties (the database''s address places it at Kappler vol. 2, p. 1031), but the Senate consented to it: its header says "Ratified Apr. 16, 1808. Never proclaimed by the President." Header: "Sept. 23, 1805. | Laws Relating to Indian Affairs, 1883, p. 316. | Ratified Apr. 16, 1808. Never pro". Listed in the Oklahoma State University Tribal Treaties Database, which reproduces the text; metadata generated by scripts/law/treaty_records.py. Text check, Nov. 24, 2026 (research/reviews/2026-11-24-treaty-verification-other.csv): the database holds the document with a scan of it, and its date matches the record. Stored text, Nov. 28, 2026 (scripts/law/treaty_texts.py): the pages that hold it in Kappler, Indian Affairs: Laws and Treaties, vol. 2 (p. 1031), from the GovInfo scan''s text layer; the database''s transcription is not copied. It stays Unverified.'
