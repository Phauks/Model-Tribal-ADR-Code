notes: 'Indigo Book citation: Treaty with the Seneca, Mixed Seneca and Shawnee, Quapaw, etc., Feb. 23, 1867, 15 Stat. 513. Ratified treaty (Kappler vol. 2, p. 960; header "Feb. 23, 1867. | 15 Stats., 513. | Ratified June 18, 1868. | Proclaimed Oct. 14, 1868."). The text is the Statutes at Large granule on GovInfo; the Oklahoma State University Tribal Treaties Database reproduces it at https://treaties.okstate.edu/treaties/treaty-with-the-seneca-mixed-seneca-and-shawnee-quapaw-etc-1867-0960. Title, date and citation come from the database and the Kappler header, generated by scripts/law/treaty_records.py. The nations that descend from its signatories are on their nation pages (treaties). Text check, Nov. 24, 2026 (research/reviews/2026-11-24-treaty-verification-ratified.csv): the stored Statutes at Large text and the Oklahoma State University scan of Kappler agree with the parties, the date signed, the citation (15 Stat. 513, its first page), the Kappler page, the ratification date in Kappler''s header and the proclamation date in Kappler''s header. It stays Unverified until the nation reviews it.'
