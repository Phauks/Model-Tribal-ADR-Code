notes: 'Citation: Treaty with the Ute, 1868, 15 Stat. 619, reprinted in 2 Charles J. Kappler, Indian Affairs: Laws and Treaties 990 (1904). Text read on the Oklahoma State University Tribal Treaties Database page named in the link (Kappler''s text) on Nov. 22, 2026; Article 6 (the "bad men" clause) quoted in the Foundations timeline. The Kappler page is the treaty''s first page as given by the database page''s address and was not checked against a page image of the 1904 printing. Proclaimed Nov. 6, 1868. The clause litigated in Jones v. United States (Fed. Cir. 2017).'
