notes: 'Indigo Book citation: Treaty with the Quinaielt, etc., July 1, 1855, 12 Stat. 971. Ratified treaty (Kappler vol. 2, p. 719; header "July 1, 1855. Jan. 25, 1856. | 12 Stats., 971. | Ratified Mar. 8, 1859. | Proclaimed, Apr. 11, 1859."). The text is the Statutes at Large granule on GovInfo; the Oklahoma State University Tribal Treaties Database reproduces it at https://treaties.okstate.edu/treaties/treaty-with-the-quinaielt-etc-1855-0719. Title, date and citation come from the database and the Kappler header, generated by scripts/law/treaty_records.py. The nations that descend from its signatories are on their nation pages (treaties). Text check, Nov. 24, 2026 (research/reviews/2026-11-24-treaty-verification-ratified.csv): the stored Statutes at Large text and the Oklahoma State University scan of Kappler agree with the parties, the date signed, the citation (12 Stat. 971, its first page), the Kappler page, the ratification date in Kappler''s header and the proclamation date in Kappler''s header. It stays Unverified until the nation reviews it.'
