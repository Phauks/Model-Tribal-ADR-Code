notes: 'Indigo Book citation: Treaty with the Eastern Band Shoshonees and Bannacks (Fort Bridger), July 3, 1868, 15 Stat. 673. Read the page images text of the Statutes at Large PDF from govinfo (https://www.govinfo.gov/content/pkg/STATUTE-15/pdf/STATUTE-15-Pg673.pdf), extracted with pdftotext; Private copy research/captures/jurisdiction/treaty-with-the-eastern-band-shoshoni-and-bannock-1868.pdf. Text check, Nov. 24, 2026 (research/reviews/2026-11-24-treaty-verification-ratified.csv): the stored Statutes at Large text and the Oklahoma State University scan of Kappler agree with the parties, the date signed, the citation (15 Stat. 673, its first page), the Kappler page and the proclamation date in Kappler''s header. The Statutes at Large print the Senate''s advice and consent as Feb. 16, 1869 (margin and text); Kappler''s header gives Feb. 26, 1869, two days after the proclamation. It stays Unverified until the nation reviews it.'
