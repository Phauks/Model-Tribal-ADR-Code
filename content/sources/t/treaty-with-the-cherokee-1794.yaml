notes: 'Indigo Book citation: Treaty with the Cherokee, June 26, 1794, 7 Stat. 43. Ratified treaty (Kappler vol. 2, p. 33; header "June 26, 1794. | 7 Stat., 43. | Proclamation, Jan. 21, 1795. | Ante, p. 29."). The text is the Statutes at Large granule on GovInfo; the Oklahoma State University Tribal Treaties Database reproduces it at https://treaties.okstate.edu/treaties/treaty-with-the-cherokee-1794-0033. Title, date and citation come from the database and the Kappler header, generated by scripts/law/treaty_records.py; not yet read against the text (Unverified). The nations that descend from its signatories are on their nation pages (treaties).'
