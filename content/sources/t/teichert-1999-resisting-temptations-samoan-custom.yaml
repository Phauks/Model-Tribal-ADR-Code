annotation: >-
  A student-era law review article arguing for preserving Samoan custom in American
  Samoa law. The accessible excerpt describes the fa'a Samoa as "the essence of being
  Samoan." It says government by matai and village councils "engenders a healthy
  degree of local pride" and lets villages implement solutions "with which the people
  are culturally familiar." The table of contents includes sections on statutes protecting
  communal land and the High Court's associate judges. (project analysis) Potentially
  useful scholarship on custom and courts, but only a preview was read. The Land
  and Titles discussion was not seen, and no page numbers were available.
