notes: 'Indigo Book citation: Treaty with the Miami, Oct. 6, 1818, 7 Stat. 189. Ratified treaty (Kappler vol. 2, p. 171; header "Oct. 6, 1818. | 7 Stats., 189. | Proclamation Jan. 15, 1319 [1819]."). The text is the Statutes at Large granule on GovInfo; the Oklahoma State University Tribal Treaties Database reproduces it at https://treaties.okstate.edu/treaties/treaty-with-the-miami-1818-0171. Title, date and citation come from the database and the Kappler header, generated by scripts/law/treaty_records.py. The nations that descend from its signatories are on their nation pages (treaties). Text check, Nov. 24, 2026 (research/reviews/2026-11-24-treaty-verification-ratified.csv): the stored Statutes at Large text and the Oklahoma State University scan of Kappler agree with the parties, the date signed, the citation (7 Stat. 189, its first page) and the Kappler page. The Statutes at Large margin gives the proclamation as Jan. 15, 1819; the header''s 1319 is a misreading. It stays Unverified until the nation reviews it.'
