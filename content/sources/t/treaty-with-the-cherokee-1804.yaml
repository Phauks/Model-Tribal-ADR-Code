notes: 'Indigo Book citation: Treaty with the Cherokee, Oct. 24, 1804, 7 Stat. 228. Ratified treaty (Kappler vol. 2, p. 73; header "Oct. 24, 1804. | 7 Stat., 288. | Proclamation, May 17, 1824."). The text is the Statutes at Large granule on GovInfo; the Oklahoma State University Tribal Treaties Database reproduces it at https://treaties.okstate.edu/treaties/treaty-with-the-cherokee-1804-0073. Title, date and citation come from the database and the Kappler header, generated by scripts/law/treaty_records.py. The nations that descend from its signatories are on their nation pages (treaties). Checked by hand, Nov. 24, 2026: Pg228 holds the Cherokee treaty of Oct. 24, 1804 (proclaimed 1824); the data''s 7 Stat. 288 was a misprint. The database gives 7 Stat. 288, a misprint. Text check, Nov. 24, 2026 (research/reviews/2026-11-24-treaty-verification-ratified.csv): the stored Statutes at Large text and the Oklahoma State University scan of Kappler agree with the parties, the date signed, the citation (7 Stat. 228, its first page), the Kappler page and the proclamation date in Kappler''s header. It stays Unverified until the nation reviews it.'
