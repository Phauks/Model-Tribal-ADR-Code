annotation: Call 42 (p. 5) asks governments "to commit to the recognition and implementation of Aboriginal
  justice systems in a manner consistent with the Treaty and Aboriginal rights of Aboriginal peoples,
  the Constitution Act, 1982, and the United Nations Declaration on the Rights of Indigenous Peoples."
  Call 50 (p. 6) asks the federal government to "fund the establishment of Indigenous law institutes for
  the development, use, and understanding of Indigenous laws and access to justice."
