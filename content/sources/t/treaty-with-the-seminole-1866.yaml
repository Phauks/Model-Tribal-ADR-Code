notes: 'Indigo Book citation: Treaty with the Seminole, Mar. 21, 1866, 14 Stat. 755. Ratified treaty (Kappler vol. 2, p. 910; header "Mar. 21, 1866. | 14 Stats., 755. | Ratified, July 19, 1866. | Proclamed, Aug. 16, 1866."). The text is the Statutes at Large granule on GovInfo; the Oklahoma State University Tribal Treaties Database reproduces it at https://treaties.okstate.edu/treaties/treaty-with-the-seminole-1866-0910. Title, date and citation come from the database and the Kappler header, generated by scripts/law/treaty_records.py; not yet read against the text (Unverified). The nations that descend from its signatories are on their nation pages (treaties).'
