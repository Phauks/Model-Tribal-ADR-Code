notes: 'Indigo Book citation: Treaty with the Seminole, Mar. 21, 1866, 14 Stat. 755. Ratified treaty (Kappler vol. 2, p. 910; header "Mar. 21, 1866. | 14 Stats., 755. | Ratified, July 19, 1866. | Proclamed, Aug. 16, 1866."). The text is the Statutes at Large granule on GovInfo; the Oklahoma State University Tribal Treaties Database reproduces it at https://treaties.okstate.edu/treaties/treaty-with-the-seminole-1866-0910. Title, date and citation come from the database and the Kappler header, generated by scripts/law/treaty_records.py. The nations that descend from its signatories are on their nation pages (treaties). Text check, Nov. 24, 2026 (research/reviews/2026-11-24-treaty-verification-ratified.csv): the stored Statutes at Large text and the Oklahoma State University scan of Kappler agree with the parties, the date signed, the citation (14 Stat. 755, its first page), the Kappler page and the ratification date in Kappler''s header. It stays Unverified until the nation reviews it.'
