notes: 'Indigo Book citation: Treaty with the Chippewa of Saginaw, Swan Creek, and Black River, Oct. 18, 1864, 14 Stat. 637. Ratified treaty (Kappler vol. 2, p. 868; header "Oct. 18, 1864. | 14 Stats., 637. | Ratified May 22, 1866. | Proclaimed Aug. 16, 1866."). The text is the Statutes at Large granule on GovInfo; the Oklahoma State University Tribal Treaties Database reproduces it at https://treaties.okstate.edu/treaties/treaty-with-the-chippewa-of-saginaw-swan-creek-and-black-river-1864-0868. Title, date and citation come from the database and the Kappler header, generated by scripts/law/treaty_records.py; not yet read against the text (Unverified). The nations that descend from its signatories are on their nation pages (treaties). The Statutes at Large granule GovInfo returns for this citation did not clearly show this treaty, so no copy is stored; check the citation (research/reviews/2026-11-24-treaty-text-check.csv).'
