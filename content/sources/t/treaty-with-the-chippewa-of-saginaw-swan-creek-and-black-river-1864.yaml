notes: 'Indigo Book citation: Treaty with the Chippewa of Saginaw, Swan Creek, and Black River, Oct. 18, 1864, 14 Stat. 657. Ratified treaty (Kappler vol. 2, p. 868; header "Oct. 18, 1864. | 14 Stats., 637. | Ratified May 22, 1866. | Proclaimed Aug. 16, 1866."). The text is the Statutes at Large granule on GovInfo; the Oklahoma State University Tribal Treaties Database reproduces it at https://treaties.okstate.edu/treaties/treaty-with-the-chippewa-of-saginaw-swan-creek-and-black-river-1864-0868. Title, date and citation come from the database and the Kappler header, generated by scripts/law/treaty_records.py. The nations that descend from its signatories are on their nation pages (treaties). Checked by hand, Nov. 24, 2026: Pg657 is the treaty of Oct. 18, 1864; the data''s 14 Stat. 637 was a misprint (that page is an 1867 private law). The database gives 14 Stat. 637, a misprint. Text check, Nov. 24, 2026 (research/reviews/2026-11-24-treaty-verification-ratified.csv): the stored Statutes at Large text and the Oklahoma State University scan of Kappler agree with the parties, the date signed, the citation (14 Stat. 657, its first page), the Kappler page, the ratification date in Kappler''s header and the proclamation date in Kappler''s header. It stays Unverified until the nation reviews it.'
