notes: 'Indigo Book citation: Treaty with the Chickasaw, June 22, 1852, 10 Stat. 974. Ratified treaty (Kappler vol. 2, p. 596; header "June 22, 1852. | 10 Stat., 974. | Ratified Aug. 13, 1852. | Proclaimed, Feb. 24, 1853."). The text is the Statutes at Large granule on GovInfo; the Oklahoma State University Tribal Treaties Database reproduces it at https://treaties.okstate.edu/treaties/treaty-with-the-chickasaw-1852-0596. Title, date and citation come from the database and the Kappler header, generated by scripts/law/treaty_records.py. The nations that descend from its signatories are on their nation pages (treaties). Text check, Nov. 24, 2026 (research/reviews/2026-11-24-treaty-verification-ratified.csv): the stored Statutes at Large text and the Oklahoma State University scan of Kappler agree with the parties, the date signed, the citation (10 Stat. 974, its first page), the Kappler page, the ratification date in Kappler''s header and the proclamation date in Kappler''s header. It stays Unverified until the nation reviews it.'
