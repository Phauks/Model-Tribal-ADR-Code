notes: 'Indigo Book citation: Treaty with the Winnebago, Apr. 15, 1859, 12 Stat. 1101. Ratified treaty (Kappler vol. 2, p. 790; header "Apr. 15, 1859. | 12 Stats., 1101. | Ratified Mar. 16, 1861. | Proclaimed Mar. 23, 1861."). The text is the Statutes at Large granule on GovInfo; the Oklahoma State University Tribal Treaties Database reproduces it at https://treaties.okstate.edu/treaties/treaty-with-the-winnebago-1859-0790. Title, date and citation come from the database and the Kappler header, generated by scripts/law/treaty_records.py; not yet read against the text (Unverified). The nations that descend from its signatories are on their nation pages (treaties).'
