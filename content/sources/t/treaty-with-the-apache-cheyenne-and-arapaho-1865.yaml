notes: 'Indigo Book citation: Treaty with the Apache, Cheyenne, and Arapaho, Oct. 17, 1865, 14 Stat. 713. Ratified treaty (Kappler vol. 2, p. 891; header "Oct. 17, 1865. | 14 Stat., 713. | Ratified May 22, 1866. | Proclaimed May 26, 1866."). The text is the Statutes at Large granule on GovInfo; the Oklahoma State University Tribal Treaties Database reproduces it at https://treaties.okstate.edu/treaties/treaty-with-the-apache-cheyenne-and-arapaho-1865-0891. Title, date and citation come from the database and the Kappler header, generated by scripts/law/treaty_records.py. The nations that descend from its signatories are on their nation pages (treaties). Text check, Nov. 24, 2026 (research/reviews/2026-11-24-treaty-verification-ratified.csv): the stored Statutes at Large text and the Oklahoma State University scan of Kappler agree with the parties, the date signed, the citation (14 Stat. 713, its first page), the Kappler page, the ratification date in Kappler''s header and the proclamation date in Kappler''s header. It stays Unverified until the nation reviews it.'
