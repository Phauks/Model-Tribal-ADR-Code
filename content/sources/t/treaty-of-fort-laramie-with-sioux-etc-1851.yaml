notes: 'Indigo Book citation: Treaty of Fort Laramie with Sioux, etc., Sept. 17, 1851, 11 Stat. 749. Ratified treaty (Kappler vol. 2, p. 594; header "Sept. 17, 1851. | 11 Stats., p. 749."). The text is the Statutes at Large granule on GovInfo; the Oklahoma State University Tribal Treaties Database reproduces it at https://treaties.okstate.edu/treaties/treaty-of-fort-laramie-with-sioux-etc-1851-0594. Title, date and citation come from the database and the Kappler header, generated by scripts/law/treaty_records.py. The nations that descend from its signatories are on their nation pages (treaties). The Statutes at Large print no text at 11 Stat. 749, only a note that the treaty was "not yet in a proper form for publication" because the tribes had not all assented to the Senate''s amendments (11 Stat. 749, read on GovInfo, granule Pg743, pdf page 7). The text is Kappler''s. Text check, Nov. 24, 2026 (research/reviews/2026-11-24-treaty-verification-ratified.csv): Kappler p. 594 confirmed on the Oklahoma State University scan; the Statutes at Large do not print this treaty. Stored text, Nov. 28, 2026 (scripts/law/treaty_texts.py): the pages that hold it in Kappler, Indian Affairs: Laws and Treaties, vol. 2 (pp. 594–596), from the GovInfo scan''s text layer; the database''s transcription is not copied. It stays Unverified until the nation reviews it.'
