notes: Texas v. United States, 497 F.3d 491 (5th Cir. 2007). The court held that the State's challenge to the Secretary's
  Class III gaming procedures regulations (25 C.F.R. pt. 291) was ripe, that Texas had standing, and that the Secretary
  lacked authority to promulgate the regulations; it called the Secretarial procedures invalid and an unreasonable
  interpretation of IGRA. Opinion revised Sept. 13, 2007; Judge Dennis dissented. Read on the original link. Citator
  check (KeyCite) pending; see the project's Westlaw list.
