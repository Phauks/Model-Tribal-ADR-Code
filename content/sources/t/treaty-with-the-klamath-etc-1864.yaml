notes: 'Indigo Book citation: Treaty with the Klamath, etc., Oct. 14, 1864, 16 Stat. 707. Ratified treaty (Kappler vol. 2, p. 865; header "Oct. 14, 1864. | 16 Stats., 707. | Ratified, July 2, 1866. | Proclaimed Feb. 17, 1870."). The text is the Statutes at Large granule on GovInfo; the Oklahoma State University Tribal Treaties Database reproduces it at https://treaties.okstate.edu/treaties/treaty-with-the-klamath-etc-1864-0865. Title, date and citation come from the database and the Kappler header, generated by scripts/law/treaty_records.py; not yet read against the text (Unverified). The nations that descend from its signatories are on their nation pages (treaties).'
