notes: 'Indigo Book citation: Treaty with the Menominee, Feb. 17, 1831, 7 Stat. 346. Ratified treaty (Kappler vol. 2, p. 323; header "Feb. 17, 1831. | 7 Stat., 346. | Proclamation, July 9, 1832."). The text is the Statutes at Large granule on GovInfo; the Oklahoma State University Tribal Treaties Database reproduces it at https://treaties.okstate.edu/treaties/treaty-with-the-menominee-1831-0323. Title, date and citation come from the database and the Kappler header, generated by scripts/law/treaty_records.py. The nations that descend from its signatories are on their nation pages (treaties). Checked by hand, Nov. 24, 2026: The supplementary articles of Feb. 17, 1831 are on 7 Stat. 346, inside the Feb. 8 treaty''s granule (Pg342, pdf page 5). Text check, Nov. 24, 2026 (research/reviews/2026-11-24-treaty-verification-ratified.csv): the stored Statutes at Large text and the Oklahoma State University scan of Kappler agree with the parties, the date signed, the citation (7 Stat. 346, its first page) and the Kappler page. The Statutes at Large do not print the proclamation date. It stays Unverified until the nation reviews it.'
