notes: 'Indigo Book citation: Treaty with the Sauk and Foxes, Nov. 3, 1804, 7 Stat. 84. Ratified treaty (Kappler vol. 2, p. 74; header "Nov. 3, 1804. | 7 Stat., 84. | Ratified Jan. 25, 1805. | Proclaimed Feb. 21, 1805."). The text is the Statutes at Large granule on GovInfo; the Oklahoma State University Tribal Treaties Database reproduces it at https://treaties.okstate.edu/treaties/treaty-with-the-sauk-and-foxes-1804-0074. Title, date and citation come from the database and the Kappler header, generated by scripts/law/treaty_records.py. The nations that descend from its signatories are on their nation pages (treaties). Text check, Nov. 24, 2026 (research/reviews/2026-11-24-treaty-verification-ratified.csv): the stored Statutes at Large text and the Oklahoma State University scan of Kappler agree with the parties, the date signed, the citation (7 Stat. 84, its first page), the Kappler page, the ratification date in Kappler''s header and the proclamation date in Kappler''s header. It stays Unverified until the nation reviews it.'
