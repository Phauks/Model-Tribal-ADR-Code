notes: 'Not in Kappler''s list of ratified treaties, but the database marks it ratified; whether the Senate consented has not been checked against the Senate Executive Journal, so its status is open. Held at Albany on Aug. 20, 1802 under a United States commissioner, ceding land to New York; not the Seneca treaties of June 30, 1802 (7 Stat. 70 and 72). Header: "August 20, 1802". Listed in the Oklahoma State University Tribal Treaties Database, which reproduces the text; metadata generated by scripts/law/treaty_records.py. Text check, Nov. 24, 2026 (research/reviews/2026-11-24-treaty-verification-other.csv): the database holds the document with a scan of it, and its date matches the record. Stored text, Nov. 28, 2026 (scripts/law/treaty_texts.py): the pages that hold it in American State Papers, Indian Affairs, vol. 1 (pp. 664–665), from the Internet Archive scan''s full text; the database''s transcription is not copied. It stays Unverified.'
