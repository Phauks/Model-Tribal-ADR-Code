annotation: Recognizes the Texas Band of Kickapoo. Congress found the Band "was forced to migrate from its ancestral
  lands to what is now the State of Texas and the nation of Mexico" and that some members could not prove U.S. citizenship
  (sec. 2). Enrolled members could apply for citizenship for five years after the roll was published (sec. 4(c)),
  and, notwithstanding the immigration laws, members "shall be entitled to freely pass and repass the borders of
  the United States and to live and work in the United States" (sec. 4(d)). Codified at 25 U.S.C. §§ 1300b-11 to
  1300b-16.
