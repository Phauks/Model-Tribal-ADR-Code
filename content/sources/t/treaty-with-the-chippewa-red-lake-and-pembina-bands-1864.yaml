notes: 'Indigo Book citation: Treaty with the Chippewa - Red Lake and Pembina Bands, Apr. 12, 1864, 13 Stat. 689. Ratified treaty (Kappler vol. 2, p. 861; header "Apr. 12, 1864. | 13 Stat., 689. | Ratified Apr. 21, 1864. | Proclaimed Apr. 25, 1864."). The text is the Statutes at Large granule on GovInfo; the Oklahoma State University Tribal Treaties Database reproduces it at https://treaties.okstate.edu/treaties/treaty-with-the-chippewa-red-lake-and-pembina-bands-1864-0861. Title, date and citation come from the database and the Kappler header, generated by scripts/law/treaty_records.py. The nations that descend from its signatories are on their nation pages (treaties). Text check, Nov. 24, 2026 (research/reviews/2026-11-24-treaty-verification-ratified.csv): the stored Statutes at Large text and the Oklahoma State University scan of Kappler agree with the parties, the date signed, the citation (13 Stat. 689, its first page), the Kappler page, the ratification date in Kappler''s header and the proclamation date in Kappler''s header. It stays Unverified until the nation reviews it.'
