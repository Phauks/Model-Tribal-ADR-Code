notes: 'Indigo Book citation: Treaty with the Potawatomi, Dec. 10, 1834, 7 Stat. 467. Ratified treaty (Kappler vol. 2, p. 429; header "Dec. 10, 1834 | 7 Stat., 467: | Proclamation, Mar. 16, 1835."). The text is the Statutes at Large granule on GovInfo; the Oklahoma State University Tribal Treaties Database reproduces it at https://treaties.okstate.edu/treaties/treaty-with-the-potawatomi-1834-0429. Title, date and citation come from the database and the Kappler header, generated by scripts/law/treaty_records.py. The nations that descend from its signatories are on their nation pages (treaties). Checked by hand, Nov. 24, 2026: Pg467-2 is the treaty with Muck Rose''s band, Dec. 10, 1834. Text check, Nov. 24, 2026 (research/reviews/2026-11-24-treaty-verification-ratified.csv): the stored Statutes at Large text and the Oklahoma State University scan of Kappler agree with the parties, the date signed, the citation (7 Stat. 467, its first page), the Kappler page and the proclamation date in Kappler''s header. It stays Unverified until the nation reviews it.'
