notes: 'Citation: Treaty with the Delawares, 1778, 7 Stat. 13, reprinted in 2 Charles J. Kappler, Indian Affairs: Laws and Treaties 3 (1904). Text read on the Oklahoma State University Tribal Treaties Database page named in the link (Kappler''s text) on Nov. 22, 2026; Article IV quoted in the Foundations timeline. The Kappler page is the treaty''s first page as given by the database page''s address and was not checked against a page image of the 1904 printing. The Avalon Project copy (https://avalon.law.yale.edu/18th_century/del1778.asp) prints the same article with slightly different punctuation.'
