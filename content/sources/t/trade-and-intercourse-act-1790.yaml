notes: >-
  Citations: Act of July 22, 1790, ch. 33, 1 Stat. 137. Later history: Temporary act (two years, § 7);
  followed by the acts of 1793, 1796, 1799, 1802 and the permanent 1834 act. The current version of the
  land-sale restraint is 25 U.S.C. § 177 (see trade-and-intercourse-act-1834). Text read from the Library
  of Congress OCR of 1 Stat. The § 4 page (138) was inferred from the page header and should be checked
  against the page image.
law_box:
  summary: |-
    Required federal licenses to trade. It declared that no sale of land by "any nation or tribe of Indians" was valid "unless the same shall be made and duly executed at some public treaty, held under the authority of the United States" [@trade-and-intercourse-act-1790, sec. 4].
  reading:
    title: "Trade and Intercourse Act (1790)"
    text: |-
      This is the origin of the federal restraint on selling Tribal land.
