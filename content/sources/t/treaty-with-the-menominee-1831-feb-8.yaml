notes: 'Indigo Book citation: Treaty with the Menominee, Feb. 8, 1831, 7 Stat. 342. Ratified treaty (Kappler vol. 2, p. 319; header "Feb. 8, 1831. | 7 Stat., 342. | Proclamation, July 9, 1832."). The text is the Statutes at Large granule on GovInfo; the Oklahoma State University Tribal Treaties Database reproduces it at https://treaties.okstate.edu/treaties/treaty-with-the-menominee-1831-0319. Title, date and citation come from the database and the Kappler header, generated by scripts/law/treaty_records.py. The nations that descend from its signatories are on their nation pages (treaties). Checked by hand, Nov. 24, 2026: Pg342 is the Menominee treaty of Feb. 8, 1831; its granule also holds the supplementary articles of Feb. 17. Text check, Nov. 24, 2026 (research/reviews/2026-11-24-treaty-verification-ratified.csv): the stored Statutes at Large text and the Oklahoma State University scan of Kappler agree with the parties, the date signed, the citation (7 Stat. 342, its first page), the Kappler page and the proclamation date in Kappler''s header. It stays Unverified until the nation reviews it.'
