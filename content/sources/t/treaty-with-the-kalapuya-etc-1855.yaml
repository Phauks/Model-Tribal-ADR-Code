notes: 'Indigo Book citation: Treaty with the Kalapuya, etc., Jan. 22, 1855, 10 Stat. 1143. Ratified treaty (Kappler vol. 2, p. 665; header "Jan. 22, 1855. | 10 Stats., 1143. | Ratified, Mar. 3, 1855. | Proclaimed, Apr. 10, 1855."). The text is the Statutes at Large granule on GovInfo; the Oklahoma State University Tribal Treaties Database reproduces it at https://treaties.okstate.edu/treaties/treaty-with-the-kalapuya-etc-1855-0665. Title, date and citation come from the database and the Kappler header, generated by scripts/law/treaty_records.py. The nations that descend from its signatories are on their nation pages (treaties). Text check, Nov. 24, 2026 (research/reviews/2026-11-24-treaty-verification-ratified.csv): the stored Statutes at Large text and the Oklahoma State University scan of Kappler agree with the parties, the date signed, the citation (10 Stat. 1143, its first page), the Kappler page, the ratification date in Kappler''s header and the proclamation date in Kappler''s header. It stays Unverified until the nation reviews it.'
