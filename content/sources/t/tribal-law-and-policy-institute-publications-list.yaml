annotation: >-
  The Tribal Law and Policy Institute's publications list. Its Tribal Legal Code Resource series covers
  enhanced sentencing and jurisdiction under the Tribal Law and Order Act and the Violence Against Women
  Act, juvenile justice, domestic violence, sexual assault and stalking, and crimes against children;
  the juvenile justice guide includes guidance for "specialized court dockets such as juvenile wellness
  courts, peacemaking courts, and teen courts." The list also names a code-writing series with parts on
  environmental review and probate codes. (project analysis) No Tribal Law and Policy Institute model
  code for civil mediation, arbitration or other ADR appears on the list, which supports treating the
  model tribal ADR code as filling a gap rather than revising an existing intertribal model.
