notes: 'Indigo Book citation: Treaty with the Delawares, May 30, 1860, 12 Stat. 1129. Ratified treaty (Kappler vol. 2, p. 803; header "May 30, 1860. | 12 Stat., 1129. Ratified July 27, 1860. | Proclaimed Aug. 22, 1860."). The text is the Statutes at Large granule on GovInfo; the Oklahoma State University Tribal Treaties Database reproduces it at https://treaties.okstate.edu/treaties/treaty-with-the-delawares-1860-0803. Title, date and citation come from the database and the Kappler header, generated by scripts/law/treaty_records.py. The nations that descend from its signatories are on their nation pages (treaties). Text check, Nov. 24, 2026 (research/reviews/2026-11-24-treaty-verification-ratified.csv): the stored Statutes at Large text and the Oklahoma State University scan of Kappler agree with the parties, the date signed, the citation (12 Stat. 1129, its first page), the Kappler page and the proclamation date in Kappler''s header. The Statutes at Large print the Senate''s advice and consent as June 27, 1860 (margin and text); Kappler''s header gives July 27, 1860. It stays Unverified until the nation reviews it.'
