notes: 'Indigo Book citation: Treaty with the Delawares, May 30, 1860, 12 Stat. 1129. Ratified treaty (Kappler vol. 2, p. 803; header "May 30, 1860. | 12 Stat., 1129. Ratified July 27, 1860. | Proclaimed Aug. 22, 1860."). The text is the Statutes at Large granule on GovInfo; the Oklahoma State University Tribal Treaties Database reproduces it at https://treaties.okstate.edu/treaties/treaty-with-the-delawares-1860-0803. Title, date and citation come from the database and the Kappler header, generated by scripts/law/treaty_records.py; not yet read against the text (Unverified). The nations that descend from its signatories are on their nation pages (treaties).'
