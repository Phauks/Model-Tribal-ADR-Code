annotation: >-
  An OJP/NCJRS catalog record (NCJ 301221, 104 pages, BJA grants 2012-AC-BX-K001
  and 2016-IC-BX-K001) for the second edition of the forum directory hosted on the
  Walking on Common Ground site. The abstract says forums 'provide a structure for
  judges and court personnel to meet,' profiles forums in 13 states, and names Kansas,
  Nebraska, Oregon and Washington as new to this edition. The catalog page does not
  name an author; Tribal Law and Policy Institute authorship comes from the caller's
  brief and the Walking on Common Ground project, not from the catalog page, and
  should be confirmed. (project analysis) This is the standard reference on Tribal-state
  court forums. The PDF link (walkingoncommonground.org) returned 404, so Trevor
  should pull it through NCJRS or TLPI.
