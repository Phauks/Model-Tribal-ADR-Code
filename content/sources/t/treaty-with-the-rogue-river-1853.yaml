notes: 'Indigo Book citation: Treaty with the Rogue River, Sept. 10, 1853, 10 Stat. 1018. Ratified treaty (Kappler vol. 2, p. 603; header "Sept. 10, 1853. | 10 Stats., 1018. Ratified Apr. 12, 1854. | Proclaimed Feb. 5, 1855."). The text is the Statutes at Large granule on GovInfo; the Oklahoma State University Tribal Treaties Database reproduces it at https://treaties.okstate.edu/treaties/treaty-with-the-rogue-river-1853-0603. Title, date and citation come from the database and the Kappler header, generated by scripts/law/treaty_records.py; not yet read against the text (Unverified). The nations that descend from its signatories are on their nation pages (treaties).'
