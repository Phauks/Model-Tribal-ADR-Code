notes: 'Indigo Book citation: Treaty with the Cheyenne and Arapaho, Oct. 14, 1865, 14 Stat. 703. Ratified treaty (Kappler vol. 2, p. 887; header "Oct, 14, 1865. | 14 Stats., 703. | Ratified May 22, 1866. | Proclaimed Feb. 2, 1867."). The text is the Statutes at Large granule on GovInfo; the Oklahoma State University Tribal Treaties Database reproduces it at https://treaties.okstate.edu/treaties/treaty-with-the-cheyenne-and-arapaho-1865-0887. Title, date and citation come from the database and the Kappler header, generated by scripts/law/treaty_records.py; not yet read against the text (Unverified). The nations that descend from its signatories are on their nation pages (treaties).'
