notes: 'Indigo Book citation: Treaty with the Cherokee, Oct. 2, 1798, 7 Stat. 62. Ratified treaty (Kappler vol. 2, p. 51; header "Oct. 2, 1798. | 7 Stat., 62. | Ratified April 30, 1802. | Proclaimed May 4, 1802."). The text is the Statutes at Large granule on GovInfo; the Oklahoma State University Tribal Treaties Database reproduces it at https://treaties.okstate.edu/treaties/treaty-with-the-cherokee-1798-0051. Title, date and citation come from the database and the Kappler header, generated by scripts/law/treaty_records.py; not yet read against the text (Unverified). The nations that descend from its signatories are on their nation pages (treaties).'
