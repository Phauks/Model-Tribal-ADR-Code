notes: Lucy Thompson, a Yurok woman who writes that her maiden name was Che-na-wah Weitch-ah-wah, wrote this account
  of Yurok history, law and stories and published it herself in 1916. Read in the Library of Congress scan on the
  Internet Archive; a second scan (archive.org/details/cu31924097632685, Cornell University Library) was used to
  resolve misread characters in the scanned text. The book also describes the Talth, a secret lodge, and ceremonies;
  the project quotes none of that. The Yurok Tribe's own guidance on the book has not been sought.
