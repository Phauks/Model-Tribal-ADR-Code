notes: 'Citation: Treaty with the Cherokee, 1791 (Treaty of Holston), 7 Stat. 39, reprinted in 2 Charles J. Kappler, Indian Affairs: Laws and Treaties 29 (1904). Text read on the Oklahoma State University Tribal Treaties Database page named in the link (Kappler''s text) on Nov. 22, 2026; Articles X, XI and XII quoted in the Foundations timeline. The Kappler page is the treaty''s first page as given by the database page''s address and was not checked against a page image of the 1904 printing. Proclaimed Feb. 7, 1792.'
