notes: 'Citation: Treaty with the Cherokee, 1791 (Treaty of Holston), 7 Stat. 39, reprinted in 2 Charles J. Kappler, Indian Affairs: Laws and Treaties 29 (1904). Text read on the Oklahoma State University Tribal Treaties Database page named in the link (Kappler''s text) on Nov. 22, 2026; Articles X, XI and XII quoted in the Foundations timeline. The Kappler page is the treaty''s first page as given by the database page''s address. Proclaimed Feb. 7, 1792. Text check, Nov. 24, 2026 (research/reviews/2026-11-24-treaty-verification-ratified.csv): the stored Statutes at Large text and the Oklahoma State University scan of Kappler agree with the parties, the date signed, the citation (7 Stat. 39, its first page), the Kappler page and the proclamation date in Kappler''s header. It stays Unverified until the nation reviews it.'
