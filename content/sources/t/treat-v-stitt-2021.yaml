notes: Treat v. Stitt, 2021 OK 3. Per a fetch-tool excerpt, the court assumed original jurisdiction and declared
  the Governor's 2020 compacts with the United Keetoowah Band and Kialegee Tribal Town invalid under Oklahoma law
  for lack of Joint Committee approval, even though Interior had deemed them approved to the extent consistent with
  IGRA. Read on the original link through a page-fetch tool only; holding not checked word for word. Citator check
  (KeyCite) pending; see the project's Westlaw list.
