annotation: >-
  The magazine of the ABA Section of Dispute Resolution. Section pages confirm the
  title, and the Section describes its publications as including 'a magazine, newsletter,
  books, and a podcast'. The Thomson Reuters author note for Mediation: Law, Policy
  & Practice mentions a co-author who co-chairs the magazine's Editorial Board. (project
  analysis) A practitioner magazine whose themed issues (e.g., Spring 2019, 'Family
  Matters') are useful for current practice trends; it is not a peer-reviewed journal.
