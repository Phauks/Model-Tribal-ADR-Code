annotation: >-
  Harvard Law School journal. The Program on Negotiation's publications page says
  it provides 'a forum in which scholars from many disciplines can discuss negotiation
  as it relates to law and legal institutions'. Unlike Negotiation Journal, it is
  'aimed specifically at lawyers and legal scholars', and its premier issue appeared
  in spring 1996. (project analysis) Useful for law-focused negotiation and ADR-design
  scholarship.
