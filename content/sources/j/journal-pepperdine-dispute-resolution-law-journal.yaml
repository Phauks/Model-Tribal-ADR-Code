annotation: >-
  Journal of Pepperdine University's Caruso School of Law. It is open access on Digital
  Commons, ISSN 1536-3090, and its current issue is Vol. 26, Iss. 2 (2026). The journal
  states its aim is to 'facilitate an intellectual discourse on the rapidly evolving
  field of alternative dispute resolution.' (project analysis) The current issue
  includes an article on court-connected compulsory arbitration programs, which is
  relevant to court-annexed design choices.
