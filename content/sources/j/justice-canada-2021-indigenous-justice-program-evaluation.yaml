annotation: The program is "cost-shared with all thirteen provinces and territories and delivered in partnership
  with Indigenous communities," and supports programming including "prevention, diversion, civil and family
  mediation, reintegration, and supporting individuals on bail and probation." "An estimated 90% of clients
  successfully complete the programming," but "[a] planned recidivism study and comparative costing analysis
  could not be completed in the evalution timeframe" (sic). (project analysis) The completion rate is
  not evidence of reduced reoffending.
