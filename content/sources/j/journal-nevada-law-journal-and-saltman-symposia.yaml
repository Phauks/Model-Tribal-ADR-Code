annotation: >-
  The Nevada Law Journal is 'published by students of the William S. Boyd School
  of Law at the University of Nevada, Las Vegas' and publishes at least three issues
  a year. The Saltman Center for Conflict Resolution maintains a page collecting
  past NLJ symposium issues on conflict resolution: Vol. 3, Iss. 2 (Perspectives
  on Dispute Resolution in the Twenty-First Century); Vol. 8, Iss. 1 (Rethinking
  the Federal Arbitration Act); Vol. 10, Iss. 2 (Mindfulness, Emotions, and Ethics);
  Vol. 11, Iss. 2 (Conflict Resolution and the Economic Crisis, including Hollingshead
  on community mediation); and Vol. 18, Iss. 2 (re-inventing arbitration). (project
  analysis) No NLJ article specifically on Tribal ADR or peacemaking turned up in
  this pass. The Saltman symposia are relevant mainly for FAA critique and community-mediation
  sustainability.
