annotation: Article III provides for "Indians dwelling on either side of the said Boundary Line freely
  to pass and repass by Land, or Inland Navigation, into the respective Territories and Countries of the
  Two Parties." (project analysis) The text has no blood test; the United States added one by statute
  (8 U.S.C. § 1359), and Canada ties entry to registration under the Indian Act.
