annotation: >-
  B.J. Jones's article on Tribal-state and Tribal-federal court relations (William
  Mitchell Law Review, Vol. 24, Iss. 2, Article 2, 1998). It appeared a year after
  Wilson v. Marchington. (project analysis) It is a likely source for state-by-state
  practice on recognizing Tribal judgments (rules, statutes, and comity) and on Tribal-state
  cooperation. The PDF could not be downloaded here, so its contents are not characterized.
  Confirm the first page for a Bluebook cite (the repository's metadata gives only
  'firstpage 2', which is the article number).
