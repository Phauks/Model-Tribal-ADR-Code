annotation: >-
  B.J. Jones, then director of the Northern Plains Tribal Institute and a Tribal
  judge, surveys Tribal-state and Tribal-federal court relations a year after Wilson
  v. Marchington. The article covers Tribal-state judicial forums as an educational
  tool (at 466), the history of Tribal courts (at 468), full faith and credit or
  comity between Tribal and state courts (at 477), jurisdictional agreements under
  the Indian Child Welfare Act and for abstention, domestic violence and child support
  (at 484), and the Tribal court exhaustion rule (at 499). On recognition, it reports
  that state courts split on whether the federal full faith and credit statute reaches
  Tribal judgments, and that states have defined recognition by statute or court
  rule, some limited to Tribal courts within the state's borders (at 477-84). (project
  analysis) It is a source for how state recognition rules developed, and for the
  Tribal-state forum model that a model ADR code can point to for cooperation on
  enforcing Tribal ADR outcomes.
