annotation: >-
  A quarterly peer-reviewed journal 'published by the Program on Negotiation at Harvard
  Law School'. It covers 'negotiation, mediation, other forms of alternative dispute
  resolution, and conflict resolution in general', including research reports, case
  studies, and teaching reports. (project analysis) Its interdisciplinary audience
  makes it a good source for empirical work on mediation practice and cross-cultural
  negotiation.
