annotation: >-
  Student-edited journal of the Moritz College of Law, established in 1985. Moritz
  describes it as 'the official law journal of the American Bar Association Section
  of Dispute Resolution.' It publishes article issues, a symposium issue, and an
  annual annotated bibliography issue that abstracts 'over 500 articles, books, and
  other resources on ADR'. Back issues are open on the OSU Knowledge Bank (kb.osu.edu).
  (project analysis) The annual bibliography is an efficient way to sweep ADR literature
  year by year for Tribal and Indigenous topics.
