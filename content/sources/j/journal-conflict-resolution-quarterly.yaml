annotation: >-
  A Wiley journal sponsored by the Association for Conflict Resolution. A bookseller
  listing (Wildy & Sons) describes it as 'an academic publication ... sponsored by
  the Association for Conflict Resolution' with 4 issues a year, focused on 'the
  behavior, role and impact of third parties'. (project analysis) It is the journal
  of the organization that grew out of SPIDR, the Academy of Family Mediators, and
  CREnet, so it is a practitioner-oriented counterpart to the law reviews.
