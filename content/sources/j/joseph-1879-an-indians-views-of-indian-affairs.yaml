notes: Chief Joseph (In-mut-too-yah-lat-lat) of the Wallowa band of the Nez Perce, speaking in Washington in early 1879, with an introduction by William H. Hare, Missionary Bishop of Niobrara. He tells of the laws his fathers gave the people, the treaty councils of 1855 and 1863, and why his band did not consider the Wallowa sold. Read in the Internet Archive scan of the April 1879 issue and checked against a second scan of volume 128.
