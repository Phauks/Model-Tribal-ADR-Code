annotation: >-
  Student-edited journal affiliated with Cardozo Law School's Kukin Program for Conflict
  Resolution. The journal describes itself as covering 'arbitration, negotiation,
  mediation, settlement, and restorative justice'. (project analysis) Its restorative-justice
  coverage makes it a likely place for scholarship near Indigenous justice, although
  the project treats peacemaking as its own track.
