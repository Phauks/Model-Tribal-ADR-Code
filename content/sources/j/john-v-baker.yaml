case_box:
  background: |-
    Anita John, a member of Mentasta Village, and John Baker, a member of Northway Village, are Alaska Natives and the parents of two sons. Baker filed for sole custody in the Northway Tribal Court, John consented to its jurisdiction, and the court ordered shared custody. Baker then filed the same case in state superior court, which refused to dismiss it and gave him primary physical custody [@john-v-baker, p. 743].
  question: |-
    Does an Alaska Native village without Indian country retain inherent authority to adjudicate a custody dispute between its members, and must Alaska courts respect the resulting Tribal decision?
  holding: |-
    Yes. The court held that Alaska Native Tribes, as sovereign nations, retain inherent, membership-based (non-territorial) authority to resolve domestic disputes between their members. It also held that Alaska courts should, as a general rule, respect Tribal court decisions under the comity doctrine, subject to exceptions for lack of jurisdiction, denial of due process, and public policy. It reversed and remanded for a comity determination.
  quotes:
  - text: "[W]e hold that Alaska Native tribes, by virtue of their inherent powers as sovereign nations, do possess that authority."
    pinpoint: "pp. 748-749"
  - text: "We therefore hold that, as a general rule, our courts should respect tribal court decisions under the comity doctrine."
    pinpoint: "p. 763"
  treatment: |-
    The Supreme Court of Alaska declined to extend it in *Starr v. George* (Alaska 2008). [@john-v-baker]
  topics:
  - "Dispute resolution and arbitration"
  - "Recognition of Tribal judgments (comity)"
