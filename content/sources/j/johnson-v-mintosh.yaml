case_box:
  background: |-
    In 1773 and 1775, private buyers purchased two large tracts north of the Ohio River directly from chiefs of the Illinois and Piankeshaw nations [@johnson-v-mintosh, pp. 550, 555]. Their successors later brought an action in ejectment in Illinois against William M'Intosh, who claimed part of the same land under a grant from the United States, and the trial court ruled for M'Intosh [@johnson-v-mintosh, p. 543].
  question: |-
    Can a title to land bought directly from Native nations by private purchasers before the Revolution be recognized in United States courts over a later federal patent?
  holding: |-
    No. The Court held that, under the "discovery" doctrine, the discovering European sovereign (and then the United States) acquired the exclusive right to extinguish Native title by purchase or conquest. The Illinois and Piankeshaw could therefore convey only their right of occupancy, and only to that sovereign. The private purchasers' title could not be sustained against the federal grantee.
  quotes:
  - text: "... discovery gave title to the government by whose subjects, or by whose authority, it was made, against all other European governments, which title might be consummated by possession ..."
    pinpoint: "p. 573"
  - text: "They were admitted to be the rightful occupants of the soil, with a legal as well as just claim to retain possession of it, and to use it according to their own discretion; but their rights to complete sovereignty, as independent nations, were necessarily diminished ..."
    pinpoint: "p. 574"
  treatment: |-
    Still cited as the root of the "discovery" doctrine and of Native title as a right of occupancy; it has not been overruled. Its reasoning was relied on for the holding in *Tee-Hit-Ton* (1955) that unrecognized Native title is not compensable property. [@tee-hit-ton-indians-v-united-states]

    Three later decisions distinguish it, among them *Alliance to Save the Mattaponi v. Commonwealth* (Va. 2005). [@johnson-v-mintosh]
  reading:
    title: "*Johnson v. M'Intosh* (1823)"
    text: |-
      Foundational to how U.S. law describes Native land title and the limits it places on nations' power to sell land, and to why federal law, not state law, governs Native title.
