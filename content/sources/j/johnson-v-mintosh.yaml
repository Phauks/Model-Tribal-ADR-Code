notes: >-
  Full citation: Johnson & Graham's Lessee v. M'Intosh, 21 U.S. (8 Wheat.) 543 (1823); parallel cites 5 L.
  Ed. 681, 1823 WL 2465. Official report scan:
  https://tile.loc.gov/storage-services/service/ll/usrep/usrep021/usrep021543/usrep021543.pdf. Decided
  March 10, 1823: Westlaw gives that date and the report prints "March 10th." before the opinion, rather
  than the February 28 date some secondary sources give. Opinion by Marshall, C.J., on error to the
  District Court of Illinois. Successor-nation identification (Peoria Tribe) is analysis, not stated in
  the opinion. Still open: later writings that criticize the discovery doctrine. Write-up of the Westlaw
  pull: research/pull-results/2026-11-21-legal-history-confirm-first-cases.md in the project's working
  files; the lead author's copy is kept privately and is not redistributed.
