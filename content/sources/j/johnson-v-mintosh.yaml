  than the February 28 date some secondary sources give. Opinion by Marshall, C.J., on error to the
  District Court of Illinois. Successor-nation identification (Peoria Tribe) is analysis, not stated in
  the opinion. Still open: later writings that criticize the discovery doctrine (the KeyCite pull shows
