  title: In the Senate of the United States. April 29, 1878. -- Ordered to be printed. Mr. Maxey, from the Committee on Military Affairs, submitted the following report. (To accompany Bill S. 757.) The Committee on Military Affairs, to whom was referred the Bill (S. 757) to provide for the construction of a military post for the protection of the northern frontier of Montana, have had the same under consideration, and submit the following report..
