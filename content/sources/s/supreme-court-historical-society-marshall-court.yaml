notes: 'Read in full Nov. 23, 2026. Facts used: Marbury v. Madison (decided Feb. 24, 1803) held a section of the Judiciary Act of 1789 void because Congress cannot enlarge the original jurisdiction the Constitution gives the Court; the Senate acquitted Justice Samuel Chase on Mar. 1, 1805, after an impeachment over his partisan conduct; Congress added a seat in 1807 for a new circuit (Kentucky, Tennessee, Ohio), filled by Thomas Todd; McCulloch v. Maryland (1819) upheld the Bank of the United States and held that Maryland could not tax it; Gibbons v. Ogden (1824) held that a New York steamboat monopoly gave way to an Act of Congress under the commerce power; Marshall served from 1801 until his death in 1835.'
