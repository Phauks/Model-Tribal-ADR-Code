notes: >-
  26 pages. The lead author's download (2026-11-22) is the same file the collection scripts had already captured. No peacemaking program. Section 1-2-101(3) lets the court appoint advisors familiar with Southern Ute custom and usage when custom is in doubt, and the hearing powers in Article 5 (Administrative Appeals and Hearings Office, around section 1-5-104) include holding settlement conferences and calling on Tribal members and elders for advice on culture and tradition (project reading of the text layer; check the section and subsection numbers against the page before citing).
