  title: In the Senate of the United States. June 11, 1878. -- Ordered to be printed. Mr. Spencer, from the Committee on Military Affairs, submitted the following report. (To accompany Bill S. 758.) The Committee on Military Affairs, to whom was referred the Bill (S. 758) for the relief of citizens of Montana who served with the United States troops in the War with the Nez Perces, and for the relief of the heirs of such as were killed in such service, have had the same under consideration, and submit the following report ..
