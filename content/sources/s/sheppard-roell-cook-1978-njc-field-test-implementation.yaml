annotation: >-
  A 309-page LEAA-funded evaluation (grant 78NI-AX-0012) of the three federal Neighborhood
  Justice Centers in Atlanta, Kansas City, and Los Angeles. The NCJRS abstract says
  the centers opened 'during March, 1978' after staff hiring, a training workshop
  in Reno, referral-source development, and recruiting and training volunteer mediators.
  The three centers had different sponsors: in Atlanta, a private nonprofit citizen
  organization; in Kansas City, the city's Community Services Department; in Los
  Angeles, the Los Angeles County Bar Association. Referrals came from courts, police,
  and prosecutors. (project analysis) A 'neighborhood justice center' is best classed
  as a program or setting that delivers mediation (and sometimes conciliation or
  arbitration), not as a separate method. The three sponsorship models (citizen nonprofit,
  city agency, bar association) are direct analogues to options a Tribe has for housing
  an ADR office.
