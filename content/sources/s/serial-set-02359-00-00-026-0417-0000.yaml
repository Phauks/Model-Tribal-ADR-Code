  title: In the Senate of the United States. April 6, 1886. -- Ordered to be printed. Mr. Manderson, from the Committee on Military Affairs, submitted the following report. (To accompany Bill S. 1861.) The Committee on Military Affairs, to whom was referred the Bill (S. 1861) to provide for the sale of the site of Fort Omaha, Nebraska, the sale or removal of the improvements thereof, and for a new site, and the construction of suitable buildings thereon, have had the same under advisement and recommend its passage, presenting the following considerations operating to produce the conclusion reached..
