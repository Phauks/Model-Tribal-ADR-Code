notes: 'Read in full Nov. 23, 2026. Facts used: Brown v. Board of Education (May 17, 1954), unanimous, segregation in public schools denies equal protection; May 31, 1955 remedy decision, "with all deliberate speed"; Toth v. Quarles (1955) and the 1957 rehearing, courts-martial may not try discharged service members or civilian dependents; Griffin v. Illinois (1956), free transcript for a poor appellant; Gideon, a state must appoint counsel for a felony defendant who cannot pay; Mapp v. Ohio.'
