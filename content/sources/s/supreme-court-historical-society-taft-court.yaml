notes: "Read in full Nov. 24, 2026. Facts used: The Court held the Child Labor Law invalid, and Taft wrote that the Tenth Amendment leaves problems like child labor to the states. In the Gitlow case, seven Justices upheld a New York conviction but assumed that the Fourteenth Amendment bars states from abridging free speech and press. Taft set out to improve the whole federal judiciary. He planned the Conference of Senior Circuit Court Judges and lobbied for the Judges' Bill, which limited appeals so the Court could focus on constitutional issues. In Adkins v. Children's Hospital, decided in 1923, five Justices struck down a minimum-wage law for women and children in the District of Columbia, and Taft dissented."
