  title: In the Senate of the United States. April 5, 1860. -- Ordered to be printed. Mr. Iverson made the following report. (To accompany Bill S. 374.) The Committee on Claims, to whom the claim of Mrs. Eliza E. Ogden was recommitted, by order of the Senate, have had the same under consideration, and concur in the report of the Committee on Claims of the Senate on this claim, made during the first session of the last Congress, which the committee hereby adopt, and report a bill accordingly, for the relief of the memorialist. The report alluded to is as follows ..
