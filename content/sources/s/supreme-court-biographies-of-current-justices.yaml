notes: 'Read Nov. 23, 2026. John G. Roberts, Jr.: born in Buffalo, New York, Jan. 27, 1955; law clerk to then-Associate Justice William H. Rehnquist in the 1980 Term; Principal Deputy Solicitor General 1989-1993; judge of the Court of Appeals for the District of Columbia Circuit 2003-2005; nominated as Chief Justice by President George W. Bush, he assumed that office on Sept. 29, 2005.'
