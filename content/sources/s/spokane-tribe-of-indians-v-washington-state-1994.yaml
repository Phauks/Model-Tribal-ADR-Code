notes: Spokane Tribe of Indians v. Washington, 28 F.3d 991 (9th Cir. 1994). The tribe sued to compel Washington
  to negotiate a gaming compact in good faith; per a fetch-tool excerpt, the court reversed the dismissal and held
  the State was not immune from suit under IGRA. Seminole Tribe v. Florida (1996) later held that the Eleventh Amendment
  bars such suits. Read on the original link. Citator check (KeyCite) pending; see the project's Westlaw list.
