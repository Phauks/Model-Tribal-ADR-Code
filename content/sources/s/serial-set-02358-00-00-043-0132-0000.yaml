  title: In the Senate of the United States. February 18, 1886. -- Ordered to be printed. Mr. Pike, from the Committee on Claims, submitted the following report. (To accompany Bill S. 472.) The Committee on Claims, to whom was referred the Bill (S. 472) for the relief of the American Board of Commissioners for Foreign Missions, Rev. Worcester Willey, and Esther Smith, having considered the same, adopt the favorable report made by the Senate Committee on Claims of the Forty-eighth Congress, prepared by Mr. Pike, the following of which is a copy, and recommend the passage of the accompanying bill..
