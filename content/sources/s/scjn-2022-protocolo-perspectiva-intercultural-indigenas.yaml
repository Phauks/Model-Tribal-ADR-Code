annotation: 'Mexican Supreme Court guide for judges in cases involving Indigenous persons, peoples and communities.
  Collects the Court''s holdings on Indigenous jurisdiction (citing Amparo Directo 6/2018, Amparo en Revisión 202/2021
  and 1041/2019, and Amparo Directo en Revisión 5465/2014): its scope, a test for state versus Indigenous jurisdiction
  based on personal, territorial, objective and institutional factors, the principles of greatest autonomy, human
  rights as the minimum, and minimal restriction of autonomy; and the duty to decline jurisdiction in favor of Indigenous
  jurisdiction where it applies. Notes Mexico ratified ILO Convention 169 in 1990. Not binding (a guide).'
