  title: In the Senate of the United States. April 20, 1886. -- Ordered to be printed. Mr. Sawyer, from the Committee on Pensions, submitted the following report. (To accompany Bill H.R. 5074.) The Committee on Pensions, to whom was referred the Bill (H.R. 5074) granting an increase of pension to James Waters, have examined the same and report that after careful examination they have adopted the report by the Committee on Pensions, House of Representatives, hereto annexed, and recommended the passage of the bill ..
