notes: "Read in full Nov. 24, 2026. Facts used: The Court unanimously upheld the Fair Labor Standards Act in United States v. Darby Lumber Co., a law that banned child labor, regulated hours and set minimum wages. In West Virginia State Board of Education v. Barnette, the Court flatly overruled its Gobitis decision in 1943 and held that no official may prescribe orthodoxy in politics, nationalism or religion for any citizen. During the war the Court unanimously upheld a curfew on people of Japanese ancestry, and in Korematsu v. United States (1944) it upheld an Army order banishing them from the West Coast, with three Justices dissenting. The same day the Court unanimously ordered the release of Mitsuye Endo, a loyal citizen held at a relocation center."
