  title: In the Senate of the United States. April 9, 1878. -- Ordered to be printed. Mr. Spencer, from the Committee on Military Affairs, submitted the following report. (To accompany Bill S. 864.) The Committee on Military Affairs, to whom was referred the Bill (S. 864) to provide for the construction, maintenance, and operation of a military telegraph in Dakota and Montana Territories, have had the same under consideration and submit the following report..
