annotation: Plenary decision (May 29, 2014). After the federal electoral tribunal (SUP-JDC-9167/2011) recognized
  Cherán's right to elect its authorities by its own rules, Cherán's Council of Communal Government, as municipal
  authority, challenged a 2012 amendment to the Michoacán constitution adopted without consulting it. The Court
  held ILO Convention 169 part of the "parameter of constitutional regularity," found the consultation forums inadequate,
  and invalidated the reform as to the parties. Read through the Court's English summary; full text at https://www.scjn.gob.mx/derechos-humanos/sites/default/files/sentencias-emblematicas/sentencia/2020-12/CC%2032-2012.pdf.
