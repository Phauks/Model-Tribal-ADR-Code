  title: In the Senate of the United States. March 24, 1858. -- Ordered to be printed. Mr. Wilson made the following report. (To accompany Bill S. 211.) The Committee on Military Affairs and the Militia, to whom was referred the memorial of Henry O'Rielly, John J. Speed, and Tal. P. Shaffner, proposing to establish telegraphic communication between the Army of Utah and the War Department, by erecting a line from the westerly terminus of the Missouri River line to Utah, have had the same under consideration, and report..
