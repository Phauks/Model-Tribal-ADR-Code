annotation: >-
  A news report describing the Office of Samoan Affairs' "arbitration" program for
  family disputes over lands, titles and the matai system under A.S.C.A. § 43.0302,
  led by the Secretary, Deputy Secretary and District Governors. It reports that
  more than 200 cases went through the service and credits it with reducing High
  Court filings. It also describes the certificate of irreconcilable dispute (CID).
  (project analysis) The local press calls the process "arbitration," but the statute
  describes a non-binding attempt to resolve the dispute that ends with a certificate.
  That is why this project proposes a separate method id instead of 'arbitration'.
  The case-count figure is unverified reporting.
