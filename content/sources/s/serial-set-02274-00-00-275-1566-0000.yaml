  title: In the Senate of the United States. March 3, 1885. -- Ordered to be printed. Mr. Cockrell, from the Committee on Military Affairs, submitted the following report. (To accompany petition of John H. Stewart.) The Committee on Military Affairs, to whom was referred petition of John H. Stewart, praying for amendment of bounty laws, so as to remove bar of limitation, have duly considered the same, and submit the following report..
