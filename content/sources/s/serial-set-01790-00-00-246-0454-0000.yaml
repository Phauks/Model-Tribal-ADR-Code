  title: In the Senate of the United States. May 31, 1878. -- Ordered to be printed. Mr. Bayard, from the Committee on Private Land Claims, submitted the following report. (To accompany Bill S. 773.) The Committee on Private Land Claims, to whom was referred the Bill (S. 773) making a pre-emption grant to the heirs of Jean Baptiste Beaubien, deceased, for a part of Fort Dearborn reservation at Chicago, Ill., and to confirm purchasers of other parts in their titles, and to convey to the City of Chicago the streets and alleys of said reservation, submit the following report ..
