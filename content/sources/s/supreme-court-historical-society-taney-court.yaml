notes: "Read in full Nov. 24, 2026. Facts used: The Court became unmistakably Jacksonian, and in the Charles River Bridge case Taney read corporation charters more strictly and state powers more generously than Marshall had. In Dred Scott v. Sandford, decided in 1857, a majority ruled that Scott was still a slave and that Congress had no power to limit the expansion of slavery by law. Three Justices, including Taney, said no Black person could hold United States citizenship, even if free. Taney also issued a writ to General George Cadwalader to bring John Merryman to court, and in the Prize Cases the Court sided with Lincoln."
