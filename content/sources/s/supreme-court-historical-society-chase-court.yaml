notes: "Read in full Nov. 24, 2026. Facts used: In the Milligan case, the Court held that military courts could not try civilians where the federal courts were open. When the Senate tried President Andrew Johnson, Chase presided as a judge over the impeachment, and Johnson escaped conviction by one vote. Striking at President Johnson, Congress cut the number of seats on the Court, and it limited the Court's jurisdiction on appeals to protect the Reconstruction laws. In Hepburn v. Griswold the Court struck down the Legal Tender Act of 1862 in 1870, implying that greenbacks might not be valid for later contracts. Two new Justices joined the three dissenters to overrule that decision."
