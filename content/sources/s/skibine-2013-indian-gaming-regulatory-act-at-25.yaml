annotation: An article by Alex Tallchief Skibine assessing the Indian Gaming Regulatory Act 25 years after its enactment. It reviews the tribal-state compact process, the federal mediation and secretarial procedures for compact disputes, and unresolved issues including state sovereign immunity, revenue sharing and the trust doctrine. It matters for tribal dispute resolution because it shows how gaming disputes move among tribes, states and federal agencies. (project analysis)
