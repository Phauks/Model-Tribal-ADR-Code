notes: 'Indigo Book citation: Luther Standing Bear, My People, the Sioux (E. A. Brininstool ed., 1928). The author signs as hereditary chief of the Oglala. Chapter XIV, "First Days at Carlisle," is his account of the first class at the Carlisle Indian School, October 1879.'
