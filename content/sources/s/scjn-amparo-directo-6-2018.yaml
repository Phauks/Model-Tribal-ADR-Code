annotation: First Chamber decision (Nov. 21, 2019) recognizing Indigenous jurisdiction. A non-member grazed cattle
  in a protected area of an Oaxaca community and was sanctioned by the community authority; after he went to state
  prosecutors, the community brought a "Juicio de Derecho Indígena" before the Oaxaca high court's Sala de Justicia
  Indígena, which "reconoció la jurisdicción de la comunidad, convalidó el sistema normativo interno y su procedimiento."
  The Supreme Court denied amparo. Read through the Court's own summary; full judgment at https://www.scjn.gob.mx/derechos-humanos/sites/default/files/sentencias-emblematicas/sentencia/2020-12/AD%206-2018_0.pdf.
