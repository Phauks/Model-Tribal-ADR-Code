  title: In the Senate of the United States. February 1, 1886. -- Ordered to be printed. February 16, 1886. -- Ordered to be reprinted. Mr. Dolph, from the Committee on Public Lands, submitted the following report. (To accompany Bill S. 1296.) The Committee on Public Lands, to whom was referred the Bill (S. 65), entitled "A Bill To Repeal All Laws Providing for the Pre-Emption of Public Lands, the Laws Relating to Entries for Timber Culture, the Laws Authorizing the Sale of Desert Lands in Certain States and Territories, and for Other Purposes," have had the same under consideration and report the accompanying bill as a substitute therefore..
