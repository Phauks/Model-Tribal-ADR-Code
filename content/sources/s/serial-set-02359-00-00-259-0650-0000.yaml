  title: In the Senate of the United States. April 20, 1886. -- Ordered to be printed. Mr. Manderson, from the Committee on Military Affairs, submitted the following report. (To accompany Bill S. 1717.) The Committee on Military Affairs, to whom was referred the Bill (S. 1717) for the relief of Robert H. Montgomery, a captain in the Fifth Cavalry, United States Army, have had the same under consideration and submit the following observations thereon, with a conclusion favorable to the passage of the bill..
