notes: "Read in full Nov. 24, 2026. Facts used: In Near v. Minnesota, the Court struck down a state law that let a court silence scandalous publications, holding that the press may not be suppressed by law. In Norris v. Alabama (1935), Hughes ruled that the Scottsboro trials were unconstitutional because qualified Black citizens did not serve on juries. Roosevelt asked Congress for power to add a Justice when one aged 70 did not resign. In Jones & Laughlin, the Court upheld the Wagner Act, the first federal law to regulate disputes between capital and labor. In 1940 eight Justices upheld a school board's rule against children who refused to salute the flag, and Justice Felix Frankfurter wrote the majority opinion."
