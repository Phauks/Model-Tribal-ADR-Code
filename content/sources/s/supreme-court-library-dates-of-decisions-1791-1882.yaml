notes: 'Prepared August 2006, updated Dec. 26, 2018 (title page). Read Nov. 22, 2026 (PDF SHA-256 afae6d2453c29a8be615396b743688ca57eefbf30618de9505118f04cd19bf99). Dates come from the Court''s Engrossed Minutes at the National Archives. Page 30: Cherokee Nation v. Georgia, 30 U.S. (5 Pet.) 1, argued Mar. 12, 14, 1831, decided Mar. 18, 1831. Page 32: Worcester v. Georgia, 31 U.S. (6 Pet.) 515, argued Feb. 20-21, 23, 1832, decided Mar. 3, 1832. Neither date carries the asterisk or pound sign the table uses for dates not found in the Minutes.'
