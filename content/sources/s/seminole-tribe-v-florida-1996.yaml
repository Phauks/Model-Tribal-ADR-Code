annotation: >-
  The syllabus states the holding that 'The Eleventh Amendment prevents Congress
  from authorizing suits by Indian tribes against States to enforce legislation enacted
  pursuant to the Indian Commerce Clause.' The case arose under the good-faith-negotiation
  remedy of IGRA, 25 U.S.C. § 2710(d)(7). (project analysis) Because the federal
  court-ordered process (which ends in a mediator choosing one side's last best offer)
  cannot be forced on a State that has not consented, consent-based dispute provisions
  written into Tribal-state compacts and other intergovernmental agreements matter
  more.
