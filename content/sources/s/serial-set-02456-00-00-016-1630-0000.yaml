  title: In the Senate of the United States. December 22, 1886. -- Ordered to be printed. Mr. Manderson, from the Committee on Military Affairs, submitted the following report. (To accompany Bill H.R. 7192.) The Committee on Military Affairs, to whom was referred H.R. 7192, "To Provide a School of Instruction for Cavalry and Light Artillery, and for the Construction and Completion of Quarters, Barracks, and Stables at Certain Posts for the Use of the Army of the United States," have had the same under consideration and submit the following report thereon..
