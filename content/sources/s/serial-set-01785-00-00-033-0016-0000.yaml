  title: 'In the Senate of the United States. January 14, 1878. -- Referred to the Committee on Indian Affairs and ordered to be printed. Mr. Mitchell submitted the following resolution: Whereas there are at the present time in the United States not to exceed three hundred thousand Indians, and for whose occupation, use, and benefit there have been set apart, and are for such purpose now held, over three hundred million acres of the public lands of the United States, including the Indian Territory ..'
