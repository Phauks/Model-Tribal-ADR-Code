  title: In the Senate of the United States. May 5, 1886. -- Ordered to be printed. Mr. Manderson, from the Committee on Military Affairs, submitted the following report. (To accompany Bill S. 1935.) The Committee on Military Affairs, to whom was referred the Bill (S. 1935) authorizing and directing the Secretary of War to enlarge, repair, and complete certain military quarters and barracks in Wyoming Territory and in the State of Nebraska, have had the same under consideration, and submit the following report thereon..
