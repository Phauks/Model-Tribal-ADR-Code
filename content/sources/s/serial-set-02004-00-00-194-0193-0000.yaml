  title: 'In the Senate of the United States. February 21, 1882. -- Ordered to be printed. Mr. Plumb, from the Committee on Public Lands, submitted the following report: (To accompany Bill S. 67.) The Committee on Public Lands, to whom was referred Bill S. 67, report as follows: The government of the United States, in receiving the Western and Southern states into the union, stipulated in their several acts of admission to pay them 5 per cent. upon the sales of public lands ..'
