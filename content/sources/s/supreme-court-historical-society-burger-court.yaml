notes: 'Read in full Nov. 23, 2026. Facts used: Warren Burger, judge of the D.C. Circuit for more than a decade, became Chief Justice in 1969; Wisconsin v. Yoder (1972); Pentagon Papers (decided June 30, 1971), no prior restraint; Roe v. Wade (Jan. 22, 1973) limited state power to prohibit abortion; United States v. Nixon (July 24, 1974), unanimous, the President must surrender the tapes; Chadha (1983), legislative veto unconstitutional.'
