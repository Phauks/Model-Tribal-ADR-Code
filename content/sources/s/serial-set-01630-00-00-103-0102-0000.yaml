  title: 'In the Senate of the United States. February 20, 1875. -- Ordered to be printed. Mr. Ingalls submitted the following resolution: Resolved, that a committee consisting of five members of the Senate be appointed to visit the Indian Territory during the recess of Congress, with authority to inquire into the condition of affairs in that country, the necessities of the various Indian nations and tribes there located ; and to report at the next session of the Senate the results of their inquiry ..'
