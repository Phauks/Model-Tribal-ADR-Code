  title: In the Senate of the United States. February 14, 1857. -- Ordered to be printed. Mr. Benjamin made the following report. (To accompany Bill S. 592.) The Committee on Private Land Claims, to whom was referred the "petition of the administrator of John F. Wray, deceased, praying that the money paid for certain lands purchased of the United States, his title to which has been declared null and void by the courts of the State of Mississippi, may be refunded," have had the same under consideration, and submit the following report ..
