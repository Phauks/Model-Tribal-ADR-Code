annotation: A law firm alert on the New Mexico Supreme Court decision in Sipp v. Buffalo Thunder, which held that state courts lack jurisdiction over tort claims by casino visitors under the state's gaming compact terms. It states that personal injury claims against New Mexico tribal casinos must now go to tribal courts or arbitration, and cautions that the outcome depends on each state's compact language. (project analysis)
