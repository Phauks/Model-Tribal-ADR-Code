annotation: >-
  Frank Sander's address at the April 7-9, 1976 'Pound Conference' (National Conference
  on the Causes of Popular Dissatisfaction with the Administration of Justice), printed
  in the conference proceedings at 70 F.R.D. 79, with Sander's paper at 111-34. It
  is widely credited with the idea of the 'multi-door courthouse': a court that routes
  each dispute to the process that fits it. Brazil (2002) calls Sander 'the spiritual
  father of court ADR' and cites this paper at 130-31 for the multi-door vision.
  Menkel-Meadow (2000) identifies the paper as a common starting date for the ADR
  movement. (project analysis) The 'multi-door courthouse' is a program design (an
  intake-and-referral architecture), not a dispute resolution method. A model Tribal
  code can adopt it as an intake structure that routes matters to court, to ADR,
  or (by the parties' choice) to a separate peacemaking track.
