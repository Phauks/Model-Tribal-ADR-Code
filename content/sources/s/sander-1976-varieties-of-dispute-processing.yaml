annotation: >-
  Frank Sander's address at the April 7-9, 1976 'Pound Conference' (National Conference
  on the Causes of Popular Dissatisfaction with the Administration of Justice), printed
  in the conference proceedings at 70 F.R.D. 79, with Sander's paper at 111-34. Sander
  proposes "to explore alternative ways of resolving disputes outside the courts"
  (at 112). He asks what the "significant characteristics" of processes such as adjudication,
  arbitration, mediation and negotiation are, and how they can yield "rational criteria
  for allocating various types of disputes to different dispute resolution processes"
  (at 113). He then imagines that "by the year 2000 not simply a court house but
  a Dispute Resolution Center, where the grievant would first be channelled through
  a screening clerk" to "the process (or sequence of processes) most appropriate to
  his type of case," with rooms for mediation, arbitration, fact finding, a malpractice
  screening panel, the superior court and an ombudsman (at 130-31). He also describes
  a "screening-adjudication model," such as Massachusetts's malpractice board (at
  128-29), and the "Michigan Mediation System" (at 130). Brazil (2002) calls Sander
  'the spiritual father of court ADR' and cites this paper at 130-31 for the multi-door
  vision, and Menkel-Meadow (2000) identifies it as a common starting date for the
  ADR movement. (project analysis) The paper itself does not use the phrase "multi-door
  courthouse"; it says "Dispute Resolution Center." When Sander says institutions
  "such as prisons, schools, or mental hospitals" could establish "indigenous dispute
  resolution processes" (at 131), "indigenous" means internal to the institution,
  not Indigenous peoples; quote it with that caution. The multi-door design is an
  intake-and-referral structure, not a dispute resolution method. A model Tribal
  code can adopt it to route matters to court, to ADR, or (by the parties' choice)
  to a separate peacemaking track.
