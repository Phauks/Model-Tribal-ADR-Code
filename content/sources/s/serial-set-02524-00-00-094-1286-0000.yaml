  title: 'In the Senate of the United States. May 14, 1888. -- Ordered to be printed. Mr. Stewart, from the Committee on Military Affairs, submitted the following report. (To accompany Bill S. 2918.) The majority of the Committee on Military Affairs make the following report in support of the bill offered herewith: Object of this bill. The object of this bill is to re-imburse the State of Nevada..'
