notes: 'Read in full Nov. 23, 2026. Facts used: Morrison R. Waite of Ohio, confirmed 1874; Munn v. Illinois and the Granger cases (1877), state power to regulate businesses that affect the public and, until Congress acts, railroads within the state; in 1883 eight Justices held the Civil Rights Act of 1875 unconstitutional because the Fourteenth Amendment reaches only state action, Harlan dissenting; by 1887 the Court was almost four years behind; Waite died in 1888.'
