notes: 'Read in full Nov. 23, 2026. Facts used: Melville W. Fuller succeeded Waite in 1888; the 1891 Act gave each circuit a court of appeals and ended the Justices circuit duty; in 1895 a five-to-four vote held the federal income tax law unconstitutional, later answered by the Sixteenth Amendment (1913); Plessy v. Ferguson upheld Louisianas separate railway cars over Harlans dissent; the Insular Cases on Puerto Rico and the Philippines; Northern Securities dissolved (1904); Lochner v. New York (1905) struck down New Yorks limit on bakers hours.'
