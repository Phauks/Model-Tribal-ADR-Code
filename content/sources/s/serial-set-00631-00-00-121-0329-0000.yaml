  title: 'In the Senate of the United States. August 10, 1852. Ordered to be printed. Mr. Dawson made the following report: The Committee on Military Affairs, to whom was referred the memorial of the agent of the State of Georgia, asking that the accounting officers of the Treasury Department may be authorised to allow and pay all accounts intended to be provided for by the act of Congress of 11th August, 1842 -- "providing for the settlement of the claims of Georgia for the services of her militia, &c., when it shall be made to appear that the state has allowed and paid the same,["] beg leave to submit the following report..'
