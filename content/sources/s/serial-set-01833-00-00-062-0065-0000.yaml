  title: 'In the Senate of the United States. February 12, 1879. -- Ordered to be printed. Mr. Allison, from the Committee on Indian Affairs, reported the following resolution: Resolved, that a select committee of five Senators be appointed to examine into the circumstances connected with the removal of the Northern Cheyennes from the Sioux reservation to the Indian Territory, their treatment whilst in the territory, their escape therefrom, and all the circumstances connected therewith ..'
