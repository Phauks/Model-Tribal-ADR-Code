annotation: >-
  Southland, 465 U.S. 1 (decided Jan. 23, 1984), held that a California franchise-law
  provision requiring judicial resolution of claims conflicted with FAA § 2 and violated
  the Supremacy Clause, and that the FAA applies in state as well as federal courts.
  The Court stated that in enacting § 2 "Congress declared a national policy favoring
  arbitration" and withdrew state power to require a judicial forum. (project analysis)
  Southland is the root of FAA preemption doctrine; Tribal code drafters need it
  to assess whether and how the FAA reaches Tribal courts, a question Southland itself
  (a state-court case) does not answer.
