  title: In the Senate of the United States. February 5, 1879. -- Ordered to be printed. Mr. Maxey, from the Committee on Military Affairs, submitted the following report. (To accompany Bill S. 1769.) The Committee on Military Affairs, to whom was referred Executive Document No. 54, "letter from the Secretary of War, transmitting a petition of certain officers of the Fifth Infantry, U.S.A., praying to be reimbursed for losses sustained by the sinking of the government steamer Don Cameron," have had the same under consideration, and submit the following report..
