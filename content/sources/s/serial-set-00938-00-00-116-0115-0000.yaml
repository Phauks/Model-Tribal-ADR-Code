  title: In the Senate of the United States. March 12, 1858. -- Ordered to be printed. Mr. Durkee made the following report. (To accompany Bill S. 196.) The Committee on Private Land Claims, to whom was referred the memorial of the "Domestic and Foreign Missionary Society of the Protestant Episcopal Church in the United States," and also the petition of Edson Sherwood and twenty-four others, praying for the confirmation to the above named society of its title to a certain tract of land in the state of Wisconsin, have had the same under consideration, and ask leave to make the following report ..
