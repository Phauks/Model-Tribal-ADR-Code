  title: 'In the Senate of the United States. February 10, 1892. -- Ordered to be printed. Mr. Pasco, from the Committee on Claims, submitted the following report: (To accompany S. 1391.) The Committee on Claims, to whom was referred the Bill (S. 1391) "To Authorize the Secretary of the Treasury to Pay the Balance Found to Be Due the State of Florida, According to the Account Stated between the General Government and Such State by the Said Secretary, under the Authority of the Act" approved March 2, 1889, known as "The Deficiency Appropriation Act," having carefully examined the same, submit the following report thereon..'
