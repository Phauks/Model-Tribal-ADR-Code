  title: In the Senate of the United States. February 15, 1878. -- Ordered to be printed. Mr. Randolph, from the Committee on Military Affairs, submitted the following report. (To accompany Bill S. 97.) The Committee on Military Affairs, to whom was referred the Bill (S. 97) authorizing the Secretary of War to grant permission to the proprietors of salmon fisheries now located on Three Tree Point military reservation, on the Columbia River in Washington Territory, to remain on said reservation, have had the same under consideration, and submit the following report ..
