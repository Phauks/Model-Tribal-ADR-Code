  title: In the Senate of the United States. June 14, 1860. -- Ordered to be printed. Mr. Harlan made the following report. (To accompany Joint Resolution S. 44.) The Committee on Public Lands, to whom was referred the "joint resolution of the Legislature of California, asking Congress to cede and donate a tract of land known as the 'Colorado Desert' to that state, for certain purposes therein set forth," having had the same under consideration, submit the following report..
