case_box:
  background: |-
    The Sokaogon Chippewa Community's gaming corporation hired Tushie-Montgomery Associates to design a casino, under a contract with an arbitration clause. After the firm had been paid $150,000, new Tribal leaders repudiated the contract as void for lack of Bureau of Indian Affairs approval. The Tribe refused to arbitrate and sued instead; the arbitration went ahead without it and produced an award of more than $500,000 [@sokaogon-gaming-enterprise-corporation-v-tushie-montgomery-associates, pp. 657-658].
  question: |-
    Did a Tribal gaming enterprise waive its sovereign immunity by agreeing to an arbitration clause in an architect's contract?
  holding: |-
    Yes. The court held that the enterprise waived its immunity in the arbitration clause and reversed the partial summary judgment for the Tribe; it did not decide whether bringing the suit was also a waiver. The First Circuit in *Ninigret* cites it as finding waiver at 86 F.3d at 659-60.
  quotes:
  - text: "It waived it in the arbitration clause."
    pinpoint: "p. 661"
  treatment: |-
    Cited in *Ninigret Development Corp.* (1st Cir. 2000) as finding waiver, 86 F.3d at 659-60. [@ninigret-development-corporation-v-narragansett-indian-wetuomuck-housing-authority]
  topics:
  - "Dispute resolution and arbitration"
  - "Enforcement of awards, orders and judgments"
  - "Sovereign immunity"
  reading:
    title: "*Sokaogon Gaming Enterprise Corp. v. Tushie-Montgomery Associates, Inc.* (1996)"
    text: |-
      An early, influential holding (by Judge Posner) that an ordinary arbitration clause can waive Tribal immunity; useful background for *C & L Enterprises*.
