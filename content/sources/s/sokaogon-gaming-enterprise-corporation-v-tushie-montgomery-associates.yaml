notes: >-
  Full citation: 86 F.3d 656 (7th Cir. 1996); No. 95-3036; 64 USLW 2789. Argued April 2, 1996; decided
  June 5, 1996. Panel: Posner, C.J., and Ripple and Manion, JJ.; opinion by Posner, C.J., with no separate
  opinion. Holding confirmed: the Tribe waived its sovereign immunity in the contract's arbitration
  clause; the court did not decide whether bringing suit was also a waiver; the partial summary judgment
  for the Tribe was reversed. The quote "It waived it in the arbitration clause." is at 661. Write-up of
  the Westlaw pull: research/pull-results/2026-11-21-legal-history-confirm-first-cases.md in the project's
  working files; the lead author's copy is kept privately and is not redistributed.
