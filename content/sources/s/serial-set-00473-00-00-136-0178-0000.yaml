  title: 'In Senate of the United States. March 2, 1846. -- Submitted, and ordered to be printed. March 4, 1846. -- Ordered, that 3,000 copies, in addition to the usual number, be printed for the use of the Senate. Mr. Semple made the following report: (To accompany Bill S. No. 103.) The Committee on the Post Office and Post Roads, to whom was referred the resolution of the Senate of the 27th December last, have had the same under consideration, and ask leave to report: That they have given to the subject that mature consideration which its importance demands, and have determined that the immediate establishment of a mail route from the western line of the State of Missouri to the mouth of the Columbia River ..'
