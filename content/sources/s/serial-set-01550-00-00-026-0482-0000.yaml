  title: In the Senate of the United States. February 21, 1873. -- Ordered to be printed. Mr. Stewart submitted the following report. (To accompany Bill H.R. 1665.) The committee to whom was referred House Bill 1665, entitled, "An Act To Enable Honorably Discharged Soldiers and Sailors, their Widows and Orphan Children, to Acquire Homesteads on the Public Lands of the United States," have had the same under consideration, and submit the following adverse report ..
