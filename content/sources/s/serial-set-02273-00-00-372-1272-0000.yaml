  title: In the Senate of the United States. February 13, 1885. -- Ordered to be printed. Mr. Blair, from the Committee on Pensions, submitted the following report. (To accompany Bill H.R. 4317.) The Committee on Pensions, to whom was referred House Bill 4317, granting a pension to Julia Chambers, have examined the same, and reports recommending its passage with an amendment reducing the amount from $20 to $12 ..
