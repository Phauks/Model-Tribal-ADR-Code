annotation: First Chamber decision (May 8, 2013, unanimous) on the Independencia aqueduct, brought by Yaqui traditional
  authorities against the federal environmental approval. Confirmed amparo so that the tribe "sea escuchada para
  efectos de la operación (no construcción) del Acueducto"; distinguished consultation from consent (consultation
  must aim at consent, but its absence may not always bar action, depending on the level of impact). Quotes the
  1940 presidential decree on Yaqui water rights.
