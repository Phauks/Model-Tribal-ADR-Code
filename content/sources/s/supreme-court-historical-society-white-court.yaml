notes: 'Read in full Nov. 23, 2026. Facts used: Chief Justice Edward Douglass Whites "rule of reason" in the Standard Oil case; in 1914 the Court held that federal courts must not admit evidence federal officers seized illegally; the Senate confirmed Louis D. Brandeis in 1916 after almost five months; five Justices struck down the federal child labor law of 1916, Holmes and three others dissenting; Schenck (unanimous, Espionage Act); convictions under the 1918 Sedition Act upheld seven to two, Holmes and Brandeis dissenting.'
