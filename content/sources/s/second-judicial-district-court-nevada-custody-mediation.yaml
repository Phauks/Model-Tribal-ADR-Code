annotation: >-
  The Reno (Second Judicial District) Family Services page for custody mediation.
  It says the program started at the court in 1991 and averages 48 mediations per
  month, that mediation discussions are confidential, and that an agreement reached
  is written up by the mediator. The page also links a Dependency Mediation program
  (not opened). It cites no statute, but NRS 3.500 requires such a program in Washoe
  County. (project analysis) This is a court-staffed (in-house mediator) model, in
  contrast with Clark County's roster model.
