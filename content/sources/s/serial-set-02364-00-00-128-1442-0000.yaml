  title: In the Senate of the United States. July 6, 1886. -- Ordered to be printed. Mr. Blair, from the Committee on Pensions, submitted the following report. (To accompany Bill H.R. 2027.) The Committee on Pensions, to whom was referred the Bill (H.R. 2027) granting a pension to Joshua Armstrong, has carefully examined the same, and reports recommending the passage of the bill. The facts are clearly set forth in the annexed House report ..
