topics: [federal-arbitration-act, stay, recent-case]
annotation: >-
  Smith v. Spizzirri (No. 22-1218, argued Apr. 22, 2024, decided May 16, 2024) holds
  that when a court finds a suit subject to arbitration and a party requests a stay,
  FAA § 3 requires a stay and the court may not dismiss. The opinion explains that
  "text, structure, and purpose all point to the same conclusion" (144 S. Ct. at
  1176). The 601 U.S. 472
  citation was seen in search results (Wikipedia, a Proskauer blog, openjurist),
  not on an official page; LII shows the slip opinion as "601 U.S. ___". (project
  analysis) Supports a Tribal code rule that the Tribal court retains the case on
  a stayed docket during arbitration, preserving its supervisory role for confirming
  or vacating the award.
