  title: In the Senate of the United States. April 1, 1884. -- Ordered to be printed. Mr. Maxey, from the Committee on Military Affairs, submitted the following report. (To accompany Bill S. 1304.) The Committee on Military Affairs, to which was referred the Bill (S. 1304) to authorize the Secretary of War to ascertain the expenses incurred by the territorial authorities and the people of Idaho in the suppression of Indian hostilities in the years 1877 and 1878, known as the Bannock and Nez Perce outbreaks, respectfully submits the following report ..
