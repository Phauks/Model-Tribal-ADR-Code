notes: "Read in full Nov. 24, 2026. Facts used: The Court upheld the treason conviction of Hans Max Haupt, with Justice Robert H. Jackson writing the majority opinion. In 1949 the Court ruled that coercion that produced a murder conviction denied due process. Plessy v. Ferguson had been the law of the land, and under it many states operated segregated school systems. In 1951 Oliver Brown sued the Topeka school board, but three federal judges ruled against him because they said Plessy controlled the case. The Court heard the Brown and Briggs cases in December 1952 and ordered reargument in June 1953. Vinson died that September, before the cases were decided."
