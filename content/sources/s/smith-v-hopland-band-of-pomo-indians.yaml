notes: >-
  Full citation: 95 Cal. App. 4th 1 (2002); 115 Cal. Rptr. 2d 455. Decided January 9, 2002. Stein, Acting
  P.J., with Swager and Marchiano, JJ., concurring. Quotes checked on Westlaw: the waiver quote is at 12,
  and footnote 11 reads in full "We hold only that the Tribe waived its sovereign immunity by entering
  into a contract containing the arbitration clause." The reasoning also relies on the council's
  resolutions: the council authorized the chairperson to sign, knew the arbitration and California-law
  terms, and approved the contract by resolution, and the sovereign immunity ordinance "may have been
  satisfied by the council's resolution." Write-up of the Westlaw pull:
  research/pull-results/2026-11-21-legal-history-confirm-first-cases.md in the project's working files;
  the lead author's copy is kept privately and is not redistributed.
