annotation: A State Bar of Wisconsin primer on the 11 federally recognized tribes in Wisconsin, covering tribal sovereign immunity, Public Law 280 concurrent jurisdiction, state-tribal court comity under Teague, ICWA, and tribal child support. A sidebar profiles the Brothertown Indian Nation's federal recognition effort. Relevant to tribal dispute resolution because it describes how state and tribal courts coordinate overlapping jurisdiction and what practitioners should check before choosing a forum. (project analysis)
