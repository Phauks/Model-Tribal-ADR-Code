  type: report
  title: In the Senate of the United States. April 16, 1878. -- Ordered to be printed. Mr. Jones, of Florida, from the Committee on Public Lands, submitted the following report. (To accompany Bill S. 1073.) The Committee on Public Lands, to whom was referred the memorial of the Legislature of the State of Minnesota, approved February 26, 1877, asking the passage of a law by Congress "granting to the State of Minnesota other lands within said state in lieu of lands of said state designated and known as 'salt spring lands,' in which and to which there are any adverse claims, by pre-emption filings, homestead, cash, or scrip entries," have had the same under consideration, and beg leave to submit the following report..
