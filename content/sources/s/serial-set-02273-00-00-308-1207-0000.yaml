  title: In the Senate of the United States. February 10, 1885. -- Ordered to be printed. Mr. Blair, from the Committee on Pensions, submitted the following report. (To accompany Bill H.R. 1711.) The Committee on Pensions, to whom was referred the Bill (H.R. 1711) granting pension to Frederick Nelson, T. Caine, and Henry C. Sanders, have examined the same and report favorably, recommending its passage..
