  title: In the Senate of the United States. April 9, 1860. -- Ordered to be printed. Mr. Lane made the following report. (To accompany Bill S. 149.) The Committee on Public Lands, to whom was referred "A Bill (S. 149) Making Appropriations To Supply a Deficiency in the Appropriations for the Completion of the Geological Survey of Oregon and Washington Territories," have had the same under consideration, and report the bill back, with the recommendation that it do pass, and submit the following documents in support of the appropriations made in the bill ..
