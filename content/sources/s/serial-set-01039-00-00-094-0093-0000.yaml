  title: In the Senate of the United States. February 28, 1860. -- Ordered to be printed. Mr. Foote made the following report. (To accompany Bill S. 230.) The Committee on Claims, to whom were referred the cases of Letitia Humphreys and of Robert Harrison and other claimants, under the treaty of 1819 with Spain, together with voluminous documents in relation to said claims, have had the same under consideration, and, after a careful and patient reexamination of the whole subject, have reached the same conclusion at which this Committee arrived the first session of the last Congress, and adopt the report then made by this Committee through the honorable Mr. Clarke, of New Hampshire, then a member and nature of these claims, and which report is in the following words..
