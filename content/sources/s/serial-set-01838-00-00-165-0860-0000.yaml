  title: In the Senate of the United States. February 28, 1879. -- Ordered to be printed. Mr. Spencer, from the Committee on Military Affairs, submitted the following report. (To accompany Joint Resolution H. Res. 63.) The Committee on Military Affairs, to whom was referred the Joint Resolution (H. Res. 63) requiring the assembly of a court of inquiry in the case of Major Granville O. Haller, late of the Seventh United States Infantry, have had the same under consideration, and submit the following report..
