notes: 'The Tribe''s culture page on Dr. Betty Mae Jumper, second chairperson of the Seminole Tribe of Florida and
  a storyteller, with "Little Frog," given as an excerpt from her book Legends of the Seminoles. The page states
  that whoever receives a legend must retell it as close to the original as possible. Footer: Copyright © Seminole
  Tribe of Florida.'
