notes: 'The Court''s list of every Chief Justice and Associate Justice, with the state each was appointed from, the appointing President, the date of the judicial oath (which the Court treats as the start of service) and the date service ended. An asterisk marks a Justice elevated to Chief Justice. Small letters mark oath dates taken from the minutes of another court (a), another unquestionable authority (b), or an authority the Court calls questionable (c). Read in full Nov. 23, 2026; content/supreme-court/justices.yaml is built from it.'
