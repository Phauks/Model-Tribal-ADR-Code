notes: West Flagler Assocs. v. Haaland, 71 F.4th 1059 (D.C. Cir. 2023). The court held only that the Secretary did
  not violate the APA by choosing not to act on the 2021 Seminole compact, allowing it to take effect by operation
  of law; it reasoned that IGRA permits a compact to address activities "directly related to" gaming, while the
  compact itself authorizes only betting occurring on the Tribe's lands. Read on the original link. Citator check
  (KeyCite) pending; see the project's Westlaw list.
