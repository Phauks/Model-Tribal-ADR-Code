notes: >-
  Citations: Wis. Stat. § 806.245 (current version effective April 13, 2016). History, from Westlaw's
  Historical and Statutory Notes: enacted by L. 1981, c. 369, § 1, eff. May 7, 1982, for the Menominee
  tribal court and legislature only (per the 1991 Legislative Council prefatory note); 1991 Act 43, §§
  1–3, eff. Sept. 12, 1991, extended it to all tribal courts and legislative bodies in Wisconsin, created
  conditions (1)(a)–(e), and made review of a judgment's validity discretionary; 1995 Act 224 amended (5);
  1995 Act 306 created (6) (protection orders); 2009 Act 94 created (1m) (Indian child custody
  proceedings); 2015 Act 352 amended (6). Conditions in (1): the tribe is organized under 25 USC 461 to
  479; the documents are authenticated under (2); the tribal court is a court of record as defined in (3);
  the judgment is valid; and the tribal court certifies that it gives full faith and credit to Wisconsin
  courts' records, orders and judgments. Under (4) the circuit court "on its own motion, or on the motion
  of a party, may examine" the record for jurisdiction, finality, a decision on the merits, no fraud,
  duress or coercion, compliance with the tribal court's procedures, and compliance with the Indian Civil
  Rights Act. Under (5) no lien attaches until a circuit court gives the judgment full faith and credit.
  (project analysis) Condition (1)(a) still cites 25 U.S.C. §§ 461–479, the Indian Reorganization Act,
  which was editorially moved to 25 U.S.C. § 5101 et seq. in 2016. KeyCite: the Westlaw print's flag line
  is blank, so the flag status is not known (the first prints that evening left the flag off); 8 notes of
  decisions and 57 citing references; current through 2025 Act 247. Re-check the flag. Write-up of the
  pull: research/pull-results/2026-11-21-wisconsin-806-245.md in the project's working files.
