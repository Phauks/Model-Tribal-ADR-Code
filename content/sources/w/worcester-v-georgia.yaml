notes: >-
  Full citation: 31 U.S. (6 Pet.) 515 (1832); parallel cite 8 L. Ed. 483. Official report scan:
  https://tile.loc.gov/storage-services/service/ll/usrep/usrep031/usrep031515/usrep031515.pdf. Opinions:
  Marshall, C.J., for the Court; McLean, J., concurring; Baldwin, J., dissenting on the ground that the
  record was not properly returned (his opinion was not delivered to the reporter). Decision date verified Nov. 22, 2026: Mar. 3, 1832 (argued Feb. 20, 21 and 23, 1832), per the Supreme Court Library's table of decision dates, which takes dates from the Court's Engrossed Minutes (source key supreme-court-library-dates-of-decisions-1791-1882). The report and Westlaw print only the term. Write-up of the Westlaw pull:
  research/pull-results/2026-11-21-legal-history-confirm-first-cases.md in the project's working files;
  the lead author's copy is kept privately and is not redistributed.
