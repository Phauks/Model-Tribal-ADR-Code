case_box:
  background: |-
    Georgia made it a crime for white persons to live within the Cherokee Nation without a state license and an oath to support Georgia's laws. Samuel Worcester, a Vermont citizen and missionary living at New Echota with the Cherokee Nation's permission and under federal authority, was convicted under that law and sentenced to four years of hard labor [@worcester-v-georgia, pp. 536-538].
  question: |-
    May Georgia apply its criminal laws to a non-Indian missionary living in the Cherokee Nation under federal license?
  holding: |-
    No. The Court held that the Cherokee Nation is a distinct political community in which state law has no force. Relations with it are vested exclusively in the federal government under the Constitution, treaties and federal statutes. Georgia's statute and Worcester's conviction were void.
  quotes:
  - text: "The Indian nations had always been considered as distinct, independent political communities, retaining their original natural rights, as the undisputed possessors of the soil, from time immemorial ..."
    pinpoint: "p. 559"
  - text: "A weak state, in order to provide for its safety, may place itself under the protection of one more powerful, without stripping itself of the right of government, and ceasing to be a state."
    pinpoint: "p. 561"
  - text: "The Cherokee nation, then, is a distinct community occupying its own territory, with boundaries accurately described, in which the laws of Georgia can have no force ..."
    pinpoint: "p. 561"
  treatment: |-
    *Williams v. Lee* (1959) calls it one of Marshall's "most courageous and eloquent opinions" while noting that later cases modified its rule against any state jurisdiction in Indian country. [@williams-v-lee]

    *Oklahoma v. Castro-Huerta* (2022) states that the *Worcester* view that Indian country was separate from the State was later abandoned; the dissent disputes this reading. [@oklahoma-v-castro-huerta]
  reading:
    title: "*Worcester v. Georgia* (1832)"
    text: |-
      The core statement of inherent Native sovereignty and of the federal-Tribal relationship excluding state law.
