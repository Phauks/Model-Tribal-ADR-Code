annotation: >-
  Ninth Circuit (Wright, Reinhardt, Thomas, JJ.; opinion by Judge Thomas) holding
  that 28 U.S.C. § 1738 does not extend full faith and credit to Tribal judgments
  (127 F.3d at 808-09).
  Federal-court recognition of Tribal judgments rests on comity. The court adapts
  Hilton v. Guyot and Restatement (Third) of Foreign Relations Law § 482 into two
  mandatory grounds for refusing recognition (no personal and subject-matter jurisdiction;
  no due process) and four discretionary ones (fraud, a conflicting judgment, inconsistency
  with a contractual choice of forum, public policy) (id. at 810). It also rejects
  a reciprocity requirement (id. at 811-12) and holds that federal law governs recognition
  (id. at 813). The court adds that comity 'does not require that a tribe utilize
  judicial procedures identical to those used in the United States Courts' (id. at
  811). (project
  analysis) This is the leading template a state or federal court will use when asked
  to recognize a Tribal court judgment that confirms an ADR or peacemaking outcome,
  so a model code should build in jurisdictional findings, notice, and an opportunity
  to be heard.
