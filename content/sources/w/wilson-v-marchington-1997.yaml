case_box:
  background: |-
    On July 17, 1989, Thomas Marchington, a nonmember driving for an Idaho carnival company, tried to pass Mary Jane Wilson, a Blackfeet member, on U.S. Highway 2 within the Blackfeet Reservation and hit her car as she turned. A jury in the Blackfeet Tribal Court awarded her $246,100. She then sued in federal district court to have the judgment recognized and enforced [@wilson-v-marchington-1997, p. 807].
  question: |-
    Must a federal court give full faith and credit to a Blackfeet Tribal Court tort judgment, and if not, when should it recognize the judgment under comity?
  holding: |-
    The court held that comity, not full faith and credit, governs federal recognition of Tribal judgments. Federal courts must refuse recognition if the Tribal court lacked personal or subject-matter jurisdiction or denied due process, and may decline on listed equitable grounds. Because, after *Strate*, the Tribal court lacked jurisdiction over the highway accident between a member and a nonmember, the judgment could not be recognized; the district court's enforcement judgment was reversed.
  quotes:
  - text: "We conclude that the principles of comity, not full faith and credit, govern whether a district court should recognize and enforce a tribal court judgment."
  - text: "[F]ederal courts must neither recognize nor enforce tribal judgments if: (1) the tribal court did not have both personal and subject matter jurisdiction; or (2) the defendant was not afforded due process of law."
  - text: "[T]he existence of both personal and subject matter jurisdiction is a necessary predicate for federal court recognition and enforcement of a tribal judgment."
  - text: "Extending comity to tribal judgments is not an invitation for the federal courts to exercise unnecessary judicial paternalism in derogation of tribal self-governance."
  treatment: |-
    Applied in *Bird v. Glacier Electric Cooperative* (9th Cir. 2001) [@bird-v-glacier-electric-cooperative] and *AT&T Corp. v. Coeur d'Alene Tribe* (9th Cir. 2002) [@att-corporation-v-coeur-dalene-tribe].
