annotation: >-
  Washington's court rule, adopted effective September 1, 1995 and amended effective
  September 24, 2019. It requires dismissal where Tribal jurisdiction is exclusive,
  allows transfer to Tribal court where jurisdiction is concurrent, and requires
  superior courts to 'recognize, implement and enforce' Tribal-court orders, judgments
  and decrees. There are three exceptions: lack of jurisdiction, denial of ICRA due
  process, or lack of reciprocity. The 2019 amendments added subsection (d) on direct
  court-to-court communication, which defers to 'The Indian tribal court’s procedures
  and customs' on party participation. Subsection (c)(2) lets a superior court 'attempt
  to resolve any issues raised regarding an Indian tribal court money judgment by
  contacting the Indian tribal court.' (project analysis) This is a strong model
  for a Tribal code's reciprocity clause. The (c)(2) judge-to-judge resolution of
  recognition problems is an informal intercourt dispute-resolution step.
