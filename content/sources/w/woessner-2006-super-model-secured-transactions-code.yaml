annotation: >-
  How the Model Tribal Secured Transactions Act was drafted. In 2001, "at the request of several tribes," a committee of the National Conference of Commissioners on Uniform State Laws (now the Uniform Law Commission) began drafting it with representatives of Indian tribes. The article says "10 Indian tribes" but names nine: Crow Nation, Sac and Fox Nation, Navajo Nation, Chitimacha Tribe of Louisiana, Oneida Indian Nation of New York, Cherokee Nation, Confederated Tribes of the Warm Springs Reservation, Chickasaw Nation and Little Traverse Bay Bands of Odawa Indians. The committee met twice a year and "created case studies to test what they had drafted," dropped self-help repossession in favor of Tribal courts, and "finalized the MTA in August of 2005, after four years of drafting."
