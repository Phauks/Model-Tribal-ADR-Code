annotation: >-
  An article by Robert Yazzie (then Chief Justice of the Navajo Nation) on Navajo
  justice concepts, published in the New Mexico Law Review's 1994 Tribal-law issue
  (Vol. 24, Iss. 2). The same issue includes Valencia-Weber's 'Tribal Courts: Custom
  and Innovative Law', Alex Tallchief Skibine on deference to Tribal courts' jurisdictional
  determinations, and Christine Zuni Cruz on the Southwest Intertribal Court of Appeals.
  (project analysis) Widely cited for the distinction between Navajo peacemaking
  and adversarial or Anglo processes. The article text was not opened here, so no
  characterization of its argument is recorded. Trevor should read it before the
  commentary relies on it.
