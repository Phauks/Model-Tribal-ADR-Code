annotation: 'Defines the juez maya as "la autoridad nombrada por la comunidad maya" (art. 2), with jurisdiction
  only in that community (art. 12): administrative infractions, matters open to settlement, and non-serious crimes
  where pardon is available (art. 13). Procedure follows usos y costumbres within human rights (art. 16); conciliation,
  mediation, then arbitration with res judicata effect (art. 17); reparation required for crimes (art. 18); community
  work 15 days to 6 months (art. 19); "En ningún caso . . . el juez maya aplicará privación de la libertad" (art.
  21). Replaced title V of the 2011 Ley para la Protección de los Derechos de la Comunidad Maya.'
