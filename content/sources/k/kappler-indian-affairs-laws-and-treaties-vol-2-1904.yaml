  note: Free on govinfo (a 675 MB PDF digitized by the Law Library of Congress) and in Oklahoma State University's Kappler collection (https://dc.library.okstate.edu/digital/collection/kapplers/id/29661/); treaty-by-treaty text at https://treaties.okstate.edu/. Do not use the 1903 first printing (S. Doc. No. 57-452) for page numbers; its pagination differs.
