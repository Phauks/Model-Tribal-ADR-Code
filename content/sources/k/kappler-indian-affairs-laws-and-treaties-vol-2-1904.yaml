notes: Bibliographic details from the govinfo Serial Set record (S. Doc. 58-319, SuDoc 58-2:S.DOC.319/V.2, 1904) and the Oklahoma State University digital collection record (read through cdm17279.contentdm.oclc.org because dc.library.okstate.edu did not answer from the cloud) on Nov. 22, 2026. Lawcat lists the five-volume set (record 462977, "[2nd. ed.]", 1904-1941). Page numbers cited for individual treaties come from the treaty database's page addresses and were checked against a page image only for the 1778 Delaware treaty (p. 3).
