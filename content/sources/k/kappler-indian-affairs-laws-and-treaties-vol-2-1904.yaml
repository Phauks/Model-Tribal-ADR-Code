annotation: The standard compilation of treaties between the United States and Native nations, 1778 to 1868, printed as a Senate document (58th Cong., 2d Sess., Serial Set No. 4624). (project analysis) The reference the project cites for treaty page numbers; the Oklahoma State University Tribal Treaties Database reproduces its text treaty by treaty.
