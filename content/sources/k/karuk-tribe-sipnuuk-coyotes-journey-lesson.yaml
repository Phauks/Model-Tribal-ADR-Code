notes: 'A third-grade lesson in the Karuk Tribe''s Sípnuuk digital library (record rights line: "Karuk Tribe").
  Recorded only for its statement of the winter telling rule: "The Karuk, like most indigenous peoples, traditionally
  only tell stories when it is cold enough for snow to be in the high mountains. Please respect this tribal code."
  The story in the lesson is not quoted.'
