annotation: Indigenous justice "es alterna a la vía jurisdiccional ordinaria" (art. 35); customary norms govern
  family, community and civil life and "la prevención y solución de conflictos" (art. 36). Establishes a community
  security system whose highest body is the General Assembly (arts. 38, 40); the local authority hears a dispute
  first, and non-members go to ordinary courts (art. 42). Natural-resource conflicts are to be resolved "por la
  vía de la conciliación" (art. 74). The Supreme Court (Acción de Inconstitucionalidad 81/2018) invalidated a 2018
  amending decree.
