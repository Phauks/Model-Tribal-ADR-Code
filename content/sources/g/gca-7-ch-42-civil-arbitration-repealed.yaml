annotation: >-
  Guam's former general arbitration chapter. The Compiler's note reads "Entire chapter
  repealed by P.L. 27-081:2 (April 30, 2004)." The same 2004 law enacted Chapter
  42A (international and domestic arbitration on the UNCITRAL Model Law), Chapter
  42B (court-referred ADR), and Chapters 43A and 43B (mediation). The CNMI Supreme
  Court in PAC United v. Guam Concrete Builders, 2002 MP 15 ¶ 29, relied on former
  7 GCA § 42101 as making arbitration agreements irrevocable and enforceable under
  Guam law. (project analysis) Contrary to the assumption in the task, the materials
  read here do not show that Guam enacted the Uniform Arbitration Act or the RUAA
  after 2004.
