annotation: >-
  Creates within the Judicial Branch an Alternate Dispute Resolution Office "under
  the direction of the Chief Justice and the Judicial Council" (§ 4301). Section
  4302 charges it to "facilitate dispute resolution without litigation" and to provide
  training and services for mediation, conciliation, arbitration and other means
  of settling disputes "among residents of Guam." Enacted in 1987 as former CCP §§
  205-206. (project analysis) This is a short statutory charter for a court ADR office,
  a structural piece a model Tribal code could copy almost word for word.
