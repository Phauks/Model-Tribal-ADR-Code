annotation: >-
  Guam's arbitration statute, enacted by P.L. 27-081:3 (Apr. 30, 2004). Section 42A101(b)
  says it "is based on the UNCITRAL Model Law and should be interpreted having regard
  to international comity." Under § 42A101(d), it applies to both international commercial
  arbitration and domestic arbitration, and § 42A101(g) defines domestic arbitration
  as one seated in Guam. Section 42A101(c) treats Guam as a "State" for the chapter's
  purposes. Some enforcement provisions (§§ 42A701-42A702) apply only where neither
  the FAA nor the New York Convention applies. (project analysis) Guam is unusual
  among U.S. jurisdictions in running domestic arbitration on the Model Law instead
  of the UAA or RUAA. That gives a Tribal drafter a tested territorial example of
  a Model-Law-based code.
