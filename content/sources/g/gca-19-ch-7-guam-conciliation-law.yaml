annotation: >-
  Gives the Superior Court "conciliation jurisdiction" over domestic-relations disputes
  (§§ 7101-7108), added to the Civil Code by P.L. 15-26 according to an unofficial
  mirror. Section 7111 (added by P.L. 24-239:31) bars the court from ordering parties
  into conciliation or mediation "when either party asserts that family violence
  has occurred." In protection-order matters it allows those services only if the
  victim requests them, a qualified professional screens the case, a mediator trained
  in family violence conducts it, and a support person may attend. (project analysis)
  This is a strong, citable statutory model for family-violence screening and opt-in
  safeguards. A Tribal ADR code covering domestic relations should address the same
  issue.
