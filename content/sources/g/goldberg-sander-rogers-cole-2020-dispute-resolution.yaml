annotation: >-
  The long-running ADR casebook co-authored by Frank Sander, the author of 'Varieties
  of Dispute Processing'. The Aspen page lists the Seventh Edition (publication date
  2020-02-02, 704 pages, Aspen Casebook Series; ISBN 9781543801088, eBook 9781543849431)
  by Stephen B. Goldberg, Frank E.A. Sander, Nancy H. Rogers, and Sarah Rudolph Cole.
  (project analysis) The standard teaching map of U.S. processes, including hybrid
  processes and the design of dispute systems. 'Dispute systems design' is best treated
  in the project as a design discipline (like the multi-door courthouse), not as
  a method.
