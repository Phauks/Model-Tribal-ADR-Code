annotation: >-
  Guam's permanent court-referred mediation rules, adopted May 21, 2014, after the
  2006 pilot. They apply to "all parties involved in non-criminal cases" and have
  limited application in juvenile proceedings (MR 4.1.2). Judges should review dockets
  for referral (MR 4.1.8(a)), and parties may stipulate (MR 4.1.8(b)). A party ordered
  to mediate without stipulating may seek relief (MR 4.1.10). An Order for Mediation
  (Form B2) appoints a provider and sets a status hearing within 60 days (MR 4.1.9).
  Mediation information is not communicated to the assigned judge (MR 4.1.14). The
  Chief Justice approves mediators engaged by providers (MR 4.1.21). (project analysis)
  Using approved private providers, instead of court-staff mediators, is a design
  choice worth comparing with the court-staffed centers in Puerto Rico.
