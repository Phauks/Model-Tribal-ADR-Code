annotation: A question-and-answer practice column by Gabe Galanda for Oregon attorneys on tribal sovereignty, tribal courts, and sovereign immunity in suits against tribes and their enterprises. It covers which forum handles claims arising on reservations, when tribal courts can reach non-Indians, and criminal jurisdiction under Public Law 280. It is a practitioner orientation to the jurisdiction and immunity questions that decide where a dispute is heard. (project analysis)
