annotation: >-
  Court-annexed arbitration for Superior Court civil actions, with custody cases
  excluded (§ 42B101(a)). By stipulation, any non-custody action may go to binding
  arbitration, mediation, early neutral evaluation or another method (§ 42B101(c)).
  A court-annexed award becomes final unless "a request for a de novo trial is filed
  within thirty days" (§ 42B103). A party who requests a trial de novo and does no
  better at trial pays specified costs and fees, absent substantial economic hardship
  (§ 42B104). An award not challenged becomes a judgment that "is not subject to
  appeal" (§ 42B105). Funding comes through Judicial Council fees (§ 42B102). (project
  analysis) This is a standard California-style judicial arbitration scheme and a
  ready model for non-binding court-annexed arbitration with cost-shifting.
