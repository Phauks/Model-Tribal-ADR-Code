annotation: >-
  Guam's local counterpart to the federal Ending Forced Arbitration of Sexual Assault
  and Sexual Harassment Act of 2021. At the election of the person alleging the conduct,
  "no predispute arbitration agreement or predispute joint-action waiver shall be
  valid or enforceable" for cases filed under federal or local law (§ 42C104). (project
  analysis) This is a territorial example of carving categories of disputes out of
  pre-dispute arbitration, a policy choice a Tribal ADR code will face. Whether this
  local rule survives FAA preemption where the FAA applies is a separate question
  not researched here.
