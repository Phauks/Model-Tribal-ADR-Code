annotation: The only comparison study of a Tribal peacemaking program found in this session. Surveys of
  Peacemaking and Family Court participants in the Chinle district. Peacemaking participants rated their
  venue fair more often (81% against 50%, at 30-31), saw their case as settled more often (79% against
  51.4%, at 32), and more often said they could voice their feelings (86% against 50%, at 34). The problem
  recurred for 29% of Peacemaking participants and 64% of Family Court participants (at 45), but the author
  reports that 'the difference was not found to be statistically significant' (at 40), and warns that
  'the sample size was small and the methodological design was not random' (at 45). (project analysis)
  Evidence of participant satisfaction, not proof of lower recurrence.
