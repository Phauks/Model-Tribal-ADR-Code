annotation: >-
  The Superior Court's civil case-management rules. CVR 16.2(a)(5) requires counsel
  at the meet-and-confer to discuss "the timing and appropriateness of mediation
  or other forms of alternative dispute resolution." CVR 16.6(a) allows any party
  to request a judicial settlement conference, which is a privileged proceeding "not
  reported or recorded." Under CVR 16.6(b), parties "may be ordered into mediation"
  or may stipulate to it. The CVR 16.x provisions were adopted by Promulgation Orders
  06-006-01 and 06-006-02 (2007) and amended by 06-006-16 (2014). The compilation
  is dated Oct. 13, 2025. (project analysis) It shows how a court plugs ADR into
  scheduling orders without a standalone ADR code.
