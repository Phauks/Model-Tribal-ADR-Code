annotation: >-
  Authorizes the Supreme Court of Guam to "establish and promulgate rules and procedures
  for mediation" (§ 43B601(a)) and allows referral to mediation "Upon stipulation
  of the parties" (§ 43B601(b)). The Judicial Council may levy fees to fund the program
  (§ 43B602). The Compiler notes the program began under Supreme Court Promulgation
  Order 06-005-01 (July 20, 2006), Interim Rules for the Mediation Pilot Project
  for Civil Actions. Supreme Court rules go to the Legislature and are deemed approved
  unless it acts within 90 days plus one legislative day. (project analysis) The
  legislative-review mechanism for court ADR rules is a governance design point worth
  noting for Tribal courts and councils.
