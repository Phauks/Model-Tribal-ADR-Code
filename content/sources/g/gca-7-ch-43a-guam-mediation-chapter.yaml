annotation: >-
  Guam's general mediation statute, in five articles. They cover agreements to mediate
  (which § 43A103 makes valid, irrevocable and enforceable), stays and tolling, evidence
  and non-disclosure (§§ 43A201-43A204), termination, costs and enforcement of settlements,
  and mediator ineligibility to serve as arbitrator, immunity and ethics or training
  standards (§§ 43A501-43A507). Section 43A102(a) defines mediation as a process
  in which neutrals facilitate communication between disputants "to assist them in
  reaching a mutually acceptable agreement." (project analysis) The text does not
  say it is based on the Uniform Mediation Act, and its structure (evidence rule,
  enforceable agreements to mediate) differs from the UMA's privilege model. Compare
  it with the UMA in commentary.
