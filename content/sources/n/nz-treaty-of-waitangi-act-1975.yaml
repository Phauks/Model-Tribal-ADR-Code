annotation: >-
  The Act that established the Waitangi Tribunal. Under s 6(1) a Māori claimant who is or is likely to
  be prejudicially affected by Crown legislation, policy, practice, act or omission "inconsistent with
  the principles of the Treaty" may submit a claim; under s 6(3), if a claim is well founded the Tribunal
  "may ... recommend to the Crown that action be taken to compensate for or remove the prejudice." Section
  6(4A) bars recommendations to return or acquire private land, subject to ss 8A to 8I. For land transferred
  to State enterprises (s 8A) and Crown forest land (s 8HB), interim recommendations for return "shall
  take effect as final recommendations" after 90 days unless the claim is settled (ss 8B(6), 8HC). (project
  analysis) The Tribunal is an inquiry-and-recommendation body with a narrow binding power, a design that
  keeps the Crown's final say while giving a forum that applies Treaty principles; a model code's intergovernmental
  chapter can compare recommendation-only and binding outcomes.
