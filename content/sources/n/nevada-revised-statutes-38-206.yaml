annotation: >-
  Nevada's enactment of the Revised Uniform Arbitration Act (added by Stats. 2001,
  p. 1274). It applies to agreements to arbitrate made on or after October 1, 2001
  (NRS 38.216). Nevada departs from the uniform text in NRS 38.219(1), which makes
  arbitration agreements enforceable 'except as otherwise provided in NRS 597.995'
  (Nevada's specific-authorization rule for arbitration clauses). NRS 38.241 lists
  the uniform vacatur grounds. (project analysis) This is the worked example of a
  state taking the ULC text with small local changes. A Tribal code can do the same,
  for example by adding Tribal-court-specific venue and sovereign-immunity provisions.
