annotation: >-
  The Navajo Nation Judicial Branch and Purchasing Services Department invited sealed bids from licensed
  general contractors to build a Navajo Nation Supreme Court peacemaking building and amphitheater in Window
  Rock, Arizona; advertised Oct. 21-22, 2026, closing Nov. 18, 2026. Evidence that the Nation is building a
  dedicated peacemaking facility at the Supreme Court (project analysis).
