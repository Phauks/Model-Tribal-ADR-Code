annotation: >-
  A Nevada Class III gaming compact approved by Interior on October 17, 2014 (approval
  letter bound with the compact on the BIA Office of Indian Gaming site). Article
  IX gives the Tribe jurisdiction over all patron disputes, with optional state technical
  help on gaming devices. Article X contains a limited mutual waiver of immunity
  for compact disputes in federal court (venue in Washoe County), limited to declaratory
  and injunctive relief with no money damages. Article XIII sets a notice, 90-day
  cure, and 30-day meet-and-confer sequence, and keeps open 'mediation or arbitration'
  by mutual written agreement. (project analysis) Compared with California compacts,
  Nevada's is light: negotiation and then federal court, with ADR only by later agreement.
  Article X's condition reads oddly ('provided that the parties have not first attempted
  to resolve the dispute'), and Trevor should check the signed original.
