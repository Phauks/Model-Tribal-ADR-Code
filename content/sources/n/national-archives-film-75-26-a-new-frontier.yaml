notes: 'Indigo Book citation: A New Frontier (U.S. Department of the Interior, Office of Indian Affairs n.d.) (motion picture), National Archives Identifier 5701097, RG 75, item 75.26. Digitized by the National Archives; the project''s copy is its file, unchanged (148,891,679 bytes, SHA-256 73d166f16b4c2279f232ea4f44fa8258e308ea8db3631a3be13a2114da1a225c). The screen names its maker: "U.S. Department of Interior Presents ... An Indian Service Film". Thirty frames read across the film show maps of the Colorado River Indian Reservation in Arizona, irrigation and land clearing, farming, building and the reservation hospital. Chosen as a federal Indian policy item (an Indian Service film on the Colorado River Indian Reservation) by scripts/law/national_archives_films.py; ceremony films and children''s recordings in the same series are left out (CARE principles). Not yet watched or heard in full by a person (Unverified).'
