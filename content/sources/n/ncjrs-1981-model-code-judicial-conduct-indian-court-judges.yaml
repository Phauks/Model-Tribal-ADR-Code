annotation: >-
  A 19-page model code (NCJRS catalog record NCJ 80533, 1981) with the National American Indian Court
  Judges Association as corporate author. Per the abstract, it applies to "anyone, whether or not a lawyer,
  who is an officer of a tribal judicial system and is performing judicial functions," sets standards
  of integrity, independence, impartiality and diligence, and "It is expected that tribes will modify
  some provisions of the code to reflect tribal customs." (project analysis) An early example of an intertribal
  model drafted for adaptation rather than uniform enactment, and a possible base for ethics rules for
  neutrals who are not lawyers.
