annotation: >-
  A four-page paper (October 2019 version) by Brett Lee Shelton and Jessica Allison that walks through
  UNDRIP articles 3, 4, 5, 8, 11(1), 23, 31(1), 33(2), 34 and 35 and explains how each supports Indigenous
  peoples' own ways of dispute resolution. It says the Declaration gives "plentiful, broad, and welcome
  support for the rights of Indigenous Peoples to continue or revitalize their own ways of dispute resolution"
  (at 1) and reads Article 34 as "a clear affirmation of a right to develop Peacemaking programs" (at
  4). It does not discuss Article 40. (project analysis) Useful as the peacemaking track's own reading
  of the Declaration, which grounds peacemaking in self-government and culture rather than in ADR.
