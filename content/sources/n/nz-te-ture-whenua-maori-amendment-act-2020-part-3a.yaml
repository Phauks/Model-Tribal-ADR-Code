annotation: >-
  Section 22 inserts Part 3A, "Dispute resolution" (ss 98H to 98S), into Te Ture Whenua Māori Act 1993.
  Its purpose (s 98I) is to help parties, including owners of Māori land, resolve disputes "in accordance
  with the law" and, "as far as possible, in accordance with the relevant tikanga of the whanau or hapu
  with whom they are affiliated." Section 98J(1): "An issue may be referred to mediation only if all the
  parties agree to mediation," and s 98J(2) allows mediation only while all still agree. Mediation material
  "must be kept confidential by the mediator and participants" unless the person who produced it consents
  (s 98O(5)), and statements are not admissible in other proceedings without consent (s 98O(7)). When
  issues resolve, the mediator records the terms and reports them to the referring Judge or Registrar
  (s 98P(1)); a Judge may make an order including those terms, but only if satisfied the resolution complies
  with the law and tikanga purposes (s 98P(2) to (4)). The Act received assent on Aug. 6, 2020; the mediator-appointment
  rules in s 98M(2) to (5) commenced Apr. 30, 2026. (project analysis) This is the closest statutory model
  found for court-connected mediation that is voluntary throughout, names the community's own law (tikanga)
  as a standard, and turns agreements into court orders only after a legality check.
