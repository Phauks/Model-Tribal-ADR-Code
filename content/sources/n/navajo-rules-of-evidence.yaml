notes: >-
  The lead author's copy (12 pages, 2026-11-22) is one document with the full rules, headed "Navajo Rules of Evidence (Effective April 1, 1978)". Rule 1 says the District Judges of the Navajo Nation adopted the rules by unanimous vote and that they govern all proceedings in the Navajo courts. Rule 10 makes compromise offers, and conduct or statements in compromise negotiations, inadmissible to prove liability for or invalidity of a disputed claim or its amount, with exceptions for other purposes such as proving bias. Rule 12 says no one has a privilege except as the constitution, these rules or other rules of the judges provide. Rule 13 lists the recognized privileges: lawyer-client, psychotherapist-patient, husband-wife, communications to clergy, the secret ballot, trade secrets, and privileges derived from the U.S. Constitution. Rule 13 names no privilege for peacemaking or for sacred or customary matters (project reading of the copy). The courts' site refuses automated requests, so the link is to its contents page; later amendments, if any, were not checked.
