annotation: >-
  The Ninth Circuit (whose district courts include the District of Nevada) runs a
  Circuit Mediation Program "created under Federal Rule of Appellate Procedure 33
  and Circuit Rule 33-1," staffed by court-employed professional mediators, free
  to parties, with confidentiality under Circuit Rule 33-1; its stated mission (quoting
  General Order 7.1) is "to facilitate the voluntary resolution of appeals in order
  to reduce the court’s workload and to offer parties an alternative to litigation
  to resolve their disputes." (project analysis) A model for appellate-level mediation
  in a Tribal court of appeals, using staff neutrals rather than a private roster.
