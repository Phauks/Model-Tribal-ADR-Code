annotation: >-
  FJC bench guide (2001; title page) that, per its PDF metadata, "Offers guidance
  to federal trial and bankruptcy courts on when and how to refer appropriate cases
  to ADR and how to manage such cases." Its contents cover authority to refer (district
  and bankruptcy courts), definitions of the principal types of federal court-based
  ADR, timing of referral, and case-selection factors, including whether there is
  a pro se party, whether a governmental entity is a party, and whether settlement
  depends on confidential information (Table of Contents, ch. III.A). (project analysis)
  Useful for commentary on judicial referral criteria in a Tribal court ADR rule,
  especially the governmental-party and pro se factors that are common in Tribal
  courts. The FJC catalog page was found in search results; the PDF was opened.
