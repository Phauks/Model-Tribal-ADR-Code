notes: 'Indigo Book citation: Miracle of Water (U.S. Department of the Interior, Bureau of Indian Affairs n.d.) (motion picture), National Archives Identifier 12696, RG 75, item 75.20. The National Archives describes it: "DOCUMENTARY: Shows problems faced by midwesterners due to excessive or lack of water. It explains how water levels are regulated by use of canals,dams and other methods." Not digitized: the National Archives holds the film at College Park, where it can be viewed or copied on request. Chosen as a federal Indian policy item (Bureau irrigation and water works) by scripts/law/national_archives_films.py; ceremony films and children''s recordings in the same series are left out (CARE principles). Not yet watched or heard in full by a person (Unverified).'
