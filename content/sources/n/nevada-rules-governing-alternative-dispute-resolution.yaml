annotation: >-
  The Nevada Supreme Court's consolidated ADR rules. They were adopted by order of
  December 22, 2004, effective March 1, 2005 (the cover says March 3, 2005), with
  amendments through March 12, 2026. Part A gives definitions and lists the forms
  of court-annexed ADR that districts with a county of 100,000 or more must offer:
  arbitration, mediation, settlement conference, and others contemplated by NRS 38.250.
  Part B (NAR) runs the mandatory, nonbinding Court Annexed Arbitration Program with
  trial de novo. Part C (NMR) creates a voluntary Court Annexed Mediation Program
  that parties may enter by stipulation instead of arbitration, with mediator qualifications,
  fee caps, and a confidentiality-and-immunity rule (NMR 11). (project analysis)
  Part A's definitions are clean, rule-ready texts that can be adapted directly into
  a Tribal ADR code.
