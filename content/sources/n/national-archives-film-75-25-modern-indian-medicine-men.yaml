notes: 'Indigo Book citation: Modern Indian Medicine Men (U.S. Department of the Interior, Office of Indian Affairs n.d.) (motion picture), National Archives Identifier 12701, RG 75, item 75.25. The National Archives describes it: "DOCUMENTARY FILM: Shows duties of U.S. Indian Service physician on Native American reservation.  Discusses advantages and disadvantages of working on Pima reservation southwestern U.S." Digitized by the National Archives; the project''s copy is its file, unchanged (152,979,853 bytes, SHA-256 eaf8cbc981f6117fa32e631afee3a58f6411d5c0e3ad7325aa2308f02fff25cd). The screen names its maker: "Produced by U.S. Indian Service 1947". It opens with dancers and a figure at a fire, which may be a ceremony, so the project''s copy is held for the nation''s review. Chosen as a federal Indian policy item (Indian Service physicians (1947); opens with dancers and a healing fire, so held for review) by scripts/law/national_archives_films.py; ceremony films and children''s recordings in the same series are left out (CARE principles). Not yet watched or heard in full by a person (Unverified).'
