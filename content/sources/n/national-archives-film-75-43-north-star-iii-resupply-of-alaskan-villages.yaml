notes: 'Indigo Book citation: "North Star III" Resupply of Alaskan Villages (Bureau of Indian Affairs records n.d.) (motion picture), National Archives Identifier 12714, RG 75, item 75.43. Digitized by the National Archives; the project''s copy is its file, unchanged (322,587,011 bytes, SHA-256 42c4530beffaf8d7bbc2f4cd1cf4ee598b61cee7ea04278d75e8d64f144a7789). The film does not name its maker on screen. Thirty frames read across the film show the voyage of the North Star III, loading at port and in the ice, and village life ashore. Chosen as a federal Indian policy item (the Bureau''s North Star III resupply of Alaska villages) by scripts/law/national_archives_films.py; ceremony films and children''s recordings in the same series are left out (CARE principles). Not yet watched or heard in full by a person (Unverified).'
