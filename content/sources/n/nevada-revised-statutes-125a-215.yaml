annotation: >-
  Nevada's UCCJEA (NRS chapter 125A, added 2003) enacts BOTH bracketed options of
  UCCJEA § 104. Nevada courts must treat an Indian tribe as a state for jurisdiction,
  and Tribal custody determinations made in substantial conformity with the act's
  jurisdictional standards 'must be recognized and enforced.' 'Tribe' is defined
  in NRS 125A.165 as an Indian tribe, band or Alaska Native village 'recognized by
  federal law or formally acknowledged by a state.' The section was amended in 2023.
  (project analysis) This is Nevada's main statutory recognition rule for Tribal-court
  orders. A custody agreement reached in Tribal mediation or peacemaking and entered
  as a Tribal-court order would be enforceable in Nevada through this route.
