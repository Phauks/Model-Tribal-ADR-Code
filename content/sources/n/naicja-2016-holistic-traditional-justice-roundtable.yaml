annotation: A 2016 NAICJA report, prepared for the Bureau of Justice Assistance, summarizing a November 2015 roundtable on holistic and traditional justice in tribal courts, including peacemaking, peace circles, restorative approaches, and wellness courts. It records practitioner views on how these practices intersect with adversarial tribal courts, with examples from a tribal defenders office, a university clinic referral, and a Pueblo court's practices. (project analysis)
