notes: 'Indigo Book citation: Realignment of Bureau of Indian Affairs (U.S. Department of the Interior, Bureau of Indian Affairs 1973) (motion picture), National Archives Identifier 12690, RG 75, item 75.13. The National Archives describes it: "DOCUMENTARY: Secretary of Interior Roger Clark Ballard Morton announces new Assistant Secretary of Bureau of Indian Affairs, Marvin L. Franklin.Marvin Franklin speaks of the reorganization of Bureau of Indian Affairs. He analyzes Bureau of Indian Affairs'' eleven departments;Mr.Franklin describes them in detail with use of a flow chart." Not digitized: the National Archives holds the film at College Park, where it can be viewed or copied on request. Chosen as a federal Indian policy item (the Bureau''s 1973 reorganization) by scripts/law/national_archives_films.py; ceremony films and children''s recordings in the same series are left out (CARE principles). Not yet watched or heard in full by a person (Unverified).'
