topics: [tribal-state-relations, protection-orders, judicial-education, court-improvement-program]
annotation: >-
  A public-education page from the Nevada judiciary. It says Tribal courts operate
  under the sovereignty of '28 federally recognized tribes' and that protective orders
  issued by Tribal courts are recognized in state courts. It describes joint education
  programs (the National Judicial College's National Tribal Judicial Center and the
  Nevada Court Improvement Program) but no formal Tribal-state court forum. A second
  document, the Court Improvement Program's 'Tribal Jurisdictions & Resources: Nevada'
  (undated PDF: https://nvcourts.gov/__data/assets/pdf_file/0031/48496/Nevada_Tribal_Jurisdictions_and_Services_Resource_1.pdf),
  states 'There are 18 active Tribal Courts in Nevada' and describes the Inter-Tribal
  Council of Nevada (ITCN) as offering 'trial and appellate court services for member
  tribes.' (project analysis) Nevada appears to lack the formal Tribal-state court
  forum found in California, Michigan, New Mexico or Washington. That gap is relevant
  for the book's Nevada worked example.
