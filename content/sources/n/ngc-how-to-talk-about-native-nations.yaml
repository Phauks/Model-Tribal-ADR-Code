notes: >-
  Based on the May 12, 2021 event "Language Matters: How to Talk about Native
  Nations." The PDF has no printed page numbers; pinpoints in project files
  count pages from the cover. Its advice against "Tribe" differs from the same
  organization's Terminology Style Guide, which allows "Tribal nations" and
  "Tribes" in some cases.
