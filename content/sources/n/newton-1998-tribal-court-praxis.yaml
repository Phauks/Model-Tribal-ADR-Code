annotation: >-
  Newton reviews a year of published Tribal court opinions from twenty courts. On evidence: where Tribal
  procedural codes are silent, Tribal courts often applied the federal rules of civil or appellate procedure
  or the Federal Rules of Evidence as guidelines, while saying they were not bound by them (at 318-19 & n.127,
  citing Waters v. Colville Confederated Tribes, 23 Indian L. Rep. 6120 (Colville Ct. App. 1996), on hearsay
  and impeachment, and Confederated Salish & Kootenai Tribes v. Devereanux, 23 Indian L. Rep. 6099 (1996), on
  Fed. R. Evid. 606(b)). (project analysis) No other passage on hearsay, custom as evidence or informal rules
  was found by a text search of the article.
