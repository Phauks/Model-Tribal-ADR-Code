notes: 'Indigo Book citation: Open Line (Bureau of Indian Affairs records 1969) (sound recording), National Archives Identifier 101908, RG 75, item 75-GENERALa-10. The National Archives describes it: "This audio recording includes discussions concerning Job Corps Centers, broadcast on KIKO Radio in Miami, Arizona. Participants in the program include Willard Shoecraft, owner-manager of KIKO; Clyde J. Stimpson, Center Director, San Carlos Job Corps Civilian Conservation Center, Globe, Arizona; R. G. Hensley, Education Specialist, Washington, D.C.; Rod Scurlock, Deputy Job Corps Coordinator, Washington, D.C.; and Zane Browning, Job Corps Coordinator, Phoenix, Arizona." Not digitized: the National Archives holds the recording at College Park, where it can be viewed or copied on request. Chosen as a federal Indian policy item (Job Corps on a radio call-in program (1969)) by scripts/law/national_archives_films.py; ceremony films and children''s recordings in the same series are left out (CARE principles). Not yet watched or heard in full by a person (Unverified).'
