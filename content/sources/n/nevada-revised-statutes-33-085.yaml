annotation: >-
  Nevada's full-faith-and-credit provision for domestic-violence protection orders
  issued by courts of other states, territories 'or Indian tribe[s],' including custody
  and support provisions in such orders, whether or not registered. It is consistent
  with the federal VAWA full-faith-and-credit rule, 18 U.S.C. § 2265 (not separately
  verified here). Added 2001; amended 2019. (project analysis) This matters for a
  Tribal ADR code because family mediation and peacemaking often run alongside protection
  orders. The code should say how Tribal protection orders interact with any mediated
  agreement.
