case_box:
  background: |-
    The Narragansett Indian Tribe set up the Narragansett Indian Wetuomuck Housing Authority in 1985 under a Tribal ordinance, and the Authority operates under federal housing regulations. It hired Ninigret Development, a Rhode Island company, to build a low-income housing project. When the Authority blamed faulty workmanship for problems with the water and sewer lines and Ninigret disputed it, the disagreement ended up in federal court [@ninigret-development-corporation-v-narragansett-indian-wetuomuck-housing-authority, pp. 25-26].
  question: |-
    Did a Tribal housing authority waive immunity through a contract clause sending disputes to the Tribal Council and then to a Tribal Court-appointed arbitration board, and must the contractor exhaust Tribal remedies?
  holding: |-
    The court held that the contract's explicit, mandatory dispute-resolution clause (read with the Tribal "sue and be sued" ordinance) waived the housing authority's immunity. But the Tribal exhaustion doctrine applied, so the Tribal forum must first interpret the forum-selection clause and its own jurisdiction. It vacated and remanded.
  quotes:
  - text: "... we believe that explicit language broadly relegating dispute resolution to arbitration constitutes a waiver of tribal sovereign immunity, whereas language that is ambiguous rather than definite, cryptic rather than explicit, or precatory rather than mandatory, usually will not achieve that end."
  - text: "The tribal exhaustion doctrine is not jurisdictional in nature, but, rather, is a product of comity and related considerations."
  topics:
  - "Dispute resolution and arbitration"
  - "Recognition of Tribal judgments (comity)"
  - "Sovereign immunity"
  - "Exhaustion of Tribal remedies"
  - "Tribal courts"
  reading:
    title: "*Ninigret Development Corp. v. Narragansett Indian Wetuomuck Housing Authority* (2000)"
    text: |-
      A clear test for when arbitration language waives immunity, applied to a tiered clause (Tribal Council, then a Tribal Court-appointed arbitration board, then federal court only by written agreement).
subjects: [sovereign-immunity, dispute-resolution]
