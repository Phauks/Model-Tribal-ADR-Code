annotation: >-
  This part makes mediation, or by agreement a referral to a dispute resolution program
  run by the state Real Estate Division, a condition before suit on claims about
  the governing documents and assessments of a common-interest community. Under NRS
  38.330 the parties pick from a Division-maintained mediator list, mediation must
  finish within 60 days of the claim, and sessions are capped at 3 hours unless extended.
  NRS 38.350 tolls the statute of limitations. (project analysis) This is an example
  of a 'mediate before you sue' gate tied to an agency roster, which is relevant
  to Tribal housing-authority or land-assignment disputes.
