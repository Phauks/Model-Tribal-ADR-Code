notes: 'Indigo Book citation: An Approach to Indian Offender Rehabilitation (U.S. Department of the Interior, Bureau of Indian Affairs n.d.) (motion picture), National Archives Identifier 12702, RG 75, item 75.27. The National Archives describes it: "DOCUMENTARY FILM: Shows implementation of Native American cultural awareness program at Federal Reformatory at El Reno, Oklahoma.  Interviews with prison administrators as well as Native American prisoners." Digitized by the National Archives; the project''s copy is its file, unchanged (154,739,931 bytes, SHA-256 ab8827c96c84aaac7cc1025b416a9b0dc1ba97579ef71f51cf27d00bf43613ae). The screen names its maker: "Bureau of Indian Affairs, Morris Thompson, Commissioner; Eugene F. Suarez, Sr., Chief, Division of Law Enforcement; Donald J. Morrow, Producer-Director". Thirty frames read across the film show a prison official, a discussion with Native inmates, an inmate group meeting and a powwow inside the institution. Chosen as a federal Indian policy item (the Bureau''s Division of Law Enforcement on Indian prisoners at El Reno) by scripts/law/national_archives_films.py; ceremony films and children''s recordings in the same series are left out (CARE principles). Not yet watched or heard in full by a person (Unverified).'
