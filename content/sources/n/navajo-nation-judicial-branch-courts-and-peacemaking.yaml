notes: >-
  Citations: Judicial Branch of the Navajo Nation, History of the Courts and Courts & Peacemaking in the
  Navajo Nation: A Public Guide, courts.navajo-nsn.gov (last visited Nov. 21, 2026). Also read: https://courts.navajo-nsn.gov/?p=88965,
  https://courts.navajo-nsn.gov/?p=90985. The courts.navajo-nsn.gov pages could not be fetched by curl
  (connection failure) and were read through the WebFetch tool, which returned the quoted sentences; re-check
  wording on the live pages. WARNING: the older domain navajocourts.org now serves unrelated content (an
  Indonesian-language blog), so do not cite it. The 'History of Peacemaking' page (?p=90985) returned
  only a frameset and was not read. On 2026-11-22 the lead author sent a browser screenshot of the Judicial
  Branch's Announcements page instead; it lists three Peacemaking Program items (Dec. 2 and Dec. 5, 2024: a
  Bi-Cultural Training Manager hired; the 2nd Annual Peacemaking Winter Conference, Dec. 18-19, 2024). The
  history text is still unread. Screenshot in the private captures (peacemaking/navajo-judicial-branch-announcements-2026-11-22.png). Navajo Nation Code title 7 (courts and peacemaking) was not opened.
