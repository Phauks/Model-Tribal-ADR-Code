annotation: >-
  Rules adopted by the Nevada Supreme Court under ADKT 435 (order of June 30, 2009,
  effective July 31, 2009), with the cover showing amendments through Oct. 31, 2025.
  They implement the owner-occupied residential foreclosure mediation required by
  NRS chapter 107 (NRS 107.086). The current Rule 1 limits the rules to defaults
  and documented hardships 'on or after December 2, 2016, and not sold prior to June
  12, 2017.' District courts assign mediators, and the AOC keeps the roster. A second
  source, the Nevada AOC's 'Foreclosure Mediator Program Overview' page, confirms
  that the AOC 'is responsible for appointing foreclosure mediators' and that 'This
  list will be used by Nevada's District Courts to assign mediators.' RSI's Nevada
  page says 'The state launched a foreclosure mediation program in July 2009.' (project
  analysis) This is mediation tied to a statutory condition on non-judicial sale,
  with a mandatory document-exchange step. It is classed as 'mediation' rather than
  a new method; the special features are captured in topics.
