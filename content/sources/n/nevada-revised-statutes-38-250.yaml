annotation: >-
  This is the statutory basis for Nevada's court-annexed ADR. NRS 38.250 (added 1991;
  most recently amended 2025) requires district-court civil damages actions arising
  in Nevada with no more than $100,000 per plaintiff in issue to go to nonbinding
  arbitration, unless the parties have agreed or are required to use another alternative
  method. Such agreements must be made at the time of the dispute, in writing, and
  knowingly and voluntarily, or they are void. NRS 38.253-38.255 direct the Supreme
  Court to adopt program rules and list case types that must be excluded. NRS 38.258
  authorizes 'settlement conferences and other alternative methods of resolving disputes,
  including, without limitation, mediation and a short trial.' NRS 38.249, added
  in 2025, defines 'short trial.' (project analysis) This is a compact model of a
  legislature delegating ADR program design to the high court, which fits Tribal
  systems where the court drafts procedural rules.
