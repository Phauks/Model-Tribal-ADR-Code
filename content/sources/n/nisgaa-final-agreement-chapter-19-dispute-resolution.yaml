annotation: >-
  The dispute chapter of the modern treaty among the Nisg̱a'a Nation, Canada and British Columbia. Its
  objectives include resolving disagreements "in a non-adversarial, collaborative, and informal atmosphere"
  (para. 3(d)). Disagreements not resolved informally move through stages (para. 12): collaborative negotiations
  (Appendix M-1); a facilitated process with "a neutral, who has no authority to resolve the dispute";
  then "final adjudication in arbitral proceedings ... or in judicial proceedings." The facilitated options
  are mediation, a technical advisory panel, neutral evaluation, an "elders advisory council under Appendix
  M-5," or another non-binding process, with mediation the default if parties cannot agree (para. 24).
  Parties must disclose information, send representatives with authority and "negotiate in good faith"
  (para. 26). Settlements bind only signing parties (para. 27). Arbitration is mandatory only where the
  Agreement says a matter will be "finally determined by arbitration" and otherwise needs all parties'
  written agreement (paras. 28-29); awards are "final and binding" (para. 33) and courts may review them
  only as Appendix M-6 allows (para. 36). (project analysis) A stepped clause that places an elders' council
  beside mediation and neutral evaluation as a recognized non-binding option, rather than inside them.
