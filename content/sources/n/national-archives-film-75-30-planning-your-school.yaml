notes: 'Indigo Book citation: Planning Your School (U.S. Department of the Interior, Bureau of Indian Affairs n.d.) (motion picture), National Archives Identifier 12705, RG 75, item 75.30. The National Archives describes it: "INSTRUCTIONAL: Shows steps required to build and finance a building.Takes a step-by-step approach to planning, design, construction and financing of Phoenix School. It also points out how cultural considerations should be included in planning and designing of schools." Not digitized: the National Archives holds the film at College Park, where it can be viewed or copied on request. Chosen as a federal Indian policy item (planning and financing a Bureau school) by scripts/law/national_archives_films.py; ceremony films and children''s recordings in the same series are left out (CARE principles). Not yet watched or heard in full by a person (Unverified).'
