annotation: >-
  Nevada's mandatory custody and visitation mediation statutes. NRS 3.475 covers
  counties of 700,000 or more (Clark) and NRS 3.500 covers counties of 100,000 to
  700,000 (Washoe), with smaller counties allowed to opt in. Each district court
  must set up the program by rule approved by the Supreme Court. Programs must let
  the court exclude cases for good cause, 'including' a history of child abuse or
  domestic violence. They must also set training, apprenticeship and continuing-education
  standards that 'must not be restricted to any particular professional or educational
  training,' bar the mediator from reporting anything except whether the dispute
  was resolved, and use sliding-scale fees. (project analysis) This is a very good
  statutory template for a Tribal family-mediation program. Note that the domestic-violence
  exclusion is discretionary ('authorize the court to exclude'), not mandatory.
