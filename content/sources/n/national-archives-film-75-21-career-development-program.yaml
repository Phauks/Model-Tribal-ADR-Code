notes: 'Indigo Book citation: Career Development Program (U.S. Department of the Interior, Bureau of Indian Affairs n.d.) (motion picture), National Archives Identifier 12697, RG 75, item 75.21. The National Archives describes it: "STATEMENT: Gives brief history of this Native American population''s economic plight. Elders of the reservation tell how hard it is to get a job without a proper education. To help this situation, Bureau of Indian Affairs offer assistance by having a Career Development Center on reservation site. Center offers Adult Education, Vocational Classes, Job Placement Counseling and more." Not digitized: the National Archives holds the film at College Park, where it can be viewed or copied on request. Chosen as a federal Indian policy item (a Bureau career development center) by scripts/law/national_archives_films.py; ceremony films and children''s recordings in the same series are left out (CARE principles). Not yet watched or heard in full by a person (Unverified).'
