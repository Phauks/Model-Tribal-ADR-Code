annotation: >-
  The CNMI Supreme Court enforced an arbitration agreement even though "There is
  no specific law, statute or custom, in the CNMI governing arbitration" (¶ 15).
  Under the rule of decision in 7 CMC § 3401, it applied U.S. common law and Restatement
  (Second) of Conflict of Laws § 218 "In the absence of written or local customary
  law" (¶¶ 15-16). It noted the CNMI "has no law prohibiting arbitration either"
  (¶ 22) and that the government itself uses arbitration and mediation with its employees
  (1 CMC §§ 9708-9709). It also relied on former 7 GCA § 42101 (Guam law, later repealed)
  (¶ 29). (project analysis) This is a useful model for how a court without an arbitration
  statute can enforce agreements through common law. The rule-of-decision hierarchy
  of written law, then local customary law, then common law parallels Tribal-court
  choice-of-law clauses. As of this 2002 decision there was no CNMI arbitration statute;
  later enactments were not found but should be checked.
