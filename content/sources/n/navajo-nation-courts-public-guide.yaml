notes: 'The page says it was revised February 23, 2021. It describes a two-level system: trial courts (district courts and family courts) and the Navajo Nation Supreme Court, which hears appeals of final decisions of the trial courts. The site refused scripted requests from the project on Nov. 22, 2026; the page was read through a web-fetch tool.'
