annotation: >-
  Part of NRS chapter 233A ('Indian Affairs'). The 2023 Legislature created the Department
  of Native American Affairs (NRS 233A.1003) and placed the Nevada Indian Commission
  (created 1965) within it (NRS 233A.1005). NRS 233A.260 (added 2019, amended 2023)
  requires a policy promoting 'positive government-to-government relations,' Tribal
  liaisons in agencies that deal with Tribes regularly, and a defined path for resolving
  issues a Tribe raises about an agency 'policy, agreement or program.' NRS 233A.270
  adds an annual state-Tribal summit with the Governor. NRS 233A.003 declares that
  nothing in the chapter 'is intended to infringe upon the sovereignty of Indian
  tribes.' (project analysis) This is a statutory, non-court state-Tribal issue-resolution
  channel, a governmental process that fits none of the listed ADR methods (see new_methods).
