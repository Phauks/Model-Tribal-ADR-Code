notes: 'Every county and county-level area of the colonies and the United States from March 4, 1629 to December 31, 2000 (17,727 shapes), each with the day it began and ended, the change that made it and the source the Atlas cites for that change; 1,160 shapes began before September 3, 1783. The Library leaves out the large, vaguely bounded areas of western Virginia, New York and New England in much of the seventeenth century, and areas under foreign governments, among them Spanish Texas and Florida and British Florida. A colonial county was a colony''s claim of jurisdiction over land Native nations held, not settled or empty land. Kept as the Library''s zip file in the project''s bucket under historic-maps/newberry-counties/ (site/tools/collect-historic-maps.mjs). Not drawn on the website''s map yet.'
