notes: 'Indigo Book citation: New Directions in Indian Education (Bureau of Indian Affairs records 1973) (motion picture), National Archives Identifier 12689, RG 75, item 75.12. The National Archives describes it: "DOCUMENTARY: James Hawkins introduces CHOICE program which was developed by Bureau of Indian Affairs. CHOICE has ten key points which outline parental involvement in childrens education. CHOICE''s main subject headings are Educational System Options and CHOICE Process." Not digitized: the National Archives holds the film at College Park, where it can be viewed or copied on request. Chosen as a federal Indian policy item (the Bureau''s CHOICE education program, presented by an official (1973)) by scripts/law/national_archives_films.py; ceremony films and children''s recordings in the same series are left out (CARE principles). Not yet watched or heard in full by a person (Unverified).'
