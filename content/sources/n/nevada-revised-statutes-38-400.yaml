annotation: >-
  Nevada's enactment of the Uniform Collaborative Law Act (added by Stats. 2011,
  p. 184). It includes the participation-agreement requirements, the disqualification
  rule and its low-income and government-party exceptions (NRS 38.515, 38.520), screening
  for coercive or violent relationships (NRS 38.540), and the privilege (NRS 38.550-38.560).
  (project analysis) This confirms that Nevada adopted the ULC collaborative-law
  text but not the ULC mediation text.
