notes: 'Indigo Book citation: People of the Pueblos (U.S. Department of the Interior, Bureau of Indian Affairs 1951) (motion picture), National Archives Identifier 12704, RG 75, item 75.29. The National Archives describes it: "DOCUMENTARY: Gives brief history of Pueblo Indians. Shows problems faced by this generation and how the Bureau of Indians Affairs is helping." Not digitized: the National Archives holds the film at College Park, where it can be viewed or copied on request. It may show Pueblo dances; before any copy is shown, the Pueblos filmed are asked. Chosen as a federal Indian policy item (the Bureau''s work in the Pueblos (1951); may show Pueblo dances) by scripts/law/national_archives_films.py; ceremony films and children''s recordings in the same series are left out (CARE principles). Not yet watched or heard in full by a person (Unverified).'
