notes: >-
  Read through a page-fetch helper on 2026-11-21, then checked against the PDF Trevor Goldsmith downloaded
  on 2026-11-22 (marked "Updated: October 2025"; file modified March 2026). The brochure lists fees for
  services (yeel) at a "Predetermined Rate of $80.00, or as negotiated by Naałchidí and
  Peacemaker"; referrals come from courts, schools and agencies (Division of Social Services, prosecutors,
  probation and others); individuals must request services in person, though telephone inquiries are
  allowed; and matters that need a court order must also be filed in court. A 2017 edition of the
  brochure is filed as peacemaking/navajo-peacemaking-program-brochure-2017.pdf.
