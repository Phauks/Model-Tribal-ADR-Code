annotation: A law-firm alert on Oklahoma and New Mexico high-court decisions, and a federal ruling, on whether state courts may hear tort claims arising at tribal casinos. It concludes that forum-selection and dispute-resolution clauses in tribal agreements must be clear and express. Relevant to tribal dispute resolution drafting because it shows how compacts, sovereign immunity and arbitration terms determine where casino injury claims are heard. (project analysis)
