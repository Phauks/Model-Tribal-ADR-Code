annotation: >-
  Nevada's general mediation-confidentiality provision in its evidence code, added
  in 1991 and amended in 1993 (source note), well before the UMA. It treats a mediation
  session as settlement negotiations, bars admission and discovery of statements
  'not otherwise discoverable or obtainable,' and shields the mediator from civil
  process. (project analysis) Its existence, together with the absence of any UMA
  text in NRS, supports the conclusion that Nevada has NOT adopted the Uniform Mediation
  Act. It is also a useful contrast for a Tribal drafter: a three-subsection rule
  versus the UMA's privilege-holder and exception structure.
