notes: Report to the Navajo Nation Council, Spring Session 2026. Peacemaking Program narrative at 8 says
  the program received 65 cases in the quarter (14 Peacemaking, 44 Life Value Engagement, 5 Dine Family
  Group Conferencing, 2 Probate/Quiet Title; 56 referred, 9 walk-ins) and that 15 peacemakers were oriented
  and trained on Jan. 29-30, 2026. The statistics page at 9 reports 129 new filed cases, 80 closed, 102
  pending and 62 percent clearance. The two counts differ and the report does not explain why (project
  analysis). Downloaded directly and checked against the PDF text on 2026-11-21.
