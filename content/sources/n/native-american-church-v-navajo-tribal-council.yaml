case_box:
  background: |-
    The Navajo Tribal Council adopted an ordinance making it an offense to bring peyote into the Navajo country or to sell, use or possess it there. The Native American Church of North America, whose members use peyote in their ceremonies, and several members sued the Council and its chairman in federal court, claiming the ordinance violated the First, Fourth and Fifth Amendments. The district court dismissed the claim [@native-american-church-v-navajo-tribal-council, p. 132].
  question: |-
    Do federal courts have jurisdiction to hear a First Amendment challenge to a Navajo Tribal Council ordinance prohibiting peyote on the reservation?
  holding: |-
    No. The court held that the First Amendment does not bind Native nations because no constitutional provision or act of Congress makes it applicable to them. The federal courts therefore lacked jurisdiction over the challenge to the Navajo ordinance, and the dismissal was affirmed.
  quotes:
  - text: "Indian tribes are not states. They have a status higher than that of states."
  - text: "No provision in the Constitution makes the First Amendment applicable to Indian nations nor is there any law of Congress doing so."
  treatment: |-
    Congress later imposed free-exercise and other protections on Tribal governments by statute in the Indian Civil Rights Act of 1968, 25 U.S.C. § 1302 [@indian-civil-rights-act-1968]; *Santa Clara Pueblo v. Martinez* (1978) describes that Act as responding to the *Talton* line of cases [@santa-clara-pueblo-v-martinez].
  topics:
  - "Tribal courts"
  reading:
    title: "*Native American Church v. Navajo Tribal Council* (1959)"
    text: |-
      Confirms that federal constitutional limits do not apply directly to Tribal governments, so procedural guarantees in Tribal courts come from the Indian Civil Rights Act and each nation's own law.
