annotation: >-
  The Short Trial Rules were adopted June 7, 2000 (effective July 6, 2000), readopted
  with amendments by order of December 22, 2004 (effective January 1, 2005), and
  amended through March 12, 2026. The program is mandatory in districts with mandatory
  court-annexed arbitration. A case enters it when a party requests trial de novo
  after arbitration, or by stipulation instead of arbitration. Juries have four members
  by default (six, or eight for good cause), each side gets 3.5 hours, and judgments
  are capped at $100,000 per plaintiff unless the parties stipulate otherwise. The
  statute lists the short trial among 'alternative methods of resolving disputes'
  (NRS 38.258), and NMR 9 sends unresolved mediations to the short trial program.
  (project analysis) It is an adjudicative, binding jury trial, not an advisory summary
  jury trial, so it is proposed as a new method ('short-trial').
