annotation: >-
  The CNMI's mandatory court-annexed ADR rules, effective Dec. 13, 2021, adopted
  under NMI Const. art. IV, § 9. They repeal the 2015 Rules for Mandatory Alternative
  Dispute Resolution and the 2001 court-appointed mediator rules (Rule 32(a)). They
  "apply to all civil actions except small claims actions and family law matters"
  (Rule 1(c)(1)). Civil actions pending in the Superior Court after Jan. 1, 2015
  "shall be ordered to non-binding mediation" absent good cause (Rule 3). A "mandatory
  settlement conference" is a mediation conducted by a Superior Court judge or judge
  pro tem, at no fee (Rule 16(c)). Parties may instead use binding or non-binding
  arbitration or neutral case evaluation (Rule 30). Mediation is confidential (Rule
  23). (project analysis) Among the five territories, this is the clearest example
  of presumptively mandatory mediation for civil cases.
