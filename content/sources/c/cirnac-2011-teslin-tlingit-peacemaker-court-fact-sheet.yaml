annotation: The Administration of Justice Agreement came into effect June 30, 2011, under s. 13.3.17 of
  the 1995 Self-Government Agreement. The Peacemaker Court will "resolve disputes and adjudicate violations
  under Teslin Tlingit law in accordance with Teslin Tlingit principles and values," hear "all matters
  arising under Teslin Tlingit law" (adoption, wills, settlement land, wildlife and others) but not criminal
  law, and operate "in accordance with principles of judicial independence, impartiality and fairness";
  the Charter applies and appeals go to the Supreme Court of Yukon. "Stage One is a consent-based dispute
  resolution process. Stage Two will provide adjudication and appeal services," with Stage Two suspended
  for about four years while peacemakers develop the skills. (project analysis) A staged, consent-first
  design with a phased start.
