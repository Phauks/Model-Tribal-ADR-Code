notes: >-
  Citations: Const. of the Cherokee Nation art. V, § 1 (1827), printed in Cherokee Phoenix, vol. 1, no.
  2 (Feb. 28, 1828). Also read: https://www.wcu.edu/library/DigitalCollections/CherokeePhoenix/Vol1/no01/constitution-of-the-cherokee-nation-page-1-column-2a-page-2-column-3a.html.
  Later history: Succeeded by the 1839 constitution in Indian Territory; Cherokee courts were abolished
  by the Curtis Act (1898) and rebuilt under the 1975 and 1999 constitutions (Cherokee Nation courts history
  page). The exact adoption date (July 26, 1827) is from general knowledge; the source page says only
  'July 1827'. The transcription is by Western Carolina University's digital Cherokee Phoenix project.
