annotation: >-
  An essay by a UPR-Cayey business professor arguing that mediation is underused
  in Puerto Rico despite Ley 19-1983, which "autorizó el establecimiento de foros
  informales para la solución de disputas" [authorized informal forums for dispute
  resolution] (p. 52). He blames low public and professional awareness, no uniform
  referral system, no follow-up on compliance with agreements, and public distrust.
  He recommends mandatory orientation, referral mechanisms, compliance monitoring
  and required ADR courses in law schools. (project analysis) It is useful for a
  commentary note on why authorizing ADR is not enough without referral and follow-through.
  Ceiba is a university journal, not a law review.
