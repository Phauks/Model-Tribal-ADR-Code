annotation: >-
  In the joint Interior/HHS ISDEAA regulations (25 C.F.R. part 900, subpart N, post-award
  contract disputes), § 900.217 answers "No" to whether a Contract Disputes Act claim
  is the only option: the awarding official "should consider using informal discussions
  between the parties, assisted by individuals who have not substantially participated
  in the matter," and the parties may use ADR under the ADRA "or the options listed
  in section 108(1)(b)(12) of the Indian Self-Determination Act" (evidently the model-agreement
  disputes clause, 25 U.S.C. § 5329(c) § 1(b)(12)). Section 900.216 lists the CDA,
  CBCA rules, and EAJA as also applicable (61 Fed. Reg. 32501 (1996), as amended
  75 Fed. Reg. 31701 (2010)). Text read through the eCFR versioner API (current as
  of 2026-11-19). (project analysis) Shows the regulatory pathway for Tribes to invoke
  ADR (including Tribal forums) in federal contract disputes; the model code should
  give Tribal negotiators a ready process to point to.
