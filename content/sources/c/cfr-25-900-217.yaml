  note: >-
    Westlaw's text (current through 91 Fed. Reg. 74130, Nov. 18, 2026), pulled by the
    lead author on 2026-11-20, also prints "108(1)(b)(12)", so quote it exactly as
    printed. It also cites the Administrative Dispute Resolution Act as "5 U.S.C. 581
    et seq."; (project analysis) the Act is now codified at 5 U.S.C. 571 et seq., so
    quote that as printed too. The copy is kept privately for the project and is not redistributed.
