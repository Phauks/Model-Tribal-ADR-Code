annotation: 'Section 18(2): the authority to administer and enforce Indigenous laws on child and family
  services "includes the authority to provide for dispute resolution mechanisms." Section 20(5): "a dispute
  resolution mechanism provided for by the regulations made under section 32 may be used to promote entering
  into a coordination agreement." Upheld in Reference re An Act respecting First Nations, Inuit and Métis
  children, youth and families, 2024 SCC 5 (not read).'
