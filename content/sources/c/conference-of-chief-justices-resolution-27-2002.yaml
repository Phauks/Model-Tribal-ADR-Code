annotation: >-
  A resolution adopted August 1, 2002 at the CCJ's 54th Annual Meeting in Rockport,
  Maine. It endorses three principles for Tribal, state and federal courts, including
  that they 'should take steps to increase the cross-recognition of judgments.' It
  commits the Conference to 'Support the development of tribal/state/federal court
  forums.' The recitals credit an SJI-funded project, 'Tribal Courts and State Courts:
  The Prevention and Resolution of Jurisdictional Disputes,' with forums in Washington,
  Oklahoma, Arizona, Michigan, North Dakota and South Dakota. (project analysis)
  This is the national judicial-policy anchor for Tribal-state forums and recognition
  rules. Later CCJ resolutions on Tribal-state collaboration (e.g. on opioids and
  on protecting children) appear on the same site but were not opened.
