notes: 25 C.F.R. § 293.27 (2026). Sets the Department's presumption that tribal payments beyond a regulatory-cost
  assessment are a prohibited tax, fee, charge or assessment; approval requires documentation of specific meaningful
  concessions, substantial economic benefit, and that the Tribe is the primary beneficiary. Read in the eCFR (point-in-time
  text of 2026-11-01).
