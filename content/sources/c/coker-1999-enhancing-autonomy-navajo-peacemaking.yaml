annotation: 'Abstract read: an empirical study of Navajo peacemaking in cases involving domestic violence.
  It reports that peacemaking may enhance some battered women''s autonomy, and also that ''some women
  are coerced into participation, agreements are difficult to enforce,'' and some peacemakers show a pro-marriage
  bias. Full text not read.'
