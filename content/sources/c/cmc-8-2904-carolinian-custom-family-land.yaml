annotation: >-
  Codifies Carolinian (Refaluwasch) custom on family land. A customary trustee holds
  the land, and on the trustee's death title passes in a statutory order beginning
  with the oldest surviving sister (subsec. (a)(1)-(5)). All members share use rights
  (subsec. (b)). Absent family agreement, the trustee may not sell, lease, mortgage
  or partition (subsec. (c)). The family can vary the rules by consent: "Unless the
  family consents or agrees otherwise." If no one qualifies and the family members
  with use rights cannot agree on a trustee, the court selects one according to "the
  customs of the Carolinian people" (subsec. (a)(6)). (project analysis) This is
  not an ADR process. It is a statutory hierarchy that puts family consensus first
  and leaves custom-guided court decision as the fallback, which is useful for a
  model code's interface between custom and courts. The statute uses the English
  term 'Carolinian'; Refaluwasch is the community's own name.
