notes: 'Read on Cornell LII on Nov. 22, 2026, with §§ 83.3 and 83.4. "Continental United States" means "the contiguous 48 states and Alaska," and "Indigenous" means native to the continental United States, so peoples of the territories and Hawaiʻi fall outside part 83 by definition. Source line: 80 Fed. Reg. 37887 (July 1, 2015), as amended at 90 Fed. Reg. 3643 (Jan. 15, 2025).'
