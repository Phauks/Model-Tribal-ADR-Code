notes: The official code site serves Title 5 as a PDF. Section 5-103.7(2) gives the Supreme Court the duty to hear appeals from the District Court, and section 5-207.4(A) says appeals from the District Court to the Supreme Court follow Title 5, Chapter 1, Article B.
