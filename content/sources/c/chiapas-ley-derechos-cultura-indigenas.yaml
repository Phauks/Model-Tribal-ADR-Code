annotation: Traditional authorities are auxiliaries of the administration of justice (art. 6); customs are the basis
  for resolving disputes unless they violate human rights (art. 11). The high court is to establish Juzgados de
  Paz y Conciliación Indígenas, proceeding by "oralidad, conciliación, inmediatez, sencillez y pronta resolución"
  (art. 12); jurisdiction only where both parties are Indigenous (art. 14); community work may replace prison for
  non-serious crimes after reparation (art. 16); appeals check that Indigenous rights were respected (art. 19).
