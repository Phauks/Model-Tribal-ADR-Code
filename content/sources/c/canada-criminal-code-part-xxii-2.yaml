annotation: Added in 2026, replacing the old alternative measures section (s. 717, "[Repealed, 2026, c.
  19, s. 61]"). Defines restorative justice as "an approach to justice that seeks to repair the harm caused
  by an offence to individuals and their relationships" (s. 715.44). Measures must give "particular attention
  to the needs of Aboriginal persons and Black persons" (s. 715.46(d)). Restorative processes are voluntary
  and participants "may freely withdraw from the restorative justice process at any time" (s. 715.53(b));
  they may be used "at any stage" and may take the form of "a mediation or dialogue between the victim
  and the person alleged to have committed an offence or the offender, a restorative conference or a sentencing
  circle" (s. 715.54). Alternative measures need acceptance of responsibility and advice on counsel and
  are barred if the person denies involvement or asks for court (ss. 715.49-715.5). Judges and others
  may convene conferences (s. 715.55).
