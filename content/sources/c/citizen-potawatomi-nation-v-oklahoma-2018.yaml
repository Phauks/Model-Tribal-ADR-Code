annotation: >-
  Part 12 of Oklahoma's model gaming compact sends compact disputes to arbitration and lets either party
  "bring an action against the other in a federal district court for the de novo review of any arbitration
  award" (Part 12(3), quoted at 4). Because Hall Street Associates v. Mattel holds that parties cannot
  contract for broader review than 9 U.S.C. §§ 10-11 allow, the court held the de novo review clause invalid;
  and because it found de novo review "a material aspect of the parties' agreement to engage in binding
  arbitration," it held the obligation to arbitrate unenforceable and remanded with instructions to vacate
  the Nation's award (slip op. at 2-3, 30-31). Certiorari was denied, 139 S. Ct. 375 (2018). (project
  analysis) The leading warning for intergovernmental drafting: a negotiated appeal route that the governing
  arbitration statute does not allow can take the whole arbitration clause down with it.
