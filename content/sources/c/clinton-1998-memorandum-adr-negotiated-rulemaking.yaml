annotation: >-
  Presidential memorandum of May 1, 1998 (Public Papers 1998, Book I, pp. 663–664)
  directing each federal agency to "promote greater use of mediation, arbitration,
  early neutral evaluation, agency ombuds, and other alternative dispute resolution
  techniques" and negotiated rulemaking. Acting under 5 U.S.C. §§ 569(a) and 573(c),
  it designates an Alternative Dispute Resolution Working Group convened by the Attorney
  General as the interagency ADR committee, with tasks including program development,
  training, expedited access to neutrals, and recordkeeping; it designates the Regulatory
  Working Group under E.O. 12866 for negotiated rulemaking. (project analysis) The
  founding document of the Interagency ADR Working Group and a model for an executive
  directive a Tribal chair or council could issue to Tribal departments.
