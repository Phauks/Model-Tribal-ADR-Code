annotation: 'States that "all modern treaties now include some form of dispute resolution process" and
  that "[s]ince 1999, agreements have generally included a staged approach to resolving implementation-related
  disputes": "(a) informal discussions; (b) assisted or facilitated negotiations, including mediation;
  and (c) arbitration." The guide gives only the Government of Canada''s view and does not interpret any
  treaty.'
