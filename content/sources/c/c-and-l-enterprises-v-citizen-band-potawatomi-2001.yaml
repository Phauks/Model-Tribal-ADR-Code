annotation: >-
  C & L Enterprises, 532 U.S. 411 (decided Apr. 30, 2001), held that "by the clear
  import of the arbitration clause, the Tribe is amenable to a state-court suit to
  enforce an arbitral award" (532 U.S. at 414, 121 S. Ct. at 1592). The building
  was commercial and the land "off-reservation, nontrust property" (id.). The Court
  restated that "to relinquish its immunity, a tribe's waiver must be 'clear'" (id.
  at 418, 121 S. Ct. at 1594, citing Oklahoma Tax Comm'n v. Citizen Band Potawatomi,
  498 U.S. 505, 509 (1991)). It found the waiver in the Tribe's own form contract:
  an arbitration clause, American Arbitration Association rules under which an award
  "may be entered in any federal or state court having jurisdiction thereof" (id.
  at 419), and a choice of Oklahoma law, which had adopted the Uniform Arbitration
  Act (id. at 419-20). (project analysis) This is the key intersection case for
  the project: a model Tribal ADR code and its commentary should tell Tribal contracting
  officers that agreeing to arbitration plus a court-enforcement clause can itself
  be a waiver, and should offer model clauses that state the scope of any waiver
  and the enforcing forum (e.g., Tribal court) expressly.
