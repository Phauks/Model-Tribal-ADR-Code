annotation: >-
  C & L Enterprises, 532 U.S. 411 (decided Apr. 30, 2001), held that a Tribe waived
  its sovereign immunity from a state-court suit to enforce an arbitral award by
  agreeing to a standard form construction contract with an arbitration clause, AAA
  rules allowing judgment "in any federal or state court having jurisdiction," and
  an Oklahoma choice-of-law clause (Oklahoma had adopted a Uniform Arbitration Act).
  The syllabus restates the rule that a Tribe's waiver must be "clear" (citing Oklahoma
  Tax Comm'n v. Citizen Band Potawatomi, 498 U.S. 505) and finds the waiver clear
  here; the contract concerned off-reservation, non-trust land (syllabus). (project
  analysis) This is the key intersection case for the project: a model Tribal ADR
  code and its commentary should tell Tribal contracting officers that agreeing to
  arbitration plus a court-enforcement clause can itself be a waiver, and should
  offer model clauses that state the scope of any waiver and the enforcing forum
  (e.g., Tribal court) expressly.
