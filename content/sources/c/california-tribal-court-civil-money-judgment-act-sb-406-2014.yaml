annotation: >-
  The chaptered text of SB 406 (Stats. 2014, ch. 243, approved August 22, 2014).
  It added Code of Civil Procedure title 11, chapter 3 ('Tribal Court Civil Money
  Judgment Act'), which governs how superior courts recognize and enter 'tribal court
  money judgments of any federally recognized Indian tribe.' It also sets an objection
  window and mandatory and discretionary grounds for refusal. As chaptered, CCP §
  1742 sunset the title on January 1, 2018. The Act was still in force in 2023, when
  AB 1139 amended § 1731 to cover Tribal tax judgments, so a later act must have
  changed the sunset (not identified). (project analysis) This is a statutory alternative
  to a court rule. A Tribal drafter should note the 'impartial tribunals or procedures'
  ground for refusal, which a Tribal ADR code's due-process provisions should be
  written to satisfy.
