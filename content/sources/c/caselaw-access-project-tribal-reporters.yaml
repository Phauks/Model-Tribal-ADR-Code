  basis_note: >-
    Court opinions are the work of judges acting in their official role, which the government edicts doctrine keeps out of copyright (Georgia v. Public.Resource.Org, Inc., 590 U.S. 255 (2020)), and the Library Innovation Lab released this data without restriction in March 2024 with the publisher's headnotes removed. Whether the doctrine reaches tribal courts is unsettled; the site serves the opinions under decision record 0047 and takes a copy down when a nation asks (project analysis, not legal advice).
