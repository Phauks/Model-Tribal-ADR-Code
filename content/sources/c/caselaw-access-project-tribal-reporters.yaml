notes: >-
  2,368 opinions of tribal courts, 1969 to 2017, indexed in research/tribal-court-opinions/ by scripts/caselaw/tribal_court_opinions.py. Each opinion is served as its own page at /copies/caselaw-access-project/<reporter>/<volume>/<case>.html. Release: Harvard Library Innovation Lab, Transitions for the Caselaw Access Project (Mar. 26, 2024), https://lil.law.harvard.edu/blog/2024/03/26/transitions-for-the-caselaw-access-project.
