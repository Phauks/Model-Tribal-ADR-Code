annotation: >-
  The leading U.S. mediation-law treatise, updated annually. The Thomson Reuters
  store lists the 2025-2026 edition, by Craig A. McEwen, James R. Coben, Nadja M.
  Alexander, Nancy Hardin Rogers, Peter N. Thompson, and Sarah Rudolph Cole. It covers
  'mediation law developments, cases, statutes, and the mediation process itself',
  identifies relevant cases and statutes in each state, and discusses confidentiality,
  conflicts of interest, and advertising. It is on Westlaw: Georgetown Law Library's
  ADR treatise guide links it to the Westlaw database identifier 'MEDIATION'. (project
  analysis) This should be the first stop for state-by-state comparisons when drafting
  Tribal confidentiality and privilege provisions.
