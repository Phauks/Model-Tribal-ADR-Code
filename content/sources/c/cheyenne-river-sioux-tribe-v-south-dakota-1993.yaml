notes: 'Cheyenne River Sioux Tribe v. South Dakota, 3 F.3d 273 (8th Cir. 1993). Per a fetch-tool excerpt of the
  Justia page, the court affirmed denial of the tribe''s summary judgment and preliminary injunction, held the action
  not barred by the Eleventh Amendment, and stated that IGRA does not require a State to negotiate over forms of
  gaming it does not permit. District decision: 830 F. Supp. 523 (D.S.D. 1993). Read on the original link through
  a page-fetch tool only; holding not checked word for word. Citator check (KeyCite) pending; see the project''s
  Westlaw list.'
