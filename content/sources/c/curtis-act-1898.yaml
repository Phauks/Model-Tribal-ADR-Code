notes: >-
  Citations: Act of June 28, 1898, ch. 517, 30 Stat. 495. Also read: https://www.cherokeecourts.org/History.
  Later history: Tribal courts of the affected nations were later re-established under tribal law (e.g.,
  the Cherokee Nation's Judicial Appeals Tribunal under its 1975 Constitution and its District Court by
  legislative act in 1991, per the Cherokee Nation courts history page). The OCR breaks off after the
  first line of § 28, so the rest of the section is not quoted. The statute applies to Indian Territory
  generally and the nations list is editorial; confirm each nation's current self-name on its own website.
  The Cherokee page's use of 'Cherokee’s' is quoted as written.
law_box:
  summary: |-
    Extended allotment to Indian Territory and provided that "all tribal courts in Indian Territory shall be abolished" [@curtis-act-1898, sec. 28]. The Cherokee Nation's judiciary describes the Act as having "abolished all tribal courts in Indian Territory, and took away the authority of court officials" [@cherokee-nation-judicial-branch-history].
subjects: [tribal-courts, land, government]
