annotation: Section 2(1) defines "Indian" as "a person who pursuant to this Act is registered as an Indian
  or is entitled to be registered as an Indian," a "band" as "a body of Indians" for whom reserve land
  or money is held or that the Governor in Council declares a band, and the "council of the band," in
  the residual case, as "the council chosen according to the custom of the band." A band may take control
  of its membership and "provide for a mechanism for reviewing decisions on membership" (s. 10(2)(b)).
  Protests about registration go to the Registrar, whose decision "is final and conclusive" (s. 14.2(7)),
  with appeal to a provincial superior court (s. 14.3). Band councils may make by-laws "not inconsistent
  with this Act" (s. 81(1)). (project analysis) Status is statutory and federally decided, unlike United
  States Tribal membership.
