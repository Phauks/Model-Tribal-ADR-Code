notes: >-
  Full citation: 30 U.S. (5 Pet.) 1 (1831). Official report scan:
  https://tile.loc.gov/storage-services/service/ll/usrep/usrep030/usrep030001/usrep030001.pdf. Opinions:
  Marshall, C.J., for the Court; separate opinions by Johnson, J., and Baldwin, J.; Thompson, J.,
  dissenting, with Story, J., concurring in the dissent. The report does not mention Duvall, J., so the
  vote count is not confirmed. Decision date verified Nov. 22, 2026: Mar. 18, 1831 (argued Mar. 12 and 14, 1831), per the Supreme Court Library's table of decision dates, which takes dates from the Court's Engrossed Minutes (source key supreme-court-library-dates-of-decisions-1791-1882). The report and Westlaw print only the term. Write-up of the Westlaw pull:
  research/pull-results/2026-11-21-legal-history-confirm-first-cases.md in the project's working files;
  the lead author's copy is kept privately and is not redistributed.
