notes: >-
  Full citation: 30 U.S. (5 Pet.) 1 (1831). Official report scan:
  https://tile.loc.gov/storage-services/service/ll/usrep/usrep030/usrep030001/usrep030001.pdf. Opinions:
  Marshall, C.J., for the Court; separate opinions by Johnson, J., and Baldwin, J.; Thompson, J.,
  dissenting, with Story, J., concurring in the dissent. The report does not mention Duvall, J., so the
  vote count is not confirmed. Not yet verified: the decision date. The report and Westlaw print only
  "January Term, 1831" (Westlaw's January 1 is a placeholder for the term); March 18, 1831 is from general
  knowledge. Write-up of the Westlaw pull:
