annotation: >-
  Rule 10.60, adopted effective October 25, 2013, makes California's Tribal Court–State
  Court Forum a Judicial Council advisory body. Its focus is proceedings where state
  and Tribal jurisdiction overlap. It is directed to make recommendations on recognition
  of orders across jurisdictional lines and to share 'local rules of court, protocols,
  standing orders, and other agreements.' The Judicial Council comment recognizes
  that 'Traditional tribal justice practices are essential to the maintenance of
  the culture and identity of tribes' and limits Council oversight to the forum,
  not any Tribe or Tribal court. The Forum's own page (https://courts.ca.gov/3065.htm)
  says it was created in May 2010 after a December 2009 meeting and describes it
  as 'the coming together of tribal court and state court leaders as equal partners
  to address areas of mutual concern.' (project analysis) This is the most formalized
  Tribal-state forum model, and it produced the Tribal Court Civil Money Judgment
  Act.
