annotation: >-
  Blue Clark's entry on Lone Wolf v. Hitchcock for the Oklahoma Historical Society. It names Lone Wolf as a "Kiowa leader" who sued Secretary of the Interior Ethan Allen Hitchcock to halt the allotment of the Kiowa, Comanche, and Apache Reservation. (project analysis) The source for Lone Wolf's nation on his biography page; the official report names him only as a member of the confederated tribes.
