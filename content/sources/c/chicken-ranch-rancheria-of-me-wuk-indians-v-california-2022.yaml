notes: Chicken Ranch Rancheria of Me-Wuk Indians v. California, 42 F.4th 1024 (9th Cir. 2022). The court affirmed
  on different grounds, holding that when a State negotiates for compact provisions well outside IGRA's listed subjects
  it has not acted in good faith, and directed the parties to IGRA's remedial process. It explained that the "meaningful
  concessions" framework applies only to demands for taxes, fees or other revenue sharing. Read on the original
  link. Citator check (KeyCite) pending; see the project's Westlaw list.
