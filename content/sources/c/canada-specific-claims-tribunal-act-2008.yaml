annotation: >-
  Establishes the Specific Claims Tribunal, "the mandate of which is to decide issues of validity and
  compensation relating to specific claims of First Nations" (s 3). Members come from a roster of 6 to
  18 superior court judges (s 6(2)). A First Nation may file only after the claim was filed with the Minister
  and the Minister declined to negotiate, three years passed without a decision, the Minister consented,
  or three years of negotiation produced no settlement (s 16(1)). The Tribunal's rules may cover case
  management "and the use of mediation" (s 12(1)(h)). Compensation is monetary only and capped at $150
  million (s 20(1)(a)-(b)). Decisions are subject to judicial review under s 28 of the Federal Courts
  Act (s 34(1)) but otherwise "final and conclusive between the parties" (s 34(2)), and a decision releases
  the Crown from the claim (s 35). (project analysis) A negotiation-first, adjudication-second design
  with a neutral bench, limited remedies and a single review route; it shows how a government can pair
  a duty to negotiate with an independent binding forum.
