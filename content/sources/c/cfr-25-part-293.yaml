notes: 25 C.F.R. pt. 293 (2026). Part 293 defines "meaningful concession" (something of value, directly related
  to gaming, carrying out IGRA, and not a subject the State must negotiate) and "substantial economic benefit";
  section 293.28 says refusing a long-term compact or a one-year extension may be evidence of an IGRA violation.
