annotation: >-
  Clark County's civil self-help center explains how people without a lawyer can use AI tools
  safely: ask detailed questions, check every source, use AI to learn rather than decide, never
  file AI-generated text without reviewing it, and keep private details out because tools "may
  store what you type." It says AI "cannot give legal advice," "may give wrong answers," and
  "Sometimes it makes up cases or laws," and that judges can fine or sanction filings that use
  made-up law. (project analysis) The model for the site's "Using AI with Tribal Law" page.
