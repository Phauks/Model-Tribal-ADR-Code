annotation: >-
  The article that sets out the CARE Principles (Collective benefit, Authority to control,
  Responsibility, Ethics), which the project's charter adopts. It names the tension Indigenous
  communities feel between "protecting Indigenous rights and interests in Indigenous data
  (including traditional knowledges)" and "supporting open data, machine learning, broad data
  sharing, and big data initiatives," and holds that "Indigenous Peoples must be the ones to
  determine data governance protocols."
