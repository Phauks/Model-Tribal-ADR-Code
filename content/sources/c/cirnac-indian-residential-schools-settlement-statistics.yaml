annotation: 'Independent Assessment Process, Sept. 19, 2007 to Mar. 31, 2019: 38,257 applications; 38,178
  claims resolved (99%), 26,693 by decision after a hearing, 4,165 by negotiated settlement and 245 by
  settlement after a hearing, 7,075 not admitted, withdrawn or dismissed; "Total IAP payments approved
  $3.180 billion"; average payment with legal costs $111,265. "Statistics include continuing Alternative
  Dispute Resolution (ADR) claims as per the IRSSA."'
