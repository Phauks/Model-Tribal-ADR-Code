annotation: >-
  A recent California compact, posted by the California Gambling Control Commission
  as 'Ione_Compact_2020'. The execution date was not extracted, and the preamble
  mentions trust acquisition in March 2020. Section 13.0 sets out a tiered dispute-resolution
  clause 'In recognition of the government-to-government relationship': written notice,
  a written response within 15 days, a meet-and-confer within 30 days, then optional
  (never mandatory) arbitration before a JAMS arbitrator under JAMS Comprehensive
  Rules with the Optional Arbitration Appeal Procedure, then federal or state court.
  Section 13.3 keeps 'mediation' open by mutual agreement, and § 13.1(f) bars either
  side from raising the other's failure to exhaust its own administrative remedies.
  Section 10.0 requires a patron-dispute process: written complaint, Tribal Gaming
  Agency review, then Tribal court or a Tribal Claims Commission. (project analysis)
  This is the most detailed intergovernmental ADR clause found in this research and
  a ready template for a Tribe's intergovernmental-agreements chapter.
