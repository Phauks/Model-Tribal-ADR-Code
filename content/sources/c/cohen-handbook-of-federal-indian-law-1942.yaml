annotation: 'The original edition of the Handbook, prepared in the Interior Department, with a foreword by Secretary Harold L. Ickes and an introduction by Solicitor Nathan R. Margold (catalog: xxiv, 662 pages). (project analysis) A primary source for the Reorganization era itself and the root of every later edition of Cohen''s Handbook; a U.S. government work that can be read and quoted freely.'
