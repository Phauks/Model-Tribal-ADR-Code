notes: The General Information section says the Tribal Court consists of a trial court and the Colville Tribal Court of Appeals. Colville Tribal Code § 1-1-41 (September 2010 version of Chapter 1-1, a scanned PDF linked from the National Indian Law Library) establishes the Court of Appeals as the Reservation's appellate court.
