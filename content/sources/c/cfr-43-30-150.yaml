annotation: >-
  In Interior's Indian probate rules (43 C.F.R. part 30, subpart F, "Consolidation
  and Settlement Agreements"), § 30.150 allows a probate judge to approve a settlement
  agreement among interested parties resolving any issue if all parties are advised
  of material facts, understand the agreement's effect, and settlement is in their
  best interest; the judge then issues an order distributing the estate per the agreement.
  Section 30.152 permits waiver of trust-property valuation in such agreements. Text
  read through the eCFR versioner API (current as of 2026-11-19). (project analysis)
  Not a formal ADR program, but an example of Interior probate judges approving negotiated
  family settlements over trust land; a Tribal code's probate or family-mediation
  chapter could interact with it. No dedicated OHA ADR program was found in 43 C.F.R.
  part 4, subpart A.
