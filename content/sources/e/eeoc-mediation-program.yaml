annotation: >-
  EEOC's mediation page describes its charge-mediation program: mediation is "an
  informal and confidential way" to resolve disputes with a neutral who "does not
  decide who is right or wrong"; participation is "completely voluntary"; there is
  no charge; sessions usually last 3 to 4 hours; mediation resolves charges in "less
  than 3 months on average" versus "10 months or longer" for investigation; and "A
  written signed agreement reached during mediation is enforceable in court just
  like any other contract." It also notes that "Federal agencies are required to
  have an alternative dispute resolution program." (project analysis) A widely recognized
  voluntary agency-mediation model with clear plain-language rules; useful for drafting
  Tribal employment-rights office mediation.
