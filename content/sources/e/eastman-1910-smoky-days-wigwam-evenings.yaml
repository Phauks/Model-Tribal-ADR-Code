notes: 'The school edition of Wigwam Evenings: Sioux Folk Tales Retold (1909), with the first twenty of its twenty-seven evenings. Charles A. Eastman (Ohiyesa) was Santee Dakota; his co-author and wife, Elaine Goodale Eastman, was not Native. Her preface says they chose the shorter stories and "have not always insisted upon a literal rendering" so as to fit them to children. Read in the 1912 printing (Internet Archive) and checked against a 1910 printing (Internet Archive) and the Project Gutenberg transcription of the 1909 edition (ebook 28099).'
