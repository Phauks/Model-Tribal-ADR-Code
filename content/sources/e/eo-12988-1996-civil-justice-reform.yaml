annotation: >-
  Executive Order 12988 (signed Feb. 5, 1996; published 61 Fed. Reg. 4729, Feb. 7,
  1996) directs federal litigation counsel to attempt early resolution; § 1(c) is
  titled "Alternative Methods of Resolving the Dispute in Litigation" and directs
  that claims "should be resolved through informal discussions, negotiations, and
  settlements" whenever feasible, that counsel suggest an appropriate ADR technique
  where its benefits may be derived, and that counsel be trained in ADR. (project
  analysis) Relevant where a Tribe litigates against the United States (e.g., trust
  or contract claims): federal counsel are under a standing directive to consider
  ADR, which a Tribal litigation policy can invoke.
