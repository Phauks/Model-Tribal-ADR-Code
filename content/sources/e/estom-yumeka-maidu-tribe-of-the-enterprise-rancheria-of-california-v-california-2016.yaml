notes: Estom Yumeka Maidu Tribe of the Enterprise Rancheria of Cal. v. California, 163 F. Supp. 3d 769 (E.D. Cal.
  2016). The court granted the tribe's motion for judgment on the pleadings, treating the California Legislature's
  two-year inaction on a governor-signed compact as within IGRA's good-faith negotiation mandate, and ordered the
  parties into IGRA's remedial process with a 60-day period to conclude a compact. A mediator later selected the
  tribe's last best offer and Interior issued Secretarial procedures in 2016. Read on the original link. Citator
  check (KeyCite) pending; see the project's Westlaw list.
