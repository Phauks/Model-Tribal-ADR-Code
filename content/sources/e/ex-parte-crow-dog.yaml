notes: >-
  Full citation: 109 U.S. 556 (1883); 3 S. Ct. 396; 27 L. Ed. 1030 (Westlaw title Ex parte
  Kan-gi-shun-ca). Decided December 17, 1883. Official report scan:
  https://tile.loc.gov/storage-services/service/ll/usrep/usrep109/usrep109556/usrep109556.pdf. Matthews,
  J., for the Court; no separate opinion. Quotes checked: 568 and 571. Westlaw prints "It tries them not
  by their peers" without a comma; the official U.S. Reports scan has the comma ("It tries them, not by
  their peers"), checked on 2026-11-21, and the digest follows the official report. The opinion does not
  itself describe the Lakota resolution of the killing; any description of that process needs a separate
  historical source. (project analysis) The superseding statute is the Major Crimes Act. Write-up of the
  Westlaw pull: research/pull-results/2026-11-21-legal-history-confirm-first-cases.md in the project's
  working files; the lead author's copy is kept privately and is not redistributed.
