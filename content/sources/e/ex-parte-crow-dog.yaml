    note: Crow Dog and Spotted Tail were Brulé (Sicangu) Lakota of Spotted Tail's band, whose people are today the Rosebud Sioux Tribe. The Lower Brule Sioux Tribe is also Brulé.
case_box:
  background: |-
    Crow Dog, a member of the Brulé band of the Sioux Nation, killed Spotted Tail, a member of the same band, in Indian country. The territorial court of Dakota convicted him of murder and sentenced him to death. Federal law then excluded "crimes committed by one Indian against the person or property of another Indian" from the general federal criminal laws. Crow Dog sought release on the ground that no federal law reached his act [@ex-parte-crow-dog, pp. 557-558].
  question: |-
    Did a federal territorial court have jurisdiction to try and sentence a Lakota man for killing another Lakota man within the Great Sioux Reservation?
  holding: |-
    No. The Court held that neither the general federal criminal statutes nor the 1868 treaty and 1877 agreement extended federal jurisdiction to a crime by one Indian against another in Indian country. Such a crime remained subject to the nation's own law and processes. The writ of habeas corpus issued.
  quotes:
  - text: "[T]hat of self-government, the regulation by themselves of their own domestic affairs ... ."
    pinpoint: "p. 568"
  - text: "It tries them, not by their peers, nor by the customs of their people, nor the law of their land, but by superiors of a different race ... ."
    pinpoint: "p. 571"
  treatment: |-
    Congress responded with section 9 of the Indian Appropriation Act of March 3, 1885 (the Major Crimes Act), which *United States v. Kagama* (1886) upheld and described as following the *Crow Dog* decision. [@united-states-v-kagama]
  topics:
  - "Dispute resolution and arbitration"
  - "Tribal courts"
  - "Criminal jurisdiction"
  reading:
    title: "*Ex parte Crow Dog* (1883)"
    text: |-
      Recognizes a nation's own process for resolving even a homicide as law the federal courts must respect absent clear congressional action.
