annotation: >-
  The Las Vegas (Eighth Judicial District) ADR office page describes three programs,
  arbitration, mediation and the Short Trial Program, and frames them as a 'multi-door'
  courthouse. It describes arbitration as 'an adversarial, typically non-binding
  procedure' and mediation as 'an informal and non-adversarial process.' The page
  carries a last-modified date of July 15, 2020 and links a Foreclosure Mediation
  sub-page that was not opened. (project analysis) This shows how the statewide rules
  are carried out in the largest district. A Tribal court could adopt a similar single
  ADR office.
