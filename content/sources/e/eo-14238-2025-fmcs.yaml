annotation: >-
  Executive Order 14238 (signed Mar. 14, 2025; 90 Fed. Reg. 13043, Mar. 20, 2025)
  lists "the Federal Mediation and Conciliation Service" first among entities whose
  non-statutory components and functions "shall be eliminated to the maximum extent
  consistent with applicable law" and whose statutory functions and personnel are
  to be reduced "to the minimum presence and function required by law" (§ 2(a)(i)).
  For the later litigation history (Rhode Island v. Trump; American Federation of
  Teachers v. Davis) see fox-dorson-lee-2026-fmcs. (project analysis) Documents the
  2025 disruption of the main federal labor mediation agency, which matters for Tribal
  employers and unions that relied on FMCS mediators and for the federal-agency ADR
  services FMCS provides under 29 U.S.C. § 173(f).
