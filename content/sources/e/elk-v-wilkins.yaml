notes: >-
  Full citation: 112 U.S. 94 (1884); parallel cite 5 S. Ct. 41. Decided November 3, 1884 (Westlaw).
  Official report scan:
  https://tile.loc.gov/storage-services/service/ll/usrep/usrep112/usrep112094/usrep112094.pdf. Gray, J.,
  for the Court; Harlan, J., with Woods, J., dissenting. The opinion does not name Elk's nation; nations
  left blank. The quote is transcribed from the LOC scan because the LII text has OCR errors. (project
  analysis) The superseding statute is the Indian Citizenship Act of 1924. Write-up of the Westlaw pull:
  research/pull-results/2026-11-21-legal-history-confirm-first-cases.md in the project's working files;
  the lead author's copy is kept privately and is not redistributed.
