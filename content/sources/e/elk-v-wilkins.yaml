case_box:
  background: |-
    John Elk was born a member of a Native nation, later left it, and lived in Omaha, Nebraska. In April 1880 he asked Charles Wilkins, a city registrar, to register him as a voter, and Wilkins refused. Elk sued in federal court, arguing that he was a citizen under the Fourteenth Amendment and could not be denied the vote on account of race under the Fifteenth [@elk-v-wilkins, pp. 94-96, 98].
  question: |-
    Was a Native man born in Tribal relations who later moved away and lived among non-Indians a U.S. citizen under the Fourteenth Amendment entitled to vote?
  holding: |-
    No. The Court held that Native people born members of a Tribe were not "subject to the jurisdiction" of the United States within the Citizenship Clause. Leaving the Tribe did not make Elk a citizen without naturalization or other action by Congress.
  quotes:
  - text: "Indians born within the territorial limits of the United States, members of, and owing immediate allegiance to, one of the Indian tribes (an alien, though dependent, power), although in a geographical sense born in the United States, are no more \"born in the United States and subject to the jurisdiction thereof,\" within the meaning of the first section of the Fourteenth Amendment, than the children 'of subjects of any foreign government born within the domain of that government ... ."
    pinpoint: "p. 102"
  treatment: |-
    Congress later conferred citizenship by statute in the Indian Citizenship Act of 1924 [@indian-citizenship-act-1924].
  reading:
    title: "*Elk v. Wilkins* (1884)"
    text: |-
      Background for the dual political status of citizens of Native nations.
