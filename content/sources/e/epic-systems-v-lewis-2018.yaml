annotation: >-
  Epic Systems (No. 16-285, decided together with Nos. 16-300 (Ernst & Young) and
  16-307; argued Oct. 2, 2017, decided May 21, 2018) held that employment arbitration
  agreements requiring individualized proceedings must be enforced and that neither
  the FAA saving clause nor the National Labor Relations Act displaces that command.
  The opinion states that "Congress has instructed federal courts to enforce arbitration
  agreements according to their terms—including terms providing for individualized
  proceedings" (584 U.S. at 502, 138 S. Ct. at 1619). (project analysis) Directly relevant to Tribal employers (casinos,
  enterprises) that use employment arbitration, and to how a Tribal code treats collective-action
  waivers, now subject to the 2022 carve-out in 9 U.S.C. ch. 4 for sexual assault
  and harassment claims.
