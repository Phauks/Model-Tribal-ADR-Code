annotation: >-
  The court treats the statutory requirement that "a family meeting was called and
  held for the purpose of selecting a successor to the title" as a precondition to
  court involvement in a matai title dispute (3 A.S.R.3d at 226, 228, quoting A.S.C.A.
  § 1.0405(b)). It reasons that judicial process should not operate "to totally supplant
  and displace a Samoan family from the matai selection process" (id. at 228). (project
  analysis) The family meeting is a selection process that also works as the family's
  own forum for settling succession disagreements before the state forum. The bar's
  digest cites the same rule to § 1.0406(b) (In re Matai Title "Letuli," 4 A.S.R.3d
  273), so Trevor should check the current section number.
