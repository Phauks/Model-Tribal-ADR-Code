annotation: >-
  A digest of American Samoa decisions on fa'a Samoa (the digest's spelling). Under
  A.S.C.A. § 1.0202, customs are preserved only when not in conflict with law; Taeleifi
  v. Willis, 21 A.S.R.2d 118 states "Samoan custom must give way to the laws of the
  United States and American Samoa." Families decide "not by pure majoritarian democracy
  but by consensus" (In re Matai Title Missaalefua, 28 A.S.R.2d 106). A court "will
  not substitute its judgment for that of the senior matai" absent clear abuse (Toleafoa
  v. Tiapula, 7 A.S.R.2d 117). The ifoga, offered after a wrongful death, "is not
  meant to compensate family of deceased but merely as expression of sorrow and apology"
  (Hsu v. Pratt, 4 A.S.R. 752). (project analysis) The digest documents, through
  court decisions, a customary apology process (ifoga), matai authority over family
  affairs, and consensus decision-making. Each needs the underlying opinion read
  before it is cited.
