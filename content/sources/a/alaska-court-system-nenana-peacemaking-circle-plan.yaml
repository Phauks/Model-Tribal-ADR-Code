notes: 'Scanned plan with partly garbled text. Legible terms: referral after conviction with consent of
  the prosecution, defendant and any victim; circle held at least 15 days before sentencing; the court
  considers but is not bound by the recommendations. Signature date read as 2020. The plan names the program,
  not its sponsoring entity, so no nation profile is linked.'
