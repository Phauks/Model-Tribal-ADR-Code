annotation: Statewide procedures for referring criminal cases to a tribe or community program for a sentencing
  recommendation under Criminal Rule 11(i). Referral 'requires the consent of the defendant, the prosecutor,
  and any victim' (para. 3), and the sentencing judge 'is not bound by the recommendation' (para. 6).
  (project analysis) The state court keeps the decision; the Tribal process advises.
