notes: 'Indigo Book citation: Jack F. Trope & Shannon Keller O''Loughlin, Ass''n on Am. Indian Affs. & Casey Fam. Programs, A Survey and Analysis of Select Title IV-E Tribal-State Agreements Including Template of Promising Practices (Mar. 2014), https://nill.narf.org/resources/title-iv-e/20140320_title_iv-e_report.pdf.. The PDF was downloaded with curl and its text extracted; the introductory state-by-state summary (Alaska through Washington) was read in full. The report covers 98 agreements from October 2012 to December 2013 and says it does not give definitive current status. Private copy research/captures/jurisdiction/association-on-american-indian-affairs-survey-and-analysis-of-title-iv-e-tribal-state-agreements-2014.pdf.'
