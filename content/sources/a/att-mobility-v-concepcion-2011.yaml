annotation: >-
  Concepcion (No. 09-893, decided Apr. 27, 2011) held that California's Discover
  Bank rule, which treated class waivers in consumer arbitration agreements as unconscionable,
  is preempted by the FAA. The syllabus states that § 2's saving clause permits invalidation
  by "generally applicable contract defenses" but not by defenses that apply only
  to arbitration. The U.S. Reports citation 563 U.S. 333 is confirmed by its citation
  in the Epic Systems syllabus on LII. (project analysis) Important for drafting
  any Tribal consumer- or employment-protection limits on arbitration: rules that
  single out arbitration are the ones most exposed to an FAA preemption challenge
  in non-Tribal forums.
