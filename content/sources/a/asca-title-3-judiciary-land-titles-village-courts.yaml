annotation: >-
  The Land and Titles Division has "exclusive jurisdiction" over matai titles and
  land controversies (§ 3.0208(b)). Land cases are heard by a justice and two associate
  judges (§ 3.0240). In matai title cases the four associate judges' majority controls
  and the justice breaks ties (§ 3.0241(b)). Where procedure is not provided for,
  the division acts "most consistent with natural justice and convenience" (§ 3.0242(b)).
  Village courts, each "consisting of an associate judge of the High Court," hear
  "only . . . matters arising under the regulations of their respective villages" and
  have exclusive power to impose penalties for violating village regulations (§§
  3.0401-3.0402). (project analysis) These are adjudicative bodies, not ADR. They
  show a court system built so that matai associate judges control customary questions,
  a structure relevant to Tribal courts that seat elders.
