annotation: >-
  A historical study of American dispute settlement outside the courts. The NCJRS
  abstract describes the book as tracing non-litigation methods in religious, utopian,
  ethnic, and business communities, starting with colonial settlement 'based in religious
  community', and arguing that modern calls for ADR reflect an overburdened legal
  system. Publication by Oxford University Press (New York, 1983) is confirmed by
  Eric H. Steele's review essay, 'Morality, Legality, and Dispute Processing: Auerbach's
  Justice Without Law?', 9 Am. B. Found. Res. J. 188-205 (1984). (project analysis)
  Auerbach's central point, that informal justice works best inside cohesive communities
  with shared values, bears directly on Tribal ADR and on why peacemaking that is
  rooted in community and kinship differs from imported court-annexed mediation.
