annotation: >-
  A statutory pre-filing process. Before "any action relating to controversies over
  communal land or matai titles may be commenced," each party must file a certificate
  signed by the Secretary of Samoan Affairs or deputy. The certificate must state
  that the parties appeared personally, "without an attorney or counsel," on at least
  two occasions before the Secretary and two designees, and that an attempt was made
  to resolve the controversy (subsec. (a)(1)). Each party must receive at least 20
  days' notice per appearance (subsec. (a)(2)). The certificate records the times
  of each appearance and the findings and conclusions, "including a statement of
  the reason why the controversy could not be resolved" (subsec. (a)(3)-(4)). This
  text is as reproduced in Hunkin v. Galea'i, 8 A.S.R.3d 260 (Land & Titles Div.
  2004). (project analysis) This is a documented-in-law example of a mandatory customary-authority
  step before court, and the closest territorial analogue to a Tribal code requiring
  a traditional process before Tribal court. The Secretary is appointed "from among
  the leading registered matais" (Rev. Const. Am. Samoa art. IV, § 4).
