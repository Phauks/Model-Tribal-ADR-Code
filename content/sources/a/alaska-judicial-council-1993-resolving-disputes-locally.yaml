annotation: 'Region-by-region survey of village councils, Tribal courts and elders'' councils in 1993.
  Examples: in the Bering Straits region ''Fifteen of the villages have adopted tribal court ordinances;
  in eight, a court of elders also is established by ordinance'' (PDF p. 50); in the Northwest Arctic,
  ''Elders'' Councils often resolve disputes'' (PDF p. 46); in the Aleutian-Pribilof region ''no community
  currently has a functioning tribal court'' (PDF p. 78).'
