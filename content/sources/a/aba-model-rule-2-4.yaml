annotation: >-
  ABA Model Rule 2.4 defines when a lawyer serves as a third-party neutral: assisting
  two or more persons who are not the lawyer's clients to reach a resolution, for
  example as an arbitrator or mediator. Under 2.4(b) the lawyer-neutral must tell
  unrepresented parties that the lawyer does not represent them, and must explain
  the difference between a neutral's role and a representative's role when a party
  does not understand it. The ABA Section of Dispute Resolution lists Rule 2.4 together
  with Rule 1.12 (former judge, arbitrator, mediator or other third-party neutral)
  among the rules relevant to neutrals. (project analysis) Tribal codes often allow
  Tribal bar members, lay advocates, and non-lawyers to serve as neutrals. A model
  code can carry the 2.4(b) disclosure duty over to every neutral, not only lawyers.
