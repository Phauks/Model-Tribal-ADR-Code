annotation: >-
  ABA Model Rule 2.4 defines when a lawyer serves as a third-party neutral: assisting
  two or more persons who are not the lawyer's clients to reach a resolution, for
  example as an arbitrator or mediator. Under 2.4(b) the lawyer-neutral must tell
  unrepresented parties that the lawyer does not represent them, and must explain
  the difference between a neutral's role and a representative's role when a party
  does not understand it. Comment [1] defines a third-party neutral as "a person,
  such as a mediator, arbitrator, conciliator or evaluator, who assists the parties,
  represented or unrepresented, in the resolution of a dispute or in the arrangement
  of a transaction." Comment [3] adds that, where appropriate, the lawyer should explain
  "the inapplicability of the attorney-client evidentiary privilege." Comment [4]
  sends conflicts, when a former neutral later represents a client in the same matter,
  to Rule 1.12. Comment [5] says a lawyer representing a client in ADR owes candor
  under Rule 3.3 before a tribunal, as in binding arbitration, and otherwise under
  Rule 4.1. (project analysis) Tribal codes often allow
  Tribal bar members, lay advocates, and non-lawyers to serve as neutrals. A model
  code can carry the 2.4(b) disclosure duty over to every neutral, not only lawyers.
