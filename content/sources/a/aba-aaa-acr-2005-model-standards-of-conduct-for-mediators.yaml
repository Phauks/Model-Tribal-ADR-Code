annotation: >-
  The August 2005 Model Standards, the principal U.S. mediator-ethics code, adopted
  jointly by the ABA (Section of Dispute Resolution), the AAA, and the Association
  for Conflict Resolution. They revise the 1994 Standards, which were developed by
  the AAA, the ABA Section, and the Society of Professionals in Dispute Resolution
  (SPIDR); the 1994 text was also opened, at uis.edu. Footnote 1 records the merger
  history: ACR 'is a merged organization of the Academy of Family Mediators, the
  Conflict Resolution Education Network and the Society of Professionals in Dispute
  Resolution (SPIDR).' Standard I defines self-determination as 'the act of coming
  to a voluntary, uncoerced decision in which each party makes free and informed
  choices as to process and outcome.' (project analysis) This is the default baseline
  a Tribal mediator code will be measured against. A Tribal code can adopt the structure
  (self-determination, impartiality, conflicts, competence, confidentiality, quality
  of process) while stating where community or kin participation changes the analysis.
