    is hosted by the University of Houston Law Center; its footnote 3 reads 'Proposed
    language. No organization as of April 10, 2005 has reviewed or approved the 2005
    Revision,' so it may be a pre-approval printing. Trevor should pull the final
    approved text from the ABA Section of Dispute Resolution's ethics page (americanbar.org/groups/dispute_resolution/resources/ethics/),
    which lists 'Model Standards of Conduct for Mediators (2005)' and the 2005 Reporter's
    Notes.
