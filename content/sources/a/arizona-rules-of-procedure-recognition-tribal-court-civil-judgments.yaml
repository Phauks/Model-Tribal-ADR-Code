notes: >-
  Citations: Ariz. R. P. Recog. Tribal Ct. Civ. Judgm. 1–5 (cite form unverified). Source type: state
  court rule. Later history: Adoption date and current text not verified. NOT FULLY VERIFIED. Official
  rule text was not opened (azcourts.gov rules are hosted on a Westlaw-based viewer; an unofficial mirror
  was not used). Only the rule set's existence and title were confirmed. Adoption date unknown. The 'largest
  number of tribal courts' remark is general knowledge. Westlaw: Pull the full rule set on Westlaw (Arizona
  Rules of Court, Tribal Court Civil Judgments). Later history (read 2026-11-22): on Dec. 26, 2014 the
  Arizona Association of Superior Court Clerks petitioned the Arizona Supreme Court under its Rule 28 to amend
  Rule 5(b) to remove the requirement that the clerk certify that no objections were timely filed; so the
  rules, including Rule 5's mandatory and discretionary considerations after an
  objection, were in force by 2014. Private copy:
  state-court-rules/arizona/petition-amend-rule-5-tribal-court-judgments-2014-12-26.pdf. The Arizona Supreme Court Rules Forum entry for that petition (R-14-0032, which also amends Rule 5(a) of the Rules of Procedure for Enforcement of Tribal Court Involuntary Commitment Orders) says comments were due May 20, 2015 and the petition was ADOPTED as modified, effective Jan. 1, 2016 (lead author's print, 2026-11-22; private copy state-court-rules/arizona/rules-forum-r-14-0032-2026-11-22.pdf). The original adoption date and the full text of Rules 1-5 are still not confirmed.
