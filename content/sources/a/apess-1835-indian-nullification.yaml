notes: William Apess (spelled Apes in the book), a Pequot preacher, tells how the Mashpee people declared in May 1833 that they would govern themselves, enforced their resolutions on July 1, 1833, and were prosecuted for it. The book prints the council's resolutions and petitions. Read in the University of Toronto scan on the Internet Archive and checked against the Project Gutenberg transcription (ebook 12486).
