annotation: >-
  The ALRC's summary of its inquiry into the future acts regime. Under the right to negotiate there is
  "a minimum six-month negotiation period before any party can apply to the arbitral body for a future
  act determination, as long as the requirements to negotiate in good faith during that time have been
  met" (para. 37); the arbitral body, usually the National Native Title Tribunal, may decide a future
  act can or cannot be done, or can be done with conditions that take effect as if agreed (para. 38).
  The ALRC found that arbitration as the fallback puts "significant structural pressure" on native title
  parties, because "the alternative, arbitration, is perceived as likely to lead to a worse outcome" (paras.
  61-62); citing the Tribunal's own figures, it reports that of 200 contested future acts determined since
  1994, six were determined not to be done (para. 61 n.63). It recommends repealing s 38(2), which bars
  profit-based conditions, and reforming the s 39 criteria (para. 63). (project analysis) The clearest
  documented warning that a binding fallback chosen by the stronger party's design can shape the negotiation
  that precedes it; a model code that pairs negotiation with arbitration needs to look at who bears the
  risk of the fallback.
