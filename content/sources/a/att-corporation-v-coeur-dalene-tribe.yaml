case_box:
  background: |-
    Under a gaming compact with Idaho, the Coeur d'Alene Tribe set up a National Indian Lottery run from its reservation, which players elsewhere could join by telephone. Several state attorneys general warned AT&T that providing toll-free service for the lottery would break federal and state law [@att-corporation-v-coeur-dalene-tribe, pp. 901-902]. The Tribe sued AT&T in Tribal court to require the service, and the federal district court and the Tribal court reached conflicting decisions [@att-corporation-v-coeur-dalene-tribe, pp. 900, 903].
  question: |-
    Must a federal court enforce a Coeur d'Alene Tribal Court judgment ordering AT&T to provide toll-free service for the Tribe's national lottery?
  holding: |-
    The court reaffirmed that federal courts must recognize Tribal judgments under comity unless the Tribal court lacked jurisdiction or denied due process, and may not relitigate issues a Tribal court with jurisdiction decided. But it held the Tribal Court lacked jurisdiction because the Federal Communications Act claim had to be brought before the FCC or in federal district court. It vacated the district court's ruling that the lottery violated the Indian Gaming Regulatory Act because AT&T was not the proper party to raise that question.
  quotes:
  - text: "As a general rule, federal courts must recognize and enforce tribal court judgments under principles of comity."
  - text: "... federal courts may not readjudicate questions — whether of federal, state or tribal law — already resolved in tribal court absent a finding that the tribal court lacked jurisdiction or that its judgment be denied comity for some other valid reason."
  treatment: |-
    The opinion amends an earlier opinion reported at 283 F.3d 1156 (filed March 19, 2002); cite the amended opinion [@att-corporation-v-coeur-dalene-tribe].
  topics:
  - "Recognition of Tribal judgments (comity)"
  - "Enforcement of awards, orders and judgments"
  - "Tribal courts"
  - "Civil jurisdiction"
  - "Gaming"
