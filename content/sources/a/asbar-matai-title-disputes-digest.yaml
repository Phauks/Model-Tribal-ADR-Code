annotation: >-
  A topical digest of Land and Titles Division decisions on matai title disputes.
  Entries on § 43.0302 state that "meetings must first be held at the Office of Samoan
  Affairs" (In re Matai Title "I`aulualo," 2 A.S.R.3d 238 (1998)). They also say
  proceedings are paused if the certificate was "issued upon misinformation" (In
  re Matai Title Mulitauaopele, 12 A.S.R.2d 8). Other entries cover the family-meeting
  prerequisite (A.S.C.A. § 1.0406(b), per In re Matai Title "Letuli," 4 A.S.R.3d
  273 (2000)) and the four statutory criteria for awarding a title under § 1.0409(c).
  (project analysis) This is a finding aid, not authority: cite the underlying cases.
  It is useful for locating the line of cases treating the Office of Samoan Affairs
  process as mandatory.
