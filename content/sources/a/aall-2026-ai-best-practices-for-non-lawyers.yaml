annotation: >-
  A guide for people who are not lawyers, developed in 2026 by the American Association of Law
  Libraries' Legal Information Services to the Public Special Interest Section. The Texas State
  Law Library, whose director co-wrote it with Nicole Belbin, Sara V. Pixon and Laura Moorer,
  describes it as covering how AI works, whether AI suits a research task, the kinds of tools
  (free online tools, AI features in legal databases, court chatbots), prompting, and how to
  verify results, and warns that AI may produce "hallucinations" of wrong or nonexistent
  citations.
