annotation: >-
  Acting Associate Justice Ward set aside a § 43.0302 certificate that showed only
  one meeting, no proof of 20 days' notice, and no reason why the dispute was not
  resolved. The opinion says the Legislature "required the parties to first participate
  in a traditional dispute resolution process" before seeking judicial remedies.
  It describes the process as "an opportunity to meet, discuss, debate, and seek
  consensus," criticizes parties who treat it "as more of an obstacle to litigation,"
  and recognizes an affirmative duty on the Secretary to facilitate resolution. (project
  analysis) Courts here enforce a customary pre-filing step strictly, which is directly
  relevant to drafting the consequences of skipping a required traditional step in
  a Tribal code.
