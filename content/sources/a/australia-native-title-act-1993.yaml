annotation: >-
  The Commonwealth statute that recognizes native title and regulates "future acts" affecting it. Its
  table of contents shows the right-to-negotiate machinery in Part 2, Division 3, Subdivision P, including
  s 31 ("Normal negotiation procedure"), s 35 ("Application for arbitral body determination"), s 38 ("Kinds
  of arbitral body determinations"), s 39 ("Criteria for making arbitral body determinations"), s 41 ("Effect
  of determination or agreement") and s 42 ("Overruling of determinations"), and Federal Court mediation
  in Part 4, Division 1B (s 86A, "Purpose of mediation"; s 86B, "Referral of matters for mediation").
  The National Native Title Tribunal's guidance says an application for a future act determination requires
  that "at least six months have passed since the notification day" without agreement, and that the Tribunal
  "must not make a determination" if a party seeking it "has failed to negotiate in good faith." (project
  analysis) The section text was not read; the essay relies on the Australian Law Reform Commission's
  2026 summary for how the regime works.
