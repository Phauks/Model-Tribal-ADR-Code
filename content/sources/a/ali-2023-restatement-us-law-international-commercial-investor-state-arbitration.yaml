annotation: >-
  The ALI's first Restatement on international arbitration. The ALI Adviser project
  page lists the reporters as George A. Bermann, Jack J. Coe, Jr., Christopher Drahozal,
  and Catherine A. Rogers. A&O Shearman's blog post of July 24, 2023 reports that
  the ALI 'recently published the first ever Restatement of the U.S. Law of International
  Commercial and Investor-State Arbitration.' (project analysis) It is relevant only
  at the margins: if a Tribe or Tribal enterprise arbitrates with a foreign counterparty,
  U.S. courts will apply the New York Convention framework described here. Its Restatement
  format (black letter, comment, reporters' notes) is also a model for the project's
  own commentary.
