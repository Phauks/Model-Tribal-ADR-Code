annotation: >-
  The ABA Section of Dispute Resolution's ethics resource page. It lists 'ABA Model
  Rules and Standards Relevant to Attorneys and Neutrals' (Rules 2.4, 1.12, 3.3,
  4.1 and 2.1 cmt. 5), the 2002 Model Rules amendments, the Model Standards of Conduct
  for Mediators (2005) with Reporter's Notes, the Code of Ethics for Arbitrators
  in Commercial Disputes, Ethics Codes for Settlement Negotiations (2002), and advisory
  opinions of the Section's Committee on Mediator Ethical Guidance. The Committee's
  opinions are available to members only. The Section's 'About' page describes itself
  as 'the largest dispute resolution community in the world' and says it publishes
  'a magazine, newsletter, books, and a podcast.' (project analysis) This is the
  starting index for U.S. neutral-ethics materials. The Committee on Mediator Ethical
  Guidance opinions are a model for an advisory-opinion mechanism in a Tribal ADR
  code.
