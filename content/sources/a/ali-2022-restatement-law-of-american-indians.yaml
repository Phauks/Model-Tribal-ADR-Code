annotation: >-
  The ALI's Restatement of federal Indian law. The ALI Adviser says the Official
  Text 'was published in 2022' in six chapters: Federal-Tribal Relations, Tribal
  Authority, State-Tribal Relations, Tribal Economic Development, Indian Country
  Criminal Jurisdiction, and Natural Resources. Reporter: Matthew L.M. Fletcher;
  Associate Reporters: Wenona T. Singel and Kaighn Smith, Jr. The ALI Adviser index
  also shows § 34 (civil regulatory and adjudicatory authority over nonmembers) and
  § 35. (project analysis) The black-letter section on recognition of Tribal-court
  judgments in state and federal court was NOT identified here. Trevor should locate
  it on Westlaw, probably in Chapter 2 (Tribal Authority) or Chapter 3 (State-Tribal
  Relations), before the commentary cites a section number.
