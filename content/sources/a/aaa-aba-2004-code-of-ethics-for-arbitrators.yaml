annotation: >-
  The AAA/ABA Code of Ethics for Arbitrators in Commercial Disputes, 'Effective March
  1, 2004'. It was first prepared in 1977 by a joint AAA-ABA committee and revised
  in 2003. It applies to commercial (not labor) arbitration. Its Note on Neutrality
  states the sponsors' view that 'it is preferable for all arbitrators including
  any party-appointed arbitrators to be neutral', and it lets parties in some domestic
  arbitrations opt for non-neutral party-appointed arbitrators. (project analysis)
  Relevant to Tribal commercial arbitration clauses and to any Tribal arbitrator
  roster. A Tribal code may adopt the Code by reference, or modify the disclosure
  rules for small communities where everyone is related or acquainted. Note: the
  ABA Section's ethics page lists this Code with the year 2002; the AAA's PDF gives
  an effective date of March 1, 2004.
