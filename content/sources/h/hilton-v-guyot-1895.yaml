topics: [comity, recognition-of-judgments, intersection]
annotation: >-
  The foundational U.S. Supreme Court decision on comity and the recognition of foreign-nation
  judgments (opinion of Justice Gray). Wilson v. Marchington adopts Hilton's definition
  of comity, quoting 159 U.S. at 163-64, and its due-process elements as the 'guiding
  principles' for recognizing Tribal judgments, while rejecting Hilton's reciprocity
  rule. (project analysis) A model Tribal code may want to include a reciprocal recognition
  provision (comity for state and foreign judgments that meet stated standards) to
  encourage recognition of Tribal outcomes in return, even though Wilson does not
  require reciprocity.
