annotation: 'Bill as introduced (Apr. 4, 2001): any Tohono O''odham Nation member residing on Nation lands "in Arizona
  or Mexico may apply for United States citizenship," and members "shall be entitled to pass and repass freely the
  borders of the United States." The project found no record of enactment.'
