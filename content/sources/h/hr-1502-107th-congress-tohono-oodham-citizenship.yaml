notes: >-
  Introduced text only; enactment status not confirmed. The lead author pulled the introduced PDF again on
  2026-11-22. govinfo holds only the introduced version (BILLS-107hr1502ih), which suggests the bill did not
  pass the House (project analysis, not confirmed). A Nov. 22, 2026 web search also listed H.R. 2348 (107th
  Cong.) and H.R. 731 (108th Cong.) as possible later Tohono O'odham citizenship bills; not opened. Status confirmed 2026-11-22 from the congress.gov All Actions page (lead author's print): introduced Apr. 4, 2001 by Rep. Frank Pallone, Jr., referred to the House Judiciary Committee, and on Apr. 19, 2001 referred to the Subcommittee on Immigration and Claims, its last action (3 actions in all). The bill died in committee. Private copy congress/hr-1502-107th-congress-all-actions.pdf.
