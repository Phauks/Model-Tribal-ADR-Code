annotation: A short program profile written for the Honoring Nations awards. It reports, over the program's
  first four years, 80 sentenced offenders of whom 'only two' returned to state court (at 2) and a 97.5
  percent completion rate against 22 percent for the Alaska court system (at 3). (project analysis) These
  are the program's own figures, with no method or comparison stated; treat them as reported outcomes,
  not an evaluation.
