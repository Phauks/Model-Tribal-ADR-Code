annotation: A legal history of Ex parte Crow Dog (1883) and of Tribal law in the nineteenth century, with the Major Crimes Act that followed. (project analysis) The leading study of how the Lakota resolution of the killing of Spotted Tail, by the nation's own process, came before the Supreme Court; directly relevant to the timeline's 1883 and 1885 entries.
