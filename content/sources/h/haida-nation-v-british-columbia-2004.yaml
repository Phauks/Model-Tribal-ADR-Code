annotation: The duty to consult "is grounded in the honour of the Crown," and "[t]he honour of the Crown
  is always at stake in its dealings with Aboriginal peoples" (para. 16). A fiduciary duty arises "[w]here
  the Crown has assumed discretionary control over specific Aboriginal interests," and "the term 'fiduciary
  duty' does not connote a universal trust relationship encompassing all aspects of the relationship between
  the Crown and Aboriginal peoples" (para. 18). (project analysis) The clearest contrast with the general
  United States trust responsibility.
