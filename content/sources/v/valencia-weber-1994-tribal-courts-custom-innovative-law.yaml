annotation: >-
  Gloria Valencia-Weber's study of custom and innovation in Tribal courts, 24 N.M.
  L. Rev. 225 (1994), in the same Tribal-law issue as Yazzie. (project analysis)
  Relevant to how a Tribal ADR code can let neutrals draw on custom and tradition,
  and to how outside courts applying Wilson-style comity should treat Tribal procedures
  that differ from Anglo-American ones. The full text was not read here.
