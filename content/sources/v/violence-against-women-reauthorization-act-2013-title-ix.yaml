notes: >-
  Citations: Pub. L. No. 113-4, tit. IX, §§ 904–905; 127 Stat. 120, 124; 25 U.S.C. § 1304; 18 U.S.C. §
  2265(e). Also read: https://www.law.cornell.edu/uscode/text/25/1304. Later history: § 1304 substantially
  amended by VAWA 2022 (Pub. L. 117-103, div. W, § 804), which renamed it 'special Tribal criminal jurisdiction'
  and expanded covered crimes. The 2013 Alaska limitation (§ 910) was repealed by Pub. L. 113-275 (2014).
  The '[i]nherent power ... special domestic violence criminal jurisdiction over all persons' clause of
  the 2013 text was not located in the OCR and is not quoted; see the 2022 item for current text. Westlaw:
  KeyCite 25 U.S.C. § 1304 (current version reflects 2022 amendments).
law_box:
  summary: |-
    The 2013 act recognized the inherent power of "participating tribes" to exercise "special domestic violence criminal jurisdiction" over non-Indians [@violence-against-women-reauthorization-act-2013-title-ix, sec. 904]. The 2022 act broadened it to "special Tribal criminal jurisdiction" over more crimes, included participating nations in Maine, and recognized the inherent authority of Alaska nations "to exercise criminal and civil jurisdiction over all Indians present in the Village" [@violence-against-women-act-reauthorization-act-2022-title-viii, sec. 813]. These acts partly answer *Oliphant* [@united-states-v-bryant].
