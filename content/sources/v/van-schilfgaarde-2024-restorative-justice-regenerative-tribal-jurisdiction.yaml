annotation: Argues that Tribes are adopting Indigenous-based restorative justice models, including Healing to Wellness Courts and peacemaking, and that these models can regain jurisdiction lost to state and federal systems through negotiated transfer agreements. Examines the Yurok Tribal Court, the Saint Regis Mohawk Tribal Court and the Sisseton-Wahpeton Oyate Tribal Court as case studies. Relevant to tribal dispute resolution because it links customary and restorative forums to jurisdictional arrangements with counties and states. (project analysis)
