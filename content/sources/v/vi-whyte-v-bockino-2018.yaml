annotation: >-
  Per the court's published-opinion summary page (opinion by Justice Hodge), the
  Court affirmed that an employment-contract arbitration clause was enforceable and
  not waived. It held the FAA governs "because there is an interstate nexus," and
  found it unnecessary to decide whether the FAA applies in the Virgin Islands through
  the Commerce Clause or the Territorial Clause. It also read "arbitration and award"
  in V.I. R. Civ. P. 8(c)(1) to mean a completed arbitration. (project analysis)
  No general V.I. arbitration statute, UAA or RUAA was located in this research;
  the Justia table of contents for Title 5 showed none. FAA-based enforcement therefore
  appears central in the V.I., but Trevor should confirm on Westlaw whether any V.I.
  arbitration statute exists.
