annotation: >-
  Opinion by Chief Justice Hodge, 69 V.I. 749 (2018 WL 4191523), affirming an order
  compelling arbitration of a store manager's wrongful-termination claims. Four holdings.
  (1) "Arbitration and award" in Rule 8(c)(1) "plainly means when arbitration has already
  taken place and an arbitrator has determined an award," so a defendant need not raise
  the right to arbitrate in its answer (at 756-57); the Court declined to follow Rhode
  Island's contrary reading (at 755-56). (2) The FAA governs "because there is an interstate
  nexus" (at 760, 768). The Court noted that 9 U.S.C. § 1 reaches commerce "in any Territory,"
  so the FAA "may very well apply to the territory by way of the Territorial Clause," but
  it did not decide between that and the Commerce Clause (at 759-60). The nexus burden
  is "relatively low" (at 761); a Chicago notice address in the contract, and the manager's
  control over goods shipped to St. Croix, were enough, "as even the slightest nexus is
  sufficient" (at 762). (3) The arbitration clause survived the written contract's expiration
  through an implied continuation of employment and a survival clause (at 763-66). (4)
  No waiver: "Prejudice is the touchstone," and Pueblo's limited litigation conduct
  caused none (at 766-68). Footnote 5 quotes 24 V.I.C. § 74a, which allows employment
  arbitration only by written post-dispute agreement, and records Whyte's concession
  that the FAA would preempt it if the FAA applies through the Commerce Clause and an
  interstate nexus is found (at 757 n.5, citing Allen v. HOVENSA,
  59 V.I. 430, 442 n.2 (2013)). The trial-court decision is Whyte v. Bockino, 69 V.I.
  83 (Super. Ct. 2017) (Brady, J.). (project analysis) For the model code, the opinion
  shows a territorial high court applying the FAA without settling its constitutional
  basis, and it shows that a local rule restricting pre-dispute employment arbitration
  (§ 74a) gives way whenever the FAA reaches the contract. The earlier note that no V.I.
  arbitration statute was found is superseded: § 74a is one, though limited to employment.
