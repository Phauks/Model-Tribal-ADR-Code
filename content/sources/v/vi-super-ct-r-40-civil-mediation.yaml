annotation: >-
  The Virgin Islands' original court-annexed civil mediation rule, adopted Oct. 14,
  1994, effective Nov. 16, 1994, and amended Oct. 12, 1995. A judge could refer any
  non-excluded matter to a mediator certified by the Presiding Judge (R. 40(b)(1)).
  Excluded matters included criminal actions, administrative appeals, forfeitures,
  habeas corpus and declaratory relief (R. 40(d)(2)). Certification criteria included
  20 hours of approved training, AAA certification, five years of V.I. bar practice,
  or a relevant master's degree (R. 40(b)(3)(A)). The rule gives a mediation privilege
  (R. 40(d)(4)) and refers to a confidentiality provision in "Title 5, Section 854
  of the Virgin Islands Code" (R. 40(c)(1)(D)). (project analysis) The court's website
  still posts this rule without a repeal note. The order adopting the V.I. Rules of Civil Procedure (effective March 31, 2017) repealed "all Rules of the Superior Court inconsistent with" them (Promulgation No. 2017-001, Apr. 3, 2017), and civil mediation is now governed by V.I. R. Civ. P. 90 (vi-r-civ-p-90-civil-mediation). (project analysis) The order repeals by inconsistency, not by rule number, but Rule 90 covers the same ground, so Rule 40 should be treated as superseded and cited only as history. 5 V.I.C. § 854 was not located or verified.
