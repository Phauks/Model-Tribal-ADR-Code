annotation: >-
  Opinion by Chief Justice Hodge construing V.I. R. Civ. P. 90, the current Superior
  Court mediation rule, which "applies only to court-ordered mediation in civil cases
  pending in the Superior Court" (¶ 16). The Court held that a mediated agreement
  can be enforced under Rule 90(h)(3) only if it was "reduced to writing and signed
  by the parties and their counsel" under Rule 90(h)(2) (¶ 17). Because one plaintiff
  never signed, the enforcement order was vacated and the claims reinstated. The
  opinion also quotes Rule 90's privilege provisions (90(d)(8)-(9), ¶ 20) and its
  mandatory sanctions for failing to appear or participate in good faith (90(f)(2),
  ¶ 31). (project analysis) This is the best current primary source on V.I. court
  mediation, and it shows why a code should spell out the formalities for mediated
  settlements. Note that the court's web page for this opinion carries a mismatched
  URL slug ('palton_vs__v_i_government').
