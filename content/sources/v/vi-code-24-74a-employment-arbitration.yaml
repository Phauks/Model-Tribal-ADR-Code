annotation: >-
  As quoted in Whyte v. Bockino, 69 V.I. 749, 757 n.5 (2018): "Notwithstanding an employment
  contract that provides for the use of arbitration to resolve a controversy arising
  out of or relating to the employment relationship, arbitration may be used to settle
  such a dispute only if" one party "submits a written request after the dispute arises"
  and the other "consents in writing not later than sixty (60) days after the receipt
  of the request" (subsec. (a)). An employer "may not require an employee to arbitrate
  a dispute as a condition of employment" (subsec. (b)). The Whyte footnote records
  the employee's concession that the FAA would preempt the section where the FAA applies,
  citing Allen v. HOVENSA, L.L.C., 59 V.I. 430, 442 n.2 (V.I. 2013). (project analysis)
  This is a territorial statute that allows only post-dispute arbitration in employment,
  in the same spirit as the federal Ending Forced Arbitration Act's narrower carve-out.
  In practice the FAA displaces it whenever the contract shows an interstate nexus,
  which Whyte says is a low bar. It is a useful design reference for a code that wants
  consent to arbitrate given after a dispute arises.
