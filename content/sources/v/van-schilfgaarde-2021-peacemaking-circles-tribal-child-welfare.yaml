annotation: Argues that tribal child welfare systems have been shaped by assimilation-era policy and federal funding rules, and proposes circle processes (peacemaking, family group decision-making) as a consensus-based alternative to adversarial hearings. Summarizes ICWA's tribal-role provisions and the barriers tribes face in accessing Title IV-E funds. Relevant to tribal dispute resolution design because it sets out how family and community circles could operate before or alongside court review. (project analysis)
