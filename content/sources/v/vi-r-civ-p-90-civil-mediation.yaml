annotation: >-
  The Superior Court's civil mediation rule. The V.I. Rules of Civil Procedure took effect March 31, 2017, and the order adopting them repealed "all Rules of the Superior Court inconsistent with" them (Promulgation No. 2017-001, Apr. 3, 2017). A judge may refer any civil matter to mediation except criminal actions, administrative appeals, forfeitures, habeas corpus and extraordinary writs, and matters a judge excludes by order (R. 90(b)-(c)). The first conference must be held within 60 days of referral, and mediation must end within 45 days of it and never take more than 90 calendar days (R. 90(d)(1), (d)(10)). Each party has a privilege not to disclose mediation communications, and everything said except an executed settlement agreement is inadmissible unless all parties agree (R. 90(d)(8)-(9)). A mediator may be disqualified on the grounds that would disqualify a judge under 4 V.I.C. § 284 (R. 90(e)(4)). An agreement must be in writing and signed by the parties and counsel, and the court may enforce it or enter judgment on it (R. 90(h)(2)-(3)). Mediators are certified or "qualified" by the presiding judge (R. 90(i)). Promulgation No. 2023-003 (July 14, 2023, effective Sept. 1, 2023) amended the rule. It added (d)(3a), which requires each party to name its attendees to the other parties five days ahead, on pain of good-faith sanctions. It allowed conferences "by electronic meeting technology" ((d)(5)), pointed the orientation's confidentiality item to (d)(8)-(9) ((e)(2)(D)), and rewrote (f). Under (f)(1), a party must attend in person or through a representative with full settlement authority, and an insured party's carrier must send one too. Under (f)(2), the court "shall impose sanctions" for failing to appear that way or to mediate in good faith. (project analysis) The rule closely follows the 1994 Superior Court Rule 40 (vi-super-ct-r-40-civil-mediation): the privilege and the mediator certification criteria carry over, and the exclusions are the same except that declaratory relief is no longer excluded. The 2023 rewrite of (f) is what Ocean Pest Control v. Rebelly, 2026 VI 5, applies.
