notes: 'Indigo Book citation: Act of Dec. 27, 2000, Pub. L. No. 106-568, 114 Stat. 2868 (2000). Its long title or contents: Omnibus Indian Advancement Act; title VII is the Shawnee Tribe Status Act of 2000 and title XIV the Graton Rancheria Restoration Act. Read the recognition or restoration section in the Statutes at Large PDF from govinfo.gov (text extracted with pdftotext); the Legal Information Institute''s notes to Title 25 of the United States Code give the same public law, date and page. Classified to Title 25 but omitted from the Code as being of special and not general application.'
