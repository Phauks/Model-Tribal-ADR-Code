annotation: >-
  The Puerto Rico Supreme Court's ADR rules, effective January 1, 1999 (Regla 10.01).
  Regla 2.01 creates the Negociado de Métodos Alternos para la Solución de Conflictos
  [Bureau of Alternative Methods of Conflict Resolution], attached to the Office
  of the Chief Justice. Regla 2.02(k) has it coordinate the court centers' mediation
  centers. Regla 1.03 defines mediación [mediation], arbitraje [arbitration, binding
  or non-binding] and evaluación neutral del caso [neutral case evaluation]. Courts
  may refer cases on their own initiative (Regla 3.02(a)). For mediation, only the
  initial orientation session is compulsory (Reglas 3.04(b)(1), 3.05(a)), and Regla
  7.01(b) leaves the choice to mediate with the parties. Regla 6.01 makes communications
  "confidencial y privilegiada" [confidential and privileged], with exceptions for
  child abuse and planned crimes. Regla 7.03 excludes certain criminal, civil-rights
  and public-interest cases. (project analysis) The mandatory-orientation and voluntary-mediation
  split is a useful middle path for a Tribal code.
