annotation: >-
  Robert B. Porter (Seneca Nation; at the time Director of the Tribal Law and Government
  Center at the University of Kansas) argues that adversarial Anglo-American litigation
  erodes Indigenous societies and that peacemaking strengthens Tribal sovereignty.
  He illustrates the argument with the Seneca Nation's internal conflict of 1994-95.
  Part III.A contrasts peacemaking with litigation along six axes. In footnote 126
  he notes the rise of 'alternative dispute resolution ("ADR") in the form of mediation,
  arbitration, and mini-trials', which in his view 'suggests the limitations of litigation
  even within American society'. (project analysis) Porter compares peacemaking with
  litigation and treats ADR as a reform within Anglo-American practice. That supports
  the project's choice to treat peacemaking as a separate track rather than a kind
  of ADR.
