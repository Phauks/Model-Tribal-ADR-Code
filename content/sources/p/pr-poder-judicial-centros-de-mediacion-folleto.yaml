annotation: >-
  A Judicial Branch public-education brochure, undated, describing the Centros de
  Mediación de Conflictos. It says they offer free, confidential, voluntary mediation
  for community, family, commercial, mortgage, interpersonal and labor disputes.
  Examples include debts, neighbor conflicts, landlord-tenant matters, child support
  and workplace harassment. Services can be requested online through the Tribunal
  Electrónico, in person, or by court referral. (project analysis) Online intake
  is the only basis for the online-dispute-resolution tag; the brochure does not
  describe online sessions. A related court document, 'Fui citado a CMC videoconferencia',
  appeared in search results but was not opened. Use this source for program description,
  not for legal rules.
