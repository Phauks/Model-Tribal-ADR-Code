notes: 'Indigo Book citation: Act of Sept. 18, 1978, Pub. L. No. 95-375, 92 Stat. 712 (1978). Its long title or contents: To provide for the extension of certain Federal benefits, services, and assistance to the Pascua Yaqui Indians of Arizona. Read the recognition or restoration section in the Statutes at Large PDF from govinfo.gov (text extracted with pdftotext); the Legal Information Institute''s notes to Title 25 of the United States Code give the same public law, date and page. Classified to Title 25 but omitted from the Code as being of special and not general application.'
