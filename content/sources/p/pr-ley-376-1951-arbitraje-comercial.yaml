annotation: >-
  Puerto Rico's arbitration statute from 1951 until Ley 147-2024 repealed it. The
  full title given here is the one quoted in Constructora Estelar v. Autoridad de
  Edificios Públicos, 2011 TSPR 139, at p. 2. That opinion says the Act "regula el
  arbitraje comercial en Puerto Rico" [governs commercial arbitration in Puerto Rico]
  (p. 36) and was modeled partly on the Federal Arbitration Act and on California
  and other state laws (pp. 36-37). Pre-2025 case law applies this Act, codified
  at 32 L.P.R.A. § 3201 et seq. (codification seen only in search results). (project
  analysis) It matters historically and for reading the large body of Puerto Rico
  arbitration case law decided under it.
