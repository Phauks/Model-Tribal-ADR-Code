annotation: >-
  Puerto Rico's arbitration statute from 1951 until Ley 147-2024 repealed it, codified
  at 32 L.P.R.A. §§ 3201-3229 (Title 32, Chapter 259). Section 3201 let two or more
  parties agree in writing to arbitrate an existing or future dispute, and made such
  an agreement "valid, requirable and irrevocable except for the grounds prescribed
  by law for the reversal of an agreement" (official English translation). Westlaw's
  Leyes de Puerto Rico Anotadas lists §§ 3201-3229 as "Derogadas" [repealed] by Ley
  147 of August 9, 2024, art. 5.01, effective 180 days after August 9, 2024. Constructora
  Estelar v. Autoridad de Edificios Públicos, 183 D.P.R. 1 (2011), says the Act "regula
  el arbitraje comercial en Puerto Rico" [governs commercial arbitration in Puerto
  Rico] and was modeled on California and other state laws, New York procedure and
  the Federal Arbitration Act (183 D.P.R. at 31). (project analysis) It matters historically
  and for reading the large body of Puerto Rico arbitration case law decided under
  it.
