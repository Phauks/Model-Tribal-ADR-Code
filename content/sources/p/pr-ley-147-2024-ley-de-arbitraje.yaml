annotation: >-
  Puerto Rico's current general arbitration statute. It repeals Ley Núm. 376 de 8
  de mayo de 1951 [Commercial Arbitration Act] and Ley 10-2012 [International Commercial
  Arbitration Act] (Exposición de Motivos; enacting clause). Chapters 1-3 follow
  the Revised Uniform Arbitration Act (called the "LUAR" in Spanish) and Chapter
  4 follows the UNCITRAL Model Law. The chapters are Cap. 1 (Arts. 1.01-1.16), Cap.
  2 "Arbitraje Ordinario" [ordinary arbitration] (Arts. 2.01-2.17), Cap. 3 "Proceso
  Arbitral Abreviado" [expedited arbitral process] (Arts. 3.01-3.18) and Cap. 4 "Arbitraje
  Comercial Internacional" [international commercial arbitration] (from Art. 4.01).
  Art. 2.03(a) makes a written agreement to arbitrate present or future disputes
  "válido, exigible e irrevocable" [valid, enforceable and irrevocable], except on
  grounds that void contracts. Art. 1.02 leaves other laws on arbitrability untouched.
  (project analysis) This is a rare U.S. example of one code that puts an RUAA-based
  domestic regime, an expedited track and a Model Law international chapter side
  by side. A Tribal code drafter could use that structure as a template. The OGP
  text is an unofficial compilation, so the exact wording should be checked against
  L.P.R.A.
