annotation: >-
  Resolution on certiorari from the Aibonito Superior Court in a contract and damages suit against the Municipality of Aibonito and others, where the defendants asked the court to dismiss and compel arbitration under the contracts' arbitration clause and Ley 147-2024. It is cited here for the codification of Ley 147-2024: the panel cites the act at 32 L.P.R.A. sec. 3230 et seq. (n.19), Art. 1.04 at 32 L.P.R.A. sec. 3230c (n.20), Art. 2.03 at 32 L.P.R.A. sec. 3231b (n.21) and Art. 2.05 at 32 L.P.R.A. sec. 3231d (n.32). It also restates that parties who agree to arbitrate must exhaust that remedy before going to court, citing Hope Tucker v. Money Group, LLC, 2026 TSPR 9.
