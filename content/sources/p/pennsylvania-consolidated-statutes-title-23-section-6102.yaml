notes: 'Indigo Book citation: 23 Pa. Cons. Stat. § 6102 (2026). History: (Oct. 6, 1994, P.L.574, No.85, eff. 60 days; Mar. 31, 1995, 1st Sp.Sess., P.L.985, No.10, eff. 60 days; June 22, 2001, P.L.576, No.39, eff. 60 days; Nov. 30, 2004, P.L.1618, No.207, eff. 60 days; Nov. 10, 2005, P.L.335, No.66, eff. 180 days; Oct. 9, 2008, P.L.1352, No.98, eff. 60 days; Oct. 12, 2018, P.L.519, No.79, eff. 180 days) 2018 Amendment. Act 79 added the defs. of "appropriate law enforcement agency" and "commercial armory" in subsec. (a). Act 79 shall apply to orders issued pursuant to 23 Pa.C.S. § 6108 on or after the effective date of section 11 of Act 79. 2008 Amendment. Act 98 amended the def. of "hearing officer" in subsec. (a). Section 10 of Act 98 provided that nothing in Act 98 shall be construed or deemed to provide arraignment court magistrates with retirement benefits or rights different from those availiable to bail commissioners immediately prior to the effective date of Act 98. 2005 Amendment. Act 66 amended the defs. of "confidential communications" and "hearing officer" and added the defs. of "firearm," "master for emergency relief," "other weapon," "safekeeping permit," "sheriff" and "weapon" in subsec. (a). 2004 Amendment. See section 29 of Act 207 in the appendix to this title for special provisions relating to construction of law. 2001 Amendment. Act 39 added the defs. of "certified copy," "comparable court" and "foreign protection order" in subsec. (a). 1995 Amendment. Act 10, 1st Sp.Sess., amended the def. of "abuse" in subsec. (a). Cross References. Section 6102 is referred to in sections 3701, 5322, 6702, 6711 of this title; sections 2711, 2718, 6102, 6105, 9158 of Title 18 (Crimes and Offenses); sections 1726.2, 5920, 8127, 9720.8, 9774.1 of Title 42 (Judiciary and Judicial Procedure); section 304 of Title 53 (Municipalities Generally). Text read from the Pennsylvania General Assembly''s page for the title of the Pennsylvania Consolidated Statutes (palegis.us/statutes/consolidated) on Nov. 27, 2026. Found by the state statutes sweep (terms: indian tribe; indian; tribe); AI reader''s verdict incidental: Foreign protection order definition includes orders from Indian tribes. Unverified.'
