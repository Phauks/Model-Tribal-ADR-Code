notes: Volume 27 of the Buffalo Historical Society Publications. Arthur C. Parker, an archaeologist of Seneca descent, wrote
  the tales down from Seneca tellers on the Cattaraugus and Tonawanda reservations, beginning in the winter of 1904-1905,
  and went over them with Edward Cornplanter (foreword). He says some versions are in his own words. Much of the
  book concerns medicine societies, the False Faces and witchcraft; the project uses none of it.
