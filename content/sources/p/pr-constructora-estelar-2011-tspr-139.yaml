annotation: >-
  Opinion by Juez Asociado Estrella Martínez restating the Puerto Rico Supreme Court's
  doctrine that "en Puerto Rico existe una vigorosa política pública a favor del
  arbitraje" [Puerto Rico has a vigorous public policy in favor of arbitration] (slip
  op. p. 35). It also holds that doubts about arbitrability are resolved in favor
  of arbitration. The Court describes Ley 376-1951 (pp. 2, 36). In footnote 50 it
  notes that the FAA "aplica a contratos en el comercio interestatal" [applies to
  contracts in interstate commerce]. It does not hold that the FAA applies generally
  in Puerto Rico. (project analysis) This is a citable statement of Puerto Rico's
  pro-arbitration policy, which predates Ley 147-2024.
