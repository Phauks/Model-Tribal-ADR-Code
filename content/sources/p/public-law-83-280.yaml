  Later history: Amended 1954, 1958 (Alaska), 1970 (Metlakatla) and 2010 (TLOA § 221(b), allowing federal
  concurrent jurisdiction on request) per LII credits for 18 U.S.C. § 1162. § 7 was replaced in 1968 by
  the tribal-consent provisions of ICRA title IV (25 U.S.C. §§ 1321–1326). The § 7 page (590) was inferred
  from the PDF. Westlaw: KeyCite 18 U.S.C. § 1162 and 28 U.S.C. § 1360.
law_box:
  summary: |-
    Gave five states, and later Alaska, criminal jurisdiction and civil adjudicatory jurisdiction over most Indian country in those states, and invited other states to assume jurisdiction without Tribal consent [@public-law-83-280, sec. 7].
