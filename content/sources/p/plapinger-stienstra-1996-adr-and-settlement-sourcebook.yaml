annotation: >-
  A joint project of the Federal Judicial Center and the CPR Institute for Dispute
  Resolution (title page), the FJC catalog page dates it January 1, 1996 and describes
  it as based "on a survey of the federal district courts and an analysis of their
  rules." Part II opens with "Definitions and Key Features of ADR and Settlement
  Processes in the Federal District Courts" covering arbitration, case valuation
  ("Michigan Mediation"), court minitrial, ENE, judge-hosted settlement conferences,
  mediation (distinguishing facilitative and evaluative), multi-door courthouse,
  settlement week, and summary jury trial, followed by district-by-district summaries.
  The District of Nevada entry describes an experimental "early case evaluation or
  triage hearings" program for in forma pauperis pro se prisoner cases and notes
  judges in Nevada and the Southern District of California conduct ENE sessions themselves.
  (project analysis) The best single source for consistent definitions of court-connected
  processes; several of its categories (case valuation, settlement week, multi-door)
  are not on the project's method list and are proposed below.
