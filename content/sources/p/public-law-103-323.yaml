notes: 'Indigo Book citation: Act of Sept. 21, 1994, Pub. L. No. 103-323, 108 Stat. 2152 (1994). Its long title or contents: To restore Federal services to the Pokagon Band of Potawatomi Indians. Read the recognition or restoration section in the Statutes at Large PDF from govinfo.gov (text extracted with pdftotext); the Legal Information Institute''s notes to Title 25 of the United States Code give the same public law, date and page. Classified to Title 25 but omitted from the Code as being of special and not general application.'
