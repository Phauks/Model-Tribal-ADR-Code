notes: >-
  The website's map draws towns, roads, water and borders from this basemap, cut to the United States and its territories up to zoom 12 (site/geography/map-tile-region.json; the build used is named in site/geography/map-tiles.json). The full world build is about 120 GB; the cut is about 2.2 GB.
