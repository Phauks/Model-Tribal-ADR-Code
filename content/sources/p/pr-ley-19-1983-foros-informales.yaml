annotation: >-
  The enabling statute for Puerto Rico's court-run community dispute forums. Art.
  1 authorizes "programas o centros que sirvan como foros informales" [programs or
  centers serving as informal forums]. Art. 2 has the Tribunal Supremo adopt the
  operating rules, and Art. 7 funds the program through the Judicial Branch budget.
  Art. 3(e) requires voluntary participation. Art. 4 calls for informal, non-adversarial
  handling close to the community, with neutrals who cannot impose sanctions. Art.
  5 makes case information privileged and confidential. Art. 4 was amended by Ley
  165-2014. (project analysis) This is a compact model of a legislature authorizing
  the judiciary to build community-based informal forums, a design a Tribal code
  could adapt.
