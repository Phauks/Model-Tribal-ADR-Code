notes: 'Indigo Book citation: Lumbee Fairness Act, Pub. L. No. 119-60, 139 Stat. 718 (2025). Its long title or contents: National Defense Authorization Act for Fiscal Year 2026; section 8803 is the Lumbee Fairness Act. Read the recognition or restoration section in the Statutes at Large PDF from govinfo.gov (text extracted with pdftotext); the Legal Information Institute''s notes to Title 25 of the United States Code give the same public law, date and page. Classified to Title 25 but omitted from the Code as being of special and not general application.'
