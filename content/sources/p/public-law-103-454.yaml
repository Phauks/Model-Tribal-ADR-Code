notes: 'Indigo Book citation: Act of Nov. 2, 1994, Pub. L. No. 103-454, 108 Stat. 4791 (1994). Its long title or contents: To provide for the annual publication of a list of federally recognized Indian tribes, and for other purposes; title II is the Tlingit and Haida Status Clarification Act and title III the Paskenta Band Restoration Act. Read the recognition or restoration section in the Statutes at Large PDF from govinfo.gov (text extracted with pdftotext); the Legal Information Institute''s notes to Title 25 of the United States Code give the same public law, date and page. Classified to Title 25 but omitted from the Code as being of special and not general application.'
