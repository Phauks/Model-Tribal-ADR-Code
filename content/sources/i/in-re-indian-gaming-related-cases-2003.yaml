notes: In re Indian Gaming Related Cases, 331 F.3d 1094 (9th Cir. 2003). The court affirmed denial of the tribe's
  motion, holding California did not bargain in bad faith by refusing a compact without the Revenue Sharing Trust
  Fund and related provisions, because the State offered meaningful concessions (exclusive class III gaming) in
  return for the fee demands. This is the "meaningful concessions" decision later applied in Rincon. Read on the
  original link through a page-fetch tool only; holding not checked word for word. Citator check (KeyCite) pending;
  see the project's Westlaw list.
