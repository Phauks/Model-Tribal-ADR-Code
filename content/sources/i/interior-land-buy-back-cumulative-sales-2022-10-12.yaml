notes: 'Indigo Book citation: U.S. Dep''t of the Interior, Land Buy-Back Program for Tribal Nations Cumulative Sales (Oct. 12, 2022). The Program''s last cumulative sales table, a month before its money ran out: for each nation by its full name and each round of offers, the landowners offered, offers made, landowners who sold, amount paid, fractional interests, equivalent acres and tracts. Six small locations show only rates (♦) to protect their few landowners. Rounds do not add up to the totals because a landowner offered in two rounds is counted once (the table''s notes 2 and 3). Read with pdftotext by scripts/tribes/land_buy_back.py.'
