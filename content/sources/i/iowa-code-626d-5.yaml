annotation: >-
  Iowa's statutory recognition rule for Tribal-court civil judgments (Iowa Code ch.
  626D, 'Recognition and Enforcement of Tribal Court Civil Judgments'; 2007 Acts
  ch. 192). Unobjected Tribal judgments are enforced like Iowa judgments. Recognition
  must be refused for lack of jurisdiction or due process, and may be refused on
  equitable grounds, including extrinsic fraud, a conflicting judgment, a contractual
  forum choice, non-reciprocity, and public-policy repugnance. (project analysis)
  It is included as a short, statute-form model that sits between Michigan's court-rule
  reciprocity and Washington's broad recognition rule.
