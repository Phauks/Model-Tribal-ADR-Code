notes: 'Indigo Book citation: U.S. Dep''t of the Interior, Land Buy-Back Program for Tribal Nations: Ten Years of Restoring Land and Building Trust 2012-2022 (2023). Interior''s final report on the Program, which carried out the land consolidation part of the Cobell settlement until its money ran out in November 2022. Its table "Sales and consolidation results by location" (pages 28 and 29) gives the amount paid, fractional interests and equivalent acres for each of the 53 locations, six of them in one row. That table prints 17 locations'' figures beside another location''s name (for example $44,429,584 paid at "Colville", where Interior offered about $25 million in all); scripts/tribes/land_buy_back.py keeps the names of the October 2022 cumulative sales table, whose figures agree with each other, and matches each figure row to the table row it continues (research/land-buy-back/locations.csv). Read with pdftotext.'
