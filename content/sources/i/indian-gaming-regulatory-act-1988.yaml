notes: >-
  Citations: Pub. L. No. 100-497; 102 Stat. 2467; 25 U.S.C. §§ 2701–2721; 18 U.S.C. §§ 1166–1168. Also
  read: https://www.law.cornell.edu/uscode/text/25/2710, https://www.law.cornell.edu/uscode/text/25/2701.
  Later history: § 2710 unchanged since enactment per LII credit line. The enforceability of the § 2710(d)(7)
  suit against non-consenting states turns on a 1996 Supreme Court decision; see the legal history timeline.
  The Secretarial-procedures regulation (25 C.F.R. Part 291) was not opened. Compact texts were not reviewed.
  Westlaw: KeyCite 25 U.S.C. § 2710; pull sample compact dispute-resolution clauses (NIGC/Interior compact
  library) separately.
law_box:
  summary: |-
    Created the three-class framework. A Class III compact may cover "the allocation of criminal and civil jurisdiction between the State and the Indian tribe" and "remedies for breach of contract" [@indian-gaming-regulatory-act-1988, sec. 11(d)(3)(C)]. If a state does not negotiate in good faith, the statute moves from court-ordered negotiation to a court-appointed mediator who picks one side's last best offer, then to Secretarial procedures [@indian-gaming-regulatory-act-1988, sec. 11(d)(7)(B)].
  reading:
    title: "Indian Gaming Regulatory Act (1988)"
    text: |-
      The gaming act is the main federal statute that writes a mediation step into relations between states and nations.
subjects: [gaming, dispute-resolution]
