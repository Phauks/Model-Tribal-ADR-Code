annotation: >-
  The Interagency ADR Working Group's site states that the group "was established
  by Presidential Memorandum dated May 1, 1998" to "assist federal agencies in developing
  and implementing ADR programs," that "The President appointed the Attorney General
  as the leader of the Interagency Working Group," and that its members are agency
  ADR professionals; the page links reports to the President, legislation, executive
  actions, and confidentiality guidance. (project analysis) The portal is the federal
  clearinghouse for agency ADR policy and reports and is where DOJ's archived ADR
  page now points (see doj-odr-fy2011-budget). Read through WebFetch only (direct
  connection failed), so quotes are as returned by that tool and should be re-checked.
