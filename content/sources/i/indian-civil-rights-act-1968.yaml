notes: >-
  Citations: Pub. L. No. 90-284, tits. II–VII; 82 Stat. 73, 77–81; 25 U.S.C. §§ 1301–1304 (title II);
  § 1311 (title III); §§ 1321–1326 (title IV). Also read: https://www.law.cornell.edu/uscode/text/25/1302,
  https://www.law.cornell.edu/uscode/text/25/1303, https://www.law.cornell.edu/uscode/text/25/1311. Later
  history: Sentencing caps raised to one year/$5,000 (Pub. L. 99-570, 1986) and, for enhanced sentencing,
  to three years/$15,000 per offense (TLOA, Pub. L. 111-211, § 234, 2010). § 1301 amended by the 1990–91
  'Duro fix'. § 1304 added by VAWA 2013 and amended by VAWA 2022 (LII credits). The title III model-code
  recommendation itself was not located. Westlaw: KeyCite 25 U.S.C. §§ 1301–1304; the legal history timeline
  covers judicial limits on remedies.
law_box:
  summary: |-
    Title II applies most Bill of Rights guarantees to Tribal governments by statute (25 U.S.C. § 1302). It makes federal habeas corpus available "to test the legality of his detention by order of an Indian tribe" [@indian-civil-rights-act-1968, sec. 203]. Title III directed the Interior Secretary to recommend "a model code to govern the administration of justice by courts of Indian offenses" [@indian-civil-rights-act-1968, sec. 301]. Several states measure Tribal judgments against its due-process standard (see the state rules below).
subjects: [government, tribal-courts]
