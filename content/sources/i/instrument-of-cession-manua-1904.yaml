notes: Read on the Office of the Historian site on Nov. 22, 2026. Executed at Faleula, Taʻu. The printed text reads "according to their custom" (singular); the Fitisemanu dissent quotes it as "customs." 48 U.S.C. § 1661(a) ratifies the cession "as of ... July 16, 1904."
