notes: >-
  Citations: Pub. L. No. 79-726; Act of Aug. 13, 1946, ch. 959, 60 Stat. 1049. Later history: The Commission
  was terminated in 1978 and its pending cases were transferred to the Court of Claims (statute not opened
  here). The § 2 page (1050) was inferred. The termination date and transfer were not verified from a
  primary source. Westlaw: Pull 25 U.S.C. § 70 et seq. (omitted) historical notes on Westlaw.
law_box:
  summary: |-
    Created a commission to hear claims against the United States, including "claims based upon fair and honorable dealings that are not recognized by any existing rule of law or equity" [@indian-claims-commission-act-1946, sec. 2]. Relief was money only.
  reading:
    title: "Indian Claims Commission Act (1946)"
    text: |-
      The commission is an early example of a special forum, outside the courts, for disputes between a nation and the United States.
