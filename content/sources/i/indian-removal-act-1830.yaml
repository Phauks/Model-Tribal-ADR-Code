notes: >-
  Citations: Act of May 28, 1830, ch. 148, 4 Stat. 411. Later history: Not formally repealed; its operative
  authority was exhausted by the removal treaties. No codified successor. Page break for § 3 (411 vs.
  412) not confirmed. The statute itself names no specific nation.
law_box:
  summary: |-
    Authorized the President to exchange lands west of the Mississippi for nations' lands in the states and to "solemnly assure" each nation that "the United States will forever secure and guaranty to them" the new country [@indian-removal-act-1830, sec. 3].
