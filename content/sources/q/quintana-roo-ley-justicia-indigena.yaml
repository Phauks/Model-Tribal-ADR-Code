annotation: State Indigenous justice law. Indigenous justice "es alternativa a la vía jurisdiccional ordinaria"
  (art. 6). Jueces tradicionales, appointed by the high court on the proposal of an Indigenous judicial council,
  must be "respetables de la comunidad, que dominen el idioma" (arts. 8-9); they apply customary law within constitutional
  guarantees and human rights (art. 10). Civil, family and listed criminal matters (arts. 14-17); serious crimes
  excluded (art. 18). Informal, oral, single-hearing procedure (art. 26); conciliation, then mediation, then arbitration
  "a conciencia y a verdad sabida" with res judicata effect (art. 27); conciliation and mediation "no se recomienda"
  in family violence (art. 27). A settlement is "homologado a una sentencia debidamente ejecutoriada" (art. 12).
  Fines, short arrest and community work as sanctions (arts. 20-21). Complaints to the magistrates for Indigenous
  affairs within three days (arts. 30-31).
