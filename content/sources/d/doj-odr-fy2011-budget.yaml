annotation: >-
  DOJ's FY 2011 budget justification for its Office of Dispute Resolution (ODR) states
  ODR's mission "to promote and facilitate the broad and effective use of alternative
  dispute resolution processes by the Department of Justice and throughout the Executive
  Branch" and records that Attorney General Order 1160.1 of April 6, 1995 created
  ODR. It describes ODR funding third-party neutrals when direct negotiation in government
  litigation is unproductive. A separate archived DOJ Office of Legal Policy page
  ("Updated July 24, 2020") reports DOJ ADR statistics through FY 2017 and directs
  readers to ADR.gov for current information (https://www.justice.gov/archives/olp/alternative-dispute-resolution-department-justice,
  read via fetch tool). (project analysis) Background on how the federal government's
  own litigator institutionalized ADR; the issue year (2010, for FY 2011) is inferred
  from the fiscal year and should be confirmed. ODR's current status after 2020 was
  not verified.
