notes: Read in the Caselaw Access Project copy on Nov. 22, 2026. No. 17-15719. Holds the 2000 political status plebiscite's "Native Inhabitants of Guam" voter limit invalid under the Fifteenth Amendment (at 843); mentions the Chamorro Land Trust only as background. KeyCite checked Nov. 22, 2026 (see citator).
