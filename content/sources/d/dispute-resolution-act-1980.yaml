annotation: >-
  The LII codification note for the Title 28 Appendix summarizes Pub. L. 96-190 (Feb.
  12, 1980), 94 Stat. 17, 'known as the Dispute Resolution Act'. The Act provided
  for mechanisms for resolving minor disputes. It created a Dispute Resolution Resource
  Center and a Dispute Resolution Advisory Board, authorized $1,000,000 a year (FY
  1980-1984) for the Center and Board and $10,000,000 a year (FY 1981-1984) for grants,
  and required an annual report by the Attorney General. (project analysis) This
  was Congress's attempt to scale up the Neighborhood Justice Center experiment nationally.
  A model Tribal code drafter can use it as a precedent for a funding-and-resource-center
  structure. Whether the grant money was ever appropriated was not verified here;
  check the Attorney General reports or later scholarship.
