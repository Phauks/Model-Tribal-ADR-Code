case_box:
  background: |-
    Albert Duro, an enrolled member of the Torres-Martinez Band of Cahuilla Mission Indians, lived for a time on the Salt River Reservation near Scottsdale, Arizona, home of the Salt River Pima-Maricopa Indian Community, and worked for a Tribal company. In 1984 he allegedly shot and killed a 14-year-old member of the Gila River Indian Community there. After a federal murder charge was dismissed, the Community charged him in its court with illegally firing a weapon, and he challenged its jurisdiction over a nonmember [@duro-v-reina, pp. 679-681].
  question: |-
    May a Native nation exercise criminal jurisdiction over an Indian who is not one of its members?
  holding: |-
    No. The Court held that a Tribe's retained sovereignty does not include authority to impose criminal sanctions on a nonmember Indian.
  quotes:
  - text: "... the retained sovereignty of the tribe as a political and social organization to govern its own affairs does not include the authority to impose criminal sanctions against a citizen outside its own membership ..."
    pinpoint: "p. 679"
  treatment: |-
    Superseded by statute: soon after *Duro*, Congress amended the Indian Civil Rights Act (25 U.S.C. § 1301(2)) to recognize inherent Tribal power to prosecute all Indians; *United States v. Lara* (2004) upheld that "Duro fix." [@united-states-v-lara]
  topics:
  - "Tribal courts"
  - "Criminal jurisdiction"
  reading:
    title: "*Duro v. Reina* (1990)"
    text: |-
      Historical example of Congress restoring Tribal jurisdiction after an adverse decision.
subjects: [criminal, jurisdiction]
