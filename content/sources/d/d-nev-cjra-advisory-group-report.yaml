annotation: >-
  Scanned CJRA advisory-group report and plan summary for the District of Nevada
  (no issue date printed in the extracted text; it states "Implementation will begin
  December 1, 1993"). It notes that the state "contains over 25 Native American Reservations"
  as a factor shaping litigation, directs a Special Study Committee to examine ADR
  alternatives to the prisoner grievance system, and reports on § 473(a)(6) that
  ADR "referral authority already exists under local rules" and that the court was
  "considering arbitration." (project analysis) Historical context for Nevada federal
  court ADR and an early official acknowledgment that Tribal reservations shape the
  district's docket.
