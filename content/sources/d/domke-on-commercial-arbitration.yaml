annotation: >-
  The standard U.S. commercial arbitration treatise (3d ed., currently the 2026-2027
  annual edition per the Thomson Reuters store; authors listed as Gabriel M. Wilner,
  Larry Edmonson, and Martin Domke). Its coverage includes arbitration agreements,
  arbitrability, arbitrators, hearings, awards, and confirming and enforcing awards,
  including 'intrastate enforcement of award' and international enforcement. Georgetown's
  ADR treatise guide links it to Westlaw database 'DCMLARB' and also to Bloomberg
  Law. (project analysis) Use it for the award-confirmation, vacatur, and enforcement
  mechanics a Tribal arbitration chapter must address.
