annotation: >-
  The District of Nevada's Local Rules (cover date April 17, 2020, adopted by General
  Order 2020-07; this is the version linked from the court's Rules and Orders page
  as of retrieval) authorize settlement conferences and other ADR and the Short Trial
  Program (General Order 2013-01) under LR 16-5, with a confidentiality rule, and
  require early neutral evaluation by a magistrate judge for all employment-discrimination
  actions under LR 16-6, generally within 90 days after the first responding party
  appears. LR 16-6(g) lists the evaluating magistrate judge's duties, including assessing
  strengths and weaknesses and, "When appropriate," assisting settlement through
  private caucusing. (project analysis) Nevada is the project's example state; this
  is a concrete, judge-run ENE model with a detailed confidential evaluation-statement
  requirement that a Tribal court could adapt for employment disputes involving Tribal
  enterprises.
