case_box:
  background: |-
    In 1900 Congress passed the Foraker Act, which set up a temporary civil government for Puerto Rico and provided revenues for it, including duties on goods shipped from the island. S. B. Downes & Co. paid $659.35 in duties under protest on oranges brought from San Juan to New York in November 1900 and sued the collector of the port of New York to recover them [@downes-v-bidwell-1901, p. 247].
  question: |-
    Was Puerto Rico, after its cession by Spain, part of "the United States" for the Constitution's rule that duties be uniform throughout the United States?
  holding: |-
    No. A duty on goods shipped from Puerto Rico to New York under the Foraker Act was upheld. No opinion spoke for a majority. Justice White's concurrence, joined by Justices Shiras and McKenna, set out the distinction between territories incorporated into the United States and those merely belonging to it, which later decisions adopted.
  quotes:
  - text: "[F]oreign to the United States in a domestic sense, because the island had not been incorporated into the United States, but was merely appurtenant thereto as a possession."
    parenthetical: "White, J., concurring"
  treatment: |-
    The opinion does not use the word "unincorporated." Congress later wrote that word into the organic laws, declaring Guam "an unincorporated territory of the United States" in 1950 [@usc-48-1421a]. Essays edited by Gerald Neuman and Tomiko Brown-Nagin reassess the Insular Cases [@neuman-brown-nagin-reconsidering-the-insular-cases-2015].
