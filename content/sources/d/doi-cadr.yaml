annotation: >-
  Interior's CADR serves the Department's dealings with, among others, "federal,
  state, tribal and local government entities" and lists its services with short
  definitions: consultation, conflict coaching, leadership coaching, training, facilitated
  conversation, mediation, facilitation, negotiated rulemaking, and situation or
  conflict assessment. Subpages describe an organizational ombuds for DOI employees
  (https://www.doi.gov/pmb/cadr/ombuds), "External Collaboration and Conflict Resolution"
  (ECCR) on natural and cultural resources (https://www.doi.gov/pmb/cadr/programs/natural-resources),
  and "Collaboration and Consensus Seeking Services for DOI Bureaus, Offices and
  Tribal Nations" with government-to-government consultation resources (https://www.doi.gov/pmb/cadr/programs/native).
  The Authorities page lists the ADRA of 1996, the "Negotiated Rulemaking Act of
  1996" (sic; the Act dates from 1990 and was made permanent in 1996), the ADR Act
  of 1998, and the Contract Disputes Act. (project analysis) Interior is the federal
  department Tribes deal with most, so CADR's menu shows what federal ADR a Tribe
  can request; it also supplies definitions for conflict coaching, facilitated conversation,
  and conflict assessment proposed as new methods below.
