    locator: SECTION 15.0. AMENDMENTS; RENEGOTIATIONS, Sec. 15.1 to 15.3
    summary: The compact may be amended at any time by mutual written agreement with each party voluntarily consenting
      to the negotiation; no sooner than eighteen months before the termination date either party may request negotiations
      to extend or replace it, with automatic one-year and then two-year extensions in stated circumstances, and
      requests must be in writing with a schedule set within 45 days.
