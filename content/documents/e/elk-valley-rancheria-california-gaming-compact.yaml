  changes:
  - topic: dispute-resolution
    compared_with: 2000-original
    change: changed
    summary: The earlier compact provides written notice, a meeting within 10 days, then optional AAA arbitration
      (neither party required to agree) held on Tribal land, and federal or state court; the later compact provides
      written notice, a written response within 15 days, a meeting within 30 days, then optional arbitration (neither
      party required to agree) before a JAMS arbitrator, and federal or state court with the Section 13.4 remedies
      as the sole remedies and no damages or attorney fees.
