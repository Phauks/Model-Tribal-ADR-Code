    summary: After written notice, a written response within 15 days and a meet-and-confer within 30 days, either
      party may seek arbitration before a JAMS arbitrator (neither party need agree, and either may invoke the JAMS
      optional appeal), and unresolved disputes may be heard in the U.S. District Court for the district of the
