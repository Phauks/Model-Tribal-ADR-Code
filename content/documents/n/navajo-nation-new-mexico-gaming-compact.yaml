  - topic: renegotiation
    locator: SECTION 14. Entire Agreement.
    summary: The compact may be amended only by a written instrument signed by the Native nation and the State and
      approved by the Secretary of the Interior, with approval of the Native nation, the Governor and the State
      Legislature; the excerpt sets no reopening trigger or time limit.
    verification: read-in-full
    reviewer: small model, first pass
  changes:
  - topic: dispute-resolution
    compared_with: 2004-original
    change: changed
    summary: The 2015 compact keeps the notice, stop-or-arbitrate election and final and binding attorney arbitration,
      and adds a two-year window to start the procedure (and a two-year State window for pre-effective-date payment
      breaches), lets the parties agree in writing to a single arbitrator, sets 30-day periods for choosing arbitrators
      (a non-responding party is bound to proceed with the other's single arbitrator), and lengthens the third-arbitrator
      period from 10 to 30 days.
