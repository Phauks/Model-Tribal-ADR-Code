  - topic: dispute-resolution
    locator: SECTION 13.0. DISPUTE RESOLUTION PROVISIONS, Sec. 13.1 Voluntary Resolution; Court Resolution and Sec.
      13.2 Arbitration Rules
    summary: Disputes under these Secretarial Procedures begin with a written notice, a written response within
      15 days and a meet-and-confer within 30 days; if unresolved either party may seek arbitration before JAMS,
      but neither party is required to agree to arbitrate, and unresolved disputes may be brought in the federal
      district court for the district of the Gaming Facility or, if that court lacks jurisdiction, a state court
      of competent jurisdiction in the county. Sec. 13.4 limits remedies to injunctive relief, specific performance
      and declaratory relief.
    methods:
    - negotiation
    - nonbinding-arbitration
    verification: read-in-full
    reviewer: larger model, second pass, whole document
  - topic: renegotiation
    locator: SECTION 15.0. AMENDMENTS; RENEGOTIATIONS, Sec. 15.1 to Sec. 15.3
    summary: The procedures may be superseded by a Class III compact agreed by the Tribe and the State (Sec. 15.1),
      are subject to amendment if the Tribe wishes to engage in other authorized forms of Class III gaming but not
      within 12 months of the effective date (Sec. 15.2), and written requests to negotiate a new compact are governed
      by IGRA (Sec. 15.3).
    verification: read-in-full
