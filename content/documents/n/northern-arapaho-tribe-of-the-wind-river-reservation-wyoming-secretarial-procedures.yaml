  - topic: dispute-resolution
    locator: III. OPERATION OF GAMING FACILITIES, C. Resolution of Gaming Disputes; VIII. THIRD-PARTY RIGHTS
    summary: The procedures provide only that patron gaming disputes are resolved under the Northern Arapaho Gaming
      Code, tribal law and regulations, with review by a person separate from the initial decider; they set out
      no dispute procedure between the Tribe and a State, and they give no one other than the Tribe or the United
      States standing to enforce them.
    verification: read-in-full
    reviewer: larger model, second pass, whole document
  - topic: renegotiation
    locator: XI. AMENDMENTS; IX. EXPANSION OR CONTRACTION OF CLASS III GAMING
    summary: The Tribe may request amendments in writing to the Secretary, who may disapprove only on stated grounds,
      with deemed approval after 45 days to the extent consistent with IGRA; Section IX calls for amendment if expansion
      or contraction of Class III gaming occurs by law, ruling, or another Wyoming compact.
    verification: read-in-full
    reviewer: larger model, second pass, whole document
