  - topic: renegotiation
    locator: 10. Duration
    summary: The compact is subject to review at ten-year intervals, and either party may give written notice of
      provisions to review before the period expires, after which the parties have 180 days to negotiate.
    verification: read-in-full
    reviewer: small model, first pass
    note: A small model read excerpts of this document and marked it hard; check against the text.
  changes:
  - topic: dispute-resolution
    compared_with: 2000-restatement
    change: changed
    summary: The earlier compact provides that, if the Tribal Gaming Commission disagrees with a State suitability
      determination, a three-person binding Arbitration Board decides it (one member chosen by each commission and
      one jointly), with appeal to federal district court if permitted by law; Section 11.1 lets either party sue
      in federal district court over interpretation disputes. The later compact provides a revised board (the two
      commission chairs or designees plus a jointly selected third member), a notice-and-hearing procedure within
      45 days, and a decision that is final and non-reviewable; the federal-court interpretation clause continues
      as Section 13.1.
    locator_before: Sec. 7 (suitability arbitration); Sec. 11.1
    locator_after: Sec. 7 (suitability arbitration); Sec. 13.1
    verification: read-in-full
    reviewer: larger model, second pass on the full text
  - topic: renegotiation
    compared_with: 2000-restatement
    change: changed
    summary: Section 10 now sets review at ten-year intervals, not four-year intervals, and automatic extensions
      run for ten years. The notice, 180-day negotiating period, extension and termination mechanics, and the substantial-breach
      termination right are otherwise the same in the excerpt.
    locator_before: Section 10
    locator_after: Section 10
    verification: read-in-full
    reviewer: small model, version comparison
