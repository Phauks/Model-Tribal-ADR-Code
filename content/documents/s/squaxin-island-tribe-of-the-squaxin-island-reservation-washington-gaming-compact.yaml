  - topic: renegotiation
    locator: XV.D Amendments/Renegotiations (1) to (7)
    summary: The compact allows amendment by mutual written agreement, and requires renegotiation on the Tribe's
      written request when state law or a court decision expands gaming or the Tribe wishes other Class III games;
      the State may request renegotiation of health, safety or environmental sections, and the original terms stay
      in effect until the parties agree.
