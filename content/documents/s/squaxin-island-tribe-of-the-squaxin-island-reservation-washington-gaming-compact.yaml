  - topic: dispute-resolution
    compared_with: 1993-original
    change: changed
    summary: The 1993 compact provides written notice, a meeting within 10 days, then, if unresolved after 20 days,
      arbitration that either party may seek before JAMS, with a hearing within 14 days and a decision that is final
      and unappealable. The restated compact provides a meet-and-confer within 20 business days, formal mediation
      by agreement, and arbitration only by mutual agreement, with a decision that is final for the non-judicial
      phase but may be subject to judicial review; it adds that a disputed regulatory fee goes to the Compact's
      binding arbitration.
