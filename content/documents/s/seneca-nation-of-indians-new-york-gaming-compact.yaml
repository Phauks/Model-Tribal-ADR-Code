    locator: 16. AMENDMENT AND MODIFICATION, (a) Amendment and modification
    summary: The compact and appendices may be amended by written agreement; either party may request an amendment
      in writing, the parties must meet within thirty days and negotiate in good faith, and a request by the Native
      nation is treated as a request to negotiate under 25 U.S.C. 2710(d) without terminating the compact on impasse;
