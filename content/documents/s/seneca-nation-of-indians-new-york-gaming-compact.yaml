    locator: 14. PARTY DISPUTE RESOLUTION, (b) Negotiation; (c) Method of dispute resolution
    summary: Either party gives written notice of a claim, the parties meet within fourteen days and negotiate in
      good faith, and if not resolved within thirty days after the meeting either party may submit the dispute to
      binding arbitration before three arbitrators under American Arbitration Association rules, with monetary damages
      excluded and enforcement only in the U.S. District Court for the Western District of New York.
