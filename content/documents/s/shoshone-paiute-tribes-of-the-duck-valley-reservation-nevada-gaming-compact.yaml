    locator: ARTICLE XIV. DEFAULT AND TERMINATION, 1. Default; ARTICLE IV. LIMITED WAIVER OF SOVEREIGN IMMUNITY
    summary: Disputes under the compact are to be resolved in a federal court of competent jurisdiction under the
      limited waiver in Article IV; for substantial and continuing default, the alleging party gives written notice
      demanding cure within sixty days, the parties then meet within thirty days, and if unresolved thirty days
