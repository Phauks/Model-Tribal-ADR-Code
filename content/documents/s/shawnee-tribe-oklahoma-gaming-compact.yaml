    locator: Part 15. DURATION AND NEGOTIATION, B.
    summary: Within 180 days before the term or any renewal expires, either the Native nation or the State, through
      its Governor, may request to renegotiate the payment terms in subsections A and E of Part 11; the Native nation
      may also change standards by written notice after amendments to the State-Tribal Gaming Act.
