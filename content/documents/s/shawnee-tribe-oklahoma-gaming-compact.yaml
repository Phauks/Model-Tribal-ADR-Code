  - topic: dispute-resolution
    locator: Part 12. DISPUTE RESOLUTION
    summary: A party asserting noncompliance serves written notice and the parties' representatives meet within
      thirty days; either party may then refer the dispute to arbitration under American Arbitration Association
      rules before one arbitrator, remedies are limited to enforcement of the compact, and either party may seek
      de novo review of the award in federal district court.
    methods:
