    pages: 102
  clauses:
  - topic: dispute-resolution
    locator: C. Dispute Resolution, items 1 to 7; L. Certification Decisions - Dispute Resolution for Tribal Members
    summary: The compact provides for written notice, a meet-and-confer within ten days, then arbitration by the
      American Arbitration Association of Seattle whose decision is final and unappealable, with the Judicial Arbitration
      and Management Service of Seattle as a substitute if AAA ceases to provide the services; the Tribe bears the
      arbitration costs of certification disputes.
    methods:
    - negotiation
    - arbitration
    verification: read-in-full
    reviewer: small model, older version
    note: A small model read excerpts of this document and marked it hard; check against the text.
  - topic: renegotiation
    locator: XIV.D Amendments/Renegotiations (1) to (7)
    summary: The compact allows amendment by mutual written agreement and requires the parties to amend or renegotiate
      on the Tribe's written request when state law or a court decision expands gaming, when another Washington
      tribe obtains greater gaming levels, or when the Tribe wishes other Class III games; either party may request
      renegotiation after thirty-six months, and the State may request renegotiation of listed sections, with mandatory
      and binding resolution under Section XI.C if talks fail.
    verification: read-in-full
    reviewer: small model, older version
    note: A small model read excerpts of this document and marked it hard; check against the text.
