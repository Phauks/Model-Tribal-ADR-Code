  changes:
  - topic: dispute-resolution
    compared_with: 1993-original
    change: changed
    summary: The 1993 compact provides notice and a 30-day meeting, then after 90 days only a State cease-gaming
      notice (to which the Tribe may respond by invoking AAA arbitration with a three-arbitrator panel) or a Tribe-invoked
      arbitration, with any other available remedy including federal court. The 1999 compact provides that after
      90 days either party may pursue any available remedy, listing arbitration, an action in the federal district
      court in North Dakota, or any other remedy, keeps the State cease notice and Tribe-invoked arbitration, and
      adds that either party may sue in federal court to enforce an arbitration determination.
    locator_before: Section 15(a)-(c)
    locator_after: Article XXVIII, 28.1-28.5
    verification: read-in-full
    reviewer: larger model, second pass on the full text
  - topic: renegotiation
    compared_with: 1993-original
    change: changed
    summary: Under the 1999 replacement, Article XXXIV lets either party request amendment or negotiations at any
      time on proper notice, requires good-faith negotiation with a determination within 90 days, and says amendments
      take effect only when both parties agree and, if necessary, the Secretary of the Interior approves them. The
      1993 Section 2.2 instead required a written request by certified mail to the Governor and set a 180-day term,
      and kept the compact in effect until renegotiated. The 1999 excerpts do not show a counterpart to 1993 Section
      2.3.
    locator_before: Section 2.2
    locator_after: XXXIV
    verification: read-in-full
    reviewer: small model, version comparison
