      adds that if the Sisseton-Wahpeton Oyate offers new games using new technologies, such as mobile or online
      gaming, the parties will cooperate in good faith to negotiate procedures and protocols. The approval letter
      says the amendment waives the State's Eleventh Amendment immunity if the parties negotiate a successor compact,
