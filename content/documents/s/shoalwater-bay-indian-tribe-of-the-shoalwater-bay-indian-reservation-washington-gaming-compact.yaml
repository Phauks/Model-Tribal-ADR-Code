    summary: 'The 2015 amendment''s optional Addendum adds a step for disputes over the Player Terminal allocation:
      the State and the Native nation must meet and attempt to resolve the dispute at least 30 days before the increased
      allocation takes effect, after which either or both may use the Compact''s dispute resolution provisions.
      The earlier compact already provided in Section XII.C for notice, a meeting within ten days, and AAA arbitration
