    change: changed
    summary: The earlier compact already provides in Section 12 a 20-day period to resolve a dispute informally,
      then arbitration by a three-arbitrator AAA panel that declares the parties' rights and can enjoin violations,
      by which the Tribe and State agree to be bound. The later compact keeps that and adds a step in which the
      parties first try to agree on a single arbitrator, with the three-arbitrator AAA panel used only if they cannot
      agree, and a scheduling conference on discovery.
