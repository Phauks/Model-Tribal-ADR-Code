  changes:
  - topic: dispute-resolution
    compared_with: 2000-original
    change: changed
    summary: Both compacts require written notice, a meeting, voluntary arbitration and then court. The later compact
      provides a written response within 15 days and a meeting within 30 days of notice (the earlier required a
      meeting within 10 days and arbitration 30 days after the first meeting), JAMS rather than AAA arbitration,
      state or federal court proceedings in the district or county of the Gaming Facility, and remedies limited
      to those in Section 13.4.
    locator_before: Sec. 9.0-9.2
