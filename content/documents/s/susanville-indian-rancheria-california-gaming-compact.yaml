    locator: Sec. 9.1 Voluntary Resolution; Reference to Other Means of Resolution (Secs. 9.2-9.3 also)
    summary: Disputes first go through written notice and a good-faith meet-and-confer, then either party may seek
      AAA Commercial Rules arbitration with a binding award (neither party must agree to arbitrate), and otherwise
