  changes:
  - topic: dispute-resolution
    compared_with: 1992-original
    change: changed
    summary: The 1992 compact provides notice, a 30-day meeting, a State cease-gaming notice after 90 days (to which
      the Tribe may respond by invoking AAA arbitration) or a Tribe-invoked arbitration, and otherwise any available
      remedy including an action in federal district court in North Dakota. The 1999 compact keeps those steps,
      lists arbitration as one of the remedies either party may pursue after 90 days, makes the procedure mandatory
      ('shall invoke' rather than 'may invoke'), and adds that either party may sue in federal court to enforce
      an arbitration determination.
    locator_before: Sec. 15(a)-(b)
    locator_after: Art. XXVIII, 28.1-28.5
    verification: read-in-full
