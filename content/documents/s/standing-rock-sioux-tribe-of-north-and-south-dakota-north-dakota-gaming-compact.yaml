  - topic: renegotiation
    compared_with: 1992-original
    change: changed
    summary: The earlier Section 2.2 lets either party request renegotiation in writing by certified mail, keeps
      the compact in effect, and sets a 180-day negotiation term; the later Section XXXIV lets either party request
      amendment or negotiations on notice, requires good-faith negotiation and a determination within 90 days, and
      makes amendments effective only with mutual agreement and any required Secretary approval; the later duration
      provision is not in the excerpts.
    locator_before: '2.2'
    locator_after: XXXIV
