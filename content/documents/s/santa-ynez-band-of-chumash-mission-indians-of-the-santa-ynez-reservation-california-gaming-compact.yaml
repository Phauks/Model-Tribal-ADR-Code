  changes:
  - topic: dispute-resolution
    compared_with: 2000-original
    change: changed
    summary: The earlier compact provides written notice, a meet-and-confer within 10 days, and after 30 days optional
      arbitration before an AAA arbitrator (neither party required to agree), then federal court. The later compact
      provides written notice, a 15-day written response, a 30-day meet-and-confer, optional arbitration under JAMS
      rules, then federal or state court with remedies limited to those in Section 13.4(a)(ii) and no damages or
      attorney fees; it also adds Section 11.8, under which either party may demand binding JAMS arbitration if
      no intergovernmental agreement on a Project is reached within 75 days of the Final TEIR.
    locator_before: Sec. 9.1-9.2
    locator_after: Sec. 13.1-13.2; Sec. 11.8
    verification: read-in-full
    reviewer: larger model, second pass on the full text
  - topic: renegotiation
    compared_with: 2000-original
    change: changed
    summary: 'The 2015 compact adds a reopening right in Section 5.2(f): either party may request renegotiation,
      limited to the Section 5.2(a) payments, if the Revenue Sharing Trust Fund or Tribal Nation Grant Fund balance
      exceeds or falls short of what is reasonably required, and the other party may decline. The 2000 compact''s
      renegotiation terms (Section 12.2, renegotiation for new forms of Class III gaming after 12 months, and Section
      12.3) are not shown in the 2015 excerpts.'
    locator_before: '12.2'
    locator_after: 5.2(f)
    verification: read-in-full
    reviewer: small model, version comparison
