    change: changed
    summary: The 2008 compact provides notice and a 30-day meeting, AAA mediation of up to 60 days, then a State-only
      court action (federal court or Broward County) with a Tribe-only waiver of immunity, and lets the Tribe invoke
      AAA arbitration under Appendix S with a decision not enforceable in court and subject to de novo State review.
      The 2010 compact keeps the notice, meeting and mediation steps, lets either party sue in federal court or
      Broward County court, makes the immunity waiver mutual, and no longer contains the Tribe-invoked arbitration.
