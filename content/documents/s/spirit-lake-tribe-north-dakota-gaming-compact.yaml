  changes:
  - topic: dispute-resolution
    compared_with: 2013-restatement
    change: changed
    summary: The earlier compact provides notice, a 30-day meeting, and after 90 days any available remedy including
      arbitration (Tribe-invoked arbitration with a three-arbitrator panel under 28.3-28.4) or a federal court action
      in North Dakota. The later compact keeps the notice and meeting, then after 90 days requires the parties to
      try AAA-administered mediation in Bismarck first, and after mediation fails or 180 days each party gives a
      limited immunity waiver for a federal court action in North Dakota; the arbitration subsections are not in
