  changes:
  - topic: dispute-resolution
    compared_with: 1995-original
    change: changed
    summary: The 1995 compact provides a 10-day meet-and-confer, mediation, and arbitration before JAMS that either
      party may seek, mandatory and binding for provisions referencing Section XII.B.3.b and otherwise reviewable
      de novo in federal court. The 2020 restated compact provides a meet-and-confer within 20 business days, mediation
      and arbitration only by mutual agreement, and an arbitrator's decision that is final for the non-judicial
      phase but subject to judicial review, with judicial resolution available if mediation is unsatisfactory.
