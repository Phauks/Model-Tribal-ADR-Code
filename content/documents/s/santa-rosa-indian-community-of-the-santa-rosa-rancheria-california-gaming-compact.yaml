  clauses:
  - topic: dispute-resolution
    locator: Sec. 13.1. Voluntary Resolution; Court Resolution; Sec. 13.3; Sec. 13.5. Judicial Remedies for Material
      Breach
    summary: The parties give written notice, respond within 15 days and meet and confer within 30 days; unresolved
      disputes may be heard in the U.S. District Court for the district of the gaming facility or, if it lacks jurisdiction,
      in a state court in the County, with remedies limited to injunctive relief, specific performance and declaratory
      relief, and an action for declaration of material breach and possible termination is available after the dispute
      process.
    methods:
    - negotiation
    verification: read-in-full
    reviewer: larger model, second pass, whole document
  - topic: renegotiation
    locator: Sec. 15.0. AMENDMENTS; RENEGOTIATIONS, Sec. 15.1 to 15.4
    summary: The compact may be amended at any time by mutual written agreement; either party may request negotiations
      no sooner than eighteen months before the termination date, the State must negotiate on request within 45
      days on changed market conditions, and the parties must negotiate replacements after a court-ordered change-in-law
      invalidity.
    verification: read-in-full
    reviewer: larger model, second pass, whole document
  changes:
  - topic: dispute-resolution
    compared_with: 2000-original
    change: changed
    summary: The earlier compact provides written notice, a meet-and-confer within 10 days, and, after 30 days,
      optional arbitration under AAA rules (neither party required to agree) with a binding decision, then federal
      court. The later compact provides written notice, a 15-day written response and a 30-day meet-and-confer,
      then resolution in federal or state court with no arbitration step, limits the parties to the remedies in
      its Section 13.4(a)(ii), and bars damages and attorney fees in such actions.
