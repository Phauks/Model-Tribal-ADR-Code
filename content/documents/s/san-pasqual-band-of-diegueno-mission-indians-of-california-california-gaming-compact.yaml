    summary: The compact may be amended at any time by mutual written agreement, and the Tribe may request renegotiation
      in writing to offer Class III games not authorized in the compact, but not within 12 months of the effective
      date; the parties set a negotiation schedule within 30 days of the request, under IGRA good-faith standards
      enforceable in federal court.
