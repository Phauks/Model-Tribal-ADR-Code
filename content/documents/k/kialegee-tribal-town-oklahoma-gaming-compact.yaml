    change: changed
    summary: 'The 2020 compact provides a two-step process for disputes between the Tribe and the State: mandatory
      mediation with an agreed mediator (unless irreparable harm requires direct injunctive action), then litigation
      in federal court if mediation fails, with limited sovereign immunity waivers and venue in the district where
      events occurred. The 2011 compact provided written notice, a meeting within 30 days, and arbitration under
      AAA rules before one arbitrator at either party''s request, with de novo review of the award in federal court.'
