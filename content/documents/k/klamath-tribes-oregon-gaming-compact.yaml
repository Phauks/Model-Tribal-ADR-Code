  - topic: renegotiation
    locator: SECTION 12. EFFECTIVE DATE; TERMINATION; AMENDMENTS, subsection D. Amendments
    summary: The compact cannot be amended for three years after its effective date unless a listed condition occurs,
      such as another state compact expanding gaming or a state law expansion, or the parties agree in writing;
      either party may then request negotiations and the compact stays in effect meanwhile.
    verification: read-in-full
    reviewer: small model, first pass
  changes:
  - topic: dispute-resolution
    compared_with: 1995-original
    change: changed
    summary: In the later compact the expedited procedure in Section 6.B.5 now has the State send its notice to
      the Tribal Gaming Regulatory Commission with the specific action it believes necessary, makes the Tribes follow
      the State's recommendation unless the Commission finds it would harm gaming integrity, and allows a federal
      court action if the concern is not resolved informally within ten days. The earlier compact let the State
      sue in the District of Oregon if not resolved informally after a five-day conference, with no recommendation
      step. The 6.B.1-4 steps (15-day meeting, non-binding arbitration) and Section 16 (30-day meeting, 90 days,
      then court) are the same.
