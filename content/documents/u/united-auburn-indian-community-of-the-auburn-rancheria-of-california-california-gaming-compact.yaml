    summary: The later compact adds a written response within 15 days and sets the meeting at 30 days after notice
      (the earlier required a meeting within 10 days), and provides court proceedings in the federal district where
      the Gaming Facility is located or a state court in the County, with the Section 9.4(a)(2) remedies as the
      sole remedies and no damages or attorney fees. Voluntary arbitration 30 days after the first meeting is retained,
      but the earlier reference to failure to negotiate in good faith claims and the Ninth Circuit is gone.
