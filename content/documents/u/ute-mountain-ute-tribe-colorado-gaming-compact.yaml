    locator: SECTION 9. REMEDY FOR BREACH OF COMPACT PROVISIONS-ARBITRATION, A and B
    summary: A complaining party gives written notice and the parties have twenty days to resolve it informally;
      the complaining party may then invoke arbitration before one agreed arbitrator or a three-arbitrator panel
      under American Arbitration Association commercial rules, the matter may not be litigated in court once arbitration
      is invoked, and the Tribe and the State agree to be bound by the panel's decision.
