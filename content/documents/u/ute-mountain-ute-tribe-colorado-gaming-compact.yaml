  changes:
  - topic: dispute-resolution
    compared_with: 1992-original
    change: changed
    summary: Both compacts have a 20-day informal resolution step after written notice, then arbitration with court
      litigation barred. The later compact has the parties first try to agree on one arbitrator with Indian gaming
      expertise, failing which each designates one and those two choose a third under AAA commercial rules, with
      a written statement of reasons and shared fees. The earlier compact used a panel of three arbitrators selected
      by the AAA, an award within 120 days, and no judicial review.
