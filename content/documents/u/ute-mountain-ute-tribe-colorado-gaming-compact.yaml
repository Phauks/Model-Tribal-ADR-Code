    locator: SECTION 12. EFFECTIVE DATE, TERMINATION AND AMENDMENT, C. Amendment
    summary: Either party may request negotiations to amend the compact by notice; the parties have 180 days to
      negotiate with IGRA remedies available, after which a mediator selects between last best offers and, if not
      accepted within 45 days, the Secretary prescribes procedures; amendment otherwise requires written agreement
