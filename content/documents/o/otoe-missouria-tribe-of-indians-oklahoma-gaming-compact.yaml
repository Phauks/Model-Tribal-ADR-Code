  changes:
  - topic: dispute-resolution
    compared_with: 1997-original
    change: changed
    summary: The later compact provides a notice and a 30-day meeting of the Native nation's and State's representatives,
      then either party may refer any dispute to arbitration before a single AAA-listed arbitrator, with remedies
      limited to enforcing the compact and de novo review of any award in federal district court. The earlier compact
      had the same notice and 30-day meeting, then non-binding arbitration with a three-member panel (one named
      by each party, third by the two or the AAA) and a declaratory-judgment action in the Northern District of
      Oklahoma, and said the steps did not prevent seeking immediate judicial relief.
