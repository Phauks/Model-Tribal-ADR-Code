    compared_with: 1992-original
    change: changed
    summary: 'The later compact replaces Article XXII: the earlier text had a notice, a meeting within 30 days and,
      after 90 days without resolution, any available remedy, with ADR only by mutual agreement. The later compact
      provides negotiation within 20 days of notice, optional non-binding mediation by written agreement, and arbitration
      by a three-member panel as the sole mechanism for disputes under listed Articles, with demand allowed after
      30 days; disputes under Articles IV, XXIII and XXXII are not arbitrable except the Nation''s claims for money
      owed by the State.'
