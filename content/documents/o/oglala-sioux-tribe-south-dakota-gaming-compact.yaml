  clauses:
  - topic: dispute-resolution
    locator: 7.5 Arbitration of Disagreements
    summary: Disagreements over the State's suitability determination go to a three-person binding Arbitration Board,
      initiated by a notice to the South Dakota Commission on Gaming, and either party may appeal the decision to
      federal district court if permitted by law.
    methods:
    - arbitration
    verification: read-in-full
    reviewer: small model, first pass
  - topic: renegotiation
    locator: 10. DURATION., 10.2 Review, Notice and Extension
    summary: The terms are subject to review at ten-year intervals; either party may give written certified-mail
      notice of provisions needing review, the parties negotiate in good faith for 180 days, and if unresolved the
      compact terminates unless the parties agree otherwise.
    verification: read-in-full
    reviewer: small model, first pass
  changes:
  - topic: dispute-resolution
    compared_with: 1993-original
    change: changed
    summary: 'The 2015 compact keeps the three-member binding Arbitration Board for suitability disagreements and
      the option to appeal to federal district court if permitted by law, but changes how it is formed and run:
      the board members are the chairs of the State and Tribal gaming commissions (or designees) plus a third jointly
      selected gaming-regulation expert whose pay is split, the parties are the two commissions, arbitration starts
      by filing a Notice with the South Dakota Commission on Gaming, and hearings are open unless the board closes
      them. The 1993 compact had one member chosen by each commission plus one jointly chosen, appointed to three-year
      terms. The general clause allowing either party to sue in federal district court is unchanged.'
    locator_before: 7.5; 8.29
    locator_after: 7.5; 8.12(2); 12.2
    verification: read-in-full
