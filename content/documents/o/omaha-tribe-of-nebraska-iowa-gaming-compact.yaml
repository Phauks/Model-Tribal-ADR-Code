  changes:
  - topic: dispute-resolution
    compared_with: 1999-replacement
    change: changed
    summary: The later compact adds Section 20, a binding process for non-material breaches (written notice, a 15-day
      meet-and-confer, a 10-day response to a demand, American Arbitration Association mediation, then binding arbitration
      with the non-prevailing party paying costs), and lets either party invoke it for material breaches in place
      of a 30-day cure-and-terminate notice. The earlier compact let the Director seek any remedy or the Native
      nation seek any remedy at law or equity after a 30-day notice and cure period, with arbitration or mediation
