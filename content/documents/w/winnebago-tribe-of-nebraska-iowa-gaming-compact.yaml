    locator: 20. BINDING DISPUTE RESOLUTION FOR NON-MATERIAL BREACH; 21. REMEDIES FOR MATERIAL BREACH
    summary: For a non-material breach, the parties give written notice and meet and confer within 15 days, a demand
      to halt or remedy follows with a 10-day response, and either party may then request binding arbitration before
      one agreed arbitrator or a three-arbitrator panel; for a material breach each party may instead give 30 days'
