  - topic: renegotiation
    locator: SECTION 16. Amendment.
    summary: 'The compact may be amended by mutual agreement: either party proposes an amendment by written notice,
      and the receiving party must respond within thirty days; either party may also give written notice of a right
      to renegotiate one year before the twenty-year term and each later five-year period ends.'
