    locator: SECTION 7. Dispute Resolution, (A)
    summary: A party alleging breach serves written notice and the parties meet within thirty days; if unresolved
      within ninety days the State may serve a notice to cease the game, and the Native nation may stop it or invoke
      arbitration under American Arbitration Association commercial rules before a three-attorney panel, while the
      Native nation may itself invoke arbitration over its own allegations; other remedies remain available.
    methods:
