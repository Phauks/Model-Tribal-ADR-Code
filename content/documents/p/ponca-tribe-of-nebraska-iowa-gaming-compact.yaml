  - topic: dispute-resolution
    locator: 20. BINDING DISPUTE RESOLUTION FOR NON-MATERIAL BREACH
    summary: For a non-material breach, the party asserting it gives written notice, the parties meet and confer
      within 15 days, and if unresolved the complaining party may demand a cure within 10 days; if the demand is
      rejected or ignored, the parties go to AAA Commercial Mediation and then binding arbitration under AAA rules
      before one or three arbitrators, with the non-prevailing party paying arbitration costs.
