    compared_with: 1995-original
    change: changed
    summary: 'The later compact provides a shorter track: the 30-day meeting of State and Native nation representatives
      after notice is dropped, the notice to cease conduct may follow after 20 days instead of 90, the responding
      party has 10 days instead of 30 to stop or invoke arbitration (with a right for the complaining party to invoke
      arbitration if it does not act), and results of arbitration are stated to be final and binding. Both use attorney-arbitrators
      chosen by each side and a third.'
