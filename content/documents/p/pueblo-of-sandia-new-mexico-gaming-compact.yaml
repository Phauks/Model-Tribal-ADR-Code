  clauses:
  - topic: dispute-resolution
    locator: SECTION 7. Dispute Resolution.
    summary: After written notice and twenty days, the complaining party may issue a notice to cease the disputed
      activity; the responding party may stop or invoke arbitration before a three-arbitrator panel (third arbitrator
      named by the American Arbitration Association if needed), and the result is final and binding, enforceable
      by injunctive action in any court of competent jurisdiction; other available remedies are preserved.
    methods:
    - arbitration
    verification: read-in-full
    reviewer: larger model, second pass, whole document
  - topic: renegotiation
    locator: SECTION 14. Entire Agreement.
    summary: The compact may be changed only by a signed written instrument approved by the Secretary of the Interior,
      and may not be amended without the express approval of the Pueblo of Sandia, the Governor and the State Legislature;
      no reopening trigger or negotiation timeline is stated.
    verification: read-in-full
    reviewer: larger model, second pass, whole document
  changes:
  - topic: dispute-resolution
    compared_with: 2001-replacement
    change: changed
    summary: The later compact provides a two-year limit for invoking the procedure (counted from discovery, with
      a two-year window for the State to raise pre-compact payment breaches), allows the parties to agree to one
      arbitrator, and sets 30-day deadlines for each side's arbitrator and for the third (earlier ten days), with
      the case proceeding before a single arbitrator if the responding party does not select one. The 20-day cease-conduct
      step and binding results are the same.
    locator_before: Section 7(A)(3)
    locator_after: Section 7(A), 7(A)(3)
