    locator: SECTION 15. DISPUTE RESOLUTION, subsections (a)-(g)
    summary: The compact provides for written notice, a meeting within ten days, and arbitration in Arizona if the
      dispute is not resolved within thirty days, with one agreed arbitrator or a panel of three whose third member
      the American Arbitration Association appoints if the two cannot agree; the majority decision is final, binding
      and unappealable, and U.S. District Courts have jurisdiction over actions to enjoin class III gaming in violation
