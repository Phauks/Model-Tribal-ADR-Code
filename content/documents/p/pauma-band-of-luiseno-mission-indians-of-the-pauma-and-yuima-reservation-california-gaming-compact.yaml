summary: 'The Class III gaming compact documents the Office of Indian Gaming lists for Pauma Band of Luiseno Mission
  Indians of the Pauma & Yuima Reservation, California and the State of California as of Nov. 21, 2026: 1 original,
  1 amendment and 2 extensions. The order, the kind of each event and which version is in effect are inferred from
  the list (project analysis); clause summaries and comparisons are a small model''s reading of excerpts.'
