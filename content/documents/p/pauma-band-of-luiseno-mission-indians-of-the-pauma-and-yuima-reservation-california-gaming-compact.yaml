  clauses:
  - topic: dispute-resolution
    locator: Sec. 9.1 and Sec. 9.2
    summary: The compact provides for written notice, a good-faith meeting within 10 days and, if unresolved after
      30 days, optional arbitration under the AAA Commercial Arbitration Rules with a binding award; otherwise the
      dispute may go to the U.S. District Court where the gaming facility is located and the Ninth Circuit Court
      of Appeals, or to state courts if federal courts lack jurisdiction.
    methods:
    - negotiation
    - arbitration
    verification: read-in-full
    reviewer: small model, older version
  - topic: renegotiation
    locator: Sec. 12.1 to Sec. 12.3
    summary: The compact may be amended by mutual written agreement, and the Pauma Band may request renegotiation
      in writing for Class III games other than those authorized, but not within 12 months of the effective date;
      talks are to be scheduled within 30 days under IGRA good-faith standards.
    verification: read-in-full
    reviewer: small model, older version
