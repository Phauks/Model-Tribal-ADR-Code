  clauses:
  - topic: dispute-resolution
    locator: SECTION 7. Dispute Resolution.
    summary: After written notice and a twenty-day period, the complaining party may issue a notice to cease the
      disputed activity, and either side may invoke arbitration before a three-member panel with the American Arbitration
      Association appointing a third arbitrator if needed; the arbitration result is final and binding and enforceable
      in any court of competent jurisdiction.
    methods:
    - arbitration
    verification: read-in-full
    reviewer: small model, first pass
  - topic: renegotiation
    locator: SECTION 14. Entire Agreement.
    summary: The compact may be amended only by a written instrument signed by the Native nation and the State and
      approved by the Secretary of the Interior, with approval of the Native nation, the Governor and the State
      Legislature; the excerpt sets no reopening trigger or time limit.
    verification: read-in-full
    reviewer: small model, first pass
  changes:
  - topic: dispute-resolution
    compared_with: 2007-replacement
    change: changed
    summary: The later compact provides a two-year limit for invoking the procedure (counted from discovery, with
      a two-year window for the State to raise pre-compact payment breaches), allows the parties to agree to one
      arbitrator, and if the responding party does not select its arbitrator within 30 days has the case proceed
      before the first-selected arbitrator; it also sets 30 days from the responding party's selection for the third
      arbitrator. The earlier 2007 text already had 30-day deadlines and a three-member panel; the 20-day step and
      binding results are the same.
