    summary: The later compact provides notice, a written response within 15 days, a meet-and-confer within 30 days
      of the notice, then court resolution in the federal district court where the gaming facility is located or
      in state court, with the remedies in Section 13.3 as the sole remedies for issues arising out of the compact.
      The earlier compact provided notice, a meeting within 10 days, and, if unresolved 30 days after the first
      meeting, optional arbitration under AAA rules (neither party required to agree) with a binding decision, plus
