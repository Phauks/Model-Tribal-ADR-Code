    locator: SECTION 7. Dispute Resolution.
    summary: After written notice and a twenty-day period, the complaining party may issue a notice to cease the
      disputed activity, and either side may invoke arbitration before a three-member panel with the American Arbitration
      Association appointing a third arbitrator if needed; the arbitration result is final and binding and enforceable
      in any court of competent jurisdiction.
