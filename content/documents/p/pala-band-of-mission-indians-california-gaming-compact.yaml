      or state-law change that expands or reduces Class III gaming (Section 2.5); the 2000 compact instead lets
      the Pala Band seek renegotiation to engage in Class III forms not authorized in the compact (no sooner than
      twelve months after its effective date), sets a thirty-day scheduling step (12.3), and gives the Pala Band
      a right to terminate if exclusivity over gaming devices is abrogated (12.4); the excerpts do not show a 2000
