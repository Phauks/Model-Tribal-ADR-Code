    change: changed
    summary: The later compact provides a two-year limit for invoking the procedure (counted from discovery, with
      a two-year window for the State to raise pre-compact payment breaches), allows the parties to agree to one
      arbitrator, and sets 30-day deadlines for each side's arbitrator and for the third (earlier ten days), with
      the case proceeding before a single arbitrator if the responding party does not select one. The 20-day cease-conduct
