    note: A small model read excerpts of this document and marked it hard; check against the text.
  changes:
  - topic: dispute-resolution
    compared_with: 2007-replacement
    change: changed
    summary: The later compact provides a two-year limit for invoking the procedure (counted from discovery, with
      a two-year window for the State to raise pre-compact payment breaches), allows the parties to agree to one
      arbitrator, and if the responding party does not select its arbitrator within 30 days has the case proceed
      before the first-selected arbitrator; it also sets 30 days from the responding party's selection for the third
      arbitrator. The earlier 2007 text already had 30-day deadlines and a three-member panel; the 20-day step and
      binding results are the same.
    locator_before: Section 7(A)(3)
