  changes:
  - topic: dispute-resolution
    compared_with: 1996-original
    change: changed
    summary: 'The later amendment''s optional Addendum adds a step for disputes over the Player Terminal allocation:
      the State and Native nation must meet and attempt to resolve the dispute at least 30 days before the increased
      allocation takes effect, after which either or both may use the Compact''s dispute resolution provisions.
      The earlier compact already provided in Section XII.C for notice, a meeting within ten days, and AAA arbitration
      with a final decision.'
    locator_before: Sec. XII.C
    locator_after: Addendum Sec. 4.1-4.2
    verification: read-in-full
