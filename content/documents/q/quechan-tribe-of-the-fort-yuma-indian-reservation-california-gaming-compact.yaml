  changes:
  - topic: dispute-resolution
    compared_with: 2000-original
    change: changed
    summary: 'The later amendment leaves the earlier Section 9.0 (meet and confer within 10 days, optional arbitration,
      then court) in place but adds a new process for one kind of dispute: Section 10.8.9 lets a party demand binding
      arbitration before a single arbitrator if no intergovernmental agreement with the county or State transportation
      agency is reached within 55 days of the final TEIR, with a last-best-offer award and no review. It also provides
      that overdue payments let the State seek injunctive relief in court notwithstanding Section 9.0, and refers
      a payment-reconciliation dispute to Section 9.0 after payment.'
    locator_before: Sec. 9.1-9.4
    locator_after: Section 10.8.9; payment provisions referring to Section 9.0
