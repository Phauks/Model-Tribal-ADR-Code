    summary: 'The 2002 compact shortens the periods in Section 7: a complaining party may serve a notice to cease
      the game after 20 days (earlier 90 days), and the responding party must stop or invoke arbitration within
      10 days (earlier 30 days). It also drops the earlier required meeting of State and Tribe representatives within
      30 days of the notice, adds discovery and open-or-closed hearing rules for the three-attorney AAA arbitration,
      bars the arbitrators from ruling on the compact''s validity, and states that results are final and binding.'
