  - topic: renegotiation
    locator: SECTION 17. Effective Date and Duration; Amendments, (c) Amendment and modification
    summary: The terms may be modified only by written agreement of both parties; the Native nation may request
      negotiations on Class III games later permitted by the State, but may not open new talks on terms for already-authorized
      games except where state law changes or the State consents.
