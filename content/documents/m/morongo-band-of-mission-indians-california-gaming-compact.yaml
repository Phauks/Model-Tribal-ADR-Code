  changes:
  - topic: dispute-resolution
    compared_with: 2000-original
    change: changed
    summary: The 2007 amended compact leaves Section 9.0 in place as the general process (the later text refers
      to 'Amended Compact Section 9.0' for payment and fire-safety disputes) and adds, for failure to remit specified
      payments, a right for the State to seek injunctive relief immediately in federal or state court notwithstanding
      Section 9.0, with the Tribe consenting to suit; it also adds JAMS arbitration for patron disputes and for
      off-reservation mitigation disputes with a county. The 2000 compact's Section 9.0 provided written notice,
      a meet and confer within 10 days, optional arbitration under AAA rules after 30 days, and then federal or
      state court.
