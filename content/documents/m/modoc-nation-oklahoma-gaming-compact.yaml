    locator: SECTION 15. DISPUTE RESOLUTION, subsections (a) to (c)
    summary: The parties first give written notice and the Governor and tribal chief meet within thirty days; if
      unresolved, either party may refer the dispute to non-binding arbitration with the arbitrators named by the
      parties and, if needed, the American Arbitration Association, and either party may then seek a declaratory
      judgment in the United States District Court for the Western District of Oklahoma.
