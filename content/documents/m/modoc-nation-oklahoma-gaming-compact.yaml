    locator: SECTION 20. AMENDMENTS
    summary: Either the State or the Tribes may request negotiations to amend or modify the compact; the compact
      stays in effect during negotiations, the parties have 180 days to negotiate, after which the remedies under
      the Act apply, and amendments must be in writing and approved by the Secretary.
