  changes:
  - topic: dispute-resolution
    compared_with: 1996-original
    change: changed
    summary: The 2005 compact provides written notice, a meeting within 30 days, and then arbitration that either
      party may refer to the American Arbitration Association before one arbitrator chosen from an AAA list, limited
      to enforcement of the compact, with de novo review of the award in federal district court. The 1996 compact
      provided a 30-day meeting, then non-binding arbitration by a party-named three-member panel after 30 days,
      and a declaratory judgment action in the Western District of Oklahoma.
    locator_before: 15(a)-(c)
