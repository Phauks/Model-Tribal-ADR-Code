  changes:
  - topic: dispute-resolution
    compared_with: 1997-replacement
    change: changed
    summary: 'The 2004 compact shortens the periods in Section 7: a complaining party may serve a notice to cease
      the game after 20 days (earlier 90 days), and the responding party must stop or invoke arbitration within
      10 days (earlier 30 days). It also drops the earlier required meeting within 30 days of the notice, lets the
      complaining party invoke arbitration if the other side does neither, adds discovery and open-or-closed hearing
      rules and a bar on ruling on the compact''s validity, and states that results are final and binding.'
