    change: changed
    summary: The 2015 compact adds a two-year window to start the Section 7 procedure (and a two-year window from
      the effective date for the State to raise pre-effective-date payment breaches), lets the parties agree in
      writing to a single arbitrator, sets 30-day periods for choosing arbitrators (if the responding party does
      not choose, the arbitration goes ahead with the single arbitrator picked by the noticing party), and lengthens
