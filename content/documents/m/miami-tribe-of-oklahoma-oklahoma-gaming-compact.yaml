  changes:
  - topic: dispute-resolution
    compared_with: 1995-original
    change: changed
    summary: The 1996 compact renumbers the dispute section from 14 to 15, shortens the period before either party
      may refer a dispute to non-binding three-arbitrator arbitration from 60 days of notice to 30 days, and recasts
      the court step from a suit for breach to a declaratory judgment action by a party aggrieved by the arbitration
      decision, in the Western District of Oklahoma. The 30-day meeting of the Governor and Tribal Chief and the
      sanctions for improper claims are the same.
