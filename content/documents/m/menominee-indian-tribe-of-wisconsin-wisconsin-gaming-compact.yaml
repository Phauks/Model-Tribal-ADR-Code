    summary: The 2000 compact's Section XXIII.A drops the required written notice, 30-day meeting and 90-day waiting
      period and simply says either party may pursue any available remedy; it keeps the optional mediation or arbitration
      paragraph. It also adds, in the internal control procedures section, a hearing before a three-member panel
      of certified public accountants (final and non-appealable) for disagreements over internal control compliance.
