    locator: Sec. 9.1 and Sec. 9.2
    summary: The compact provides for written notice, a good-faith meeting within 10 days and, if unresolved after
      30 days, optional arbitration under the AAA Commercial Arbitration Rules with a binding award; otherwise the
      dispute may go to the U.S. District Court where the gaming facility is located and the Ninth Circuit Court
      of Appeals, or to state courts if federal courts lack jurisdiction.
