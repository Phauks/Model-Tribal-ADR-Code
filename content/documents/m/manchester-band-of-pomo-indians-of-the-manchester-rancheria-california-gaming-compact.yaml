  changes:
  - topic: dispute-resolution
    compared_with: 2000-original
    change: changed
    summary: The 2024 compact provides written notice, a written response within 15 days, a meet and confer within
      30 days, and then court action in federal district court (or state court if federal court lacks jurisdiction),
      with the Section 13.3 remedies as the sole remedies and no damages or attorney fees; arbitration is no longer
      in the clause. The 2000 compact provided written notice, a meet and confer within 10 days, and after 30 more
      days optional AAA arbitration (neither party required to agree), then federal or state court.
    locator_before: 9.1-9.4
    locator_after: 13.1-13.4
    verification: read-in-full
    reviewer: larger model, second pass on the full text
  - topic: renegotiation
    compared_with: 2000-original
    change: changed
    summary: The 2024 table of contents lists renegotiation entitlements for changed market conditions (Section
      15.4) and for State authorization of new forms of Class III gaming (Section 15.5), plus requests to amend
      or negotiate a new compact (Section 15.6); the 2000 compact's visible text gives a single right to seek renegotiation
      for new forms of gaming (Section 12.2), after a 12-month bar, and no market-conditions right. The body of
      2024 Sections 15.4 to 15.6 is not in the excerpts.
    locator_before: 12.1, 12.2
