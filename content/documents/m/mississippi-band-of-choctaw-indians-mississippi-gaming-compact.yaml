    locator: SECTION 10. DISPUTE RESOLUTION (10.1 to 10.2(4)); SECTION 19. JUDICIAL ENFORCEMENT
    summary: After written notice, the Governor and the Tribal Chief meet within 30 days; if the dispute is unresolved
      within 90 days, arbitration decides it, with a third arbitrator appointed by the American Arbitration Association
      if needed, and the decision is final and non-reviewable; enforcement suits go to the United States District
      Court, then to state courts if federal jurisdiction is lacking.
