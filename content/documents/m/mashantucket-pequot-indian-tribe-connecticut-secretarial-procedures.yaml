  - topic: dispute-resolution
    locator: SECTION 13. Enforcement of compact provisions, (c) Enforcement authority of the State gaming agency
    summary: The State gaming agency delivers a notice of non-compliance and, if the Native nation's operation does
      not correct it, may sue in U.S. District Court to enjoin the gaming activity; a narrower supervisory-staffing
      disagreement goes to binding American Arbitration Association arbitration after the parties confer, and Sec.
      10(c) routes certain appeals to AAA arbitration if the Connecticut Superior Court lacks jurisdiction.
    methods:
    - negotiation
    - arbitration
