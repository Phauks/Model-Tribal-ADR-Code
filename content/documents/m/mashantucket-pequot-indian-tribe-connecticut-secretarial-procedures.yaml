  - topic: renegotiation
    locator: Section 17 (printed 'SECTION. 11.') Effective Date and Duration; Amendments, (c) Amendment and modification
    summary: The terms may be modified only by written agreement of both parties; the Native nation may request
      negotiations on Class III games later permitted by the State, but may not open new talks on terms for games
      already authorized except where state law changes or the State consents.
