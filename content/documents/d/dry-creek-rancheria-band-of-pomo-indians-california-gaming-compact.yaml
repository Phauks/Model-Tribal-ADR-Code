  changes:
  - topic: dispute-resolution
    compared_with: 2000-original
    change: changed
    summary: The earlier compact provides written notice, a meeting within 10 days, then optional AAA arbitration
      (neither party required to agree) held on Tribal land and federal or state court; the later compact provides
      written notice, a written response within 15 days, a meeting within 30 days, then optional arbitration before
      a JAMS arbitrator with an optional JAMS appeal procedure and court action in federal or state court, with
      Section 13.4 remedies as the exclusive remedies and no damages or attorney fees; it also keeps a separate
      binding arbitration for county agreement disputes (Section 11.8).
    locator_before: Sec. 9.0 (9.1-9.4)
    locator_after: Section 13.0 (13.1-13.4)
    verification: read-in-full
    reviewer: larger model, second pass on the full text
  - topic: renegotiation
    compared_with: 2000-original
    change: changed
    summary: 'The replacement compact replaces the earlier 12.2 renegotiation right for new Class III games (available
      after 12 months) and the 30-day scheduling rule in 12.3 with a Section 15 that: allows either party to request
      negotiations for an extension or a new compact no sooner than eighteen months before termination, with automatic
      one-year extension if no agreement is reached; and requires the State, within forty-five days of a written
      request based on changed market conditions that materially and adversely affect the Tribe''s operation, to
      participate in good-faith negotiations to amend the compact.'
    locator_before: 12.2, 12.3
    locator_after: 15.2, 15.4
