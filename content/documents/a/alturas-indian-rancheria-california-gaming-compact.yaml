    locator: Sec. 9.2, Arbitration Rules
    summary: Disputes first go to written notice and a good-faith meeting within 10 days, then either party may
      seek arbitration under AAA Commercial Rules after 30 days, though neither party must agree; the arbitrator's
      decision is binding, and unresolved disputes may go to the U.S. District Court where the gaming facility is
      located and the Ninth Circuit, or to state court if the federal courts lack jurisdiction.
