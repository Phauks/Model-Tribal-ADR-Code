    locator: Sec. 12.1 to 12.3, Amendments; Renegotiations
    summary: The compact may be amended by mutual written agreement, and the Tribe may request renegotiation to
      add Class III games not authorized here, but not within 12 months of the effective date; requests must be
      in writing and the parties must set a negotiation schedule within 30 days.
