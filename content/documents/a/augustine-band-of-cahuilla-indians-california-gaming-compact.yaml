  - topic: dispute-resolution
    locator: Sec. 9.0. DISPUTE RESOLUTION PROVISIONS, Sec. 9.1 to 9.3
    summary: The parties give written notice and meet and confer within 10 days; if unresolved 30 days after the
      first meeting either party may seek arbitration under AAA Commercial Arbitration Rules (binding if used, but
      neither party must agree to arbitrate), and disputes not otherwise resolved may be heard in the U.S. District
      Court, the Ninth Circuit, or state court if federal courts lack jurisdiction.
    methods:
    - negotiation
    - nonbinding-arbitration
    verification: read-in-full
    reviewer: larger model, second pass, whole document
  - topic: renegotiation
    locator: Sec. 12.0. AMENDMENTS; RENEGOTIATIONS, Sec. 12.1 to 12.3
    summary: The compact may be amended at any time by mutual written agreement, and the Band may request renegotiation
      to add other forms of Class III gaming after 12 months, with a negotiation schedule set within 30 days and
      IGRA good-faith standards applying.
    verification: read-in-full
    reviewer: larger model, second pass, whole document
