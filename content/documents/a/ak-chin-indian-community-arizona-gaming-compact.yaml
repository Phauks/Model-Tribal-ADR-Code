    clauses:
      - topic: dispute-resolution
        locator: Section 15
        summary: >-
          Covers disputes over compliance with the compact and over its
          interpretation. After written notice, the heads of the Tribal Gaming
          Office and the State Gaming Agency negotiate, then representatives
          of the Governor and the Community's Chairman. If the dispute is not
          resolved within 30 days, either party may request non-binding
          mediation under CPR procedures and may demand binding arbitration
          under CPR rules, before three arbitrators unless both agree to one,
          using a "last, best offer" format unless a party opts out. The award
          is final and binding, open to challenge only on the grounds in 9
          U.S.C. § 10, and the tribunal may not award money damages. Section
          15(d) preserves suits for injunctive relief under 25 U.S.C. §
          2710(d)(7)(A)(ii) and names the Arizona Superior Court and the U.S.
          District Court for the District of Arizona as courts of competent
          jurisdiction.
        methods: [negotiation, mediation, arbitration, final-offer-selection]
        verification: read-in-full
        reviewer: project author (AI assistant)
    changes:
