        compared_with: 1993-original
        change: changed
        summary: >-
          Extends the process to disputes over interpretation; adds a second
          round of negotiation and optional non-binding mediation before
          arbitration; moves arbitration to CPR rules with three arbitrators by
          default, a "last, best offer" format, review limited to 9 U.S.C. §
          10 grounds and no money damages; and names courts for injunctive
          relief and enforcement.
