      - topic: dispute-resolution
        locator: Section 15
        summary: >-
          A party that believes the other has not complied serves written
          notice, and the parties' representatives meet within 10 days. A
          dispute unresolved 30 days after notice goes to arbitration before
          one agreed arbitrator or, failing agreement, three (one chosen by
          each party and a third by those two or by the American Arbitration
          Association). The majority's decision is final, binding and
          unappealable, and the parties split the arbitration costs. Section
          15(e) recognizes federal district court jurisdiction to enjoin Class
          III gaming conducted in violation of the compact.
        methods: [negotiation, arbitration]
