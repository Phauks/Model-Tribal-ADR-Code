jurisdictions:
  - level: multiple
    note: Class III gaming compact between the Ak-Chin Indian Community and the State of Arizona under 25 U.S.C. § 2710(d).
summary: >-
  The Class III gaming compact between the Ak-Chin Indian Community and the
  State of Arizona: the 1993 compact, the compact approved in 2003 that
  replaced it, a 2008 agreement amending the 2003 compact, the 2021 amended
  and restated compact that replaced both, and a 2022 agreement amending the
  2021 compact. Every version on the Office of Indian Gaming list as of
  Nov. 21, 2026 is recorded; extensions of the 1993 compact before 2003, if
  any, are not on that list.
