  clauses:
  - topic: dispute-resolution
    locator: VII. DEFAULT AND TERMINATION, A. Default by Tribes
    summary: 'The agreement has no negotiation, arbitration or court process for disputes; its only mechanism is
      default: a party in substantial and continuing default may be terminated by the other after at least ninety
      days written notice and a failure to cure within ninety days.'
    verification: read-in-full
    reviewer: larger model, second pass, whole document
  - topic: renegotiation
    locator: VIII. GENERAL TERMS, B. Amendments
    summary: The agreement may be amended only with the consent of both parties in a signed written instrument;
      the parties must negotiate in good faith if IGRA or state law changes, must review the agreement annually
      at first, and must negotiate additional Class III games when the Tribes give notice.
    verification: read-in-full
    reviewer: larger model, second pass, whole document
