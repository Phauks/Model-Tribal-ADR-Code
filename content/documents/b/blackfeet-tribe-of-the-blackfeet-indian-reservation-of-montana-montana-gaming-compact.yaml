    locator: IX. DEFAULT AND TERMINATION, B. Default by State
    summary: 'The agreement has no negotiation, arbitration or court process for disputes; its only mechanism is
      default: a party in substantial failure may be terminated by the other after thirty days written notice and
      a failure to cure within thirty days, and the State may terminate immediately for unacceptable changes to
