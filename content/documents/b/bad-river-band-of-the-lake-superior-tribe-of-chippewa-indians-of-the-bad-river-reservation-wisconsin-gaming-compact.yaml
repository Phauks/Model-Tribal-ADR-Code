    summary: 'The 2003 Amendment #2 keeps the prior written agreement rule of Section XXX and adds a periodic amendment
      process: either party may propose amendments within 30 days before each fifth anniversary of July 1, 2004,
      and the State (through the Governor, as directed by legislation) or the nation may propose amendments to any
      provision within 30 days before each twenty-fifth anniversary, with good faith negotiations and disputes over
      that duty resolved under Section XXII; the earlier Section XXX had no periodic process.'
