  changes:
  - topic: dispute-resolution
    compared_with: 1992-original
    change: changed
    summary: The earlier compact provides written notice and a meeting within 30 days, after which either party
      could pursue any otherwise available remedy once 90 days passed, with mediation or arbitration only by mutual
      agreement; the later compact provides negotiation within ten days, then at least two sessions of non-binding
      mediation, then binding arbitration before a single arbitrator with federal court enforcement under the Federal
      Arbitration Act, and adds a separate appeal of internal-control-standard disputes to a three-member arbitration
      panel.
