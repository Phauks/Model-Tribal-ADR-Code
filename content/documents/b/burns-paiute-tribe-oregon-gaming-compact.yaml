  - topic: renegotiation
    compared_with: 1997-original
    change: changed
    summary: The 1997 compact's Section 11.D allowed amendment after eighteen months and on listed triggers, and
      its Section 11.D.3 allowed either party to request negotiations to amend, replace or repeal it. The 2003 replacement's
      Section 12.D bars amendment for three years after its effective date unless one of its listed conditions occurs,
      and its Section 12.B allows termination for a material breach after the Section 6 dispute process is exhausted
      and 60 days have passed after notice.
