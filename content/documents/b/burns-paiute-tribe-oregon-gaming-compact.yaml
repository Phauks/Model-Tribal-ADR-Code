  changes:
  - topic: dispute-resolution
    compared_with: 1997-original
    change: changed
    summary: Both compacts provide notice, a meeting within 30 days and a federal court action in the District of
      Oregon after 90 days, plus an operational-decisions procedure (meet and confer in 15 days, non-binding arbitration
      binding by agreement) and an expedited 24-hour procedure; the later compact adds terms on the state-court
      fallback, with the Native nation waiving immunity for state court suits when the federal court declines jurisdiction
      on its motion and providing the Burns Paiute Tribal Court for State suits when it declines on the State's
      motion.
