  - topic: renegotiation
    compared_with: 2000-original
    change: changed
    summary: The 2000 compact's Section 12 allowed renegotiation when the nation wished to engage in Class III games
      not authorized in the compact, with a written-request process and a termination right. The 2016 replacement's
      Section 15 allows amendment by mutual written agreement during the term, lets either party request negotiations
      for an extension or new compact up to 18 months before termination, and automatically extends the compact
      for one year (or two years while a deal is advancing). The nation-only renegotiation for new games is not
      in the 2016 excerpts.
    locator_before: Sec. 12.2
    locator_after: Sec. 15.1, 15.2
