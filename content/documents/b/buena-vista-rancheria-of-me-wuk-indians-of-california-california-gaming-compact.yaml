  changes:
  - topic: dispute-resolution
    compared_with: 2000-original
    change: changed
    summary: The earlier compact provides written notice, a meeting within 10 days, and optional AAA arbitration
      (single arbitrator unless a party objects) with a binding decision, then federal or state court; the later
      compact provides written notice, a written response within 15 days, a meeting within 30 days, optional arbitration
      before a JAMS arbitrator with an optional JAMS appeal procedure, then federal or state court (Sacramento County)
      with the Section 13.4 remedies as exclusive and no damages or attorney fees.
    locator_before: Sec. 9.0 (9.1-9.3)
