  clauses:
  - topic: dispute-resolution
    locator: Section 16, paragraph 6 (dispute resolution)
    summary: Under the compact the State may give written notice, the parties confer within five days for expedited
      matters, and either party may use arbitration through U.S. Arbitration and Mediation of Oregon, with arbitration
      binding only if both agree, before suing in the United States District Court for the District of Oregon.
    methods:
    - negotiation
    - nonbinding-arbitration
    verification: read-in-full
    reviewer: small model, older version
  - topic: renegotiation
    locator: Section 12, D. Amendments
    summary: The compact may be reopened for negotiation only on listed events, such as the State expanding Class
      III gaming, a new compact with another tribe, a State rule change, delay of the fee-to-trust process, or a
      joint operation agreement; the excerpt does not say what happens if talks fail.
    verification: read-in-full
    reviewer: small model, older version
