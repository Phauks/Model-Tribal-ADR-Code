    sha256: 80284a390c4f313b682b04f1956099dd264fe1ff5496a4319a8f7126dc9c27bb
    pages: 53
  clauses:
  - topic: dispute-resolution
    locator: Section 6, subsection B (Procedure for Resolving Disputes Concerning Operational Decisions), paragraphs
      1-5
    summary: The State may give written notice to the Tribal Gaming Commission, the parties meet and confer within
      fifteen days, either party may seek non-binding arbitration within forty-five days, and the matter may then
      go to the United States District Court for the District of Oregon under Section 16, with an expedited procedure
      for immediate threats.
    methods:
    - negotiation
    - nonbinding-arbitration
    verification: read-in-full
    reviewer: small model, first pass
  - topic: renegotiation
    locator: Section 12, subsection D
    summary: The compact may be amended after one year from Interior approval, when the Tribe notifies the State
      of a joint operation with another tribe, or when the State expands Class III gaming; requests are made in
      writing by certified mail and the negotiation period is 100 days.
    verification: read-in-full
    reviewer: small model, first pass
  changes:
  - topic: dispute-resolution
    compared_with: 1995-original
    change: changed
    summary: The earlier compact's general clause provides notice, a 30-day meeting, then non-binding arbitration
      (binding by agreement) after 90 days and a District of Oregon action only if arbitration does not resolve
      the controversy; the later compact drops arbitration from the general clause and lets either party sue in
      the District of Oregon (state court if federal declines) after 90 days. The later compact also sends operational-decision
      notices to the Tribal Gaming Commission, requires the Commission to follow the State's recommended action
      or another mutually acceptable one in the expedited procedure, and lets either the State or the Native nation
      sue in federal court if an expedited concern is unresolved after ten days.
    locator_before: Section 6.B; Section 16.A.2-3
    locator_after: Section 6.B; Section 16.A.2
    verification: read-in-full
    reviewer: larger model, second pass on the full text
  - topic: renegotiation
    compared_with: 1995-original
    change: changed
    summary: 'The replacement drops the earlier three-year bar on amendment and the ''except as provided in subsection
      12.C'' lead-in: the Compact ''may be amended if'' one of the listed conditions occurs. It adds a new 12(D)(4)
      that no amendment under Section 12(D) takes effect before Interior approval or approval deemed under IGRA.'
    locator_before: 12(D)
    locator_after: 12(D)(4)
    verification: read-in-full
    reviewer: small model, version comparison
