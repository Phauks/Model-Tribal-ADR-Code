  changes:
  - topic: dispute-resolution
    compared_with: 1995-original
    change: changed
    summary: The earlier compact provides notice, a meeting within 30 days, and a District of Oregon action (state
      court if federal declines) after 90 days; the later compact keeps that clause, adds a Tribes' waiver of immunity
      for state court suits, and adds a procedure for the State's concerns about operational decisions (meet and
      confer within 15 days, then non-binding arbitration that is binding only by agreement, then federal court)
      and an expedited procedure with a federal court action if unresolved within ten days of notice.
