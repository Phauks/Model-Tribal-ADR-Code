  changes:
  - topic: dispute-resolution
    compared_with: 2000-original
    change: changed
    summary: The earlier compact provides written notice, a meeting within 10 days, then optional AAA arbitration
      (neither party required to agree) and federal or state court; the later compact provides written notice, a
      written response within 15 days, a meeting within 30 days, then court action in federal district court or
      state court with the Section 13.3 remedies as the sole remedies, no damages or attorney fees, and a separate
      Section 13.4 action for declaration of material breach; it contains no arbitration step.
