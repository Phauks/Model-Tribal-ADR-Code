summary: 'The Class III gaming compact documents the Office of Indian Gaming lists for Confederated Tribes of the
  Warm Springs Reservation of Oregon and the State of Oregon as of Nov. 21, 2026: 1 original, 13 amendments, 1 disapproved
  compact, 2 restatements and 1 replacement. The order, the kind of each event and which version is in effect are
  inferred from the list (project analysis); clause summaries and comparisons are a small model''s reading of excerpts.'
