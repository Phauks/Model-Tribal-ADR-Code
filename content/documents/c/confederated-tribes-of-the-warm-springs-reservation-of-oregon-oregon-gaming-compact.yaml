    summary: The earlier compact's expedited procedure lets the State give written notice to the Tribes of an immediate
      threat, confer within five days, then go to federal court in the District of Oregon if unresolved; Amendment
      II revises subparagraph 6.B.5.a so notice goes to the Tribal Gaming Commission with a recommended action,
      the State and Commission meet and confer within 24 hours, and the Commission takes action to address the concern,
      after which either party may invoke the compact's dispute procedures, and it expands the list of immediate
      threats.
