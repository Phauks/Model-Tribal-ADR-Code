  clauses:
  - topic: dispute-resolution
    locator: B. Procedure for Resolving Disputes Concerning Operational Decisions
    summary: For operational decisions the State gives written notice, the parties meet and confer within fifteen
      days, and either party may then use non-binding arbitration through U.S. Arbitration and Mediation of Oregon
      or an action in the United States District Court for the District of Oregon, with arbitration binding only
      if both parties agree.
    methods:
    - negotiation
    - nonbinding-arbitration
