    summary: The compact may not be amended for three years after its effective date except under listed conditions,
      such as the State becoming party to another compact with broader authorization, a state statute expanding
      Class III gaming, or the parties agreeing in writing to negotiate; community benefit fund contributions may
      also be renegotiated if certain games are prohibited.
