  changes:
  - topic: dispute-resolution
    compared_with: 1994-original
    change: changed
    summary: The general dispute clause (notice, 30-day meeting, District of Oregon action after 90 days) and the
      operational-decisions steps (meet and confer within 15 days, non-binding arbitration binding by agreement,
      federal court) are the same in both; the later compact rewrites the expedited procedure so notice goes to
      the Tribes and the Tribal Gaming Commission with a recommended action, the State and Commission meet and confer
      within 24 hours, the Commission acts on the concern before either party may invoke the dispute procedures,
      the five-day conference happens on request, and the list of immediate threats grows.
