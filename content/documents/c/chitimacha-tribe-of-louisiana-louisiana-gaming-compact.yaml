  changes:
  - topic: dispute-resolution
    compared_with: 1993-original
    change: changed
    summary: The earlier compact provides that a disagreement between the Tribe and the State over revisions goes
      to a meeting within ten days, then mediation under AAA Commercial Mediation Rules, then a legal action with
      exclusive venue in the 19th Judicial District Court where the State is a party; the later compact adds a Tribe-State
      process of notice and negotiation (preliminary meeting within ten days, 45 days), then mediation, then binding
      arbitration before one or three arbitrators whose decision is final and non-reviewable, with federal court
      relief preserved.
