  - topic: renegotiation
    locator: D. Amendments (paragraph 12.D.1.b)
    summary: Either party may request negotiations to amend the compact when a listed condition occurs, such as
      one year after Secretary approval, a new state compact with another tribe, or a state change expanding Class
      III gaming; the Native nation's fund contributions are to be renegotiated if blackjack is prohibited, and
      the excerpt does not say what happens if talks fail.
    verification: read-in-full
    reviewer: small model, older version
  changes:
  - topic: dispute-resolution
    compared_with: 1992-original
    change: changed
    summary: The earlier compact provides a general clause of written notice, a meeting within 30 days, and a District
      of Oregon action after 90 days (state court if federal declines); the later compact keeps that clause with
      designated representatives for the meeting and adds an operational-decisions procedure (notice, meeting within
      15 days, non-binding arbitration within 45 days binding by agreement, then federal court) and an expedited
      procedure under which the Tribe acts on the State's recommendation unless the Tribal Gaming Commission finds
      harm, with a federal court action if unresolved after ten days.
    locator_before: Section 15.A
    locator_after: Section 6.B; Section 16.A
