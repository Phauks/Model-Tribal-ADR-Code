    note: A small model read excerpts of this document and marked it hard; check against the text.
  changes:
  - topic: dispute-resolution
    compared_with: 1997-restatement
    change: changed
    summary: 'The earlier compact provides a general clause (notice, 30-day meeting, District of Oregon action after
      90 days) plus an operational-decisions procedure (15-day meeting, non-binding arbitration binding by agreement,
      federal court) and an expedited procedure (Tribe acts on the State''s recommendation unless the Commission
      finds harm, conference within five days, court action after ten days); the later compact replaces them with
      Article XII: a meeting within 20 calendar days, then mediation or non-binding arbitration (convertible to
      binding by agreement), then court action, and an expedited process limited to immediate and serious threats
      with a three-business-day conference, a second notice, implementation of the State''s recommendation or other
      agreed action, State-imposed remedies (withholding or suspending authorizations, closure for public safety
      threats) if the Tribe does not act, and a right for the Native nation to seek declaratory relief in court.'
    locator_before: Section 16; Section 6.B (6.B.5)
    locator_after: Article XII (A)-(E)
    verification: read-in-full
    reviewer: larger model, second pass on the full text
  - topic: renegotiation
    compared_with: 1997-restatement
    change: changed
    summary: The 2007 replacement drops the 1997 list of conditions for amendment and the bar on renegotiating Section
      4 gaming terms without State consent. Amendments may be made by the parties in writing with Secretary approval,
      and either party may request renegotiation, which must be negotiated in good faith.
    locator_before: 12(D)(1)
    locator_after: Article XIII(D)-(E)
    verification: read-in-full
    reviewer: small model, version comparison
