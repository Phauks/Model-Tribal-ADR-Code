    locator: B. Procedure for Resolving Disputes Concerning Operational Decisions.
    summary: For operational disputes the State gives written notice, the parties meet and confer within fifteen
      days, either party may start non-binding arbitration within forty-five days through U.S. Arbitration and Mediation
      of Oregon, and then either party may sue in the United States District Court for the District of Oregon, with
      arbitration binding only if both parties agree.
    methods:
