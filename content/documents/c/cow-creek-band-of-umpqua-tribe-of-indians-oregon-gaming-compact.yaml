  - topic: renegotiation
    locator: ARTICLE XIII - EFFECTIVE DATE; EXHIBITS; TERMINATION; AMENDMENTS, Section E. Renegotiations
    summary: Either party may request negotiations to amend, replace or repeal the compact by written certified-mail
      request to the Governor or Tribal Chair, the compact stays in effect during talks, and amendments must be
      in writing, signed by all parties and approved by the Secretary of the Interior.
    verification: read-in-full
