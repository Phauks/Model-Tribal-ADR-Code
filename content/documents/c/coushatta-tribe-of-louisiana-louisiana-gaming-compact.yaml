  clauses:
  - topic: dispute-resolution
    locator: 'SECTION 14: DISPUTE RESOLUTION, paragraph (E)'
    summary: Patron prize disputes follow Tribal procedures and then mediation, and disputes with the State go through
      notice, negotiation, mediation under the AAA Commercial Mediation Rules and then formal binding arbitration
      under AAA rules if both parties agree to submit the mediator's summary of disagreement.
    methods:
    - negotiation
    - mediation
    - arbitration
    verification: read-in-full
    reviewer: small model, first pass
  - topic: renegotiation
    locator: 'SECTION 13: AMENDMENT AND REVISION, paragraph (A)'
    summary: The compact may be amended only through a written instrument signed by the Tribal Chairman and the
      Governor and approved by the Secretary of the Interior, after written notice and written concurrence; if concurrence
      is not given, the parties meet and the Section 14 procedures apply.
    verification: read-in-full
    reviewer: small model, first pass
  changes:
  - topic: dispute-resolution
    compared_with: 1992-original
    change: changed
    summary: The earlier compact provides for a meeting within ten days of a disagreement, then mediation under
      AAA Commercial Mediation Rules, then a legal action with exclusive venue in the 19th Judicial District Court
      where the State is a party; the later compact provides notice within ten days, a 45-day negotiation period,
      mediation under AAA rules, and then binding AAA arbitration (one or three arbitrators, final and non-reviewable)
      limited to the issues in the mediator's summary report, and restates the patron-dispute provision with a non-waiver
      of sovereign immunity.
    locator_before: Sections 13(C), 14(C)-(D)
    locator_after: Sections 13, 14(D)(1)-(3)
    verification: read-in-full
    reviewer: larger model, second pass on the full text
  - topic: renegotiation
    compared_with: 1992-original
    change: changed
    summary: On amendments, the earlier compact resolved a deadlock over proposed amendments under Section 14(C)
      et seq., which allowed court action after mediation. The 2001 compact sends the deadlock to non-binding mediation
      under Section 14(C), and if mediation fails the proposed amendments are not adopted.
    locator_before: 13(C)
    locator_after: 13(A)
    verification: read-in-full
    reviewer: small model, version comparison
