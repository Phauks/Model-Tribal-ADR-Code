  - topic: renegotiation
    compared_with: 1995-original
    change: changed
    summary: The 1999 Section 12.D cuts the compact's period before a change-in-law reopener from three years to
      one year after the effective date, limits renegotiation of gaming already authorized in Section 4 unless the
      State consents, and shortens the IGRA negotiation period from 180 days to 100 days.
    locator_before: 12.D.1(b)
    locator_after: 12.D.1(b), 12.D.2, 12.D.3
    verification: read-in-full
    reviewer: small model, version comparison
