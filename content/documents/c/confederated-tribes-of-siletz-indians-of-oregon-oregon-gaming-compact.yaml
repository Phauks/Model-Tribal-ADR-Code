summary: 'The Class III gaming compact documents the Office of Indian Gaming lists for Confederated Tribes of Siletz
  Indians of Oregon and the State of Oregon as of Nov. 21, 2026: 1 original, 9 amendments and 1 replacement. The
  order, the kind of each event and which version is in effect are inferred from the list (project analysis); clause
  summaries and comparisons are a small model''s reading of excerpts.'
