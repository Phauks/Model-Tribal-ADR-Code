    pages: 59
  clauses:
  - topic: dispute-resolution
    locator: Section 6, subsection B (Procedure for Resolving Disputes Concerning Operational Decisions), paragraphs
      1-5
    summary: The State may give written notice of operational concerns, the parties meet and confer within fifteen
      days, either party may seek non-binding arbitration within forty-five days, and the matter may then go to
      the United States District Court for the District of Oregon; an expedited procedure applies to immediate threats.
    methods:
    - negotiation
    - nonbinding-arbitration
    verification: read-in-full
    reviewer: small model, first pass
  - topic: renegotiation
    locator: Section 12, subsection D
    summary: The compact may be amended only if one year has passed after its effective date, the State joins a
      compact with another tribe, or the State expands Class III gaming by statute; either party may request negotiations
      in writing by certified mail, with a 100-day negotiation period in place of the 180 days under IGRA.
    verification: read-in-full
    reviewer: small model, first pass
  changes:
  - topic: dispute-resolution
    compared_with: 1995-original
    change: changed
    summary: Both compacts provide the same general clause (notice, a meeting within 30 days, then a District of
      Oregon action after 90 days with state-court fallback) and the same operational-decisions steps (meet and
      confer within 15 days, non-binding arbitration binding by agreement, federal court); the later compact changes
      the expedited procedure so the Tribal Gaming Commission must follow the State's recommended action unless
      it finds it would adversely affect gaming integrity or that an equally effective, less disruptive action exists,
      and the Native nation may present a disagreement over that finding to the federal court.
    locator_before: Section 6.B (6.B.5); Section 16
