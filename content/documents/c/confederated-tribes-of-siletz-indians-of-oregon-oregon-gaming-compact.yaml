  - topic: dispute-resolution
    locator: Section 6, subsection B, Procedure for Resolving Disputes Concerning Operational Decisions
    summary: The State may give written notice of an operational concern, the parties meet and confer within 15
      days, either party may begin non-binding arbitration within 45 days (binding only if both parties agree),
      and an action may be brought in the United States District Court for the District of Oregon; the State may
      use expedited procedures for immediate threats.
    methods:
    - negotiation
    - nonbinding-arbitration
    verification: read-in-full
    reviewer: small model, older version
  - topic: renegotiation
    locator: Section 12.D.3 Amendments
    summary: Either the State or the Native nation may, by written request sent by certified mail, request negotiations
      to amend, replace or repeal the compact when a listed event occurs; the compact remains in effect during negotiations,
      and a Native nation request is treated under the Act with a 100-day period instead of 180 days.
    verification: read-in-full
    reviewer: small model, older version
