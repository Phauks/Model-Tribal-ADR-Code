      and the general clause keeps notice, a 30-day meeting and a District of Oregon action after 90 days; the later
      compact renumbers the general clause from Section 16 to 17, drops the words ''or any other requirement of
      this section'' from the operational-decision trigger, and replaces the example threat to patron physical safety
