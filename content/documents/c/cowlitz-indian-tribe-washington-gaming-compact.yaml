    summary: The earlier compact (Section XII) provides written notice, a meeting within 20 business days, mediation
      by agreement, arbitration only by mutual agreement (not requested earlier than 20 days after notice) with
      a decision subject to judicial review, and judicial resolution; the 2015 amendment leaves that clause in place
      and adds a 30-day meet-and-confer for disputes over revisions to the State's cost allocation model, and a
      requirement to meet at least 30 days before a terminal allocation increase takes effect, each followed by
