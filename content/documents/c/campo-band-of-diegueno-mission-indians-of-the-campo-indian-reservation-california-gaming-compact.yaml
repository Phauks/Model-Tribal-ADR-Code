    locator: Sec. 12.1 to Sec. 12.3
    summary: The compact may be amended by mutual written agreement, and either party may request renegotiation
      in writing for Class III games other than those authorized, but not within 12 months of the effective date;
      talks are to be scheduled within 30 days and conducted under IGRA good-faith standards enforceable in federal
      court.
    verification: read-in-full
