  changes:
  - topic: dispute-resolution
    compared_with: 2000-original
    change: changed
    summary: The earlier compact provides written notice, a meeting within 10 days, then optional AAA arbitration
      (neither party required to agree) and federal or state court; the later compact provides written notice, a
      written response within 15 days, a meeting within 30 days, then federal or state court action with the Section
      13.4 remedies as the sole remedies and no damages or attorney fees, and adds a Section 13.4 federal-court
      action for material breach with cure period and possible termination; it contains no arbitration step between
      the nation and the state.
