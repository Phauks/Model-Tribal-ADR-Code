  clauses:
  - topic: dispute-resolution
    locator: Sec. 9.0 DISPUTE RESOLUTION PROVISIONS, Sec. 9.1 Voluntary Resolution; Reference to Other Means of
      Resolution
    summary: The compact requires written notice, a meet-and-confer within 10 days and 30 days of negotiation; either
      party may then seek optional arbitration under AAA Commercial Rules, with a binding award, and unresolved
      disputes may go to the federal district court and Ninth Circuit or, if those lack jurisdiction, to state court.
    methods:
    - negotiation
    - arbitration
    verification: read-in-full
    reviewer: small model, first pass
  - topic: renegotiation
    locator: Sec. 12.0 AMENDMENTS; RENEGOTIATIONS, Sec. 12.1 to Sec. 12.4
    summary: The compact may be amended by mutual written agreement, and the Tribe may request renegotiation to
      engage in Class III games not authorized by the compact, but not within 12 months of the effective date; the
      Tribe may terminate if state exclusivity over gaming devices is abrogated.
    verification: read-in-full
    reviewer: small model, first pass
