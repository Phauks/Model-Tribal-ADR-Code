  note: Class III gaming compact for Cahuilla Band of Indians and the State of California under 25 U.S.C. § 2710(d).
summary: 'The Class III gaming compact documents the Office of Indian Gaming lists for Cahuilla Band of Indians
  and the State of California as of Nov. 21, 2026: 1 original and 2 extensions. The order, the kind of each event
  and which version is in effect are inferred from the list (project analysis); clause summaries and comparisons
  are a small model''s reading of excerpts.'
