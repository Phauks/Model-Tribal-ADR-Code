    locator: XI. MISCELLANEOUS TERMS, B. Amendments
    summary: The agreement may be amended only with both parties' consent by signed written instrument; the parties
      must negotiate in good faith if IGRA or state law changes, and the Native nations may notify the State that
      they want additional Class III games.
    verification: read-in-full
    reviewer: larger model, second pass, whole document
