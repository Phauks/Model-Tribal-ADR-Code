  - topic: dispute-resolution
    locator: X. DEFAULT AND TERMINATION, A. Default by Tribes
    summary: 'The agreement uses a default procedure: a party in failure may be terminated after ninety days written
      notice if the breach is not agreed to be remedied and is not in fact remedied; the Native nations may sue
      in Montana state courts for a declaratory ruling or to enjoin termination, and the parties agree to negotiate
      disputed gaming compact issues in good faith.'
