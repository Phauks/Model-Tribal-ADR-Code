  note: The compact's term ran to Dec. 31, 2023, the date this extension set (87 Fed. Reg. 39115 (June 30, 2022));
    no later extension was found on the Office of Indian Gaming list or in the Federal Register. The Secretarial
    Procedures say only that the term was extended to Dec. 31, 2023, so an unlisted later extension is possible;
    if there was one, the procedures' Sec. 17.2 ended the compact on Jan. 31, 2024.
