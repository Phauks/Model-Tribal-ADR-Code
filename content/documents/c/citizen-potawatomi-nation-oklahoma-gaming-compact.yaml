  changes:
  - topic: dispute-resolution
    compared_with: 1992-original
    change: changed
    summary: The later compact provides a meeting within 30 days of notice, then referral by either party to one
      AAA arbitrator, with remedies limited to enforcing the compact and de novo federal district court review of
      any award. The earlier compact provided non-binding arbitration before three arbitrators if unresolved in
      30 days, then a declaratory judgment action in the Western District of Oklahoma that could declare the compact
      terminated.
