  - topic: renegotiation
    locator: SECTION 15.0. AMENDMENTS; RENEGOTIATIONS, Sec. 15.1 to Sec. 15.3; Sec. 14.2(a)
    summary: The compact may be amended at any time by mutual written agreement (Sec. 15.1), written requests to
      amend or renegotiate lead to a negotiation schedule within 90 days (Sec. 15.2), either party may request negotiation
      of an extension or new compact no sooner than 18 months before the termination date (Sec. 14.2(a)), and loss
      of tribal exclusivity within 50 miles lets the Tribe terminate or continue on reduced terms (Sec. 15.3).
    verification: read-in-full
