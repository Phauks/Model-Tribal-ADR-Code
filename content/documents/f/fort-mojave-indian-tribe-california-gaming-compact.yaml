  - topic: dispute-resolution
    locator: SECTION 13.0. DISPUTE RESOLUTION PROVISIONS, Sec. 13.1 Voluntary Resolution and Sec. 13.2 Arbitration
      Rules
    summary: Disputes begin with a written notice, a written response within 15 days and a meet-and-confer within
      30 days; either party may then seek arbitration before a single American Arbitration Association arbitrator,
      but neither party is required to agree to arbitrate, and unresolved disputes may go to the federal district
      court for the Gaming Facility's district or a state court in San Bernardino County; an arbitrator's decision,
      if arbitration is used, is binding.
    methods:
    - negotiation
