    compared_with: 2000-replacement
    change: changed
    summary: The 2000 Section 12 lets the parties amend the Compact, makes it subject to renegotiation on the Tribe's
      request, and sets a 30-day scheduling rule. The 2016 Section 15 keeps mutual written amendment (15.1) and
      adds a new-compact negotiation process with automatic one-year or two-year extensions (15.2), a 45-day scheduling
      rule (15.3) and an entitlement under 15.4 that obliges the State to negotiate in good faith within 45 days
      of a Tribal request, but only where changed market conditions are the stated basis.
