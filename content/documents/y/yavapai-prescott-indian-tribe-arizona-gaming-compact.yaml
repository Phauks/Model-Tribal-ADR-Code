  changes:
  - topic: dispute-resolution
    compared_with: 1993-original
    change: changed
    summary: The later compact provides a 10-day negotiation step with escalation, then non-binding CPR mediation
      on request, then binding CPR arbitration on demand after 30 days, normally before three arbitrators. The earlier
      compact went from a meeting within 10 days to arbitration in Arizona after 30 days, with one arbitrator or
      a panel of three and a final, binding and unappealable decision.
    locator_before: Section 15(a)-(f)
    locator_after: Section 15(a)-(c)
    verification: read-in-full
    reviewer: larger model, second pass on the full text
  - topic: renegotiation
    compared_with: 1993-original
    change: changed
    summary: The 1993 Section 17 says amendments must be in writing and signed by both parties, and that the terms
      stay in effect until amended, modified or terminated. The 2003 Section 17 keeps those rules in 17(c) and adds
      a list of regulatory provisions the State or Tribe may propose to amend within 180 days, a 90-day good-faith
      negotiation duty, mediation under Section 15(b) if talks fail, and Governor authority to agree to amendments.
    locator_before: Section 17 (Amendments)
    locator_after: Section 17(a)-(c)
    verification: read-in-full
    reviewer: small model, version comparison
