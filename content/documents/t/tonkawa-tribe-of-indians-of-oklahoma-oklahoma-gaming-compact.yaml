  changes:
  - topic: dispute-resolution
    compared_with: 1994-original
    change: changed
    summary: The later compact provides a 30-day meeting, then referral by either party to one AAA arbitrator, with
      remedies limited to enforcing the compact and de novo federal district court review of any award. The earlier
      compact provided a 30-day meeting, non-binding arbitration after 60 days with each party naming an arbitrator,
      then a suit for breach in the Western District of Oklahoma.
