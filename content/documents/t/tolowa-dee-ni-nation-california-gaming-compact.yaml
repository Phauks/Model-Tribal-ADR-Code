  - topic: dispute-resolution
    locator: SECTION 13.0. DISPUTE RESOLUTION PROVISIONS, Sec. 13.1 Voluntary Resolution; Court Resolution and Sec.
      13.2 Arbitration Rules
    summary: Disputes under the compact begin with a written notice, a written response within 15 days and a meet-and-confer
      within 30 days; if unresolved either party may seek arbitration before JAMS, but neither party is required
      to agree to arbitrate, and unresolved disputes may be brought in the federal district court for the district
      of the Gaming Facility or, if that court lacks jurisdiction, a state court of competent jurisdiction in the
      county.
    methods:
    - negotiation
    - nonbinding-arbitration
    verification: read-in-full
    reviewer: larger model, second pass, whole document
  - topic: renegotiation
    locator: SECTION 15.0. AMENDMENTS; RENEGOTIATIONS, Sec. 15.1 to Sec. 15.6
    summary: Sec. 15.1 permits amendment at any time by mutual written agreement if each party voluntarily consents
      to the negotiations in writing, Sec. 15.2 lets either party request negotiation of an extension or new compact
      no sooner than 18 months before the termination date, and Sec. 15.3 requires written requests and a schedule
      for negotiations. Sec. 15.3 requires the parties to meet within 30 days and negotiate a replacement if a court
      holds a compact provision invalid or inoperable because of a change in the law. Sec. 15.4 requires good-faith
      negotiation at the Tribe's written request where changed conditions either materially and adversely affect
      the Tribe's gaming operation or create opportunities to expand beyond the compact's device or facility limits,
      if the Tribe supplies adequate information; Sec. 15.5 requires good-faith negotiation to add Class III games
      the State newly authorizes.
    verification: read-in-full
