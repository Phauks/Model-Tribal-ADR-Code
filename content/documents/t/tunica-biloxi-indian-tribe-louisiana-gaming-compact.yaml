    pages: 43
  clauses:
  - topic: dispute-resolution
    locator: Section 14(A)-(D), Dispute Resolution
    summary: Patron prize disputes go to an Inspector and then the Tribal Gaming Commission, then mediation and
      legal action; for other disputes the parties meet within ten days, then mediate under the AAA Commercial Mediation
      Rules, and may then sue, with exclusive venue in the 19th Judicial District Court where the State of Louisiana
      is a party.
    methods:
    - negotiation
    - mediation
    verification: read-in-full
    reviewer: small model, older version
  - topic: renegotiation
    locator: Section 13(A)-(C), Amendment and Revision
    summary: Section 13 allows amendment only by written instrument signed by the Tribal Chairman and the Governor
      and approved by the Secretary; unless written concurrence is given within thirty days the parties are deemed
      to disagree, then they meet within ten days and unresolved matters follow the Section 14(C) mediation process.
    verification: read-in-full
    reviewer: small model, older version
