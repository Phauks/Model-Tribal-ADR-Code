  - topic: dispute-resolution
    locator: Section 14(D)(1)-(3), Dispute Resolution
    summary: Disputes go through a 10-day notice, a preliminary meeting and a 45-day negotiation period, then Commercial
      Mediation Rules of the American Arbitration Association, and then formal binding arbitration under AAA rules
      if the mediator's summary report leaves the issues unresolved.
    methods:
    - negotiation
    - mediation
    - arbitration
    verification: read-in-full
