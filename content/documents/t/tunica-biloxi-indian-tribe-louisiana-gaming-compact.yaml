  note: Class III gaming compact for Tunica-Biloxi Indian Tribe and the State of Louisiana under 25 U.S.C. § 2710(d).
summary: 'The Class III gaming compact documents the Office of Indian Gaming lists for Tunica-Biloxi Indian Tribe
  and the State of Louisiana as of Nov. 21, 2026: 1 original, 3 amendments, 3 extensions and 2 replacements. The
  order, the kind of each event and which version is in effect are inferred from the list (project analysis); clause
  summaries and comparisons are a small model''s reading of excerpts.'
