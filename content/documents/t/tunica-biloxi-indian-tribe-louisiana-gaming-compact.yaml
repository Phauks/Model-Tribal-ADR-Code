  - topic: renegotiation
    locator: Section 13(A), Amendment and Revision
    summary: Section 13 allows amendment only by written instrument signed by the Tribal Chairman and the Governor
      and approved by the Secretary; written notice requests concurrence, which is deemed disagreement after thirty
      days, followed by a ten-day meeting and non-binding mediation under Section 14(C), and unresolved amendments
      are not adopted.
    verification: read-in-full
    reviewer: small model, older version
  changes:
  - topic: dispute-resolution
    compared_with: 1992-original
    change: changed
    summary: The later compact provides, for disputes between the Native nation and the state, notice within 10
      days, a meeting within 10 days and 45 days of negotiation, AAA Commercial Mediation, and then formal binding
      arbitration under AAA rules (one arbitrator or a panel of three) with a final, non-reviewable decision. The
      earlier compact went from mediation under the same AAA rules straight to a legal action, with exclusive venue
      in the 19th Judicial District Court where the State is a party.
    locator_before: Section 14(D)
    locator_after: Section 14(D)(1)-(3)
    verification: read-in-full
    reviewer: larger model, second pass on the full text
  - topic: renegotiation
    compared_with: 1992-original
    change: changed
    summary: The 2001 Section 13(A) keeps the written, Secretary-approved amendment rule, but after a deemed disagreement
      the parties must meet within ten days and, if unresolved, go to non-binding mediation under Section 14(C),
      and if mediation fails the proposed amendments are not adopted. The 1992 Section 13(C) instead sent unresolved
      amendment differences to the Section 14(C) et seq. procedures, which included legal action. Section 13(B)
      on revisions now uses the Section 14(D) mediation and arbitration procedures if the parties disagree.
    locator_before: Section 13(C)
    locator_after: Section 13(A)
    verification: read-in-full
    reviewer: small model, version comparison
