    locator: Part 15. DURATION AND NEGOTIATION, subsection B
    summary: Within 180 days after expiration of the Compact or any renewal, either the tribe or the state, acting
      through its Governor, may request renegotiation of subsections A and E of Part 11; the Compact otherwise renews
      automatically for fifteen-year terms if electronic gaming is authorized.
