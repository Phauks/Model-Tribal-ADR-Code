    locator: Part 12. DISPUTE RESOLUTION
    summary: Disputes start with written notice and a meeting of tribal and state representatives within thirty
      days, then either party may refer the dispute to arbitration under AAA rules, and an award may be reviewed
      de novo by a federal district court whose decision is subject to appeal.
    methods:
