  changes:
  - topic: dispute-resolution
    compared_with: 1993-original
    change: changed
    summary: The later compact provides a 10-day negotiation step with escalation, then non-binding CPR mediation
      on either party's request, then binding CPR arbitration on demand after 30 days before a three-arbitrator
      panel. The earlier compact went from a 10-day meeting to mandatory arbitration in Arizona after 30 days, with
      a majority decision that was final, binding and unappealable.
    locator_before: Section 15(a)-(f)
