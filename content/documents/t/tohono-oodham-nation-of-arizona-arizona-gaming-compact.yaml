    change: changed
    summary: The 1993 Section 17 says amendments must be in writing and signed by both parties, while the 2003 Section
      17 adds a 180-day window to propose amendments on listed regulatory topics, requires good-faith negotiation
      and then mediation under Section 15(b) if no agreement is reached, and states that the Governor may agree
      to amendments consistent with Arizona law.
