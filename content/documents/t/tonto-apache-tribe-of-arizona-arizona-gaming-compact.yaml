      Section 17 adds a 180-day window to propose amendments on listed regulatory topics, requires good-faith negotiation
      and then mediation under Section 15(b) if no agreement is reached, and adds that amendments may be made at
      any time by mutual agreement and that the Governor may agree to amendments consistent with Arizona law.
