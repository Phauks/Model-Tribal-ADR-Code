    compared_with: 1993-original
    change: changed
    summary: The later compact provides a 10-day negotiation step with escalation, then non-binding CPR mediation
      on request, then binding CPR arbitration on demand after 30 days before a three-arbitrator panel. The earlier
      compact went from a 10-day meeting to arbitration in Arizona after 30 days, with a final, binding and unappealable
      decision, so the mediation step and CPR rules are new rather than the binding character.
