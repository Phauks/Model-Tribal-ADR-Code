      adds Secretary approval or deemed approval under the Act. The 2003 Section 17(a)-(b) list of proposals and
      mediation steps does not appear in the 2021 Section 17 text. The 2021 compact instead lets the Tribe and State
      Gaming Agency modify appendices under Section 3(b)(3)(A) without treating that as an amendment, with a 180-day
