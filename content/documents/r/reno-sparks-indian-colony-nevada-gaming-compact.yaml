  - topic: renegotiation
    locator: ARTICLE XI. AMENDMENTS
    summary: The compact may be amended only with both parties' consent by signed written instrument; the parties
      must negotiate in good faith if applicable law changes in a substantial way, and the term may be extended
      by mutual agreement if the Native nation plans a financed casino.
    verification: read-in-full
    reviewer: larger model, second pass, whole document
