  - topic: dispute-resolution
    locator: ARTICLE X. DEFAULT AND TERMINATION, 1. Default
    summary: After written notice of a default the party has sixty days to correct; if not, the parties meet within
      thirty days, and if still unresolved either party may pursue any lawful remedy, including a federal action
      under 25 U.S.C. 2710(d)(7)(A); the parties consent to the jurisdiction of any court of competent jurisdiction
      and may agree in writing to mediation or arbitration.
    methods:
    - negotiation
    verification: read-in-full
