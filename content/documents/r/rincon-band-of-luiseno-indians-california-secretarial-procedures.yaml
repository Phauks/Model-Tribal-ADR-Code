    summary: The only dispute-resolution provision is Sec. 9.0.1, which says NIGC enforcement of the procedures
      follows IGRA and NIGC regulations and NIGC decisions or actions are not subject to arbitration; the amended
      and restated text has no State-Tribe dispute process.
    verification: read-in-full
