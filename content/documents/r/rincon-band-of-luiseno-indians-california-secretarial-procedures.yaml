  changes:
  - topic: dispute-resolution
    compared_with: 2013-original
    change: removed
    summary: The 2013 Secretarial Procedures contain notice, a 10-day meet-and-confer, optional AAA arbitration
      and court provisions in Sections 9.1 to 9.4. The 2025 Amended and Restated Secretarial Procedures keep only
      Section 9.0.1 (NIGC enforcement consistent with IGRA; NIGC decisions and actions not subject to arbitration)
      and go directly to Section 10.0, so no State-Native nation dispute process remains in the text.
    locator_before: Sec. 9.0.1-9.4
