  - topic: renegotiation
    locator: Sec. 12.0 AMENDMENTS; RENEGOTIATIONS, Sec. 12.1 to Sec. 12.3; Sec. 15.5 Most Favored Tribe
    summary: The Tribe may request amendment in writing to the Secretary under IGRA, but not within 12 months of
      the most recent amendment's effective date except to amend Sec. 4.1, and the Secretary must meet and confer,
      with agreement not unreasonably withheld or delayed; Sec. 12.2 reserves IGRA rights if state law expands permissible
      gaming, and Sec. 15.5 has a most favored tribe provision.
    verification: read-in-full
