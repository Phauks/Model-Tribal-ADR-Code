  - topic: renegotiation
    compared_with: 2013-original
    change: changed
    summary: The 2013 Secretarial Procedures let the terms be superseded by a Class III compact, allow amendment
      for new forms of Class III gaming after 12 months, and provide for requests to negotiate a compact; the 2025
      Amended and Restated Secretarial Procedures provide that the Tribe may submit a written amendment request
      to the Secretary, which the Secretary shall meet and confer on, with agreement not to be unreasonably withheld,
      and do not contain the compact-supersession or compact-negotiation request provisions shown in the earlier
      text.
