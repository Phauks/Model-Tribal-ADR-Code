    summary: The compact may be amended by mutual written agreement, and the La Posta Tribe may request renegotiation
      in writing for Class III games other than those authorized, but not within twelve months of the effective
      date; if exclusivity is lost the Tribe may terminate or continue on reduced rates, and either party may request
      negotiations in March 2008 and every fourth March thereafter.
