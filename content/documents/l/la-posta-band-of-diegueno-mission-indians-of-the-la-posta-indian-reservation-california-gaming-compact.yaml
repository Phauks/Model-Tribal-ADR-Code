    summary: The 2024 compact provides written notice, a written response within 15 days, a meet and confer within
      30 days, and then court action in federal district court (or state court if federal court lacks jurisdiction),
      with remedies limited to injunctive relief, specific performance and declaratory relief and a separate judicial
      process for material breach; arbitration is no longer in the clause. The 2003 compact provided written notice,
      a meet and confer within 10 days, and after 30 more days optional arbitration (neither party required to agree)
