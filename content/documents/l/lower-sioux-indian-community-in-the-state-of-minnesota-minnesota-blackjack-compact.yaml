  - topic: dispute-resolution
    compared_with: 1991-original
    change: added
    summary: 'The later amendment adds a process for violations of the card-game addendum: the Department of Public
      Safety sends an Alleged Violation Notice, the Community''s Gaming Commission has 30 days to investigate and
      order corrective action, and if the Community disputes the violation the parties meet within 15 days and otherwise
      each may pursue remedies under IGRA. The earlier compact has no process for disputes between the Community
      and the State; it only says it does not limit jurisdiction or remedies under IGRA.'
