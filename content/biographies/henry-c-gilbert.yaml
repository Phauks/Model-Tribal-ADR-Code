key: henry-c-gilbert
name: Henry C. Gilbert
lead: Signed four treaties with Native nations for the United States, 1854–1855.
living: false
cases: []
events:
- when: Sept. 30, 1854
  text: Signed the Treaty with the Chippewa, 1854, for the United States, listed as commissioner on the part of the United States.
  source: treaty-with-the-chippewa-1854
  where: 10 Stat. 1112
- when: July 31, 1855
  text: Signed the Treaty with the Ottawa and Chippewa, 1855, for the United States, listed as commissioner.
  source: treaty-with-the-ottawa-and-chippewa-1855
  where: 11 Stat. 624
- when: Aug. 2, 1855
  text: Signed the Treaty with the Chippewa of Saginaw, etc., 1855, for the United States, listed as commissioner.
  source: treaty-with-the-chippewa-of-saginaw-etc-1855
  where: 11 Stat. 635
- when: Aug. 2, 1855
  text: Signed the Treaty with the Chippewa of Sault Ste. Marie, 1855, for the United States, listed as commissioner.
  source: treaty-with-the-chippewa-of-sault-ste-marie-1855
  where: 11 Stat. 631
