key: john-mcelvain
name: John McElvain
lead: Named in the treaties as Indian agent for the Wyandots, Senecas and Shawnees. Signed two treaties with Native nations for the United States, 1831.
living: false
cases: []
events:
- when: July 20, 1831
  text: Signed the Treaty with the Seneca, etc., 1831, for the United States, listed as Indian agent for the Wyandots, Senecas and Shawnees.
  source: treaty-with-the-seneca-etc-1831
  where: 7 Stat. 354
- when: Aug. 8, 1831
  text: Signed the Treaty with the Shawnee, 1831, for the United States, listed as Indian Agent for the Wyandots, Senecas and Shawnees.
  source: treaty-with-the-shawnee-1831
  where: 7 Stat. 358
