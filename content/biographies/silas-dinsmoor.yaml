key: silas-dinsmoor
name: Silas Dinsmoor
lead: Named in the treaties as Agent of the United States to the Chaktaws. Signed two treaties with Native nations for the United States, 1805.
living: false
cases: []
events:
- when: July 23, 1805
  text: Signed the Treaty with the Chickasaw, 1805, for the United States, listed as commissioner.
  source: treaty-with-the-chickasaw-1805
  where: 7 Stat. 90
- when: Nov. 16, 1805
  text: Signed the Treaty with the Choctaw, 1805, for the United States, listed as commissioner plenipotentiary and agent of the United States to the Chaktaws.
  source: treaty-with-the-choctaw-1805
  where: 7 Stat. 100
checked: '2026-11-27'
