key: j-w-perit-huntington
name: J. W. Perit Huntington
lead: Named in the treaties as Super-intendent of Indian affairs in Oregon, Sup’t Indian affairs for Oregon, and Acting Commissioner. Signed three treaties with Native nations for the United States, 1864–1865.
living: false
cases: []
events:
- when: Oct. 14, 1864
  text: Signed the Treaty with the Klamath, etc., 1864, for the United States, listed as superintendent of Indian affairs in Oregon.
  source: treaty-with-the-klamath-etc-1864
  where: 16 Stat. 710
- when: Aug. 12, 1865
  text: Signed the Treaty with the Snake, 1865, for the United States, listed as super-intendent of Indian affairs in Oregon.
  source: treaty-with-the-snake-1865
  where: 14 Stat. 684
- when: Nov. 15, 1865
  text: Signed the Treaty with the Middle Oregon Tribes, 1865, for the United States, listed as sup’t Indian affairs for Oregon and acting Commissioner.
  source: treaty-with-the-middle-oregon-tribes-1865
  where: 14 Stat. 752
checked: '2026-11-27'
