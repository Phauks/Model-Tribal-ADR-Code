key: h-knox
name: H. Knox
lead: Signed three treaties with Native nations for the United States, 1790–1794.
living: false
cases: []
events:
- when: Aug. 7, 1790
  text: Signed the Treaty with the Creeks, 1790, for the United States, listed as Secretary of War and sole commissioner for treating with the Creek nation of Indians.
  source: treaty-with-the-creeks-1790
  where: 7 Stat. 38
- when: July 2, 1791
  text: Signed the Treaty with the Cherokee, 1791, for the United States, listed as Secretary of War.
  source: treaty-with-the-cherokee-1791
  where: 7 Stat. 42
- when: June 26, 1794
  text: Signed the Treaty with the Cherokee, 1794, for the United States, listed as Secretary of War.
  source: treaty-with-the-cherokee-1794
  where: 7 Stat. 44
checked: '2026-11-26'
