key: elijah-sells
name: Elijah Sells
lead: Signed five treaties with Native nations for the United States, 1865–1866.
living: false
cases: []
events:
- when: Sept. 29, 1865
  text: Signed the Treaty with the Osage, 1865, for the United States, listed as Superintendent Indian Affairs Southern Superintendency, and Commissioner.
  source: treaty-with-the-osage-1865
  where: 14 Stat. 693
- when: Mar. 21, 1866
  text: Signed the Treaty with the Seminole, 1866, for the United States, listed as Superintendent Indian Affairs.
  source: treaty-with-the-seminole-1866
  where: 14 Stat. 760
- when: Apr. 28, 1866
  text: Signed the Treaty with the Choctaw and Chickasaw, 1866, for the United States, listed as superintendent of Indian affairs.
  source: treaty-with-the-choctaw-and-chickasaw-1866
  where: 14 Stat. 781
- when: June 14, 1866
  text: Signed the Treaty with the Creeks, 1866, for the United States, listed as Superintendent Indian Affairs.
  source: treaty-with-the-creeks-1866
  where: 14 Stat. 790
- when: July 19, 1866
  text: Signed the Treaty with the Cherokee, 1866, for the United States, listed as Superintendent of Indian Affairs.
  source: treaty-with-the-cherokee-1866
  where: 14 Stat. 807
checked: '2026-11-26'
