  where: 12 Stat. 1252
- when: May 7, 1864
  text: Signed the Treaty with the Chippewa, Mississippi, and Pillager and Lake Winnibigoshish Bands, 1864, for the United States, listed as Commissioner Indian Affairs.
  source: treaty-with-the-chippewa-mississippi-and-pillager-and-lake-winnibigoshish-bands-1864
  where: 13 Stat. 696
- when: Mar. 8, 1865
