key: n-g-taylor
name: N. G. Taylor
lead: U.S. Representative from Tennessee. Named in the treaties as President of Indian Commission, President of Indn. Commission, and Commissioner of Indian Affairs. Signed eight treaties with Native nations for the United States, 1867–1868.
living: false
cases: []
events:
- when: '1853'
  text: Served in the U.S. House of Representatives for Tennessee during the term 1853–1855.
  source: biographical-directory-of-the-united-states-congress
  where: Bioguide ID T000095
- when: '1865'
  text: Served in the U.S. House of Representatives for Tennessee during the term 1865–1867.
  source: biographical-directory-of-the-united-states-congress
  where: Bioguide ID T000095
- when: Oct. 21, 1867
  text: Signed the Treaty with the Kiowa and Comanche, 1867, for the United States, listed as commissioner and President of Indian Commission.
  source: treaty-with-the-kiowa-and-comanche-1867
  where: 15 Stat. 586
- when: Oct. 21, 1867
  text: Signed the Treaty with the Kiowa, Comanche, and Apache, 1867, for the United States, listed as commissioner and President of Indian Commission.
  source: treaty-with-the-kiowa-comanche-and-apache-1867
  where: 15 Stat. 591
- when: Oct. 28, 1867
  text: Signed the Treaty with the Cheyenne and Arapaho, 1867, for the United States, listed as commissioner and President of Indn. Commission.
