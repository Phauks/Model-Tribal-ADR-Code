key: timothy-pickering
name: Timothy Pickering
lead: U.S. Senator from Massachusetts and U.S. Representative from Massachusetts. Named in the treaties as Sole agent and Agent for the United States. Signed two treaties with Native nations for the United States, 1794.
living: false
cases: []
events:
- when: Nov. 11, 1794
  text: Signed the Treaty with the Six Nations, 1794, for the United States, listed as sole agent.
  source: treaty-with-the-six-nations-1794
  where: 7 Stat. 46
- when: Dec. 2, 1794
  text: Signed the Treaty with the Oneida, etc., 1794, for the United States, listed as agent for the United States.
  source: treaty-with-the-oneida-etc-1794
  where: 7 Stat. 48
- when: '1803'
  text: Served in the U.S. Senate for Massachusetts during the terms 1803–1811.
  source: biographical-directory-of-the-united-states-congress
  where: Bioguide ID P000324
- when: '1813'
  text: Served in the U.S. House of Representatives for Massachusetts during the terms 1813–1817.
  source: biographical-directory-of-the-united-states-congress
  where: Bioguide ID P000324
checked: '2026-11-27'
