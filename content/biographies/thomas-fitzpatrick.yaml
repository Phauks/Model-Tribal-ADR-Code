key: thomas-fitzpatrick
name: Thomas Fitzpatrick
lead: Named in the treaties as Indian agent. Signed two treaties with Native nations for the United States, 1851–1853.
living: false
cases: []
events:
- when: Sept. 17, 1851
  text: Signed the Treaty of Fort Laramie with Sioux, etc., 1851, for the United States, listed as commissioner and Indian agent.
  source: treaty-of-fort-laramie-with-sioux-etc-1851
  where: 11 Stat. 749
- when: July 27, 1853
  text: Signed the Treaty with the Comanche, Kiowa, and Apache, 1853, for the United States, listed as sole commissioner and Indian agent.
  source: treaty-with-the-comanche-kiowa-and-apache-1853
  where: 10 Stat. 1015
checked: '2026-11-27'
