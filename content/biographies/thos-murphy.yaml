key: thos-murphy
name: Thos. Murphy
lead: Signed seven treaties with Native nations for the United States, 1865–1867.
living: false
cases: []
events:
- when: Oct. 14, 1865
  text: Signed the Treaty with the Cheyenne and Arapaho, 1865, for the United States, listed as Commissioners on the part of the United States.
  source: treaty-with-the-cheyenne-and-arapaho-1865
  where: 14 Stat. 707
- when: Oct. 17, 1865
  text: Signed the Treaty with the Apache, Cheyenne, and Arapaho, 1865, for the United States, listed as Commissioners on the part of the United States.
  source: treaty-with-the-apache-cheyenne-and-arapaho-1865
  where: 14 Stat. 714
- when: Oct. 18, 1865
  text: Signed the Treaty with the Comanche and Kiowa, 1865, for the United States.
  source: treaty-with-the-comanche-and-kiowa-1865
  where: 14 Stat. 720
- when: July 4, 1866
  text: Signed the Treaty with the Delawares, 1866, for the United States, listed as Superintendent.
  source: treaty-with-the-delawares-1866
  where: 14 Stat. 797
- when: Feb. 18, 1867
  text: Signed the Treaty with the Sauk and Foxes, 1867, for the United States, listed as Superintendent of Indian Affairs.
  source: treaty-with-the-sauk-and-foxes-1867
  where: 15 Stat. 499
- when: Feb. 23, 1867
  text: Signed the Treaty with the Seneca, Mixed Seneca and Shawnee, Quapaw, etc., 1867, for the United States, listed as Superintendent of Indian Affairs.
  source: treaty-with-the-seneca-mixed-seneca-and-shawnee-quapaw-etc-1867
  where: 15 Stat. 523
- when: Feb. 27, 1867
  text: Signed the Treaty with the Potawatomi, 1867, for the United States, listed as Superintendent of Indian Affairs.
  source: treaty-with-the-potawatomi-1867
  where: 15 Stat. 534
checked: '2026-11-26'
