key: joshua-pilcher
name: Joshua Pilcher
lead: Named in the treaties as U. S. Ind. s. agt and U. S. Indian agent. Signed two treaties with Native nations for the United States, 1836–1837.
living: false
cases: []
events:
- when: Oct. 15, 1836
  text: Signed the Treaty with the Oto, etc., 1836, for the United States, listed as U. S. Ind. s. agt.
  source: treaty-with-the-oto-etc-1836
  where: 7 Stat. 526
- when: Nov. 23, 1837
  text: Signed the Treaty with the Iowa, 1837, for the United States, listed as U. S. Indian agent.
  source: treaty-with-the-iowa-1837
