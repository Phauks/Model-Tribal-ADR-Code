key: samuel-f-tappan
name: Samuel F. Tappan
lead: Signed eight treaties with Native nations for the United States, 1867–1868.
living: false
names:
- name: S. F. Tappan
  note: as the Treaty with the Sioux-Brule, Oglala, Miniconjou, Yanktonai, Hunkpapa, Blackfeet, Cuthead, Two Kettle, Sans Arcs, and Santee-and Arapaho, 1868 prints it
  source: treaty-with-the-sioux-and-arapaho-1868
  where: 15 Stat. 647
cases: []
events:
- when: Oct. 21, 1867
  text: Signed the Treaty with the Kiowa and Comanche, 1867, for the United States.
  source: treaty-with-the-kiowa-and-comanche-1867
  where: 15 Stat. 586
- when: Oct. 21, 1867
  text: Signed the Treaty with the Kiowa, Comanche, and Apache, 1867, for the United States.
  source: treaty-with-the-kiowa-comanche-and-apache-1867
  where: 15 Stat. 591
- when: Oct. 28, 1867
  text: Signed the Treaty with the Cheyenne and Arapaho, 1867, for the United States.
  source: treaty-with-the-cheyenne-and-arapaho-1867
  where: 15 Stat. 598
- when: Apr. 29, 1868
  text: Signed the Treaty with the Sioux-Brule, Oglala, Miniconjou, Yanktonai, Hunkpapa, Blackfeet, Cuthead, Two Kettle, Sans Arcs, and Santee-and Arapaho, 1868, for the United States.
  source: treaty-with-the-sioux-and-arapaho-1868
  where: 15 Stat. 647
- when: May 7, 1868
  text: Signed the Treaty with the Crows, 1868, for the United States.
  source: treaty-with-the-crows-1868
  where: 15 Stat. 653
- when: May 10, 1868
  text: Signed the Treaty with the Northern Cheyenne and Northern Arapaho, 1868, for the United States, listed as Commissioners.
  source: treaty-with-the-northern-cheyenne-and-northern-arapaho-1868
  where: 15 Stat. 655
- when: June 1, 1868
  text: Signed the Treaty with the Navaho, 1868, for the United States, listed as Indian Peace Commissioner.
  source: treaty-with-the-navaho-1868
  where: 15 Stat. 667
- when: July 3, 1868
  text: Signed the Treaty with the Eastern Band Shoshoni and Bannock, 1868, for the United States.
  source: treaty-with-the-eastern-band-shoshoni-and-bannock-1868
  where: 15 Stat. 673
