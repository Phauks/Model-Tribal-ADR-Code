key: james-wilkinson
name: James Wilkinson
lead: Named in the treaties as Brigadier general in the service of the United States and Brigadier-General in the army of the United States. Signed five treaties with Native nations for the United States, 1801–1803.
living: false
cases: []
events:
- when: Oct. 24, 1801
  text: Signed the Treaty with the Chickasaw, 1801, for the United States, listed as commissioner and brigadier general in the service of the United States.
  source: treaty-with-the-chickasaw-1801
  where: 7 Stat. 66
- when: Dec. 17, 1801
  text: Signed the Treaty with the Choctaw, 1801, for the United States, listed as commissioner plenipotentiary and Brigadier-General in the army of the United States.
  source: treaty-with-the-choctaw-1801
  where: 7 Stat. 68
- when: June 16, 1802
  text: Signed the Treaty with the Creeks, 1802, for the United States, listed as commissioner plenipotentiary and Brigadier General in the army of the United States.
  source: treaty-with-the-creeks-1802
  where: 7 Stat. 70
- when: Oct. 17, 1802
  text: Signed the Treaty with the Choctaw, 1802, for the United States, listed as commissioner for holding conferences with the Indians south of the Ohio River and brigadier general.
  source: treaty-with-the-choctaw-1802
  where: 7 Stat. 74
- when: Aug. 31, 1803
  text: Signed the Treaty with the Choctaw, 1803, for the United States, listed as commissioner plenipotentiary and Brigadier General.
  source: treaty-with-the-choctaw-1803
  where: 7 Stat. 80
checked: '2026-11-27'
