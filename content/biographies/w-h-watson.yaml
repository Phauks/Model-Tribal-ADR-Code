key: w-h-watson
name: W. H. Watson
lead: Signed six treaties with Native nations for the United States, 1866–1867.
living: false
cases: []
events:
- when: July 4, 1866
  text: Signed the Treaty with the Delawares, 1866, for the United States, listed as special commissioner.
  source: treaty-with-the-delawares-1866
  where: 14 Stat. 797
- when: Feb. 18, 1867
  text: Signed the Treaty with the Sauk and Foxes, 1867, for the United States, listed as special commissioner.
  source: treaty-with-the-sauk-and-foxes-1867
  where: 15 Stat. 499
- when: Feb. 19, 1867
  text: Signed the Treaty with the Sioux-Sisseton and Wahpeton Bands, 1867, for the United States, listed as commissioners on the part of the United States.
  source: treaty-with-the-sioux-sisseton-and-wahpeton-bands-1867
  where: 15 Stat. 508
- when: Feb. 23, 1867
  text: Signed the Treaty with the Seneca, Mixed Seneca and Shawnee, Quapaw, etc., 1867, for the United States, listed as special commissioner.
  source: treaty-with-the-seneca-mixed-seneca-and-shawnee-quapaw-etc-1867
  where: 15 Stat. 523
- when: Feb. 27, 1867
  text: Signed the Treaty with the Potawatomi, 1867, for the United States, listed as special commissioner.
  source: treaty-with-the-potawatomi-1867
  where: 15 Stat. 534
- when: Mar. 19, 1867
  text: Signed the Treaty with the Chippewa of the Mississippi, 1867, for the United States.
  source: treaty-with-the-chippewa-of-the-mississippi-1867
  where: 16 Stat. 721
checked: '2026-11-27'
