  role: Appellant; complainant for himself and all other members of the confederated tribes of the Kiowa, Comanche and Apache Indians
  result: Decree dismissing the bill affirmed.
  where: 187 U.S. at 560, 568
events:
- when: June 6, 1901
  text: Filed a bill in the Supreme Court of the District of Columbia against the Secretary of the Interior, the Commissioner of Indian Affairs and the Commissioner of the General Land Office, suing for himself and all other members of the confederated tribes of the Kiowa, Comanche and Apache Indians residing in the Territory of Oklahoma.
  source: lone-wolf-v-hitchcock
  where: 187 U.S. at 560
- when: Jan. 5, 1903
  text: The Supreme Court affirmed the decree against him.
  source: lone-wolf-v-hitchcock
