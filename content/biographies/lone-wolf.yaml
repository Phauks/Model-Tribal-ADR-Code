key: lone-wolf
name: Lone Wolf
lead: Kiowa leader who sued the Secretary of the Interior to stop the allotment of the Kiowa, Comanche, and Apache Reservation; in Lone Wolf v. Hitchcock (1903) the Supreme Court affirmed the dismissal of his suit.
living: false
