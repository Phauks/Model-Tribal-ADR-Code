key: clark-w-thompson
name: Clark W. Thompson
lead: Signed five treaties with Native nations for the United States, 1863–1865.
living: false
cases: []
events:
- when: Mar. 11, 1863
  text: Signed the Treaty with the Chippewa of the Mississippi and the Pillager and Lake Winnibigoshish Bands, 1863, for the United States, listed as superintendent of Indian affairs for the northern superintendency.
  source: treaty-with-the-chippewa-of-the-mississippi-and-the-pillager-and-lake-winnibigoshish-bands-1863
  where: 12 Stat. 1252
- when: Apr. 12, 1864
  text: Signed the Treaty with the Chippewa - Red Lake and Pembina Bands, 1864, for the United States, listed as Commissioners.
  source: treaty-with-the-chippewa-red-lake-and-pembina-bands-1864
  where: 13 Stat. 690
- when: May 7, 1864
  text: Signed the Treaty with the Chippewa, Mississippi, and Pillager and Lake Winnibigoshish Bands, 1864, for the United States, listed as Superintendent Indian Affairs.
  source: treaty-with-the-chippewa-mississippi-and-pillager-and-lake-winnibigoshish-bands-1864
  where: 13 Stat. 696
- when: Mar. 6, 1865
  text: Signed the Treaty with the Omaha, 1865, for the United States, listed as Commissioners.
  source: treaty-with-the-omaha-1865
  where: 14 Stat. 669
- when: Mar. 8, 1865
  text: Signed the Treaty with the Winnebago, 1865, for the United States.
  source: treaty-with-the-winnebago-1865
  where: 14 Stat. 672
checked: '2026-11-26'
