key: john-reynolds
name: John Reynolds
lead: U.S. Representative from Illinois. Named in the treaties as Governor of the State of Illinois. Signed two treaties with Native nations for the United States, 1832.
living: false
cases: []
events:
- when: Sept. 15, 1832
  text: Signed the Treaty with the Winnebago, 1832, for the United States, listed as Commissioners and Governor of the State of Illinois.
