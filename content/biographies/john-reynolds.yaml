  where: 7 Stat. 373
- when: Sept. 21, 1832
  text: Signed the Treaty with the Sauk and Foxes, 1832, for the United States, listed as commissioner and Governor of the State of Illinois.
  source: treaty-with-the-sauk-and-foxes-1832
  where: 7 Stat. 376
- when: '1833'
  text: Served in the U.S. House of Representatives for Illinois during the terms 1833–1837.
