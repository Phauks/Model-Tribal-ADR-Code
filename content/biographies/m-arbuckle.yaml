key: m-arbuckle
name: M. Arbuckle
lead: Named in the treaties as Brevet Brigadier-General, U. S. Army and Brig. General. Signed two treaties with Native nations for the United States, 1838–1839.
living: false
cases: []
events:
- when: Nov. 23, 1838
  text: Signed the Treaty with the Creeks, 1838, for the United States, listed as commissioner and Brevet Brigadier-General, U. S. Army.
  source: treaty-with-the-creeks-1838
  where: 7 Stat. 575
- when: Jan. 11, 1839
  text: Signed the Treaty with the Osage, 1839, for the United States, listed as commissioner, Brig. General, and Brevet Brigadier General, U. S. Army.
  source: treaty-with-the-osage-1839
  where: 7 Stat. 577
checked: '2026-11-27'
