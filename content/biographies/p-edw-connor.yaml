key: p-edw-connor
name: P. Edw. Connor
lead: Named in the treaties as Brigadier-General U. S. Volunteers and Commanding District of Utah. Signed two treaties with Native nations for the United States, 1863.
living: false
cases: []
events:
- when: July 30, 1863
  text: Signed the Treaty with the Shoshoni-Northwestern Bands, 1863, for the United States, listed as Brigadier-General U. S. Volunteers and commanding District of Utah.
  source: treaty-with-the-shoshoni-northwestern-bands-1863
  where: 13 Stat. 665
- when: Oct. 12, 1863
  text: Signed the Treaty with the Shoshoni-Goship, 1863, for the United States, listed as commissioner, Brigadier-General U. S. Volunteers, and Commanding District of Utah.
  source: treaty-with-the-shoshoni-goship-1863
  where: 13 Stat. 684
checked: '2026-11-27'
