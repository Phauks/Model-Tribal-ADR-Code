key: henry-h-sibley
name: Henry H. Sibley
lead: Delegate to Congress from Wisconsin Territory and Delegate to Congress from Minnesota Territory. Named in the treaties as Brigadier-General. Signed nine treaties with Native nations for the United States, 1865.
living: false
