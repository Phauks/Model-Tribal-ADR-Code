key: w-t-sherman
name: W. T. Sherman
lead: Signed five treaties with Native nations for the United States, 1868.
living: false
cases: []
events:
- when: Apr. 29, 1868
  text: Signed the Treaty with the Sioux-Brule, Oglala, Miniconjou, Yanktonai, Hunkpapa, Blackfeet, Cuthead, Two Kettle, Sans Arcs, and Santee-and Arapaho, 1868, for the United States, listed as Lieutenant-General.
  source: treaty-with-the-sioux-and-arapaho-1868
  where: 15 Stat. 647
- when: May 7, 1868
  text: Signed the Treaty with the Crows, 1868, for the United States, listed as Lieutenant-General.
  source: treaty-with-the-crows-1868
  where: 15 Stat. 653
- when: May 10, 1868
  text: Signed the Treaty with the Northern Cheyenne and Northern Arapaho, 1868, for the United States, listed as Lieutenant-General.
  source: treaty-with-the-northern-cheyenne-and-northern-arapaho-1868
  where: 15 Stat. 655
- when: June 1, 1868
  text: Signed the Treaty with the Navaho, 1868, for the United States, listed as Lieutenant-General, Indian Peace Commissioner.
  source: treaty-with-the-navaho-1868
  where: 15 Stat. 667
- when: July 3, 1868
  text: Signed the Treaty with the Eastern Band Shoshoni and Bannock, 1868, for the United States, listed as Lieutenant-General.
  source: treaty-with-the-eastern-band-shoshoni-and-bannock-1868
  where: 15 Stat. 673
checked: '2026-11-26'
