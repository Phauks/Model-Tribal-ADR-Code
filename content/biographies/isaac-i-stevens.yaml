key: isaac-i-stevens
name: Isaac I. Stevens
lead: Delegate to Congress from Washington Territory. Named in the treaties as Governor and superintendent of Indian affairs for the Territory of Washington and Governor and Sup’t of Indian Affairs. Signed 10 treaties with Native nations for the United States, 1854–1855.
living: false
cases: []
events:
- when: Dec. 26, 1854
  text: Signed the Treaty with the Nisqualli, Puyallup, etc., 1854, for the United States, listed as governor and superintendent of Indian affairs.
  source: treaty-with-the-nisqualli-puyallup-etc-1854
  where: 10 Stat. 1134
- when: Jan. 22, 1855
  text: Signed the Treaty with the Dwamish, Suquamish, etc., 1855, for the United States, listed as governor and superintendent of Indian affairs.
  source: treaty-with-the-dwamish-suquamish-etc-1855
  where: 12 Stat. 930
- when: Jan. 26, 1855
  text: Signed the Treaty with the S'klallam, 1855, for the United States, listed as governor and superintendent of Indian affairs for the said Territory.
  source: treaty-with-the-sklallam-1855
  where: 12 Stat. 935
- when: Jan. 31, 1855
  text: Signed the Treaty with the Makah, 1855, for the United States, listed as governor and superintendent of Indian affairs.
  source: treaty-with-the-makah-1855
  where: 12 Stat. 941
- when: June 9, 1855
  text: Signed the Treaty with the Wallawalla, Cayuse, etc., 1855, for the United States, listed as governor and superintendent of Indian affairs for the Territory of Washington.
  source: treaty-with-the-wallawalla-cayuse-etc-1855
  where: 12 Stat. 949
- when: June 9, 1855
  text: Signed the Treaty with the Yakima, 1855, for the United States, listed as governor and superintendent of Indian affairs for the Territory of Washington.
  source: treaty-with-the-yakima-1855
  where: 12 Stat. 955
- when: June 11, 1855
  text: Signed the Treaty with the Nez Perces, 1855, for the United States, listed as governor and superintendent of Indian affairs.
  source: treaty-with-the-nez-perces-1855
  where: 12 Stat. 960
- when: July 1, 1855
  text: Signed the Treaty with the Quinaielt, etc., 1855, for the United States, listed as governor and superintendent of Indian affairs of the Territory of Washington and Governor and Sup’t of Indian Affairs.
  source: treaty-with-the-quinaielt-etc-1855
  where: 12 Stat. 973
- when: July 16, 1855
  text: Signed the Treaty with the Flatheads, etc., 1855, for the United States, listed as governor and superintendent of Indian affairs.
  source: treaty-with-the-flatheads-etc-1855
  where: 12 Stat. 978
- when: Oct. 17, 1855
  text: Signed the Treaty with the Blackfeet, 1855, for the United States, listed as commissioner.
  source: treaty-with-the-blackfeet-1855
  where: 11 Stat. 660
- when: '1857'
  text: Served as delegate to the U.S. House of Representatives from Washington Territory during the terms 1857–1861.
  source: biographical-directory-of-the-united-states-congress
  where: Bioguide ID S000881
