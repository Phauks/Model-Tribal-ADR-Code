key: isaac-i-stevens
name: Isaac I. Stevens
lead: Signed 10 treaties with Native nations for the United States, 1854–1855.
living: false
cases: []
events:
- when: Dec. 26, 1854
  text: Signed the Treaty with the Nisqualli, Puyallup, etc., 1854, for the United States, listed as Governor and Superintendent Territory of Washington.
  source: treaty-with-the-nisqualli-puyallup-etc-1854
  where: 10 Stat. 1134
- when: Jan. 22, 1855
  text: Signed the Treaty with the Dwamish, Suquamish, etc., 1855, for the United States, listed as Governor and Superintendent.
  source: treaty-with-the-dwamish-suquamish-etc-1855
  where: 12 Stat. 930
- when: Jan. 26, 1855
  text: Signed the Treaty with the S'klallam, 1855, for the United States, listed as governor and superintendent.
  source: treaty-with-the-sklallam-1855
  where: 12 Stat. 935
- when: Jan. 31, 1855
  text: Signed the Treaty with the Makah, 1855, for the United States, listed as governor and superintendent.
  source: treaty-with-the-makah-1855
  where: 12 Stat. 941
- when: June 9, 1855
  text: Signed the Treaty with the Wallawalla, Cayuse, etc., 1855, for the United States, listed as Governor and Superintendent Washington Territory.
  source: treaty-with-the-wallawalla-cayuse-etc-1855
  where: 12 Stat. 949
- when: June 9, 1855
  text: Signed the Treaty with the Yakima, 1855, for the United States, listed as Governor and Superintendent.
  source: treaty-with-the-yakima-1855
  where: 12 Stat. 955
- when: June 11, 1855
  text: Signed the Treaty with the Nez Perces, 1855, for the United States, listed as Governor and Superintendent Washington territory.
  source: treaty-with-the-nez-perces-1855
  where: 12 Stat. 960
- when: July 1, 1855
  text: Signed the Treaty with the Quinaielt, etc., 1855, for the United States, listed as Governor and Sup’t of Indian Affairs.
  source: treaty-with-the-quinaielt-etc-1855
  where: 12 Stat. 973
- when: July 16, 1855
  text: Signed the Treaty with the Flatheads, etc., 1855, for the United States, listed as Governor and Superintendent Indian Affairs W. T.
  source: treaty-with-the-flatheads-etc-1855
  where: 12 Stat. 978
- when: Oct. 17, 1855
  text: Signed the Treaty with the Blackfeet, 1855, for the United States.
  source: treaty-with-the-blackfeet-1855
  where: 11 Stat. 660
