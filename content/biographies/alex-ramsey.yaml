key: alex-ramsey
name: Alex. Ramsey
lead: Signed three treaties with Native nations for the United States, 1851–1863.
living: false
cases: []
events:
- when: July 23, 1851
  text: Signed the Treaty with the Sioux-Sisseton and Wahpeton Bands, 1851, for the United States.
  source: treaty-with-the-sioux-sisseton-and-wahpeton-bands-1851
  where: 10 Stat. 950
- when: Aug. 5, 1851
  text: Signed the Treaty with the Sioux-Mdewakanton and Wahpakoota Bands, 1851, for the United States.
  source: treaty-with-the-sioux-mdewakanton-and-wahpakoota-bands-1851
  where: 10 Stat. 956
- when: Oct. 2, 1863
  text: Signed the Treaty with the Chippewa-Red Lake and Pembina Bands, 1863, for the United States, listed as Commissioners.
  source: treaty-with-the-chippewa-red-lake-and-pembina-bands-1863
  where: 13 Stat. 669
checked: '2026-11-26'
