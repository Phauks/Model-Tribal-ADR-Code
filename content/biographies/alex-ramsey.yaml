key: alex-ramsey
name: Alex. Ramsey
lead: U.S. Representative from Pennsylvania and U.S. Senator from Minnesota. Named in the treaties as Governor and ex-officio superintendent of Indian affairs. Signed three treaties with Native nations for the United States, 1851–1863.
living: false
cases: []
events:
- when: '1843'
  text: Served in the U.S. House of Representatives for Pennsylvania during the terms 1843–1847.
  source: biographical-directory-of-the-united-states-congress
  where: Bioguide ID R000026
- when: July 23, 1851
  text: Signed the Treaty with the Sioux-Sisseton and Wahpeton Bands, 1851, for the United States, listed as commissioners duly appointed for that purpose and governor and ex-officio superintendent of Indian affairs in said Territory.
  source: treaty-with-the-sioux-sisseton-and-wahpeton-bands-1851
  where: 10 Stat. 950
- when: Aug. 5, 1851
  text: Signed the Treaty with the Sioux-Mdewakanton and Wahpakoota Bands, 1851, for the United States, listed as commissioner on the part of the United States and governor and ex-officio superintendent of Indian affairs.
  source: treaty-with-the-sioux-mdewakanton-and-wahpakoota-bands-1851
  where: 10 Stat. 956
- when: '1863'
  text: Served in the U.S. Senate for Minnesota during the terms 1863–1875.
  source: biographical-directory-of-the-united-states-congress
  where: Bioguide ID R000026
- when: Oct. 2, 1863
  text: Signed the Treaty with the Chippewa-Red Lake and Pembina Bands, 1863, for the United States, listed as commissioner.
  source: treaty-with-the-chippewa-red-lake-and-pembina-bands-1863
  where: 13 Stat. 669
checked: '2026-11-27'
