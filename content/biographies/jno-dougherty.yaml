key: jno-dougherty
name: Jno. Dougherty
lead: Named in the treaties as U. S. agt. for Indian Affairs and Agent of Indian Affairs. Signed two treaties with Native nations for the United States, 1836–1838.
living: false
cases: []
events:
- when: Oct. 15, 1836
  text: Signed the Treaty with the Oto, etc., 1836, for the United States, listed as U. S. agt. for Indian Affairs.
  source: treaty-with-the-oto-etc-1836
  where: 7 Stat. 526
- when: Oct. 19, 1838
  text: Signed the Treaty with the Iowa, 1838, for the United States, listed as Agent of Indian Affairs and Indian Agent.
  source: treaty-with-the-iowa-1838
  where: 7 Stat. 569
checked: '2026-11-27'
