key: arthur-st-clair
name: Arthur St. Clair
lead: Named in the treaties as Governor of the territory of the United States of America, north-west of the river Ohio. Signed two treaties with Native nations for the United States, 1789.
living: false
names:
- name: Ar. St. Clair
  note: as the Treaty with the Six Nations, 1789 prints it
  source: treaty-with-the-six-nations-1789
  where: 7 Stat. 34
cases: []
events:
- when: Jan. 9, 1789
  text: Signed the Treaty with the Six Nations, 1789, for the United States, listed as commissioner plenipotentiary of the said United States and governor of the territory of the United States of America, north-west of the river Ohio.
  source: treaty-with-the-six-nations-1789
  where: 7 Stat. 34
- when: Jan. 9, 1789
  text: Signed the Treaty with the Wyandot, etc., 1789, for the United States, listed as Commissioner Plenipotentiary of the United States of America and Governor of the Territory of the United States North- West of the River Ohio.
  source: treaty-with-the-wyandot-etc-1789
  where: 7 Stat. 31
checked: '2026-11-27'
