key: francis-huebschmann
name: Francis Huebschmann
lead: Named in the treaties as Superintendent of Indian affairs. Signed three treaties with Native nations for the United States, 1854–1856.
living: false
cases: []
events:
- when: May 12, 1854
  text: Signed the Treaty with the Menominee, 1854, for the United States, listed as superintendent of Indian affairs.
  source: treaty-with-the-menominee-1854
  where: 10 Stat. 1065
- when: Feb. 5, 1856
  text: Signed the Treaty with the Stockbridge and Munsee, 1856, for the United States, listed as Commissioner on the part of the United States.
  source: treaty-with-the-stockbridge-and-munsee-1856
  where: 11 Stat. 668
- when: Feb. 11, 1856
  text: Signed the Treaty with the Menominee, 1856, for the United States, listed as commissioner.
  source: treaty-with-the-menominee-1856
  where: 11 Stat. 680
checked: '2026-11-27'
