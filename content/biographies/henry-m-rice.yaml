key: henry-m-rice
name: Henry M. Rice
lead: Delegate to Congress from Minnesota Territory and U.S. Senator from Minnesota. Signed two treaties with Native nations for the United States, 1847.
living: false
cases: []
events:
- when: Aug. 2, 1847
  text: Signed the Treaty with the Chippewa of the Mississippi and Lake Superior, 1847, for the United States, listed as commissioner.
  source: treaty-with-the-chippewa-of-the-mississippi-and-lake-superior-1847
  where: 9 Stat. 905
- when: Aug. 21, 1847
  text: Signed the Treaty with the Pillager Band of Chippewa Indians, 1847, for the United States, listed as commissioner.
  source: treaty-with-the-pillager-band-of-chippewa-indians-1847
  where: 9 Stat. 909
- when: '1853'
  text: Served as delegate to the U.S. House of Representatives from Minnesota Territory during the terms 1853–1857.
  source: biographical-directory-of-the-united-states-congress
  where: Bioguide ID R000198
- when: '1858'
  text: Served in the U.S. Senate for Minnesota during the terms 1858–1863.
  source: biographical-directory-of-the-united-states-congress
  where: Bioguide ID R000198
checked: '2026-11-27'
