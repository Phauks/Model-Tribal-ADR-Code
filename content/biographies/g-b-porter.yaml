key: g-b-porter
name: G. B. Porter
lead: Signed three treaties with Native nations for the United States, 1832–1833.
living: false
cases: []
events:
- when: Oct. 27, 1832
  text: Signed the Treaty with the Menominee, 1832, for the United States, listed as Commissioner of the United States.
