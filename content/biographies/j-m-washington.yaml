name: J. M. Washington
lead: Named in the treaty as Governor of New Mexico, Lieutenant-colonel commanding the troops of the United States in New Mexico, and Brevet Lieutenant-Colonel Commanding. Signed the Treaty with the Navaho, 1849, for the United States.
