key: john-b-sanborn
name: John B. Sanborn
lead: Signed 10 treaties with Native nations for the United States, 1865–1868.
living: false
cases: []
events:
- when: Oct. 14, 1865
  text: Signed the Treaty with the Cheyenne and Arapaho, 1865, for the United States, listed as Commissioners on the part of the United States.
  source: treaty-with-the-cheyenne-and-arapaho-1865
  where: 14 Stat. 707
- when: Oct. 17, 1865
  text: Signed the Treaty with the Apache, Cheyenne, and Arapaho, 1865, for the United States, listed as Commissioners on the part of the United States.
  source: treaty-with-the-apache-cheyenne-and-arapaho-1865
  where: 14 Stat. 714
- when: Oct. 18, 1865
  text: Signed the Treaty with the Comanche and Kiowa, 1865, for the United States.
  source: treaty-with-the-comanche-and-kiowa-1865
  where: 14 Stat. 720
- when: Oct. 21, 1867
  text: Signed the Treaty with the Kiowa and Comanche, 1867, for the United States.
  source: treaty-with-the-kiowa-and-comanche-1867
  where: 15 Stat. 586
- when: Oct. 21, 1867
  text: Signed the Treaty with the Kiowa, Comanche, and Apache, 1867, for the United States.
  source: treaty-with-the-kiowa-comanche-and-apache-1867
  where: 15 Stat. 591
- when: Oct. 28, 1867
  text: Signed the Treaty with the Cheyenne and Arapaho, 1867, for the United States, listed as Commissioner.
  source: treaty-with-the-cheyenne-and-arapaho-1867
  where: 15 Stat. 598
- when: Apr. 29, 1868
  text: Signed the Treaty with the Sioux-Brule, Oglala, Miniconjou, Yanktonai, Hunkpapa, Blackfeet, Cuthead, Two Kettle, Sans Arcs, and Santee-and Arapaho, 1868, for the United States.
  source: treaty-with-the-sioux-and-arapaho-1868
  where: 15 Stat. 647
- when: May 7, 1868
  text: Signed the Treaty with the Crows, 1868, for the United States.
  source: treaty-with-the-crows-1868
  where: 15 Stat. 653
- when: May 10, 1868
  text: Signed the Treaty with the Northern Cheyenne and Northern Arapaho, 1868, for the United States, listed as Commissioners.
  source: treaty-with-the-northern-cheyenne-and-northern-arapaho-1868
  where: 15 Stat. 655
- when: July 3, 1868
  text: Signed the Treaty with the Eastern Band Shoshoni and Bannock, 1868, for the United States.
  source: treaty-with-the-eastern-band-shoshoni-and-bannock-1868
  where: 15 Stat. 673
