key: james-duane-doty
name: James Duane Doty
lead: Delegate to Congress from Wisconsin Territory and U.S. Representative from Wisconsin. Named in the treaties as Governor and acting superintendent of Indian affairs in Utah Territory. Signed four treaties with Native nations for the United States, 1863.
living: false
cases: []
events:
- when: '1837'
  text: Served as delegate to the U.S. House of Representatives from Wisconsin Territory during the terms 1837–1841.
  source: biographical-directory-of-the-united-states-congress
  where: Bioguide ID D000443
- when: '1849'
  text: Served in the U.S. House of Representatives for Wisconsin during the terms 1849–1853.
  source: biographical-directory-of-the-united-states-congress
  where: Bioguide ID D000443
- when: July 2, 1863
  text: Signed the Treaty with the Eastern Shoshoni, 1863, for the United States, listed as commissioner.
  source: treaty-with-the-eastern-shoshoni-1863
  where: 18 Stat. 685
- when: July 30, 1863
  text: Signed the Treaty with the Shoshoni-Northwestern Bands, 1863, for the United States, listed as commissioner and Governor and acting superintendent of Indian affairs in Utah Territory.
  source: treaty-with-the-shoshoni-northwestern-bands-1863
  where: 13 Stat. 665
- when: Oct. 1, 1863
  text: Signed the Treaty with the Western Shoshoni, 1863, for the United States, listed as commissioners.
  source: treaty-with-the-western-shoshoni-1863
  where: 18 Stat. 689
- when: Oct. 12, 1863
  text: Signed the Treaty with the Shoshoni-Goship, 1863, for the United States, listed as commissioner.
