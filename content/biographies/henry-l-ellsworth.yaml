key: henry-l-ellsworth
name: Henry L. Ellsworth
lead: Signed six treaties with Native nations for the United States, 1832–1833.
living: false
cases: []
events:
- when: Dec. 29, 1832
  text: Signed the Treaty with the Seneca and Shawnee, 1832, for the United States, listed as commissioner on behalf of the United States.
  source: treaty-with-the-seneca-and-shawnee-1832
  where: 7 Stat. 413
- when: Feb. 14, 1833
  text: Signed the Treaty with the Creeks, 1833, for the United States, listed as commissioner.
  source: treaty-with-the-creeks-1833
  where: 7 Stat. 420
- when: Feb. 14, 1833
  text: Signed the Treaty with the Western Cherokee, 1833, for the United States, listed as Commissioners on the part of the United States.
  source: treaty-with-the-western-cherokee-1833
  where: 7 Stat. 416
- when: Mar. 28, 1833
  text: Signed the Treaty with the Seminole, 1833, for the United States, listed as commissioner on behalf of the United States.
  source: treaty-with-the-seminole-1833
  where: 7 Stat. 424
- when: Sept. 21, 1833
  text: Signed the Treaty with the Oto and Missouri, 1833, for the United States, listed as commissioner.
  source: treaty-with-the-oto-and-missouri-1833
  where: 7 Stat. 431
- when: Oct. 9, 1833
  text: Signed the Treaty with the Pawnee, 1833, for the United States, listed as commissioner.
  source: treaty-with-the-pawnee-1833
  where: 7 Stat. 450
checked: '2026-11-27'
