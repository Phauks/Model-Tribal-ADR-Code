key: henry-r-schoolcraft
name: Henry R. Schoolcraft
lead: Named in the treaties as Acting superintendent of Indian affairs. Signed five treaties with Native nations for the United States, 1836–1838.
living: false
cases: []
events:
- when: Mar. 28, 1836
  text: Signed the Treaty with the Ottawa, etc., 1836, for the United States, listed as commissioner.
  source: treaty-with-the-ottawa-etc-1836
  where: 7 Stat. 495
- when: May 9, 1836
  text: Signed the Treaty with the Chippewa, 1836, for the United States, listed as commissioner on the part of the United States.
  source: treaty-with-the-chippewa-1836
  where: 7 Stat. 504
- when: Jan. 14, 1837
  text: Signed the Treaty with the Chippewa, 1837, for the United States, listed as commissioner.
  source: treaty-with-the-chippewa-1837-jan-14
  where: 7 Stat. 531
- when: Dec. 20, 1837
  text: Signed the Treaty with the Chippewa, 1837, for the United States, listed as commissioner and acting superintendent of Indian affairs.
  source: treaty-with-the-chippewa-1837-dec-20
  where: 7 Stat. 547
- when: Jan. 23, 1838
  text: Signed the Treaty with the Chippewa, 1838, for the United States, listed as commissioner on the part of the United States and Superintendent of Indian Affairs.
  source: treaty-with-the-chippewa-1838
  where: 7 Stat. 566
checked: '2026-11-27'
