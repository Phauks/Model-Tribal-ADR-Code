key: henry-dodge
name: Henry Dodge
lead: Delegate to Congress from Wisconsin Territory and U.S. Senator from Wisconsin. Named in the treaties as Superintendent of Indian Affairs. Signed four treaties with Native nations for the United States, 1836–1837.
living: false
names:
- name: H. Dodge
  note: as the Treaty with the Menominee, 1836 prints it
  source: treaty-with-the-menominee-1836
  where: 7 Stat. 508
cases: []
events:
- when: Sept. 3, 1836
  text: Signed the Treaty with the Menominee, 1836, for the United States, listed as commissioner.
  source: treaty-with-the-menominee-1836
  where: 7 Stat. 508
- when: Sept. 27, 1836
  text: Signed the Treaty with the Sauk and Fox Tribe, 1836, for the United States, listed as Superintendent of Indian Affairs.
  source: treaty-with-the-sauk-and-fox-tribe-1836
  where: 7 Stat. 517
- when: Sept. 28, 1836
  text: Signed the Treaty with the Sauk and Foxes, 1836, for the United States, listed as commissioner on the part of the United States.
  source: treaty-with-the-sauk-and-foxes-1836-sept-28-7-stat-517
  where: 7 Stat. 519
- when: July 29, 1837
  text: Signed the Treaty with the Chippewa, 1837, for the United States, listed as commissioner and Governor of said Territory.
  source: treaty-with-the-chippewa-1837-july-29
  where: 7 Stat. 537
- when: '1841'
  text: Served as delegate to the U.S. House of Representatives from Wisconsin Territory during the terms 1841–1845.
  source: biographical-directory-of-the-united-states-congress
  where: Bioguide ID D000396
- when: '1848'
  text: Served in the U.S. Senate for Wisconsin during the terms 1848–1857.
  source: biographical-directory-of-the-united-states-congress
  where: Bioguide ID D000396
checked: '2026-11-27'
