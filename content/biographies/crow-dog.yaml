key: crow-dog
name: Crow Dog
lead: Petitioner in Ex parte Crow Dog (1883), which held that a federal territorial court had no jurisdiction to try him for killing Spotted Tail.
living: false
names:
- name: Kan-gi-shun-ca
  note: as the Supreme Court Reporter prints it
  source: ex-parte-crow-dog
  where: 3 S. Ct. 396 (caption)
nations:
- nation: rosebud-sioux-tribe-of-the-rosebud-indian-reservation
  named_as: Brule Sioux band of the Sioux nation
  source: ex-parte-crow-dog
  where: 109 U.S. at 557
  note: The Brulé people are today the Rosebud Sioux Tribe; the Lower Brule Sioux Tribe is also Brulé.
cases:
- case: ex-parte-crow-dog
  role: Petitioner
  result: Conviction and sentence held void; writs of habeas corpus and certiorari issued.
  where: 109 U.S. at 572
events:
- when: Before Dec. 1883
  text: Convicted by the First Judicial District Court of Dakota of the murder of Spotted Tail and sentenced to death, the sentence to be carried out on January 14, 1884; the Supreme Court of the Territory affirmed.
  source: ex-parte-crow-dog
  where: 109 U.S. at 557
- when: Nov. 26, 1883
  text: His petition for writs of habeas corpus and certiorari argued in the Supreme Court of the United States, by A. J. Plowman for him.
  source: ex-parte-crow-dog
  where: 109 U.S. at 556–57
- when: Dec. 17, 1883
  text: The Supreme Court held that the territorial court had no jurisdiction to try him, that the conviction and sentence were void and that his imprisonment was illegal.
  source: ex-parte-crow-dog
  where: 109 U.S. at 572
