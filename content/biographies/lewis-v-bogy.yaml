key: lewis-v-bogy
name: Lewis V. Bogy
lead: U.S. Senator from Missouri. Named in the treaties as Commissioner of Indian Affairs. Signed five treaties with Native nations for the United States, 1867.
living: false
cases: []
events:
- when: Feb. 18, 1867
  text: Signed the Treaty with the Sauk and Foxes, 1867, for the United States, listed as Commissioner of Indian Affairs.
  source: treaty-with-the-sauk-and-foxes-1867
  where: 15 Stat. 499
- when: Feb. 19, 1867
  text: Signed the Treaty with the Sioux-Sisseton and Wahpeton Bands, 1867, for the United States, listed as commissioners on the part of the United States and Commissioner of Indian Affairs.
  source: treaty-with-the-sioux-sisseton-and-wahpeton-bands-1867
  where: 15 Stat. 508
- when: Feb. 23, 1867
  text: Signed the Treaty with the Seneca, Mixed Seneca and Shawnee, Quapaw, etc., 1867, for the United States, listed as Commissioner of Indian Affairs.
  source: treaty-with-the-seneca-mixed-seneca-and-shawnee-quapaw-etc-1867
  where: 15 Stat. 523
- when: Feb. 27, 1867
  text: Signed the Treaty with the Potawatomi, 1867, for the United States, listed as Commissioner of Indian Affairs.
  source: treaty-with-the-potawatomi-1867
  where: 15 Stat. 534
- when: Mar. 19, 1867
  text: Signed the Treaty with the Chippewa of the Mississippi, 1867, for the United States, listed as special commissioner.
  source: treaty-with-the-chippewa-of-the-mississippi-1867
  where: 16 Stat. 721
- when: '1873'
  text: Served in the U.S. Senate for Missouri during the terms 1873–1877.
  source: biographical-directory-of-the-united-states-congress
  where: Bioguide ID B000595
checked: '2026-11-27'
