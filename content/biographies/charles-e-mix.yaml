key: charles-e-mix
name: Charles E. Mix
lead: Signed six treaties with Native nations for the United States, 1857–1859.
living: false
cases: []
events:
- when: Nov. 5, 1857
  text: Signed the Treaty with the Seneca, Tonawanda Band, 1857, for the United States, listed as commissioner on behalf of the United States.
  source: treaty-with-the-seneca-tonawanda-band-1857
  where: 11 Stat. 737
- when: Mar. 12, 1858
  text: Signed the Treaty with the Ponca, 1858, for the United States, listed as commissioner.
  source: treaty-with-the-ponca-1858
  where: 12 Stat. 1000
- when: Apr. 19, 1858
  text: Signed the Treaty with the Yankton Sioux, 1858, for the United States, listed as commissioner on the part of the United States.
  source: treaty-with-the-yankton-sioux-1858
  where: 11 Stat. 748
- when: June 19, 1858
  text: Signed the Treaty with the Sioux, 1858, for the United States, listed as commissioner on the part of the United States.
  source: treaty-with-the-sioux-1858-june-19-12-stat-1031
  where: 12 Stat. 1035
- when: June 19, 1858
  text: Signed the Treaty with the Sioux, 1858, for the United States, listed as commissioner on the part of the United States.
  source: treaty-with-the-sioux-1858-june-19-12-stat-1037
  where: 12 Stat. 1040
- when: Apr. 15, 1859
  text: Signed the Treaty with the Winnebago, 1859, for the United States, listed as commissioner on the part of the United States.
  source: treaty-with-the-winnebago-1859
  where: 12 Stat. 1103
