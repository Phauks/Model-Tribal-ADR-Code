key: james-s-calhoun
name: James S. Calhoun
lead: Named in the treaties as Indian agent. Signed two treaties with Native nations for the United States, 1849.
living: false
cases: []
events:
- when: Sept. 9, 1849
  text: Signed the Treaty with the Navaho, 1849, for the United States, listed as Indian agent.
  source: treaty-with-the-navaho-1849
  where: 9 Stat. 975
- when: Dec. 30, 1849
  text: Signed the Treaty with the Utah, 1849, for the United States, listed as commissioner and Indian agent.
  source: treaty-with-the-utah-1849
  where: 9 Stat. 985
