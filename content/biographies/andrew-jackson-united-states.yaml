key: andrew-jackson-united-states
name: Andrew Jackson
lead: Delegate to Congress from Tennessee Territory and U.S. Senator from Tennessee. Named in the treaties as Major general commanding Seventh Military District and Major General in the Army of the United States. Signed six treaties with Native nations for the United States, 1814–1820.
living: false
cases: []
events:
- when: '1795'
  text: Served as delegate to the U.S. House of Representatives from Tennessee Territory during the terms 1795–1797.
  source: biographical-directory-of-the-united-states-congress
  where: Bioguide ID J000005
- when: '1797'
  text: Served in the U.S. Senate for Tennessee during the term 1797–1799.
  source: biographical-directory-of-the-united-states-congress
  where: Bioguide ID J000005
- when: Aug. 9, 1814
  text: Signed the Treaty with the Creeks, 1814, for the United States, listed as major general and major general commanding Seventh Military District.
  source: treaty-with-the-creeks-1814
  where: 7 Stat. 122
- when: Sept. 14, 1816
  text: Signed the Treaty with the Cherokee, 1816, for the United States, listed as commissioner plenipotentiary and major general.
  source: treaty-with-the-cherokee-1816-sept-14
  where: 7 Stat. 149
- when: Sept. 20, 1816
  text: Signed the Treaty with the Chickasaw, 1816, for the United States, listed as commissioner and major general.
  source: treaty-with-the-chickasaw-1816
  where: 7 Stat. 152
- when: July 8, 1817
  text: Signed the Treaty with the Cherokee, 1817, for the United States, listed as commissioner plenipotentiary and major general.
  source: treaty-with-the-cherokee-1817
  where: 7 Stat. 160
- when: Oct. 19, 1818
  text: Signed the Treaty with the Chickasaw, 1818, for the United States, listed as commissioner.
  source: treaty-with-the-chickasaw-1818
  where: 7 Stat. 195
- when: Oct. 18, 1820
  text: Signed the Treaty with the Choctaw, 1820, for the United States, listed as commissioner plenipotentiary and Major General in the Army of the United States.
  source: treaty-with-the-choctaw-1820
  where: 7 Stat. 210
- when: '1823'
  text: Served in the U.S. Senate for Tennessee during the term 1823–1825.
  source: biographical-directory-of-the-united-states-congress
  where: Bioguide ID J000005
