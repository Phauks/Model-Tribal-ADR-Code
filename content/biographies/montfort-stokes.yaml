key: montfort-stokes
name: Montfort Stokes
lead: U.S. Senator from North Carolina. Named in the treaties as Commissioner of Indian treaties. Signed four treaties with Native nations for the United States, 1833–1837.
living: false
names:
- name: M. Stokes
  note: as the Treaty with the Kiowa, etc., 1837 prints it
  source: treaty-with-the-kiowa-etc-1837
  where: 7 Stat. 535
cases: []
events:
- when: '1816'
  text: Served in the U.S. Senate for North Carolina during the terms 1816–1823.
  source: biographical-directory-of-the-united-states-congress
  where: Bioguide ID S000949
- when: Feb. 14, 1833
  text: Signed the Treaty with the Creeks, 1833, for the United States, listed as commissioner.
  source: treaty-with-the-creeks-1833
  where: 7 Stat. 420
- when: Feb. 14, 1833
  text: Signed the Treaty with the Western Cherokee, 1833, for the United States, listed as Commissioners on the part of the United States.
  source: treaty-with-the-western-cherokee-1833
  where: 7 Stat. 416
- when: Mar. 28, 1833
  text: Signed the Treaty with the Seminole, 1833, for the United States, listed as commissioner on behalf of the United States.
  source: treaty-with-the-seminole-1833
  where: 7 Stat. 424
- when: May 26, 1837
  text: Signed the Treaty with the Kiowa, etc., 1837, for the United States, listed as commissioner and commissioner of Indian treaties.
  source: treaty-with-the-kiowa-etc-1837
  where: 7 Stat. 535
