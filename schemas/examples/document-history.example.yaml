# Example document history using the fictitious nation from tribe.example.yaml,
# to show structure only. Every version cites the source record of its own text;
# that source names the version back in its document_version field.
id: example-nation-constitution
kind: constitution
title: Constitution of the Example Nation of Examplestate
nations: [example-nation]
jurisdictions:
  - level: tribal
    tribe: example-nation
summary: >-
  The nation's constitution as adopted in 1936, revised in full in 1985 and
  amended in 2010. The 2010 amendment added a peacemaking court beside the
  Tribal court.
versions:
