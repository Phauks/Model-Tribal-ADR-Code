    source: example-nation-constitution-amendment-2010
    confidence: high
    verification: read-in-full
    clauses:
      - topic: peacemaking
        locator: Article IX, section 4 (added)
        summary: Creates a peacemaking court that hears cases the parties agree to bring to it.
        methods: [peacemaking]
        verification: read-in-full
        reviewer: project author
    changes:
      - topic: judicial-power
        compared_with: 1985-revision
        change: unchanged
        summary: Sections 1-3 of Article IX are not amended.
        verification: read-in-full
      - topic: peacemaking
        compared_with: 1985-revision
        change: added
        summary: Adds a peacemaking court beside the Tribal court.
        locator_after: Article IX, section 4
        verification: read-in-full
